<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

  <!-- MASTHEAD -->
  <div class="mast-vol">

const DATA = {"date": "2026-06-23", "intro_en": "Today's news is dominated by two major themes: the 2026 FIFA World Cup in the US, with Brazil eyeing its knockout-stage path and Messi breaking the all-time World Cup scoring record, and a political shift in Latin America as Colombia's right-wing candidate Abelardo de la Espriella claims a narrow election victory. In Brazil, domestic stories include a Supreme Court ruling on social media regulation, a Banco Master scandal touching the Chamber of Deputies, and a record-breaking intercontinental robotic surgery.", "intro_pt": "As notícias do dia são dominadas por dois grandes temas: a Copa do Mundo de 2026, com o Brasil projetando seu caminho nas oitavas e Messi quebrando o recorde histórico de artilharia em Copas, e a virada política na América Latina com a vitória do direitista Abelardo de la Espriella na Colômbia. No Brasil, destaque para a decisão do STF sobre redes sociais, o escândalo do Banco Master envolvendo o presidente da Câmara e um recorde mundial em telecirurgia robótica.", "weather": {"location": "Curitiba, PR", "description": "Moderate drizzle", "temp_max": 16.4, "temp_min": 9.5, "precipitation_mm": 1.2, "wind_max_kmh": 13.5, "wmo_code": 53}, "articles": [{"title": "Quem o Brasil pode enfrentar no mata-mata da Copa do Mundo? Os cenários de cada resultado", "summary": "Holanda, Japão e Suécia despontam como os principais candidatos a cruzar o caminho da equipe comandada por Carlo Ancelotti na próxima fase.", "url": "https://www.bbc.co.uk/portuguese/articles/cdej354kxzwo?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.co.uk", "published_at": "2026-06-23T01:03:24+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/422e/live/30f3fae0-6e9e-11f1-8546-8f19e4fe30f4.jpg", "url_hash": "86822121e2001ac1049fdae91eff9aff", "title_hash": "91821179cbba2140129a3674e52c0dcc", "corroboration": 2, "relevance_score": 0.2041, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.557, "headline_en": "Who Could Brazil Face in the World Cup Knockout Round?", "headline_pt": "Quem o Brasil pode enfrentar nas oitavas da Copa do Mundo?", "one_liner_en": "Netherlands, Japan, and Sweden are the likeliest opponents for Ancelotti's Brazil in the knockout stage.", "one_liner_pt": "Holanda, Japão e Suécia despontam como possíveis adversários do Brasil nas oitavas de final.", "category": "Other", "region": "brazil", "rationale": "Brazil is a top contender at the 2026 World Cup and fans are closely tracking potential knockout matchups.", "low_signal": false}, {"title": "Quem o Brasil pode enfrentar no mata-mata da Copa do Mundo? Os cenários de cada resultado", "summary": "<img src=\"https://s2-g1.glbimg.com/QNWRpSPTXpuHtrMhuXD3OhXGcEM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/h/W/AzUFE0TEeAFX324hyF6Q/30f3fae0-6e9e-11f1-8546-8f19e4fe30f4.jpg.webp\" /><br />     Quem o Brasil pode enfrentar no mata-mata da Copa do Mundo? Os cenários de cada resultado\nGetty Images\nDependendo apenas de si mesmo para avançar para a segunda fase — ou fase de 16 avos — na Copa do Mundo 2026, a Seleção brasileira já começa a projetar os possíveis adversários no mata-mata.\nEmbora os confrontos ainda dependam dos resultados da última rodada, Holanda, Japão e Suécia despontam como os principais candidatos a cruzar o caminho da equipe comandada por Carlo Ancelotti na próxima fase.\nAs partidas serão definidas a partir da classificação final dos grupos C e F. Pelo Grupo C, Brasil x Escócia e Marrocos x Haiti se enfrentam na quarta-feira (24/6), enquanto a definição do Grupo F acontece na quinta-feira (25/6), com Holanda x Tunísia e Japão x Suécia.\nAtualmente, a Seleção brasileira lidera o grupo C com quatro pontos e saldo de três gols. Marrocos também soma quatro pontos, mas aparece na segunda posição por ter um gol de saldo. A Escócia tem três pontos e também segue na briga pela classificação.\nNo Grupo F, Holanda e Japão aparecem com quatro pontos, com a seleção holandesa em primeiro por ter feito mais gols, enquanto a Suécia aparece logo atrás, somando três pontos. \nTanto Haiti quanto Tunísia jogarão para \"cumprir tabela\", já sem chances de classificação. \nCaso o Brasil não termine nem em primeiro ou segundo lugar, há possibilidade de se classificar em terceiro. O cenário ocorrerá caso a seleção brasileira seja derrotada pela Escócia e Marrocos some pontos contra o Haiti. \nNeste caso, a classificação ao mata-mata dependeria da comparação com os demais terceiros colocados, já que a Copa de 2026 vai classificar os oito melhores terceiros colocados para a fase seguinte.\nConfira os possíveis cenários e adversários do Brasil na próxima fase.\nCenário 1-  O Brasil termina em primeiro no grupo C\nJapão empatou jogo de estreia contra a Holanda e venceu a Tunísia por 2-0. Está em segundo lugar no grupo F\nGetty Images\nCaso confirme a liderança do Grupo C, o Brasil enfrentará o segundo colocado do Grupo F na próxima fase.\nNeste momento, a posição é ocupada pelo Japão, mas a definição segue em aberto e dependerá diretamente dos resultados da rodada final. \nUma vitória japonesa sobre a Suécia, por exemplo, pode até levar a seleção asiática à liderança da chave, a depender também do desempenho da Holanda diante da Tunísia. Já os suecos ainda mantêm chances de classificação entre os dois primeiros, desde que consigam vencer no confronto direto.\nAlém da pontuação, o saldo de gols deve ter papel decisivo na definição das posições finais do grupo, especialmente em um cenário de disputa equilibrada.\nBrasil x Holanda\nA Holanda terminaria na segunda colocação — e, consequentemente, como adversária do Brasil — caso seja ultrapassada por apenas uma equipe. Isso pode acontecer se ela perder e o Japão ganhar, ou se ela empatar e os japoneses ganharem. \nO segundo lugar também seria possível para a Holanda se ela empatar e a Suécia vencer na última rodada.  Agora, se tanto a Holanda quanto Japão forem derrotados, o segundo lugar será definido nos critérios de desempate.\nBrasil x Japão \nO Japão, por sua vez, ficará com a segunda posição se empatar ou vencer a Suécia e permanecer atrás da Holanda na classificação. Para isso, os holandeses não poderiam ser derrotados.\nBrasil x Suécia\nJá a Suécia precisaria vencer o Japão e, além disso, ver a Holanda vencer a Tunísia para ficar em segundo no grupo e enfrentar o Brasil. A Suécia também poderia empatar, mas precisaria que a Holanda perdesse o jogo e a superasse em saldo de gols. \nIndependentemente do adversário, com o Brasil em primeiro lugar, o jogo da segunda fase aconteceria na segunda-feira (29/6), às 14h. \nCenário 2- O Brasil termina em segundo no grupo C\nHolanda está em primeiro lugar do grupo F e enfrentará a Tunísia na última rodada da fase de grupos\nGetty Images\nSe avançar como vice-líder do Grupo C, a Seleção brasileira terá pela frente o primeiro colocado do Grupo F.\nNo momento, a Holanda ocupa a liderança devido ao critério de desempate e, caso confirme a posição ao fim da terceira rodada, enfrentaria o Brasil na próxima fase. Um eventual duelo entre as duas seleções reeditaria a partida pela disputa do terceiro lugar da Copa do Mundo de 2014, vencida pelos holandeses por 3 a 0.\nBrasil x Holanda\nPara a Holanda terminar como adversária do Brasil, ela só precisaria vencer a Tunísia na próxima rodada e torcer para que o Japão, caso vença, não a ultrapasse em saldo ou número de gols marcados.\nOs holandeses também poderiam garantir a liderança com um empate, desde que Japão e Suécia também empatem — com a definição do primeiro lugar dependendo dos critérios de desempate.\nBrasil x Japão\nJá para um confronto entre Brasil e Japão, os japoneses não poderiam ser derrotados pela Suécia. Uma vitória ou até mesmo um empate garante o primeiro lugar do grupo F à seleção asiática, desde que a Holanda perca ou empate também — nesse último caso, o primeiro lugar também seria decidido nos critérios de desempate. \nBrasil x Suécia\nPor fim, um duelo entre Brasil e Suécia só aconteceria no mata-mata se a seleção sueca vencer o Japão e a Holanda tropeçar (seja com derrota ou empate). Nesse cenário, os suecos chegariam à liderança do grupo e ficariam com a vaga para enfrentar a seleção brasileira.\nIndependentemente do adversário, se o Brasil se classifica em segundo lugar do grupo C, o jogo da segunda fase também acontece na segunda-feira (29/6), mas às 22h. \nSuécia venceu apenas uma jogo na fase de grupos, mas pode se classificar caso derrote o Japão na próxima rodada\nGetty Images\nCenário 3- O Brasil termina em terceiro no grupo C\nSe o Brasil terminar em terceiro lugar, precisará estar entre os oito melhores terceiros colocados da Copa do Mundo para avançar de fase. Essa é uma regra nova desta edição.\nNesse caso, o adversário pode vir de três grupos diferentes, já que o cruzamento na fase eliminatória depende da campanha entre os terceiros colocados.\nO rival do Brasil seria definido de acordo com o chaveamento estabelecido pela Fifa para o mata-mata, podendo enfrentar um dos líderes dos grupos A, E ou I.\nNesse cenário, os possíveis adversários incluem Alemanha, líder do Grupo E, México ou Coreia do Sul, que brigam pelo primeiro lugar no Grupo A, e França ou Noruega, que disputam a liderança do Grupo I.\nAgora no g1\nRetrospecto\nPelo retrospecto, o adversário que pode dar mais trabalho para o Brasil na segunda fase é a Holanda. As duas seleções já se enfrentaram 12 vezes e o resultado foi igual: quatro vitórias para os holandeses, quatro vitórias para os brasileiros e quatro empates. \nAlém disso, é a seleção do grupo F mais bem posicionada no ranking da Fifa. \nJá a Suécia fez a campanha mais fraca para garantir a vaga na Copa do Mundo e tem um histórico negativo contra o Brasil, tendo vencido os brasileiros pela última vez em 1989. \nO Japão, por sua vez, tem uma única vitória contra os brasileiros, mas ela é recente: em um amistoso em outubro do ano passado.\nHolanda\nÚltimo confronto entre Brasil e Holanda foi em 2014, quando as equipes disputaram o terceiro lugar da Copa do Mundo e os holandeses venceram por 3-0\nGetty Images\nA Holanda é atualmente a equipe com a maior sequência invicta de jogos na história da Copa do Mundo. São 14 partidas no Mundial sem perder. \nApós empatar com o Japão em 2-2 e vencer a Suécia por 5 a 1, na segunda rodada, a equipe de Ronald Koeman superou o recorde que pertencia à seleção brasileira.\nA seleção holandesa aparece em 7° lugar no ranking da Fifa, enquanto o Brasil está em 5°.\nAs equipes já se enfrentaram 12 vezes, cinco delas em Copas do Mundo. No total, foram quatro vitórias para o Brasil, quatro empates e quatro derrotas. \nO último confronto foi na Copa de 2014, quando a Holanda garantiu o terceiro lugar no Mundial ao derrotar o Brasil por 3-0.\nCom um elenco repleto de jogadores da Premier League, o capitão do Liverpool, Virgil van Dijk, é considerado peça fundamental para as chances da Holanda. Além dele, está o artilheiro da seleção, Memphis Depay, que atualmente joga no Corinthians.\nNos últimos anos, as tradicionais virtudes ofensivas do futebol holandês, como a criatividade e a presença de um centroavante decisivo, perderam força. \nEm contrapartida, a equipe passou a se apoiar mais em uma defesa sólida e cheia de opções, o que dá segurança para um meio-campo tecnicamente qualificado trabalhar.\nBRASIL X HOLANDA: \n– 4 vitórias do Brasil (Copa do Mundo de 1994 e Copa do Mundo de 1998)\n– 4 empates\n– 4 derrotas (3 em Copas: 1974, 2010 e 2014)\nJapão\nBrasil perdeu apenas uma vez para o Japão, em outubro do ano passado durante um amistoso\nGetty Imagens\nDepois de iniciar o campeonato com um empate de 2-2 contra a Holanda, o Japão venceu a Tunísia por 4-0 na segunda-rodada e agora aguarda o último jogo contra a Suécia.\nO Japão aparece em 16° lugar no ranking da Fifa. As seleções brasileira e japonesa já se enfrentaram 13 vezes, e em apenas em uma delas o Brasil perdeu — em um amistoso em outubro do ano passado, por 3-2.\nEm duelos na Copa do Mundo, contudo, os times se enfrentaram uma única vez, na Copa de 2006, na Alemanha, quando faziam parte do mesmo grupo. O Brasil venceu o Japão por 4-1 e se classificou em primeiro lugar.\nOs japoneses garantiram vaga nesta Copa do Mundo fazendo uma das melhores campanhas de sua história nas Eliminatórias Asiáticas. Ao todo, foram 13 vitórias, dois empates e uma derrota. \nA equipe comandada por Hajime Moriyasu — o primeiro técnico a liderar a seleção japonesa em Copas do Mundo consecutivas  — se mostra confortável com e sem a posse de bola, tendo derrotado tanto a Inglaterra quanto o Brasil em amistosos com apenas 30% de posse.\nMuitos apontam que a principal qualidade do time é o forte espírito coletivo, enraizado na cultura japonesa.\nO atacante Ayase Ueda, de 27 anos, é o principal destaques do time. Ele foi o artilheiro disparado da Eredivisie, principal liga da Holanda nesta temporada e marcou o gol da vitória inédita sobre o Brasil, em outubro.\nBRASIL X JAPÃO: \n– 11 vitórias do Brasil (1 na Copa de 2006)\n– 2 empates \n– 1 derrota \nSuécia\nO Brasil venceu a Suécia na semifinal da Copa do Mundo de 1994, com gol de Romário\nGetty Images\nEntre as três seleções do grupo F que o Brasil pode enfrentar na próxima fase, a Suécia é que está mais longe no ranking da Fifa, atualmente em 36° lugar. \nA equipe sueca ficou fora de três das últimas quatro Copas do Mundo, mas alcançou as quartas de final na edição de 2018.\nPara a Copa do Mundo de 2026, a Suécia fez uma campanha desastrosa nas eliminatórias — não venceu nenhuma partida — e quase não se classificou. A vaga foi garantida contra a Polônia em uma repescagem.\nA Suécia estreou neste mundial com uma goleada de 5-1 sobre a Tunísia, mas sofreu um revés no segundo jogo contra a Holanda, quando perdeu pelo mesmo placar: 5-1.\nA equipe comanda por Graham Potter conta com atacantes de alto nível como Gyökeres e Isak, mas ainda não tem um goleiro titular definido e carece de profundidade fora do time principal.\nBrasil e Suécia já se enfrentaram 15 vezes, uma delas na final da Copa do Mundo de 1958, quando o Brasil conquistou seu primeiro título.\nNo histórico geral de confrontos, a seleção brasileira obteve 10 vitórias e empatou três vezes. A Suécia só venceu duas vezes, sendo a última em um amistoso em 1989.\nOs suecos nunca venceram os brasileiros em uma Copa do Mundo, apesar das equipes terem se enfrentado sete vezes. \nBRASIL X SUÉCIA:\n– 10 vitórias do Brasil (5 em Copas: 1938, 1950, 1958, 1990 e1994)\n– 3 empates (2 em Copas: 1978 e 1994)\n– 2 derrotas\nAcompanhe a Copa do Mundo 2026 no ge:\nSimulador da Copa do Mundo 2026\nCalendário da Copa do Mundo 2026: veja datas e horários de todos os jogos\nRESULTADOS: confira a tabela da Copa do Mundo", "url": "https://g1.globo.com/mundo/noticia/2026/06/23/quem-o-brasil-pode-enfrentar-no-mata-mata-da-copa-do-mundo-os-cenarios-de-cada-resultado.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-23T12:38:10+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/QNWRpSPTXpuHtrMhuXD3OhXGcEM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/h/W/AzUFE0TEeAFX324hyF6Q/30f3fae0-6e9e-11f1-8546-8f19e4fe30f4.jpg.webp", "url_hash": "8012723cd3128864d37e3b976089c876", "title_hash": "91821179cbba2140129a3674e52c0dcc", "corroboration": 2, "relevance_score": 0.0901, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5001, "headline_en": "Who Could Brazil Face in the World Cup Knockout Round?", "headline_pt": "Quem o Brasil pode enfrentar nas oitavas da Copa do Mundo?", "one_liner_en": "Brazil controls its own fate to advance, with Netherlands, Japan, or Sweden as probable next opponents.", "one_liner_pt": "Brasil depende apenas de si para avançar, podendo enfrentar Holanda, Japão ou Suécia.", "category": "Other", "region": "brazil", "rationale": "Near-duplicate of index 0 from a different source, provid let lang = 'en';
function t(key) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS['en'][key] || key; }

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

function renderMasthead() {
  const iso = DATA.date || new Date().toISOString().slice(0,10);
  const year = new Date(iso + 'T12:00:00').getFullYear();
  const vol  = toRoman(year - 1900);
  const doy  = dayOfYear(iso);
  document.getElementById('j-vol').textContent  = 'Vol. ' + vol + ' · No. ' + doy;
  document.getElementById('j-date').textContent = fmtDate(iso);
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const xs = [22,50,80,115,148,180,215,248,35,95,162,228];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    xs.forEach((x,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + x + 'px;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const xs  = [16,34,54,76,98,118,142,164,188,212,238,262];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    xs.forEach((x,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + x + 'px;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

// ── Briefing ─────────────────────────────────────────────────────────
function renderBriefing() {
  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round((art.relevance_score || 0) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +

      '</div>' +

  });

function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
