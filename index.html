<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>

    <span class="mast-rule mast-rule-r"><span class="mast-rule-gem">&#9670;</span><span class="mast-rule-line"></span></span>

    <span>Curitiba, Paran&aacute;</span>

score": 0.589, "headline_en": "Milei to Attend Flávio Bolsonaro's Presidential Candidacy Launch in São Paulo", "headline_pt": "Milei participará do lançamento da candidatura de Flávio Bolsonaro em São Paulo", "one_liner_en": "Argentine president joins Flávio Bolsonaro's campaign launch as part of a broader Latin America tour.", "one_liner_pt": "Presidente argentino participa do lançamento da candidatura de Flávio Bolsonaro em turnê pela América Latina.", "category": "Geopolitics", "region": "brazil", "rationale": "Milei's public endorsement of a Brazilian presidential candidate signals deepening right-wing alignment across Latin America ahead of the 2026 elections.", "low_signal": false}, {"title": "O que Javier Milei vem fazer no lançamento da candidatura de Flávio Bolsonaro a presidente", "summary": "<img src=\"https://s2-g1.glbimg.com/JOatT7uwIx04pzmKXlb-XqXusKQ=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/Q/K/aHK6ZASDAk39JtqVQWzA/2026-07-16t232504z-1644221911-rc2afmaoq98n-rtrmadp-3-argentina-politics-milei.jpg\" /><br />     Com a popularidade baixa em seu país, presidente argentino faz turnê pela América Latina\nMATIAS MARTIN CAMPAYA/EPA/SHUTTERSTOCK\nSem nenhuma aliança política consolidada, o senador Flávio Bolsonaro (PL) oficializa neste sábado (25) sua candidatura à Presidência em um evento que promete contar com a presença de Javier Milei.\nA vinda do presidente argentino ao Brasil ocorre em meio à sua baixa popularidade, catapultada por um escândalo recente de corrupção em seu governo e pelas dificuldades econômicas vividas em seu país.\nAs agendas de Flávio Bolsonaro e do governador de São Paulo, Tarcísio de Freitas (Republicanos), pré-candidato à reeleição, apontam a participação do presidente argentino em ao menos duas atividades no sábado em São Paulo.\nNo Palácio dos Bandeirantes, com Tarcísio, Milei receberá a Ordem do Ipiranga, a mais alta honraria concedida pelo Estado de São Paulo. Depois, deve seguir em direção ao Pacaembu, onde participa da convenção do PL que oficializa a candidatura de Flávio. \nAgora no g1\nA presença de Tarcísio está confirmada no evento do PL, ainda que seu partido não tenha se definido sobre apoiá-lo ou não.\nEm um momento em que o partido de Flávio é tido como isolado politicamente, sem uma chapa nem apoios partidários definidos, a figura de Milei dá musculatura para a base ideológica da campanha do filho mais velho do presidente.  \nMas a atração internacional não deve converter votos, afirma Regiane Bressan, professora de Relações Internacionais da Universidade Federal de São Paulo (Unifesp), especializada em América Latina.\n\"Eu não sei se o Milei vai, de fato, gerar mais transferências de votos, mas reforça a identidade ideológica\", diz. \n\"A presença dele energiza, consolida o núcleo duro do eleitorado de direita, mas, muito mais no sentido de um símbolo de coragem discursiva e de radicalismo econômico\", prossegue.\n\"Dificilmente a figura de um presidente estrangeiro poderá converter o eleitor de centro ou aquele mais pragmático, porque as preocupações imediatas orbitam em torno da economia doméstica e dos serviços públicos locais.\"\nA visita de Milei ao Brasil faz parte de um projeto maior. \"Milei tem esse plano de se consolidar em países onde a direita está crescendo\", afirma Bressan.\nEm uma espécie de turnê pela América Latina, o presidente argentino seguirá, depois do Brasil, para a posse de Keiko Fujimori no Peru. Em seguida, irá para o Equador, onde deve realizar conversas com o presidente, também conservador, Daniel Noboa, segundo a Reuters.\nNa sequência, Milei visitará a Colômbia para a posse de Abelardo de la Espriella, um outsider da direita radical que acaba de vencer as eleições presidenciais no país.\nPara Bressan, muito mais do que apoiar Flávio ou prestigiar a vitória de um político da direita radical em outro país, Milei busca aumentar sua popularidade na região.\n\"O interesse dele em estar no Brasil não é só pelo Brasil, é por ele também\", afirma. \"Ele não tem poder para mobilizar tantos votos, mas busca consolidar-se como uma liderança intelectual e política da direita ocidental.\"\nEsse movimento de se popularizar pela região vem na mesma esteira do avanço da direita radical na América Latina nos últimos anos. Com as vitórias recentes no Peru e na Colômbia, o mapa político da América Latina vem se alinhando ideologicamente ao presidente americano, Donald Trump. \nAnalistas afirmam que esse avanço pode ter impacto nas eleições brasileiras, que são, inclusive, passíveis de tensões provocadas por Trump.\n\"Os americanos estão fazendo um círculo de fogo em torno do Brasil, e isso já está pressionando o país\", analisou Feliciano de Sá Guimarães, professor do Instituto de Relações Internacionais da USP (Universidade de São Paulo), para a BBC News Brasil em junho.\nNesta semana, começaram a valer as novas tarifas impostas por Trump contra o Brasil, algo que o Flávio Bolsonaro afirma ter tentado impedir, sem sucesso. O impasse revela a complexidade do xadrez político na região.\nMilei sobre no palanque de Flávio\nEsta será a terceira viagem de Milei ao Brasil desde que assumiu a Presidência da Argentina, em dezembro de 2023. \nSeu plano inicial era também visitar Jair Bolsonaro (PL), que está em prisão domiciliar em Brasília, mas o ministro Alexandre de Moraes, do Supremo Tribunal Federal (STF), negou seu pedido.\nNo entendimento do ministro, Bolsonaro está proibido de receber visitas com finalidade político-eleitoral até o fim das eleições. A decisão ocorreu após Flávio divulgar uma carta escrita pelo pai em apoio à sua pré-candidatura. \nOs advogados de Bolsonaro recorreram, alegando que a negativa restringe a liberdade de pensamento do ex-presidente, segundo a Folha de São Paulo.\nNo mês passado, Flávio esteve na Argentina em encontro com Milei. Ao longo dos últimos meses, o senador também realizou uma série de viagens internacionais na tentativa de se alçar como o líder da direita na região. \nO senador tenta contornar obstáculos importantes neste início oficial da campanha, com dificuldades para avançar entre as mulheres — que são a maioria do eleitorado —, trocas públicas de farpas com a ex-primeira-dama Michelle Bolsonaro (PL) e seu nome atrelado ao escândalo do Banco Master.\nIsso levou partidos do Centrão a declararem neutralidade nesta eleição, ao mesmo tempo, em que viu o Supremo Tribunal Federal autorizar a abertura de uma investigação sobre os repasses que Flávio negociou com o banqueiro Daniel Vorcaro para financiar a produção da cinebiografia de seu pai.\nApesar da sucessão de crises, Flávio Bolsonaro segue competitivo na corrida eleitoral. O senador continua em segundo lugar na votação para o primeiro turno, atrás do presidente Luiz Inácio Lula da Silva (PT), e aparece como único candidato capaz de rivalizar com o petista pela liderança, segundo o agregador de pesquisas da BBC News Brasil, atualizado constantemente com os últimos levantamentos. Se o segundo turno fosse hoje, ele teria 42% das intenções de voto ante 46% de Lula.\nMas a ausência de alianças no momento em que sua candidatura é oficializada é um sinal, segundo analistas, de uma fragilidade política da campanha do senador, que tenta desfazer essa percepção trazendo para seu palanque o governador Tarcísio e o presidente Milei.\nNão é costumeira a visita de um chefe de Estado a uma convenção partidária, mas é condizente com a agenda de Milei em torno de encontros organizados pela direita radical.\nEm julho de 2024, ele esteve pela primeira vez no Brasil como presidente e participou da Conferência de Ação Política Conservadora (CPAC), em Balneário Camboriú (SC).\nNa ocasião, ele não realizou compromissos com o governo federal, algo que também não está previsto para ocorrer agora. Lula e Milei só se encontraram no Brasil durante a Cúpula do G20, no Rio de Janeiro, em novembro de 2024.\nEle também esteve em encontros de conservadores nos Estados Unidos e em convenções da legenda de direita radical VOX, na Espanha. Em uma das visitas, o argentino gerou uma crise diplomática ao chamar a Begoña Gómez, esposa do primeiro-ministro espanhol Pedro Sánchez, de corrupta. \nO governo espanhol reagiu, retirando definitivamente sua embaixadora de Buenos Aires.\nOs problemas que o presidente argentino enfrenta em casa\nA tentativa de se popularizar fora da Argentina ocorre em um momento de baixa popularidade dentro de casa. \nSegundo pesquisa realizada pela AtlasIntel para a Bloomberg Linea, publicada no início de julho, 58% dos argentinos desaprovam o governo Milei. O percentual é ligeiramente mais baixo que o registrado em abril, quando a desaprovação estava em 63%, auge do chamado \"escândalo Adorni\".\nO ex-chefe de Gabinete de Milei, Manuel Adorni, foi acusado de envolvimento em um escândalo por suposto enriquecimento ilícito e ocultação de patrimônio no valor de R$ 500 mil (cerca de R$ 2,6 milhões).\nApós se contradizer e acabar por assumir que se tratava de economias não declaradas, Adorni renunciou ao cargo no fim de junho. Mas a mancha deixada na Casa Rosada já havia se consolidado: 80% dos argentinos consideram provável ou muito provável que Adorni tenha cometido irregularidades financeiras relacionadas ao seu patrimônio pessoal, segundo a mesma pesquisa AtlasIntel.\nO caso envolvendo Adorno foi mais um de uma série de notícias envolvendo o governo com acusações de corrupção.\nO próprio Milei protagonizou um caso obscuro, hoje sob investigação da Justiça dos EUA, após promover uma criptomoeda cujo valor despencou em questão de segundos.\nKarina Milei, irmã do presidente, secretária-geral da Presidência e uma das pessoas mais influentes do governo argentino, foi citada em áudios vazados, que sugeriam ela ter recebido parte de um suposto esquema de propina na Agência Nacional para a Deficiência (Andis, na sigla em espanhol).\nE o candidato do governo Milei a deputado pela província de Buenos Aires, José Luis Espert, renunciou à candidatura depois que vieram a público seus vínculos com um empresário acusado de narcotráfico nos EUA. Todos negam ter agido de forma irregular.\nApesar das sucessivas notícias negativas, Milei teve uma sólida vitória nas eleições nacionais de meio de mandato em outubro passado, quando os argentinos renovaram metade da Câmara dos Deputados (127 legisladores) e um terço da Câmara Alta (24 senadores), mas, acima de tudo, deram seu apoio ao presidente.\nA vitória ocorreu dias depois de um inédito resgate financeiro realizado pelos EUA para a Argentina, e de um apoio explícito de Trump a Milei. \"A eleição está próxima, e a vitória é muito importante, estamos aqui para apoiá-lo\", afirmou Trump na época. \nMeses depois, em março, a revista britânica The Economist elogiou as políticas austeras do presidente, chamando-as de \"sensatas, ainda que duras\".\n\"Politicamente, o presidente nunca esteve tão forte\", escreveu a Economist, mencionando o sucesso em aprovar as medidas orçamentárias e as reformas de seu governo. \nMas o sucesso durou pouco, e, em maio, a mesma revista publicou reportagem intitulada \"Milei está em sérios apuros\". \"Os argentinos poderiam ter ignorado as denúncias de corrupção se a economia estivesse indo bem. Mas não está.\"\n\"Os eleitores agora têm duas grandes queixas: escândalos de corrupção e uma economia em dificuldades\", publicou a revista. \nFlávio Bolsonaro lançará sua candidatura neste sábado sem aliança e nem vice definidos\nSERGIO LIMA / AFP VIA GETTY IMAGES\nNo entanto, Bressan afirma que as crises domésticas enfrentadas por Milei causam pouco impacto em sua vitrine para o exterior. \n\"Externamente, para quem olha de fora, Milei está conseguindo se consolidar como um reformador audaz, porque os índices macroeconômicos estão melhorando. Mas no plano doméstico, o país está empobrecendo\", afirma ela.\nA inflação do país saiu de três dígitos no fim de 2024 para 33% em junho deste ano, um dado amplamente divulgado por Milei. Além disso, seu governo comemorou recentemente a redução da pobreza para 28%, atingindo seu nível mais baixo dos últimos sete anos, segundo dados apresentados pelo Instituto Nacional de Estatísticas e Censos do país (Indec) no fim de março.\nMas analistas de institutos públicos e consultorias privadas questionam os números apresentados pelo governo. Os dados contrastam com outros indicadores de renda, como os salários reais e as aposentadorias, que estão em queda.\nCom isso, o país vive o fenômeno dos \"trabalhadores pobres\", em que ter um emprego não é garantia para sair da pobreza.\n\"O discurso para fora dá a entender que a inflação está controlada, que o PIB está melhorando, mas com um custo popular muito grande\", afirma Bressan.", "url": "https://g1.globo.com/mundo/noticia/2026/07/25/o-que-javier-milei-vem-fazer-no-lancamento-da-candidatura-de-flavio-bolsonaro-a-presidente.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-25T10:36:03+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/JOatT7uwIx04pzmKXlb-XqXusKQ=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/Q/K/aHK6ZASDAk39JtqVQWzA/2026-07-16t232504z-1644221911-rc2afmaoq98n-rtrmadp-3-argentina-politics-milei.jpg", "url_hash": "62841d4f64fd586e2247858019ac4265", "title_hash": "1eea88b554be7cbc0bebe59f3e2277a2", "corroboration": 2, "relevance_score": 0.1434, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5267, "headline_en": "Milei to Attend Flávio Bolsonaro's Presidential Candidacy Launch in São Paulo", "headline_pt": "Milei participará do lançamento da candidatura de Flávio Bolsonaro em São Paulo", "one_liner_en": "Argentine president joins Flávio Bolsonaro's campaign launch as part of a broader Latin America tour.", "one_liner_pt": "Presidente argentino, com baixa popularidade em casa, participa do lançamento da candidatura de Flávio Bolsonaro.", "category": "Geopolitics", "region": "brazil", "rationale": "Near-duplicate of index 0 from a different outlet; provides additional context about Milei's domestic low approval ratings.", "low_signal": true}, {"title": "A invasão de vídeos feitos com IA para 'hipnotizar' crianças no YouTube: 'Pode impactar pelo resto da vida'", "summary": "Pesquisadores identificaram que vídeos de baixa qualidade são sugeridos pelo algoritmo da plataforma e que criadores não avisam sobre o uso de tecnologia.", "url": "https://www.bbc.com/portuguese/articles/cx2xx1gp6jgo?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-07-24T17:32:14+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/e21c/live/3ffc65c0-8782-11f1-9428-e17279226993.jpg", "url_hash": "191378c9f1f9839bf3498ff2e4a7b304", "title_hash": "e72b143232bea3b456aa229cfb7d60e9", "corroboration": 2, "relevance_score": 0.1096, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5098, "headline_en": "AI Videos Flood YouTube, Researchers Warn of Long-Term Harm to Children", "headline_pt": "Vídeos de IA invadem o YouTube e pesquisadores alertam para danos duradouros às crianças", "one_liner_en": "Researchers found low-quality AI-generated videos are algorithmically pushed to children without disclosure of AI use.", "one_liner_pt": "Pesquisadores identificaram vídeos de baixa qualidade gerados por IA sendo recomendados a crianças sem aviso sobre a tecnologia.", "category": "AI", "region": "world", "rationale": "Growing concern over AI-generated children's content and platform responsibility makes this a timely child safety and tech accountability story.", "low_signal": false}, {"title": "São Tiago: por que 1º mártir do cristianismo se tornou símbolo de peregrinação", "summary": "<img src=\"https://s2-g1.glbimg.com/lKHPC7Gm1LL_hBvsyTx3uOfmzyc=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/d/4/B445ZRQB67p3c6DYgnzQ/e0469900-8053-11f1-a10f-077d9cf2208e.jpg.webp\" /><br />     Santiago de Compostela virou um importante ponto de peregrinações\nGetty Images\nQuarenta anos atrás um ainda inexpressivo escritor brasileiro percorreria, ao longo de três meses, os 800 quilômetros de uma das mais famosas rotas do Caminho de Santiago, do sul da França até a catedral de Santiago de Compostela, na Galícia, Espanha. Este escritor era Paulo Coelho. E a experiência resultaria diretamente em dois de seus livros, O Diário de Um Mago e O Alquimista, e o alçaria ao primeiro panteão mundial dos best-sellers de literatura.\nPara muitos, a fama que a obra de Coelho adquiriu contribui muito para que essa medieval rota de cunho cristão-católico se tornasse um ícone místico-pop da contemporaneidade.\n\"Postar no Instagram é a principal motivação para quem faz o caminho hoje\", comenta o jornalista Felipe Mortara, que em 2015 percorreu os 800 quilômetros entre a pequena cidade francesa de Saint-Jean-Pied-de-Port e Compostela.\nO boom é confirmado pelos números. Se naquele ano Paulo Coelho foi um dos cerca de 2,5 mil peregrinos que fizeram a rota — conforme dados da arquidiocese local — agora o número anual de caminhantes e ciclistas que passam por ali ultrapassa os 500 mil.\nO Escritório do Peregrino, da Catedral de Santiago de Compostela, compila as estatísticas. Em 2025, foram 530.987 os que fizeram o caminho — 32% declararam que peregrinaram por um misto de razões culturais e religiosas, 44% somente por fé e 18% por motivos apenas culturais e turísticos.\nNo ranking das nacionalidades, brasileiros ocupam a 12ª posição. Foram quase 8,5 mil no ano passado. Espanhóis, obviamente que também pela facilidade geográfica, disparam no topo do levantamento, com 228 mil — seguidos pelos norte-americanos (44 mil), italianos (26 mil) e alemães (24 mil).\nMas para entender como foi que uma cidadezinha nos confins da Península Ibérica se tornaria, ainda na Idade Média, um ponto importantíssimo de peregrinação cristã, é preciso retroceder no tempo, compreender a importância de São Tiago — que é homenageado a cada ano no dia 25 de julho — para o cristianismo e, claro, lembrar como o período medieval foi muito rico em termos de lendas religiosas associadas a relíquias e milagres.\nDecapitado a mando de Herodes\nÉ praticamente um consenso que Tiago, também chamado de São Tiago Maior, foi uma figura histórica que realmente existiu.\n\"Sua existência histórica encontra sólido fundamento nas fontes do cristianismo primitivo, especialmente nos evangelhos e no livro dos Atos dos Apóstolos\", diz o escritor e teólogo J. Alves, autor do livro Os Santos de Cada Dia.\nTeria vivido há 2 mil anos, na mesma região pesqueira da Galileia onde Jesus perambulava pregando e encantando multidões. Possivelmente nascido em Betsaida, foi pescador, assim como seu pai. Conforme os relatos bíblicos, Tiago, seu irmão João e seu amigo Pedro foram os primeiros a largarem tudo para seguir aquele homem de fala cativante e apelo profético que era Jesus.\nO evangelista Marcos relata que os irmãos Tiago e João eram chamados por Jesus de \"boanerges\", palavra que significa \"filhos do trovão\". Este apelido seria decorrente do comportamento intempestivo de ambos.\n\"Provavelmente por conta do temperamento impetuoso dos dois apóstolos\", diz o pesquisador Thiago Maerki, membro associado da Hagiography Society, nos Estados Unidos. Para Alves, essa expressão denota que o apóstolo tinha não só temperamento vigoroso e impetuoso, como também um \"ardor missionário\".\nFato é que Tiago, assim como Pedro e João, parece ter ocupado um papel de destaque durante o movimento messiânico que daria origem ao cristianismo.\n\"Ele pertencia ao círculo mais íntimo de Jesus\", afirma Maerki.\nSão Tiago, em imagem de Rubens, feita em 1612\nDomínio Público\nO personagem aparece ao lado do então mestre em momentos-chave da narrativa bíblica, como no episódio da transfiguração e mesmo no relato do momento de oração ocorrido no Jardim das Oliveiras, horas antes da prisão e execução de Jesus.\nSe pouco se sabe a respeito de sua biografia, relato no livro Atos dos Apóstolos o situa como o primeiro mártir do cristianismo. Segundo o texto, ele teria sido decapitado a mando de Herodes Agripa 1º (10 a.C - 44 d.C), quando este foi rei da Judeia, entre os anos de 41 e 44. O texto do livro bíblico fala que ele, Herodes, \"fez perecer pelo fio da espada Tiago, irmão de João\".\n\"Tornou-se o primeiro dos 12 apóstolos a derramar o sangue em testemunho de Cristo\", afirma Alves.\nAlves acrescenta que, embora o historiador Flávio Josefo (37-100), referência nos estudos sobre a época, não mencione nominalmente Tiago, \"sua descrição do reinado de Herodes Agripa confirma o contexto político e religioso no qual […] teria ocorrido o martírio\".\n\"Mesmo que não haja nenhuma confirmação forte da existência de Tiago, ele está numa situação melhor [em termos de veracidade] do que a maioria dos santos da antiguidade\", explica Maerki .\n\"Isto porque a morte dele é narrada no próprio Novo Testamento.\"\nMaerki salienta que como o livro dos Atos dos Apóstolos foi escrito ainda no século 1º, \"muito próximo dos acontecimentos, diferentemente de outros textos bíblicos escritos muito depois\", historiadores em geral tendem a considerar suas narrativas como mais próximas da realidade.\n\"A existência de Tiago e seu martírio em Jerusalém são pontos praticamente inquestionáveis\", pontua o pesquisador.\nUm túmulo galego\nMas 5.716 quilômetros, por terra, separam Jerusalém, onde Tiago teria sido executado, de Santiago de Compostela, para onde peregrinos vão venerar seu túmulo. Para especialistas, é uma história muito mais de fé do que de razão. Nas últimas décadas, até mesmo o Vaticano passou a tratar com cautela o tema.\nEm documentos recentes, a Igreja não chama o mausoléu galego de túmulo, mas de memorial em honra a São Tiago — reconhece-se, portanto, a fé popular; mas não se compromete com as lacunas historiográficas.\n\"O fenômeno religioso de Santiago de Compostela resulta da convergência entre tradição religiosa, piedade popular e contexto histórico\", argumenta Alves.\n\"Sob o aspecto teológico, convém recordar que a Igreja Católica jamais definiu como dogma de fé que as relíquias veneradas em Compostela pertençam necessariamente ao apóstolo\", prossegue o teólogo.\n\"O que a Igreja reconhece é a legitimidade de uma tradição secular de veneração que, ao longo dos séculos, produziu abundantes frutos espirituais.\"\nHá uma antiga tradição cristã que diz que, após sua execução em Jerusalém, alguns de seus amigos teriam transportado seu corpo até a Galícia, na atual Espanha. E só ali ele teria sido sepultado.\nAlém da distância descomunal para a época, existe um outro problema para essa versão. Historiadores contemporâneos do cristianismo primitivo, como o professor André Leonardo Chevitarese, da Universidade Federal do Rio de Janeiro, são unânimes em defender que, na imensa maioria dos casos, quem era executado não tinha corpo para ser enterrado.\nOs restos mortais eram deixados ao perecimento do tempo, virando comida de abutres e outros animais — isso não só era uma maneira do governo romano \"passar o recado\", amedrontando eventuais novos opositores, como também servia para dificultar que túmulos se tornassem pontos de peregrinação popular. Não interessava ao poder daquela época que figuras ditas rebeldes fossem \"endeusadas\", afinal.\nContudo, essa história de que Tiago estaria sepultado na Pensínsula Ibérica passou a circular  na Idade Média, sobretudo entre os século 7º e 9º, lembra Alves. \"Começaram a surgir referências mais consistentes\", afirma ele.\nFoi quando, segundo relatos medievais, um eremita havia observado misteriosas luzes sobre um antigo sepulcro. Informado a respeito, o bispo Teodomiro (?-847) foi até o local e encontrou um sepulcro que, para ele, seria o do Tiago. A catedral de Compostela acabaria erguida ali.\nA igreja foi construída a mando do rei das Astúrias, Afonso 2º (759-842). Por tradição popular, ele é considerado o primeiro peregrino a visitar o túmulo do santo.\nHá um contexto político. Segundo o pesquisador Maerki, Astúrias buscava, na ocasião, um símbolo religioso para que adquirisse prestígio social, político e militar. Essa conveniência teria feito com o que o rei Afonso não só atestasse a descoberta do bispo como reforçasse sua importância.\n\"É uma tradição que diz mais sobre o período medieval do que sobre questões de fé\", compara Maerki. \"Mas isso não diminui a história, o prestígio dela.\"\nNo compilado hagiográfico feito pelo dominicano Tiago de Voragine (1228-1298), arcebispo de Gênova, no século 13, o capítulo dedicado a São Tiago tem contornos lendários sobre o suposto traslado de seu corpo até a Galícia. Segundo o texto, os discípulos de Tiago teriam colocado o defunto em uma embarcação sem velas nem remos — e esta teria sido conduzida, por milagre, sozinha até a costa da Galícia.\n\"Do ponto de vista historiográfico, não existem documentos que comprovem esse transporte\", salienta Alves.\n\"A arqueologia confirma que sob a catedral existe de fato uma necrópole da época romana\", diz Maerki. \"Mas a identificação dos restos mortais é matéria de fé, não de história.\"\nO hagiólogo Maerki lembra ainda que há uma lenda medieval, que aparece em textos do final do século 6, afirmando que Tiago teria sido \"o primeiro a evangelizar\" a região da Espanha. Contudo, essa narrativa esbarra em problemas historiográficos e bíblicos. Maerki lembra que na carta escrita aos Romanos, de autoria do apóstolo Paulo de Tarso (5-68) pelo menos 10 anos depois da morte de Tiago, ele menciona a intenção de ir para aqueles lados. \"De forma a sugerir, no meu entender, que nenhum cristão havia já pregado ali\", afirma o pesquisador.\nAgora no g1\nFenômeno de fé e de cultura popular\nControvérsias à parte, o Caminho de Santiago se tornou um dos maiores fenômenos religiosos da Europa medieval. \"Ao lado de Jerusalém e Roma, Compostela se converteu em um dos principais centros de peregrinação da cristandade, favorecendo o intercâmbio espiritual, artístico, cultural e econômico entre os povos europeus\", contextualiza Alves.\n\"Mas a autenticidade material das relíquias não constitui objeto de fé dogmática. O centro da peregrinação cristã não reside propriamente nas relíquias, mas no itinerário espiritual de conversão, penitência e encontro com Cristo, do qual São Tiago se tornou um dos maiores símbolos na tradição do Ocidente cristão\", salienta o teólogo.\nA importância das peregrinações a Compostela na Idade Média é comprovada pela quantidade de textos da época descrevendo rotas, hospedarias e trazendo informações sobre povos ao longo dos trajetos. \"Funcionavam como uma espécie de guia para os peregrinos\", afirma Maerki.\nEm seu doutorado defendido na Universidade Estadual de Campinas (Unicamp), ele estudou um pouco esse material. Em artigo acadêmico publicado em revista da Universidade do Porto, em Portugal, Maerki analisa a viagem a Compostela feita por Francisco de Assis (1182-1226). \"Isso mostra que essa peregrinação já era badalada na época\", diz ele.\nNão há uma rota apenas. O jornalista Mortara lembra que a ideia é cada um possa sair de sua casa e ir até Compostela. Assim, em toda a Europa, há muitos trajetos possíveis que, vão convergindo para os caminhos consagrados até que, no trecho final, toda a muvuca de peregrinos tende a se concentrar mais.\nEm comum, todos costumam dizer que a viagem transformou suas vidas. Em julho, o administrador de empresas Ronan da Cruz, de 42 anos, fez o caminho, com um amigo e seu filho Martin, de 16 anos. \"Apesar de não ser religioso, toda essa ideia de fazer uma peregrinação com esse fundo espiritual, essa conexão foi intensa\", comenta. \"Quando você coloca um propósito e pensa sobre todas as pessoas que já percorreram esse caminho e as dificuldades que elas tiveram, fica a mensagem de conforto de que existe um apoio divino que vai ajudar a superar os desafios.\"\nPara alguns, Santiago representou uma mudança total de vida. Considerado uma espécie de líder dos albergueiros, o brasileiro Acácio da Paz vive na pequena Viloria de Rioja desde 1999 — ali mantém uma hospedaria.\n\"São 28 anos aqui. Ao longo desse período, desenvolvi projetos ligados ao universo da peregrinação: hospedagem, transporte de peregrinos, aluguel de bicicletas, logística de bagagens e organização de grupos internacionais\", conta.\nPaulo Coelho é um dos visitantes da pousada de Acácio da Paz, em Viloria de Rioja\nAcácio da Paz/Arquivo pessoal\n\"A decisão de deixar o Brasil surgiu a partir de uma experiência transformadora vivida no próprio caminho\", recorda. \"Percebi que queria dedicar minha vida a esse ambiente de encontro humano, espiritual, cultural e hospitaleiro. O caminho acabou se tornando meu projeto de vida e propósito.\"\nCom o distanciamento de quem fez o Caminho de Santiago por razões profissionais e não somente pessoais, o jornalista Mortara avalia que a experiência trouxe um esclarecimento.\n\"Peregrinar e penitenciar não são sinônimos\", comenta. \"O Caminho de Santiago é uma caminhada gostosa, bonita, enriquecedora em termos históricos, culturais e gastronômicos. Há muita troca com muita gente de muitos lugares diferentes. Isso é potente.\"", "url": "https://g1.globo.com/mundo/noticia/2026/07/25/sao-tiago-por-que-1o-martir-do-cristianismo-se-tornou-simbolo-de-peregrinacao.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-25T08:30:43+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/lKHPC7Gm1LL_hBvsyTx3uOfmzyc=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/d/4/B445ZRQB67p3c6DYgnzQ/e0469900-8053-11f1-a10f-077d9cf2208e.jpg.webp", "url_hash": "f36c26d2aad7d50052aa69dc3579ecfd", "title_hash": "50ec416cf4e3c83cc57cd875da1a01fa", "corroboration": 2, "relevance_score": 0.0585, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4843, "headline_en": "Saint James: Why the First Christian Martyr Became a Symbol of Pilgrimage", "headline_pt": "São Tiago: por que o primeiro mártir cristão se tornou símbolo de peregrinação", "one_liner_en": "Santiago de Compostela rose to global pilgrimage fame, shaped in part by a Brazilian writer's journey 40 years ago.", "one_liner_pt": "Santiago de Compostela tornou-se um importante destino de peregrinação, em parte graças à jornada de um escritor brasileiro.", "category": "Culture", "region": "world", "rationale": "The feast day of Saint James on July 25th gives this cultural and religious explainer a timely news hook.", "low_signal": false}, {"title": "A invasão de vídeos feitos com IA para 'hipnotizar' crianças no YouTube: 'Pode impactar pelo resto da vida'", "summary": "<img src=\"https://s2-g1.glbimg.com/V_n-Ae8xwV0HGAvP376jQA8CU-A=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/P/n/Cu46ujRdCcZRWCpXRVAw/d3a70540-8783-11f1-9428-e17279226993.jpg\" /><br />     Personagens que mudam de nome, de voz e até de aparência ao longo da história, sem qualquer explicação, aparecem em vídeos de IA no Youtube\nBloomberg via Getty Images\nUm urso panda reencontra um antigo cuidador e reage com surpresa, quase como se fosse um ser humano. A imagem é extremamente realista.\nUm avatar de Jesus aparece em uma praia construindo estátuas de si mesmo.\n🗒️ Tem alguma sugestão de reportagem? Envie para o g1\nMúsicas infantis que não têm refrão claro, trazem letras incompreensíveis e misturam trechos em mais de um idioma.\nPersonagens que mudam de nome, de voz e até de aparência ao longo da história, sem qualquer explicação.\nAgora no g1\nEstes são alguns dos vídeos aparentemente criados com inteligência artificial e sugeridos pelo algoritmo do YouTube, inclusive após buscas relacionadas ao universo infantil.\nEm um teste da BBC News Brasil, bastaram cerca de 15 minutos navegando pelos vídeos curtos da plataforma para que clipes desse tipo aparecessem. A busca inicial havia sido por temas como os jogos Roblox, Minecraft e vídeos de animais.\nProduzidos em escala e replicados por diferentes canais, muitos desses conteúdos acumulam dezenas ou centenas de milhares de visualizações.\nCriadores chegam a recomendar o nicho infantil como uma oportunidade de negócio e afirmam ser possível obter renda com esses vídeos.\nJá especialistas ouvidos pela BBC News Brasil alertam que esse material pode levar as crianças a confundir realidade e ficção e afetar de forma significativa e permanente sua capacidade de atenção e seu desenvolvimento cognitivo e social.\nO que explica essa invasão de vídeos gerados por IA no YouTube, o maior serviço de streaming do mundo?\nUm dos fatores é econômico, segundo pesquisadores ouvidos pela reportagem. \nO YouTube, por sua vez, diz priorizar o combate a conteúdos de IA de baixa qualidade e adotar regras mais rígidas para vídeos destinados a crianças.\nComo são os vídeos infantis feitos com IA\nPesquisadores identificaram músicas, conteúdo religioso e cópias de personagens com direitos autorais em vídeos gerados por IA no Youtube\nReprodução/André Mintz/Youtube\nAinda não é possível dimensionar com clareza o tamanho e alcance deste fenômeno.\nA reportagem tentou estimar a frequência com que vídeos feitos com IA aparecem para o usuário, com base no alerta visual exibido pelo YouTube para conteúdos deste tipo. \nA maioria, porém, não apresentava qualquer aviso, mesmo quando havia fortes indícios do uso da tecnologia, como vozes que não correspondiam aos personagens, desenhos que mudavam de forma entre uma cena e outra e gestos ou movimentos incomuns.\nPesquisadores ouvidos pela BBC News Brasil afirmam que o YouTube não identifica automaticamente vídeos feitos com IA e que muitos criadores não informam quando recorrem à tecnologia.\nUma análise do jornal The New York Times feita manualmente e também com uma ferramenta de detecção ajuda a ilustrar a frequência com que esses vídeos aparecem. \nEm uma sessão de 15 minutos realizada após a exibição de um vídeo do canal infantil CoComelon, mais de 40% dos vídeos assistidos pareciam conter imagens geradas por IA. \nMesmo com dificuldades na coleta de dados, um estudo conduzido por André Mintz, professor do Departamento de Comunicação Social da Universidade Federal de Minas Gerais (UFMG), e pela estudante de graduação em Cinema de Animação e Artes Digitais Juno Bozzi buscou identificar a presença desse tipo de conteúdo em vídeos infantis em português e inglês no YouTube.\nA pesquisa partiu de uma base com cerca de 17 mil vídeos encontrados por meio de buscas com palavras-chave relacionadas à inteligência artificial e conteúdo infantil. \nEm seguida, os pesquisadores aplicaram novos filtros para identificar apenas vídeos efetivamente voltados às crianças.\nOs vídeos infantis gerados por IA analisados apresentavam diferentes níveis de uso desta tecnologia. Alguns pareciam ter sido produzidos quase integralmente desta forma. Outros incorporavam apenas alguns elementos, como cenários das animações.\nA maior parte dos conteúdos era musical, com imagens geradas por IA acompanhadas de canções infantis. O estudo também encontrou adaptações de histórias, vídeos educativos, como lições sobre o alfabeto, e conteúdos religiosos.\nUma categoria que chamou a atenção dos pesquisadores foi a dos vídeos de \"transformação\", nos quais personagens de desenhos animados são recriados por IA em versões com aparência de crianças. A pesquisa aponta que esses vídeos tendem a repetir imagens genéricas e estereotipadas.\n\"O que chama a atenção é um certo desprezo pelo espectador infantil, de colocar qualquer coisa e confiar que a criança vai aceitar\", diz o professor André Mintz à BBC News Brasil.\n'Crianças pequenas não conseguem distinguir fantasia de realidade'\nRachel Franz, diretora do programa Young Children Thrive Offline (Crianças pequenas se desenvolvem melhor longe das telas, em tradução livre) da organização americana Fairplay, explica que esse tipo de vídeo se enquadra no chamado \"AI slop\" \nEssa expressão é usada para definir vídeos de baixa qualidade, produzidos em massa com o uso de softwares de inteligência artificial.\nSegundo Franz, a preocupação é maior em relação aos efeitos disso nas crianças pequenas, em um período da vida em que o cérebro ainda passa por intenso desenvolvimento.\n\"O cérebro das crianças atinge cerca de 90% do tamanho adulto até os 5 anos, e o que elas encontram nesse período molda seu desenvolvimento e pode impactá-las pelo resto da vida\", afirma Franz.\n\"Crianças pequenas não conseguem distinguir fantasia de realidade. Assistir a AI slop pode condicionar o cérebro delas a acreditar que algo é real quando não é.\"\nFranz afirma que muitos desses vídeos são produzidos para capturar a atenção infantil, não para ensinar. \nSegundo ela, a sucessão de imagens confusas também pode sobrecarregar a quantidade de informações que uma criança consegue processar de uma só vez.\n\"Quando o cérebro é sobrecarregado com informações, a criança não consegue aprender tão bem quanto ao vivenciar situações reais, no seu próprio ritmo e usando todos os sentidos.\"\nEla também relaciona o consumo prolongado desses vídeos ao tempo que deixa de ser dedicado a atividades como brincar, dormir e interagir com outras pessoas.\n\"Vídeos hipnotizantes de músicas infantis gerados por IA, por exemplo, podem moldar o cérebro das crianças no longo prazo, afetando sua capacidade de atenção, sua resiliência e sua habilidade de regular as emoções mais tarde na vida.\"\nEspecialistas sugerem que YouTube deixe de recomendar vídeos gerados por IA\nAFP via Getty Images\nOs possíveis efeitos do consumo deste tipo de vídeo gerado por IA já são percebidos em atendimentos, segundo Telma Pantano, fonoaudióloga e psicopedagoga do Instituto de Psiquiatria do Hospital das Clínicas da Faculdade de Medicina da Universidade de São Paulo (IPq/HCFMUSP).\n\"Há crianças que estão vindo com muitos medos, com muita dificuldade de definir o que acontece e o que não acontece.\"\nPantano afirma que a maturação das áreas pré-frontais do cérebro, relacionadas à capacidade crítica, à autorregulação e ao automonitoramento, começa por volta dos 6 anos e se estende até a vida adulta.\nSegundo ela, a distinção entre realidade e fantasia começa a se consolidar por volta dos 7 ou 8 anos, enquanto habilidades como tomada de decisão e resolução de problemas se desenvolvem mais tarde.\n\"Até os 10 anos, é uma idade de muito risco, porque a criança ainda não sabe separar a realidade da fantasia e não tem capacidade de tomada de decisão, organização e planejamento para resolver problemas.\"\nPara a especialista, há ainda um custo no contato constante com imagens prontas, que exigem pouco da imaginação infantil.\n\"Sabe aquela sensação de quando a gente vai ver um filme depois de ler o livro? Normalmente não gostamos do filme porque ele vai contra a nossa imagem mental\", diz.\n\"O que estamos fazendo com essa construção de vídeos? Estamos permitindo que crianças e adolescentes entrem em contato com a imagem sem antes fazer essa construção mental. As imagens vêm prontas, e a criatividade fica bastante restrita.\"\n'Quanto menor a criança, mais atrativo aquilo fica'\nPantano afirma que também não se pode esperar que as próprias crianças identifiquem e rejeitem vídeos de baixa qualidade. \nConteúdos com cores, movimentos e mudanças rápidas podem capturar a atenção mesmo quando não apresentam uma narrativa coerente ou informação confiável, diz.\n\"Mesmo conteúdos sem significado, sem base científica ou sem conhecimento vão atrair a criança da mesma forma. E, quanto menor a criança, mais atrativo aquilo fica.\"\nAndré Mintz avalia que esse tipo de vídeo se aproveita da dificuldade de muitas famílias em controlar o consumo de conteúdo infantil online.\n\"Geralmente, quando você vê crianças que assistem muito conteúdo online, é essa situação do pai ou da mãe sem tempo para ficar com a criança, precisando entretê-la enquanto cuida da casa, trabalha ou faz outra coisa.\"\nPara ele, o problema não está apenas na existência dos vídeos, mas na forma como esse tipo de conteúdo se encaixa no modelo das plataformas.\n\"Se tem gente assistindo, para o YouTube está bom. Vai ser recomendado, vai aparecer\", diz Mintz.\nRachel Franz concorda que o impacto sobre as crianças é agravado pelo próprio modo de funcionamento das plataformas.\n\"Elas são projetadas para fisgar as crianças e mantê-las engajadas pelo maior tempo possível. Elas usam táticas deliberadas, como reprodução automática e recomendações algorítmicas, para alimentar as crianças com um vídeo atrás do outro\", afirma.\n\"Quando acrescentamos AI slop, que hipnotiza ainda mais as crianças, essa se torna uma batalha perdida. Isso não apenas impacta o desenvolvimento infantil, como torna impossível exercer o papel de pai ou mãe quando a própria tela luta contra você.\"\nYouTube diz que combater vídeos de IA de baixa qualidade é prioridade\nO YouTube afirma que, embora seja permitido conteúdo gerado por IA, a plataforma tem padrões mais rígidos para o conteúdo voltado para espectadores mais jovens.\n\"Combater o conteúdo de baixa qualidade gerado por IA é uma prioridade máxima para nós, e isso inclui esforços contínuos para remover conteúdo de IA marcado como 'feito para crianças' quando ele não atende aos nossos princípios de qualidade\", diz a plataforma em nota à BBC News Brasil.\nA empresa afirma que canais que usam IA continuam qualificados para monetização, ou seja, para exibir propaganda e serem pagos por isso, \"desde que o produto final seja uma criação original que adicione uma perspectiva autêntica, siga nossas diretrizes de comunidade e de monetização, e divulgue adequadamente quando o conteúdo for alterado ou sintético\".\nEm uma entrevista ao canal Creator Inside, em julho, o vice-presidente de confiança e segurança do YouTube, Matt Halprin, disse que são considerados problemáticos vídeos em que o conteúdo seja genéricos ou repetitivo, que busquem manipular as emoções dos espectadores ou criem peronsagems com IA para abordar temas considerados mais sensíveis, como finanças, questões legais ou saúde.\nPara João Victor Archegas, coordenador de direito e tecnologia do Instituto de Tecnologia e Sociedade do Rio (ITS Rio), é positivo que o YouTube sinalize ao público o que caracteriza como um conteúdo que não seja autêntico, e que isso possa impedir sua monetização. \nIsso permite que os criadores de conteúdo compreendam melhor os limites estabelecidos pela plataforma.\nPara uma empresa que opera uma das maiores máquinas publicitárias do mundo, ressalta Archegas, é importante dar sinais claros a parceiros e anunciantes de que há uma preocupação com o uso dessa tecnologia, e que há alguma forma de controle pela própria plataforma.\nMas Archegas avalia que há uma contradição: o YouTube incentiva ativamente a adoção de ferramentas de IA para a criação de vídeos, enquanto tenta frear o \"AI slop\" (conteúdo de baixa qualidade) que essas mesmas tecnologias permitem escalar. \nIsso tem, na prática, um efeito limitante sobre a capacidade do YouTube de conter a disseminação destes vídeos. \n\"A plataforma segue tendo o desafio imenso de identificar conteúdos gerados por IA e atuar quando eles são identificados\", diz Archegas. \n\"Essas novas categorias podem ajudar o moderador a entender o que a plataforma considera prioritário, mas não dizem o que, de fato, o YouTube classifica como conteúdo gerado por IA ou quais são os parâmetros técnicos usados nessa moderação.\"\nIA pode decidir atacar empresas? Como foi a invasão 'sem precedentes' por modelo da OpenAI", "url": "https://g1.globo.com/tecnologia/noticia/2026/07/25/a-invasao-de-videos-feitos-com-ia-para-hipnotizar-criancas-no-youtube-pode-impactar-pelo-resto-da-vida.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-25T08:00:34+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/V_n-Ae8xwV0HGAvP376jQA8CU-A=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function renderMasthead() {

  const year = new Date(iso + 'T12:00:00').getFullYear();
  const vol  = toRoman(year - 1900);
  const doy  = dayOfYear(iso);

}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

  if (activeTab === 'world')    return true;

  if (activeTab === 'curitiba') return region === 'curitiba';

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });

    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  const maxRel = Math.max(...DATA.articles.map(a => a.relevance_score || 0), 0.01);
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round(((art.relevance_score || 0) / maxRel) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
        '<div class="art-actions">' +
          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
