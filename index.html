<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

he unique African island nation born from volcanic origins.", "one_liner_pt": "A campanha de Cabo Verde na Copa do Mundo destacou a singular nação africana de origem vulcânica.", "category": "Culture", "region": "world", "rationale": "Cape Verde's unexpected World Cup performance has made the nation a global talking point during the tournament.", "low_signal": false}, {"title": "'Estamos juntos, Cabo Verde': o país que nasceu de um vulcão e incendeia a Copa do Mundo", "summary": "<img src=\"https://s2-g1.glbimg.com/Atq13LrtO1P_8vA_Ib3z402xtdk=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/b/s/wDummxTsyezbKJNTKiqw/bbc-cabo-verde.webp\" /><br />     Fantástico vai até Cabo Verde conhecer a trajetória do goleiro Vozinha\nAté poucas semanas atrás, Cabo Verde era conhecido por muitos brasileiros apenas como um pequeno arquipélago africano de praias paradisíacas e língua portuguesa. \nAgora, o país de pouco mais de meio milhão de habitantes — população semelhante à de Florianópolis — se tornou uma das grandes histórias da Copa do Mundo de 2026.\n✅ Siga o canal de notícias internacionais do g1 no WhatsApp\nA seleção cabo-verdiana, apelidada de \"Tubarões Azuis\", disputa seu primeiro Mundial e já chamou a atenção ao arrancar um empate sem gols com a Espanha, atual campeã da Europa. Seu goleiro de 40 anos, Vozinha, virou herói nacional, emocionou torcedores ao chorar após a partida e se transformou em um fenômeno das redes sociais.\nMas o interesse despertado por Cabo Verde vai além do futebol. \n👉 Localizado a cerca de 600 quilômetros da costa oeste da África, esse pequeno país insular tem uma história singular: foi um importante entreposto do tráfico transatlântico de escravizados, possui uma das democracias mais estáveis do continente africano, não tem rios permanentes nem fontes naturais significativas de água doce e é o berço da morna, gênero musical eternizado pela cantora Cesária Évora.\nO país também é muito lembrado pela cultura que valoriza a união, o orgulho nacional e a solidariedade do povo das ilhas e da sua vasta diáspora, características celebradas pela famosa expressão \"Nu sta djunto, Kabu Verdi\".\nEm crioulo cabo-verdiano, a frase significa \"Estamos juntos, Cabo Verde\", e vem sendo usada pelos torcedores locais — e simpatizantes do futebol ao redor do mundo — para apoiar o time.\nReunimos seis fatos que ajudam a entender por que Cabo Verde, o azarão simpático desta Copa, conquistou a imaginação do mundo: \n1. Era habitado apenas por morcegos até a chegada de Portugal\nA bandeira de Cabo Verde, adotada em 1992, exibe listras azuis, brancas e vermelhas que simbolizam o oceano, a paz e o esforço nacional. O círculo de dez estrelas representa as principais ilhas e sua unidade como nação.\nGetty Images via BBC\nCom uma superfície total de 4 mil quilometros quadrados, Cabo Verde é formado por dez ilhas, das quais nove são habitadas.\nSua única espécie endêmica de mamífero é o morcego-de-orelhas-cinzentas, que durante muito tempo dominou o arquipélago sem conviver com outros mamíferos até a chegada dos primeiros humanos, no século XV.\nApós desembarcarem em 1456, segundo registros históricos, os portugueses fundaram Ribeira Grande, na ilha de Santiago. Hoje, a cidade se chama Cidade Velha e fica a poucos quilômetros de Praia, a capital e cidade mais populosa do país.\nPortugal deu às ilhas o nome de Cabo Verde em referência ao ponto mais próximo do continente africano: a península homônima onde hoje está localizada Dakar, capital do Senegal.\nO arquipélago se divide em dois grupos:\nIlhas de Barlavento: Santo Antão, São Vicente, Santa Luzia, São Nicolau, Sal e Boa Vista.\nIlhas de Sotavento: Maio, Santiago, Fogo e Brava.\nDessas, apenas Santa Luzia permanece desabitada e constitui uma reserva natural.\n2. Foi um importante entreposto do tráfico de escravizados entre África e América\nPor sua posição estratégica entre a África e a América, Cabo Verde se consolidou, no século XVI, como um dos principais centros do tráfico transatlântico de escravizados, atividade que perdurou por mais de 300 anos.\nEstima-se que cerca de 3 mil escravizados vindos do continente africano fossem vendidos anualmente em Cabo Verde com destino à Europa e às Américas. Alguns permaneceram no arquipélago, trabalhando nas minas de sal e nas primeiras plantações de algodão voltadas para Portugal.\nA herança da escravidão marcou profundamente a demografia do país. A população é majoritariamente mestiça, resultado da mistura entre africanos e europeus — sobretudo portugueses —, algo confirmado por estudos genéticos.\nEmbora o idioma oficial seja o português, os habitantes também falam o crioulo cabo-verdiano, uma mistura do português com línguas africanas, que possui nove variantes, uma para cada ilha habitada.\nA influência colonial também se reflete na religião: 72,5% da população é católica, segundo o anuário The World Factbook, da CIA.\n3. Tem apenas 500 mil habitantes, menos da metade do número de turistas que recebe por ano\nA grande distância entre as ilhas, o território reduzido — menor que um quinto da área de El Salvador, o menor país da América Latina — e o fato de apenas cerca de 11% da superfície ser cultivável, em meio a extensas áreas de rocha vulcânica, limitaram o crescimento populacional de Cabo Verde ao longo dos últimos cinco séculos e meio.\nO Banco Mundial estimou a população em 524 mil habitantes em 2024.\nIsso representa menos da metade dos 1,2 milhão de turistas que visitaram o arquipélago no mesmo ano, segundo dados oficiais.\nO turismo é, de fato, o principal motor da economia cabo-verdiana, representando aproximadamente um quarto do Produto Interno Bruto (PIB), segundo diversas fontes, incluindo o Departamento de Comércio dos Estados Unidos.\nOs cabo-verdianos que vivem fora do país também superam os que vivem no arquipélago. O governo estimou em 2023 uma diáspora de cerca de 2 milhões de pessoas, principalmente em Portugal e nos Estados Unidos, embora esse número seja debatido por falta de estudos mais abrangentes.\n4. É uma das democracias mais estáveis da África\nPortugal transformou Cabo Verde de colônia em província ultramarina em 1951, mas a mudança não satisfez as crescentes aspirações por autonomia dos cabo-verdianos.\nNas décadas de 1950 e 1960, líderes como Amílcar Cabral uniram-se à luta de independência da Guiné-Bissau em uma guerra sangrenta contra Portugal.\nO processo culminou com a independência de Cabo Verde, em 5 de julho de 1975.\nO país viveu sob um sistema de partido único até 1990, quando surgiu o Movimento para a Democracia (MPD), abrindo caminho para o multipartidarismo e para as primeiras eleições democráticas em janeiro de 1991.\nDesde então, Cabo Verde mantém uma vida política pacífica e estável, com alternância de poder e instituições consolidadas, incluindo presidente eleito, primeiro-ministro, Assembleia Nacional e Supremo Tribunal de Justiça.\nEssa alternância foi reforçada em 2021, quando o atual presidente, José Maria Neves, de centro-esquerda, venceu as eleições após uma década de governo do MPD, partido de centro-direita.\nVozinha: apelido do goleiro de Cabo Verde começou como 'bullying'\n5. Não possui rios nem fontes de água doce, mas abriga um vulcão ativo\nCom clima extremamente seco, Cabo Verde não possui rios, lagos ou fontes significativas de água doce. Toda a água potável distribuída às residências vem de usinas de dessalinização.\nAs chuvas são escassas e as secas, frequentes, podendo durar anos, o que afeta a agricultura e já provocou crises alimentares no passado.\nAs ilhas, formadas por atividade vulcânica, apresentam paisagens áridas e acidentadas. Algumas são planas e cobertas por dunas, como Sal, Boa Vista e Maio. Outras se destacam pelos penhascos e relevos montanhosos, como Santo Antão e São Nicolau.\nO ponto mais alto do país é o Pico do Fogo, com 2.829 metros de altitude. Trata-se do único vulcão ativo do arquipélago. Sua erupção mais recente, a mais longa em dois séculos e meio, ocorreu entre novembro de 2014 e fevereiro de 2015.\nEla destruiu vilarejos inteiros, obrigou a evacuação de cerca de mil pessoas e provocou prejuízos superiores a US$ 50 milhões.\n6. Possui gêneros musicais próprios: a morna de Cesária Évora e o funaná\nA música faz parte da vida cotidiana em Cabo Verde e está presente tanto em festas populares quanto em celebrações familiares.\nO gênero mais representativo é a morna, reconhecida pela UNESCO em 2019 como Patrimônio Cultural Imaterial da Humanidade. Com ritmo lento e tom melancólico, a morna expressa a saudade — da terra natal ou de pessoas queridas —, especialmente entre os cabo-verdianos que vivem no exterior.\nSua instrumentação inclui violão, cavaquinho, violino e percussão leve.\nA grande embaixadora da morna foi a cantora Cesária Évora (1941-2011), que levou o gênero aos principais palcos do mundo.\nO outro grande gênero musical de Cabo Verde é o funaná, caracterizado por um ritmo rápido e dançante, marcado pelo acordeão e pelo ferrinho.\nAgora no g1", "url": "https://g1.globo.com/mundo/noticia/2026/06/26/estamos-juntos-cabo-verde-o-pais-que-nasceu-de-um-vulcao-e-incendeia-a-copa-do-mundo.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-26T11:12:49+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/Atq13LrtO1P_8vA_Ib3z402xtdk=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/b/s/wDummxTsyezbKJNTKiqw/bbc-cabo-verde.webp", "url_hash": "55cc786e2a16f3d1990df1be56ff034e", "title_hash": "439d195e3ac787084c8abb8c7112b88c", "corroboration": 2, "relevance_score": 0.1411, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5256, "headline_en": "Fantástico Travels to Cape Verde to Explore World Cup Phenomenon", "headline_pt": "Fantástico vai a Cabo Verde conhecer a história por trás da Copa", "one_liner_en": "Brazilian TV show Fantástico visits Cape Verde to explore goalkeeper Vozinha and the team's World Cup journey. ea.png\" /><br />     Venezuela foi devastada por terremotos de magnitudes 7,5 e 7,2 em 24 de junho de 2026.\nGetty Images via BBC\nCentenas de pessoas morreram e milhares ficaram feridas na Venezuela depois que dois fortes terremotos consecutivos atingiram o país.\nOs fortes terremotos de magnitude 7,2 e 7,5 ocorreram com 39 segundos de diferença, segundo informou o Serviço Geológico dos Estados Unidos (USGS, na sigla em inglês).\nEm seguida, houve cerca de 30 réplicas, afirmou a presidente interina, Delcy Rodríguez.\nMapa da BBC mostra terremotos que devastaram a Venezuela em 24 de junho de 2026.\nBBC\nTabela da BBC explica magnitudes de terremotos.\nBBC\nMilhares de pessoas passaram a noite ao relento por medo de novas réplicas, enquanto as operações de resgate e recuperação continuam em Caracas e em outras áreas afetadas, como o estado de La Guaira.\nMontagem da BBC mostra antes e depois de hotel em La Guaira, na Venezuela, destruído por terremoto em 24 de junho de 2026.\nBBC\nO USGS afirmou que há uma probabilidade superior a 99% de que ocorram réplicas de magnitude 3 ou superior durante a próxima semana, sendo mais provável que aconteçam entre 150 e 860 tremores.\nA Venezuela está localizada em uma zona de intensa atividade sísmica onde convergem duas placas tectônicas: a do Caribe e a da América do Sul.\nO duplo terremoto ocorreu \"como resultado de uma falha de deslizamento horizontal superficial próxima ao complexo limite entre as placas do Caribe e da América do Sul\", explicou o USGS.\n\"Esse movimento ocorre principalmente por meio de um importante sistema de falhas transcorrentes dextrais que atravessa o norte da Venezuela.\"\nA localização do terremoto, sua pequena profundidade (10,0 km) e o mecanismo de deslizamento horizontal dextral são compatíveis com uma ruptura ao longo desse sistema de limites de placas, especificamente no sistema de falhas de Boconó, afirmou o USGS.\nDiante da possibilidade de novas réplicas, o USGS recomendou que a população p ecessidade de compensação de horas. \n✅ Clique aqui para seguir o canal do g1 Triângulo no WhatsApp\nO decreto foi publicado no Diário Oficial do Município (DOM) na manhã desta sexta-feira (26) e trata da flexibilização da jornada de trabalho dos agentes públicos dos órgãos e entidades da administração municipal. \nDiferentemente da decisão publicada para o último jogo, os servidores não precisarão compensar as horas não trabalhadas em banco de horas nem no mês de julho. \n🕛Segundo o comunicado, o horário de expediente será das 7h às 12h, com atendimento ao público até as 11h. \nNo entanto, vale ressaltar que a medida não se aplica às jornadas e aos horários de atendimento dos serviços considerados essenciais e contínuos, como Unidades de Pronto Atendimento, da segurança pública, saneamento e serviços urbanos de coleta e limpeza.\nCDL orienta lojistas\nA Câmara de Dirigentes Lojistas (CDL) Uberlândia também divulgou, nesta semana, orientações para as empresas do comércio e de serviços sobre o funcionamento do comércio durante os jogos da seleção. Veja abaixo. \nO fechamento do estabelecimento durante a partida não é obrigatório por lei. A decisão cabe a cada empresário, que deve observar o acordo coletivo da categoria e comunicar previamente colaboradores e clientes sobre qualquer alteração no horário de funcionamento. \nAs horas não trabalhadas poderão ser negociadas entre empregados e patrões ou abonadas a critério da empresa. \nAs empresas podem, a seu critério, disponibilizar um espaço para que os colaboradores acompanhem os jogos durante o expediente, criando um momento de integração e confraternização entre a equipe. \nCaso opte pelo fechamento temporário ou antecipado, recomenda-se afixar um aviso na entrada do estabelecimento com o horário previsto para reabertura. \nPara bares, restaurantes e estabelecimentos do setor de alimentação, os jogos representam uma oportunidade de aumento no movimento e de ampliação do faturamento. Nesses casos, a orientação é planejar com antecedência o atendimento, reforçar a equipe se necessário e garantir estoque adequado para absorver a demanda extra durante e após as partidas. \nLEIA TAMBÉM:\nTorcedor que pinta sinalização de trânsito há 10 anos, faz alegria dos vizinhos pintando a rua para a Copa em Uberlândia\nVeja onde trocar figurinhas da Copa do Mundo em Uberlândia\nVeja onde trocar figurinhas da Copa do Mundo em Uberaba\nASSISTA: Torcedores enfeitam ruas em Uberlândia para a Copa do Mundo\nEsporte: torcedores enfeitam ruas em Uberlândia às vésperas da Copa do Mundo\nVÍDEOS: veja tudo sobre o Triângulo, Alto Paranaíba e Noroeste de Minas", "url": "https://g1.globo.com/mg/triangulo-mineiro/noticia/2026/06/26/prefeitura-de-uberlandia-libera-servidores-mais-cedo-para-jogo-entre-brasil-e-japao-confira-o-expediente.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-26T12:39:46+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/rxDcdEU3D4Qy6hwFVVRkFBpHkxA=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2025/V/a/soSiiWTX6yUW3wTAtesQ/captura-de-tela-2025-10-23-125020.png", "url_hash": "99d4ab8705468f52a27fc343bc245bd0", "title_hash": "8143dffca0e0a655f73c80dbaf4a177a", "corroboration": 1, "relevance_score": 0.2446, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3773, "headline_en": "Uberlândia City Hall Releases Workers Early for Brazil vs Japan World Cup Match", "headline_pt": "Prefeitura de Uberlândia libera servidores mais cedo para jogo Brasil x Japão", "one_liner_en": "Uberlândia's city hall is letting public servants leave early to watch Brazil's knockout-stage match against Japan.", "one_liner_pt": "A Prefeitura de Uberlândia libera servidores mais cedo para acompanhar o jogo do Brasil contra o Japão na Copa.", "category": "Brazil", "region": "brazil", "rationale": "World Cup fever reshaping public administration schedules is a light but culturally resonant Brazil story.", "low_signal": true}, {"title let lang = 'en';
function t(key) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS['en'][key] || key; }

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
