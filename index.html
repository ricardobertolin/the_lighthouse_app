<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

</svg>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
      <button id="j-lang-pt" class="lang-btn" onclick="setLang('pt')">PT</button>

    <span class="mast-rule mast-rule-l"><span class="mast-rule-line"></span><span class="mast-rule-gem">&#9670;</span></span>

    <span class="mast-rule mast-rule-r"><span class="mast-rule-gem">&#9670;</span><span class="mast-rule-line"></span></span>

    <span>Curitiba, Paran&aacute;</span>

  <div class="forecast">

      <div class="fx-panel-left">
        <span class="fx-kicker" id="j-fx-kicker">The Weather</span>
        <span class="fx-condition" id="j-wx-cond">Overcast Skies</span>
        <span class="fx-strapline" id="j-fx-strapline">Curitiba &amp; the Paran&aacute; highlands</span>
      </div>
      <div class="fx-stats" id="j-wx-stats">
        <span><b>HIGH</b> --&deg;</span><span><b>LOW</b> --&deg;</span><span><b>WIND</b> --</span>

  <!-- SECTION NAV -->
  <div class="section-nav" id="j-nav"></div>

  <!-- FILTER STRIP -->
  <div class="filter-strip">

    <label class="flt-check-lbl">

  <div class="briefing" id="j-briefing" style="display:none;">

  </div>

  <!-- STATS -->

  <!-- ARTICLE LIST -->
  <div id="j-list"></div>

  <!-- EDITION FOOTER -->

41, "headline_en": "The Volcanic Eruption That Produced the Loudest Sound in Recorded History", "headline_pt": "A Erupção Vulcânica Que Produziu o Som Mais Alto da História", "one_liner_en": "A recent Indonesian volcanic eruption recalls the catastrophic 1883 Krakatoa blast, history's loudest recorded sound.", "one_liner_pt": "Erupção recente na Indonésia evoca o devastador Krakatoa de 1883, o som mais alto já registrado na história.", "category": "Science", "region": "world", "rationale": "A new eruption at the same Indonesian site reignites interest in the 1883 Krakatoa disaster, one of history's most destructive natural events.", "low_signal": true}, {"title": "A erupção vulcânica que produziu o som mais alto registrado na história", "summary": "<img src=\"https://s2-g1.glbimg.com/Tf9DgFWiNSKEyNVkSfWpfP__qio=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/6/l/g8lNDcTTimAxs2T5A6AA/5766d526-9c5d-4dea-b294-4364d9f611f8.png\" /><br />     A erupção do vulcão Krakatoa matou mais de 36 mil pessoas\nHulton Archive/Getty Images\nNo começo de julho, um vulcão na Indonésia entrou em erupção e lançou colunas de cinzas de até 250 metros de altura, segundo a imprensa local.\nO vulcão Anak Krakatau entrou em erupção duas vezes: uma em 2 de julho e outra em 3 de julho, segundo reportagens que citam a agência geológica da Indonésia. Um grupo responsável pelo monitoramento da atividade vulcânica na região informou que não havia ameaça imediata às comunidades próximas.\nO Krakatau surgiu em 1927 a partir de uma grande cratera submarina, conhecida como caldeira, deixada pela erupção do vulcão Krakatoa, a segunda mais letal já registrada na história. Em indonésio, Anak Krakatau significa \"Filho do Krakatoa\".\nA erupção de 1883 matou mais de 36 mil pessoas e destruiu 165 vilarejos em menos de 48 horas.\nAgora no g1\nTambém produziu o que é considerado o som mais alto já registrado. A explosão pôde ser ouvida a milhares de quilômetros de distância e lançou tanta cinza na atmosfera que reduziu as temperaturas em todo o planeta por anos.\nA BBC relembra um dos piores desastres naturais da história registrada.\n'Não dava para enxergar a própria mão diante do rosto'\nOs primeiros sinais da tragédia foram observados em maio de 1883, segundo os Centros Nacionais de Informação Ambiental dos Estados Unidos (NCEI, na sigla em inglês).\nO comandante de um navio de guerra alemão passava pela região quando viu nuvens de cinzas e poeira saindo do Krakatoa.\nAté então, o vulcão permanecia inativo havia cerca de 200 anos.\nNos meses seguintes, outros navios, incluindo embarcações comerciais, registraram relatos semelhantes.\nEntão, em 26 de agosto daquele ano, começaram as erupções.\nA primeira grande explosão do Krakatoa lançou fluxos de lava, pedra-pomes e cinzas em direção ao mar. O material provocou uma onda gigante que avançou para o norte, matando milhares de pessoas.\nEm menos de uma hora, a coluna de cinzas já alcançava 48 quilômetros de altura e se espalhava em todas as direções.\nNo auge da erupção, ela atingiu 80 quilômetros de altura, cobriu uma área de cerca de 777 mil quilômetros quadrados e mergulhou a região na escuridão por mais de dois dias, segundo o NCEI.\nNo auge da erupção, a coluna de cinzas atingiu 80 quilômetros de altura e encobriu o Sol na região por dois dias\nDEA / BIBLIOTECA AMBROSIANA / Contributor via Getty Images\nSidney Baker presenciou a erupção quando era menino, a bordo do navio do pai, e relembrou aquele momento, já no fim da vida. \"O ar parecia tomado por poeira, tanta que temíamos sufocar\", disse Baker à BBC em 1946.\n\"Ficou tão escuro que não dava para enxergar a própria mão diante do rosto. As cinzas começaram a cair sobre o navio, ao redor da embarcação e na água. Havia talvez de 15 a 18 centímetros de cinzas cobrindo todo o navio.\"\nBaker descreveu o barulho das explosões como \"inacreditável\".\n\"Não existem adjetivos capazes de descrever aquele estrondo e aquele caos\", afirmou Baker.\nSimon Winchester, autor do livro Krakatoa: o dia em que o mundo explodiu (Ed. Objetiva, 2004), disse que houve uma série de explosões em 27 de agosto antes da \"explosão titânica\" das 10h02. Segundo o NCEI, ela foi ouvida até na Austrália e na ilha Maurício, a mais de 4,6 mil quilômetros de distância.\n\"Toda a ilha, cerca de 25 quilômetros cúbicos de rocha, praticamente se vaporizou numa explosão que lançou pedra-pomes e cinzas a até 29 quilômetros de altura. A ilha simplesmente desapareceu\", disse ao podcast Witness History (Testemunhas da História, em tradução livre), da BBC, em 2010.\n\"Por alguns segundos, abriu-se um enorme vazio no mar, que logo foi preenchido por trilhões de toneladas de água. Como a temperatura ali era extremamente elevada, essa água vaporizou instantaneamente e se transformou em vapor, provocando uma série de tsunamis gigantescos.\"\nO Anak Krakatau também entrou em erupção em 2018\nFERDI AWED/AFP via Getty Images\nEsses tsunamis foram a parte mais letal do desastre, respondendo por 34 mil das 36 mil mortes. Baker contou que ele e o pai seguiram para Anjer, na costa oeste de Banten, província da Indonésia. \"A cidade havia sido completamente submersa\", disse.\n\"Ouvi meu pai dizer que o hotel onde ele havia se hospedado ficou tão completamente coberto pela água que era possível passar com o navio por cima dele e lançar a âncora pela chaminé.\"\nAlgumas pessoas conseguiram sobreviver aos tsunamis e fugir para as colinas.\nMas, embora estivessem protegidas da água, não escaparam totalmente dos fluxos piroclásticos — avalanches rápidas de gases vulcânicos superaquecidos, cinzas e fragmentos de rocha que se deslocam rente ao solo — que chegaram depois.\nOs efeitos do Krakatoa não se limitaram àquelas 48 horas. As cinzas se espalharam pelo mundo, criando um halo ao redor do Sol e da Lua e funcionando como um filtro para a radiação solar. Segundo o NCEI, isso reduziu a temperatura média global em até 0,5°C, e o clima levou cinco anos para voltar ao normal.\nAs partículas lançadas na atmosfera também deixaram amanheceres e entardeceres avermelhados em diferentes partes do mundo, porque passaram a dispersar a luz de uma forma incomum. O fenômeno aparece retratado em pinturas da época. Alguns especialistas acreditam, inclusive, que o céu vermelho do quadro O Grito, de Edvard Munch, tenha sido inspirado por esse efeito.\nApesar de toda a destruição, a erupção também trouxe um avanço importante da ciência.\nAlguns especialistas acreditam que os entardeceres avermelhados provocados pela erupção do Krakatoa inspiraram o céu retratado por Edvard Munch em O Grito\nDidier Lebrun / Photonews via Getty Images\nAntes dela, ninguém conhecia as correntes de jato (jet streams) — correntes de ar invisíveis que circulam nas camadas mais altas da atmosfera e desempenham papel fundamental no clima. A dimensão dos efeitos atmosféricos provocados pelo Krakatoa mudou esse entendimento.\n\"Foi o primeiro acontecimento que fez a humanidade com consciência científica perceber que um evento podia afetar o planeta inteiro\", disse Simon Winchester.\n\"Foi assim que surgiu a percepção de que o mundo é um sistema interligado. Ideias que hoje parecem naturais, como o aquecimento global e a elevação do nível do mar, têm origem nessa percepção de que tudo está conectado. Essa forma de entender o planeta começou com a erupção do Krakatoa.\"", "url": "https://g1.globo.com/meio-ambiente/noticia/2026/07/13/a-erupcao-vulcanica-que-produziu-o-som-mais-alto-registrado-na-historia.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-13T11:28:01+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/Tf9DgFWiNSKEyNVkSfWpfP__qio=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/6/l/g8lNDcTTimAxs2T5A6AA/5766d526-9c5d-4dea-b294-4364d9f611f8.png", "url_hash": "18dc24c0770c87a25cf301cb243a1994", "title_hash": "e1f7e396df5ad33395c59d58019be8c4", "corroboration": 2, "relevance_score": 0.0663, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4881, "headline_en": "The Volcanic Eruption That Produced the Loudest Sound in Recorded History", "headline_pt": "A Erupção Vulcânica Que Produziu o Som Mais Alto da História", "one_liner_en": "The 1883 Krakatoa eruption killed over 36,000 people and remains the loudest sound ever recorded.", "one_liner_pt": "A erupção do Krakatoa em 1883 matou mais de 36 mil pessoas e segue sendo o som mais alto já registrado.", "category": "Science", "region": "world", "rationale": "Near-duplicate of index 0; the same story republished on G1 with slightly more detail about the death toll.", "low_signal": true}, {"title": "A ascensão da 'femosfera': mulheres que renunciam ao romance e buscam homens de 'alto valor'", "summary": "Movimento encoraja as mulheres a 'despertarem' para os relacionamentos heterossexuais e a se protegerem com regras rígidas, cálculos emocionais e margem zero para erros.", "url": "https://www.bbc.com/portuguese/articles/cly978w54k9o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-07-13T10:00:35+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/090d/live/97c95040-7a19-11f1-b976-0b9c15b0ccfc.jpg", "url_hash": "f4b756c70c19de93704355fad9690b35", "title_hash": "5d846bab7b43848442fa52119edd6682", "corroboration": 2, "relevance_score": 0.0455, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4778, "headline_en": "The Rise of the 'Femosphere': Women Rejecting Romance for 'High-Value' Men", "headline_pt": "A 'Femosfera': Mulheres que Renunciam ao Romance em Busca de Homens de 'Alto Valor'", "one_liner_en": "An online movement urges women to approach relationships with strict rules and zero tolerance for mistakes.", "one_liner_pt": "Movimento online incentiva mulheres a adotarem regras rígidas e cálculo emocional nos relacionamentos heterossexuais.", "category": "Culture", "region": "world", "rationale": "The 'femosphere' trend is gaining traction globally as a counterpart to male online relationship ideologies.", "low_signal": false}, {"title": "A ascensão da 'femosfera': mulheres que renunciam ao romance e buscam homens de 'alto valor'", "summary": "<img src=\"https://s2-g1.glbimg.com/ZJZDnZH6oGC4ZOyaPfXas7E63SE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/3/4/sOMYctST65Udy2AYowQA/a48f01de-662d-40bc-a31b-f1fe48523e6a.png\" /><br />     As influenciadoras da 'femosfera' dizem que o romantismo deve ser deixado de lado e os homens devem ser avaliados como se fossem um ativo de risco\nGetty Images/BBC\nO homem deve ser um cavalheiro e a mulher deve ser cortejada. Ela deve se vestir bem, ele deve pagar a conta. Ele toma a iniciativa, ela se faz de difícil. E nada de sexo sem compromisso prévio.\nConselhos que muitas mulheres já ouviram, seja no passado, quando prevaleciam regras rígidas de namoro, ou mais tarde, apesar das mudanças trazidas pelo movimento de emancipação feminina e pela subsequente revolução sexual.\nO livro 35 Regras Para Conquistar O Homem Perfeito de Ellen Fein e Sherrie Schneider (publicado no Brasil pela editora Rocco, em 1997), por exemplo, fez sucesso ao oferecer táticas para conquistar o homem dos sonhos, que incluíam nunca falar com ele primeiro ou ligar para ele; nunca pagar a conta e nem mesmo dar beijos apaixonados no primeiro encontro.\nMas agora estamos na era da internet... e da inquietação, tudo é mais extremo e um pouco mais amargo.\nO que resta quando os conselhos da avó se cruzam com algoritmos e o desencanto coletivo?\nA femosfera. Um ecossistema de influenciadoras, fóruns, podcasts e conselhos que convida as mulheres a repensarem o amor — despojando-o de quaisquer ilusões românticas — e a transformarem a forma como abordam os relacionamentos.\nMais do que isso: incentiva-as a \"tomar a pílula rosa\", uma referência à \"pílula vermelha\" do filme Matrix, que simbolizava o acesso a uma realidade oculta.\nNo caso da rosa, essa realidade não está oculta, apenas velada. Os relacionamentos heterossexuais são estruturalmente desequilibrados em favor dos homens, argumentam, portanto devemos aprender a reconhecer padrões masculinos, elevar os padrões e evitar relacionamentos prejudiciais.\nA metáfora do filme já havia sido apropriada pela machosfera, movimento que reúne uma seleção diversificada de homens que se sentem ameaçados pelas mulheres e reagem com atitudes e discursos agressivos.\nAgora no g1\nPara eles, a pílula vermelha simboliza o despertar daqueles que \"enxergam\" a suposta manipulação feminina e um sistema que — acreditam eles — prejudica os homens.\nEssa reapropriação e inversão de termos feita pela femosfera não é incomum. Afinal, é, em parte, uma reação à agressão desse obscuro submundo masculino.\nAssim, ao analisar ambos os fenômenos, percebe-se rapidamente semelhanças, mas também diferenças profundas.\nA diferença mais fundamental, como enfatizado pela pesquisadora Jilly Kay, que cunhou o termo \"femosfera\", é que ela \"não representa o mesmo tipo de ameaça social ou violência no mundo real\" que a machosfera.\n\"Embora certas comunidades reproduzam algumas das táticas e da linguagem, ou por vezes desumanizem os homens da mesma forma que eles fazem com as mulheres, isso não significa que sejam equivalentes\", disse ela à BBC News Mundo, serviço de notícias em espanhol da BBC.\nA machosfera, explica a especialista em estudos feministas de cultura e mídia da Universidade de Loughborough, no Reino Unido, é uma exacerbação da violência masculina contra as mulheres, um problema social endêmico.\n\"As mesmas condições sociais não existem para que a femosfera provoque uma ameaça de violência feminina em massa contra os homens.\"\nÉ preciso adotar uma abordagem mais distanciada e calculista em relação aos encontros amorosos e não se deixar levar por falsas promessas, dizem as adeptas da femosfera\nGetty Images/BBC\nO que aconteceu, destaca Kay, foi que as redes sociais permitiram que elas compartilhassem experiências e, encontrando tantas semelhanças em tantos lugares, concluíram \"que todos os homens são e sempre serão fundamentalmente terríveis, e que não há nada que se possa fazer para mudá-los social ou emocionalmente, então elas tiveram que se unir, planejar e agir de uma maneira implacavelmente egoísta\".\nAinda assim, Onyinyechi Ezeanowi, ativista dos direitos das mulheres e especialista em ambientes digitais, enfatiza: \"Não existe um equivalente feminino da machosfera. Não temos mulheres ensinando outras mulheres a abusar ou a serem violentas com os homens.\"\n\"Estamos ensinando-lhes o empoderamento, para que possam se defender e lutar por seus direitos e igualdade\", disse ela em conversa com a BBC África.\nEmbora Ezeanowi não se identifique com muitas das ideologias da femosfera, ela compreende a sua direção.\nA BBC News Mundo, serviço em espanhol da BBC, também tentou entender.\nRealidade brutal\nSe tomarmos a pílula rosa, a primeira coisa que entenderemos é que, apesar de todas as lutas das mulheres, o mundo continua a funcionar a favor dos homens.\nA disparidade salarial e previdenciária continua enorme, poucas mulheres conseguiram alcançar cargos de destaque em qualquer área, e o sistema judiciário ainda não responde adequadamente a casos de violência doméstica, estupro, assédio ou abuso.\nAlém disso, na perspectiva da femosfera, as feministas do passado encorajaram as mulheres a se comportarem como homens, e isso acabou beneficiando-os.\nElas apontam, por exemplo, que sexo casual é exatamente o que eles procuram, ou que na vida de um casal o fardo do trabalho doméstico e emocional continue a recair principalmente sobre os ombros das mulheres, mesmo que elas tenham um emprego, o que as deixa exaustas e não empoderadas.\nSe você está percebendo ecos do feminismo tradicional, você está certo. De fato, muitas figuras na femosfera se identificam como feministas, mas suas reações e estratégias diante da situação são distintas.\n\"Eles rejeitam o princípio da igualdade porque este os decepcionou, então a ideia de ser realista é a filosofia subjacente: você precisa acordar para essa verdade brutal\", explica Kay.\nSe a igualdade de gênero é uma ilusão inatingível, \"a única coisa que você pode fazer é aceitar essa ideia muito tradicional de que homens e mulheres têm papéis muito definidos e diferentes na sociedade\".\nJilly Kay tem pesquisado uma mudança entre as mulheres jovens, cuja reação às circunstâncias criou novos espaços online\nArquivo pessoal/Jilly Kay\nAssim como na machosfera, na femosfera os gêneros são considerados distintos, tanto física quanto psicologicamente, o que, para a primeira, prova que as mulheres são inferiores e, para a segunda, que os homens são o problema.\nMas, em vez de tentar consertar o sistema politicamente, como era feito antigamente, a femosfera ensina as mulheres a manipulá-lo individualmente.\nA ideia seria que, se cada mulher se cuidar e evitar cair em situações indesejáveis, haverá mudanças, porque homens de baixo valor não encontrariam vítimas.\nE aí nos deparamos com um dos vários rótulos que precisam ser compreendidos para navegar nesse mundo que tem como lar as redes sociais, mas que também se materializa em livros.\nPalavras, palavras, palavras\nÉ importante esclarecer que a femosfera é diversa, portanto, nem todas as comunidades que se identificam com uma ou outra influenciadora, ou com espaços como o podcast Female Dating Strategy (\"Estratégia para mulheres em encontros\", em tradução livre), seguem exatamente o mesmo roteiro.\nMas, para nos orientarmos, é útil compreender certos conceitos e classificações tão reconhecidos nessas áreas que não necessitam de explicação.\nNa femosfera, as mulheres são incentivadas a se tornarem a melhor versão de si mesmas, indo à academia, estudando, vestindo-se bem e curando seus traumas.\nAlém disso, elas precisam se descentralizar, ou seja, focar na sua independência financeira e paz de espírito, em vez de deixar que tudo gire em torno do romance e que os homens sejam o centro de suas vidas.\nO objetivo é se tornar uma MAV, ou Mulher de Alto Valor, e isso acontece quando ela deixa de ver o desenvolvimento pessoal como um presente para o mundo e passa a vê-lo como um ativo estratégico que exige um investimento equivalente por parte dos homens.\nSe, por outro lado, depois de tanto esforço ela continuar aceitando migalhas ou implorando por amor, a femosfera a classifica como uma \"pick-me\" ou uma mulher ingênua — o termo \"pick me girl\" costuma ser usado para descrever uma mulher que busca aprovação masculina de forma desesperada.\nAssim, a MAV é uma mulher que, após avaliar friamente seu próprio capital estético, social e psicológico, conhece seu valor e não se deixa explorar pelo mercado de encontros.\nEssas MAVs estão à procura de HAVs, homens de alto valor.\nEle é o homem ideal segundo a filosofia dela: provedor, financeiramente estável, emocionalmente maduro, respeitoso, leal, protetor e generoso.\nSeu oposto, o homem de baixo valor (MBV), é mesquinho ou não possui os meios financeiros, a estabilidade emocional ou o instinto protetor para sustentar uma mulher; ele não quer progredir ou exige atenção sem dar nada em troca.\nSe o homem não estiver à altura, deve ser descartado imediatamente: nesta versão fria – quase contábil – do amor, não há segundas chances\nGetty Images\nEssas definições abrangem muitas outras coisas, e existem muitos outros termos, mas no final há uma equação: em qualquer relacionamento, o homem tem que somar, não subtrair.\nE embora possa parecer um pouco contraditório, muitos desses espaços repletos de mulheres empoderadas falam principalmente sobre estratégias para encontrar um parceiro. Mas com cuidado.\nRegras a seguir\nExistem vários aspectos que são frequentemente questionados a respeito deles, por exemplo, a afirmação de que \"todos os homens são iguais\".\nA resposta é: \"É claro que sabemos que nem todos são iguais, mas se eu lhe desse um saco de doces e dissesse que 10% deles estão envenenados... você não examinaria cada um com muito cuidado antes de comê-los?\"\nÉ isso que elas aconselham a fazer, sem nenhuma piedade.\nAs normas, por exemplo, são inegociáveis: uma MAV não dá segundas chances.\nSe um homem sugere um primeiro encontro barato (como dar um passeio ou tomar um café) ou propõe dividir as despesas meio a meio, ele é imediatamente rejeitado.\nPor que o homem deveria pagar?\nOs motivos variam desde o maior poder aquisitivo que os homens geralmente possuem, até o cálculo de quanto ela investiu em maquiagem, depilação, roupas e cabeleireiro para aquele encontro.\nTudo parece muito frio? Bem, sim, e daí? Essa é a situação. As mulheres não podem continuar indo para a batalha armadas com rosas, dizem.\nO distanciamento e o autocontrole emocional são um dos mecanismos de defesa: eles não são motivados pela necessidade de aprovação ou pelo medo da solidão.\nSe um homem diminui seu esforço ou exibe comportamento questionável, a MAV se retira sem drama, explicações ou lágrimas. Sua atenção é vista como um recurso escasso.\nE nada de se apaixonar ou se deixar enganar.\nEmbora seja apresentado como um jogo transacional manipulador e cru, o curioso é que esses filtros podem servir como um colete à prova de balas emocional para garantir que o homem com quem elas se sentam à mesa não seja um narcisista, um golpista ou um abusador.\nIndivíduos narcisistas e abusivos, por exemplo, usam a tática do love bombing (\"bombardeio de amor\", em tradução livre): dizem à vítima que ela é o amor de sua vida na primeira semana, saturando-a com poemas, atenção e promessas vazias.\nDiversas criadoras de conteúdo alertam sobre os riscos e instruem suas seguidoras a manterem uma distância psicológica. Ao avaliar o homem com base puramente em fatos tangíveis e comprovados pelo tempo, a manipulação emocional do abusador é neutralizada.\nSe o homem não consegue cumprir suas promessas com um comportamento respeitoso e protetor a longo prazo, o filtro o expulsa antes que a mulher fique psicologicamente presa.\nSe você observar as rígidas \"regras de etiqueta\" que essas gurus impõem para primeiros encontros, verá que elas coincidem com os manuais de prevenção de agressão sexual da polícia e de organizações de apoio às vítimas:\nÉ proibido às mulheres irem à casa de um homem, ou convidá-lo para a sua, durante os primeiros meses. E é proibido que ele as busque de carro: exige-se que a mulher chegue sozinha a um local público e movimentado.\nEmbora sirvam para \"fingir dificuldade\", do ponto de vista logístico, garantem que a mulher mantenha total controle de sua mobilidade física, eliminando o risco de ficar presa em um espaço privado onde esteja vulnerável a agressões sexuais ou físicas.\nEntre o desencanto e a resignação\nSer uma coisa e outra ao mesmo tempo parece ser uma característica da femosfera.\nQuando você se choca com a linguagem crua que elas usam para falar de amor, de repente elas dizem algo que faz sentido. Quando elas falam de homens como objetos com valor comercial, você percebe que elas também estão pedindo para serem valorizadas e respeitadas.\nPodem causar repulsa, mas também podem fazer você rir às gargalhadas.\nPara Kay, a femosfera reage a algo real: o namoro heterossexual, diz ela, é genuinamente difícil para as mulheres, devido à normalização da pornografia misógina, aos aplicativos de namoro — que trazem à tona o pior do comportamento humano — e à ameaça persistente de violência sexual.\nO problema, ela destaca, é como o diagnóstico é resolvido: \"Estupro e violência sexual são frequentemente vistos como comportamentos inatos em alguns homens [...] então você não pode fazer nada além de evitar esses homens de baixo valor, porque eles sempre estarão por perto.\" Não há espaço, diz ela, para pensar que a sociedade possa mudar; a violência se torna algo quase biológico, inevitável.\nA femosfera, acrescenta, \"é uma mistura estranha e complexa de algumas ideias feministas, com as quais é difícil discordar, mas com soluções muito reacionárias para o problema\".\n\"Confusa é a palavra que melhor descreve a situação.\"\nO que Kay lamenta é que \"é uma ideia muito realista, mas, em última análise, muito fatalista. É a ideia de que devemos abandonar a política e desistir de qualquer tentativa de melhorar a sociedade.\"\nE ela teme que seja isso que as mulheres jovens começarão a entender por feminismo.\nEla destaca que existem outras comunidades que não adotam a visão de que homens e mulheres estarão fundamentalmente sempre em guerra uns com os outros, e que nada pode mudar isso.\nMas, conclui, \"há algo nos meios digitais atualmente que parece suscetível a esse tipo de lógica mais reacionária\".\nE aí está a femosfera: a meio caminho entre um manual de autoajuda e um relatório de guerra, prometendo proteger o coração enquanto, no fundo, continua à espera da mesma coisa que qualquer história de amor para a vida toda: que apareça alguém que valha a pena.", "url": "https://g1.globo.com/saude/saude-mental/noticia/2026/07/13/a-ascensao-da-femosfera-mulheres-que-renunciam-ao-romance-e-buscam-homens-de-alto-valor.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-13T11:33:28+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/ZJZDnZH6oGC4ZOyaPfXas7E63SE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/3/4/sOMYctST65Udy2AYowQA/a48f01de-662d-40bc-a31b-f1fe48523e6a.png", "url_hash": "bd70b62797688b9213ad163c95275cec", "title_hash": "5d846bab7b43848442fa52119edd6682", "corroboration": 2, "relevance_score": -0.0092, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4504, "headline_en": "The Rise of the 'Femosphere': Women Rejecting Romance for 'High-Value' Men", "headline_pt": "A 'Femosfera': Mulheres que Renunciam ao Romance em Busca de Homens de 'Alto Valor'", "one_liner_en": "Femosphere influencers tell women to treat men li // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

  const vol  = toRoman(year - 1900);

    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

function renderBriefing() {
  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =

}

    const corr   = art.corroboration || 1;

      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +

      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +

          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +

          corrMeta +

        '</div>' +

          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
