<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

</svg>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>

 fortalecerão Lula", "one_liner_en": "Paul Krugman argues Trump's tariffs against Brazil will fail and inadvertently boost President Lula's political standing.", "one_liner_pt": "Paul Krugman afirma que as tarifas de Trump contra o Brasil fracassarão e fortalecerão politicamente o presidente Lula.", "category": "Economy", "region": "brazil", "rationale": "A Nobel Prize-winning economist publicly critiquing a major US trade policy targeting Brazil is significant for bilateral relations and Brazilian politics.", "low_signal": false}, {"title": "Tarifas de Trump não vão funcionar e fortalecerão Lula, diz Nobel de Economia", "summary": "<img src=\"https://s2-g1.glbimg.com/7ntHVCTB9o-5tQInvHSSc0wPSbo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/H/w/puYsQZQ92CyZBtDSkN4w/e3485e30-670a-11f0-86bc-f75ca3f46b17.jpg\" /><br />     Vencedor do prêmio Nobel de economia elogiou o Pix\nGetty Images via BBC\nO economista americano Paul Krugman publicou um artigo nesta segunda-feira (20/7) no qual afirma que as tarifas impostas pelo governo Donald Trump ao Brasil não vão funcionar - e vão fortalecer o governo do presidente Luiz Inácio Lula da Silva. \n🗒️ Tem alguma sugestão de reportagem? Mande para o g1\n\"Usar as tarifas para punir o Brasil por suas conquistas monetárias não terá sucesso\", afirma o economista, em artigo publicado no site Substack. Confirmadas na semana passada, as tarifas entram em vigor na próxima quarta-feira (22/07).\nAgora no g1\nKrugman, que há exatamente um ano publicou um texto no qual classificou o PIX como \"dinheiro do futuro, pontua que as tarifas vão fortalecer politicamente o presidente Lula. \n\"Economicamente, o alcance das tarifas será limitado\", afirma, ao citar os temores do governo Trump em relação aos preços do café, suco de laranja, carne bovina, entre os produtos - alguns dos principais exportados pelo Brasil aos EUA.\nRelatório do Banco Central dos EUA de 2022 afirmou que o PIX é uma moeda digital\nGetty Images via BBC\nKrugman, que ganhou o Nobel de Economia em 2008 e é professor da Universidade da Cidade de Nova York, afirma que o governo Trump tenta punir o Brasil pelo sucesso do PIX. \"Por que é injusto um país oferecer a seus cidadãos uma maneira melhor de fazer compras e pagar contas?\", questiona o economista em seu artigo.\n\"De certa forma, a administração Trump ainda tenta punir o Brasil por ser uma verdadeira democracia\", diz Krugmann em seu texto. \"Ao contrário dos EUA, o Brasil processou seu ex-presidente, Jair Bolsonaro, por tentar fomentar uma revolta após perder a última eleição\", continua o economista.\nKrugman já havia publicado um artigo no qual afirmou que o Brasil pode ter inventado o dinheiro do futuro\nGetty Images via BBC\nEm seu artigo, o economista afirma também que a hostilidade de Trump em relação ao PIX ilustra a mesma posição do presidente dos EUA em relação à política energética. \"Este governo se opõe ao progresso, sempre que o progresso contraria os interesses e a ideologia dos oligarcas que investiram dinheiro na campanha de Trump e no seu bolso\", diz.\nKrugman cita ainda um relatório do Fed (o Banco Central dos EUA) de 2022, que afirma que o PIX é uma moeda digital do Banco Central do Brasil, \"análoga ao dinheiro de papel\". \nO economista questiona também: \"Mas desde quando é uma prática comercial desleal uma empresa perder clientes para um concorrente que oferece um produto melhor e mais barato?\". E continua, com a pergunta: \"Deveríamos fechar o serviço postal dos EUA porque ele oferece um serviço de entregas melhor e mais barato do que a UPS e a FedEx?\"\nNo artigo, Krugman cita que o governo Trump estaria preocupado com o fato de o PIX e outros sistemas de pagamentos similares desafiarem a hegemonia internacional do dólar. \nMas, para o economista, o Brasil é um ator \"pequeno demais para provocar impacto no sistema global de pagamentos\". No entanto, argumenta Krugman, o dólar pode enfrentar um desafio real caso o Banco Central Europeu conseguir adotar um euro digital em 2029, como planejado. \"Se isso acontecer, não é difícil imaginar que um número significativo de transações antes feitas em dólar passarão a ser feitas em euros digitais\", escreve Krugman.\nO Nobel de Economia continua: \"o motivo pelo qual as pessoas podem optar pelo euro digital é porque os EUA não vão oferecer um meio de pagamento igualmente bom. Por que não vai ter um dólar digital?\", questiona. E ele mesmo responde. \"Não porque seja uma má ideia - como o Brasil demonstrou, seria uma ótima ideia. Mas existem poderosos grupos de interesse que se opõem a qualquer iniciativa desse tipo.\nNa conclusão de seu artigo, Krugman cita o argumento da economista brasileira Monica de Bolle, para quem as tarifas fortalecem a posição do governo brasilero. Em entrevista à BBC News Brasil na semana passada, De Bolle avaliou que o impacto das tarifas de Trump deve ser restrito.\n\"Mas a evidente insensatez dessas novas tarifas não impedirá que elas aconteçam. O governo Trump declarou guerra ao futuro\", conclui Krugman, ao afirmar que o presidente dos EUA nunca admite quando suas guerras fracassam.", "url": "https://g1.globo.com/economia/noticia/2026/07/20/tarifas-de-trump-nao-vao-funcionar-e-fortalecerao-lula-diz-nobel-de-economia.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-20T11:51:02+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/7ntHVCTB9o-5tQInvHSSc0wPSbo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/H/w/puYsQZQ92CyZBtDSkN4w/e3485e30-670a-11f0-86bc-f75ca3f46b17.jpg", "url_hash": "e7aa6129301154a7ea806cd82fa73875", "title_hash": "3cc29a42c20c32bdd298848ebaac98bc", "corroboration": 2, "relevance_score": 0.1099, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5099, "headline_en": "Nobel Economist: Trump Tariffs Won't Work and Will Strengthen Lula", "headline_pt": "Nobel de Economia: Tarifas de Trump não funcionarão e fortalecerão Lula", "one_liner_en": "Paul Krugman argues Trump's tariffs against Brazil will fail and inadvertently boost President Lula's political standing.", "one_liner_pt": "Paul Krugman afirma que as tarifas de Trump contra o Brasil fracassarão e fortalecerão politicamente o presidente Lula.", "category": "Economy", "region": "brazil", "rationale": "Near-duplicate of index 0 from a different source; same story covered by G1.", "low_signal": true}, {"title": "Análise: Burnham é o 5º premiê em 4 anos — e agora tenta contrariar tendência no Reino Unido", "summary": "Determinado a começar o mandato em ritmo acelerado, o ex-prefeito espera manter o estilo de liderança que adotou como prefeito de Manchester.", "url": "https://www.bbc.com/portuguese/articles/c62v96ndnjvo?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-07-20T10:54:14+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/e938/live/c621de70-8429-11f1-926f-c90d1bcfbc84.jpg", "url_hash": "91b49c91f46b3bcc1e14997224684471", "title_hash": "e05121f8df53021d7ce521a4bf021eaf", "corroboration": 2, "relevance_score": 0.0162, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4631, "headline_en": "Andy Burnham Becomes UK's Fifth Prime Minister in Four Years", "headline_pt": "Andy Burnham se torna o 5º premiê do Reino Unido em quatro anos", "one_liner_en": "Former Manchester mayor Andy Burnham takes office as UK PM, vowing a fast-paced start to counter political instability.", "one_liner_pt": "Ex-prefeito de Manchester Andy Burnham assume como premiê do Reino Unido, prometendo ritmo acelerado de governo.", "category": "Geopolitics", "region": "world", "rationale": "A new British prime minister taking office is a major geopolitical event with global implications.", "low_signal": false}, {"title": "Análise: Burnham é o 5º premiê em 4 anos — e agora tenta contrariar tendência no Reino Unido", "summary": "<img src=\"https://s2-g1.glbimg.com/Qjq4-yi2Loj-fulW52zOT2f6Yxc=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/G/q/4OAqe2RnGgY21iAvCiuQ/28be34e0-83fb-11f1-bee8-53ce494e1abc.jpg-redimensionado-para-1200x675-1-.jpeg\" /><br />     Andy Burnham, ex-prefeito de Manchester, será o sétimo líder do país nos últimos 10 anos.\nGetty Images\nA partir desta segunda-feira (20), o Reino Unido passará a ter seu quinto primeiro-ministro em apenas quatro anos: Andy Burnham, ex-prefeito de Manchester.\nEssa frase resume bem o momento vivido pela política britânica.\n📱Favorite o g1 no Google e acompanhe as principais notícias do dia\nNo verão de 2022, o então primeiro-ministro britânico Boris Johnson já estava de saída, embora ainda permanecesse no cargo. Desde então, o Reino Unido já teve Liz Truss, Rishi Sunak e Keir Starmer como primeiros-ministros.\nNão por acaso, Burnham dirá mais tarde — segundo informações obtidas pela reportagem da BBC — que está \"plenamente consciente\" dessa constante troca de líderes no comando do governo britânico. A observação deve provocar sorrisos irônicos entre os seus críticos, dentro e fora do Partido Trabalhista, que há muito afirmam que Burnham vinha se preparando para chegar a esse momento.\nNos anos que se seguiram após o Brexit (a saída do Reino Unido da União Europeia) e a covid-19, muitos britânicos passaram a sentir que a vida ficou mais difícil — um momento que favoreceu sentimentos de impaciência com a classe política e perda de confiança nos partidos tradicionais.\nKeir Starmer deixa o cargo de primeiro-ministro do Reino Unido\nÉ esse o cenário que Burnham encontrará ao chegar a Downing Street, a sede do gabinete do primeiro-ministro, assim como aconteceu com Starmer há 746 dias, em outro ensolarado dia de julho, dois anos atrás.\nAgora, Burnham tenta romper essa sequência de governos impopulares.\nBurnham está determinado a assumir o cargo em ritmo acelerado e, sempre que possível, manter o estilo de liderança que adotou como prefeito da Grande Manchester.\nAs regras da Câmara dos Comuns e compromissos oficiais, como as audiências com o rei, provavelmente farão com que ele use terno com mais frequência do que nos últimos anos.\nMas outras convenções poderão ser descartadas intencionalmente. Ouvi dizer, por exemplo, que Burnham poderá abrir mão do tradicional púlpito para seu primeiro discurso como primeiro-ministro, em frente ao número 10 de Downing Street, na segunda-feira (20).\nTambém ouvi que ele pretende realizar sessões de perguntas e respostas com eleitores em diferentes partes do país — um formato que um aliado descreveu como People's Question Time (Hora de Perguntas do Povo, em tradução literal), em que Question Time faz referência tanto a um mecanismo oficial do Parlamento britânico (em que membros das duas Câmaras fazem perguntas a ministros do governo) quanto a um famoso programa de televisão (em que membros do público fazem perguntas a políticos). \nAntes do grande momento de Burnham, no entanto, virá a despedida de Starmer.\nAntes do grande momento de Burnham, no entanto, virá a despedida de Starmer\nReuters\nDepois de passar o seu último fim de semana no cargo em Chequers, a residência oficial de campo do primeiro-ministro em Buckinghamshire, Starmer fará um breve pronunciamento — desta vez, com púlpito — antes de seguir para uma audiência com o rei Charles 3º e formalizar a sua renúncia ao cargo.\nA expectativa é que Starmer destaque o que considera as suas principais realizações, tanto na política doméstica quanto no cenário internacional. Integrantes de sua equipe citam, com especial orgulho, a redução da imigração e das filas de espera do NHS (sistema público de saúde do Reino Unido) na Inglaterra, a retirada de crianças da pobreza e a criação da proibição do uso de redes sociais por adolescentes.\nAo longo da tarde e da noite, devem ser anunciadas as nomeações para o novo gabinete, incluindo, segundo apurou a reportagem, um ministro encarregado da área de inteligência artificial (IA).\nA principal expectativa gira em torno dos cargos mais importantes do governo, como os de chanceler do Tesouro (equivalente ao Ministro da Fazenda no Brasil), ministro do Interior e ministro de Relações Exteriores. Shabana Mahmood, Wes Streeting, Ed Miliband, Angela Rayner e Lucy Powell são apenas cinco dos nomes cotados. Que pastas eles receberão? E o que essas escolhas indicarão sobre a forma como Burnham pretende governar? A resposta virá em breve.\nTambém começaremos a ter uma ideia das prioridades imediatas do novo primeiro-ministro, entre elas o custo de vida e as contas de energia, além da forma como seu governo será estruturado. Até que ponto a equipe do número 10 de Downing Street será reforçada? E qual será a influência do chamado Nº 10 Norte, o escritório de Burnham em Manchester (em uma tentativa de descentralizar o poder de Londres)?\nO que acontecerá nas próximas horas já não é novidade, diante da frequência com que o Reino Unido trocou de primeiro-ministro nos últimos anos. Mas nem por isso deixa de ser um momento importante.\nO que for anunciado nas próximas horas terá grande impacto sobre a forma como o país será governado nas próximas semanas, meses e anos.", "url": "https://g1.globo.com/mundo/noticia/2026/07/20/analise-burnham-e-o-5o-premie-em-4-anos-e-agora-tenta-contrariar-tendencia-no-reino-unido.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-20T11:04:46+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/Qjq4-yi2Loj-fulW52zOT2f6Yxc=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/G/q/4OAqe2RnGgY21iAvCiuQ/28be34e0-83fb-11f1-bee8-53ce494e1abc.jpg-redimensionado-para-1200x675-1-.jpeg", "url_hash": "30cef01efa3f453521786258ebccde11", "title_hash": "e05121f8df53021d7ce521a4bf021eaf", "corroboration": 2, "relevance_score": -0.0153, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4474, "headline_en": "Andy Burnham Becomes UK's Fifth Prime Minister in Four rtando a diferença rapidamente.", "category": "AI", "region": "world", "rationale": "New competitive AI releases from China directly challenge US technological leadership in the world's most consequential emerging technology.", "low_signal": false}, {"title": "'Trump tentará punir Brasil por esse sucesso', diz Nobel de economia sobre ação do governo americano contra Pix", "summary": "<img src=\"https://s2-g1.glbimg.com/Dds0rxKSnS-Z5EysEYlnJB1u4W0=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/L/Q/eRTAqIRCmUPorOz7B6hA/globo-canal-4-20260603-1947-frame-107156.jpeg\" /><br />     Novas tarifas: EUA dizem que o PIX prejudica empresas americanas; setor financeiro, no Brasil, discorda\nJornal Nacional/ Reprodução\nO economista Paul Krugman, vencedor do Prêmio Nobel de Economia de 2008, criticou a investigação aberta pelo governo dos Estados Unidos contra o Pix e afirmou que a ofensiva representa uma tentativa de punir o Brasil pelo sucesso do sistema brasileiro de pagamentos instantâneos.\nEm artigo publicado nesta segunda-feira (20), Krugman afirma que o Pix se tornou uma referência mundial em pagamentos digitais e que a iniciativa do governo de Donald Trump não se sustenta do ponto de vista econômico.\n\"Trump tentará punir o Brasil por esse sucesso\", escreveu o economista ao comentar a investigação comercial aberta pela administração americana com base na Seção 301 da Lei de Comércio dos Estados Unidos.\nO governo americano incluiu o Pix entre os temas da investigação sobre supostas práticas comerciais brasileiras consideradas desleais. Criado pelo Banco Central, o sistema permite transferências e pagamentos instantâneos entre pessoas e empresas.\nPor que o PIX virou pretexto dos EUA no tarifaço\nPara Krugman, oferecer um sistema público de pagamentos mais barato e eficiente não configura uma prática comercial desleal.\n\"Por que seria desleal um país oferecer aos seus próprios cidadãos uma forma melhor de fazer compras e pagar contas?\", questiona.\nPix ampliou concorrência\nAo longo do artigo, o economista defende que o Pix aumentou a concorrência no mercado de pagamentos ao oferecer uma alternativa de baixo custo para consumidores e empresas.\nNa avaliação dele, a popularização do sistema reduziu a dependência de meios tradicionais de pagamento e afetou empresas como Visa e Mastercard. Isso, porém, seria resultado da concorrência entre tecnologias, e não de uma vantagem indevida.\n\"Desde quando é uma prática comercial desleal que empresas percam mercado para um concorrente que oferece um produto melhor e mais barato?\", escreveu.\nKrugman argumenta que a reação do governo americano reflete, em parte, a perda de espaço de empresas privadas diante de um sistema público considerado mais eficiente.\nDebate vai além do Pix\nO Nobel usa o caso brasileiro para defender sistemas públicos de pagamentos e moedas digitais emitidas por bancos centrais.\nSegundo ele, o sucesso do Pix demonstra que esse tipo de ferramenta pode tornar pagamentos eletrônicos mais baratos e eficientes. Já os Estados Unidos, afirma, ficaram para trás nesse debate devido à resistência política e à pressão de grupos ligados ao mercado de criptomoedas.\n\"A verdadeira preocupação deles é que ela funcione bem demais\", escreveu ao comentar a oposição à criação de um dólar digital.\nKrugman também compara o caso brasileiro à experiência de El Salvador com o Bitcoin. Para ele, enquanto o Pix se tornou amplamente utilizado pela população, a tentativa do governo salvadorenho de transformar a criptomoeda em um meio de pagamento de massa fracassou.\nTarifas terão alcance limitado, afirma\nNa parte final do artigo, Krugman avalia que as tarifas propostas pelo governo Trump dificilmente alcançarão os resultados pretendidos.\nSegundo ele, as medidas podem elevar os preços de produtos brasileiros consumidos pelos próprios americanos, como café, carne bovina e suco de laranja. Ao mesmo tempo, afirma que o Brasil tende a ampliar sua presença em outros mercados.\nKrugman cita a economista Monica de Bolle, pesquisadora do Peterson Institute for International Economics, para sustentar que, no balanço geral, as tarifas americanas fortaleceram a posição do Brasil no comércio internacional.\n\"O desvio do comércio global em reação às tarifas dos Estados Unidos transformou o Brasil em uma potência exportadora\", escreveu De Bolle, citada por Krugman. Como exemplo, ela menciona o aumento da participação brasileira nas exportações de soja para a China.\nAo concluir o artigo, Krugman faz uma crítica mais ampla à política econômica do governo Trump.\n\"O governo Trump declarou guerra ao futuro\", escreveu. \"E uma coisa que sabemos sobre Trump é que ele nunca admite quando suas guerras escolhidas fracassam.\"", "url": "https://g1.globo.com/economia/noticia/2026/07/20/trump-tentara-punir-brasil-por-esse-sucesso-diz-nobel-de-economia-sobre-acao-do-governo-americano-contra-pix.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-20T12:49:13+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/Dds0rxKSnS-Z5EysEYlnJB1u4W0=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/L/Q/eRTAqIRCmUPorOz7B6hA/globo-canal-4-20260603-1947-frame-107156.jpeg", "url_hash": "52b49ce4bf51821d88aa01c0e717f3cf", "title_hash": "526c43b786c720963ff402943e1e9368", "corroboration": 1, "relevance_score": 0.3218, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.4159, "headline_en": "Krugman: Trump Will Try to Punish Brazil for Pix's Success", "headline_pt": "Krugman: Trump tentará punir Brasil pelo sucesso do Pix", "one_liner_en": "Paul Krugman warns the US will target Brazil's Pix payment system, framing it as an attack on a homegrown financial innovation.", "one_liner_pt": "Paul Krugman alerta que os EUA vão mirar o sistema Pix, tratando isso como um ataque a uma inovação financeira brasileira.", "category": "Economy", "region": "brazil", "rationale": "Adds a specif ": "New road interventions starting Monday morning are causing significant traffic disruptions across Curitiba.", "one_liner_pt": "Novas intervenções viárias a partir desta segunda-feira causam alterações significativas no trânsito de Curitiba.", "category": "Other", "region": "curitiba", "rationale": "Directly relevant to daily commuters in Curitiba navigating new road blockages this morning.", "low_signal": false}, {"title": "Exportações de carne bovina batem recorde no 1º semestre, mas cota da China e restrições da UE preocupam setor", "summary": "<img src=\"https://s2-g1.glbimg.com/VEXzRhwU9R__IETxHtB1goDfppE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/4/y/fUzF51QMG2cVOkT12oUg/whatsapp-image-2026-03-16-at-08.21.45.jpeg\" /><br />     Assessoria do governo do Mato Grosso\nAs exportações brasileiras de carne bovina bateram recorde no primeiro semestre de 2026, mas o segundo semestre será mais desafiador para o setor por causa da cota de importação da China e de restrições da União Europeia, disse a Associação Brasileira de Frigoríficos (Abrafrigo) nesta segunda-feira (20).\nDe janeiro a junho, as vendas de carne bovina para outros países somaram US$ 9,929 bilhões, alta de 33,4% em relação ao mesmo período de 2025, segundo dados da Secretaria de Comércio Exterior (Secex), do Ministério do Desenvolvimento, Indústria, Comércio e Serviços (MDIC).\n🗒️Tem alguma sugestão de reportagem? Mande para o g1\nEm volume, os embarques chegaram a 1,811 milhão de toneladas, crescimento de 7,3%. Segundo a Abrafrigo, é o melhor resultado da série para um primeiro semestre, tanto em valor quanto em volume.\nApesar do desempenho, a entidade avalia que os resultados devem perder força no segundo semestre.\nO principal motivo é o esgotamento da cota de exportação de carne bovina para a China. A estimativa é que o limite de 1,106 milhão de toneladas destinado ao Brasil em 2026 tenha sido preenchido com os embarques realizados até junho.\nCom isso, segundo a Abrafrigo, os embarques para a China foram interrompidos em julho, já que os volumes exportados acima da cota são sobretaxados em 55%.\nAlém disso, o risco de suspensão das compras pela União Europeia a partir de 3 setembro. O bloco exige que o Brasil comprove que não utiliza antimicrobianos para promover crescimento em animais.\nVeto à carne do Brasil: por que a União Europeia quer mais controle sobre antibióticos na pecuária\nUE veta carne do Brasil a partir de 3 de Setembro\nChina segue como principal destino\nAs vendas de carne bovina para a China cresceram 50,3% no primeiro semestre de 2026, para US$ 4,818 bilhões.\nEm volume, o avanço foi de 22,6%, para 774,7 mil toneladas.\nO país respondeu por 48,5% das receitas obtidas com as exportações brasileiras de carnes e subprodutos bovinos. Considerando apenas a carne bovina in natura, a participação chegou a 53%.\nSegundo a Abrafrigo, o governo chinês contabilizou na cota as cargas que chegaram aos portos do país a partir de 1º de janeiro de 2026, mesmo que tivessem sido embarcadas no fim de 2025. Por isso, a entidade estima que o limite anual já tenha sido atingido.\nDiante desse cenário, a Abrafrigo projeta que o Brasil poderá reduzir em cerca de US$ 4 bilhões as vendas de carne bovina para a China em 2026, na comparação com 2025, quando as exportações para o país asiático somaram US$ 8,845 bilhões.\nA entidade afirma, porém, que essa queda poderá ser parcialmente compensada caso os embarques sejam retomados nos dois últimos meses do ano, com chegada das cargas aos portos chineses apenas em janeiro de 2027, dentro da cota do próximo ano.\nOutros mercados ajudam a compensar\nO avanço das vendas para outros mercados pode reduzir parte dos impactos da menor demanda chinesa.\nOs Estados Unidos, segundo maior comprador da carne bovina brasileira, aumentaram as importações em 14,76% no primeiro semestre, para US$ 1,465 bilhão.\nConsiderando apenas a carne bovina in natura, as compras americanas cresceram 41%, para US$ 1,116 bilhão, enquanto o volume embarcado avançou 17,3%, para 183,6 mil toneladas.\nSegundo a entidade, as perspectivas para o mercado americano seguem favoráveis porque a carne bovina ficou de fora das novas tarifas impostas pelos Estados Unidos aos produtos brasileiros. A Abrafrigo também lembra que o país ainda enfrenta baixa produção interna e preços elevados, o que pode favorecer as importações.\nO Chile, terceiro maior destino da carne bovina in natura brasileira, elevou as compras em 33,12%, para US$ 419,6 milhões, com aumento de 20% no volume embarcado, que chegou a 70,3 mil toneladas.\nUnião Europeia ainda negocia certificação\nAs compras da União Europeia de carne e subprodutos bovinos brasileiros cresceram 35,26% no primeiro semestre, para US$ 482,65 milhões.\nMesmo assim, o bloco poderá suspender as compras de carne bovina brasileira a partir de setembro, quando entram em vigor novas exigências sobre a comprovação de produção livre do uso de antimicrobianos no rebanho.\nSegundo a Abrafrigo, o Brasil ainda negocia com as autoridades sanitárias europeias um modelo de certificação que permita manter as exportações, mas, até o momento, não há resultados concretos.\nDiversificação de mercados\nAlém dos Estados Unidos e do Chile, outros mercados ampliaram as compras de carne bovina brasileira no primeiro semestre:\nRússia: 62 mil toneladas (+34,5%) e receita de US$ 283,8 milhões (+48,6%);\nHong Kong: US$ 227,15 milhões (+33,8%);\nArábia Saudita: US$ 192 milhões (+31,7%);\nEgito: US$ 179,8 milhões (+32,2%).\nO México, por outro lado, reduziu as compras em 8,13%, para US$ 253,8 milhões.\nSegundo a Abrafrigo, essa diversificação ganha importância diante das incertezas envolvendo China e União Europeia. No primeiro semestre, 118 países aumentaram as compras de carne bovina brasileira, enquanto 55 reduziram as aquisições.", "url": "https://g1.globo.com/economia/agronegocios/noticia/2026/07/20/exportacoes-de-carne-bovina-batem-recorde-no-1o-semestre-mas-cota function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

// ── Briefing ─────────────────────────────────────────────────────────
function renderBriefing() {
  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  const maxRel = Math.max(...DATA.articles.map(a => a.relevance_score || 0), 0.01);
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round(((art.relevance_score || 0) / maxRel) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
        '<div class="art-actions">' +
          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
