<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

<svg aria-hidden="true" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;">

    <feComponentTransfer in="s" result="bw">

    <feComponentTransfer in="bw">
      <feFuncR type="linear" slope="0.812" intercept="0.125"/>
      <feFuncG type="linear" slope="0.789" intercept="0.125"/>

    </feComponentTransfer>
  </filter>
</svg>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
      <button id="j-lang-pt" class="lang-btn" onclick="setLang('pt')">PT</button>

    <span class="mast-rule mast-rule-l"><span class="mast-rule-line"></span><span class="mast-rule-gem">&#9670;</span></span>

    <span class="mast-rule mast-rule-r"><span class="mast-rule-gem">&#9670;</span><span class="mast-rule-line"></span></span>
  </div>
  <div class="mast-date">
    <span>Curitiba, Paran&aacute;</span>
    <span class="mast-date-center" id="j-date"></span>

  <div class="forecast">
    <div class="fx-canvas" id="j-fx-canvas"></div>
    <div class="fx-panel">
      <div class="fx-panel-left">
        <span class="fx-kicker" id="j-fx-kicker">The Weather</span>
        <span class="fx-condition" id="j-wx-cond">Overcast Skies</span>
        <span class="fx-strapline" id="j-fx-strapline">Curitiba &amp; the Paran&aacute; highlands</span>
      </div>
      <div class="fx-stats" id="j-wx-stats">
        <span><b>HIGH</b> --&deg;</span><span><b>LOW</b> --&deg;</span><span><b>WIND</b> --</span>

  <!-- SECTION NAV -->
  <div class="section-nav" id="j-nav"></div>

  <!-- FILTER STRIP -->

  <div class="briefing" id="j-briefing" style="display:none;">

  <!-- STATS -->

  <!-- ARTICLE LIST -->
  <div id="j-list"></div>

const DATA = {"date": "2026-07-28", "intro_en": "Brazil's diplomatic tensions dominate today's news, with Argentina's Milei clashing with Lula and the Brazilian government denying visas to American election observers while China offers support. Domestically, pessimism is rising across 26 of 29 industrial sectors amid new Trump tariffs, and AI privacy concerns surface after hundreds of private Claude chatbot conversations were exposed publicly. Meanwhile, Curitiba pushes to remove railway tracks from 21 neighborhoods in a key infrastructure hearing.", "intro_pt": "As tensões diplomáticas do Brasil dominam as notícias de hoje, com Milei atacando Lula e o governo brasileiro negando vistos a observadores eleitorais americanos enquanto recebe apoio da China. No âmbito doméstico, o pessimismo cresce em 26 dos 29 setores industriais em meio a novas tarifas de Trump, e preocupações com privacidade surgem após centenas de conversas privadas com o chatbot Claude serem expostas publicamente. Curitiba reforça pedido de remoção de trilhos de 21 bairros em audiência crucial de infraestrutura.", "weather": {"location": "Curitiba, PR", "description": "Mainly clear", "temp_max": 26.1, "temp_min": 16.5, "precipitation_mm": 0.0, "wind_max_kmh": 17.7, "wmo_code": 1}, "articles": [{"title": "Como centenas de conversas privadas com chat de IA Claude acabaram disponíveis publicamente", "summary": "Links para os chats, alguns dos quais incluíam informações pessoais e profissionais, apareciam se um usuário de um mecanismo de busca como o Google usasse um termo de pesquisa específico do site.", "url": "https://www.bbc.com/portuguese/articles/cd6923x3vl4o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-07-28T10:45:32+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/98ad/live/107ee220-8a00-11f1-bf17-1d06aa0f4f93.jpg", "url_hash": "4368abef34a7d66ced282d3ab015f9eb", "title_hash": "19d635583a011d72ce0eb8f55455a9bd", "corroboration": 2, "relevance_score": 0.2323, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5711, "headline_en": "Hundreds of Private Claude AI Chats Exposed Publicly Online", "headline_pt": "Centenas de Conversas Privadas com IA Claude Ficam Disponíveis Publicamente", "one_liner_en": "Private Claude AI conversations, some with personal data, became searchable via Google through specific site queries.", "one_liner_pt": "Conversas privadas no Claude, algumas com dados pessoais, ficaram acessíveis via pesquisas específicas no Google.", "category": "AI", "region": "world", "rationale": "A major AI privacy breach exposing personal and professional user data raises urgent questions about chatbot data security.", "low_signal": false}, {"title": "Como centenas de conversas privadas com chat de IA Claude acabaram disponíveis publicamente", "summary": "<img src=\"https://s2-g1.glbimg.com/IO92sgdXeMq0-lR8lkjtr4vGjew=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/Z/S/0Z8GriQcSCetMtjjMIkg/77383030-906.jpg\" /><br />     Homem processa OpenAI e diz que ChatGPT reforçou delírio de que era Jesus Cristo\nCentenas de conversas de usuários com o popular chatbot de inteligência artificial (IA) da Anthropic, Claude, foram encontrados abertos para praticamente qualquer pessoa online.\nOs links para os chats, alguns dos quais incluíam informações pessoais e profissionais, apareciam se um usuário de um mecanismo de busca como o Google usasse um termo de pesquisa específico do site.\n🗒️Tem alguma sugestão de reportagem? Mande para o g1\nAs buscas mostraram que conversas do Claude, nas quais um usuário havia decidido \"compartilhar\" um link, foram salvas por mecanismos de busca como o Google, tornando-as acessíveis ao público em geral.\nA possibilidade de pesquisar os registros de bate-papo foi removida durante o fim de semana, mas muitos foram salvos e amplamente compartilhados online.\nUma porta-voz da Anthropic afirmou que os usuários do Claude mantêm o controle sobre se e quando compartilhar as conversas que tiveram com o chatbot.\nEla disse que os links para as conversas \"não eram previsíveis ou detectáveis, a menos que as pessoas optassem por compartilhá-los por conta própria\".\n\"Quando alguém compartilha uma conversa, está tornando esse conteúdo publicamente acessível e, como outros conteúdos públicos da web, ele pode ser arquivado por serviços de terceiros\", acrescentou a porta-voz.\nA opção de compartilhamento do Claude informa ao usuário que \"qualquer pessoa com o link\" pode visualizar o conteúdo, mas não afirma explicitamente que o link pode acabar nos resultados de pesquisa no Google.\nUsuários do Reddit descobriram inicialmente os chats disponíveis publicamente, que abrangiam mais de 200 conversas com o Claude em pelo menos 25 páginas de resultados de pesquisa — algumas ocorridas há apenas algumas semanas.\nNas conversas, os usuários solicitaram que o chatbot respondesse a uma ampla gama de tópicos.\nEm uma conversa de abril, um usuário pediu ao chat que redigisse uma postagem de blog inédita sobre segurança na nuvem, incluindo detalhes de um projeto corporativo. \nEm outra, do mês passado, um usuário perguntou ao Claude como \"se tornar a Raposa de Nove Caudas?\", antes de esclarecer que queria se transformar literalmente de humano na criatura.\nO Claude primeiro tentou mostrar ao usuário uma imagem gerada por IA, alegando que ele havia recebido \"poderes de raposa totalmente funcionais!\".\nOutras conversas com o Claude incluíram usuários buscando ajuda com seus currículos, incluindo nomes, informações de contato e histórico profissional. \nAlguns usuários chegaram a realizar o que parecia ser pesquisa confidencial para seus trabalhos, como na área da saúde, incluindo transcrições de conversas privadas.\nQuando a OpenAI enfrentou, no ano passado, um problema quase idêntico com a disponibilização pública dos registros de bate-papo do ChatGPT, a empresa acabou alterando a forma como esses registros eram acessados.\nO Grok, o chatbot de IA do X, plataforma social pertencente a Elon Musk, também teve centenas de milhares de registros de bate-papo disponibilizados publicamente no ano passado por meio de buscas online.\nUm porta-voz do Google esclareceu à BBC que a empresa não controla \"quais páginas são tornadas públicas na web\", afirmando que essa ação parte dos próprios sites.\n\"Oferecemos aos proprietários de sites controles claros para que decidam se as páginas podem ser rastreadas ou indexadas, e sempre respeitamos essas diretrizes.\"\nComo a indexação dos registros de bate-papo não está mais ocorrendo nos resultados de busca, é provável que a Anthropic tenha usado ferramentas disponíveis para bloquear rapidamente os links dos registros de bate-papo nos resultados de pesquisa.\nO processo do Google para que um proprietário de site bloqueie um link é simples, mas deve ser iniciado pelo próprio proprietário do site.\nOutros mecanismos de busca, como Bing, Brave e DuckDuckGo, nos quais os registros de bate-papo do Claude também apareceram, foram contatados para comentar, mas não haviam se manifestado até a publicação desta reportagem.\nO chatbot Claude, da Anthropic, está entre os mais populares, rivalizando com o ChatGPT e o Gemini\nReuters via BBC", "url": "https://g1.globo.com/tecnologia/noticia/2026/07/28/como-centenas-de-conversas-privadas-com-chat-de-ia-claude-acabaram-disponiveis-publicamente.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-28T10:51:24+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/IO92sgdXeMq0-lR8lkjtr4vGjew=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/Z/S/0Z8GriQcSCetMtjjMIkg/77383030-906.jpg", "url_hash": "3ff1501bcb0e8de5487ea1ead4a312a3", "title_hash": "19d635583a011d72ce0eb8f55455a9bd", "corroboration": 2, "relevance_score": 0.1081, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.509, "headline_en": "Hundreds of Private Claude AI Chats Exposed Publicly Online", "headline_pt": "Centenas de Conversas Privadas com IA Claude Ficam Disponíveis Publicamente", "one_liner_en": "Private Claude AI conversations, some with personal data, became searchable via Google through specific site queries.", "one_liner_pt": "Conversas privadas no Claude, algumas com dados pessoais, ficaram acessíveis via pesquisas específicas no Google.", "category": "AI", "region": "world", "rationale": "Near-duplicate of index 0 from a different source, confirming the story's broad coverage.", "low_signal": true}, {"title": "Lavanda, hibisco e outras flores comestíveis que podem ser encontradas no seu jardim", "summary": "Do hibisco à flor de abóbora, apresentamos uma viagem pelas flores que nos alegram a vida, que comemos sem saber e outras que vale a pena conhecer.", "url": "https://www.bbc.com/portuguese/articles/cgq5vdx0wpvo?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-07-28T10:47:53+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/2ba9/live/1dc1b8f0-7bb8-11f1-8b3b-4de03d5aab17.jpg", "url_hash": "c941da18d018373bbf186ab32b305456", "title_hash": "3a60e5ca4ff9c842829f9359beb91e00", "corroboration": 2, "relevance_score": 0.0539, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4819, "headline_en": "Lavender, Hibiscus and Edible Flowers You Can Find in Your Garden", "headline_pt": "Lavanda, Hibisco e Outras Flores Comestíveis que Você Pode Encontrar no Jardim", "one_liner_en": "From hibiscus to pumpkin blossoms, edible flowers have been part of human cuisine for millennia.", "one_liner_pt": "Do hibisco à flor de abóbora, flores comestíveis fazem parte da gastronomia humana há milênios.", "category": "Culture", "region": "world", "rationale": "A lighthearted lifestyle feature on edible garden flowers with broad reader appeal.", "low_signal": true}, {"title": "Lavanda, hibisco e outras flores comestíveis que podem ser encontradas no seu jardim", "summary": "<img src=\"https://s2-g1.glbimg.com/W-73PO8QoO2_-X1_cEQsMCcRt88=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/m/d/sWBgAlRWypjyACHlzhBA/das-flores-de-abobora-ate-petalas-de-rosas-as-flores-fazem-parte-da-gastronomia-humana-ha-milenios.jpeg\" /><br />     Das flores de abóbora até pétalas de rosas, as flores fazem parte da gastronomia humana há milênios\nGetty Images / BBC\n\"Desprenda com muito cuidado as pétalas de rosas, procurando não espetar os dedos, pois, além de isso ser muito doloroso, as pétalas podem ficar impregnadas de sangue, o que, além de alterar o sabor do prato, pode provocar reações químicas muito perigosas...\"\nAssim começava a receita mais memorável do delicioso romance Como Água para Chocolate, de Laura Esquivel (Ed. Martins Fontes, 2015). Sua protagonista Tita impregna os alimentos que ela cozinha com seus sentimentos.\nPara preparar codornas com pétalas de rosas, ela embebeu o prato com sua paixão, mas também com o aroma e o sabor de uma flor que, por séculos, serviu de deleite para  culturas gastronômicas milenares, como a persa, além de oferecer discretamente uma dose de vitamina C e antioxidantes.\nMas a rosa não é a única flor que oferece, ao mesmo tempo, beleza e sabor.\nAgora no g1\nA flor de laranjeira perfuma o tradicional Pão dos Mortos no México, além da Rosca de Reis da Espanha e de vários países do Cone Sul. Ela também tem uma longa história culinária.\nJá a lavanda era popular entre os antigos romanos e muito usada na Inglaterra vitoriana no preparo de chás e biscoitos. Ela e a flor de laranjeira têm mais uma virtude: nos ajudam a relaxar.\nE, quando o assunto é tradição, a flor de abóbora, nativa da América Central e do sul do México, é excepcional.\nRegistros arqueológicos demonstram que a planta foi domesticada há mais de 10 mil anos, tendo sido uma das primeiras a serem cultivadas em todo o continente americano.\nOs povos originários da América já a consumiam e, após a chegada dos espanhóis, seu cultivo se expandiu pelo mundo.\nA flor de abóbora se integrou tão profundamente na Europa que, hoje em dia, é um ingrediente tradicional da cozinha italiana, onde é recheada e frita.\nComo se pode ver, o consumo de flores não é nada novo. E, embora elas possam passar despercebidas, nós as consumimos com mais frequência do que imaginamos.\nNa botânica, muitas verduras e especiarias cotidianas não são folhas nem raízes, mas sim inflorescências (conjuntos de flores) ou botões, que são colhidos pouco antes de abrirem.\nO brócolis e a couve-flor, por exemplo, são enormes ramos densos carregados de milhares de botões florais imaturos.\nSe você deixar um brócolis passar do ponto de colheita, ele começa a se estirar, até se transformar em um ramalhete repleto de diminutas flores amarelas brilhantes.\nBotanicamente, a alcachofra também é uma flor. Mais especificamente, ela é um botão floral imaturo que, se for deixado em crescimento, abre-se por completo e se transforma em uma flor espetacular de cor violeta ou púrpura brilhante.\nEstas são as alcachofras quando não são colhidas\nGetty Images / BBC\nAs alcaparras também são botões florais fechados. Quando não são colhidos, eles se abrem para formar uma bela flor de pétalas brancas e longos filamentos púrpura. Desta flor, nasce um fruto, que também é comestível.\nJá o cravo-da-índia, que usamos para aromatizar assados e sobremesas no Natal, é o botão floral seco da árvore do cravo, colhido à mão quando o casulo verde muda para um tom avermelhado, antes de abrir suas pétalas, e seco ao sol em seguida.\nE não podemos esquecer o açafrão, a especiaria mais cara do mundo, composta pelos estigmas da flor Crocus sativus.\nCada flor contém apenas três filamentos de coloração vermelha intensa. Por isso, para conseguir apenas 1 kg de açafrão puro, é preciso colher à mão os fios de cerca de 150 mil flores.\nMas existem outras que não deixam margem a dúvidas. E, da mesma forma que a rosa, a lavanda ou a flor de laranjeira, estão presentes em várias partes do Brasil e da América Latina.\nAqui estão algumas flores que talvez você conheça e outras que poderá ter o prazer de conhecer — e um alerta sobre o consumo de qualquer uma delas.\nHibisco (Hibiscus sabdariffa)\nHibisco (Hibiscus sabdariffa)\nGetty Images / BBC\nOriginário da África tropical, o hibisco chegou às Américas na época colonial, onde encontrou um novo lar nas regiões quentes do continente.\nHoje, é uma das flores mais conhecidas do México e do Caribe. Seu cálice vermelho de tom intenso é usado para preparar bebidas, chás e diversos pratos.\nEmbora seja mais conhecido pela sua flor, a parte que consumimos não são as pétalas da flor aberta, mas sim o cálice carnoso que protege o fruto.\nSeco ou fresco, esse cálice tem uma coloração rubi característica e um sabor ligeiramente ácido, refrescante e frutado, similar ao de certas frutas vermelhas.\nAlém dos seus atrativos culinários, o cálice contém vitamina C, ácidos orgânicos, antocianinas e outros compostos fenólicos com atividade antioxidante.\nDiversos estudos pesquisaram sua possível relação com a saúde cardiovascular e o metabolismo, mas os efeitos observados dependem da preparação e da quantidade consumida.\nPrimavera (Bougainvillea spp.)\nBougainvillea spp.\nGetty Images / BBC\nTambém conhecida como bougainville ou buganvília, entre outros nomes, a primavera é originária da América do Sul, especialmente do Brasil, Peru e Bolívia.\nEla não apenas embeleza muros e jardins com suas cores vibrantes, como é conhecida pelo seu tradicional chá, usado para aliviar a tosse.\nNa cozinha, são usadas suas atraentes brácteas, que são estruturas similares a folhas de cores vivas que rodeiam as pequenas flores brancas no centro. Elas têm sabor neutro, ligeiramente doce e floral, com um sutil toque amargo que faz com que sejam incrivelmente versáteis.\nCom elas, são preparadas bebidas refrescantes, como a água de buganvília do México, uma infusão fria que, com limão, muda de um tom púrpura para um rosa intenso e chamativo, já que seus pigmentos naturais reagem com a acidez da fruta.\nA primavera também é empregada na preparação de xaropes com espetacular coloração magenta para colorir margaritas, limonadas ou panquecas, além de concentrados para confeitaria.\nAlém do seu uso culinário, estudos de laboratório e em animais indicam que seus compostos fenólicos, flavonoides e outros metabólitos podem ter atividade antioxidante, anti-inflamatória, antimicrobiana e até efeitos relacionados ao controle da glicose.\nMas estes resultados ainda são preliminares e não comprovam que o consumo das flores realmente produz esses benefícios.\nEm termos de nutrição, a primavera tem muito poucas calorias e fornece pequenas quantidades de fibras e sais minerais.\nFlor de yucca (Yucca guatemalensis)\nFlor de yucca (Yucca guatemalensis)\nGetty Images / BBC\nConsiderada um dos grandes tesouros culinários da América Central, a yucca faz parte da cozinha tradicional da Guatemala e do sul do México há séculos, sem falar em El Salvador, onde foi declarada Flor Nacional.\nSuas grandes flores brancas são rapidamente fervidas para suavizar seu sabor amargo característico. Em seguida, elas são incorporadas a guisados, sopas, tamales ou mexidos com ovos, tomates e cebola.\nSeu sabor relembra o da alcachofra ou dos aspargos tenros, com agradável toque ligeiramente amargo.\nNutricionalmente falando, a flor de yucca tem baixo teor de calorias e fornece pequenas quantidades de fibras, proteínas e sais minerais, como cálcio, fósforo e potássio.\nEla também contém compostos fenólicos com atividade antioxidante, embora ainda não existam comprovações suficientes para afirmar que seu consumo produz benefícios específicos para a saúde.\nCapuchinha (Tropaeolum majus)\nCapuchinha (Tropaeolum majus)\nGetty Images / BBC\nNão é um ingrediente de consumo de massa, como a alface. Mas, dentro do mundo das flores comestíveis, a capuchinha é um verdadeiro clássico.\nOriginária dos Andes do Peru, Bolívia e Equador, ela chegou à Europa no século 16 e logo conquistou os jardins e as cozinhas.\nDiferentemente de muitas flores comestíveis, a capuchinha não tem sabor doce, nem floral.\nToda a planta é comestível (flores, folhas, botões e as próprias sementes verdes). Seu sabor é fresco, picante e com um toque de mostarda, muito similar ao agrião ou à rúcula.\nSuas flores enriquecem saladas, sanduíches e manteigas aromáticas. Já os botões e as sementes costumam ser curtidos para consumo no lugar das alcaparras.\nNutricionalmente, ela se destaca pelo seu teor de vitamina C, carotenoides e compostos fenólicos com atividade antioxidante.\nA capuchinha também contém glucosinolatos, as mesmas substâncias presentes no brócolis, na mostarda e em outros vegetais da família das couves, responsáveis tanto pelo seu sabor picante quanto pelos seus possíveis efeitos benéficos para a saúde, que vêm despertando o interesse da ciência.\nEstudos de laboratório já descreveram a atividade antioxidante e antimicrobiana de alguns desses compostos, mas ainda não há comprovação suficiente para atribuir benefícios específicos ao consumo da flor.\nFlor de bananeira (Musa spp.)\nFlor de bananeira (Musa spp.)\nGetty Images / BBC\nPopular em todo o mundo pelos seus frutos, a bananeira é muito mais aproveitável do que a maioria das pessoas imagina.\nOriginária do sudeste asiático, a banana chegou às Américas durante o início do comércio entre os continentes, no século 16. E, com o passar do tempo, ela se integrou profundamente às cozinhas tropicais do Caribe e da América Latina.\nSua enorme inflorescência púrpura ou granada, conhecida como flor ou coração da bananeira, também é comestível e tradicionalmente aproveitada em diversas regiões tropicais.\nPara isso, são retiradas as camadas exteriores, até chegar aos delicados floretes no seu interior. Eles são consumidos crus ou cozidos, em saladas, sopas, molhos e salteados.\nSeu sabor é suave, ligeiramente vegetal e com um toque amargo. Já sua textura é similar à da alcachofra, absorvendo facilmente os aromas de outros ingredientes.\nEm termos de nutrição, é um alimento leve, rico em água e fibras. Ela fornece pequenas quantidades de sais minerais e compostos fenólicos com atividade antioxidante.\nAlguns dos seu compostos já foram estudados para determinar suas possíveis funções, mas seus benefícios específicos à saúde ainda não foram demonstrados em seres humanos.\nE quantas outras!\nHá muitas outras flores comestíveis além das descritas acima.\nComo o encantador amor-perfeito que, além da sua beleza, oferece ao prato uma nota fresca, entre verde e levemente doce, quase como uma mistura de alface com menta.\nOu a bela violeta, com seu sabor delicado e floral. Há séculos, ela faz brilhar as sobremesas e a confeitaria fina, cristalizada com açúcar sobre bolos e bombons.\nA rústica borragem, com sabor surpreendente similar ao pepino, estrela de saladas e sopas frias na região do Mediterrâneo. Ou o aromático sabugueiro, com suas flores brancas que perfumam xaropes, fortificantes e licores há várias gerações.\nA pequena flor lilás da cebolinha fornece um suave toque de cebola ou alho para coroar molhos e queijos frescos.\nOu a flor de sisal. Na região central do México, ela é refogada com cebola e pimenta para se transformar em um guisado de sabor terroso e ligeiramente amargo, uma espécie de primo distante da flor de abóbora.\nE mais, muito mais. Mas há uma advertência que não pode ser esquecida.\nExistem centenas de espécies de flores comestíveis no mundo, mas apenas algumas fazem parte da cozinha tradicional ou são cultivadas com fins gastronômicos\nGetty Images / BBC\nNunca consuma flores compradas em viveiros ou floriculturas.\nEstas plantas são cultivadas para enfeite, não para alimentação. Por isso, elas costumam receber pesticidas, inseticidas e fungicidas agressivos, que são completamente absorvidos pelas plantas.\nO mais seguro é recorrer a flores da sua própria horta orgânica, plantas de jardim que tenham passado meses sem receber tratamento químico ou comprá-las em mercados, onde são vendidas especificamente para consumo alimentar.\nAs flores comestíveis não são medicamentos. Mas elas podem fornecer variedade, fibras, sais minerais e uma ampla variedade de compostos vegetais bioativos, como polifenóis e carotenoides.\nIncorporar as flores ocasionalmente à alimentação pode aumentar a diversidade de nutrientes e substâncias protetoras presentes na dieta.\nPor isso, na próxima vez em que você olhar para o seu jardim, não pense apenas na beleza. Talvez esteja ali o ingrediente de destaque ideal para o seu próximo jantar.", "url": "https://g1.globo.com/meio-ambiente/noticia/2026/07/28/lavanda-hibisco-e-outras-flores-comestiveis-que-podem-ser-encontradas-no-seu-jardim.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-28T11:05:46+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/W-73PO8QoO2_-X1_cEQsMCcRt88=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/m/d/sWBgAlRWypjyACHlzhBA/das-flores-de-abobora-ate-petalas-de-rosas-as-flores-fazem-parte-da-gastronomia-humana-ha-milenios.jpeg", "url_hash": "b5dd3988e7791bd7f52b5f685dc9ef1e", "title_hash": "3a60e5ca4ff9c842829f9359beb91e00", "corroboration": 2, "relevance_score": -0.0422, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4339, "headline_en": "Edible Flowers: From Pumpkin Blossoms to Rose Petals", "headline_pt": "Flores Comestíveis: Das Flores de Abóbora às Pétalas de Rosa", "one_liner_en": "Edible flowers from lavender to hibiscus have enriched human gastronomy across cultures for thousands of years.", "one_liner_pt": "Flores comestíveis como lavanda e hibisco enriquecem a gastronomia humana há milhares de anos em diversas culturas.", "category": "Culture", "region": "world", "rationale": "Near-duplicate of index 2; low editorial value as a lifestyle piece without a strong news hook.", "low_signal": let lang = 'en';

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {

  img.src = 'the_lighthouse2.png';
}

  const vol  = toRoman(year - 1900);
  const doy  = dayOfYear(iso);

}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
        '<div class="art-actions">' +
          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
