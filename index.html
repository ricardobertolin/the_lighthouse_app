<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

</svg>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>

    <span class="mast-rule mast-rule-r"><span class="mast-rule-gem">&#9670;</span><span class="mast-rule-line"></span></span>

    <span>Curitiba, Paran&aacute;</span>

  <!-- ARTICLE LIST -->

0 from a different source covering the same convention.", "low_signal": true}, {"title": "Gelo nos testículos e doação de sangue: os mitos vendidos a homens que buscam 'melhorar' qualidade do esperma", "summary": "Com a fertilidade masculina cada vez mais em evidência, conhecemos os homens que recorrem a truques não comprovados — promovidos por influenciadores — para aumentar a contagem de espermatozoides", "url": "https://www.bbc.com/portuguese/articles/c3wygyz50n3o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-07-25T20:13:24+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/4a65/live/935d5910-70a1-11f1-98f6-a389d1d57bcb.png", "url_hash": "bf6717fabc6f802f163769c31ec65651", "title_hash": "9fb4c6023e715ff4f1fe442f6146b764", "corroboration": 2, "relevance_score": 0.0761, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.493, "headline_en": "Ice on testicles and blood donation: myths men follow to boost sperm quality", "headline_pt": "Gelo nos testículos e doação de sangue: mitos que homens seguem para melhorar esperma", "one_liner_en": "Influencers are promoting unproven fertility tricks to men anxious about sperm quality, experts warn.", "one_liner_pt": "Influenciadores promovem truques sem comprovação científica para homens preocupados com fertilidade masculina.", "category": "Science", "region": "world", "rationale": "Growing public interest in male fertility is driving a wave of misinformation spread via social media influencers.", "low_signal": false}, {"title": "Gelo nos testículos e doação de sangue: os mitos vendidos a homens que buscam 'melhorar' qualidade do esperma", "summary": "<img src=\"https://s2-g1.glbimg.com/B0Nyg5R1qy4YRpDug4ZwDA9sdVM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/a/f/W1g80eScuGy7yy9kgRJw/imagem-cortada-8-.jpg\" /><br />     Simon, de 28 anos, segue uma rotina de várias etapas na tentativa de proteger sua fertilidade\nBBC\nTodas as manhãs, Simon começa o dia em uma sauna, com uma bolsa de gelo presa à virilha.\n\"Eu a coloco nos testículos para preservar uma alta contagem de espermatozoides\", diz.\nEle acredita que o calor o ajuda a eliminar toxinas pelo suor, melhorando a função dos espermatozoides — mas afirma que precisa tomar cuidado para proteger os testículos do calor excessivo.\nO jovem de 28 anos, de Miami, toma sol diariamente, se exercita com frequência, bebe apenas água filtrada e usa cuecas boxer de algodão — tudo isso faz parte de uma rotina voltada para a fertilidade, que ele segue apesar de não haver evidências médicas de que essas práticas realmente funcionem.\nHá um fundo de verdade em algumas dessas alegações: poluentes ambientais e o aquecimento dos testículos podem afetar a qualidade do esperma.\nMas é improvável que as medidas adotadas por Simon façam uma diferença significativa na sua fertilidade, embora a prática de exercícios físicos beneficie sua saúde de forma geral.\nTestosterona, anabolizantes e até remédio para diabetes: o que tem no “chip da beleza”\nEle faz parte de um número crescente de homens que vêm prestando mais atenção à própria fertilidade. No TikTok e no Instagram, hashtags em inglês como #malefertility, #semenanalysis e #sperm acumulam centenas de milhões de visualizações, enquanto comunidades online dedicadas a melhorar a saúde dos espermatozoides cresceram rapidamente.\nSimon não pretende ter filhos tão cedo e não tem uma parceira. Sua maior preocupação é saber se uma baixa contagem de espermatozoides pode afetar sua saúde.\nEle teme que uma fertilidade reduzida possa comprometer o chamado sistema endócrino, uma rede de glândulas e órgãos responsável pela liberação de hormônios no organismo.\nMas não há evidências de que isso aconteça.\nUma baixa contagem de espermatozoides não provoca problemas no sistema endócrino, embora as duas condições possam ocorrer ao mesmo tempo em algumas pessoas.\n'Eu escolhi proteger minha fertilidade'\nEspecialistas em fertilidade masculina de diferentes partes do mundo afirmam ter observado um aumento no número de homens que procuram fazer exames de análise do sêmen e demonstram preocupação com sua fertilidade futura.\nSegundo esses especialistas, esse movimento é impulsionado, em parte, pelas preocupações com os efeitos da terapia de reposição de testosterona (TRT), do uso de esteroides anabolizantes e da exposição a determinados poluentes ambientais — fatores que podem afetar negativamente os hormônios responsáveis pela produção de espermatozoides.\nO professor Suks Minhas, especialista em fertilidade no Reino Unido, afirma que o aumento das discussões sobre a queda na contagem de espermatozoides e a fertilidade masculina tem aspectos positivos e negativos.\n\"É importante dar mais visibilidade à infertilidade masculina. Mas será que estamos alimentando essa preocupação de forma desnecessária?\", questiona.\nAo mesmo tempo, acrescenta ele, surgiu toda uma indústria de influenciadores e produtos que se beneficia dessa ansiedade.\nAssim como muitos outros homens, Simon passou a se interessar pelo tema da fertilidade depois de ver conteúdos nas redes sociais. Foram os influenciadores falando sobre a queda na contagem de espermatozoides que despertaram sua preocupação. Ainda assim, ele nunca fez um exame de análise do sêmen e não tem nenhum motivo específico para acreditar que tenha um problema de fertilidade.\n\"É algo que, de modo geral, me assusta. Por isso, escolho proteger minha fertilidade\", afirma.\nO ex-bilionário do Vale do Silício Bryan Johnson afirma ter quatro vezes a contagem média de espermatozoides\nGetty Images/BBC\nFoi o conteúdo do influenciador Bryan Johnson que levou Simon a \"realmente se preocupar\" com sua fertilidade.\nJohnson, um ex-bilionário do Vale do Silício, ficou conhecido por querer viver para sempre. Nos últimos cinco anos, ele vem fazendo experimentos consigo mesmo, usando métodos controversos na tentativa de prolongar sua expectativa de vida.\nEle afirma ter uma contagem de espermatozoides quatro vezes maior do que a média, com base em cinco exames laboratoriais realizados ao longo de três meses.\nJohnson promove protocolos sem comprovação científica, como o uso de sauna combinado com bolsas de gelo, alegando que eles aumentam os níveis de testosterona e a contagem de espermatozoides — práticas que Simon segue.\nO conteúdo de Johnson — acompanhado por mais de seis milhões de pessoas — direciona seus seguidores para seu site, Blueprint, onde ele vende suplementos.\nMas ele está longe de ser a única voz nesse universo. Outros protocolos promovidos por influenciadores, também sem respaldo científico, incluem o uso de determinados suplementos, terapia com luz vermelha e até a doação de sangue para \"filtrar\" microplásticos do organismo.\nQueda nas taxas de natalidade\nEsse tipo de conteúdo produzido por influenciadores surge em meio a discussões mais amplas sobre a queda das taxas de natalidade.\nGlobalmente, a taxa de fecundidade caiu de 4,9 filhos por mulher em 1950 para 2,2 em 2025. Atualmente, 106 países estão abaixo da chamada taxa de reposição populacional, de 2,1 filhos por mulher, segundo as projeções da ONU publicadas no relatório World Population Prospects 2025.\nO secretário de Saúde dos Estados Unidos, Robert F. Kennedy Jr., que já promoveu algumas alegações de saúde sem comprovação científica, falou recentemente em uma \"crise de fertilidade\". Segundo ele, em 1970, \"os homens tinham o dobro da contagem de espermatozoides dos adolescentes de hoje\".\nAnálises de grande escala sugerem que houve uma queda significativa na contagem e na qualidade dos espermatozoides em todo o mundo desde a década de 1970. No entanto, não é simples fazer uma comparação direta entre os jovens de hoje e os homens mais velhos daquela época, já que a idade não era o foco desses estudos.\nDe modo geral, há consenso de que a contagem e a qualidade dos espermatozoides estão em declínio, embora alguns dados indiquem que essa redução talvez não seja tão acentuada quanto se temia.\nSegundo uma metarrevisão publicada em 2023 sobre a queda na contagem de espermatozoides, o tema ainda é pouco estudado, e tanto as causas desse declínio quanto seus impactos sobre as taxas de natalidade permanecem incertos.\nJá estudos publicados em 2024 e 2025, que analisaram populações mais específicas nos Estados Unidos e na Dinamarca, não encontraram evidências dessa queda na contagem de espermatozoides e defenderam a realização de mais pesquisas sobre o tema.\nEnquanto isso, influenciadores ligados ou próximos da chamada \"manosfera\", como Andrew Huberman, têm discutido em seus podcasts a queda na contagem de espermatozoides dos homens. Já Joe Rogan chegou a alertar para um iminente \"colapso populacional\".\nMas há muitos fatores não biológicos por trás da queda das taxas de natalidade. Segundo o relatório *State of World Population 2025*, da ONU, 39% das pessoas afirmaram que razões financeiras as impedem de ter o número de filhos que gostariam. Além disso, uma em cada cinco citou a instabilidade ambiental e política como motivo.\nO professor Channa Jayasena, endocrinologista especializado em reprodução do Imperial College London, acredita que há motivos legítimos para preocupação com a queda na contagem de espermatozoides, mas afirma que as alegações sobre problemas de fertilidade masculina são exageradas nas redes sociais.\n\"Existem, sim, alguns desafios, mas ainda está longe de estar claro quais são as causas deles\", afirma.\nO naturopata Lucas é um biohacker que segue uma rotina de otimização da saúde, incluindo terapia com luz vermelha, embora as evidências científicas sobre sua eficácia sejam limitadas.\nBBC\nApesar de ainda não haver um quadro claro sobre as causas da infertilidade masculina, soluções sem comprovação científica vêm sendo comercializadas nas redes sociais.\nO naturopata Lucas é um dos influenciadores da área da saúde cujo conteúdo inclui alertas sobre a queda das taxas de fertilidade.\n\"Estamos vendo uma epidemia mundial, uma redução da fertilidade em todos os aspectos\", disse ele à BBC.\nMas a preocupação de Lucas vem acompanhada de algumas afirmações enganosas. Em um vídeo no YouTube, por exemplo, ele afirmou que os homens seriam inférteis em 33 anos — uma alegação que não é respaldada por evidências científicas.\nEle vende cursos online, oferece consultorias individuais e comercializa suplementos voltados para homens que desejam aumentar os níveis de testosterona e melhorar a fertilidade.\nSeu conteúdo nas redes sociais, que promove alguns protocolos de fertilidade sem comprovação científica, viralizou.\n\"Eu recomendo que os homens coloquem uma bolsa de gelo por dentro da roupa íntima, duas ou três vezes por dia, durante cerca de 10 a 15 minutos\", diz ele, alegando que alguns clientes relataram que suas parceiras engravidaram após adotarem essa prática.\n\"Isso ainda é preliminar. Mas acho que é uma estratégia promissora o suficiente para valer a pena tentar\", afirma.\nQuestionado sobre o fato de seu conselho não ter comprovação científica, Lucas respondeu que considera o resfriamento dos testículos uma \"intervenção promissora\", mas acrescentou que gostaria de ver mais pesquisas sobre o tema.\nAs orientações do NHS, o sistema público de saúde do Reino Unido, afirmam que roupas íntimas muito apertadas podem aumentar a temperatura dos testículos, o que pode afetar a qualidade dos espermatozoides.\nLucas também orienta seus seguidores e clientes sobre alimentação saudável, sono e prática de exercícios físicos — medidas que, estas sim, contam com sólida base científica.\nO professor Channa Jayasena recomenda mudanças no estilo de vida para melhorar a fertilidade.\n\"Se houver fatores reversíveis, como parar de fumar, perder peso e aumentar a atividade física\", diz ele, \"essas são, de longe, as melhores medidas que alguém pode adotar\".\nEsse aumento no volume de conselhos sobre fertilidade divulgados por influenciadores ocorre ao mesmo tempo em que cresce o número de homens que usam medicamentos para aumentar os níveis de testosterona.\nO professor Channa Jayasena recomenda mudanças no estilo de vida para melhorar a fertilidade.\nBBC\nMas o uso de esteroides anabolizantes e de testosterona pode prejudicar a fertilidade masculina.\nNa tentativa de reverter esse dano, influenciadores promovem os chamados **\"stacks\"** — combinações de diferentes medicamentos — que muitas vezes são vendidos em seus próprios sites.\nEntre eles estão os medicamentos para fertilidade **HCG** e **HMG**. Embora esses remédios sejam prescritos em situações médicas específicas, eles não foram desenvolvidos para que outras pessoas os utilizem com o objetivo de \"reativar\" a fertilidade.\nEsses medicamentos podem causar efeitos colaterais graves e provocar danos permanentes quando usados sem orientação médica.\n\"É extremamente perigoso\", afirma o professor Channa Jayasena. \"Alguns deles podem causar coágulos sanguíneos e até provocar o crescimento das mamas, uma condição que pode deixar sequelas se não for tratada rapidamente.\"\nA BBC conversou com sete homens, de diferentes partes do mundo, que estavam usando esses \"stacks\" de fertilidade para tentar recuperar a capacidade reprodutiva após fazerem terapia de reposição de testosterona (TRT, na sigla em inglês).\nComo é ilegal comprar drogas como esteroides pela internet em muitos países, eles pediram para permanecer anônimos.\nUm deles contou que acreditava que seria pai de \"muitos filhos\" depois de fazer um ciclo intensivo com HMG e HCG.\nJamal — nome fictício — usou altas doses de testosterona e esteroides anabolizantes para musculação, o que reduziu seus indicadores de fertilidade. Ele interrompeu o uso no fim do ano passado, quando ele e sua parceira começaram a pensar em ter filhos.\nEm fóruns online e no YouTube, Jamal encontrou orientações de homens que haviam passado pela mesma situação. Muitos recomendavam os chamados **\"stacks de fertilidade\"**, apresentados como soluções \"à prova de falhas\".\nComo essas estratégias não funcionaram, ele procurou ajuda profissional e consultou o endocrinologista especializado em reprodução Channa Jayasena. Até então, ele não sabia que usar esses \"stacks\" sem acompanhamento médico poderia ser perigoso.\nSeguindo a orientação de Jayasena, Jamal interrompeu todos os medicamentos, incluindo o \"stack de fertilidade\". Seis meses depois, seus níveis naturais de testosterona estão melhorando. No entanto, o hormônio responsável por estimular a produção de espermatozoides ainda permanece baixo. Mesmo assim, ele e seu médico estão otimistas de que esses níveis continuarão a se recuperar.\nSegundo Jayasena, embora o aumento da conscientização sobre a fertilidade masculina seja positivo, ele também criou um vazio de informação confiável. Com isso, homens como Jamal acabam recorrendo aos conselhos de influenciadores porque nem sempre conseguem ter acesso fácil a especialistas.\n\"Na melhor das hipóteses, isso pode apenas desviar a atenção deles das medidas que realmente poderiam ajudar. Mas, na pior, pode levá-los a adotar práticas prejudiciais à saúde\", afirma.", "url": "https://g1.globo.com/saude/noticia/2026/07/26/gelo-nos-testiculos-e-doacao-de-sangue-os-mitos-vendidos-a-homens-que-buscam-melhorar-qualidade-do-esperma.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-26T07:00:32+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/B0Nyg5R1qy4YRpDug4ZwDA9sdVM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/a/f/W1g80eScuGy7yy9kgRJw/imagem-cortada-8-.jpg", "url_hash": "54c8ae2236a06ac3a7f762ab8e0a231a", "title_hash": "9fb4c6023e715ff4f1fe442f6146b764", "corroboration": 2, "relevance_score": -0.0586, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4257, "headline_en": "Ice on testicles and blood donation: myths men follow to boost sperm quality", "headline_pt": "Gelo nos testículos e doação de sangue: mitos que homens seguem para melhorar esperma", "one_liner_en": "Influencers are promoting unproven fertility tricks to men anxious about sperm quality, experts warn.", "one_liner_pt": "Influenciadores promovem truques sem comprovação científica para homens preocupados com fertilidade masculina.", "category": "Science", "region": "world", "rationale": "Near-duplicate of index 2 republished on a different platform.", "low_signal": true}, {"title": "Requião Filho tem candidatura ao Governo do Paraná confirmada pelo PDT", "summary": "O PDT Paraná confirmou a candidatura do deputado estadual Requião Filho ao Governo do Estado nas eleições de 2026. A [&hellip;]", "url": "https://www.tribunapr.com.br/noticias/parana/requiao-filho-candidatura-governo-parana-confirmada-pdt/", "source_domain": "tribunapr.com.br", "published_at": "2026-07-25T14:17:23+00:00", "origin": "feed", "image_url": "https://www.tribunapr.com.br/wp-content/uploads/2026/07/25141415/requiao-filho.png", "url_hash": "180a895bf7be4d346e37342430e39065", "title_hash": "a9cd8c3b6ad04fee48f582f66599a72f", "corroboration": 1, "relevance_score": 0.2598, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3849, "headline_en": "PDT confirms Requião Filho as its candidate for Paraná governor", "headline_pt": "PDT confirma Requião Filho como candidato ao governo do Paraná", "one_liner_en": "PDT has formally confirmed state deputy Requião Filho as its candidate for the Paraná governorship in 2026.", "one_liner_pt": "PDT confirmou formalmente o deputado estadual Requião Filho como candidato ao governo do Paraná em 2026.", "category": "Other", "region": "curitiba", "rationale": "A second major party entering the Paraná governor's race on the same day shapes a competitive 2026 field.", "low_signal": false}, {"title": "Minas Gerais registra 78 casos de feminicídio no primeiro semestre, aponta governo", "summary": "Minas Gerais registrou 78 feminicídios no 1º semestre deste ano\nMinas Gerais registrou 78 feminicídios no primeiro semestre deste ano, segundo a Secretaria Estadual de Justiça e Segurança Pública. O número é o mesmo contabilizado no mesmo período do ano passado.\nAs tentativas de feminicídio aumentaram no estado. Foram 97 casos, dois a mais que no primeiro semestre de 2025.\nEm Belo Horizonte, houve queda nos feminicídios consumados — ou seja, nos casos em que as mulheres foram mortas. Neste ano, seis mulheres foram vítimas na capital mineira, contra nove no mesmo período do ano passado.\nPor outro lado, as tentativas cresceram na capital. Os registros passaram de 10 para 15, um aumento de 50%, de acordo com a Secretaria Estadual de Justiça e Segurança Pública.\nDois casos investigados como feminicídio\nNa última semana, dois casos investigados como feminicídio chocaram Belo Horizonte. Em um deles, uma mulher de 31 anos foi encontrada morta dentro do apartamento onde morava, no bairro Camargos, na Região Noroeste da capital. \nO namorado foi preso em flagrante e confessou o crime à Polícia Militar. De acordo com as investigações, ele estrangulou a vítima após uma discussão motivada por ciúmes e, depois, permaneceu ao lado do corpo por algumas horas antes de acionar a polícia.\nO segundo caso envolve um casal de policiais militares. A capitã Michele Leão Azevedo foi levada já sem vida ao Hospital Odilon Behrens pelo marido, o sargento Eduardo Abner Pereira de Oliveira. Inicialmente, ele afirmou que a esposa havia sido encontrada desacordada após cair de uma escada. \nNo entanto, exames apontaram múltiplas lesões incompatíveis com essa versão, e a Polícia Civil passou a investigar o caso como feminicídio. O sargento teve a prisão em flagrante convertida em preventiva, e o comando da PM em Minas Gerais informou que trata o episódio como um caso de violência doméstica e familiar.\nVídeos mais vistos do g1 Minas", "url": "https://g1.globo.com/mg/minas-gerais/noticia/2026/07/26/minas-gerais-registra-78-casos-de-feminicidio-no-primeiro-semestre-aponta-governo.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-26T09:00:14+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/7iSml6T7eRdhrpcU8QgNv8uDZJY=/1280x0/filters:format(jpeg)/https://thumbor.globoi.com/unsafe/fit-in/1280x720/s03.video.glbimg.com/deo/vi/34/11/14811134", "url_hash": "0dafb791865d2bf02a678e3d5ad9c6cf", "title_hash": "d968dcc434546194c41f1059d5284382", "corroboration": 1, "relevance_score": 0.2496, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3798, "headline_en": "Minas Gerais records 78 femicides in first half of 2026", "headline_pt": "Minas Gerais registra 78 feminicídios no primeiro semestre de 2026", "one_liner_en": "Minas Gerais logged 78 femicides in H1 2026, matching last year's figure, while attempted femicides rose slightly.", "one_liner_pt": "Minas Gerais registrou 78 feminicídios no 1º semestre de 2026, mesmo número do ano passado, com tentativas aumentando.", "category": "Brazil", "region": "brazil", "rationale": "Official state data highlights persistent gender-based violence in Brazil's second most populous state.", "low_signal": false}, {"title": "Fantasias de carnaval viram figurinos de quadrilha em projeto social que transforma vidas na Zona Oeste do Rio", "summary": "<img src=\"https://s2-g1.glbimg.com/9rADqJRdptKdkMACyV5OH10L9tk=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/N/Y/zAWWQLRcmcQUltXmBBeQ/criancas.jpeg\" /><br />     Fantasias de carnaval viram figurinos de quadrilha em projeto social que transforma vidas na Zona Oeste do Rio\nA tradição das festas juninas, trazida pelos portugueses ao Brasil no século XVI, ganha um novo significado em um projeto social na comunidade Antares, em Santa Cruz, na Zona Oeste do Rio. \nNo Instituto Silvestre, fantasias que desfilaram no carnaval são reaproveitadas e transformadas em figurinos usados nas apresentações de quadrilha.\nVestidos, saias, jardineiras e adereços que um dia fizeram parte dos desfiles das escolas de samba ganham uma nova função pelas mãos da professora Rose Paixão e dos alunos do instituto.\nRose conta que aproveita materiais descartados por escolas de samba para confeccionar as roupas das apresentações.\n“Quando a gente não vai pra Marques de Sapucaí, nós vamos pra Intendentes Magalhães. A Intendente Magalhães. Então, vai meus amigos, eles me ajudam, nós pegamos sacos e enchemos bastante de reciclagem e transportamos no início do ano, assim, no carnaval, pra eu poder fazer a customização das roupas.”\n📱Baixe o app do g1 para ver notícias do RJ em tempo real e de graça\nDurante quatro meses, ela e as crianças reciclam e transformam tecidos utilizados em fantasias de carnaval em figurinos de quadrilhas juninas.\n“Quando termina uma eu já penso no tema do próximo ano, então eu vou focar na reciclagem que tem a ver com o tema. Mesmo se não tiver a ver com o tema, eu trago também pra poder reaproveitar, de qualquer forma. O trabalho está muito mais emocionante, muito mais cativante, com muito mais carinho e amor, devido às crianças.”\nAs apresentações do grupo chamam a atenção justamente pelos figurinos produzidos a partir da reciclagem.\nA professora Rose Paixão\nReprodução/TV Globo\nProjeto atende cerca de 600 pessoas\nA reciclagem de figurinos e as aulas de dança fazem parte das atividades desenvolvidas pelo Instituto Silvestre. O projeto funciona na comunidade Antares, em Santa Cruz, e também mantém uma unidade em Urucânia.\nAo todo, são quase 500 pessoas matriculadas na sede principal e outras 100 atendidas na segunda unidade. Crianças, adolescentes, jovens e adultos participam das atividades.\nMaria Eduarda Almeida, de 12 anos, diz que o projeto mudou sua forma de enxergar a vida.\n“Quando eu não era do projeto, eu não sabia o que fazer. Então, quando eu entrei no projeto, eu dancei, eu fui saber o que era cultura, o que era amor, o que era dividir amor um para o outro e ajudar o outro.”\nLaura Duarte, de 9 anos, participa das atividades há 3 anos.\n“Eu sinto amor, sinto paixão por aqui, por causa que quando eu não era daqui eu não conhecia ninguém. Eu ficava aí brincando na rua. Quando eu entrei aqui eu comecei a conhecer várias pessoas.”\nJá Nicolas Almeida, de 11 anos, conta que encontrou amigos e aprendeu valores importantes.\n“É um amor, eu me sinto muito bem, eu aprendi a dançar, eu não tinha amigo na rua direito pra brincar, aí eu entrei, aí comecei a brincar com meus amigos. Eu aprendi também a respeitar os professores.”\nEducação e cidadania\nAo ouvir os relatos dos alunos, Rose Paixão se emociona. Ela afirma que a convivência com as crianças também transformou sua própria vida.\n“Para mim, é muito importante ter eles comigo, porque foi um momento da minha vida muito difícil. Quando eu comecei estar com eles aqui na ONG, a princípio eu não queria, porque eu não me via trabalhando com crianças. Mas depois, com o passar do tempo, eu passei a amá-los muito, muito mesmo. Eu sou rígida, brigo bastante, mas não vivo sem eles.”\nAlém das atividades culturais, o instituto desenvolve ações voltadas para educação e cidadania.\nA secretária do projeto e assistente social, Jaqueline Leocádio, explica que há atividades educativas em dois turnos durante a semana.\n“As atividades educativas acontecem de segunda e quarta, onde a gente tem dois turnos de educativa. E lá, trabalhamos trabalhar a leitura, que é a importância da leitura com as crianças.”\nEla destaca ainda as ações de conscientização desenvolvidas ao longo do ano.\n“Em cidadania a gente trabalha maio laranja, contra abuso sexual, e encerra com uma caminhada com as crianças ensinando os recursos e Conselho Tutelar.”\nO projeto também oferece cursos profissionalizantes, informática, esportes, capoeira, oficinas de reciclagem e atividades físicas para jovens, adultos e idosos.\n“Nós temos o esporte, que é o futebol. Temos atividades de ginástica para jovens, adultos e idosos. Temos atividade educativa, que a gente trabalha cultura, arte, cidadania, para nossas crianças e adolescentes. Temos capoeira. Temos o projeto arte na favela, que a gente recicla material da comunidade para transformar em arte. Temos aula de informática.”\nCrianças participam de projeto social na Zona Oeste do Rio\nReprodução/TV Globo\n'Resgatando sonhos'\nO pedagogo Paulo Roberto Silvestre Conrado\nReprodução/TV Globo\nO lema do instituto, \"Resgatando Sonhos\", representa a trajetória do fundador, o pedagogo Paulo Roberto Silvestre Conrado.\nMorador da comunidade, ele reuniu um grupo de moradores para assumir o espaço que antes era ocupado por outra organização social.\nPaulo conta que a própria história de vida serviu de motivação para criar o projeto.\n“A minha motivação veio do meu nascer, porque a minha vida foi muito dificultosa. Eu tenho quase trinta irmãos, parte de pai. Os meus pais, eles eram de drogas, eles eram alcoólatras. Eu não podia estudar. Até então que eu terminei meu estudo com 25 anos, porque foi muito dificultoso.”\nHoje, formado em Pedagogia, ele busca incentivar outros jovens da comunidade.\n“Hoje eu sou um pedagogo. Hoje eu trago a credibilidade pra comunidade, né? Trago o meu impulso, que eu falo pra eles que a gente pode. A gente pode crescer, não importa quem mora em favela. Tem que acreditar em si, acreditar no seu potencial e meter as caras, porque a minha vida foi dificultosa e eu não desisti.”\nTransformação social\nSegundo Jaqueline, o objetivo agora é ampliar o alcance das ações e continuar transformando a realidade das famílias atendidas.\n“A gente sabe das dificuldades do dia a dia. É difícil não se emocionar, porque a gente está aqui como ferramenta de transformação dentro da comunidade. E a gente vê famílias restauradas, estruturadas com os nossos projetos, é muito gratificante. Não dá vontade de parar, é um incentivo quando a gente vê um jovem que passou pelo projeto nosso.”\nEla diz que muitos participantes conseguem ingressar no mercado de trabalho ou abrir o próprio negócio.\n“Os crias que transformam são inseridos no mercado de trabalho. Ou então abrir seu próprio comércio, sua barbearia, assim, a sensação de trabalho cumprido, de dever cumprido, o coração ficar quentinho, de ver aquela família hoje não pedindo uma cesta básica, mas comprando seu alimento e a gente saber que foi a ponte de transformação para aquela família. Então é muito gratificante, é puro amor e pezinho no chão e correr atrás para a gente continuar fazendo esse trabalho.”\nPara Paulo, acompanhar o crescimento das crianças e dos adolescentes é a maior recompensa.\n“O meu sentimento de realização é muito gratificante, porque a gente vê tantos rostinhos, aquelas crianças que vêm tristes, sem um apoio familiar. Então aqui nós estamos para poder abraçar juntamente com o serviço social, que ele dá todo esse suporte, esse apoio, essa comunhão.”\n“E a gente vê as crianças crescendo, a gente vê saindo daqui para poder ir para jogar bola. Ou então falar, Paulo, eu consegui fazer um curso e tal, estou trabalhando em uma empresa e tal. Então é muito gratificante acolher e ver o resultado futuro.”\nInstituto Silvestre, na Zona Oeste do Rio\nReprodução/TV Globo\n🟩O g1 Rio está no GloboPop, o novo aplicativo de vídeos curtos verticais da Globo, disponível gratuitamente no seu celular. Lá no app, você pode seguir o palco do g1 Rio para não perder nenhum episódio. Baixe o GloboPop.", "url": "https://g1.globo.com/rj/rio-de-janeiro/globo-comunidade-rj/noticia/2026/07/26/fantasias-de-carnaval-viram-figurinos-de-quadrilha-em-projeto-social-que-transforma-vidas-na-zona-oeste-do-rio.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-26T11:48:08+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/9rADqJRdptKdkMACyV5OH10L9tk=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/N/Y/zAWWQLRcmcQUltXmBBeQ/criancas.jpeg", "url_hash": "8a50f23dee4624033ef44e4500cc331b", "title_hash": "3c715a0e325d989310e92122adfc5ebc", "corroboration": 1, "   { id: 'world',    lk: 'tab_world',    bk: 'blurb_world' },

let activeTab = 'world';
let minRel = 0, minCorr = 1, hideLow = true;

// ── Masthead ─────────────────────────────────────────────────────────
function renderMasthead() {
  const iso = DATA.date || new Date().toISOString().slice(0,10);
  const year = new Date(iso + 'T12:00:00').getFullYear();
  const vol  = toRoman(year - 1900);
  const doy  = dayOfYear(iso);
  document.getElementById('j-vol').textContent  = 'Vol. ' + vol + ' · No. ' + doy;
  document.getElementById('j-date').textContent = fmtDate(iso);
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';

  let html = '';
  const maxRel = Math.max(...DATA.articles.map(a => a.relevance_score || 0), 0.01);
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round(((art.relevance_score || 0) / maxRel) * 100);
    const corr   = art.corroboration || 1;

      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +

        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +

            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +

        '</div>' +

            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
