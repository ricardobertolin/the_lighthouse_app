<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}
/* Reading-history export — feeds `python -m digest --ingest-clicks` */
.reading-log{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:16px;
}
.reading-log button{
  font:inherit;letter-spacing:1px;text-transform:uppercase;
  background:none;border:1px solid var(--m3);color:var(--m3);
  padding:3px 9px;margin-left:8px;cursor:pointer;
}
.reading-log button:hover{ background:var(--ink);color:var(--paper);border-color:var(--ink); }
.reading-log[hidden]{ display:none; }

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

<svg aria-hidden="true" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;">

  </filter>
</svg>

<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>

"nytimes.com", "published_at": "2026-08-23T09:01:52+00:00", "origin": "feed", "image_url": "https://static01.nyt.com/images/2026/08/23/multimedia/23int-latam-diplo-bmhl/23int-latam-diplo-bmhl-mediumSquareAt3X.jpg", "url_hash": "404872b260dda7c7bfdacb704271b95b", "title_hash": "9d77d3564a35bc9182b4f13fa886e86b", "corroboration": 1, "relevance_score": 3.6987, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.6638, "headline_en": "Latin America's right-wing leaders meddle in each other's elections", "headline_pt": "Líderes de direita da América Latina interferem nas eleições vizinhas", "one_liner_en": "A new generation of right-wing presidents openly endorses allies abroad and attacks \"wokismo\", echoing Trump.", "one_liner_pt": "Uma nova geração de presidentes de direita apoia aliados no exterior e ataca o \"wokismo\", ecoando Trump.", "category": "Geopolitics", "region": "world", "rationale": "Cross-border campaigning reshapes regional politics ahead of Brazil's own election cycle.", "low_signal": false}, {"title": "Iran Warns Gulf States Not to Join Trump’s Economic War", "summary": "Iran’s new hard-line national security adviser, Mohsen Rezaei, vowed to prevent “a single drop of oil” from leaving the region.", "url": "https://www.nytimes.com/2026/08/23/world/europe/iran-economy-war-united-states.html", "source_domain": "nytimes.com", "published_at": "2026-08-23T12:47:30+00:00", "origin": "feed", "image_url": "https://static01.nyt.com/images/2026/08/23/multimedia/23-int-iran-war-01-lpzq/23-int-iran-war-01-lpzq-mediumSquareAt3X.jpg", "url_hash": "12b7b082dcfae373691c7f0efce90394", "title_hash": "d71dd09568f8074288b5092658e509f3", "corroboration": 1, "relevance_score": 3.6952, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.6635, "headline_en": "Iran warns Gulf states against joining Trump's economic war", "headline_pt": "Irã alerta países do Golfo contra aderir à guerra econômica de Trump", "one_liner_en": "Hard-line security adviser Mohsen Rezaei vowed to block \"a single drop of oil\" from leaving the region.", "one_liner_pt": "O conselheiro de segurança linha-dura Mohsen Rezaei prometeu impedir que \"uma única gota de petróleo\" saia da região.", "category": "Geopolitics", "region": "world", "rationale": "Threats to Gulf oil exports could jolt global energy prices.", "low_signal": false}, {"title": "IA pode estar freando salários antes de cortar empregos; veja profissões mais expostas e rankings", "summary": "<img src=\"https://s2-g1.glbimg.com/q4-60oO4lbBQPvVskIH6FPMkl28=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2023/9/B/UpT5K7TyuQ40B2QrbUxQ/programador-de-sistemas.png\" /><br />     Veja as 10 profissões mais valorizadas da tecnologia\nO receio mais comum sobre a inteligência artificial é que ela elimine empregos. Mas um novo estudo sugere que o primeiro grande impacto da tecnologia pode estar acontecendo de forma mais discreta: os trabalhadores continuam empregados, mas seus salários passam a crescer mais devagar.\nA conclusão é de uma pesquisa da gestora americana Apollo Global Management. O estudo analisou dados de salários, emprego e uso real de inteligência artificial em 321 ocupações dos Estados Unidos.\n🗒️ Tem alguma sugestão de reportagem? Mande para o g1\nSegundo os pesquisadores, profissionais de áreas mais expostas à IA tiveram crescimento salarial 6,7 pontos percentuais menor do que trabalhadores de ocupações menos expostas após a popularização de ferramentas como ChatGPT e Claude. \nO levantamento não encontrou evidências estatisticamente significativas de destruição de empregos nas ocupações mais expostas. O impacto aparece, até agora, na evolução dos salários e é ainda mais forte entre os trabalhadores de menor renda. Nesse grupo, a perda relativa no crescimento salarial chegou a 10,7%.\n🔎 O estudo não afirma que os salários dessas profissões necessariamente diminuíram. O que os pesquisadores identificaram foi que eles passaram a crescer em ritmo menor do que os salários observados em ocupações menos expostas à inteligência artificial.\nEssas não são necessariamente as profissões que mais perderam vagas, mas aquelas em que a inteligência artificial já é usada para executar uma parcela relevante das tarefas do dia a dia. Ou seja:  são ocupações nas quais a IA já passou a fazer parte da rotina de trabalho.\nA pesquisa identificou 11 ocupações com índice de exposição igual ou superior a 0,5, patamar considerado de alta exposição pelos pesquisadores. \nSão elas:\nProgramadores (0,75)\nAtendentes de customer service (0,70)\nDigitadores e profissionais de entrada de dados (data entry) (0,67)\nEspecialistas em prontuários médicos (0,67)\nAnalistas de mercado e marketing (0,65)\nTranscritores médicos (0,64)\nRepresentantes de vendas não técnicas (0,63)\nArquitetos de banco de dados (0,58)\nAnalistas financeiros e de investimentos (0,57)\nAnalistas e testadores de qualidade de software (QA) (0,52)\nAssistentes estatísticos (0,51)\n📎 A exposição foi calculada a partir do Anthropic Economic Index, indicador criado com base em milhões de interações reais de usuários com o Claude, modelo de IA desenvolvido pela Anthropic. Quanto maior a pontuação, maior a proporção de tarefas daquela profissão que já aparece sendo realizada com auxílio da tecnologia.\nO ranking revela um padrão claro: quase todas essas ocupações trabalham predominantemente com informações, documentos, textos, análise de dados, atendimento ou produção de conhecimento. São atividades nas quais ferramentas de IA conseguem auxiliar diretamente na execução das tarefas.\nIsso ajuda a explicar por que ocupações baseadas em processamento de informação aparecem muito acima de profissões ligadas a atividades físicas, como construção civil, indústria, manutenção ou serviços manuais.\nExposição não significa perda de emprego\nEmbora as ocupações acima liderem o ranking de exposição, isso não significa que sejam as mais prejudicadas pelo avanço da inteligência artificial.\nO desempenho do emprego e dos salários depende de uma combinação muito mais ampla de fatores, como produtividade, demanda por trabalhadores, escassez de mão de obra, crescimento do setor e qualificação exigida.\nEntre as ocupações mais expostas, algumas registraram aumento de emprego, outras perderam trabalhadores. Algumas tiveram crescimento salarial e outras apresentaram queda.\nOs analistas financeiros e de investimentos, por exemplo, aparecem entre as profissões mais expostas à IA, mas tiveram crescimento de 16,9% no emprego entre 2022 e 2024.\nJá os programadores lideram o ranking de exposição e registraram queda de 17,2% no número de trabalhadores e redução salarial real de 6,1% no período.\nQuando a análise passa dos níveis de exposição para os salários efetivamente observados, o ranking muda completamente.\nAs maiores perdas salariais registradas entre 2022 e 2024 foram:\nLocutores de rádio e DJs (-52,1%)\nTécnicos de radiodifusão (-29,5%)\nDiretores musicais e compositores (-17,8%)\nTécnicos de instrumentos de precisão (-15,0%)\nÁrbitros e mediadores (-14,1%)\nArtesãos (-14,1%)\nPsicólogos organizacionais (-13,4%)\nJuízes e magistrados (-13,3%)\nEscritores e autores (-12,7%)\nLegisladores (-11,7%)\nÉ importante destacar que esses números não significam que a IA foi responsável pelas perdas salariais. A queda pode ter sido influenciada por fatores específicos de cada setor, mudanças econômicas, transformações tecnológicas ou alterações na demanda por profissionais.\nO mesmo acontece quando a análise considera apenas a variação no emprego. \nAs maiores reduções observadas foram:\nVendedores porta a porta e jornaleiros (-46,9%)\nFabricantes de moldes em madeira (-45,5%)\nArtistas de efeitos especiais e animadores (-40,9%)\nLegisladores (-38,2%)\nTécnicos de instrumentos de precisão (-37,8%)\nCoreógrafos (-36,5%)\nTécnicos de radiodifusão (-36,2%)\nOperadores de telemarketing (-31,2%)\nEntrevistadores de crédito (-28,7%)\nAstrônomos (-27,8%)\nEntão o que a pesquisa conclui, de fato?\nA principal conclusão dos autores não veio da análise individual de cada profissão, mas de um modelo estatístico que comparou grupos de ocupações mais e menos expostas antes e depois da popularização da IA generativa.\nFoi nessa comparação que os pesquisadores encontraram evidências de que ocupações altamente expostas apresentaram crescimento salarial mais fraco do que o restante do mercado de trabalho.\nO efeito foi particularmente intenso nas ocupações de menor remuneração, enquanto trabalhadores do topo da distribuição salarial não apresentaram resultado estatisticamente significativo. Já para emprego, não foi identificado efeito significativo associado à exposição à IA.\nPor isso, os autores argumentam que o primeiro impacto mensurável da inteligência artificial pode estar sendo a chamada \"compressão salarial\" — situação em que os ganhos de produtividade proporcionados pela tecnologia não se traduzem necessariamente em aumentos equivalentes para os trabalhadores.\nApesar dos resultados, os próprios autores fazem uma série de ressalvas.\nA medida de exposição foi construída com base nos dados da Anthropic, e não inclui necessariamente todo o uso de ferramentas como ChatGPT, Gemini ou sistemas corporativos próprios.\nAlém disso, apenas 321 ocupações puderam ser cruzadas entre as bases utilizadas, e o período analisado após o surgimento da IA generativa ainda é relativamente curto.\nprogramador de sistemas\nSora Shimazaki/Pexels", "url": "https://g1.globo.com/trabalho-e-carreira/noticia/2026/08/23/ia-pode-estar-freando-salarios-antes-de-cortar-empregos-veja-profissoes-mais-expostas-e-rankings.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-08-23T07:02:03+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/q4-60oO4lbBQPvVskIH6FPMkl28=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2023/9/B/UpT5K7TyuQ40B2QrbUxQ/programador-de-sistemas.png", "url_hash": "06a1a83 éticos e a conclusão da Unidade de Saúde da Enseada.", "url": "https://g1.globo.com/sp/vale-do-paraiba-regiao/especial-publicitario/prefeitura-de-sao-sebastiao-sao-sebastiao-bem-cuidada/noticia/2026/08/23/sao-sebastiao-recupera-capacidade-de-investimento-e-retoma-ciclo-de-obras.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-08-23T08:00:53+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/5H34GxcNJUPFb7XA0eRf2JtDgUQ=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/Q/r/CTo5CYSJSANu0edzgkRg/2026811161141198561.jpg", "url_hash": "70d805a2f00bf533a814c3b3a2954b47", "title_hash": "f050dbd5601019d92b718533cac03b8e", "corroboration": 1, "relevance_score": 2.9189, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.5953, "headline_en": "São Sebastião restores investment capacity and resumes public works", "headline_pt": "São Sebastião recupera capacidade de investimento e retoma obras", "one_liner_en": "After 18 months of financial reorganization, the city renegotiated commitments and restarted its works cycle.", "one_liner_pt": "Após 18 meses de reorganização financeira, a prefeitura renegociou compromissos e retomou o ciclo de obras.", "category": "Brazil", "region": "brazil", "rationale": "Local fiscal turnaround story, though it reads largely as institutional promotion.", "low_signal": true}, {"title": "Corridas e evento no Centro fecham vias de Curitiba neste domingo; veja os pontos afetados", "summary": "Três eventos esportivos e culturais provocam alterações no trânsito de Curitiba neste domingo (23), nas regiões do Água Verde, Rebouças [&hellip;]", "url": "https://www.tribunapr.com.br/noticias/curitiba-regiao/corridas-evento-centro-fecham-vias-curitiba-domingo-veja-pontos-afetados/", "source_domain": "tribunapr.com.br", "published_at": "2026-08-22T20:22:09+00:00", "origin": "feed", "image_url": "https://www.tribunapr.com.br/wp-content/uploads/2026/08/22202055/transito-curitiba-260822.j // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
// The page is static (GitHub Pages), so there is nowhere to POST to. Clicks
// accumulate here and are exported as a file that the pipeline imports with
// `python -m digest --ingest-clicks`, which feeds the interest centroid used
// for relevance scoring.
const CLICK_KEY = 'tl_clicks';

function readClicks() {
  try { return JSON.parse(localStorage.getItem(CLICK_KEY) || '[]'); }
  catch(_) { return []; }
}

function trackClick(url, domain) {
  try {
    const clicks = readClicks();
    clicks.push({ url: url, domain: domain, at: new Date().toISOString() });
    if (clicks.length > 2000) clicks.splice(0, clicks.length - 2000);
    localStorage.setItem(CLICK_KEY, JSON.stringify(clicks));
    updateReadingLog();
  } catch(_) {}
}

function updateReadingLog() {
  const clicks = readClicks();
  const box = document.getElementById('j-reading-log');
  if (!box) return;
  box.hidden = clicks.length === 0;
  const label = document.getElementById('j-reading-count');
  if (label) label.textContent = clicks.length + ' ' + t('readingLog');
}

function exportClicks() {
  const clicks = readClicks();
  if (!clicks.length) return;
  const blob = new Blob([JSON.stringify(clicks, null, 2)], { type: 'application/json' });
  const stamp = new Date().toISOString().slice(0, 10);
  _dlBlob(blob, 'lighthouse-clicks-' + stamp + '.json');
  _flashBtn(document.getElementById('j-export-clicks'));
}

function clearClicks() {
  if (!confirm(t('clearConfirm'))) return;
  try { localStorage.removeItem(CLICK_KEY); } catch(_) {}
  updateReadingLog();
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();
  updateReadingLog();

  document.getElementById('j-export-clicks').addEventListener('click', exportClicks);
  document.getElementById('j-clear-clicks').addEventListener('click', clearClicks);

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
