<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

  <!-- MASTHEAD -->
  <div class="mast-vol">

tam a presidência", "one_liner_en": "De la Espriella and Cepeda represent sharply contrasting visions for Colombia's future in Sunday's runoff.", "one_liner_pt": "De la Espriella e Cepeda representam visões opostas para a Colômbia no segundo turno deste domingo.", "category": "Geopolitics", "region": "world", "rationale": "Colombia's presidential runoff is happening today, making this immediately newsworthy.", "low_signal": true}, {"title": "Que tipo de Colômbia representam De la Espriella e Cepeda, adversários no 2º turno da eleição deste domingo", "summary": "\"Um país dividido em dois\" foi uma expressão amplamente utilizada em diversos meios após o primeiro turno da eleição na Colômbia, que deixou frente a frente os dois candidatos à Presidência Abelardo de la Espriella e Iván Cepeda.\nSeus projetos de governo não poderiam ser mais diferentes.\nO advogado \"outsider\" De la Espriella chega ao segundo turno deste domingo (21/06) com uma proposta linha dura e conservadora, alinhada com as direitas de Donald Trump nos Estados Unidos, Javier Milei na Argentina e Nayib Bukele em El Salvador.\nO senador e filósofo Cepeda chega com uma agenda de esquerda, que inclui reformas sociais de grande alcance e um discurso conciliador na área de segurança, dando continuidade à trajetória progressista do atual presidente, Gustavo Petro.\nA disputa parece equilibrada, como no primeiro turno. De la Espriella obteve 43,7% dos votos contra 40,9% de Cepeda.\nAmbos parecem representar dois países e modelos de gestão opostos. E polarizados, segundo meios de comunicação e vários analistas. Mas especialistas consultados pela BBC News Mundo (serviço de notícias em espanhol da BBC) questionam essa visão.\nA Colômbia dividida\nUma tendência vem se repetindo desde 2016, quando o plebiscito pelo acordo de paz entre o governo e as forças paramilitares Farc dividiu a Colômbia em dois.\nO \"Não\" venceu, promovido por setores conservadores. E desde então, as regiões do país vêm votando de forma semelhante nas eleições presidenciais de 2018, 2022 e 2026.\n\"Há fortes oposições do eleitorado no território nos últimos 15 anos. As regiões periféricas hoje votam pela esquerda e as do centro pela direita, com exceção das cidades, que têm dinâmicas próprias\", analisa para a BBC Mundo Yann Basset, cientista político da Universidade do Rosario, na Colômbia.\nEssas regiões periféricas coincidem com algumas das áreas mais pobres e excluídas. Também com as mais afetadas pela violência e pelas disputas de grupos armados para controle de rotas do narcotráfico e outras rendas ilegais, aproveitando-se da limitada presença estatal.\nCepeda conseguiu seus melhores resultados no primeiro turno em várias dessas áreas. Seu partido, o Pacto Histórico, apostou na inclusão de seus habitantes, entre os quais há afro-colombianos e comunidades indígenas, para consolidar seu projeto político.\nBasset aponta outras distinções econômicas entre essas regiões — que coincidem com os litorais, a Amazônia e a fronteira com a Venezuela — e as do centro, atravessadas pelos Andes.\n\"O centro vive de um sistema agroindustrial integrado às cidades, enquanto nas periferias predomina uma economia extrativista. Esses fatores enraizaram essa diferença territorial tão acentuada\", explica o especialista.\nEmbora nas grandes cidades como Bogotá, Medellín, Cali ou Barranquilla as dinâmicas sejam mais complexas, Basset adverte que os estratos de renda mais baixos tenderam a votar em Cepeda no primeiro turno, enquanto os de renda média e alta preferiram De la Espriella.\nNa economia, De la Espriella propõe medidas como reduzir o tamanho do Estado e diminuir impostos para empresas, enquanto Cepeda aposta em aumentar o papel do Estado, transformar o campo em motor nacional e apoiar as pequenas empresas.\nNovas demandas\nO historiador Felipe Arias Escobar vê uma herança histórica dos votos pelo Partido Conservador nas regiões andinas e pelo Partido Liberal no litoral.\nAmbos os partidos dominaram a política colombiana até o início do século 20. Algumas de suas bandeiras hoje são retomadas por outros movimentos.\n\"Há continuidades e fenômenos que transcendem a dicotomia de esquerda e direita. São demandas de setores e simpatias que em algum momento, por exemplo, eram atendidas pelo Partido Liberal, depois pelo ex-presidente Juan Manuel Santos e hoje por opções de esquerda como Cepeda e Petro\", analisa Escobar.\nO mesmo ocorre no lado oposto, com De la Espriella, segundo o historiador.\n\"Setores que em seu momento votavam no Partido Conservador e depois no ex-presidente Álvaro Uribe agora simpatizam com essa versão colombiana das direitas populistas, características da política mundial desde a primeira eleição de Trump há 10 anos\", diz.\nDe qualquer forma, afirma Escobar, é difícil falar em eleitores \"mecânicos\", que votam automaticamente em A ou B, mas sim em cidadanias diversas e voláteis, que \"em 2006 puderam votar em Uribe e, em 2018, em Petro\".\nEm 2021, durante o governo do conservador Iván Duque, uma explosão social eclodiu contra o modelo econômico, a injustiça e a política tradicional que, até 2022 e a chegada de Petro, havia dominado a Colômbia por séculos.\nAs manifestações tiveram episódios de violência e o Estado reprimiu com uma força que foi criticada pela Comissão Interamericana de Direitos Humanos.\nOs ecos daquele episódio ainda reverberam nestas eleições.\n\"Há um grupo com demandas identitárias e novas cidadanias que se visibilizaram na explosão e que agora entraram em choque com movimentos de reação\", diz Escobar.\nDiversos analistas vinculam esse movimento de 2021 a parte do voto em Petro e Cepeda, enquanto atribuem o fenômeno de De la Espriella a uma recomposição das direitas que busca frear o impulso dessa nova cidadania representada pela esquerda.\nPosições que mudam\nNaqueles tempos de liberais e conservadores, o cientista político Juan Fernando Giraldo identificava identidades que hoje são menos estáticas.\n\"Nos anos 1940 e 1950, uma pessoa dizia que era conservadora e isso refletia tudo sobre sua identidade, interesses e família. Isso não está acontecendo hoje\", diz o especialista em opinião pública e marketing político.\n\"Você encontra colombianos que, por exemplo, hoje têm um apetite por figuras de autoridade e valores que podem se assemelhar a princípios católicos e também uma Colômbia que recalibra essas prioridades de forma diferente. Mas sinto que não é algo estático\", acrescenta.\nOs valores e a autoridade são centrais na campanha de De la Espriella.\nO candidato promove um discurso de linha dura contra o crime e de princípios religiosos cristãos para, segundo ele, trazer mais segurança e moralidade ao país.\nMas, se considerarmos apenas a matemática em uma sociedade onde 80% se identifica como católica e outros 10% como cristã, o resultado sempre favoreceria posições conservadoras como as de De la Espriella.\n\"Há um grande bloco cidadão com posições menos intensas sobre as coisas, que não acredita muito em se a autoridade do Estado deve ser maior (como defende De la Espriella) ou se deve ser mais ampla (como propõe Cepeda). São, além disso, pessoas que tendem a se informar e a se expressar menos\", comenta Giraldo.\nIsso indica que grande parte do eleitorado pode votar em candidatos muito distantes entre si, mas que nem por isso representam fielmente o país polarizado que aparece na cédula.\n\"É uma leitura superanalisada da elite. Quando se analisa nas cidades e no meio rural, as conversas não são tanto sobre se alguém é de direita ou esquerda, mas surgem preocupações mais sensíveis de uma cidadania que muda facilmente\", sustenta Giraldo.\nO analista acredita que o marketing de De la Espriella também soube explorar mensagens claras sobre família, autoridade e combate firme ao crime, que se mostraram particularmente eficazes.\nDa mesma forma, ele argumenta que a aposta da esquerda em se unificar em torno de Petro se traduziu em uma elevada intenção de voto para Cepeda.\n\"Muita tionale": "A controversial legal strategy by the Brazilian government in a US court could have serious diplomatic and judicial consequences.", "low_signal": false}, {"title": "Kim Kataguiri desiste de candidatura ao governo de São Paulo", "summary": "<img src=\"https://media.gazetadopovo.com.br/2026/06/20202629/kim-kataguiri-960x540.jpg\" /><br />Deputado tentará reeleição à Câmara dos Deputados e assumirá ministério em caso de vitória do aliado Renan Santos na corrida presidencial", "url": "https://www.gazetadopovo.com.br/eleicoes/2026/kim-kataguiri-desiste-governo-sao-paulo/", "source_domain": "gazetadopovo.com.br", "published_at": "2026-06-20T23:27:37+00:00", "origin": "feed", "image_url": "https://media.gazetadopovo.com.br/2026/06/20202629/kim-kataguiri-960x540.jpg", "url_hash": "8a923054a783b4a3b4c97f8ed7c2c72b", "title_hash": "2f701b921aafaa3480a0ac9bffcdb2e1", "corroboration": 1, "relevance_score": 0.1969, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3535, "headline_en": "Kim Kataguiri Drops São Paulo Governor Bid, Eyes Congressional Reelection", "headline_pt": "Kim Kataguiri desiste de candidatura ao governo de São Paulo e foca na reeleição à Câmara", "one_liner_en": "Congressman Kim Kataguiri abandoned his São Paulo gubernatorial bid and will seek reelection to the lower house.", "one_liner_pt": "O deputado Kim Kataguiri desistiu da candidatura ao governo de São Paulo e buscará reeleição à Câmara dos Deputados.", "category": "Brazil", "region": "brazil", "rationale": "Candidate reshuffling ahead of Brazil's 2026 elections continues to reshape the political playing field.", "low_signal": false}, {"title": "Maior que o Uruguai: Amazonas tem área protegida do tamanho de um país, mas enfrenta desafio de fiscalização", "summary": "<img src=\"https://s2-g1.glbimg.com/dgrX8H-jkmfxTP1L0G5dTx8rhfg=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2024/g/W/s4UoT0TyaLUvkR5lCjZQ/jgseegdsuvjndeludofoqivk3i.jpg\" /><br />     Amazonas lidera conservação com área protegida maior que o Uruguai\nO Amazonas possui uma área protegida por Unidades de Conservação maior que países inteiros. Somente as 42 áreas administradas pelo governo estadual somam cerca de 19 milhões de hectares de floresta preservada, um território maior que o Uruguai e superior à soma dos estados do Ceará e de Santa Catarina.\nO tamanho desse território transforma o estado em um dos principais exemplos de conservação ambiental do país, mas também revela um dos maiores desafios: como fiscalizar e garantir a presença do poder público em áreas tão extensas e de difícil acesso.\n🌳As Unidades de Conservação são áreas protegidas por lei para preservar a natureza e seus recursos. No Amazonas, elas incluem diferentes categorias, como Áreas de Proteção Ambiental (APAs), Reservas de Desenvolvimento Sustentável (RDS), Reservas Extrativistas (Resex), Parques Estaduais, Monumentos Naturais e Florestas Estaduais.\n📲 Participe do canal do g1 AM no WhatsApp\nCada tipo de unidade tem regras próprias. Algumas permitem a presença de moradores e o uso controlado dos recursos naturais, enquanto outras têm normas mais restritivas para garantir a preservação da biodiversidade.\nSegundo dados do Censo Demográfico do Instituto Brasileiro de Geografia e Estatística (IBGE), mais de 260 mil pessoas vivem dentro de Unidades de Conservação no Amazonas. Do total, cerca de 96% estão em áreas de Uso Sustentável, como RDS e Resex, onde a conservação da floresta ocorre junto com a moradia e o sustento de comunidades tradicionais.\nO 'país' da floresta\nAmazônia legal no Amazonas\nBruno Kelly/Reuters\nOs 19 milhões de hectares administrados pelo governo estadual fazem parte de uma rede ainda maior de proteção. Somadas às unidades estaduais, existem outras 41 áreas sob gestão federal e nove municipais.\nEsse território funciona como uma barreira contra o avanço do desmatamento ilegal, do garimpo e da ocupação irregular de terras, principalmente em regiões mais vulneráveis do estado.\nAo g1, o secretário de Estado do Meio Ambiente do Amazonas, Eduardo Taveira, afirmou que a distância entre as unidades é um dos principais obstáculos para manter uma gestão permanente dessas áreas.\n\"Gerenciar 19 milhões de hectares territorialmente grandes e geograficamente distantes é um dos nossos principais desafios. Nossa estratégia tem sido fortalecer a gestão comunitária, apoiar associações locais e integrar políticas públicas com outras áreas, como Educação e Saúde\", afirmou.\nSegundo Taveira, existem unidades próximas de Manaus, com acesso em poucas horas de lancha, mas também áreas onde o deslocamento leva dias e envolve custos elevados de logística.\nEle cita como exemplo reservas como a RDS do Cujubim e a RDS do Rio Gregório, onde o transporte pode exigir operações aéreas e terrestres com valores superiores a R$ 12 mil por pessoa em agendas que partem da capital.\nAlém da distância, o secretário aponta a falta de recursos financeiros e os impactos das crises climáticas como desafios para a gestão ambiental.\nSegundo ele, investimentos em conservação disputam espaço com áreas como saúde e educação e, por isso, o estado busca recursos externos para ações de monitoramento e proteção de áreas ameaçadas pelo desmatamento, principalmente no sul do Amazonas.\n\"Os recursos necessários para dar conta de todas essas políticas públicas, diante do tamanho do desafio do Amazonas, são muito escassos. Por isso, recursos de cooperação internacional são fundamentais para manter a gestão das unidades de conservação e as estratégias de prevenção e combate ao desmatamento\", afirmou.\nNova lei de licenciamento ambiental ameaça Unidades de Conservação e a biodiversidade no AM, apontam especialistas\nQuem vive nas áreas protegidas\nPopulações tradicionais vivem em algumas Unidades de Conservação\nDivulgação/FAS\nNas unidades de Uso Sustentável, a preservação da floresta acontece junto com a permanência das comunidades tradicionais.\nDiferente de áreas de proteção integral, como Parques Nacionais e Estações Ecológicas, onde a presença humana é limitada, reservas como as RDS e Resex permitem que famílias vivam e desenvolvam atividades econômicas de baixo impacto.\nÉ o caso de comunidades que trabalham com manejo sustentável do pirarucu, coleta da castanha-do-amazonas, cultivo da mandioca e turismo de base comunitária.\nApesar da importância dessas populações para a conservação, moradores enfrentam desafios diários, como isolamento geográfico e dificuldade de acesso a serviços básicos, como energia elétrica, internet, água potável e educação.\nPara o doutor em Ciências do Ambiente e Sustentabilidade na Amazônia Antonio Norte, um dos principais problemas é garantir segurança jurídica para quem vive nessas regiões\n\"As Reservas de Desenvolvimento Sustentável e as Reservas Extrativistas foram criadas justamente para conciliar conservação ambiental e permanência das populações tradicionais. Mas ainda existem dificuldades relacionadas à regularização fundiária e à formalização dos direitos dessas comunidades\", explicou.\nFiscalização e pressão sobre a floresta\nMesmo com uma das maiores áreas protegidas do Brasil, as Unidades de Conservação continuam sob pressão. Especialistas alertam que áreas localizadas próximas a estradas e fronteiras agrícolas, principalmente APAs e reservas, sofrem com o avanço de atividades ilegais.\nO desafio não está apenas em criar áreas protegidas, mas em garantir estrutura para acompanhar um território maior que muitos países.\nAntonio Norte esclarece que existe uma diferença entre a proteção prevista na legislação e a capacidade prática de monitorar uma área tão extensa.\n\"Existe uma diferença significativa entre a proteção prevista na legislação e a capacidade operacional do Estado para monitorar territórios tão extensos e de difícil acesso. O desafio envolve recursos humanos, logística, tecnologia, orçamento e presença institucional permanente\", completou.\nLEIA TAMBÉM:\nF // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

  const vol  = toRoman(year - 1900);

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const xs = [22,50,80,115,148,180,215,248,35,95,162,228];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    xs.forEach((x,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + x + 'px;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const xs  = [16,34,54,76,98,118,142,164,188,212,238,262];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    xs.forEach((x,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + x + 'px;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);

  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;

function renderArticles() {
  let html = '';
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round((art.relevance_score || 0) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +

      '<div class="art-thumb-col">' +

        '</a>' +

        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +

        '</div>' +
      '</div>' +

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
