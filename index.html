<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

</svg>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>

      <div class="fx-panel-left">
        <span class="fx-kicker" id="j-fx-kicker">The Weather</span>
        <span class="fx-condition" id="j-wx-cond">Overcast Skies</span>
        <span class="fx-strapline" id="j-fx-strapline">Curitiba &amp; the Paran&aacute; highlands</span>
      </div>

  <div class="section-nav" id="j-nav"></div>

  <!-- ARTICLE LIST -->
  <div id="j-list"></div>

otos of Messi bathing baby Yamal", "headline_pt": "A história por trás das fotos de Messi dando banho no bebê Yamal", "one_liner_en": "A photographer reveals the charming backstory of Messi and Yamal's first encounter before their World Cup final clash.", "one_liner_pt": "Fotógrafo revela a história curiosa do primeiro encontro entre Messi e Yamal antes da final da Copa.", "category": "Culture", "region": "world", "rationale": "Messi and Yamal face each other in a World Cup final, making this viral backstory highly timely and widely read.", "low_signal": false}, {"title": "'Minha mãe me deixou doente de propósito durante anos, até que um médico a desmascarou'", "summary": "Por 14 anos, Nina Blom foi vítima da chamada síndrome de Münchausen por procuração, que leva o cuidador, geralmente um dos pais, a exagerar ou provocar deliberadamente uma doença no seu próprio filho. A sua mãe chegou a pedir sua eutanásia", "url": "https://www.bbc.com/portuguese/articles/c9828j71p5mo?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-07-16T22:24:47+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/01ba/live/9c31c8b0-7b04-11f1-9742-ddd4bea925d0.jpg", "url_hash": "fd54a68399ca6dd8550d6abe4d4edc90", "title_hash": "0122073d46c24d2ea2c0a0a57ec86103", "corroboration": 2, "relevance_score": 0.0366, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4733, "headline_en": "Mother made daughter sick for 14 years; a doctor finally exposed her", "headline_pt": "'Minha mãe me deixou doente por 14 anos; um médico a desmascarou'", "one_liner_en": "Nina Blom survived Munchausen by proxy abuse for 14 years, with her mother even requesting her euthanasia.", "one_liner_pt": "Nina Blom sobreviveu 14 anos de síndrome de Münchausen por procuração, com sua mãe chegando a pedir sua eutanásia.", "category": "Other", "region": "world", "rationale": "A rare and disturbing first-person account of medical child abuse highlights a poorly understood psychiatric condition.", "low_signal": false}, {"title": "A história por trás das fotos de Messi dando banho em Yamal bebê: 'Ele não sabia o que fazer', diz fotógrafo", "summary": "<img src=\"https://s2-g1.glbimg.com/9k1te_P8aY4iYzZt7JFd7-ZHpyw=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/j/D/5xIYAIQ2iq0Pg3Jw7lXQ/787f39f0-80f6-11f1-b983-cbe246fcd5da.jpg.webp\" /><br />     Destino já uniu Messi e Yamal bem antes da decisão do próximo domingo\nO maior jogador de futebol de todos os tempos e o herdeiro de sua coroa na ponta direita do Barcelona se enfrentarão pela primeira vez quando Argentina e Espanha entrarem em campo para disputar a final da Copa do Mundo 2026.\n✅ Siga o canal de notícias internacionais do g1 no WhatsApp\nAos 39 anos, Lionel Messi terá pela frente Lamine Yamal, de apenas 19. O fato de esse duelo acontecer já é, por si só, extraordinário: de um lado, a impressionante longevidade e perseverança do argentino; do outro, o talento precoce do jovem espanhol.\nO momento é ainda mais especial, a partida final do maior evento do futebol. Mas essa está longe de ser a primeira vez que os caminhos de Messi e Yamal se cruzam.\nO primeiro contato entre os dois ocorreu em 2007, quando Messi, então com 20 anos, começava a se firmar como titular do Barcelona. Lamine Yamal, por sua vez, tinha apenas cinco meses de vida.\nO encontro ficou registrado em uma série de fotos feitas pelo fotógrafo Joan Monfort.\nUma das imagens, compartilhada pelo pai de Yamal nas redes sociais durante a Eurocopa de 2024 — quando o jovem ajudou a Espanha a conquistar o título — com a legenda \"O começo de duas lendas\", voltou a viralizar nesta semana diante da expectativa pelo primeiro duelo entre os dois.\nA história de Lionel Messi e Lamine Yamal começou há duas décadas, quando o espanhol ainda era um bebê.\nJoan Monfort via BBC\nNa internet, muitas pessoas chegaram a acreditar que a foto havia sido criada por inteligência artificial. Nela, Messi aparece sorrindo enquanto dá banho em Yamal em uma pequena banheira, sem imaginar que aquele bebê seguiria tão de perto seus passos no futebol.\n\"É um verdadeiro milagre do destino\", afirmou Monfort à BBC Sport. \"É uma coincidência e tanto quando você descobre algo muito mais especial, muito maior do que você jamais imaginou. Se isso fosse roteiro de filme, ninguém acreditaria.\"\n'Messi não sabia o que fazer com um bebê'\nO ensaio fotográfico foi realizado no vestiário do Camp Nou, estádio do Barcelona.\nOs pais de Lamine Yamal, Mounir Nasraoui, nascido no Marrocos, e Sheila Ebana, natural da Guiné Equatorial, conheceram-se depois de se mudarem ainda crianças para a Catalunha com suas respectivas famílias.\nLamine Yamal é o filho mais velho do casal. Pouco depois de seu nascimento, seus pais participaram de um sorteio promovido pelo jornal catalão Sport, em parceria com a patrocinadora da camisa do Barcelona e a Unicef, organização internacional voltada à assistência infantil. \nAs famílias sorteadas ganhariam um ensaio fotográfico profissional de seus bebês ao lado de um jogador do elenco principal do Barcelona. A de Lamine Yamal foi uma das contempladas e, no dia do ensaio, acabou, por acaso, sendo colocada para fazer as fotos com Messi.\n\"Eu não tinha ideia que o bebê era Lamine até que um dos meus amigos me ligou em 2024 dizendo que o pai dele tinha postado a foto no Instagram\", explicou Monfort, que contou bastidores daquele ensaio.\n\"Messi sempre foi uma pessoa muito introvertida, muito tímida. Ele entrou no vestiário e, de repente, teve que posar para aquelas fotos com um bebê de colo — nem era uma criança maior, era um bebê de poucos meses. A expressão dele mudou completamente, como se não soubesse o que fazer.\"\n\"É uma situação difícil para um rapaz tão jovem, mas Lamine era um bebê muito alegre e sorridente. A mãe dele nos ajudou. Ela também era muito jovem, e a família era muito pobre, mas foi muito legal trabalhar com eles.\"\n\"Messi sempre foi muito profissional nesse tipo de situação e se adaptou muito rapidamente.\"\n'Nunca vou conseguir retribuir o que meus pais fizeram por mim'\nEspanha aposta no talento de Lamine Yamal e Nico Williams para superar a França\nQuando completou 19 anos, Messi havia marcado 11 gols e conquistado uma vez tanto a La Liga (campeonato espanhol) quanto a Champions League (Liga dos Campeões da Uefa).\nRecém-completados 19 anos na segunda-feira, Lamine Yamal já marcou impressionantes 56 gols e conquistou três títulos da La Liga, uma Copa do Rei e a Eurocopa de 2024.\nYamal, na verdade, não é o sobrenome do jogador, mas o segundo de seus dois primeiros nomes.\nSeu nome completo é Lamine Yamal Naraoui Ebana, e ele usa os dois primeiros nomes tanto na camisa do Barcelona quanto da Espanha em homenagem a duas pessoas que ajudaram sua família na época em que ele nasceu. \nJá foi amplamente divulgado pela imprensa espanhola que o pai de Lamine Yamal prometeu dar o nome ao filho em homenagem a dois amigos que ajudaram a família financeiramente, permitindo que ele pagasse as contas em um período de dificuldades. \nLamine é um nome comum em árabe, que pode ser traduzido como honesto ou confiável, enquanto Yamal é uma variante de Jamal, que significa elegância ou beleza.\nO jogador cresceu em Rocafonda, um bairro de trabalhadores em Mataro, ao norte de Barcelona.\nA área foi construída nos anos 1960 para abrigar migrantes de outras partes da Espanha. Quando esses moradores começaram a se mudar para áreas mais valorizadas, imigrantes de outros países passaram a chegar ao local nos anos 1990.\nLamine Yamal já comemorou alguns de seus gols fazendo o gesto de \"3-0-4\" com os dedos, em referência ao código postal de Rocafonda.\n\"O que minha mãe fez, o que meu pai fez, eu não conseguiria fazer por ninguém que não fosse meu filho\", disse Yamal ao jornal El País durante a Copa. \"Quando você não tem dinheiro, é muito difícil ajudar seu filho a jogar futebol. E meus pais conseguiram fazer tudo isso acontecer. É algo que eu nunca vou conseguir retribuir a eles.\"\n'Estamos encerrando o ciclo da história deles'\nPara Monfort, torcedor do Barcelona, um encontro entre os dois dentro de campo é o desfecho perfeito para uma história que começou quase duas décadas atrás.\n\"Acho que estamos encerrando o ciclo da história deles\", acrescenta Monfort, hoje com 58 anos. \"É um final feliz\".\n\"Sou torcedor do Barcelona e acho que, para Messi, seria perfeito encerrar a carreira conquistando a Copa do Mundo pela segunda vez. Acho que ele merece\", afirmou. \n\"Para Lamine, ele ainda tem muito tempo para conquistar títulos como a Copa do Mundo. Mas a Espanha e Lamine chegam em um bom momento e, se ele vencer agora, esse título valeria mais do que os outros que já conquistou. É muito difícil para mim. Meu coração está dividido em dois.\"", "url": "https://g1.globo.com/mundo/noticia/2026/07/17/a-historia-por-tras-das-fotos-de-messi-dando-banho-em-yamal-bebe-ele-nao-sabia-o-que-fazer-diz-fotografo.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-17T11:48:56+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/9k1te_P8aY4iYzZt7JFd7-ZHpyw=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/j/D/5xIYAIQ2iq0Pg3Jw7lXQ/787f39f0-80f6-11f1-b983-cbe246fcd5da.jpg.webp", "url_hash": "f6c3ff6c314c4712a3ecc806c07fa6c5", "title_hash": "8f6620214475aae80e0bb145fee152d2", "corroboration": 2, "relevance_score": 0.0047, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4574, "headline_en": "The story behind photos of Messi bathing baby Yamal", "headline_pt": "A história por trás das fotos de Messi dando banho no bebê Yamal", "one_liner_en": "Photographer recounts how Messi awkwardly bathed a baby Yamal, long before their World Cup final showdown.", "one_liner_pt": "Fotógrafo conta como Messi deu banho no bebê Yamal, muito antes do duelo na final da Copa do Mundo.", "category": "Culture", "region": "world", "rationale": "Near-duplicate of index 0 from a different Brazilian source; same viral story ahead of the World Cup final.", "low_signal": true}, {"title": "'Minha mãe me deixou doente de propósito durante anos, até que um médico a desmascarou'", "summary": "<img src=\"https://s2-g1.glbimg.com/BzHxD4R27TLizAjdJ2F1nLJUSpE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/X/o/yfWblnQdiCfPninuUwxw/9c31c8b0-7b04-11f1-9742-ddd4bea925d0.jpg.webp\" /><br />     Quando Nina Blom era pequena, sua mãe a levou para 16 hospitais, para que fosse tratada de doenças que não existiam\nNina Blom / Arquivo Pessoal\nNina Blom parecia uma criança normal, que brincava e se divertia cantando e dançando.\nMas, de repente, sua mãe se convenceu de que a menina estava gravemente doente. Ela a levava constantemente a hospitais para fazer exames e tratamentos: foram 16 vezes em poucos anos.\nBlom cresceu na Holanda, nas décadas de 1970 e 1980. Ela precisou usar cadeira de rodas, e sua mãe disse que ela sofria de uma doença muscular incurável.\nMuitos médicos examinaram a menina, sem conseguir decifrar o que estava acontecendo. Até que um médico perspicaz conseguiu reconstruir sua história e descobrir a verdadeira e obscura razão da sua doença: sua mãe.\nSiga o canal do g1 Bem-Estar no WhatsApp\nAgora no g1\nEra um caso de falsificação de doenças pediátricas, também conhecida por outros nomes, como \"doença fabricada ou induzida\" ou \"síndrome de Münchausen por procuração\".\nTrata-se de uma forma de abuso infantil, em que o cuidador (geralmente, um dos progenitores) exagera ou provoca deliberadamente uma doença na criança.\nOs motivos que levam à falsificação de doenças pediátricas não são totalmente conhecidos e permanecem sendo objeto de estudos.\nAo chegar à idade adulta, Blom publicou suas experiências em um livro intitulado You are a Horrible Child (Você é uma criança horrível). Suas histórias inspiraram um romance em quadrinhos para jovens, chamado You are going to Die (Você vai morrer), junto a Margreet de Heer.\nEla foi entrevistada pelo programa de rádio Outlook, do Serviço Mundial da BBC.\n'Eu era uma menina muito alegre'\n\"Tenho lindas recordações com minha irmã no ático da casa\", conta Blom. \"Tínhamos o nosso lugar próprio para brincar.\"\nEla adorava ouvir música, dançar e costumava ser uma menina muito alegre.\nMas estes momentos eram raros. Sua mãe a deixava sair muito pouco de casa.\nQuando tinha 8 anos, Blom começou a se sentir cada vez mais doente e acabou sob o rigoroso controle da sua mãe. Ela sofria constantes problemas estomacais e perdia muito peso.\n\"Lembro que minha mãe me fazia sentir muito medo e dizia que eu precisava ir ao hospital\", segundo ela. Nestas consultas, ela recebia sopa e suco de maçã e, estranhamente, passava a se sentir bem.\n\"O médico dizia: 'Nina está bem, agora está bem, não temos o que fazer, ela pode ir para casa\", relembra ela.\nMas a mãe insistia em voltar ao hospital e que ela dissesse ao médico que sentia dor de estômago.\nNina Blom se lembra da época em que foi muito feliz ao lado da sua irmã, até que começou o pesadelo\nNina Blom / Arquivo Pessoal\nCerta vez, Blom estava de férias e, enquanto nadava na piscina com sua irmã, ela se queixou por um momento de um mal-estar muscular porque havia nadado muito.\nA mãe então lhe disse que ela tinha uma doença nos músculos. \"Você precisa ir ao hospital por alguns dias\", segundo ela.\nAo voltar das férias, a menina respondeu que não sentia dores, ao que a mãe respondeu: \"Não me faça passar vergonha. Você sente dor e vai dizer isso ao médico.\"\nTudo era muito confuso para a menina porque ela não entendia o que estava acontecendo.\n\"No hospital, eu me sentia culpada porque havia outras crianças ali que tinham câncer, que estavam realmente muito doentes\", relembra ela.\n\"Comigo, não há nada de errado\", pensava Blom, deitada em uma maca. \"Ao meu lado, havia um menino que morreu porque estava muito doente.\"\nÀs vezes, seu pai se perguntava o que estava acontecendo com sua filha, mas seguia o que a mãe dizia. \"Ele não fez nada para me proteger.\"\n'Ela era cruel'\nNina Blom passou por anos de abuso infantil, físico e psicológico\nNina Blom / Arquivo Pessoal\nNo hospital, ela passou por todo tipo de exames, alguns deles muito dolorosos, como uma biópsia de medula óssea, e não encontraram nada.\n\"Minha mãe estava sempre presente e parecia que gostava daquilo\", ela conta.\nA mãe exigia que ela não chorasse, que ela fosse corajosa.\n\"Eu era uma menina feliz que sorria, mas minha mãe, quando me via sorrindo, ficava irritada e me castigava\", relembra ela. \"Ela agia como se quisesse que eu sentisse dor.\"\nA mãe a castigava destruindo seus livros favoritos e, quando ela ficou um pouco maior, impunha castigos físicos e psicológicos. \"Ela era cruel, não tinha coração.\"\nEm uma ocasião, ela ficou quatro semanas no hospital, até que os médicos decidiram mandá-la para casa.\nQuando ela voltou, a mãe a colocou em uma cadeira de rodas. Ela fez com que a menina abandonasse a escola e levou sua cama para a sala. \"Fui proibida de dormir no meu quarto.\"\nNina Blom passava a maior parte do tempo na cama, sem nenhum contato com o mundo exterior.\n\"Eu gostava de ouvir música, mas, quando minha mãe viu que aquilo me divertia, ela me tirou.\"\nA menina aprendeu a não expressar seus sentimentos. Naquela época, Blom sonhava que alguém viria resgatá-la.\nEles se mudaram de casa várias vezes, e a mãe sempre encontrava novos médicos para examiná-la. O pesadelo, então, recomeçava.\nBlom tecia para passar o tempo e, um dia, comentou com a mãe que suas mãos estavam doendo.\nA mãe reagiu imediatamente. Ela respondeu que algo terrível estava acontecendo e enfaixou seus braços. As faixas ficaram tão apertadas que os braços e dedos da menina ficaram adormecidos.\n\"Não consigo contar como era terrível ver minha mãe esperando que eu sentisse dor\", lamenta Blom. \"Ela se divertia.\"\n'Você vai morrer'\nA mãe de Nina Blom obrigava a menina a usar uma cadeira de rodas e enfaixava seus braços para fazer com que ela sentisse dor\nNina Blom / Arquivo Pessoal\nCom o passar do tempo, sua mãe alterou a história.\n\"Se eu descobrir que você não sente dor e inventou tudo isso, você vai ver o que vou fazer\", dizia ela.\nA menina estava cada vez mais confusa.\nPor passar todo o tempo prostrada e com os braços enfaixados, ela começou a perder força. Por isso, os médicos a enviaram para passar algum tempo em uma clínica, para receber fisioterapia.\nQuando seu pai descobriu que a menina estava sozinha na clínica, ele a levou embora.\nMas Blom foi enviada para outra clínica, onde aprendeu a caminhar novamente e se apaixonou por um menino que também estava em tratamento.\nDepois de tanto tempo, ela começou novamente a ser feliz, até que os médicos da clínica decidiram que ela poderia sair de visita para casa todo fim de semana.\nQuando a mãe foi buscá-la, disse: \"Você precisa colocar as faixas outra vez.\"\n\"Ela me dava comprimidos secretamente e eu não tinha permissão para caminhar em casa\", relembra Blom.\nCom isso, a história se repetiu mais uma vez como antes. \"Foi horrível\", lamenta ela.\nPor fim, os fins de semana de visita em casa terminaram e ela foi levada de volta para morar com seus pais em caráter permanente.\nQuando Blom tinha 12 anos, sua mãe ficou doente.\nNaquela época, a menina não tinha permissão para caminhar, mas eles a deixavam engatinhar. Ela ficava contente com a liberdade que ganhava graças à ausência da sua mãe.\nQuando a mãe voltou para casa, o pai de Nina Blom teve um colapso mental. Ele havia se tornado agressivo e imprevisível.\nA mãe reclamava que sentia dores de estômago e começou a culpar a menina pelos seus problemas físicos.\nEm um momento de discussão familiar, o pai teve um acesso de fúria e lançou sua xícara de café quente sobre o pé direito da menina. Com isso, a violência deixava de vir apenas da sua mãe, mas também do seu pai.\nÀ medida que passava o tempo, a mãe continuava descobrindo supostas doenças do coração e de outras partes do organismo da menina. Até que um dia, ela disse: \"Você vai morrer.\"\n\"Aquela foi a primeira vez em que me senti totalmente sozinha, como se estivesse caindo em um buraco escuro\", recorda Blom. \"Foi muito doloroso.\"\n'Queremos a eutanásia, pode nos ajudar, doutor?'\nCom o passar do tempo, a mãe de Nina Blom começou a envenená-la com comprimidos e tentou convencer os médicos a praticar eutanásia com sua filha\nNina Blom / Arquivo Pessoal\nMas algo estava para acontecer com Nina Blom. Durante uma internação em outro hospital, ela conheceu um novo pediatra, o Dr. Vrienten.\nO médico entrou no quarto onde a menina estava hospitalizada e disse que iria procurar um lugar que pudesse ajudá-la a mover os membros e as articulações, para que ela voltasse a caminhar.\nConfusa e incrédula, a menina se perguntava o que estava acontecendo.\nSua mãe havia explicado que ela tinha uma doença muscular e que iria morrer. É claro que sempre havia uma certa dúvida na sua cabeça, mas ela não se atrevia a fazer perguntas.\nQuando sua mãe soube que o médico a estava transferindo para um centro de reabilitação, ela explodiu de raiva e disse: \"Qual clínica? Você vai morrer.\" E a menina precisou voltar para casa.\nAo regressar, a mãe a obrigou a colocar as pernas em forma de X, usando almofadas para fixá-las naquela posição. Ela retirou sua alimentação, instalou uma sonda nasogástrica e a obrigou a tomar 20 comprimidos por dia.\nEla voltou novamente, desta vez para outro hospital, como já havia acontecido tantas vezes.\nDesta vez, sua mãe ficou com ela 24 horas por dia. Quando as enfermeiras pediam que ela tomasse a temperatura da filha, ela pegava um copo e colocava o termômetro na água quente, para falsificar sua temperatura.\nPosteriormente, em uma visita dos médicos, a menina não se sentia bem. Ela estava deitada na maca e tinha dificuldade para respirar.\nDe repente, ela percebe que o médico estava de pé ao lado da sua mãe, quando ela disse a ele claramente: \"Queremos a eutanásia, pode nos ajudar, doutor?\"\nNina Blom recorda que ela própria expressou o mesmo desejo ao médico, levada por tantos anos de sofrimento.\nEla disse ao médico: \"Doutor, quero morrer. Pode me ajudar?\"\n\"Naquele momento, o médico deu um passo para trás, falou com minha mãe e receitou 24 horas de morfina\", conta Blom.\n\"Nós a manteremos adormecida\", explicou o médico.\nDepois desta resposta, a menina pensou que não havia mais nenhuma saída. Ela estava certa de que ninguém nunca iria acreditar nela.\nO resgate\nA vida da pequena Nina Blom só mudou quando um médico percebeu a situação e chamou os serviços de assistência social\nGentileza Nina Blom\nMas o Dr. Vrienten percebeu o que estava acontecendo e decidiu entrar em contato com o serviço de proteção de menores.\nUm dia, uma mulher entrou no seu quarto e disse:\n\"Olá, Nina, sou do serviço de proteção de menores e estou aqui para ajudar você. Vou levar você para um novo hospital.\"\nQuando ela pronunciou a palavra \"hospital\", Blom respondeu \"não, não, por favor, me deixe morrer, não quero mais ir para o hospital\".\nA menina percebeu que sua mãe estava entrando em pânico. Havia dois policiais vigiando a operação.\nLogo apareceram dois homens que a colocaram em uma ambulância e a levaram para um hospital.\n\"Eles tiraram as faixas dos meus braços e pernas e havia uma câmera de vídeo no pequeno quarto, à minha direita\", ela conta.\n\"Por dois dias, eu não vi meu pai, nem minha mãe, mas... Bem, dois dias depois, eles vieram me visitar pela primeira vez.\"\n\"Lembro que, naquela primeira visita, eu repeti para eles até 18 vezes que não estava doente\", prossegue ela.\n\"Minha mãe esqueceu que a câmera estava gravando e ficou furiosa cada vez que eu dizia que não estava doente. Isso também serviu de prova e revelação do que estava acontecendo comigo.\"\nNina Blom foi finalmente libertada do seu martírio. Ela foi compreender o que realmente havia acontecido tempos depois.\nA menina foi vítima da chamada síndrome de Münchausen, uma espécie de abuso infantil em que o cuidador, geralmente um dos pais, exagera ou causa deliberadamente uma doença na criança.\nOs motivos que causam esta falsificação de doenças pediátricas não são totalmente compreendidos, mas seus efeitos podem ser devastadores.\n\"Minha mãe me deixou doente por 14 anos\", ela conta.\n\"Ela me deixava doente para receber atenção dos médicos. E também causou doenças nela mesma várias vezes. Ela se submeteu a mais de 50 cirurgias.\"\nBlom deixou de ver seus pais e levou anos para recuperar sua vida normal.\nInicialmente, ela morou em uma clínica, recebendo terapia física e psicológica. Depois, em uma casa assistida e, por fim, se estabeleceu em uma nova cidade, com outra identidade.\nBlom se formou em uma academia de arte e encontrou trabalho e o amor. Sua irmã se mudou para longe dos seus pais e rompeu todo o contato com eles.\n\"O que meus pais me fizeram foi um crime\", relata ela. \"É uma forma grave de abuso infantil e eu simplesmente sobrevivi.\"\nAnos depois, em 2009, ela percebeu que seus pais não receberam nenhuma punição. E também não reconheceram o que haviam feito à pequena Nina.\nDepois de pensar cuidadosamente, ela decidiu deixar toda esta história para trás e reconstruir sua própria vida.\n\"Estou muito, muito feliz por ter sobrevivido. Existem tantos motivos para viver.\"", "url": "https://g1.globo.com/saude/saude-mental/noticia/2026/07/17/minha-mae-me-deixou-doente-de-proposito-durante-anos-ate-que-um-medico-a-desmascarou.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-17T10:39:39+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/BzHxD4R27TLizAjdJ2F1nLJUSpE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/X/o/yfWblnQdiCfPninuUwxw/9c31c8b0-7b04-11f1-9742-ddd4bea925d0.jpg.webp", "url_hash": "c456c9b01e2cb3fa6f72e569e9   img.src = 'the_lighthouse2.png';
}

// ── State ────────────────────────────────────────────────────────────
const TABS = [
  { id: 'world',    lk: 'tab_world',    bk: 'blurb_world' },
  { id: 'brazil',   lk: 'tab_brazil',   bk: 'blurb_brazil' },
  { id: 'curitiba', lk: 'tab_curitiba', bk: 'blurb_curitiba' }
];
let activeTab = 'world';
let minRel = 0, minCorr = 1, hideLow = true;

// ── Language switch ───────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.getElementById('j-lang-en').classList.toggle('active', l === 'en');
  document.getElementById('j-lang-pt').classList.toggle('active', l === 'pt');
  updateStaticLabels();
  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();
}

function updateStaticLabels() {
  document.getElementById('j-digital-daily').textContent    = t('digital_daily');
  document.getElementById('j-price-free').textContent       = t('price_free');
  document.getElementById('j-fx-kicker').textContent        = t('the_weather');

}

// ── Masthead ─────────────────────────────────────────────────────────
function renderMasthead() {
  const iso = DATA.date || new Date().toISOString().slice(0,10);
  const year = new Date(iso + 'T12:00:00').getFullYear();
  const vol  = toRoman(year - 1900);
  const doy  = dayOfYear(iso);
  document.getElementById('j-vol').textContent  = 'Vol. ' + vol + ' · No. ' + doy;
  document.getElementById('j-date').textContent = fmtDate(iso);
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

// ── Briefing ─────────────────────────────────────────────────────────
function renderBriefing() {
  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  const maxRel = Math.max(...DATA.articles.map(a => a.relevance_score || 0), 0.01);
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round(((art.relevance_score || 0) / maxRel) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
        '<div class="art-actions">' +
          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
