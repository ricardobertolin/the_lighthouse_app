<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

</svg>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
      <button id="j-lang-pt" class="lang-btn" onclick="setLang('pt')">PT</button>

    <span class="mast-rule mast-rule-l"><span class="mast-rule-line"></span><span class="mast-rule-gem">&#9670;</span></span>

    <span class="mast-rule mast-rule-r"><span class="mast-rule-gem">&#9670;</span><span class="mast-rule-line"></span></span>
  </div>
  <div class="mast-date">
    <span>Curitiba, Paran&aacute;</span>
    <span class="mast-date-center" id="j-date"></span>

  <div class="forecast">
    <div class="fx-canvas" id="j-fx-canvas"></div>
    <div class="fx-panel">
      <div class="fx-panel-left">
        <span class="fx-kicker" id="j-fx-kicker">The Weather</span>
        <span class="fx-condition" id="j-wx-cond">Overcast Skies</span>
        <span class="fx-strapline" id="j-fx-strapline">Curitiba &amp; the Paran&aacute; highlands</span>
      </div>
      <div class="fx-stats" id="j-wx-stats">
        <span><b>HIGH</b> --&deg;</span><span><b>LOW</b> --&deg;</span><span><b>WIND</b> --</span>

  <!-- SECTION NAV -->
  <div class="section-nav" id="j-nav"></div>

  <!-- FILTER STRIP -->
  <div class="filter-strip">

    <label class="flt-check-lbl">

      <span id="j-flt-low-lbl">Hide Low-Signal</span>

  <div class="briefing" id="j-briefing" style="display:none;">

  </div>

  <!-- STATS -->
  <div class="edition-stats" id="j-stats"></div>

  <!-- ARTICLE LIST -->

  <!-- EDITION FOOTER -->

n": "China's reduced US imports after Trump tariffs are redirecting trade flows toward Brazil, per the Financial Times.", "one_liner_pt": "A redução das importações chinesas dos EUA após tarifas de Trump beneficia o Brasil, segundo o Financial Times.", "category": "Economy", "region": "brazil", "rationale": "A shift in global agricultural trade leadership would have major economic consequences for Brazil and the US.", "low_signal": false}, {"title": "EUA podem perder para o Brasil o papel de maior exportador agrícola do mundo, diz Financial Times", "summary": "<img src=\"https://s2-g1.glbimg.com/F3831qCZPYN5kd1ZtBM9tZCRNWM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/9/m/hjRqvUSDi3CSQ74AYbpg/canva-82-.png\" /><br />     Colheita de soja em Não-Me-Toque, município do Rio Grande do Sul.\nDiego Vara/Reuters\nUma reportagem publicada nesta terça-feira (21/7) no britânico Financial Times, um dois principais jornais de finanças do mundo, afirma que os Estados Unidos correm o risco de perder para o Brasil o posto de maior exportador agrícola do mundo.\nSegundo o Departamento de Agricultura americano e o Ministério da Agricultura brasileiro, os EUA exportaram US$ 171 bilhões em produtos agrícolas no ano passado, apenas US$ 2 bilhões a mais do que o Brasil. Em 2021, essa diferença foi de US$ 56 bilhões.\n🗒️Tem alguma sugestão de reportagem? Envie para o g1 \nO texto diz que as exportações brasileiras no agro cresceram 6% no primeiro semestre de 2026, atingindo um recorde de US$ 87 bilhões, graças não só ao seu papel de maior produtor mundial de soja e das carnes bovina e avícola, mas também do sucesso de cultivos como o algodão, que tinha os EUA como seu principal exportador, mas que foi ultrapassado pelo Brasil.\nTarifaço de Trump: governo deve iniciar nesta terça reuniões com setores afetados pela nova taxa\nVeja a lista de produtos que ficaram isentos e os que serão impactados pela nova taxa\nVendas de produtos brasileiros para a China batem recorde após tarifaço dos EUA\nO papel da China\nPara os analistas ouvidos pela reportagem britânica, que esteve nos Estados de Iowa, nos EUA, e em Mato Grosso, no Brasil, a principal razão por trás desta mudança está nas \"perturbações comerciais desencadeadas pelas tarifas impostas pelo presidente Donald Trump\".\nIsso porque a China, um dos maiores compradores do mundo, reduziu significativamente suas importações dos americanos depois que o republicano impôs tarifas ao país em 2018, ainda durante seu primeiro mandato na Casa Branca.\nUm gráfico que acompanha a reportagem mostra que, em 2016, a China comprava volumes semelhantes de soja do Brasil e dos EUA. As exportações brasileiras já cresciam, mas em ritmo mais moderado.\nCom a retaliação de Pequim às tarifas de Washington em 2018, porém, esse crescimento se acelerou. Em 2025, o Brasil exportou mais de 80 milhões de toneladas de soja para a China, enquanto os EUA não chegaram à casa das dezenas de milhões de toneladas.\nOs dados são do UN Comtrade (United Nations Commodity Trade Statistics Database), considerado o maior e mais abrangente repositório público de estatísticas de comércio internacional.\nÚltima visita de Trump a China, em maio de 2026, foi definida mais por uma retórica simbolista do que por anúncios concretos\nGetty Images via BBC\nO Financial Times diz que, embora os EUA sigam capazes de produzir \"safras extraordinárias\", \"as margens de lucro estão desaparecendo à medida que as tensões comerciais e os preços baixos deixam sua marca no Meio-Oeste\".\nSegundo a reportagem, a estimativa da American Farm Bureau Federation, a maior organização e grupo de lobby de agricultores e pecuaristas dos EUA, é de que o setor tenha no próximo ano prejuízos de US$ 138 por acre para a soja, US$ 167 para o milho, US$ 145 para o trigo e US$ 406 para o algodão.\nA ascensão de Mato Grosso\nO Financial Times lembra que \"a força do setor agrícola do Brasil não é apenas consequência da política comercial americana\", mas é algo que vem sendo construído ao longo das últimas décadas.\nA reportagem conta que o Brasil, hoje líder ainda na exportação de café, cana-de-açúcar e suco de laranja, dependia de importações para alimentar sua população até os anos 1970. A situação mudou quando o país passou a tirar vantagem de seu território, capaz de gerar duas ou até três safras no mesmo ano.\nIsso se deve, em parte, à disponibilidade e ao baixo custo da terra, principalmente nas regiões de fronteira, mas também à expansão da produção para áreas antes consideradas inférteis ou de difícil cultivo, que ganharam sobrevida com \"o tratamento de solos pobres em nutrientes e o desenvolvimento genético de culturas adaptada ao clima\".\n\"Esse modelo de produção contínua ajuda a diluir os custos fixos e, normalmente, melhora as margens das propriedades rurais\", explicou Raphael Bulascoschi, analista da corretora de commodities StoneX, ao periódico britânico.\nMas o Brasil, acrescentam os especialistas ouvidos pelo Financial Times, também se prepara para cenários menos favoráveis, diante das altas taxas de juros internas, da queda nos preços das commodities e, após a guerra entre Irã e Israel, da alta no preço dos fertilizantes, que vêm, em sua vasta maioria, de fora.", "url": "https://g1.globo.com/economia/agronegocios/noticia/2026/07/21/eua-podem-perder-para-o-brasil-o-papel-de-maior-exportador-agricola-do-mundo-diz-financial-times.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-21T11:27:49+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/F3831qCZPYN5kd1ZtBM9tZCRNWM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/9/m/hjRqvUSDi3CSQ74AYbpg/canva-82-.png", "url_hash": "fdf4246782ed8415180fdbc35d1008a3", "title_hash": "8a941bae166db80ff0f689c0686617f4", "corroboration": 2, "relevance_score": 0.2484, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5792, "headline_en": "Brazil May Overtake US as World's backsliding event in Latin America.", "low_signal": false}, {"title": "'Não haverá mais eleições aqui': o discurso de Daniel Ortega que fecha caminho para oposição na Nicarágua", "summary": "<img src=\"https://s2-g1.glbimg.com/6Jrqyfzl1xxE6qA8JS2ar5ik1nA=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/T/z/AVDoSvTp6sjaBfOPDyVA/design-sem-nome-32-.jpg\" /><br />     Presidente da Nicarágua anuncia que o país não terá mais eleições\nO presidente da Nicarágua, Daniel Ortega, afirmou no domingo (19/07) que o país não terá mais eleições, para impedir que a oposição chegue ao poder.\n✅ Siga o canal de notícias internacionais do g1 no WhatsApp\n\"Não haverá mais eleições aqui para que eles [a oposição] tentem tomar o governo e o poder\", declarou Ortega em seu discurso durante a comemoração da Revolução Sandinista de 1979. \nSegundo informações da agência de notícia Reuters e do jornal local La Prensa, Ortega discursou para milhares de pessoas no ato que comemorou a derrubada do governo do ditador Anastasio Somoza. Ainda de acordo com o jornal independente Confidencial 30, da Nicarágua, o discurso foi feito na Praça da Fé, na capital Manágua.\nEm seu discurso, Ortega não deu mais detalhes sobre como a proibição será implementada.\n\"Os dias em que partidos apoiados pelos ianques [Estados Unidos] e pelos somosistas voltariam ao poder acabaram. Nunca mais\", disse Ortega. Foi a primeira aparição pública do presidente em dois meses.\nOrtega está no poder ininterruptamente desde 2007. A última eleição presidencial, em novembro de 2021, foi contestada, já que todos os principais candidatos da oposição foram presos.\nEUA, União Europeia, Canadá e Costa Rica classificaram o último processo eleitoral como \"ilegítimo\". No Brasil, o PT foi duramente criticado por apoiadores e rivais ao divulgar uma nota saudando Ortega pela vitória, que acabou retirada da página do partido após a repercussão.\nEle liderou o país pela primeira vez ao ser eleito coordenador do Conselho de Administração, em 1981, dois anos depois do triunfo da Revolução Sandinista (1979). Em 1984, ele ganhou as eleições, ocupando a presidência até 1990.\nOrtega está no poder há mais tempo do que qualquer membro da dinastia dos Somozas, grupo familiar que comandou o país por mais de 40 anos e que o próprio Ortega ajudou a derrubar.\nEm 2024, Ortega propôs mudanças na Constituição para dar a ele e à esposa, Rosario Murillo, poder absoluto sobre os três Poderes do Estado.\n'Os dias em que partidos apoiados pelos ianques [Estados Unidos] e pelos somosistas voltaria ao poder acabaram', disse Ortega.\nLeonardo Fernandez Vilori/Reuters via BBC\nO governo Ortega consolidou sua guinada autoritária por volta de 2018, quando houve protestos contra reformas previdenciárias anunciadas pelo governo.\nA repressão foi dura, inclusive com a participação de paramilitares pró-governo, segundo vários relatórios da Comissão Interamericana de Direitos Humanos (CIDH).\nEm meio a este conflito, a brasileira Raynéia Gabrielle da Costa, médica residente na capital Manágua, foi morta a tiros em julho de 2018. Um homem foi condenado pela morte dela, mas depois anistiado. De acordo com entrevistados pela BBC News Brasil à época, ele era ligado ao regime de Ortega.\nRevolução Sandinista e Ortega no poder\nAnastasio Somoza García foi presidente por 16 anos e seus filhos Luis Somoza Debayle e Anastasio Somoza Debayle governaram a Nicarágua por quase 7 e 9 anos, respectivamente.\nNa história da América Latina, Ortega fica atrás apenas de Fidel Castro (Cuba), Porfirio Díaz (México), Alfredo Stroessner (Paraguai) e Rafael Leónidas Trujillo (República Dominicana) no rol de governantes que por mais tempo permaneceram no poder na região.\nAbaixo, a BBC News Mundo, serviço em espanhol da BBC, listou cinco pontos que explicam a chegada de Ortega ao poder e como ele conseguiu permanecer por tanto tempo no cargo.\nO eterno candidato único da Frente Sandinista\nO pacto que permitiu a Ortega voltar ao poder\nAs reformas\nCerco de oponentes\nPragmatismo de Ortega\nDaniel Ortega e sua esposa Rosario Murillo. Mudanças nas leis do país ampliaram poderes do casal.\nGetty Images via BBC\n1. O eterno candidato único da Frente Sandinista\nOrtega se tornou a face mais conhecida da revolução sandinista que derrubou o regime de Somoza em 1979. Após o triunfo, o Conselho de Administração da Reconstrução Nacional foi instalado como um governo transitório da Nicarágua.\nEm março de 1981, a Direção Nacional da Frente Sandinista de Libertação Nacional (FSLN) elegeu Ortega como coordenador.\n\"Daniel Ortega aproveitou sua personalidade discreta para se posicionar como o homem da Frente Sandinista no Conselho de Administração que foi instalado após a derrubada de Somoza\", diz o jornalista Fabián Medina, autor do livro El prisioneiro 198, um perfil do mandatário.\n\"Ortega foi escolhido pelo Diretório Nacional porque parecia menos perigoso do que os três principais comandantes da época: Henry Ruiz, Tomas Borge e Humberto Ortega. Todos queriam ser presidentes e nenhum aceitava os outros dois\", lembra Medina.\nPosteriormente, Ortega foi eleito candidato da Frente Sandinista nas eleições de 1984, quando conquistou a presidência pela primeira vez.\n\"Já nos anos 1990 ele manteve o controle, eliminando dissidências e rivais internos que apareciam, de tal forma que, quando havia eleição, só restava ele\", acrescenta o jornalista.\nNos últimos 37 anos, Ortega foi o único candidato à presidência pelo partido FSLN. Ele já se candidatou em oito campanhas.\nPerdeu o poder em 1990 para Violeta Barrios de Chamorro e também nas duas eleições seguintes: 1996 e 2001.\nMas voltou em 2007 e se mantém no cargo desde então.\nClique aqui para voltar ao início.\n2. O pacto que permitiu a Ortega voltar ao poder\nApós 16 anos tentando retornar à presidência, Ortega foi bem-sucedido nas eleições de novembro de 2006.\nÀquela altura, ele não era mais um homem vestido com um uniforme sandinista e com um discurso revolucionário. Em vez disso, tinha um slogan de campanha que proclamava \"paz e reconciliação nacional\" e que se autodenominava \"socialista\" e \"cristão\".\nOrtega voltou ao poder com apenas 38% dos votos.\nO retorno ocorreu graças a um acordo entre ele e o ex-presidente Arnoldo Alemán, líder do Partido Liberal Constitucional (PLC). Anos antes, os dois concordaram em baixar o limite mínimo para a eleição de um candidato de 45% para 35% dos votos.\nA lei eleitoral anterior estabelecia que as eleições seriam vencidas se um dos candidatos tivesse 45% dos votos no primeiro turno. Após o acordo, ficou definido que a presidência seria conquistada com 40% no primeiro turno, ou com 35% dos votos se houvesse uma diferença de pelo menos 5% entre o primeiro e o segundo colocados.\n\"A implementação deste pacto gerou graves consequências no exercício, proteção e garantia dos direitos humanos e no enfraquecimento do Estado de Direito\", afirmou a Comissão Interamericana de Direitos Humanos (CIDH) em seu relatório \"Nicarágua: Concentração de poder e enfraquecimento do Estado de Direito\", publicado em 28 de outubro.\nClique aqui para voltar ao início.\n3. As reformas\nQuando Daniel Ortega assumiu o poder em 2007, a Constituição da Nicarágua proibia a reeleição consecutiva e também a candidatura ao cargo depois de dois mandatos em momentos diferentes.\nEm outras palavras, se a lei fosse cumprida, Ortega não poderia se tornar presidente da Nicarágua novamente.\nDois anos depois de sua chegada ao poder, no entanto, a Suprema Corte emitiu uma decisão declarando o artigo 147 da Constituição que proibia a reeleição \"inaplicável\". Essa decisão abriu caminho para Ortega concorrer nas eleições de 2011.\nNo final de 2013, ele enviou uma proposta de reforma constitucional que foi posteriormente aprovada pela Assembleia Nacional, por maioria sandinista.\nA reforma permitiu a reeleição por tempo indeterminado, estabeleceu a eleição do presidente no primeiro turno por maioria simples e possibilitou ao presidente expedir decretos com força de lei.\n\"Tenho certeza de que haverá mais paz, mais segurança, mais tranquilidade, mais esperança e mais alegria no povo da Nicarágua\", disse Ortega em discurso anterior à aprovação da reforma.\nNo final de 2020, a Organização dos Estados Americanos (OEA) emitiu uma resolução estabelecendo maio de 2021 como prazo final para o governo do país aprovar reformas eleitorais que garantissem eleições livres, democráticas e transparentes.\nTerminado o prazo, a Assembleia Nacional aprovou reformas que foram criticadas pela comunidade internacional.\nCom as mudanças, Ortega manteve o controle do Conselho Superior Eleitoral, anulou a observação independente das eleições e proibiu o financiamento de candidatos.\nAlém disso, a reforma incorporou a chamada Lei de Defesa dos Direitos dos Povos à Independência: a legislação permite que pessoas que participaram dos grandes protestos contra Ortega em 2018 sejam proibidas de se candidatar.\n\"Os EUA e a comunidade internacional estão alarmados com a decisão do governo Ortega de ignorar o apelo do povo nicaraguense por reformas eleitorais significativas\", disse Ned Price, porta-voz do Departamento de Estado dos EUA, após a aprovação das reformas. A CIDH e a União Europeia também expressaram preocupação com as mudanças.\n\"A concentração de poder permitiu ao Executivo emitir uma série de normas e reformas para reprimir, perseguir, censurar, garantir privilégios e, em última instância, acabar com a participação da oposição nas eleições. O objetivo é a perpetuação no poder indefinidamente e a manutenção de privilégios e imunidades\", afirmou a CIDH em seu relatório.\nClique aqui para voltar ao início.\nFrente Sandinista de Libertação Nacional (FSLN), o partido de Ortega, tem maioria folgada no parlamento.\nGetty Images via BBC\n4. Cerco de oponentes\nEm 2 de junho de 2021, o governo Ortega impôs prisão domiciliar a Cristiana Chamorro Barrios, então candidata à presidência da Nicarágua.\nEla foi acusada de \"administração abusiva, falsidade ideológica e lavagem de ativos\", entre outros.\nNos dias seguintes, mais seis candidatos foram detidos.\nO governo Ortega acusa os opositores de \"praticar atos que minam a independência, a soberania e a autodeterminação, incitar a ingerência estrangeira em assuntos internos, pedir intervenções militares, organizar-se com financiamento de potências estrangeiras para realizar atos de terrorismo e desestabilização\".\nPara isso, toma como base a Lei de Defesa dos Direitos dos Povos à Independência, aprovada pelo próprio parlamento sandinista no final do ano passado.\nEm 23 de junho daquele ano, Ortega fez um discurso no qual justificou as prisões.\n\"Não estamos julgando políticos ou candidatos. Estamos julgando criminosos que atacaram o país tentando organizar novamente outro golpe de 18 de abril\", disse ele, referindo-se às manifestações antigoverno que começaram em 18 de abril de 2018.\nA repressão policial aos protestos deixou pelo menos 325 pessoas mortas, segundo organizações internacionais.\nUma pesquisa realizada em setembro de 2021 pelo instituto CID-Gallup revelou que 65% dos entrevistados votariam em qualquer um dos candidatos da oposição que estavam sob custódia do Estado.\nClique aqui para voltar ao início.\n5. Pragmatismo de Ortega\nQuando Ortega ganhou as eleições de novembro de 2006, sua campanha foi centrada \"na paz e na reconciliação\", mas sempre com discursos anti-imperialistas. Porém, ele já não ostentava a antiga imagem de guerrilheiro, mas sim de um homem moderado que mais tarde se aproximou do setor privado e da Igreja Católica.\nComo em quase todos os seus discursos, na posse de 10 de janeiro de 2007, Ortega criticou o \"capitalismo selvagem e o neoliberalismo\", mas também se mostrou aberto a manter boas relações com os organismos financeiros internacionais.\nOs EUA, que Ortega insiste em chamar de \"império\", são na verdade o maior parceiro comercial da Nicarágua.\n\"Ortega abraçou o marxismo como um padrão de luta típico dos anos 60 e 70. A única coisa que Ortega realmente tem em comum com a esquerda latino-americana é o anti-imperialismo. Ortega nestes anos provou ser o melhor aluno do Fundo Monetário Internacional (FMI). Ele pratica o neoliberalismo que tanto ataca\", diz o analista político Eliseo Núñez.\nAté os protestos de 2018, Ortega mantinha uma boa relação com o empresariado do país. Mas os empresários aderiram às manifestações contra o governo e, a partir de 2018, essa ruptura teve consequências: o Produto Interno Bruto (PIB) caiu por três anos consecutivos.\n\"As mobilizações sociais marcaram uma mudança na relação entre o setor privado e o governo\", diz Tiziano Breda, analista para a América Central da ONG International Crisis Group.\nEm 2021, quatro dos principais representantes do empresariado do país foram presos sob a acusação ​​de \"conspiração\", \"pedido de intervenção militar\", \"terrorismo\", \"traição\" e \"lavagem de dinheiro\".\nClique aqui para voltar ao início.", "url": "https://g1.globo.com/mundo/noticia/2026/07/21/nao-havera-mais-eleicoes-aqui-o-discurso-de-daniel-ortega-que-fecha-caminho-para-oposicao-na-nicaragua.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-21T11:26:12+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/6Jrqyfzl1xxE6qA8JS2ar5ik1nA=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/T/z/AVDoSvTp6sjaBfOPDyVA/design-sem-nome-32-.jpg", "url_hash": "33ef328bdc086942e1a70405cd7886fb", "title_hash": "41716fdb1e9617a67ca2fdebbee0ff01", "corroboration": 2, "relevance_score": 0.0604, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4852, "headline_en": "Ortega Declares End to Elections in Nicaragua, Shuts Out Opposition", "headline_pt": "Ortega declara fim das eleições na Nicarágua e fecha caminho à oposição", "one_liner_en": "Nicaragua's president Ortega announced there will be no more elections function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

// ── Briefing ─────────────────────────────────────────────────────────

  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

    const relPct = Math.round(((art.relevance_score || 0) / maxRel) * 100);
    const corr   = art.corroboration || 1;

    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +

          corrMeta +
          '<span class="meta-div"></span>' +

        '</div>' +
        '<div class="art-actions">' +
          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
