<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">

boration_score": 1.0, "final_score": 0.5288, "headline_en": "Fuel Shortage Hits Russia — Will It Force Putin to Change Ukraine Strategy?", "headline_pt": "Escassez de Combustível na Rússia Pode Mudar Estratégia de Putin na Ucrânia?", "one_liner_en": "Russia's worsening fuel crisis raises questions about whether economic pressure could push Putin toward negotiations or escalation.", "one_liner_pt": "A crise de combustível na Rússia levanta dúvidas sobre se a pressão econômica levará Putin a negociar ou escalar o conflito.", "category": "Geopolitics", "region": "world", "rationale": "A fuel shortage reaching Moscow signals meaningful economic strain on Russia's war machine, making this a significant development in the Ukraine conflict.", "low_signal": false}, {"title": "Escassez de combustível afeta a Rússia, mas será suficiente para fazer Putin mudar de estratégia na Ucrânia?", "summary": "<img src=\"https://s2-g1.glbimg.com/K3NxbsaBOGIkuplWFKFXGkHI-Qk=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/p/e/MD9hBfT0AA8jVBP7wJsw/ddc45829-c916-4334-b608-da097a6ff079.png\" /><br />     A crise de combustíveis na Rússia tem provocado longas filas diárias nos postos de gasolina\nGetty Images/BBC\nSe você quiser entender como a crise de combustíveis atinge a Rússia, basta passar um dia dirigindo por Moscou, a capital do país. Em praticamente todos os postos de gasolina por onde a BBC passou havia filas de carros e caminhões. Algumas eram longas, outras curtas; algumas mal andavam, enquanto outras avançavam aos poucos.\nQuando não havia fila, era porque o posto tinha ficado sem combustível e estava fechado.\nVale lembrar: esta é Moscou, a rica e populosa capital russa que concentra boa parte dos recursos do país. Mesmo ali, as autoridades não conseguem garantir gasolina e diesel suficientes para manter os motoristas abastecidos.\nNas filas, havia mais frustração do que revolta. Yekaterina disse que estava \"insatisfeita\" e que havia \"pânico porque todo mundo acha que o combustível vai acabar\". Mas, segundo ela, tudo ficará bem. \"Só precisamos reorganizar a distribuição de combustível.\"\nAgora no g1\nPara Elmar, a situação era \"muito ruim\". Ele reclamou da alta dos preços à medida que os estoques diminuem. \"Você perde horas para conseguir abastecer\", afirmou. \"Estou planejando uma viagem para o Daguestão, mas não sei se devo ir de carro por causa de todos esses problemas com combustível.\"\nPerguntei a ele quem era o responsável pela situação. \"No nosso país, não se pode dizer o que é culpado nem quem é culpado\", respondeu, com um sorriso malicioso.\nNa Rússia, criticar em público o presidente, Vladimir Putin, ou mesmo o Kremlin, sede e metonímia do governo russo, não é algo que a maioria das pessoas se sinta à vontade para fazer.\nValery disse achar estranho enfrentar filas em um país que produz tanto petróleo. Para ele, a culpa é tanto da falta de preparação da Rússia quanto dos mísseis ucranianos. \"Não quero me acostumar com filas\", afirmou. \"Espero que a situação mude logo e não continue assim.\"\nPara muitos russos, a guerra está ficando cada vez mais próxima do cotidiano.\nPutin tem se esforçado para poupar a maior parte da população das consequências do que chama de \"operação militar especial\" (no caso, a invasão em larga escala da Ucrânia), que já entra em seu quinto ano. Nas ruas de Moscou, há poucos sinais de conflito, apenas alguns cartazes exaltando soldados apresentados como heróis.\nDrones e mísseis ucranianos têm atacado refinarias de petróleo na Rússia, incluindo unidades próximas a Moscou\nReuters\nMas o que tem sido mais difícil para as autoridades ignorarem é o número cada vez maior de ataques ucranianos com drones e mísseis em pleno território russo. Os alvos incluem refinarias de petróleo, enquanto explosões já escureceram o céu de Moscou e de São Petersburgo.\nA isso se somam os bloqueios da internet, que restringem a circulação de informações, e, agora, a escassez de combustíveis.\nA Rússia, um dos maiores produtores de petróleo do mundo, enfrenta dificuldades para refinar combustível suficiente para atender à demanda interna.\nAndrei, que enfrentava a fila pela primeira vez ao lado da esposa, Yekaterina, atribuiu a crise ao que chamou de \"geopolítica\" e reconheceu que a situação pode piorar.\n\"Esperamos que todos os lados comecem a se aproximar e discutam as condições para um acordo de paz\", afirmou. \"Mas, infelizmente, não vemos isso por parte dos nossos parceiros europeus. Então talvez a situação só piore.\"\nMesmo assim, ele se mostrou resignado. \"Nós sobrevivemos aos anos 1990. Lembramos de tempos muito mais difíceis. Isso não nos assusta.\"\nAndrei acredita que a situação pode piorar e atribuiu a crise à \"geopolítica\"\nBBC\nAs redes sociais estão repletas de imagens de motoristas em filas para abastecer. Em alguns casos, os congestionamentos se estendem por quilômetros. Há também publicações que mostram brigas entre motoristas.\nNa cidade turística de Anapa, às margens do Mar Negro, cossacos que integram grupos paramilitares tradicionais ligados ao Estado russo foram mobilizados para manter a ordem nas filas.\nO racionamento já é adotado em muitas regiões, e várias delas proibiram o uso de galões para armazenar combustível. Em uma cidade da Sibéria, o prefeito providenciou banheiros químicos para os motoristas que aguardam para abastecer. Em algumas áreas, serviços de ônibus e de coleta de lixo foram reduzidos. Agricultores temem que a crise comprometa a colheita deste verão.\nA preocupação é real e disseminada.\nMas será que os líderes da Otan (Organização do Tratado do Atlântico Norte) reunidos na Turquia podem esperar que essa turbulência econômica se transforme em pressão política sobre a Rússia?\nEssa é, certamente, a expectativa da Ucrânia, onde estrategistas apostam que os russos ficarão tão exasperados que passarão a pressionar Putin a encerrar a guerra.\nA Rússia acompanha a situação de perto. Putin demonstrou preocupação suficiente para abordar publicamente a escassez de combustíveis na TV estatal. Ele reconheceu que os ataques ucranianos \"obviamente estão criando problemas\", mas insistiu que a situação \"não é crítica\".\nAinda assim, as autoridades não querem correr riscos. O governo já começou a aumentar as importações de combustíveis, subsidiar os preços e autorizar a venda de combustíveis de qualidade inferior, que, segundo alguns especialistas, podem danificar os motores.\nPutin e seus assessores também sabem que a crise está influenciando a opinião pública.\nA pesquisa mais recente do instituto independente Centro Levada mostra que a aprovação de Putin caiu para cerca de 74%. O levantamento também indica que a parcela dos russos que acredita que o país está no caminho certo recuou de 61%, em maio, para 52%.\nNa semana passada, o instituto Gallup apontou que os russos estão mais pessimistas em relação à economia do que em qualquer outro momento dos últimos 20 anos. Segundo a pesquisa, 60% dos entrevistados afirmaram que as condições econômicas na região onde vivem estão piorando.\nAté mesmo o instituto nacional de pesquisas de opinião da Rússia, o Vtsiom, ligado ao governo, indicou que a confiança em Putin caiu 3,4 pontos percentuais em apenas uma semana, para 73%.\nPara Christopher Weafer, diretor da consultoria Macro Advisory, a crise dos combustíveis pode representar um \"divisor de águas\" para o crescimento da economia russa.\n\"Os custos da guerra estão aumentando\", afirma Weafer. \"Embora o impacto total da crise dos combustíveis só deva aparecer nas estatísticas de julho, a possibilidade de que ela se prolongue reduz significativamente as perspectivas de crescimento para o restante do ano.\"\nMas será que tudo isso vai se traduzir em pressão política sobre a Rússia para mudar de rumo?\nNina Khrushcheva afirma que a esperança de países europeus de forçar Putin a negociar é uma fantasia\nBBC\nNina Khrushcheva, professora de relações internacionais da The New School, em Nova York, nos Estados Unidos, disse em entrevista à BBC que é pouco provável que Putin recue.\n\"Quanto mais pressionado ele se sentir, maior a probabilidade de agir de forma agressiva e repressiva\", afirmou Khrushcheva. \"Acho que a situação é séria, mas a expectativa no Ocidente de que os russos simplesmente derrubem o regime está muito distante da realidade.\"\nSegundo Khrushcheva, os russos sentem muita raiva e desespero, mas também \"muita resignação diante do que está acontecendo\". Para ela, a esperança de governos europeus de que conseguirão forçar Putin a negociar \"é uma fantasia, isso simplesmente não acontece\".\nPelo contrário, todos os sinais indicam que Putin está endurecendo ainda mais a sua posição.\nNa última sexta-feira (3/7), Putin apareceu usando uniforme militar durante uma reunião com comandantes, na qual afirmou que as tropas russas estão obtendo vitórias na linha de frente e prometeu conquistar ainda mais território. \n\"As Forças Armadas da Rússia continuam mantendo, com confiança, a iniciativa estratégica na zona da operação militar especial\", declarou Putin.\nEm seguida, Putin orientou seus comandantes a analisar o envolvimento dos aliados europeus da Ucrânia no que chamou de \"ações reais de combate\", que, segundo ele, estariam prolongando a guerra. \"Precisamos dessa análise para tomar decisões responsáveis no futuro\", afirmou, sem dar mais detalhes.\nA declaração chamou a atenção de diplomatas e analistas militares.\nA pergunta que circula nas capitais ocidentais é: qual será o próximo passo de Putin? Ele vai escalar o conflito? E, em caso afirmativo, de que forma?", "url": "https://g1.globo.com/mundo/noticia/2026/07/19/escassez-de-combustivel-afeta-a-russia-mas-sera-suficiente-para-fazer-putin-mudar-de-estrategia-na-ucrania.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-19T10:39:36+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/K3NxbsaBOGIkuplWFKFXGkHI-Qk=/i.s3.glbimg.com/v liação aos EUA só prejudicaria consumidores brasileiros, avalia economista", "summary": "<img src=\"https://media.gazetadopovo.com.br/2026/07/17152850/tarifaco-brasil-eua-960x540.jpg\" /><br />Retaliação aos EUA por tarifaço só prejudicaria os brasileiros, avalia Alexandre Chaia, do Insper. Leia a entrevista na Gazeta do Povo!", "url": "https://www.gazetadopovo.com.br/economia/tarifaco-brasil-eua-retaliacao-alexandre-chaia-insper/", "source_domain": "gazetadopovo.com.br", "published_at": "2026-07-18T15:16:14+00:00", "origin": "feed", "image_url": "https://media.gazetadopovo.com.br/2026/07/17152850/tarifaco-brasil-eua-960x540.jpg", "url_hash": "641b6c7b5715ac0bbf9110b6f256ba3c", "title_hash": "87029fd74d3a2edf15489ee2033e8dbe", "corroboration": 1, "relevance_score": 0.2366, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3733, "headline_en": "Economist: Retaliating Against US Tariffs Would Only Hurt Brazilian Consumers", "headline_pt": "Economista: Retaliação ao Tarifaço dos EUA Só Prejudicaria os Brasileiros", "one_liner_en": "Insper economist Alexandre Chaia argues that retaliating against US tariffs would raise costs for Brazilian consumers.", "one_liner_pt": "O economista Alexandre Chaia, do Insper, afirma que retaliar as tarifas dos EUA aumentaria os custos para os consumidores brasileiros.", "category": "Economy", "region": "brazil", "rationale": "Expert analysis on trade retaliation is directly relevant as Brazil actively debates its response to new US tariffs.", "low_signal": false}, {"title": "CAMUFLAGENS: curador norte-americano conduz visita à exposição da Bienal de Curitiba no MON", "summary": "<p>O público da 16ª Bienal Internacional de Curitiba terá uma oportunidade pouco comum: conhecer “Camuflagens” ao lado de seu próprio curador. O norte-americano Royce W. Smith, decano da Faculdade de Artes da California State University, Long Beach, retorna ao Brasil para conduzir uma visita guiada pela exposição, em cartaz na Sala 8 do MAC Paraná, [&#8230;]<\/p>\n<p>O post <a href=\"https://curitibacult.com.br/camuflagens-curador-norte-americano-conduz-visita-a-exposicao-da-bienal-de-curitiba-no-mon/\">CAMUFLAGENS: curador norte-americano conduz visita à exposição da Bienal de Curitiba no MON<\/a> apareceu primeiro em <a href=\"https://curitibacult.com.br\">Curitiba Cult<\/a>.<\/p>", "url": "https://curitibacult.com.br/camuflagens-curador-norte-americano-conduz-visita-a-exposicao-da-bienal-de-curitiba-no-mon/", "source_domain": "curitibacult.com.br", "published_at": "2026-07-18T13:00:58+00:00", "origin": "feed", "image_url": "https://curitibacult.com.br/wp-content/uploads/2026/07/Design-sem-nome-2026-07-18T185822.926.jpg", "url_hash": "2ab6c0043a17575aaf3f903dafbcc073", "title_hash": "1a6529ffff74ec2b50cc1440f53c4394", "corroboration": 1, "relevance_score": 0.23, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.37, "headline_en": "US Curator Leads Guided Tour of 'Camouflages' Exhibition at Curitiba Biennial", "headline_pt": "Curador Norte-Americano Conduz Visita Guiada à Exposição 'Camuflagens' na Bienal de Curitiba", "one_liner_en": "American curator Royce W. Smith returns to Curitiba to lead a guided tour of his exhibition at the 16th International Biennial.", "one_liner_pt": "O curador norte-americano Royce W. Smith retorna a Curitiba para conduzir visita guiada à sua exposição na 16ª Bienal Internacional.", "category": "Culture", "region": "curitiba", "rationale": "A rare opportunity for Curitiba residents to experience a major Biennial exhibition with its own curator present.", "low_signal": false}, {"title": "Primeiros computadores quânticos da América Latina serão instalados na Paraíba até outubro", "summary": "<img src=\"https://s2-g1.glbimg.com/uS48_sibRuSK4rFkEhIL4e5gCyw=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/Q/w/BBHgNBTQSnAJ8otur5BA/823-1-.jpg\" /><br />     Peças do computador quântico em João Pessoa\nSecretário de Ciência de Tecnologia da Paraíba\nA montagem dos primeiros computadores quânticos da América Latina, que serão instalados no Centro de Computação Quântica da Paraíba (Ciquanta), em João Pessoa, deve ser concluída até outubro deste ano.  \nCom um investimento inicial de aproximadamente R$ 150 milhões, o espaço abrigará supercomputadores capazes de impulsionar avanços em áreas complexas, como inteligência artificial, segurança cibernética e bancária, logística e previsão de novas moléculas para medicamentos.\n✅ Clique aqui para seguir o canal do g1 PB no WhatsApp\n🔍 O ramo da computação quântica é uma área da ciência que se utiliza da aplicação de princípios da Física Quântica, ou seja, de leis da Física para partículas muito pequenas, aplicadas aos computadores, acelerando diversos tipos de processos, como a resolução de problemas matemáticos. \nDe acordo com o secretário estadual de Ciência e Tecnologia, Cláudio Furtado, as primeiras peças chegarão à Paraíba em agosto. Uma equipe de técnicos e pesquisadores viajou à China para receber treinamento específico para operar as máquinas.\nCentro de Computação Quântica (Ciquanta), local onde serão instalados os computadores quânticos\nSecretário de Ciência de Tecnologia da Paraíba\nComputador funciona a temperaturas baixíssimas\nO Ciquanta, local onde serão instalados os equipamentos, vai funcionar na Estação das Artes, em João Pessoa, que está passando por reformas e adequações estruturais necessárias para abrigar uma tecnologia de ponta. \n“A área onde ficará o computador exige altura mínima de 6 metros e blindagem eletromagnética, por isso, está sendo adaptada para abrigar os dois computadores na parte inferior e cerca de 30 gabinetes, além de salas de reunião e restaurante para servidores, no piso superior”, explicou.\nEntre as principais exigências técnicas para receber um computador quântico também estão o controle de temperatura e estabilidade ambiental. \n“O chip funciona a baixíssimas temperaturas, em torno de 10 mili kelvin, próximo ao zero absoluto, que é -273 graus Celsius”, esclareceu o secretário. \nPara alcançar essa temperatura, será usado um sistema fechado com mistura de dois elementos químicos, o hélio-3 e hélio-4. A estrutura contará ainda com sistema de refrigeração autônomo e de redundância para garantir a operação contínua dos equipamentos.\nSerão instalados dois computadores quânticos, de 20 e 100 qubits. Embora o número pareça pequeno se comparado aos gigabytes dos computadores comuns, na tecnologia quântica essa capacidade representa uma velocidade de cálculo inédita, capaz de processar em instantes um volume de dados que máquinas tradicionais não conseguiriam resolver.\n“As peças do computador de 100 qubits e de 20 qubits chegarão juntas e serão montadas um após o outro, dentro do cronograma previsto entre agosto e outubro”, destacou. \nParte interna do prédio onde serão instalados os computadores quânticos\nSecretaria de Ciência e Tecnologia da Paraíba\nPesquisadores terão acesso ao equipamento\nO acesso inicial aos computadores será destinado a pesquisadores da Paraíba, especialmente de universidades como Universidade Federal da Paraíba (UFPB), Universidade Federal de Campina Grande (UFCG) e Instituto Federal da Paraíba (IFPB). \n“Já temos pesquisadores dessas instituições participando do Ciquanta, além do professor Amir Aldas Caldeira, da Unicamp, que vai liderar cientificamente os trabalhos”, informou. \nAinda segundo o secretário, o projeto inclui transferência tecnológica entre a empresa chinesa CETC e o Ciquanta em todos os níveis do desenvolvimento dos computadores. Haverá também transferência de tecnologia na área de criogenia, sensores e sistema operacional dos computadores.\n“Nós vamos montar conjuntamente esses dois computadores, aprender a fazer, e a ideia é que os próximos equipamentos já sejam feitos localmente, com base nesse aprendizado”, detalhou. \nA população também poderá conhecer de perto a tecnologia, segundo o secretário. O centro contará com um espaço de exibição dedicado à divulgação científica.\n “Haverá uma réplica do computador em funcionamento para visitação, com informações sobre a história e funcionamento da computação quântica. O objetivo é popularizar a ciência e mostrar as utilidades práticas da tecnologia”, disse. \nNa visão do secretário, o fato de ser pioneira no uso da tecnologia quântica coloca a Paraíba em posição estratégica no Brasil e na América Latina.  O projeto deve atrair startups e promover formação de profissionais altamente qualificados, impulsionando o desenvolvimento tecnológico do estado.\n“Essa é uma corrida mundial e, com o Ciquanta, o Brasil se coloca entre os países que desenvolvem essa tecnologia”, afirmou o secretário.\nVídeos mais assistidos do g1 Paraíba", "url": "https://g1.globo.com/pb/paraiba/noticia/2026/07/19/primeiros-computadores-quanticos-da-america-latina-serao-instalados-na-paraiba-ate-outubro.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-19T11:01:12+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/uS48_sibRuSK4rFkEhIL4e5gCyw=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/Q/w/BBHgNBTQSnAJ8otur5BA/823-1-.jpg", "url_hash": "c36985cf703c1e276b99a583f593bb59", "title_hash": "256ab161d1ffad8cd448dc7d2d33eda1", "corroboration": 1, "relevance_score": 0.228, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.369, "headline_en": "Latin America's First Quantum Computers to Be Installed in Paraíba by October", "headline_pt": "Primeiros Computadores Quânticos da América Latina Serão Instalados na Paraíba até Outubro", "one_liner_en": "Brazil's Paraíba state will host Latin America's first quantum computers, to be assembled by October 2026.", "one_liner_pt": "O estado da Paraíba receberá os primeiros computadores quânticos da América Latina, com instalação prevista para outubro de 2026.", "category": "Tech", "region": "brazil", "rationale": "A historic technological milestone for Latin America, positioning Brazil at the forefront of quantum computing in the region.", "low_signal": false}, {"title": "Por que terremotos na Venezuela podem gerar nova crise migratória?", "summary": "<img src=\"https://media.gazetadopovo.com.br/2026/07/18162007/venezuela.migracao-1-960x540.jpg\" /><br />Terremotos na Venezuela agravam colapso econômico e podem gerar nova crise migratória nas Américas. Saiba como o desastre afeta o Brasil e países vizinhos.", "url": "https://www.gazetadopovo.com.br/mundo/por-que-terremotos-na-venezuela-podem-gerar-nova-crise-migratoria/", "source_domain": "gazetadopovo.com.br", "published_at": "2026-07-18T19:20:05+00:00", "origin": "feed", "image_url": "https://media.gazetadopovo.com.br/2026/07/18162007/venezuela.migracao-1-960x540.jpg", "url_hash": "f6d6f07945b8b0b3585e1ea1f00deb9c", "title_hash": "af5458b386ddb7436f7ba52873efff7d", "corroboration": 1, "relevance_score": 0.2276, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3688, "headline_en": "Why Earthquakes in Venezuela Could Trigger a New Migration Crisis", "headline_pt": "Por Que Terremotos na Venezuela Podem Gerar Nova Crise Migratória?", "one_liner_en": "Earthquakes compounding Venezuela's economic collapse could drive a new wave of migration affecting Brazil and neighboring countries.", "one_liner_pt": "Terremotos agravando o colapso econômico da Venezuela podem gerar nova onda migratória afetando o Brasil e países vizinhos.", "category": "Geopolitics", "region": "world", "rationale": "Venezuela's compounding crises — economic collapse plus natural disaster — have direct migration spillover effects on Brazil.", "low_signal": false}, {"title": "Unesco vai analisar 30 novas candidaturas a Patrimônio Mundial, incluindo uma do Brasil; veja a lista", "summary": "<img src=\"https://s2-g1.glbimg.com/0luoH8qxoyCeKsgRvjRSW7QnRvE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2023/l/F/Sbtgx0QF26DLvaFNj80w/teatro-amazonas-foto-macio-james-sec-am.jpeg\" /><br />     Fachada do Teatro Amazonas.\nMácio James/SEC-AM\nA Unesco (Organização das Nações Unidas para a Educação, a Ciência e a Cultura) vai analisar 30 novas candidaturas à sua Lista do Patrimônio Mundial durante a reunião anual do comitê responsável pela seleção da honraria. \nO encontro começa na próxima segunda-feira (20) e segue até 29 de julho, em Busan, na Coreia do Sul. Antes, haverá uma cerimônia de abertura neste domingo (19).\nO Brasil participa com a candidatura dos “Teatros da Amazônia”, uma proposta formada pelo Teatro Amazonas, em Manaus (AM), e pelo Theatro da Paz, em Belém (PA). \nConstruídos no fim do século XIX, os dois prédios se tornaram símbolos do período em que a exploração da borracha levou riqueza, crescimento urbano e forte influência europeia às duas maiores cidades da região.\nA proposta será examinada com as demais entre os dias 24 e 26 de julho.\nEntre os candidatos estão também reservas naturais, recifes de coral, fósseis, fortalezas, templos, cidades históricas e obras da arquitetura moderna. \nA lista inclui, por exemplo, as praias do desembarque do Dia D, na França, antigas capitais do Japão e um corredor das Rotas da Seda que atravessa quatro países.\nAlém das novas inscrições, o comitê vai avaliar o estado de conservação de 147 patrimônios já reconhecidos. Atualmente, a lista reúne 1.248 locais em 170 países.\nVeja abaixo as candidaturas que serão analisadas:\nRefúgio Nacional de Vida Selvagem de Okefenokee, no estado da Geórgia, nos Estados Unidos.\nServiço de Pesca e Vida Selvagem dos EUA/Wikimedia Commons\nSítios naturais\nArábia Saudita: Recifes de coral do Golfo de Aqaba, no norte do Mar Vermelho.\nDinamarca: Área do oeste do Limfjord com fósseis de peixes de cerca de 56 milhões de anos.\nEmirados Árabes Unidos: Uádi Wurayah, região montanhosa com vales, nascentes e espécies adaptadas ao clima árido.\nEstados Unidos: Refúgio Nacional de Vida Selvagem de Okefenokee, na Geórgia, uma extensa área de pântanos e florestas alagadas.\nRússia: Montes isolados de Toratau, Kushtau e Yuraktau, na região da Bashkiria, formados por antigos recifes marinhos fossilizados.\nJordânia: Reserva Marinha de Aqaba, no Mar Vermelho, conhecida pelos recifes de coral e pela diversidade de espécies marinhas.\nSudão do Sul: Paisagem de Boma-Badingilo, rota de uma das maiores migrações de animais selvagens do mundo. A candidatura será analisada em caráter de urgência.\nMonte Yuraktau, no distrito de Sterlitamak, na Rússia, visto a 85 metros de altura.\nИгорь326/Wikimedia Commons\nSítios culturais\nBrasil: Conjunto formado pelo Teatro Amazonas, em Manaus (AM), e pelo Theatro da Paz, em Belém (PA). Construídos no fim do século XIX, durante o ciclo da borracha, os dois edifícios combinam referências arquitetônicas europeias com elementos da fauna, da flora e da cultura amazônicas.\nCazaquistão: Mesquitas escavadas em rochas e outros locais sagrados da região de Mangystau.\nCazaquistão, Quirguistão, Tajiquistão e Uzbequistão: Trecho das antigas Rotas da Seda que atravessa o Vale de Fergana e acompanha o Rio Syr Darya.\nChina: Antigos locais de produção de porcelana em Jingdezhen, cidade conhecida mundialmente por essa atividade.\nComores: Centros históricos murados ligados aos antigos sultanatos do arquipélago.\nEspanha: Paisagem da Ribeira Sacra, marcada por rios, cânions, vinhedos e mosteiros.\nEstado da Palestina: Sebastia, antiga cidade com ruínas de diferentes períodos históricos. A candidatura será analisada em caráter de urgência.\nO Theatro da Paz é considerado o maior símbolo do ciclo da borracha em Belém.\nReprodução/Theatro da Paz\nFinlândia: Conjunto de 13 edifícios e complexos projetados pelo arquiteto finlandês Alvar Aalto e seus colaboradores ao longo do século XX.\nFrança: Sistema de fortalezas construído nos séculos XIII e XIV para proteger a região de Carcassonne.\nFrança: Praias da Normandia onde as forças aliadas desembarcaram em 6 de junho de 1944, durante a Segunda Guerra Mundial.\nÍndia: Sarnath, local próximo a Varanasi onde, segundo a tradição budista, Buda fez seu primeiro sermão.\nItália: Conjunto de teatros históricos da Itália central, construídos nos séculos XVIII e XIX e financiados coletivamente por famílias e moradores das cidades.\nJapão: Sítios arqueológicos de Asuka e Fujiwara, antigas capitais que concentraram o poder político do Japão entre os séculos VI e VIII.\nMongólia: Túmulos monumentais ligados à nobreza Xiongnu, povo nômade que dominou partes da Ásia Central na Antiguidade.\nPolônia: Centro de Gdynia, cidade portuária planejada e construída principalmente nas décadas de 1920 e 1930, com arquitetura modernista.\nPortugal: Conjunto de fortalezas em Almeida, Elvas, Marvão e Valença, construídas para defender a fronteira com a Espanha.\nStudio Aalto, projetado por Alvar Aalto e construído entre 1954 e 1963, em Helsinque, na Finlândia.\nRauno Träskelin/Alvar Aalto Foundation\nIrã: Castelo de Alamut e outras fortificações construídas nas montanhas de Alborz, ligadas ao poder dos ismaelitas na Idade Média.\nSão Tomé e Príncipe: Antigas roças que estruturaram a produção agrícola colonial, sobretudo de cacau e café, com uso de mão de obra submetida à migração forçada.\nTailândia: Wat Phra Mahathat Woramahawihan, templo budista histórico de Nakhon Si Thammarat e importante centro religioso do sul do país.\nTunísia: Vila costeira de Sidi Bou Saïd, conhecida pelas construções brancas e azuis e por sua influência sobre artistas e pensadores do Mediterrâneo.\nTurquia: Fortaleza romana de Zerzevan e templo subterrâneo dedicado ao culto de Mitra.\nUzbequistão: Conjunto de edifícios modernistas de Tashkent que combina referências arquitetônicas soviéticas e tradições da Ásia Central.\nSítio misto (cultural e natural)\nGrécia: Área ampliada do Monte Olimpo, que reúne o pico mais alto do país, paisagens montanhosas e locais associados à mitologia grega.\nBarack Obama e François Hollande olham para a praia de Omaha, um dos locais do desembarque dos aliados no 70 º aniversário do Dia D em Colleville sur Mer, na Normandia, França\nCharles Dharapak/AP\nLEIA TAMBÉM:\n'Rios atmosféricos': o que é o fenômeno que coloca o Sul do Brasil em alerta para tempestades no fim de semana\nEl Niño: fenômeno deve favorecer temporais no RS após veranico no Sul do país; veja previsão\nGuaxinim de Haaland: comprar animais empalhados é permitido? Entenda o que determinam as leis", "url": "https://g1.globo.com/meio-ambiente/noticia/2026/07/19/unesco-candidaturas-patrimonio-mundial-veja-lista.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-19T08:00:44+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/0luoH8qxoyCeKsgRvjRSW7QnRvE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2023/l/F/Sbtgx0QF26DLvaFNj80w/teatro-amazonas-foto-macio-james-sec-am.jpeg", "url_hash": "893d55d9d2255af8500213cfec86667f", "title_hash": "478b15cf2ccd46581d5f8225f9a3ed8d", "corroboration": 1, "relevance_score": 0.2248, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3674, "headline_en": "UNESCO to Review 30 New World Heritage Candidates, Including One From Brazil", "headline_pt": "Unesco Analisará 30 Candidaturas ao Patrimônio Mundial, Incluindo Uma do Brasil", "one_liner_en": "UNESCO will evaluate 30 new World Heritage candidacies, with Brazil submitting one site for consideration.", "one_liner_pt": "A Unesco avaliará 30 novas candidaturas à Lista do Patrimônio Mundial, com o Brasil submetendo um local para análise.", "category": "Culture", "region": "brazil", "rationale": "Brazil's candidacy for UNESCO World Heritage recognition is a notable cultural and diplomatic development.", "low_signal": false}, {"title": "Tarifaço pode abrir portas na China, mas analistas veem limites para avanço das exportações brasileiras", "summary": "<img src=\"https://s2-g1.glbimg.com/paNBHQ5t8cPrqQMqfej9aBUBMDM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2025/X/j/wIugndRF2Gj6Sv4VFI7g/54516546006-5c3ccfd9a2-k.jpg\" /><br />     Tarifa dos EUA: Brasil avalia adotar a reciprocidade e proteger setores atingidos\nO novo tarifaço imposto pelos Estados Unidos sobre produtos brasileiros pode levar empresas a buscar novos mercados para reduzir a dependência do consumidor americano. Nesse cenário, a China, principal destino das exportações do Brasil, aparece como uma alternativa.\nEspecialistas, porém, avaliam que o país asiático deve absorver apenas uma parcela das vendas que eventualmente forem afetadas pelas tarifas americanas. A diferença entre o perfil das exportações brasileiras para os dois países e a própria capacidade industrial chinesa limitam uma substituição rápida dos mercados.\n🗒️Tem alguma sugestão de reportagem? Mande para o g1\nNo ano passado, o Brasil exportou US$ 99,94 bilhões (cerca de R$ 512 bilhões) para a China, segundo dados do Ministério do Desenvolvimento, Indústria, Comércio e Serviços (MDIC). O valor é bem mais que o dobro das vendas para os EUA, que somaram US$ 37,7 bilhões (cerca de R$ 192,7 bilhões).\nNo primeiro semestre de 2026, as exportações brasileiras para o mercado chinês alcançaram recorde de US$ 58,32 bilhões (cerca de R$ 299 bilhões), alta de 21,9% na comparação com igual período do ano anterior.\nAinda assim, a China não é uma solução imediata para a maior parte dos produtos atingidos.\n\"Quando existe excedente de produção, as empresas buscam novos mercados. A China é um grande mercado, mas eu não acredito que somente o tarifaço vá provocar alguma mudança nisso\", afirma Rodrigo Giraldelli, especialista em comércio China-Brasil e CEO da China Gate.\n\"O que entra nesse tarifaço são, basicamente, produtos manufaturados, máquinas, equipamentos e esse tipo de coisa. E, nesse caso, a China produz muito e exporta justamente esse tipo de produto\", diz.\nPrincipais destinos das exportações brasileiras em 2026\nArte/g1\nPerfil das exportações limita substituição\nEnquanto os americanos importam do Brasil principalmente aeronaves, máquinas, equipamentos, produtos siderúrgicos transformados e outros bens industrializados, as compras chinesas são concentradas em commodities.\n🔎 Atualmente, soja, petróleo bruto, minério de ferro e carnes representam quase 90% das exportações brasileiras para a China. Essa concentração reduz a capacidade de empresas que vendem produtos industriais aos EUA migrarem para o mercado chinês.\n\"Um fabricante brasileiro que perder mercado nos EUA nem sempre consegue redirecionar sua produção para a China. Isso ocorre apenas parcialmente e varia conforme o setor\", explica Wagner Pagliato, coordenador dos cursos de Administração e Ciências Contábeis da Unicid.\nSegundo Vera Kanas, especialista em comércio internacional, a China tende a oferecer mais oportunidades para produtos agrícolas e minerais do que para bens industrializados.\n\"A pauta exportadora brasileira para a China é restrita a poucas commodities, como minério de ferro e soja. Além disso, muitas das commodities que o Brasil exporta para a China não foram atingidas pelas tarifas impostas recentemente.\"\nOs 20 produtos mais exportados para a China no 1º semestre de 2026\nArte/g1\nA experiência do primeiro tarifaço de Trump mostra que parte das empresas conseguiu buscar outros mercados, mas sem uma substituição completa.\nSegundo o Boletim Regional do Banco Central publicado em dezembro de 2025, as vendas brasileiras para os EUA caíram 6,7%, de US$ 40,4 bilhões para US$ 37,7 bilhões em 2025. No mesmo período, as exportações para outros países cresceram de US$ 296,7 bilhões para US$ 310,6 bilhões.\nNo período mais intenso das tarifas, entre agosto e novembro de 2025, produtos como petróleo, aviões, semiacabados de ferro e aço, café, carne bovina, sucos de frutas e celulose tiveram queda nas vendas aos EUA, mas aumento das exportações para outros destinos, indicando um redirecionamento parcial dos fluxos comerciais.\nAlém da diferença no perfil das compras, o mercado chinês possui suas próprias restrições. Entre elas estão cotas tarifárias para alguns produtos agropecuários, exigências sanitárias e regras para habilitação de exportadores.\nDesde janeiro de 2026, a China passou a aplicar cotas de importação e sobretaxas sobre a carne bovina brasileira. A medida estabelece uma cota anual inicial de 1,1 milhão de toneladas para o Brasil. O volume excedente fica sujeito a uma sobretaxa de 55%.\nComo Brasil e China não possuem acordo de livre comércio, os produtos brasileiros continuam sujeitos às tarifas de importação aplicadas pelo mercado chinês, além de exigências regulatórias e barreiras específicas para determinados setores.\n💰 A China não aplica uma tarifa única sobre produtos brasileiros. As alíquotas variam conforme o produto e a classificação tarifária. Commodities como soja, minério de ferro e petróleo costumam ter tarifas menores ou zeradas por serem estratégicas para a economia chinesa. A soja, por exemplo, tem tarifa de cerca de 3%, enquanto o minério de ferro entra com alíquota de 0%. Já produtos industrializados tendem a enfrentar taxas mais altas.\nEconomia chinesa cresce menos\nUma mulher e duas crianças fazem compras diante de uma prateleira refrigerada de queijos em um supermercado em Pequim, na China, em 10 de julho de 2026.\nReuters\nOutro fator que limita uma expansão maior das exportações brasileiras é o momento vivido pela economia chinesa.\nNo segundo trimestre de 2026, o Produto Interno Bruto (PIB) da China cresceu 4,3%, abaixo do registrado no início do ano e inferior à meta estabelecida pelo governo.\nAo mesmo tempo, o país enfrenta uma prolongada crise no setor imobiliário, consumo doméstico enfraquecido e excesso de capacidade industrial.\n\"A economia chinesa continua crescendo, mas em ritmo menor do que no passado. Os dados recentes mostram crescimento sustentado principalmente pelas exportações e pela indústria, enquanto o consumo doméstico permanece fraco e o setor imobiliário continua enfrentando dificuldades\", afirma Pagliato.\nPara ele, esses fatores tornam arriscado ampliar excessivamente a dependência brasileira do mercado chinês.\n\"A China continua sendo um mercado enorme e essencial para o Brasil, mas apostar em uma dependência ainda maior aumenta a vulnerabilidade brasileira a uma eventual desaceleração mais forte da economia chinesa.\"\nOportunidades em novos setores\nConferência Mundial de Inteligência Artificial em Xangai em julho de 2026\nREUTERS/Go Nakamura\nApesar das limitações, especialistas veem oportunidades decorrentes da mudança de estratégia econômica chinesa.\n🤖 O 15º Plano Quinquenal (2026-2030) estabelece como prioridade o desenvolvimento de setores ligados à inteligência artificial, semicondutores, veículos elétricos, biotecnologia e transição energética.\nEssa mudança tende a ampliar a demanda por minerais críticos, como níquel, cobre, grafite e terras raras — recursos abundantes no Brasil.\nNos últimos anos, os investimentos chineses também passaram a se concentrar em projetos de energia renovável, mineração e mobilidade elétrica. \nEm 2025, o Brasil recebeu US$ 6,1 bilhões em investimentos produtivos da China, tornando-se o principal destino global do capital chinês, segundo dados do Conselho Empresarial Brasil-China (CEBC).\nNa avaliação dos especialistas, o principal efeito do tarifaço pode ser acelerar a diversificação das exportações brasileiras, e não necessariamente aumentar a dependência da China.\n\"O tarifaço vai acelerar uma mudança permanente na geografia das exportações brasileiras, seja pela busca mais ativa por novos mercados, seja pela negociação de acordos de livre comércio\", afirma Vera Kanas.\nEla cita que o novo cenário fortalece negociações conduzidas pelo Mercosul com parceiros como Japão, Canadá e Singapura, além de reforçar a importância do acordo de livre comércio com a União Europeia, aprovado no ano passado após 25 anos de negociações. \nPara o professor Wagner Pagliato, a estratégia mais segura é ampliar o número de destinos das exportações brasileiras.\n\"A China continuará sendo um parceiro fundamental, mas a diversificação reduz a exposição do Brasil tanto às mudanças na política comercial americana quanto aos riscos de uma desaceleração mais intensa da economia chinesa.\"\nO movimento inicial das empresas brasileiras, segundo Rodrigo Giraldelli, tende a ser de adaptação ao novo cenário, antes de uma mudança completa dos mercados consumidores.\n\"É tudo muito novo, então as empresas ainda estão avaliando a situação. As negociações vão e voltam, as taxas podem subir e depois ser retiradas. As empresas estão aguardando para ver como o mercado vai se comportar, principalmente qual será a reação dos clientes americanos\", afirma.\nSegundo ele, muitas companhias devem tentar preservar as vendas para os EUA por meio de ajustes comerciais, como renegociação de preços e condições de venda.\n\"A China está muito longe e desenvolver novos mercados não acontece do dia para a noite\", afirma.  \"É claro que a movimentação dos empresários já está acontecendo no sentido de buscar alternativas, mas a China não é uma alternativa óbvia e imediata para a maioria desses mercados afetados.\"\nO presidente do Brasil, Luiz Inácio Lula da Silva e o presidente da China, Xi Jinping, cumprimentam-se cerimônia no Palácio do Povo, em Pequim, no dia 13 de maio de 2025\nRicardo Stuckert/Presidência da República", "url": "https://g1.globo.com/economia/agronegocios/noticia/2026/07/19/tarifaco-pode-abrir-portas-na-china-mas-analistas-veem-limites-para-avanco-das-exportacoes-brasileiras.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-19T08:00:38+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/paNBHQ5t8cPrqQMqfej9aBUBMDM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2025/X/j/wIugndRF2Gj6Sv4VFI7g/54516546006-5c3ccfd9a2-k.jpg", "url_hash": "216fb3ee430ac95e54ec0651a1365f1f", "title_hash": "69e55e0cc1c75e08d78f1f18c7df realiza exercício para simular cenário de guerra no Porto de Santos: 'Temos que nos preparar'", "summary": "<img src=\"https://s2-g1.glbimg.com/yXoKdXRN3JmfAJa2pvBlRYiZtyY=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/j/4/SOJn3MSMAzUS1nKb2Cpw/img-5503-3-.jpeg\" /><br />     Marinha realiza exercício para simular cenário de guerra no Porto de Santos\nVanessa Rodrigues/AT\nA Marinha do Brasil escolheu o Porto de Santos, o maior da América do Sul, para realizar o seu principal exercício militar periódico. O treinamento serve para aperfeiçoar procedimentos exigidos em conflitos e simular situações operativas que podem ocorrer em um cenário de guerra real.\nA frota enviada à Baixada Santista para a Operação Adestramento de Esquadra (Aderex 2026) reúne o Navio-Aeródromo Multipropósito Atlântico, as fragatas Defensora, União e Tamandaré, o navio-patrulha oceânico Apa e o submarino Tikuna.\n✅Clique aqui para seguir o canal do g1 Santos no WhatsApp.\n \"Os navios da Esquadra vão ao mar, muitas vezes, em operações conjuntas, exercitando situações que possam ocorrer em uma guerra real\", afirma o comandante da Capitania dos Portos de São Paulo, capitão de mar e guerra Leandro Gomes Mendes.\nMaior navio de guerra da América Latina está aberto para visitação neste domingo\ng1 entra a bordo e revela segredos de submarino de guerra\nCapitão de mar e guerra Leandro Gomes Mendes\nVanessa Rodrigues/AT\nDe forma geral, a Operação Aderex tem o intuito de elevar o grau de prontidão operativa dos navios, aeronaves e tropas de fuzileiros navais. Segundo o comandante, a prática no oceano permite identificar problemas e treinar a reação da equipe. \n\"Nós temos que nos prevenir, temos que nos preparar, e a melhor maneira de fazer isso é exatamente praticando. Quando estamos no mar, identificamos problemas reais que podem acontecer\", destaca Mendes.\nMarinha abre a escotilha e mostra como é um submarino de guerra por dentro\n\nEscolha por Santos\nA escolha de Santos tem significado estratégico por se tratar do maior porto do Hemisfério Sul. A preocupação de defesa se estende também às plataformas de petróleo e às instalações da Transpetro no Litoral Norte. \n\"A Marinha do Brasil sempre conta com Santos como um ponto muito importante, tanto para apoio quanto para ser protegido futuramente. É uma infraestrutura crítica para o desenvolvimento do país. É uma área que precisa ser zelada\", explica o capitão.\nDestaques da frota\nNavio Atlântico: Considerado a maior embarcação de guerra da América Latina, que estará aberto para visitação pública amanhã. \n\nFragata Tamandaré: A primeira de oito novas embarcações previstas no plano de modernização da Marinha, projetada para ampliar a capacidade de defesa antiaérea, antissubmarina e de superfície.\nPara Mendes, os investimentos na renovação da Esquadra ajudam a atrair novos profissionais, cuja formação leva cerca de oito anos entre o Colégio Naval, a Escola Naval e o estágio. \nApesar dos novos equipamentos, o comandante reforça que o foco da instituição segue sendo o fator humano. \"O pessoal é o nosso maior patrimônio. Material a gente consegue adquirir com planejamento. Pessoas preparadas e treinadas, não\".  \nA frota permanecerá na Baixada Santista até segunda-feira, quando retornará ao Rio de Janeiro.\nSubmarino Tikuna\nAlexsander Ferraz/AT\nVÍDEOS: g1 em 1 minuto Santos", "url": "https://g1.globo.com/sp/santos-regiao/noticia/2026/07/19/marinha-realiza-exercicio-para-simular-cenario-de-guerra-no-porto-de-santos-temos-que-nos-preparar.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-19T12:08:17+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/yXoKdXRN3JmfAJa2pvBlRYiZtyY=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/j/4/SOJn3MSMAzUS1nKb2Cpw/img-5503-3-.jpeg", "url_hash": "38e8efedb7f827d05decd454cf5e063d", "title_hash": "b236f4d824c77190330263d4cd7ef75d", "corroboration": 1, "relevance_score": 0.2071, // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

function renderBriefing() {
  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  const maxRel = Math.max(...DATA.articles.map(a => a.relevance_score || 0), 0.01);
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round(((art.relevance_score || 0) / maxRel) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
        '<div class="art-actions">' +
          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
