<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}
/* Reading-history export — feeds `python -m digest --ingest-clicks` */
.reading-log{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:16px;
}
.reading-log button{
  font:inherit;letter-spacing:1px;text-transform:uppercase;
  background:none;border:1px solid var(--m3);color:var(--m3);
  padding:3px 9px;margin-left:8px;cursor:pointer;
}
.reading-log button:hover{ background:var(--ink);color:var(--paper);border-color:var(--ink); }
.reading-log[hidden]{ display:none; }

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

", "region": "brazil", "rationale": "The opening runoff debate sets the tone for Brazil's final campaign week.", "low_signal": false}, {"title": "Inside Chicago's battle against the synthetic drugs flooding the US", "summary": "The BBC's Quentin Sommerville reports from Chicago, where communities are battling a new wave of synthetic drugs.", "url": "https://www.bbc.co.uk/news/videos/c84g166kz003o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.co.uk", "published_at": "2026-10-18T21:00:22+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/standard/240/cpsprodpb/5b06/live/086155e0-cb8d-11f1-bc2e-018d645d8d21.jpg", "url_hash": "fc64c81c31ac0b0697981c0d822f0273", "title_hash": "3c3c3afaf17fe92f246408a641d43724", "corroboration": 1, "relevance_score": 4.0223, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.7226, "headline_en": "Inside Chicago's fight against synthetic drugs", "headline_pt": "Por dentro da luta de Chicago contra drogas sintéticas", "one_liner_en": "BBC reporting from Chicago shows communities struggling with a new wave of synthetic drugs spreading across the US.", "one_liner_pt": "Reportagem da BBC em Chicago mostra comunidades enfrentando uma nova onda de drogas sintéticas nos EUA.", "category": "Other", "region": "world", "rationale": "The US synthetic drug crisis is entering a dangerous new phase.", "low_signal": false}, {"title": "China cresce 4,5% com exportações em alta, mas crise imobiliária ameaça ritmo", "summary": "<img src=\"https://s2-g1.glbimg.com/slhm31vyeUNy8w7AISV_7AH8lNs=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2022/o/n/DsBMeqSAGvGJm5BGbTGQ/2022-08-12t191016z-1-lynxmpei7b0us-rtroptp-4-hongkong-anniversary.jpg\" /><br />     China usa parques que contêm enchentes para afirmar liderança global em economia verde\nA economia da China cresceu 4,5% no terceiro trimestre de 2026, na comparação com o mesmo período do ano passado, impulsionada pelas exportações e pela produção industrial. \nO resultado, divulgado nesta segunda-feira (19), ficou acima das expectativas do mercado, mas ocorre em meio à crise imobiliária e à fraqueza da demanda interna.\n🗒️ Tem alguma sugestão de reportagem? Mande para o g1\nO Produto Interno Bruto (PIB) chinês acelerou em relação ao segundo trimestre, quando havia crescido 4,3%, no ritmo mais lento em mais de três anos. Economistas esperavam alta de 4,4% entre julho e setembro.\nApesar do resultado melhor que o previsto, os dados mostram que a economia chinesa ainda enfrenta dificuldades para equilibrar o crescimento. Enquanto a indústria e as exportações sustentam a atividade, o mercado imobiliário continua em retração e as famílias mantêm os gastos contidos.\nIndústria avança, mas consumo segue fraco\nA produção industrial da China cresceu 5,5% em setembro, na comparação anual, acelerando em relação à alta de 5,2% registrada em agosto. O resultado ficou em linha com a expectativa dos analistas consultados pela Reuters.\nAs vendas no varejo, por sua vez, aumentaram 1,1% em setembro, na comparação com o mesmo mês de 2025. Embora o resultado tenha superado a previsão de 0,6% e melhorado em relação à alta de 0,4% de agosto, o avanço permaneceu limitado.\nSegundo Zhiwei Zhang, economista-chefe da Pinpoint Asset Management, o crescimento real das vendas no varejo, descontada a inflação, praticamente não avançou em relação a um ano antes.\nA diferença entre o desempenho da indústria e o do consumo é um dos principais desafios para o governo chinês, que busca tornar o crescimento menos dependente das vendas ao exterior e estimular a demanda doméstica.\nCrise imobiliária pressiona investimento\nO investimento no setor imobiliário chinês caiu 20,6% entre janeiro e setembro, na comparação com o mesmo período de 2025. Nos oito primeiros meses do ano, a retração acumulada era de 19,9%, indicando que a queda se aprofundou.\nO investimento em ativos fixos, que inclui imóveis, infraestrutura e outros projetos, recuou 7,2% no acumulado de janeiro a setembro.\nA crise imobiliária é um dos principais entraves à economia chinesa. A fraqueza do setor afeta os investimentos e contribui para a cautela das famílias, em um cenário no qual a demanda interna ainda não ganhou força suficiente para sustentar uma expansão mais equilibrada.\nPara Raymond Yeung, economista-chefe para a China do ANZ, a demanda doméstica fraca, as pressões deflacionárias persistentes e a continuidade da crise imobiliária seguem limitando a atividade econômica.\n“Embora as exportações tenham oferecido uma proteção importante, é improvável que compensem totalmente a fraqueza em outras áreas da economia”, afirmou o economista à Reuters.\nExportações ajudam a sustentar o crescimento\nAs vendas ao exterior têm sido um dos principais motores da economia chinesa em 2026, em parte pelo avanço das exportações relacionadas à inteligência artificial e pela força da indústria.\nEsse desempenho, porém, também enfrenta riscos. Uma desaceleração dos investimentos globais em inteligência artificial pode reduzir a demanda por produtos e componentes tecnológicos chineses.\nOutro fator de pressão é a relação comercial com a União Europeia. Um acordo para limitar os embarques de veículos híbridos chineses pode afetar um dos segmentos de exportação que mais crescem no país.\nPara Ho Woei Chen, economista do UOB, a demanda externa continua sendo um fator decisivo para manter a economia chinesa em movimento. Segundo ele, o desempenho ainda dentro da meta de crescimento reduz a probabilidade de uma ampliação imediata dos estímulos econômicos.\nChina deve crescer menos em 2026\nA economia chinesa deve crescer 4,5% em 2026, abaixo da expansão de 5% registrada em 2025, segundo a mediana das projeções de economistas consultados pela Reuters. Para 2027, a previsão é de desaceleração para 4,4%.\nO resultado do terceiro trimestre também reduz a pressão sobre o governo para anunciar medidas amplas de estímulo econômico no curto prazo. Nos três primeiros trimestres de 2026, o PIB acumulou crescimento de 4,6% em relação ao mesmo período do ano anterior.\nAinda assim, economistas avaliam que o desempenho da economia permanece desigual. As exportações e a produção industrial sustentam parte da expansão, mas o investimento imobiliário e a demanda interna continuam sendo pontos de fragilidade.\nA expectativa é que o governo recorra mais a medidas fiscais para apoiar a atividade econômica, enquanto a inflação ao consumidor e a melhora dos preços ao produtor limitam o espaço para cortes mais agressivos nos juros.\n*Contém informações da Agência Reuters\nSob Xi Jinping, os planos quinquenais da China têm como foco o \"desenvolvimento de alta qualidade\"\nGrigory Sysoev/RIA Novosti/Pool/Anadolu via Getty Images/BBC", "url": "https://g1.globo.com/economia/noticia/2026/10/19/china-cresce-45percent-com-exportacoes-em-alta-mas-crise-imobiliaria-ameaca-ritmo.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-10-19T12:36:43+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/slhm31vyeUNy8w7AISV_7AH8lNs=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2022/o/n/DsBMeqSAGvGJm5BGbTGQ/2022-08-12t191016z-1-lynxmpei7b0us-rtroptp-4-hongkong-anniversary.jpg", "url_hash": "d9395629eef5536ffe00f25a2cb1b49e", "title_hash": "cfd3cd3f3fbdfa023aa58c21e90fe571", "corroboration": 1, "relevance_score": 3.9768, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.718, "headline_en": "China grows 4.5% on exports, but property crisis looms", "headline_pt": "China cresce 4,5% com exportações, mas crise imobiliária ameaça", "one_liner_en": "Third-quarter GDP rose 4.5% as exports surged, while the real estate downturn still threatens momentum.", "one_liner_pt": "O PIB do terceiro trimestre subiu 4,5% com exportações em alta, mas a crise imobiliária ainda ameaça o ritmo.", "category": "Economy", "region": "world", "rationale": "China's quarterly GDP is a key signal for Brazilian commodity exporters.", "low_signal": true}, {"title": "O tabuleiro de Flávio Bolsonaro: os nomes estratégicos que circulam nos bastidores para um eventual governo", "summary": "<img src=\"https://s2-g1.glbimg.com/2OtEaEOrDFyIn3eWRizuVkbm-EE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/d/0/YHwCIFTY6B3rDNr1krdQ/55588375394-52964b8b07-k.jpg\" /><br />     Flávio Bolsonaro (PL)\nVittor Sales\nIntegrantes da campanha de Flávio Bolsonaro (PL) já admitem nomes e postos estratégicos em caso de vitória nas eleições. Nos bastidores, aliados discutem quem ocuparia posições-chave, quais seriam os nomes de confiança do senador e como acomodar interesses políticos numa eventual administração.\nUm dos movimentos mais importantes desse tabuleiro envolve o Ministério da Justiça e o Senado. O nome de Guilherme Derrite é considerado favorito para comandar a pasta. Ao Estúdio i semana passada, Derrite negou convite ou qualquer discussão sobre isso. \nNos bastidores, integrantes da campanha de Flávio dão como certa sua ida numa eventual vitória de Flávio. Sua ida para o Executivo também abriria espaço para Vicente Santini — suplente de Derrite — no Senado, numa articulação que envolve também os laços históricos da família de Santini com Jair Bolsonaro. A trajetória de Santini no governo anterior e a relação de seu pai com o ex-presidente são fatores considerados nessa equação.\nRELEMBRE: Bolsonaro nomeia secretário exonerado por usar avião da FAB no lugar de Braga Netto\nNa área econômica, o mapa reúne nomes conhecidos do governo Bolsonaro e do mercado financeiro. Roberto Campos Neto, ex-presidente do Banco Central, Alexandre Betamio e Marcelo Kayath, além de Adolfo Sachsida, ex-ministro de Minas e Energia, aparecem entre as possibilidades para o Ministério da Fazenda. \nOutro eixo central é o da articulação política, considerado decisivo para garantir sustentação a um eventual governo. Nesse campo, aparecem Wagner Rosário, ex-ministro da Controladoria-Geral da União (CGU), e o senador Eduardo Gomes, que foi líder do governo Bolsonaro no Congresso. Ambos são mencionados nas conversas sobre a Casa Civil e a interlocução com o Legislativo.\nAgora no g1\nO senador Rogério Marinho também ocupa posição importante nesse tabuleiro. Próximo à família Bolsonaro e com experiência no Executivo e no Congresso, Marinho é citado tanto para uma eventual Casa Civil quanto para a disputa pela presidência do Senado. O destino dependeria da composição de forças no Congresso e dos acordos políticos construídos após a eleição.\nMas o mapa não se limita aos nomes mais conhecidos. No núcleo de confiança de Flávio, um personagem merece atenção especial: O publicitário Marcello Lopes, o Marcelão, tratado por interlocutores como amigo pessoal, conselheiro e figura estratégica do senador. Sua influência nas decisões e nas articulações de bastidores faz dele um nome importante para compreender como Flávio organiza seu círculo mais próximo e quem teria acesso direto ao centro de poder.\nOutra integrante do governo Bolsonaro que aparece nas conversas é Daniela Marques, ex-presidente da Caixa Econômica Federal. Seu nome é associado a uma eventual função ligada à agenda de prosperidade — Ministério da Prosperidade por exemplo — e desenvolvimento econômico.\nPara o Itamaraty, um dos nomes mencionados é o de Marcos Troyjo, ex-presidente do banco dos Brics, que integrou a equipe econômica do governo Bolsonaro.\n📱 Acesse o Canal da Sadi no WhatsApp\nFlávio Bolsonaro disse a TV Globo que Eduardo Bolsonaro não será ministro em caso de vitória nas eleições— mas nada disse sobre embaixada. Na campanha, é dado como certo que uma vez Flávio eleito, vai trabalhar para desenrolar o irmão de suas questões policiais e indicá-lo a embaixada nos EUA — assim como pai tentou fazer em meados de 2019/2020. \nO tabuleiro também alcança o Supremo Tribunal Federal (STF). Para eventuais indicações à Corte, circulam os nomes de Jorge Oliveira, ministro do Tribunal de Contas da União e ex-ministro de Jair Bolsonaro, e Maria Cláudia Bucchianeri, ex-ministra do Tribunal Superior Eleitoral.\nAinda não há convites formalizados nem definições sobre a distribuição dos cargos — inclusive, publicamente, a ordem é não falar de governo e sim de campanha. Parte dos nomes é defendida por aliados, enquanto outros aparecem em conversas preliminares sobre a formação de uma eventual equipe.\nO que esse mapa revela, por enquanto, é a tentativa de desenhar não apenas um ministério, mas uma estrutura de poder: quem teria a confiança pessoal de Flávio, quem faria a ponte com o Congresso, quem comandaria a economia e quais nomes poderiam ser considerados para futuras vagas no Supremo.\nÉ esse o tabuleiro que começa a ser montado nos bastidores da campanha, antes mesmo de uma eventual vitória nas urnas.\nGloboPop: veja os vídeos do palco da Andréia Sadi", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/10/19/o-tabuleiro-de-flavio-bolsonaro.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-10-19T11:44:20+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/2OtEaEOrDFyIn3eWRizuVkbm-EE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/d/0/YHwCIFTY6B3rDNr1krdQ/55588375394-52964b8b07-k.jpg", "url_hash": "027e341a6e0c3fa7d5f689d05f54fa48", "title_hash": "a861c5dfdd10195841ce7e0edeb7ffc2", "corroboration": 2, "relevance_score": 2.9596, "reputation_score": 0.85, "corroboration_score": 0.5, "final_score": 0.7147, "headline_en": "Names circulating for a possible Flávio Bolsonaro cabinet", "headline_pt": "Os nomes estratégicos cotados para um eventual governo de Flávio Bolsonaro", "one_liner_en": "Campaign insiders are already discussing strategic posts and ministers should Flávio Bolsonaro win the runoff.", "one_liner_pt": "Integrantes da campanha já discutem nomes e postos estratégicos em caso de vitória de Flávio Bolsonaro.", "category": "Brazil", "region": "brazil", "rati function t(key) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS['en'][key] || key; }

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

  img.onerror = null;
  img.src = 'the_lighthouse2.png';

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
// The scene and the headline label come from the *current* observation when we
// have one. The daily weathercode is the most severe condition anywhere in the
// 24h window, so using it alone made a calm drizzly morning render as a
// thunderstorm. The hi/lo/wind stats stay on the daily outlook.
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.current_code != null ? w.current_code
               : (w.wmo_code != null ? w.wmo_code : 3);
  const precip = w.current_code != null ? (w.precip_now_mm || 0)
                                        : (w.precipitation_mm || 0);
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// The page is a static file generated once a day, so the baked forecast goes
// stale within hours. Open-Meteo is keyless and CORS-enabled, so refresh the
// card straight from the browser. On any failure we silently keep the baked
// values.
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=-25.4297&longitude=-49.2711&current=temperature_2m%2Capparent_temperature%2Crelative_humidity_2m%2Cprecipitation%2Cweathercode%2Cwindspeed_10m&daily=weathercode%2Ctemperature_2m_max%2Ctemperature_2m_min%2Cprecipitation_sum%2Cprecipitation_probability_max%2Cwindspeed_10m_max&timezone=America%2FSao_Paulo&forecast_days=1';

function refreshWeather() {
  // --weather previews bake a fixed condition on purpose; don't clobber it.
  if (DATA.live_weather === false) return;
  fetch(WX_URL, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      const daily = d.daily || {};
      const cur   = d.current || {};
      const first = (k) => (daily[k] && daily[k].length ? daily[k][0] : null);
      DATA.weather = Object.assign({}, DATA.weather, {
        temp_max:         first('temperature_2m_max'),
        temp_min:         first('temperature_2m_min'),
        precipitation_mm: first('precipitation_sum'),
        precip_prob:      first('precipitation_probability_max'),
        wind_max_kmh:     first('windspeed_10m_max'),
        wmo_code:         first('weathercode'),
        temp_now:         cur.temperature_2m,
        feels_like:       cur.apparent_temperature,
        humidity:         cur.relative_humidity_2m,
        precip_now_mm:    cur.precipitation,
        wind_now_kmh:     cur.windspeed_10m,
        current_code:     cur.weathercode,
        observed_at:      cur.time,
      });
      renderWeather();
    })
    .catch(() => {});
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
// The page is static (GitHub Pages), so there is nowhere to POST to. Clicks
// accumulate here and are exported as a file that the pipeline imports with
// `python -m digest --ingest-clicks`, which feeds the interest centroid used
// for relevance scoring.
const CLICK_KEY = 'tl_clicks';

function readClicks() {
  try { return JSON.parse(localStorage.getItem(CLICK_KEY) || '[]'); }
  catch(_) { return []; }
}

function trackClick(url, domain) {
  try {
    const clicks = readClicks();
    clicks.push({ url: url, domain: domain, at: new Date().toISOString() });
    if (clicks.length > 2000) clicks.splice(0, clicks.length - 2000);
    localStorage.setItem(CLICK_KEY, JSON.stringify(clicks));
    updateReadingLog();
  } catch(_) {}
}

function updateReadingLog() {
  const clicks = readClicks();
  const box = document.getElementById('j-reading-log');
  if (!box) return;
  box.hidden = clicks.length === 0;
  const label = document.getElementById('j-reading-count');
  if (label) label.textContent = clicks.length + ' ' + t('readingLog');
}

function exportClicks() {
  const clicks = readClicks();
  if (!clicks.length) return;
  const blob = new Blob([JSON.stringify(clicks, null, 2)], { type: 'application/json' });
  const stamp = new Date().toISOString().slice(0, 10);
  _dlBlob(blob, 'lighthouse-clicks-' + stamp + '.json');
  _flashBtn(document.getElementById('j-export-clicks'));
}

function clearClicks() {
  if (!confirm(t('clearConfirm'))) return;
  try { localStorage.removeItem(CLICK_KEY); } catch(_) {}
  updateReadingLog();
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  refreshWeather();
  // Static page, long-lived tab: keep the card honest.
  setInterval(refreshWeather, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) refreshWeather();
  });
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();
  updateReadingLog();

  document.getElementById('j-export-clicks').addEventListener('click', exportClicks);
  document.getElementById('j-clear-clicks').addEventListener('click', clearClicks);

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
