<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

</svg>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
      <button id="j-lang-pt" class="lang-btn" onclick="setLang('pt')">PT</button>

    <span class="mast-rule mast-rule-l"><span class="mast-rule-line"></span><span class="mast-rule-gem">&#9670;</span></span>

    <span class="mast-rule mast-rule-r"><span class="mast-rule-gem">&#9670;</span><span class="mast-rule-line"></span></span>

    <span>Curitiba, Paran&aacute;</span>

  <div class="forecast">

    <div class="fx-panel">
      <div class="fx-panel-left">
        <span class="fx-kicker" id="j-fx-kicker">The Weather</span>
        <span class="fx-condition" id="j-wx-cond">Overcast Skies</span>
        <span class="fx-strapline" id="j-fx-strapline">Curitiba &amp; the Paran&aacute; highlands</span>
      </div>
      <div class="fx-stats" id="j-wx-stats">
        <span><b>HIGH</b> --&deg;</span><span><b>LOW</b> --&deg;</span><span><b>WIND</b> --</span>

  <!-- SECTION NAV -->
  <div class="section-nav" id="j-nav"></div>

  <div class="briefing" id="j-briefing" style="display:none;">

  <!-- STATS -->

  <!-- ARTICLE LIST -->

.5352, "headline_en": "What Happened When Ecuador Adopted Bukele's Anti-Violence Model", "headline_pt": "O que aconteceu quando o Equador adotou o modelo Bukele de segurança", "one_liner_en": "Ecuador militarized public security, built a mega-prison, and expanded states of exception to reclaim territorial control.", "one_liner_pt": "O Equador militarizou a segurança, construiu uma megaprisão e expandiu estados de exceção para retomar o controle territorial.", "category": "Geopolitics", "region": "world", "rationale": "Ecuador's adoption of the Bukele security model offers an important regional case study on authoritarian crime-fighting strategies.", "low_signal": false}, {"title": "O que aconteceu no país da América do Sul que adotou o 'modelo Bukele' de combate à violência", "summary": "<img src=\"https://s2-g1.glbimg.com/eFYYEmpRs4oE5DvTJBv0LOI17Kk=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/u/B/ycCU8uTcyOT2Kxwo6wCw/design-sem-nome-47-.jpg\" /><br />     Daniel Noboa, presidente do Equador.\nGetty Images via BBC\nEm 9 de janeiro de 2024, o presidente do Equador, Daniel Noboa, declarou a existência de um conflito armado interno no país e ordenou que as Forças Armadas neutralizassem 22 grupos do crime organizado.\n✅ Siga o canal de notícias internacionais do g1 no WhatsApp\nA militarização da segurança pública conseguiu reduzir inicialmente os níveis de violência, especialmente dentro dos presídios.\nNo entanto, esse avanço foi revertido e, em 2025, o país registrou 9.216 homicídios — um aumento de 30,48% em comparação com 2024.\nEmbora a Procuradoria-Geral do Estado tenha registrado uma queda de 40% nas denúncias de extorsão em relação a 2024 e uma leve redução nos casos denunciados de sequestro, o aumento no número de homicídios indica que o Equador viveu um dos períodos mais violentos de sua história.\nAgora no g1\nDiante desse cenário, o governo de Noboa adotou medidas semelhantes às implementadas em El Salvador pelo presidente Nayib Bukele.\nAlém da militarização da segurança, o governo construiu uma megapenitenciária, ampliou o uso de estados de exceção e mobilizou forças de segurança para recuperar o controle do território.\nEm dezembro de 2025, o presidente afirmou que seu governo havia tomado decisões difíceis ao \"encarar de frente o narcoterrorismo\", em referência à declaração de conflito armado interno. Mas os resultados da estratégia oficial têm sido questionados.\nLuis Córdova, pesquisador do Observatório Equatoriano de Conflitos da Universidade Central do Equador, disse à BBC News Mundo que o país importou de Bukele uma \"estética\" da guerra contra o crime, na qual os criminosos são mostrados presos \"pior que animais\", enquanto os cidadãos que \"se comportam bem\" permanecem livres.\n\"Bukele vendeu muito bem essa ideia com a prisão do Cecot [Centro de Confinamento do Terrorismo], e Noboa implementou algo semelhante com a construção da prisão La Encuentro, apresentada ao país como uma penitenciária no estilo Bukele. Mas, enquanto o Cecot foi projetado para abrigar entre 20 mil e 30 mil pessoas, aqui cabem 740; então é muito difícil que cumpra um propósito parecido.\"\n\"Eu diria que implementar essa 'estética do bukelismo' é muito rentável para que Noboa se apresente como o homem que não tem medo de enfrentar 'os maus'. Mas, além disso, ele não conseguiu controlar o crime organizado.\"\nA prisão do Cecot, em El Salvador, tornou-se um modelo de combate à violência que foi exportado para outros países.\nGetty Images via BBC\nEspecialistas destacam que replicar o modelo salvadorenho no Equador não é uma tarefa simples por diversas razões, entre elas as diferenças sociais e geográficas entre os dois países, além das características distintas dos grupos criminosos enfrentados por cada governo.\n\"As gangues de El Salvador tinham uma natureza completamente diferente do crime transnacional ligado aos grupos de cocaína inseridos no mercado global, que é o que ocorre no Equador, com um financiamento praticamente ilimitado\", explica à BBC Mundo Karen Sichel, doutoranda na Faculdade de Criminologia da Universidade de Cambridge.\nO próprio Noboa reconheceu, em abril deste ano, os recursos disponíveis para o crime organizado no país: \"É uma guerra, um conflito em que lutamos contra máfias que movimentam dezenas de bilhões de dólares por ano.\"\nEm relação ao território, El Salvador é aproximadamente 13 vezes menor que o Equador em extensão territorial e tem uma população majoritariamente urbana, enquanto as quatro regiões equatorianas — Sierra, Costa, Amazônia e Insular — se destacam pela grande diversidade geográfica e demográfica.\nAlém disso, o Equador possui áreas de difícil acesso e fronteiras vulneráveis, condições que favorecem atividades ilícitas. Um exemplo disso é a região amazônica, que se tornou um ponto estratégico para o crime organizado.\nNo mesmo discurso de abril, o presidente afirmou que seu governo tem \"o controle do território, de todo o território, das prisões e o controle de nossas fronteiras\", mas reconheceu que o combate a esses grupos leva tempo, após anos de falta de atuação do Estado.\nA BBC Mundo entrou em contato com a Presidência do Equador, o Ministério da Defesa e o Ministério do Interior para solicitar uma entrevista mas, até o momento da publicação desta reportagem, não havia recebido resposta.\nComo é estar na linha de frente da guerra às drogas no Equador, onde nem a polícia confia na própria polícia\nUm inimigo fragmentado e espalhado pelo território\nDiferentemente da capacidade de comando dos líderes das gangues salvadorenhas, analistas como Adam Isacson e John Walsh destacam que \"as redes criminosas do Equador são mais desorganizadas e caóticas\", o que dificulta o combate às suas atividades ilícitas.\nA queda de alguns líderes, somada a um constante jogo de alianças e confrontos, levou a uma fragmentação tão grande que, quando Noboa assumiu seu segundo mandato, em maio de 2025, um relatório da ACLED — organização global especializada em conflitos armados — foi publicado com o título: \n\"Noboa declarou guerra a 22 grupos criminosos no Equador. Em seu novo mandato, ele enfrenta muitos mais.\"\nOutro relatório sobre a violência no Equador em 2025, elaborado pelo Observatório Equatoriano de Crime Organizado, destaca como os grupos criminosos, em um processo constante de adaptação, diversificaram tanto suas atividades ilícitas quanto sua presença por todo o território equatoriano.\n\"A fragmentação geográfica das atividades ilícitas caminha junto com a fragmentação interna das organizações criminosas, que passaram por processos de transformação para conseguir exercer o controle territorial exigido pelos diferentes mercados\", afirma o documento.\nEsses diferentes mercados mencionados pelo relatório incluem desde o tráfico de drogas — principalmente cocaína — até novas atividades ilícitas, como mineração ilegal, tráfico de pessoas e armas, lavagem de dinheiro e extorsão.\nSegundo a análise da ACLED, \"embora quase 80% da violência esteja concentrada nas províncias costeiras, pontos estratégicos de passagem para o envio de drogas (...), a diversificação das fontes de renda dos grupos criminosos impulsionou sua expansão para o interior do país\".\nPara a organização internacional, o crime organizado já se expandiu para mais de 150 dos 222 cantões que compõem o Equador.\nPara o analista Luis Córdova, Noboa adotou de Bukele a estratégia de apresentar os militares como referência moral.\nGetty Images via BBC\nSichel avalia que o governo enfrenta um problema que vai além de sua capacidade de análise e de formulação de políticas públicas.\nSegundo ela, o Estado enxerga o crime organizado apenas como um inimigo que precisa ser eliminado, quando, na realidade, o fenômeno é muito mais complexo.\n\"O crime organizado não teria alcançado níveis tão disseminados por todo o território equatoriano se não contasse com a colaboração da própria sociedade. Isso inclui políticos, servidores públicos, funcionários, juízes, promotores, além de advogados, tabeliães, contadores e profissionais do setor imobiliário.\"\nO governo do Equador insiste que \"não faz acordos com o crime\" e, assim como o governo salvadorenho, tenta recuperar o controle do território por meio de um amplo deslocamento de militares e policiais em todo o país.\nNo entanto, as organizações criminosas —que iniciaram suas atividades na região costeira devido à importância estratégica dos portos— se espalharam pela Serra, Amazônia e até pela região insular.\nSichel analisou os crimes ligados ao crime organizado no Equador e elaborou mapas que mostram a incidência dessas atividades nas diferentes regiões do país.\n\"Quando eu elaborava esse índice, percebia que, no Equador, parece que tudo o que tem valor — até os animais, como no tráfico de tubarões nas Ilhas Galápagos — atrai o crime organizado.\"\nPara a especialista, isso mostra que a estratégia de militarização, por si só, não é suficiente.\n\"É importante contar com as Forças Armadas, claro. Mas, enquanto não forem fortalecidas as instituições, especialmente o sistema de Justiça, dificilmente avançaremos. Não é um problema apenas do governo, é um problema da sociedade.\"\nO outro inimigo\nPoucos aspectos refletem de forma tão clara a ligação entre o crime organizado e a sociedade quanto a lavagem de dinheiro.\nSegundo o Observatório Equatoriano de Crime Organizado, esse crime é, no Equador, \"o motor estratégico que sustenta e perpetua a cadeia dos mercados ilícitos, garantindo liquidez e legitimidade ao narcotráfico, à mineração ilegal e à extorsão\".\n\"O crime organizado procura se adaptar, aproveitar os espaços que a legalidade oferece para legitimar o dinheiro obtido de forma ilícita para, depois, reinvesti-lo\", afirmou à BBC Mundo Byron Villagómez, líder técnico do observatório.\nPara Villagómez, esse tipo de crime pode ser observado em diversas atividades legais, desde o mercado automotivo — especialmente por meio da compra e venda de veículos usados — até o setor imobiliário. Segundo ele, a infiltração do crime organizado também alcança áreas como a agricultura e a pesca.\nO especialista acrescenta que a economia legal e a ilegal se conectam por meio do que organismos internacionais classificam como facilitadores profissionais.\n\"Por exemplo, para criar empresas de fachada usadas para ocultar bens obtidos com a lavagem de dinheiro, é necessária a assessoria jurídica de advogados. Para registrar essas empresas nos órgãos públicos, também é preciso recorrer a um tabelião\", explica Villagómez.\nKaren Sichel ressalta que quem ajuda o narcotráfico a se estabelecer nem sempre corresponde ao estereótipo de um integrante de facção criminosa.\n\"Quando você observa as pessoas que ajudam o narcotráfico a se consolidar, elas não têm uma tatuagem dos Los Lobos ou dos Los Choneros\", afirma, referindo-se a duas das principais facções criminosas do Equador. \"Você vê pessoas instruídas, profissionais que estudaram na mesma universidade que você e que estão ganhando dinheiro com isso.\"\nO emprego informal no país também tem sido utilizado pela economia ilegal.\nGetty Images via BBC\nA desaceleração econômica enfrentada pelo Equador desde 2023 e o agravamento das condições sociais também são apontados como fatores que favorecem a expansão das economias ilícitas, que acabam substituindo fontes formais de emprego e renda.\nPara Roberto Andrade, ex-diretor da Unidade de Análise Financeira e Econômica (UAFE), \"a corrupção é transversal e, junto com a lavagem de dinheiro, é o que permite que essas atividades criminosas prosperem\".\nAinda assim, ele avalia que, nos últimos anos, o país passou a adotar estratégias mais concretas e objetivos específicos para prevenir a lavagem de dinheiro.\n\"Antes, o país estava focado em fortalecer os sistemas, capacitar as pessoas e acreditava que isso, automaticamente, levaria às investigações, o que é verdade, mas não é a estratégia mais eficaz\", afirma. \n\"Mas, há cerca de dois anos, a prioridade tem sido identificar os casos específicos nos quais o Estado quer se concentrar.\"\nSegurança privatizada\nO número recorde de homicídios registrados em 2025 expôs a ampla circulação de armas de fogo no Equador, onde esse tráfico representa, por si só, um mercado ilícito, segundo o Observatório Equatoriano de Crime Organizado.\n\"Em termos gerais, entre 2020 e junho de 2025, foram registrados 29.305 homicídios dolosos no Equador, dos quais 83,4% foram cometidos com o uso de armas de fogo\", informou o observatório, com base em dados do Ministério do Interior do Equador.\nCarla Álvarez, professora e pesquisadora do Instituto de Altos Estudos Nacionais, afirmou à BBC Mundo que, até o início desta década, o Equador tinha menos armas em circulação do que seus países vizinhos, graças a uma das políticas de Estado mais restritivas da região.\nMas esse cenário mudou após as rebeliões nos presídios e o aumento das mortes nas ruas. \nEm abril de 2023, o governo do então presidente Guillermo Lasso autorizou o porte e a importação de armas, além de permitir que agentes armados de empresas de segurança privada atuassem em apoio à polícia.\nPara a especialista, desde então o país passou a adotar uma lógica de privatização da segurança, tendência que se intensificou durante o governo de Daniel Noboa.\n\"A segurança deixou de ser pensada como um bem público, um direito da população, e passou a ser tratada como um privilégio particular. Se você tem uma arma, pode se proteger; se pode pagar por segurança privada, também consegue se proteger.\"\nÁlvarez avalia que o Equador e El Salvador compartilham algumas características, como a coexistência de empresas privadas de segurança junto ao modelo de segurança pública, passando por uma permissividade para a expansão do setor de vigilância privada e problemas históricos na fiscalização dos arsenais mantidos por essas empresas.\nSegundo a pesquisadora, essa situação abriu espaço para o desvio de armas para o mercado ilegal por meio de empresas de segurança privada no Equador. Em alguns casos, essas empresas chegaram a ser controladas por líderes de organizações criminosas.\nArma de fogo e munições apreendidas em Quito, em janeiro de 2026.\nGetty Images via BBC\nEm relação a armas, Noboa também seguiu o exemplo de Bukele ao permitir o uso de armamentos apreendidos do crime organizado.\nEm abril de 2022, o governo de El Salvador autorizou a reutilização de armas, dinheiro e bens confiscados de gangues para combater as próprias organizações criminosas.\nPara Álvarez, trata-se de uma medida que contraria o que qualquer força de segurança precisa: a padronização do armamento, para facilitar tanto o abastecimento quanto a gestão dos arsenais.\nEmbora considere a decisão \"antitécnica\", ela entende que é popular dizer: \"Vamos tirar essas armas desses criminosos e usar as próprias ferramentas deles contra eles\".\n\"A questão das armas é fundamental, mas o desarmamento não faz parte do debate público. Isso também reflete uma simplificação da realidade, baseada na ideia de 'bons e maus', 'criminosos e não criminosos'. E essa simplificação faz com que deixemos de questionar outros fatores que influenciam a violência\", conclui a especialista.\nDireitos humanos e liberdade de imprensa\nAssim como Bukele, Noboa também tem sido alvo de críticas por embates com outros órgãos do Estado que tentaram impor limites ao Poder Executivo. \nUm exemplo é a Corte Constitucional do Equador, que decidiu que a situação no país não atendia aos critérios para ser classificada como um conflito armado interno.\nDa mesma forma, a exemplo de seu homólogo salvadorenho, Noboa entrou em confronto com outros setores da sociedade, de jornalistas a defensores dos direitos humanos.\nBilly Navarrete, presidente da Comissão Permanente em Defesa dos Direitos Humanos (CDH) em Guayaquil, afirma que o trabalho dos defensores de direitos humanos se tornou, de forma geral, mais difícil.\n\"O próprio governo nos chamou de antipatriotas, e o caso de Mónica Silva Koniuszek [ativista polonesa encontrada morta na província equatoriana de Santa Elena] e outros crimes cometidos contra defensores em razão do trabalho que realizam em campo demonstram essa dificuldade.\"\nSegundo ele, esse discurso não se limita às autoridades, mas também se espalhou pelas ruas.\n\"Quando entro em um táxi, o motorista diz: 'Você é aquele que defende bandidos'\", relata Navarrete. \n\"É claro que as pessoas estão angustiadas com o nível de violência, e nós acabamos ficando no meio dessa angústia, como alvo de ataques.\"\nEm relação à imprensa, Artur Romeu, diretor do escritório da Repórteres sem Fronteiras (RSF) para a América Latina, destacou a queda acentuada do Equador no Ranking Mundial da Liberdade de Imprensa de 2026, que avalia anualmente as condições para o exercício do jornalismo em 180 países.\n\"O país está entre os três que mais perderam posições no mundo em 2025: caiu 31 colocações e passou a ocupar o 125º lugar. Em 2022, estava na 68ª posição\", detalhou.\nNayib Bukele reduziu os níveis de insegurança em seu país, embora tenha sido alvo de críticas pelo caminho adotado para alcançar esse resultado.\nGetty Images via BBC\nEm seu relatório sobre o Equador de 2025, a Human Rights Watch afirmou que \"a resposta do governo ao crime organizado deu origem a graves violações de direitos humanos por parte das forças de segurança, incluindo execuções extrajudiciais, desaparecimentos forçados, detenções arbitrárias e maus-tratos\". \nA organização destacou como caso emblemático a tortura e a morte de quatro meninos que desapareceram em dezembro de 2024.\nAs críticas também partiram das Nações Unidas. Oito relatores da ONU lembraram ao governo equatoriano que \"terrorismo e crime organizado são fenômenos distintos\" e advertiram que confundir os dois conceitos pode servir para justificar o uso ilegal da força e restrições aos direitos humanos.\n\"Acho que a ONU deveria deixar de lado inclinações ideológicas e simplesmente se concentrar na vida, nas pessoas. Garantir a vida da maioria que não comete crimes e também avaliar a situação daqueles que cometem crimes sem parar\", respondeu o presidente Noboa.\nPara Luis Córdova, o país vive um processo de autocratização que, ao contrário do que ocorreu em El Salvador, decorre não do sucesso no combate à insegurança, mas justamente do fracasso da estratégia oficial.\n\"Como Noboa não conseguiu mudar a percepção de que a segurança melhorou, resta a ele fechar gradualmente os caminhos da democracia, para que haja mais autocensura por parte da imprensa e menos atores políticos dispostos a divergir na esfera pública\", afirma.\nNos últimos dias, o presidente rebateu as acusações de que estaria enfraquecendo a democracia.\n\"Não se pode dizer que eu seja um ditador. Me insultam e insultam minha família. Algumas organizações políticas que me acusam têm vínculos com o narcotráfico e tentam jogar a culpa em nós. Isso deveria ser investigado. Nós estamos apenas tentando fazer cumprir a lei\", disse.\nDiante desse cenário, Sichel questiona: \"O que nos leva, no Equador, a questionar o caso Bukele?\". Para ela, o essencial é saber \"como queremos ser governados\".\n\"Ao analisar as pesquisas do Projeto de Opinião Pública da América Latina (LAPOP) e do Latinobarómetro dos últimos anos, vemos que a maioria dos equatorianos quer que apareça alguém para resolver seus problemas, mesmo que, ao fazer isso, essa pessoa acabe eliminando completamente as instituições independentes ou a própria democracia.\"", "url": "https://g1.globo.com/mundo/noticia/2026/08/02/o-que-aconteceu-no-pais-da-america-do-sul-que-adotou-o-modelo-bukele-de-combate-a-violencia.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-08-02T10:18:32+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/eFYYEmpRs4oE5DvTJBv0LOI17Kk=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/u/B/ycCU8uTcyOT2Kxwo6wCw/des s", "one_liner_en": "Deputy Bia Kicis announced in Brasília that Michelle Bolsonaro will join her as a running mate for the Senate in 2026.", "one_liner_pt": "A deputada Bia Kicis anunciou em Brasília que Michelle Bolsonaro será sua parceira de chapa ao Senado em 2026.", "category": "Other", "region": "brazil", "rationale": "Michelle Bolsonaro's Senate candidacy is a significant national political development ahead of the 2026 elections.", "low_signal": false}, {"title": "Votações finais do Fala Curitiba 2026 partem da região Sul nesta segunda", "summary": "<p>A etapa derradeira do Fala Curitiba 2026 inicia nesta segunda (3/7) com encontros presenciais nas dez regionais da capital. As...<\/p>\n<p>O post <a href=\"https://www.bemparana.com.br/noticias/parana/votacoes-finais-do-fala-curitiba-2026-partem-da-regiao-sul-nesta-segunda/\">Votações finais do Fala Curitiba 2026 partem da região Sul nesta segunda<\/a> apareceu primeiro em <a href=\"https://www.bemparana.com.br\">Bem Paraná<\/a>.<\/p>", "url": "https://www.bemparana.com.br/noticias/parana/votacoes-finais-do-fala-curitiba-2026-partem-da-regiao-sul-nesta-segunda/", "source_domain": "bemparana.com.br", "published_at": "2026-08-02T11:41:14+00:00", "origin": "feed", "image_url": "", "url_hash": "2588226b01885dacd213e099da53569c", "title_hash": "cbebbd2f6f64a4a526b162bb5e99b498", "corroboration": 1, "relevance_score": 0.2044, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3572, "headline_en": "Fala Curitiba 2026 Final Voting Rounds Begin in the South District Monday", "headline_pt": "Votações finais do Fala Curitiba 2026 começam na região Sul nesta segunda-feira", "one_liner_en": "The final stage of Fala Curitiba 2026 kicks off Monday with in-person meetings across the city's ten districts.", "one_liner_pt": "A etapa final do Fala Curitiba 2026 começa na segunda com encontros presenciais nas dez regionais da capital.", "category": "Other", "region": "curitiba", "rationale": "The Fala Curitiba participatory planning process directly affects local governance priorities for Curitiba residents.", "low_signal": false}, {"title": "João Pessoa sedia etapa regional de torneio mundial de robótica com alunos de 6 a 10 anos", "summary": "<img src=\"https://s2-g1.glbimg.com/v9xpzgNsQAT_OPhV1VI1P8lGQzk=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/N/R/XUTNzSR165q1ui8ihhhg/img-0333.jpg.jpeg\" /><br />     João Pessoa recebe etapa regional de torneio internacional de robótica neste domingo\nArquivo Pessoal/Pryscila Oliveira\nJoão Pessoa recebe neste domingo (2) uma etapa regional da FIRST LEGO League (FLL) Explore, torneio internacional de robótica voltado para crianças de 6 a 10 anos. Ao todo, 185 estudantes da rede municipal de ensino, divididos em 43 equipes, vão apresentar projetos desenvolvidos com peças Lego e programação para propor soluções inspiradas no tema ‘Unearthed’ (Desenterrado), que reúne arqueologia, tecnologia e inovação.\nO evento acontece no Centro Escolar Municipal de Atividades Pedagógicas Integradoras (CEMAPI), no bairro de Mangabeira, na Zona Sul da capital paraibana, com expectativa de reunir cerca de 700 pessoas entre participantes, familiares e visitantes.\n✅ Clique aqui para seguir o canal do g1 PB no WhatsApp\nNa categoria Explore, cada equipe é formada por até seis crianças. Ao longo da temporada, os estudantes desenvolvem um projeto a partir de um problema real relacionado ao tema proposto pela competição. Neste ano, o desafio envolve a arqueologia, com o uso de peças Lego, programação e conceitos de ciência, tecnologia, engenharia, artes e matemática (STEAM).\nOs projetos apresentados no torneio são resultado de uma jornada de aprendizagem que começa antes da competição. Durante a temporada, os estudantes pesquisam o tema, identificam um problema real, desenvolvem uma solução e constroem um modelo em Lego para representar a ideia. Na etapa final, cada equipe tem cinco minutos para apresentar o projeto aos avaliadores e explicar o processo de criação.\nA preparação envolve pesquisa, programação e trabalho em equipe. As crianças participam de todas as etapas, desde a investigação sobre o tema até o desenvolvimento da solução e a apresentação. Ao longo do processo, elas assumem funções como pesquisadores, montadores e programadores, passando pelas diferentes atividades durante a temporada.\n‘Scansmile’ foi desenvolvido pela equipe Aruanda Cyber Kids\nArquivo Pessoal/Pryscila Oliveira\nEntre os projetos apresentados está o ‘Scansmile’, desenvolvido pela equipe Aruanda Cyber Kids, da Escola Municipal Aruanda, no bairro dos Bancários. A solução propõe um scanner 3D capaz de identificar padrões, formas e cores de artefatos arqueológicos e armazenar essas informações em uma nuvem digital.\nA ideia é evitar a perda de registros históricos e facilitar a preservação de informações sobre os objetos. O projeto também faz referência a três sítios arqueológicos brasileiros estudados pelos alunos: a Pedra do Ingá, na Paraíba; o Vale do Catimbau, em Pernambuco; e a Serra da Capivara, no Piauí.\nOutra solução foi desenvolvida pela equipe Lubotics, da Escola Municipal Lúcia Giovanna Duarte de Melo, no bairro de Gramame. Inspirados no funcionamento do radar de penetração no solo, os estudantes criaram um projeto que demonstra como a tecnologia pode auxiliar arqueólogos na localização de vestígios enterrados.\nA proposta busca mostrar como esses equipamentos podem ajudar na identificação de materiais sob o solo sem a necessidade de escavações, contribuindo para a preservação do patrimônio histórico. A preparação para o torneio também envolve o desenvolvimento de habilidades como cooperação, inclusão, criatividade e resolução de conflitos.\nNa competição, esses princípios fazem parte dos chamados 'Core Values' (Valores Fundamentais), que estimulam as equipes a aprenderem juntas e a respeitarem as diferentes habilidades de cada participante.\nAgora no g1\nMuito além da robótica \nPara a professora Pryscila Oliveira, coordenadora da equipe Aruanda Cyber Kids, da Escola Municipal Aruanda, um dos principais objetivos do torneio é garantir que todos os alunos tenham participação ativa na criação dos projetos.\n“É o desafio de toda sala de aula, que é fazer com que todos participem igualmente, fazer com que a habilidade pessoal de cada um se destaque, fazer com que cada um brilhe da sua forma”, explicou.\nSegundo ela, a metodologia permite que as crianças utilizem a tecnologia para buscar soluções para problemas reais. Na equipe, os estudantes dividiram as tarefas entre pesquisa, montagem e programação durante o desenvolvimento do ‘Scansmile’.\n“A robótica mais do que só fazer robôs é mudar a vida dos estudantes, principalmente da rede municipal. Ela transforma vidas, traz novas perspectivas, traz um novo olhar de vida”, afirmou Pryscila.\nPara o aluno Camilo Ayô, de 8 anos, participar da criação do ‘Scansmile’ também foi uma oportunidade de aprender a trabalhar em equipe. Ele conta que, apesar das dificuldades durante o processo, também houve espaço para diversão. “Foi muito divertido. Teve algumas partes que a gente brigou, mas resolvemos os conflitos com a conversa”, disse.\nNa equipe Lubotics, a professora Talita Mayara conta que os alunos também participaram de todas as etapas do desenvolvimento da solução, desde a pesquisa até a apresentação. Para ela, a experiência ajuda a despertar o interesse das crianças por áreas como ciência, matemática e tecnologia.\n“As crianças participaram de todas as etapas, fazendo pesquisas, construções e programação. Também fizeram os testes e prepararam a apresentação”, explicou.\nEntre os integrantes da equipe estão as gêmeas Rayssa e Rayanne, de 9 anos. Para Rayssa, o trabalho coletivo foi fundamental para transformar as ideias em um projeto. “A nossa ideia surgiu com a gente trabalhando em equipe e um escutando a ideia dos outros”, afirmou.\nRayanne destaca que a experiência também trouxe aprendizados que vão além da programação e da construção dos modelos. “Aprendi a trabalhar junto com as pessoas, aprendi muitas coisas legais, programar, a ter respeito, educação, muitas coisas”, disse.\nRobótica desde os primeiros anos\nAlém dos projetos desenvolvidos pelas equipes, a FIRST LEGO League Explore busca aproximar crianças do universo da ciência e da tecnologia desde os primeiros anos escolares. Para Alex Paiva, head do Educacional, a robótica funciona como uma ferramenta de aprendizagem ao combinar criatividade, raciocínio lógico e resolução de problemas.\n“Nessa faixa etária, a robótica atua como uma ponte entre o brincar e o aprender. No nível Explore, as crianças desenvolvem o pensamento computacional, o raciocínio lógico e a resolução de problemas de forma muito natural”, afirmou.\nA realização da etapa regional em João Pessoa também amplia o contato dos estudantes da região com uma competição internacional de robótica. Segundo Paiva, levar eventos desse tipo para diferentes localidades permite que mais alunos tenham acesso a experiências práticas de aprendizagem e desenvolvimento de projetos.\n“O Nordeste e a Paraíba têm demonstrado um potencial gigantesco, com escolas, gestores e famílias percebendo que a robótica vai muito além de montar peças: trata-se de preparar os alunos para o futuro”, afirmou.\nAlém da apresentação dos projetos, o evento terá uma programação aberta a familiares e visitantes, com atrações como ‘Just Dance’, videogames, brinquedos infláveis, pintura de rosto, pipoca e algodão-doce. As atividades foram preparadas pela organização para aproximar a comunidade escolar da experiência proporcionada pela robótica e pela tecnologia.\nVídeos mais assistidos do g1 Paraíba", "url": "https://g1.globo.com/pb/paraiba/noticia/2026/08/02/joao-pessoa-sedia-etapa-regional-de-torneio-mundial-de-robotica-com-alunos-de-6-a-10-anos.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-08-02T11:13:21+00:00", "origin": "feed", "image_url": "https://s2-g1.glbim // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
