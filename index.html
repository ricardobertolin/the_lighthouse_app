<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">

e_liner_en": "Created in 1910 and popularized by Monteiro Lobato, the tonic contained 9.5% ethanol and was widely used in Brazilian homes.", "one_liner_pt": "Criado em 1910 e popularizado por Monteiro Lobato, o tônico com 9,5% de etanol era presença quase onipresente nos lares brasileiros.", "category": "Culture", "region": "brazil", "rationale": "A nostalgic cultural story about a beloved Brazilian product with a surprising alcoholic ingredient, of broad national interest.", "low_signal": true}, {"title": "A adolescente que liderou uma das maiores revoltas no Brasil e ficou conhecida como 'Joana D'arc do Contestado'", "summary": "<img src=\"https://s2-g1.glbimg.com/EPji0awV75EoF77jXz_YZgVMjIg=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/I/W/koP3BYSBK39iPEwqtKmw/2.webp\" /><br />     Sem imagens oficiais, a figura de Maria Rosa foi sendo construída ao longo do tempo por meio de representações artísticas\nMuseu Willy Zumblick\nEm guerras, figuras femininas nem sempre são lembradas ou associadas à linha de frente dos conflitos. No Sul do Brasil, no início do século 20, uma adolescente rompeu esse padrão ao assumir um papel importante em uma das maiores revoltas camponesas do país.\nA Guerra do Contestado foi um conflito armado travado entre 1912 e 1916 em uma área cuja posse era disputada pelos estados do Paraná e de Santa Catarina — daí o nome \"Contestado\".\nEmbora tenha ficado conhecida pela disputa de limites, pesquisadores afirmam que essa foi apenas uma das dimensões de um conflito marcado por disputas por terra, pela expulsão de pequenos agricultores e posseiros da região e pelas transformações econômicas provocadas pela construção da ferrovia que ligaria São Paulo ao Rio Grande do Sul e pela exploração madeireira.\n\"Com a concessão de grandes áreas de terra a empresas estrangeiras para a construção da ferrovia, milhares de caboclos, como eram conhecidos os moradores do interior que viviam da pequena agricultura, perderam suas terras e, depois da conclusão das obras, também o trabalho\", explica Nilson Cesar Fraga, professor do departamento de Geografia da Universidade Estadual de Londrina (UEL) e coordenador do Observatório da Região e da Guerra do Contestado.\nAgora no g1\nNesse contexto, parte dessa população passou a se organizar em torno da liderança religiosa do monge José Maria, que defendia uma sociedade mais justa e inspirou comunidades conhecidas como \"redutos\". Após sua morte, em 1912, o movimento continuou mobilizado e passou a ser visto pelo governo da recém-instaurada República como uma ameaça à ordem.\nA resposta foi o envio de tropas do Exército para combater os redutos. Ao longo de quatro anos, ocorreram sucessivos confrontos entre militares e caboclos, que utilizavam táticas de guerrilha e o conhecimento da região para resistir. O conflito terminou em 1916, após uma campanha militar de grande escala, e deixou entre 10 mil e 20 mil mortos, embora pesquisadores acreditem que esse número possa ter sido maior.\nAlém de definir as atuais divisas entre Paraná e Santa Catarina, a Guerra do Contestado é considerada por especialistas um dos principais conflitos sociais da Primeira República por evidenciar disputas fundiárias, a atuação do Estado diante de populações rurais e os impactos da expansão econômica sobre comunidades que viviam na região.\nÉ nesse cenário que surge Maria Rosa, jovem que, ainda na adolescência, passou a liderar combatentes e a ocupar também um papel religioso dentro do movimento.\nConhecida como a \"Joana d'Arc do Sertão\", ela se tornou uma das figuras mais emblemáticas da guerra, mesmo sem registros fotográficos que confirmem sua aparência.\nNo reduto de Caraguatá, em Santa Catarina, onde ganhou projeção em 1914, Maria Rosa combinava práticas espirituais com funções estratégicas. Segundo Fraga, sua atuação extrapola o campo religioso.\n\"Ela não foi apenas uma figura religiosa, mas uma estrategista militar que liderou milhares de sertanejos contra as forças da República\", afirma. \nAinda de acordo com o pesquisador, a jovem, filha de um pequeno agricultor, tinha cerca de 15 anos e se destacou pela capacidade de mobilização em meio ao conflito.\nSem imagens oficiais, sua figura foi sendo construída ao longo do tempo por meio de representações artísticas, encenações e narrativas populares. Para Fraga, esse processo ajudou a consolidar Maria Rosa como símbolo de resistência. \n\"Ela rompeu com a passividade esperada das mulheres da época, demonstrando um espírito guerreiro, autoritário e decidido\", diz.\nLíder aos 15 anos de idade\nA liderança de Maria Rosa se consolidou em um momento de reorganização do movimento, após a morte do monge José Maria, figura relevante para os sertanejos. Em meio ao enfraquecimento de outras lideranças, a jovem passou a ocupar um espaço que combinava autoridade religiosa e comando prático dentro dos redutos.\nDe acordo com a historiadora Raquel Panke Bittencourt, professora da Escola de Educação e Humanidades e da Pós-Graduação em História Contemporânea e Relações Internacionais Pontifícia Universidade Católica do Paraná (PUCPR), Maria Rosa tinha cerca de 15 anos e era neta de uma liderança local, Eusébio Ferreira dos Santos. Sua ascensão, segundo ela, está diretamente ligada ao caráter religioso do conflito.\n\"A autoridade não vinha apenas da força física, mas da legitimidade espiritual. Se a divindade escolhia, o povo seguia\", afirma Bittencourt.\nFoi nesse contexto que a jovem passou a relatar visões e mensagens atribuídas ao monge morto, o que a colocou como intermediária entre o sagrado e a comunidade. \nPara os sertanejos, ela passou a ser vista como uma figura escolhida, capaz de orientar não só a vida religiosa, mas também os rumos do grupo em meio à guerra. A crença na ressurreição de José Maria ajudou a manter a coesão do movimento, agora sob sua liderança.\nNa prática, Maria Rosa articulava fé e combate como parte de uma mesma lógica. Presidia rituais, mantinha a moral dos sertanejos e, ao mesmo tempo, organizava a logística e dava ordens táticas. \nBittencourt afirma que ela se tornou \"o cérebro e a alma\" do reduto, enquanto Fraga destaca que suas decisões eram apresentadas como orientações divinas, o que garantia coesão e obediência entre os combatentes.\nEsse modelo de liderança também se apoiava no chamado \"transe messiânico\", descrito com vozes e visões, relatados na época. \nSegundo Fraga, ao afirmar que recebia instruções diretamente do espírito do monge, Maria Rosa eliminava questionamentos internos. Sob seu comando, o reduto funcionava simultaneamente como espaço religioso e estrutura militar, onde a disciplina era sustentada pela crença.\n'Joana d'Arc do Sertão'\nÚnica imagem do reduto ou cidade santa dos caboclos do Contestado Caraguatá, em 1914, em Santa Catarina\nNilson Cesar Fraga\nA associação entre a adolescente e a heroína francesa não surgiu por acaso. O apelido \"Joana d'Arc do Sertão\" passou a circular ainda durante e após o conflito como uma forma de traduzir, em referências conhecidas, a presença de uma jovem liderança feminina em meio à guerra.\nPara o professor Nilson Cesar Fraga, a comparação encontra respaldo biográficos e simbólicos reais. Assim como Joana d'Arc, Maria Rosa assumiu o comando ainda adolescente e baseava sua autoridade em experiências consideradas divinas. \n\"Ela afirmava receber instruções diretas do espírito do monge José Maria, o que legitimava suas decisões políticas e militares perante os fiéis\", afirma.\nA semelhança também aparece na forma de atuação. Fraga destaca que Maria Rosa não ocupava um papel simbólico. \n\"Ela montava a cavalo, portava estandartes e participava ativamente da organização estratégica, como na vitória em Caraguatá, rompendo com o papel tradicionalmente passivo das mulheres da época\". \nA ideia de pureza, associada à figura da \"virgem\", reforçava essa autoridade espiritual, entendida como um canal direto com o sagrado.\nA historiadora da PUCPR aponta que a analogia ajuda a dimensionar o impacto da jovem no conflito. \n\"Ambas eram jovens de origem camponesa e alegavam ter visões divinas para liderar exércitos contra forças superiores em defesa de seus territórios\", diz. Ao mesmo tempo, ela ressalta limites nessa comparação.\nSegundo Bittencourt, o uso da referência europeia pode simplificar uma experiência que tem raízes próprias. \n\"Há o risco de 'europeizar' uma figura profundamente enraizada no messianismo do caboclo brasileiro\", afirma. \nPara Fraga, esse enquadramento também foi adotado por cronistas e militares da época como forma de interpretar o fenômeno dentro de um repertório conhecido.\nAinda assim, a comparação persiste como chave de leitura para entender como Maria Rosa mobilizou seguidores em um contexto marcado por desigualdades e disputa territorial. \nAo combinar fé e estratégia, ela transformou a liderança religiosa em instrumento de organização e resistência, afirmam os especialistas.\nMulheres importantes na Guerra do Contestado\nA presença de Maria Rosa não foi um caso isolado dentro da Guerra do Contestado. Em diferentes momentos do conflito, outras mulheres também assumiram funções de comando nos redutos, combinando liderança espiritual, organização coletiva e atuação direta nas decisões do movimento.\nPara o historiador Marcelo Johny Maciel, mestre em Ciências Sociais pela PUC-SP, esse protagonismo feminino está ligado à própria estrutura do movimento. Segundo ele, os sertanejos mobilizaram elementos históricos, simbólicos e morais para sustentar a resistência, e as mulheres passaram a ocupar o centro dessa dinâmica. \n\"Foi preciso definir que as mulheres eram as únicas capazes de conduzir esse processo\", afirma Maciel, ao destacar que elas concentravam tanto a autoridade espiritual quanto a política e militar.\nNesse contexto, nomes como Chica Pelega, Nega Jacinta e Querubina, também ganharam relevância entre os sertanejos. Essas lideranças reforçavam a ideia de organização coletiva, em que não havia distinção rígida de hierarquia entre os integrantes do movimento. \nDe acordo com Maciel, esse período é visto como o ápice da resistência, quando interesses comuns se sobrepunham a disputas individuais e as decisões eram guiadas pela manutenção do grupo.\nAlém do papel simbólico, essas mulheres atuavam de forma prática na condução dos redutos. Realizavam rituais religiosos, orientavam a vida cotidiana e participavam de estratégias de defesa e ataque. \nMaciel afirma que, nesse arranjo, a liderança feminina reunia diferentes dimensões de poder, o que ajudava a manter a coesão dos combatentes em meio ao avanço das forças republicanas.\nApesar dessa atuação, o reconhecimento histórico dessas figuras foi limitado por décadas.\nFraga explica que nos registros militares da época, mulheres foram frequentemente tratadas como figuras \"anormais\" ou associadas ao fanatismo, o que contribuiu para deslegitimar sua atuação política. \n\"A liderança de uma adolescente era vista como prova de atraso\", diz.\nO professor aponta ainda que, ao longo do século 20, a narrativa oficial reduziu essas mulheres a papéis secundários ou as manteve apenas na \"memória falada\". \n\"Só mais recentemente pesquisas têm revisitado documentos e relatos para evidenciar que elas ocuparam posições de comando e influenciaram decisões no conflito\", diz. \nEsse resgate, segundo ele, ajuda a reposicionar o Contestado como um movimento com forte protagonismo feminino, muitas vezes apagado da história.\nLocal onde Maria Rosa viveu e morreu em 1915, ao final da guerra\nNilson Cesar Fraga\nA geógrafa Vanessa Maria Ludka, doutora pela Universidade Federal do Paraná, afirma que esse apagamento revela uma construção histórica marcada por recortes de gênero.\n\"A participação feminina foi, em grande medida, silenciada ou marginalizada nas narrativas oficiais\", diz. \nSegundo ela, a escassez de registros não reflete ausência de atuação, mas sim a forma como essas trajetórias foram pouco documentadas e, em muitos casos, invisibilizadas.\nEsse cenário também se relaciona à destruição de fontes documentais e à dependência de materiais baseados em relatos transmitidos ao longo do tempo, dizem os especialistas. \nMuitos documentos dos redutos foram eliminados durante as ações militares, o que fez com que histórias como a de Maria Rosa sobrevivessem, principalmente por relatos de sobreviventes. \nPara Fraga, esse conjunto de fatores contribuiu para que sua trajetória permanecesse pouco difundida, apesar de sua relevância no conflito.\nO destino da jovem líder também segue incerto. Há versões que indicam sua morte em combate, enquanto outras apontam para o chamado \"encantamento\", crença segundo a qual figuras espirituais não morrem, mas retornam ao mundo em momentos de necessidade.\nA hipótese mais aceita entre pesquisadores contemporâneos é que Maria Rosa morreu em 1915, durante uma ofensiva militar ao reduto de Santa Maria, na região conhecida como Santa Maria-Caçador Grande, área que atualmente integra o município de Lebon Régis, no Meio-Oeste de Santa Catarina.\nA conclusão se baseia em depoimentos e em décadas de pesquisa de campo no Contestado. De acordo com esses relatos, a jovem teria sido morta ao tentar atravessar um rio sob fogo das tropas, mesmo estando afastada do núcleo principal do reduto.\n\"Assim, a trajetória de Maria Rosa permanece pouco difundida porque ela representa o ponto de intersecção entre três grupos marginalizados pela história oficial brasileira: os pobres do campo, os vencidos em guerra e as mulheres\", diz o pesquisador.", "url": "https://g1.globo.com/sc/santa-catarina/noticia/2026/07/07/a-adolescente-que-liderou-uma-das-maiores-revoltas-no-brasil-e-ficou-conhecida-como-joana-d-arc-do-contestado.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-07T12:06:57+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/EPji0awV75EoF77jXz_YZgVMjIg=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/I/W/koP3BYSBK39iPEwqtKmw/2.webp", "url_hash": "f4be2ecbef4a9908c31238d9923a6ff9", "title_hash": "3eaf701a8db88f272b96099c86544c7b", "corroboration": 2, "relevance_score": 0.143, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5265, "headline_en": "The Teenage Girl Who Led a Major Brazilian Revolt and Became the 'Joan of Arc of Contestado'", "headline_pt": "A Adolescente que Liderou uma Grande Revolta Brasileira e Virou a 'Joana D'Arc do Contestado'", "one_liner_en": "Maria Rosa led rituals and tactical combat operations during one of Brazil's most significant historical uprisings.", "one_liner_pt": "Maria Rosa liderou rituais e operações táticas de combate em uma das maiores revoltas da história do Brasil.", "category": "Culture", "region": "brazil", "rationale": "A historical feature recovering a little-known female figure from a major Brazilian armed conflict, relevant to national identity.", "low_signal": true}, {"title": "Biotônico Fontoura: o remédio alcoólico popularizado por Monteiro Lobato que fez parte da infância brasileira no século 20", "summary": "<img src=\"https://s2-g1.glbimg.com/gINjazC-wUF0DOUjhANytIilRS0=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/v/N/c1GYwfTlWoep0dUzpXyA/embalagem-atual-do-biotonico-fontoura.jpeg\" /><br />     Embalagem atual do Biotônico Fontoura\nDivulgação/ Hypera Pharma\nHá 25 anos, o governo federal do Brasil proibiu que tônicos, fortificantes e estimuladores de apetite contivessem álcool em sua fórmula. A medida obrigou um dos mais tradicionais produtos brasileiros, o Biotônico Fontoura, a mudar sua fórmula.\nCriado em 1910, o popular fortificante que, ao longo do século passado se tornou quase onipresente nos lares do país, continha 9,5% de etanol em sua composição. Em média, essa é a graduação alcoólica de um vinho espumante. Uma cerveja comum no Brasil costuma ter a metade desse índice.\nMas a história do Biotônico Fontoura vai muito além dessa peculiaridade etílica. É uma trajetória centenária, que mescla elementos culturais, sabedoria popular e acompanhou, de certa forma, a evolução da saúde pública no Brasil.\nTudo começou em 1910, no interior paulista. Um farmacêutico chamado Cândido Fontoura Silveira (1885-1974) resolveu inventar uma fórmula para ajudar sua mulher, Elvira Siqueira de Castro, que tinha queixas constantes de fraqueza. Ele desenvolveu um produto com fosfatos, sais de ferro e vinho espanhol. Aparentemente, deu certo.\nAgora no g1\n\"A maioria dos medicamentos dessa época era manipulada de forma artesanal pelos farmacêuticos, chamados de boticários, nas suas próprias boticas ou em pequenos laboratórios\", contextualiza o farmacêutico Eder de Carvalho Pincinato, professor na Universidade Estadual de Campinas (Unicamp).\nEle conta que os profissionais moíam ervas e minerais, destilavam plantas e preparavam unguentos e fórmulas magistrais ou oficinais. Tudo com o \"intuito de acabar com os 'males' mais comuns da população\".\nAlém do Fontoura, também marcaram época produtos como o Elixir de Nogueira, que era feito à base de nogueira e outras plantas medicinais, a Emulsão Scott, feita a partir de óleo de fígado de bacalhau, a pomada Minâncora, que contém zinco e cânfora, entre outros.\nFrascos improvisados e sem rótulo\nSegundo informações da empresa farmacêutica Hypera Pharma, dona da marca desde 2007, Fontoura passou a comercializar o fortificante em seu estabelecimento e, aos poucos, médicos da região de Bragança Paulista começaram a prescrevê-lo a seus pacientes.\n\"Eram quase como garrafadas, derivados de plantas fitoterápicas em forma de elixires e tônicos, que representavam a indústria farmacêutica daquele período\", define o médico e nutrólogo José Roberto da Costa Pereira — detentor de mais de 30 patentes e com um histórico de participações no desenvolvimento de produtos farmacêuticos. \"O fato de depois ter sido direcionado às crianças, mesmo contendo álcool, ocorre porque, naquela época, não havia o entendimento atual. Acreditava-se que, em algumas situações, isso era benéfico e estimulava o apetite das crianças.\"\nAinda não havia rótulo nem nome para o preparado. Em 1916, Fontoura aproximou-se do escritor e fazendeiro Monteiro Lobato (1882-1948). Na época, ambos eram colaboradores do jornal O Estado de S. Paulo. O escritor teria se queixado ao farmacêutico de cansaço e fadiga. Este prontamente providenciou a ele o fortificante.\nFascinado com o resultado, Lobato passou a ser um entusiasta divulgador do produto. Teria sido dele a ideia do nome: Biotônico, o \"tônico da vida\", e Fontoura, sobrenome pelo qual o farmacêutico era conhecido.\nA essa altura, já havia autorização do Serviço Sanitário do Estado e o fortificante podia ser vendido em todas as praças paulistas. Segundo a Hypera Pharma, ainda reinava o improviso: os frascos não eram padronizados e os rótulos, desenhados à mão por um auxiliar da farmácia.\n\"Em uma das idas de Cândido Fontoura a São Paulo, levou um frasco e o desenho original dos rótulos à Litografia Ipiranga, pioneira na impressão gráfica em cores na América do Sul. Um mês depois, chegavam a Bragança os rótulos verdes litografados que foram a cara da marca por quase um século: uma trama de floreios em estilo art nouveau enlaçando o nome do produto e, embaixo, em letras maiúsculas, a descrição de suas propriedades\", relata a assessoria de imprensa da detentora da marca.\nA descrição funcionava quase como um slogan em si. Dizia assim: \"Regenera o sangue, tonifica os músculos, fortalece os nervos\".\nDesnutrição e verminoses\n\"Tornou-se um marco da indústria nacional\", pontua Pereira. \"Surgiu no início do século passado, quando a indústria era basicamente baseada em ervas e produtos fitoterápicos, com poucas drogas de síntese disponíveis. Naquela época, quase tudo eram tônicos e elixires.\"\nNesse sentido, entende-se Fontoura como um dos responsáveis pela transição das antigas boticas para uma indústria farmacêutica mais contemporânea.\nEra um contexto de muita desnutrição no Brasil. E uma falta de infraestrutura sanitária básica que fazia de boa parte da população vítima de verminoses que escancaravam sintomas de fraqueza. Lobato chegou a publicar no jornal que acreditava que quase 70% dos brasileiros sofressem com o chamado amarelão, nome popular da ancilostomose. Trata-se de uma verminose intestinal, causada por parasitas. A contaminação ocorre principalmente quando se anda descalço em solos contaminados e a doença causa anemia profunda e palidez.\n\"O Biotônico surgiu de uma necessidade real daquela época, em que verminoses e desnutrição eram muito comuns no Brasil\", afirma a educadora em saúde Cíntia Oliveira, especialista em nutrição funcional e autora do livro Diabetes em Remissão: A Revolução da Alimentação Consciente. \"O Biotônico Fontoura conta a história de um Brasil que lutava contra a escassez de tudo.\"\nCândido Fontoura desenvolveu também um vermicida, o Ankilostomina Fountoura. Era o combo: este eliminava a infecção e o Biotônico, em seguida, atuava para restaurar o vigor e o apetite.\nImagem publicitária do Biotônico Fontoura\nArquivo/ Hypera Pharma\nJeca Tatuzinho\nFoi quando ocorreu o casamento entre o medicamento de Fontoura e um personagem clássico da obra lobatiana: o Jeca Tatu, concebido em 1914 como um caipira preguiçoso.\n\"Embora de origens e carreiras distintas, ambos, Lobato e Fontoura, compartilhavam uma preocupação com as condições de saúde da população brasileira\", relata a farmacêutica detentora da marca.\nOriginalmente, o personagem Jeca Tatu era definido por Lobato como um \"funesto parasita da terra\", um \"homem baldio, inadaptável à civilização\". Em outras palavras, um vagabundo, a quem o escritor culpava pelo suposto atraso civilizatório do Brasil.\nAo mergulhar nas teses sanitaristas vigentes sobretudo nos anos 1920, Lobato passou a ver o que chamava de preguiça como na verdade o sinal de problemas de saúde. \"O Jeca Tatu não é assim, ele está assim\", passaria a afirmar o escritor.\nO Jeca Tatu não era \"naturalmente apático\". Estava, na  verdade, doente.\nEm 1924, Lobato criou uma nova versão do personagem, Jeca Tatuzinho. Era um caipira que se tratava, e ficava são. De quebra, ensinava noções de higiene e saneamento às crianças. \"Foi uma sacada genial a do Lobato\", aponta a educadora Oliveira.\nFontoura comprou os direitos do personagem e Jeca Tatuzinho passou a ser o garoto-propaganda do Biotônico. Na trama original, Jeca Tatuzinho é diagnosticado com ancilostomose por um médico e, claro, se recupera. Esta se tornaria uma das mais emblemáticas parcerias da publicidade brasileira.\n\"Foi uma ação pioneira de branded content muito antes desse conceito existir. A publicidade deixou de apenas anunciar um produto e passou a contar uma história de transformação, criando um vínculo emocional com o público\", analisa a comunicóloga Karine Karam, professora na Escola Superior de Propaganda e Marketing (ESPM).\nEntre 1926 e 1973 foram publicadas 35 edições do folheto Jeca Tatuzinho, com tiragens médias de 1 milhão de exemplares. Jeca Tatu se tornou conhecido em todo o Brasil. O Biotônico teve sua marca difundida maciçamente.\nOutro golpe certeiro de marketing da empresa foi a criação do Almanaque do Biotônico Fontoura — que acabou sendo chamado apenas de Almanaque Fontoura. Era uma revistinha com edições anuais, distribuição gratuita nas farmácias e conteúdo que ia de pequenos artigos educativos referentes à saúde a curiosidades, horóscopo, piadas, calendário de pesca, histórias em quadrinhos e anedotas variadas. A publicação também foi idealizada por Monteiro Lobato e contava com o personagem Jeca Tatuzinho.\nImagem publicitária do Biotônico Fontoura\nArquivo/ Hypera Pharma\n\"Era distribuído nas farmácias e, junto com ele, a marca também era divulgada. É interessante notar como isso já representava uma estratégia moderna de marketing de conteúdo\", diz o publicitário Fernando Lebbe, autor do livro Full Marketing. O especialista credita a esse tipo de esforço a consolidação do Biotônico no imaginário popular.\nAs tiragens eram gigantescas. No auge, em 1982, foram impressos 100 milhões de exemplares.\nO marketing da empresa sempre foi aguerrido e de forte apelo popular. O jingle \"bê a bá, bê é bé, bê i Bi… otônico Fontoura\", criado em 1978, virou aquilo que hoje chamamos de meme. Figuras muito conhecidas foram contratadas para publicidade do produto, seja em fotos de revistas, seja em reclames televisivos. Entre esses nomes, estão o futebolista Pelé (1940-2022), a apresentadora Xuxa e a dupla de cantores Sandy & Júnior.\n\"A propaganda foi a peça fundamental para garantir o sucesso do Biotônico Fontoura\", diz Pincinato.\nCom ovos de pata e leite condensado\nSegundo a detentora da marca, o Biotônico nasceu como um produto indicado para todas as idades, um fortificante para pessoas debilitadas em geral, e acabou se reposicionando cada vez mais para o público infantil, como suplemento nutricional.\nEssa conexão com a nutrição infantil e a relação de acessibilidade que foi sendo construída tornou o Biotônico também um ingrediente presente em preparos baseados na chamada sabedoria popular. Muitos se lembram de ter tomado, quando criança, sob argumento de era preciso um suplemento para ganhar peso, uma bomba calórica feita com a mistura de um frasco de Biotônico Fontoura, dois ovos de pata e uma lata de leite condensado. Praticamente um drinque de festa universitária, alguns podem alegar.\n\"Culturalmente, essas receitas revelam algo muito interessante: o Biotônico ultrapassou a condição de medicamento e passou a integrar práticas familiares e populares\", nota Karam.\n\"Do ponto de vista nutricional e medicamentoso, isso não faz muito sentido hoje\", diz o nutrólogo Pereira. \"Naquela época, porém, era comum, pois se dependia muito de produtos fitoterápicos, tônicos e elixires, era o que se tinha disponível e o que se acreditava funcionar.\"\n\"Popularmente, até faz sentido juntar um fortificante, que era para anemia, ao leite condensado, calórico, que vai dar energia. E os ovos são fonte de proteína\", comenta Oliveira. \"Mas o risco dessas receitas é muito grande. Há risco de contaminação por causa do ovo cru, por exemplo.\"\nA detentora da marca diz ver essas receitas populares com \"carinho e respeito\" entendendo que tais preparos caseiros \"fazem parte de um patrimônio afetivo que atravessou gerações de famílias brasileiras\".\n\"Esses relatos demonstram como o produto se incorporou não apenas à rotina de muitos lares, mas também à memória e ao imaginário popular do país, tornando-se parte de uma tradição que a marca reconhece com orgulho\", afirma a empresa.\nAo mesmo tempo, a companhia ressalta que \"a recomendação de uso atual segue estritamente o que consta no rótulo e a orientação de profissionais de saúde\" e que as \"combinações caseiras pertencem ao campo da memória e da tradição familiar de outras épocas, e não correspondem às orientações contemporâneas de uso do produto\".\nPincinato afirma que o produto é um suplemento de \"baixa dose de ferro elementar\". Ele explica que a concentração da substância na formulação era de menos de 0,16 miligramas por mililitro enquanto a orientação atual das diretrizes para o tratamento de anemia ferropriva em crianças é de 3 a 6 miligramas por dia. \"Podendo chegar até a 60 miligramas por dia\", esclarece.\nPara especialistas, o tônico não deve ser visto como uma panaceia. \"Entre outros alimentos, pode-se lembrar que a dieta tradicional brasileira, nosso maravilhoso feijão com arroz, disponibiliza níveis adequados de ferro, entre outros componentes essenciais para a formação das hemácias e hemoglobina, como ácido fólico e vitaminas B\", salienta a bióloga Inoara Rodrigues Siqueira, professora na Universidade Federal do Rio Grande do Sul.\n\"É importante destacar que o produto não atua nos mecanismos fisiológicos da fome e a ideia popular de uso como tônico para abrir o apetite, é derivada da propaganda da época dos almanaques, que informava que o álcool contido na fórmula abria o apetite, além de provocar uma 'sedação leve'\", pontua o farmacêutico Pincinato.\nMaterial de Monteiro Lobato que divulgava o tônico\nArquivo/ Hypera Pharma\n\"Não há evidências científicas de sua eficácia como estimulador do apetite\", crava a farmacêutica Rosane Gomez, coordenadora do da pós-graduação em Farmacologia e Terapêutica da Universidade Federal do Rio Grande do Sul (UFRGS). \"O único componente ativo com efeito comprovado é o sulfato ferroso, utilizado nos casos de anemia ferropriva, uma doença causada pela deficiência de ferro no organismo. Contudo, sua deficiência deve ser confirmada por exames laboratoriais, pois o excesso de ferro pode causar náuseas, vômito, hemorragias gástricas, entre outros.\"\nA professora ressalta que \"o Biotônico Fontoura foi lançado em uma época em que carências nutricionais, parasitoses e anemia eram comuns\". \"Ele provavelmente aliviava alguns sintomas com fadiga associada a quadros de anemia, porém não há evidências de que possa aumentar o apetite ou seja um estimulante\", completa ela.\n\"Do ponto de vista do consumo, o mais interessante é observar que, independentemente da discussão científica, gerações inteiras de brasileiros cresceram acreditando na eficácia do produto porque ele fazia parte de um ritual familiar muito presente\", comenta a comunicóloga Karam.\nSem álcool\nSobre a mudança da fórmula, ocorrida para atender à determinação da Agência Nacional de Vigilância Sanitária (Anvisa) há 25 anos, a Hypera Pharma esclarece que a retirada do álcool é uma das alterações ocorridas ao longo da história como parte de \"atualizações\" para \"acompanhar avanços científicos e mudanças regulatórias\".\nÀ época, o argumento da Anvisa era que expor crianças diariamente a uma dose de álcool poderia acarretar problemas de saúde e torná-las mais propensas a desenvolver alcoolismo na idade adulta.\nDe acordo com o farmacêutico Pincinato, ao contrário da crença popular de que o álcool agiria como estimulador do apetite, sua função era como solvente — uma solução famarcotécnica. \"Auxiliava na dissolução dos componentes da fórmula pouco solúveis em água, na conservação do produto e na melhora da palatabilidade e estabilidade do produto\", explica ele.\nO médico e nutrólogo Pereira discorda. \"Quando administrava uma colher pequena para a criança, o álcool provocava, inicialmente, uma irritação gástrica, gerando um certo desconforto que se traduzia em vontade de comer\", explica. \"Era como um aperitivo.\"\nSegundo ele, a eficiência do tônico também é atribuída a outros componentes que \"aumentam a secreção gástrica, induzindo a fome\".\n\"Com a mudança da fórmula, outros ingredientes foram ajustados: passaram a incluir canela, mirra e babosa, que possuem ações cicatrizantes e estimulantes gástricas, contribuindo para o aumento da secreção gástrica e, consequentemente, da fome, além de ajudarem na conservação\", diz Pereira. \"Naquela época, o consumo de álcool por crianças era mais comum, como água com vinho ou outras combinações. Era um reflexo cultural daquele período.\"\nA empresa exemplifica citando que em 2021, a fonte de ferro tradicional da composição também foi alterada: em vez de sulfato ferroso, agora é utilizado o bisglicitano ferroso. Segundo a farmacêutica, o ingrediente atual favorece a absorção no organismo do paciente.\nOutra novidade recente são os sabores. Desde 2017, além da versão original, há Biotônico Fontoura com gostinho de uva ou de morango.", "url": "https://g1.globo.com/saude/noticia/2026/07/07/biotonico-fontoura-o-remedio-alcoolico-popularizado-por-monteiro-lobato-que-fez-parte-da-infancia-brasileira-no-seculo-20.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-07T11:33:15+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/gINjazC-wUF0DOUjhANytIilRS0=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal da TV Bahia", "one_liner_en": "Routine daily TV news broadcast from TV Bahia with no specific story described.", "one_liner_pt": "Transmissão rotineira do telejornal diário da TV Bahia sem conteúdo específico descrito.", "category": "Other", "region": "brazil", "rationale": "No substantive news content provided; generic broadcast listing.", "low_signal": true}, {"title": "Última novela de Benedito Ruy Barbosa foi gravada na Bahia e teve Rio São Francisco como protagonista", "summary": "Morre o dramaturgo e escritor Benedito Ruy Barbosa, aos 95 anos\nA última novela escrita pelo dramaturgo e escritor Benedito Ruy Barbosa foi gravada em cidades da Bahia e teve o Rio São Francisco como um dos principais protagonistas da trama. O autor morreu nesta terça-feira (7), em São Paulo, após complicações provocadas por insuficiência renal crônica.\nExibida em 2016 pela TV Globo, \"Velho Chico\" foi ambientada na fictícia cidade de Grotas do São Francisco, no sertão nordestino, e acompanhou o embate entre duas famílias marcadas pela disputa por terra, poder e pelo controle das águas do rio.\nA produção mobilizou uma equipe de cerca de 120 pessoas e gravou aproximadamente 500 cenas em diferentes localidades do Nordeste. Na Bahia, as filmagens aconteceram nos municípios de São Francisco do Conde e Cachoeira, além da região do Raso da Catarina. \n📲 Clique aqui e entre no grupo do WhatsApp do g1 Bahia\nTambém serviram de cenário Baraúna, no Rio Grande do Norte, e os povoados Caboclo e Olho d'Água do Casado, em Alagoas.\nAlém dos conflitos familiares e políticos, a novela destacou a relação dos moradores do sertão com o Rio São Francisco, tratado como elemento central da narrativa e símbolo de vida, identidade e resistência.\nA trama foi protagonizada por Rodrigo Santoro, que interpretou Afrânio na primeira fase, e por Antônio Fagundes, responsável por dar vida ao personagem na fase adulta. O romance central acompanhou a história de Camila Pitanga, no papel de Tereza, e Domingos Montagner, que interpretou Santo. \nO elenco também reuniu nomes como Lucy Alves (Luzia), Selma Egrei (Encarnação), Christiane Torloni (Iolanda), Marcos Palmeira (Cícero), Irandhir Santos (Martim) e Fábio Assunção (Carlos Eduardo).\nBenedito Ruy Barbosa deixa um dos maiores legados da teledramaturgia brasileira. Ao longo da carreira, escreveu novelas que se tornaram clássicos da televisão, como \"Meu Pedacinho de Chão\" (1971), \"Pantanal\" (1990), \"O Rei do Gado\" (1996) e \"Terra Nostra\" (1999). \nEm suas obras, costumava retratar o Brasil rural e personagens movidos por valores como honestidade, perseverança e justiça.\nO corpo do dramaturgo será velado nesta terça-feira, das 15h às 21h, no Funeral Home, na Bela Vista, no Centro de São Paulo. A cerimônia será aberta ao público entre as 15h e as 16h.\nReportagem em atualização", "url": "https://g1.globo.com/ba/bahia/noticia/2026/07/07/ultima-novela-de-benedito-ruy-barbosa-foi-gravada-na-bahia-e-teve-rio-sao-francisco-como-protagonista.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-07T12:37:57+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/BUL2oY0I4ajUsBpq4_dNfE5sq70=/1700x0/filters:format(jpeg)/http://s.glbimg.com/jo/g1/f/original/2016/09/15/montagner5.jpg", "url_hash": "ecbe8dc929f8c89dd46c7f33d41fe1af", "title_hash": "9b5ea470f9d351b874da8bf64a1b3a8f", "corroboration": 1, "relevance_score": 0.2394, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3747, "headline_en": "Benedito Ruy Barbosa's Last Soap Opera Was Filmed Along the São Francisco River in Bahia", "headline_pt": "Última Novela de Benedito Ruy Barbosa foi Gravada às Margens do Rio São Francisco na Bahia", "one_liner_en": "The dramatist, who died aged 95, wrote 'Velho Chico' in 2016, filmed along the São Francisco River in Bahia.", "one_liner_pt": "O dramaturgo, que morreu aos 95 anos, escreveu 'Velho Chico' em 2016, gravada às margens do Rio São Francisco na Bahia.", "category": "Culture", "region": "brazil", "rationale": "Adds specific detail about Benedito Ruy Barbosa's final work, complementing the obituary story from index 12.", "low_signal": false}, {"title": "British Space Startup Launches Longevity Lab Into Orbit", "summary": "The lab will beam back data to train AI models to predict how proteins behind age-related diseases like Alzheimer’s and certain cancers behave.", "url": "https://www.wired.com/story/british-space-startup-launches-longevity-lab-into-orbit/", "source_domain": "wired.com", "published_at": "2026-07-07T09:57:12+00:00", "origin": "feed", "image_url": "https://media.wired.com/photos/6a4bec4884127a1d3953c8af/master/pass/Precision_assembly%20(credit_%20Tumbleweed%20Microgravity).png", "url_hash": "f20ff2fa98c802f81ca3d9511728dbff", "title_hash": "9430417340dbda528d9d9f41704baba0", "corroboration": 1, "relevance_score": 0.2372, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3736, "headline_en": "British Startup Launches Space Lab to Train AI on Age-Related Disease Proteins", "headline_pt": "Startup Britânica Lança Laboratório Espacial para Treinar IA em Proteínas de Doenças do Envelhecimento", "one_liner_en": "A British space startup has sent a longevity lab into orbit to generate data for AI models studying Alzheimer's and cancer proteins.", "one_liner_pt": "Uma startup espacial britânica lançou um laboratório de longevidade em órbita para gerar dados para modelos de IA que estudam proteínas do Alzheimer e do câncer.", "category": "Science", "region": "world", "rationale": "Combining space technology and AI to tackle age-related diseases represents a cutting-edge convergence of multiple frontier fields.", "low_signal": false}, {"title": "Governo vê riscos de manipulação emocional e coleta de dados em brinquedos com IA vendidos no Brasil", "summary": "<img src=\"https://s2-g1.glbimg.com/816AieWY4gnnKdIi6-xo9h7koSY=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/u/W/a70Zr6RgSgLu4hImLjQw/fotojet-2-.jpg\" /><br />     Governo vê riscos de manipulação emocional e coleta de dados em brinquedos com IA vendidos no Brasil\nReprodução\nBrinquedos com inteligência artificial vendidos no Brasil podem representar riscos para crianças, como manipulação emocional e coleta de dados pessoais, segundo uma nota técnica publicada neste mês pela Secretaria Nacional de Direitos Digitais (Sedigi), do Ministério da Justiça e Segurança Pública (MJSP).\nO estudo, que contou com a participação de pesquisadores da Universidade Federal Rural de Pernambuco (UFRPE), afirma que esses produtos podem estar em desacordo com regras previstas no ECA Digital e recomenda que as irregularidades sejam apuradas pelos órgãos responsáveis. \n🗒️ Tem alguma sugestão de reportagem? Mande para o g1\nO Sedigi pede que a Secretaria Nacional do Consumidor (Senacon) e a Autoridade Nacional de Proteção de Dados (ANPD) fiscalizem, entre outros pontos, se fabricantes e lojas informam corretamente os riscos desses produtos e como é feito o tratamento dos dados pessoais coletados pelos brinquedos.\nPara elaborar o estudo, a Sedigi analisou seis dispositivos vendidos no Brasil por meio de marketplaces como Amazon, Mercado Livre, Shopee, AliExpress, Magazine Luiza, eBay e Casas Bahia. Os aparelhos são:\nLoona (pet robótico);\nEMO (robô de companhia);\nMiko 3 (robô educativo);\nAibi (pet robótico de bolso);\nAmazon Fire HD Kid Pro (tablet voltado a crianças de 6 a 12 anos);\ne Vector (robô autônomo).\nAgora no g1\nManipulação emocional e coleta de dados\nSegundo a nota técnica, esses dispositivos costumam ter câmeras, microfones e outros sensores capazes de captar informações como biometria facial, voz e até características do ambiente doméstico. \nAo mesmo tempo, usam IA para manter conversas, simular emoções e adaptar suas respostas ao comportamento da criança, coletando dados continuamente durante a interação. \nO documento afirma que esse tipo de vínculo pode favorecer a manipulação emocional e incentivar o uso excessivo dos brinquedos. \n\"Os vínculos estabelecidos com a criança, além de facilitar a manipulação emocional, podem incentivar o uso excessivo do brinquedo e potencialmente expor informações sensíveis a terceiros, sobretudo se houver falhas de segurança\", diz a nota.\nEMO é um robô infantil com IA que é vendido por R$ 3.084,23 no Brasil.\nReprodução/Amazon\nA nota também cita como exemplo casos internacionais considerados preocupantes. Um deles é o da boneca My Friend Cayla, proibida na Alemanha após autoridades concluírem que ela podia gravar conversas acessadas por terceiros, levando o brinquedo a ser apelidado de \"instrumento de espionagem\". \nO documento também menciona casos de vazamento de áudios de crianças envolvendo o robô Miko 3.\nUm dos aparelhos analisados pelo MJSP é o brinquedo Loona, um pet robótico que simula um animal de estimação. O brinquedo utiliza processamento de linguagem natural para entender comandos de voz, é integrado ao ChatGPT, conta com sensores para mapear a casa e usa uma câmera para reconhecer os usuários.\nEm relação às plataformas de comércio eletrônico, o Ministério da Justiça afirma que elas também têm responsabilidade sobre a venda desses produtos. \nSegundo a pasta, os sites devem informar de forma clara que o brinquedo utiliza IA e garantir que as embalagens e páginas de venda tragam avisos sobre o acesso à internet, os riscos à privacidade e a necessidade de supervisão parental.\n\"Os fatos relatados apontam para indícios de possíveis irregularidades, de caráter sistêmico, com potencial de afetar direitos fundamentais de crianças e adolescentes, o que recomenda apuração formal\", conclui a nota. \nWhatsApp ganha nomes de usuário e vai dispensar número para começar conversa\nHomem processa OpenAI e diz que ChatGPT reforçou delírio de que era Jesus Cristo", "url": "https://g1.globo.com/tecnologia/noticia/2026/07/07/governo-ve-riscos-de-manipulacao-emocional-e-coleta-de-dados-em-brinquedos-com-ia-vendidos- // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
        '<div class="art-actions">' +
          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
