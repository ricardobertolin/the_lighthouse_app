<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}
/* Reading-history export — feeds `python -m digest --ingest-clicks` */
.reading-log{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:16px;
}
.reading-log button{
  font:inherit;letter-spacing:1px;text-transform:uppercase;
  background:none;border:1px solid var(--m3);color:var(--m3);
  padding:3px 9px;margin-left:8px;cursor:pointer;
}
.reading-log button:hover{ background:var(--ink);color:var(--paper);border-color:var(--ink); }
.reading-log[hidden]{ display:none; }

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

</svg>

<div class="sheet">

  <div class="mast-vol">

commendations beyond the mainstream releases.", "low_signal": true}, {"title": "O ataque “virulento, irresponsável e canalha” de Moraes contra Mendonça", "summary": "<img src=\"https://media.gazetadopovo.com.br/2026/09/04172037/NOVO-MODELO-062026-DUPLICAR-10-1-960x540.jpg\" /><br />Neste comentário, o presidente da <strong>Gazeta do Povo<\/strong>, Guilherme Cunha Pereira, analisa os desdobramentos do confronto entre Moraes e Mendonça e questiona os critérios adotados na condução das investigações. Também aborda as acusações envolvendo Moraes e os impactos da crise sobre o equilíbrio entre os Poderes, além do papel de Edson Fachin, dos demais ministros do STF e do Senado diante do conflito. Para Guilherme, o caso ultrapassa disputas políticas e envolve questões fundamentais como o respeito à Constituição, o equilíbrio entre os Poderes e o futuro das instituições brasileiras. Diante desse cenário, cobra dos ministros do Supremo e dos senadores uma resposta institucional diante de um episódio que, em sua avaliação, ameaça a normalidade democrática.", "url": "https://www.gazetadopovo.com.br/opiniao/editoriais/o-ataque-virulento-irresponsavel-e-canalha-de-moraes-contra-mendonca/", "source_domain": "gazetadopovo.com.br", "published_at": "2026-09-04T20:21:52+00:00", "origin": "feed", "image_url": "https://media.gazetadopovo.com.br/2026/09/04172037/NOVO-MODELO-062026-DUPLICAR-10-1-960x540.jpg", "url_hash": "f173ba171397447e3a34c2066cfae2c1", "title_hash": "2f00f657e93b0666ae1ecd176f86d38f", "corroboration": 2, "relevance_score": 2.3574, "reputation_score": 0.85, "corroboration_score": 0.5, "final_score": 0.6147, "headline_en": "Gazeta publisher blasts Moraes's attack on Mendonça", "headline_pt": "O ataque \"virulento, irresponsável e canalha\" de Moraes contra Mendonça", "one_liner_en": "Gazeta do Povo's president criticizes Moraes's conduct in the clash with Mendonça and questions investigative criteria.", "one_liner_pt": "O presidente da Gazeta do Povo critica a conduta de Moraes no embate com Mendonça e questiona critérios das investigações.", "category": "Brazil", "region": "brazil", "rationale": "Opinion piece on an escalating public conflict between two Supreme Court justices.", "low_signal": true}, {"title": "Relatório aponta devastação da Mata Atlântica e expõe falhas na fiscalização no Paraná", "summary": "<img src=\"https://media.gazetadopovo.com.br/2026/09/02191918/madeira-parana-1-960x540.jpg\" /><br />Polícia Científica revela extração irregular na Mata Atlântica no Paraná em área envolvida em disputa judicial. Leia na Gazeta do Povo.", "url": "https://www.gazetadopovo.com.br/parana/relatorio-aponta-devastacao-da-mata-atlantica-parana/", "source_domain": "gazetadopovo.com.br", "published_at": "2026-09-04T14:23:42+00:00", "origin": "feed", "image_url": "https://media.gazetadopovo.com.br/2026/09/02191918/madeira-parana-1-960x540.jpg", "url_hash": "08ce21cfeea080a1103a21cbf5b61fec", "title_hash": "2678cf541a5ed1d4346eddf8321cafe7", "corroboration": 2, "relevance_score": 2.32, "reputation_score": 0.85, "corroboration_score": 0.5, "final_score": 0.612, "headline_en": "Report exposes Atlantic Forest destruction and weak oversight in Paraná", "headline_pt": "Relatório aponta devastação da Mata Atlântica e falhas na fiscalização no Paraná", "one_liner_en": "Forensic police documented illegal logging in Paraná's Atlantic Forest, in an area tied up in a court dispute.", "one_liner_pt": "A Polícia Científica documentou extração ilegal de madeira na Mata Atlântica paranaense, em área sob disputa judicial.", "category": "Climate", "region": "curitiba", "rationale": "Evidence of illegal logging and enforcement failures in one of Brazil's most threatened biomes.", "low_signal": false}, {"title": "Anthropic’s $2 trillion IPO puts powerful external trustees in spotlight", "summary": "Public-market scrutiny will intensify pressure on the Claude maker’s unusual attempt to balance profit and purpose.", "url": "https://arstechnica.com/ai/2026/09/anthropics-2-trillion-ipo-puts-powerful-external-trustees-in-spotlight/", "source_domain": "arstechnica.com", "published_at": "2026-09-04T16:22:18+00:00", "origin": "feed", "image_url": "https://cdn.arstechnica.net/wp-content/uploads/2026/08/GettyImages-2285051730-500x500.jpg", "url_hash": "1b8415738489174edd0e800b326f9843", "title_hash": "fda61ca6ba87dffae8fb3aca50ef0248", "corroboration": 1, "relevance_score": 3.7026, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.6118, "headline_en": "Anthropic's $2 trillion IPO spotlights its external trustees", "headline_pt": "IPO de US$ 2 trilhões da Anthropic coloca curadores externos em destaque", "one_liner_en": "Going public will test Anthropic's unusual governance structure balancing shareholder profit against its stated safety mission.", "one_liner_pt": "A abertura de capital testará a governança incomum da Anthropic, que tenta equilibrar lucro e missão de segurança.", "category": "AI", "region": "world", "rationale": "A record-scale AI listing raises fundamental questions about whether safety governance survives public markets.", "low_signal": false}, {"title": "Temporada testa limite ambiental em SP diante das mudanças climáticas; entenda", "summary": "<img src=\"https://s2-g1.glbimg.com/Jc4RZcn7HggDxCUGYHlFosBWqHc=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2025/O/z/sT4BgRTlakx26c2jYxNg/g1-30-.jpg\" /><br />     Alta temporada testa limites ambientais da Baixada Santista diante das mudanças climáticas\nReceber mais turistas na alta temporada movimenta hotéis, restaurantes e o comércio, mas também coloca à prova estruturas dimensionadas para uma população menor. No litoral de São Paulo, esse aumento coincide com um período marcado por ondas de calor, chuvas intensas e ressacas.\nNo início de 2026, cidades da região enfrentaram problemas no abastecimento de água após uma combinação de estiagem, aumento de moradores durante o Réveillon e temporais que afetaram as estruturas de captação e tratamento. \nMeses depois, em julho e agosto, rajadas superiores a 100 km/h interromperam temporariamente as operações no Porto de Santos e as travessias de balsas, provocando ocorrências em diferentes municípios.\n✅Clique aqui para seguir o canal do g1 Santos no WhatsApp.\nPara o pesquisador e professor Ronaldo Christofoletti, do Instituto do Mar da Unifesp, a relação precisa ser observada nos dois sentidos. O turismo amplia a pressão sobre os recursos e a infraestrutura, enquanto as mudanças climáticas podem modificar as próprias condições que ajudaram a consolidar a região como destino turístico.\n\"O nosso turismo, da forma como se consolidou, baseou-se no clima das últimas décadas. No entanto, o clima mudou \", afirmou Ronaldo ao g1.\nCentro de Santos teve estruturas destruídas após a ventania.\nReprodução e Matheus Croce/TV Tribuna\nAlta temporada e a pressão estrutural\nA importância econômica desse movimento reflete-se nos números do setor. Segundo o Sindicato de Hotéis, Restaurantes, Bares e Similares da Baixada Santista e Vale do Ribeira (Sinhores), a movimentação cresce, em média, cerca de 40% ao longo do ano. \nEm feriados prolongados e na alta temporada, o aumento pode variar entre 70% e 80%, com a ocupação hoteleira próxima de 100% nas festas de dezembro.\nAo g1,  o secretário de Fomento Turístico do Sinhores, Kauê Lima, destacou que o fluxo beneficia a rede de serviços e contribui significativamente para o aquecimento da economia local.\nVeículos seguem em direção à Baixada Santista.\nLuigi Bongiovanni/AT\nO impacto, contudo, acaba se refletindo no consumo de água. A Sabesp informou a reportagem que a demanda cresce, em média, 30% no verão, principalmente entre o Natal e o Ano Novo. Na última temporada, o litoral paulista recebeu cerca de 30% mais pessoas nas festas em comparação com a média da década anterior.\nOs maiores acréscimos médios de consumo registrados nos últimos anos foram:\nItanhaém - 51%\nMongaguá - 48%\nPeruíbe - 46%\nBertioga - 35%\nPraia Grande - 31%\nGuarujá - 31%\nMoradores reclamam da falta d'água na Baixada Santista\nPara lidar com os picos, a concessionária reforçou em 40% as equipes de plantão no último período de festas e utilizou dezenas de caminhões-pipa em áreas mais críticas. \nEntre 29 de dezembro de 2025 e 3 de janeiro de 2026, foram entregues mais de 12 milhões de litros de água por esse sistema. A companhia também afirma ter investido R$ 2,4 bilhões na região desde julho de 2024 e prevê outros R$ 8,1 bilhões entre 2026 e 2029.\nA empresa de saneamento explicou que temperaturas elevadas, estiagens e chuvas irregulares também interferem na operação. Em 2025, os baixos índices pluviométricos reduziram a vazão dos rios, enquanto temporais levaram lama, terra e detritos aos pontos de captação, comprometendo temporariamente o tratamento.\nO saneamento básico é outro gargalo. Mais pessoas significam maior produção de esgoto e, quando a infraestrutura não acompanha os picos de demanda, aumentam os riscos de impactos sobre rios, canais e praias. \nImagens da captação de água no rio Mambú, da estação de tratamento de água (ETA) Mambú/Branco\nDivulgação/Sabesp\nEventos extremos colocam o turismo à prova\nUma ocorrência que já representa um desafio para os moradores ganha outra dimensão quando a cidade recebe uma população muito maior que a habitual.\n\"Lidar com isso em uma cidade de 600 mil habitantes é uma coisa; com 2 milhões de pessoas, é outra\", exemplificou Ronaldo.\nAs ondas de calor afetam diretamente a experiência dos turistas, aumentando o desgaste físico e o desconforto. A combinação entre temperaturas extremas e aglomerações também pode ampliar riscos sanitários. “Teremos cada vez mais surtos de viroses e infecções bacterianas”, disse o pesquisador.\nChuvas intensas, por sua vez, comprometem deslocamentos, provocam alagamentos e ampliam a exposição a situações de risco. Para quem não conhece a geografia local, identificar áreas vulneráveis e saber como agir diante de uma emergência torna-se ainda mais difícil.\nTemporal deixa diversas áreas alagadas em cidades da Baixada Santista\nO setor turístico, por outro lado, não vê hoje um cenário de perda da atratividade regional. Kauê Lima acrescentou que a proximidade com a capital, a diversidade de atrativos e a estrutura de serviços sustentam a atividade ao longo do ano.\n\"Na avaliação do setor, embora as condições climáticas exijam atenção e planejamento, a tendência é que eventuais impactos sejam temporários, sem comprometer a atratividade da região no médio e longo prazo\" avaliou o representante do Sinhores.\nA preocupação do pesquisador da Unifesp, contudo, aponta para outro horizonte. Erosão, ressacas e alterações ambientais podem modificar as praias, criando impactos diretos sobre negócios que dependem desses espaços.\n\"Se uma orla sofre forte erosão devido às ressacas e à elevação do nível do mar, ela pode receber menos visitantes. O que acontece com a economia local, os barraqueiros, os ambulantes, as pousadas e os restaurantes que dependem diretamente daquela faixa de areia? \", questionou.\nErosão nas praias de São Vicente preocupam autoridades\nCarlos Abelha/TV Tribuna\nAmbientes costeiros sob pressão\nSegundo o biólogo marinho Jorge Luis dos Santos, o alerta não se restringe à faixa de areia. O pesquisador explicou ao g1 que o aumento sazonal do público agrava problemas que já ocorrem no restante do ano, principalmente relacionados ao lixo e ao esgoto.\nDurante a alta temporada, a quantidade de resíduos pode superar a capacidade de recolhimento das prefeituras. O material acaba acumulado em espaços públicos e chega aos rios e ao oceano, afetando a vida marinha. O despejo irregular de esgoto também piora com o contingente extra.\n\"A poluição por esgoto somada ao lixo é, sem dúvida, o maior problema ambiental relacionado ao turismo em massa \", cravou o especialista.\nRio dos Bugres, na região estuarina entre Santos (SP) e São Vicente (SP)\nWilliam Rodriguez Schepis\nPraias arenosas, costões rochosos, restingas e manguezais estão entre os ambientes mais sensíveis. Além da poluição, esses locais sofrem com a circulação de embarcações turísticas, especialmente nas áreas próximas aos manguezais. A conservação desses espaços também ajuda a proteger o litoral, já que manguezais e dunas funcionam como barreiras naturais contra o avanço das águas oceânicas.\n🚤 O movimento das embarcações gera ondas que desgastam as margens, derrubam árvores de mangue e podem destruir ninhos marinhos. Âncoras, motores e vazamentos de óleo também danificam os costões e afetam a fauna local\nA balneabilidade da água do mar também é impactada pela combinação de fatores. A Cetesb explicou que o principal indicador medido é a presença de enterococos (bactérias que apontam contaminação fecal). A proliferação desses microrganismos pode estar ligada a extravasamentos, ligações irregulares e ao transporte de poluentes pelas chuvas.\nNa Baixada Santista, áreas próximas a rios, estuários e manguezais são mais sensíveis porque recebem diretamente a influência das bacias de drenagem. Em períodos de chuva intensa, a drenagem urbana e os cursos d’água podem carregar poluentes para o mar, pressionando ainda mais a qualidade das praias.\nSantos sofre pressões relacionadas à urbanização, às atividades portuárias e industriais e à perda de áreas de manguezal\nMarcelo Justo/Acervo A Tribuna\nAções e planejamento\nA Secretaria de Meio Ambiente, Infraestrutura e Logística (Semil) informou ao g1 que as projeções para São Paulo indicam elevação da temperatura, maior duração de ondas de calor e possível intensificação de chuvas extremas, com potenciais reflexos em inundações, deslizamentos e erosão. \nNa Baixada Santista, os estudos apontam a região entre as áreas que podem ser mais afetadas por eventos climáticos extremos e processos erosivos. A Semil ressalta que, embora os estudos não façam projeções específicas para o turismo nem avaliem a elevação do nível do mar, os efeitos previstos ameaçam a infraestrutura, os ecossistemas e as atividades econômicas locais.\nEstrutura de loja desaba sobre grupo de pessoas durante ventania em Santos\nUma das respostas do poder público está no controle da visitação. Segundo o órgão ambiental, as Unidades de Conservação estaduais da Baixada Santista recebem de 300 mil a 500 mil pessoas por ano, com até 70% desse público concentrado entre dezembro e março. Para evitar que o fluxo ultrapasse a capacidade de suporte da natureza, a Fundação Florestal desenvolve estudos incorporados aos Planos de Manejo.\nEsses documentos estabelecem limites de acesso a atrativos ecológicos (trilhas, cachoeiras e mirantes) e consideram impactos que vão desde a compactação do solo e a poluição de rios até o afugentamento da fauna. Os Planos de Manejo também definem zonas de uso, separando as faixas de ecoturismo regulado daquelas de proteção integral.\nO planejamento abrange, ainda, situações de risco. O órgão estadual mantém sinalização em áreas vulneráveis e protocolos para a retirada de visitantes diante de mudanças bruscas no tempo. Além disso, as trilhas recebem estruturas de baixo impacto (como deques e passarelas) que reduzem o pisoteio direto, preservam a vegetação e contêm a degradação do terreno.\nVisitante desce a tirolesa Voo da Serra, no parque Caminhos do Mar. Atração corta a Mata Atlântica com vista para a Baixada Santista\nFábio Tito/g1\nPor meio do programa Monitora Bio SP, a fauna e a flora são acompanhadas com \"armadilhas fotográficas\" e amostragens de campo. Simultaneamente, moradores de comunidades tradicionais são capacitados como guias para atuar no entorno das áreas protegidas e auxiliar na organização turística.\nA Semil destaca que as ações de planejamento territorial, conservação, monitoramento ambiental e gestão das Unidades de Conservação são desenvolvidas de forma permanente, com o objetivo de conciliar a proteção dos recursos naturais com o uso público ordenado dos espaços protegidos.", "url": "https://g1.globo.com/sp/santos-regiao/noticia/2026/09/05/temporada-testa-limite-ambiental-em-sp-diante-das-mudancas-climaticas-entenda.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-09-05T09:15:23+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/Jc4RZcn7HggDxCUGYHlFosBWqHc=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2025/O/z/sT4BgRTlakx26c2jYxNg/g1-30-.jpg", "url_hash": "f6b9209f943c72eaa791300c4b2b447d", "title_hash": "5345e801b1f89a4f59c1dc04823e719a", "corroboration": 1, "relevance_score": 3.6702, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.6094, "headline_en": "Summer crowds test Baixada Santista's environmental limits", "headline_pt": "Temporada testa limite ambiental da Baixada Santista diante do clima", "one_liner_en": "Peak tourist season boosts São Paulo coastal business but strains sanitation and ecosystems amid climate change.", "one_liner_pt": "A alta temporada aquece o comércio no litoral paulista, mas pressiona saneamento e ecossistemas em meio às mudanças climáticas.", "category": "Climate", "region": "brazil", "rationale": "Coastal tourism pressure plus climate change is a recurring summer stress test for Brazilian beach cities.", "low_signal": false}, {"title": "Homem morre após ameaçar policiais com machado em Curitiba", "summary": "Homem em surto psicótico morreu após ameaçar policiais com um machado e avançar contra as equipes da polícia em Curitiba. Leia na Tribuna do Paraná.", "url": "https://www.tribunapr.com.br/noticias/curitiba-regiao/homem-em-surto-psicotico-morre-apos-ameacar-policiais-com-machado-em-curitiba/", "source_domain": "tribunapr.com.br", "published_at": "2026-09-04T13:15:46Z", "origin": "search", "image_url": "https://www.tribunapr.com.br/wp-content/uploads/2026/09/04101039/CAPA-ATUALIZADA-30.png", "url_hash": "6e62af9595f51e18c4a4c825bd6e11d0", "title_hash": "3b4ed1cdd14d5965a05cfd1d0f8702d2", "corroboration": 2, " function t(key) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS['en'][key] || key; }

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
// The scene and the headline label come from the *current* observation when we
// have one. The daily weathercode is the most severe condition anywhere in the
// 24h window, so using it alone made a calm drizzly morning render as a
// thunderstorm. The hi/lo/wind stats stay on the daily outlook.
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.current_code != null ? w.current_code
               : (w.wmo_code != null ? w.wmo_code : 3);
  const precip = w.current_code != null ? (w.precip_now_mm || 0)
                                        : (w.precipitation_mm || 0);
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// The page is a static file generated once a day, so the baked forecast goes
// stale within hours. Open-Meteo is keyless and CORS-enabled, so refresh the
// card straight from the browser. On any failure we silently keep the baked
// values.
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=-25.4297&longitude=-49.2711&current=temperature_2m%2Capparent_temperature%2Crelative_humidity_2m%2Cprecipitation%2Cweathercode%2Cwindspeed_10m&daily=weathercode%2Ctemperature_2m_max%2Ctemperature_2m_min%2Cprecipitation_sum%2Cprecipitation_probability_max%2Cwindspeed_10m_max&timezone=America%2FSao_Paulo&forecast_days=1';

function refreshWeather() {
  // --weather previews bake a fixed condition on purpose; don't clobber it.
  if (DATA.live_weather === false) return;
  fetch(WX_URL, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      const daily = d.daily || {};
      const cur   = d.current || {};
      const first = (k) => (daily[k] && daily[k].length ? daily[k][0] : null);
      DATA.weather = Object.assign({}, DATA.weather, {
        temp_max:         first('temperature_2m_max'),
        temp_min:         first('temperature_2m_min'),
        precipitation_mm: first('precipitation_sum'),
        precip_prob:      first('precipitation_probability_max'),
        wind_max_kmh:     first('windspeed_10m_max'),
        wmo_code:         first('weathercode'),
        temp_now:         cur.temperature_2m,
        feels_like:       cur.apparent_temperature,
        humidity:         cur.relative_humidity_2m,
        precip_now_mm:    cur.precipitation,
        wind_now_kmh:     cur.windspeed_10m,
        current_code:     cur.weathercode,
        observed_at:      cur.time,
      });
      renderWeather();
    })
    .catch(() => {});
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
// The page is static (GitHub Pages), so there is nowhere to POST to. Clicks
// accumulate here and are exported as a file that the pipeline imports with
// `python -m digest --ingest-clicks`, which feeds the interest centroid used
// for relevance scoring.
const CLICK_KEY = 'tl_clicks';

function readClicks() {
  try { return JSON.parse(localStorage.getItem(CLICK_KEY) || '[]'); }
  catch(_) { return []; }
}

function trackClick(url, domain) {
  try {
    const clicks = readClicks();
    clicks.push({ url: url, domain: domain, at: new Date().toISOString() });
    if (clicks.length > 2000) clicks.splice(0, clicks.length - 2000);
    localStorage.setItem(CLICK_KEY, JSON.stringify(clicks));
    updateReadingLog();
  } catch(_) {}
}

function updateReadingLog() {
  const clicks = readClicks();
  const box = document.getElementById('j-reading-log');
  if (!box) return;
  box.hidden = clicks.length === 0;
  const label = document.getElementById('j-reading-count');
  if (label) label.textContent = clicks.length + ' ' + t('readingLog');
}

function exportClicks() {
  const clicks = readClicks();
  if (!clicks.length) return;
  const blob = new Blob([JSON.stringify(clicks, null, 2)], { type: 'application/json' });
  const stamp = new Date().toISOString().slice(0, 10);
  _dlBlob(blob, 'lighthouse-clicks-' + stamp + '.json');
  _flashBtn(document.getElementById('j-export-clicks'));
}

function clearClicks() {
  if (!confirm(t('clearConfirm'))) return;
  try { localStorage.removeItem(CLICK_KEY); } catch(_) {}
  updateReadingLog();
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  refreshWeather();
  // Static page, long-lived tab: keep the card honest.
  setInterval(refreshWeather, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) refreshWeather();
  });
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();
  updateReadingLog();

  document.getElementById('j-export-clicks').addEventListener('click', exportClicks);
  document.getElementById('j-clear-clicks').addEventListener('click', clearClicks);

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
