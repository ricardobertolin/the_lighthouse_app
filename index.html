<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>

: 1.0, "final_score": 0.5267, "headline_en": "AI Full-Body Scans Boom With 100,000 on Waitlists — But Are They Worth It?", "headline_pt": "Exames corporais com IA têm 100 mil na fila — mas valem a pena?", "one_liner_en": "AI-powered preventive full-body scans are booming, but experts question whether they cause more anxiety than benefit.", "one_liner_pt": "Exames preventivos com IA crescem exponencialmente, mas especialistas questionam se geram mais ansiedade do que benefícios.", "category": "AI", "region": "world", "rationale": "The rapid commercialization of AI health diagnostics raises urgent questions about efficacy, ethics, and patient wellbeing.", "low_signal": false}, {"title": "O que descobri com exame tecnológico que vasculha o corpo inteiro para prever doenças e tem 100 mil pessoas na fila de espera", "summary": "<img src=\"https://s2-g1.glbimg.com/_8x7qjYPbHviPl1yXb-aAzPJdH0=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/c/B/Ett3x3SJqFjVe3UxZiCg/mais-de-2-mil-fotos-da-pele-de-ruth-foram-tiradas.jpeg\" /><br />     Mais de 2 mil fotos da pele de Ruth foram tiradas.\nBBC e Neko Health\nNão me importo de tirar fotos — que são verificadas três vezes e recebem filtros antes de ir para o Instagram —, mas ter 70 câmeras apontadas para mim enquanto estou só de calcinha é um pouco intimidador.\nUma voz robótica me diz para ficar imóvel e fechar os olhos enquanto estou em pé dentro de um enorme scanner curvo, com música clássica tocando ao fundo.\nCom um flash de luz, são tiradas 2 mil fotografias do meu corpo, na esperança de capturar cada marca, sardinha e pinta para analisar e detectar diferentes tipos de câncer de pele.\nEste escaneamento de corpo inteiro está sendo realizado em uma clínica com estilo de ficção científica no centro de Manchester, na Inglaterra, enquanto eu uso um roupão e chinelos de borracha em formato hexagonal. Os milhões de dados coletados criarão um avatar 3D do meu corpo usando inteligência artificial.\nNos últimos dois anos, o mercado de exames preventivos (conhecidos na Inglaterra como MOTs) para saúde teve um crescimento exponencial, com pessoas dispostas a pagar centenas de libras, ou até mesmo milhares, por eles.  \nEmpresas como Prenuvo, Ezra e Neko Health estão captando milhões em investimentos de capital de risco. \nEmbora a Prenuvo e a Ezra ofereçam uma ressonância magnética de corpo inteiro, optei pela Neko Health, que não é tão abrangente e tem um preço mais acessível de 299 libras (R$ 2 mil). Atualmente, há 100 mil pessoas na lista de espera.\nSerei submetido a exames para detectar uma série de condições diferentes, incluindo câncer de pele, doenças cardiovasculares, diabetes tipo 2, problemas oculares como glaucoma, além de distúrbios renais e sanguíneos. \nNão tenho nenhum sintoma, mas e se encontrarem alguma coisa? Falarei mais sobre isso depois.\nA indústria de exames de imagem corporal se vê como uma nova fronteira na área da saúde, prevenindo doenças antes que elas tenham a chance de se manifestar completamente. Mas há ceticismo quanto aos reais benefícios desses exames para pacientes saudáveis\nNo Brasil, há serviços de tecnologia de escaneamento corporal, mas focados na medicina estética, de emagrecimento e performance esportiva, e não pelo modelo de medicina preventiva.. \nMinhas redes sociais estão repletas de vídeos de clientes entusiasmados se filmando em máquinas de escaneamento, fazendo exames de sangue e testando a força das mãos.\nHjalmar Nilsonne, um dos fundadores da Neko Health, deseja que esse tratamento preventivo esteja disponível para todos, não apenas para aqueles que podem pagar por ele.\n\"Embora a medicina tenha progredido muito no último século, a atenção primária ainda é muito básica. Por que esperar até que os sintomas apareçam?\", questiona Nilsonne. \"Os dados são muito claros: prevenir é melhor do que remediar.\"\nNo entanto, os médicos de clínica geral e do NHS, o serviço público de saúde britânico, em geral são mais céticos. O NHS da Inglaterra alerta que a popularidade desses exames está levando a mais \"diagnósticos excessivos, investigações desnecessárias e ansiedade evitável\".\nAlém de ter feito o exame eu mesma, conversei com duas mulheres que tiveram experiências muito diferentes.\n'Minhas marcas de câncer de pele passaram despercebidas'\nAnnabel Mason-Thompson fez um exame com a Neko Health em setembro do ano passado, pois sabia que tinha uma marca suspeita nas costas, mas a tecnologia não a detectou.\n\"Para ser sincera, fiquei um pouco decepcionada\", diz a mulher de 50 anos. \"O scanner de IA deles não detectou nenhuma das minhas quatro lesões cancerígenas.\"\n\"Só quando entrei na sala do médico depois do exame e mostrei a minha marca vermelha é que eles a examinaram.\"\nUm exame mais detalhado confirmou que a marca era suspeita, então a Neko Health contatou Annabel para informar que ela precisaria de tratamento e escreveu uma carta ao seu dermatologista particular dizendo que a \"lesão requer avaliação para uma possível excisão\".\nSua dermatologista encontrou mais três marcas cancerígenas que precisavam de tratamento urgente.\n\"Por sorte\", diz ela, \"todos eram carcinomas basocelulares de crescimento lento. Tive que remover cirurgicamente dois e fazer crioterapia em dois deles.\"\nA Neko Health afirma que \"a excelência clínica estão no centro de tudo o que faz\". A empresa informou que sua equipe clínica identificou uma \"lesão preocupante\" e que esta foi avaliada por dois de seus dermatologistas antes do encaminhamento para possível tratamento.\n\"Sabemos que nenhum sistema é infalível\", diz Nilsonne, \"e é por isso que temos várias lentes — é crucial que a tecnologia e a experiência humana trabalhem juntas.\"\nOs dados mais recentes da empresa mostram que, dos 4.362 exames realizados em clientes que visitaram a sede da Neko Health em Estocolmo, na Suécia, no ano passado, 1,2% detectaram doenças potencialmente fatais, como melanoma e leucemia. Outros 4% identificaram problemas de saúde significativos que exigiam tratamento adicional, e 1,2% sinalizaram condições que poderiam ser revertidas, como níveis de açúcar no sangue pré-diabéticos.\nEmbora os números não sejam representativos da população e levem em conta apenas aqueles que podem pagar por esse tipo de cuidado preventivo de saúde, Nilsonne afirma que isso indica como a medicina deveria ser no futuro.\nMas clínicos gerais discordam. A professora Victoria Tzortziou Brown, presidente do Royal College of General Practitioners (RCGP), afirma que não encontraram \"evidências convincentes\" de que exames de rastreio privados em larga escala \"melhorem os resultados de saúde\".\nEla afirma que os resultados desses exames particulares também podem sobrecarregar o NHS, já que os pacientes retornam para mais exames e possível tratamento, mesmo \"quando os resultados se mostram clinicamente insignificantes\".\n'Salvou minha vida'\nMehvish diz que nada poderia tê-la preparado para o que ouviu após o exame de corpo inteiro. Ela saiu da clínica Neko Health em Birmingham, na Inglaterra, com um diagnóstico que mudaria sua vida.\n\"Eu esperava sentir alívio\", diz a mulher de 33 anos. \"Em vez disso, me disseram que eu tinha uma forma rara de diabetes.\"\nApós seus níveis de açúcar no sangue a longo prazo apresentarem resultados muito elevados, ela fez outro exame de sangue que confirmou a suspeita.\nEla foi encaminhada de volta ao seu clínico geral, que a mandou para uma consulta hospitalar urgente no mesmo dia, e foi diagnosticada com diabetes autoimune latente em adultos (chamada pela sigla LADA), um tipo de diabetes que fica entre os tipos 1 e 2. \nAssim como o tipo 1, é uma doença autoimune que ataca as células pancreáticas do corpo, mas também compartilha características com o tipo 2, pois pode progredir lentamente e, dependendo do estágio da doença, pode ser controlada inicialmente com dieta e exercícios.\n\"Eu não tinha nenhum dos sintomas\", diz Mehvish, \"Foi difícil de entender — como eu poderia ter essa doença e não saber?\"\nMas ela afirma que a intervenção precoce e inesperada \"salvou minha vida\".\nAgora ela aplica insulina duas vezes ao dia, controla o que come e, apesar de sentir falta da espontaneidade da sua antiga vida, está aprendendo a se adaptar à nova.\n\"Sinto-me muito melhor, com mais clareza mental, menos névoa cerebral e muito mais equilibrada.\"\nO que descobri no meu exame\nApós meu próprio exame, me disseram que tenho 3.311 marcas na pele, em comparação com as 845 da média dos clientes da Neko Health. Três delas precisam de uma avaliação adicional pelo dermatologista da empresa na Suécia.\n\"Mas eu não tenho nenhuma pinta ou marca grande\", digo durante a consulta com o médico após o exame. São as minhas sardas, me dizem, e ter sardas aumenta o meu risco de câncer de pele.\nComo estava confiante de que receberia um atestado de saúde perfeito — especialmente no que diz respeito à minha pele — fiquei um pouco nervosa ao descobrir que precisaria fazer exames adicionais.\nAlém das três pintas suspeitas que precisavam de atenção, descobri também que tenho uma frequência cardíaca anormal. O traçado do eletrocardiograma (ECG) revelou uma onda extra, conhecida como onda P bífida, que foi encaminhada ao cardiologista da Neko Health para avaliação. Felizmente, o resultado foi normal.\nAlguns dias depois, recebi uma mensagem de texto informando que não havia alterações anormais na pele que exigissem tratamento.\nSou uma entre milhares de clientes que tiveram algo sinalizado como um possível problema, mas depois descobriram que nenhum tratamento adicional era necessário.\nAlguns médicos dizem que isso causa ansiedade desnecessária e que os pacientes deveriam confiar apenas nos programas nacionais de rastreio do NHS.\nO médico Stephen Harden, presidente da Royal Society of Radiologists, destaca a tecnologia utilizada no NHS tem como alvo \"áreas específicas\" como mamas, intestino ou colo do útero, e que, segundo ele, pode ser mais confiável do que uma tomografia de corpo inteiro. \nMas o ex-ministro da Saúde britânico Steve Brine, que atua como consultor de uma empresa de saúde preventiva, afirma que exames preventivos como o que eu fiz \"estão em sintonia com a tendência de como as pessoas estão abordando a sua saúde\".\n\"Mudanças estão em curso em todo o NHS — a prevenção é uma área política importantíssima\", diz Brine. \"Queremos identificar os problemas das pessoas antes que elas se tornem pacientes, então esses exames podem muito bem se tornar parte do nosso futuro sistema de saúde, e as necessidades de atenção primária precisam se adaptar.\"\nE quanto a mim? Disseram-me que a idade do meu coração era quatro anos menor do que a minha idade cronológica e, no geral, eu gozava de ótima saúde. Mas também aprendi uma lição valiosa: que eu poderia ter um risco maior de câncer de pele por causa das minhas sardas. \nEntão, graças ao tempo que passei no scanner, agora estou muito mais entusiasmada em passar protetor solar em todo o meu corpo, em vez de apenas no rosto. \nUsamos inteligência artificial para traduzir esta reportagem, originalmente escrita em inglês. O texto foi revisado por um jornalista da BBC antes da publicação. Saiba mais aqui sobre como a BBC está usando a inteligência artificial (link para texto em inglês).", "url": "https://g1.globo.com/saude/noticia/2026/08/10/o-que-descobri-com-exame-tecnologico-que-vasculha-o-corpo-inteiro-para-prever-doencas-e-tem-100-mil-pessoas-na-fila-de-espera.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-08-10T12:51:00+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/_8x7qjYPbHviPl1yXb-aAzPJdH0=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/c/B/Ett3x3SJqFjVe3UxZiCg/mais-de-2-mil-fotos-da-pele-de-ruth-foram-tiradas.jpeg", "url_hash": "e73d433ea5a6224c93d71b756f06feca", "title_hash": "a0c6c85a809f32230853795eda9f1d62", "corroboration": 2, "relevance_score": 0.016, "reputatio S Owners Batista Brothers: From Lava Jato Scandal to Global Diplomacy", "headline_pt": "Irmãos Batista: da Lava Jato ao protagonismo na diplomacia mundial", "one_liner_en": "The Batista brothers rebuilt their empire after a massive corruption scandal and now play a role in international diplomacy.", "one_liner_pt": "Os irmãos Batista reconstruíram seu império após enorme escândalo de corrupção e hoje atuam na diplomacia internacional.", "category": "Brazil", "region": "brazil", "rationale": "The remarkable rehabilitation of Brazil's most notorious corporate corruption figures raises questions about accountability and power.", "low_signal": false}, {"title": "Lula coleciona atritos com vizinhos e deixa Brasil isolado", "summary": "<img src=\"https://media.gazetadopovo.com.br/2026/08/05205719/lula-estados-unidos-embaixadora-960x540.jpg\" /><br />Presidente Lula afasta vizinhos e deixa Brasil diplomaticamente isolado. Leia o comentário de Alexandre Garcia na Gazeta do Povo.", "url": "https://www.gazetadopovo.com.br/vozes/alexandre-garcia/lula-coleciona-atritos-com-vizinhos-e-deixa-brasil-isolado/", "source_domain": "gazetadopovo.com.br", "published_at": "2026-08-10T00:03:51+00:00", "origin": "feed", "image_url": "https://media.gazetadopovo.com.br/2026/08/05205719/lula-estados-unidos-embaixadora-960x540.jpg", "url_hash": "f76dc2bdfa582e9b0f76432adc6d4f84", "title_hash": "67e75d12cb0129e99a6c8478911a74a4", "corroboration": 1, "relevance_score": 0.2125, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3612, "headline_en": "Lula's Regional Disputes Leave Brazil Diplomatically Isolated", "headline_pt": "Atritos de Lula com vizinhos deixam Brasil diplomaticamente isolado", "one_liner_en": "Commentator Alexandre Garcia argues President Lula's friction with neighboring countries is leaving Brazil regionally isolated.", "one_liner_pt": "O comentarista Alexandre Garcia argumenta que os atritos de Lula com vizinhos estão deixando o Brasil isolado regionalmente.", "category": "Geopolitics", "region": "brazil", "rationale": "Opinion piece with a factual hook around Brazil's deteriorating regional diplomatic relationships under Lula.", "low_signal": true}, {"title": "Golpe dos diplomas no Paraguai usava intermediários em vários estados do Brasil para atrair estudantes, aponta investigação", "summary": "<img src=\"https://s2-g1.glbimg.com/98XDstmNJ-ZR3iReh5EUfcFXy7w=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/t/i/Bwzm4xRxSNmZBeVFWFAg/captura-de-tela-2026-08-09-224047.png\" /><br />     Faculdade do Paraguai é acusada de emitir diplomas falsos de mestrado e doutorado\nUma suposta oportunidade de conquistar títulos de mestrado e doutorado por valores acessíveis atraiu centenas de brasileiros para um esquema que agora é investigado pelas autoridades do Paraguai e do Brasil. A Faculdade Interamericana de Ciências Sociais (FIX), divulgada como instituição apta a oferecer cursos de pós-graduação, não possuía registro no órgão responsável pelo ensino superior paraguaio, segundo investigações de autoridades dos dois países.\nGolpe do diploma falso: brasileiros têm até R$ 40 mil em prejuízo com mestrados e doutorados de faculdade irregular no Paraguai\nO esquema era promovido no Brasil por intermediários que anunciavam cursos de mestrado e doutorado em áreas como educação, direito e saúde. Um deles era Radamese Lima, que se apresentava como professor e representante de uma assessoria acadêmica no Ceará. Em conversas com interessados, ele garantia que os diplomas poderiam ser reconhecidos por universidades brasileiras e afirmava que já havia obtido mais de uma centena de validações.\nSegundo a Polícia Federal, porém, o reconhecimento de parte desses diplomas teria ocorrido com base em documentação posteriormente considerada irregular. Após serem informadas de que a instituição não era regular no Paraguai, universidades brasileiras iniciaram processos para anular títulos concedidos a ex-alunos da FIX.\nFaculdade sem registro\nDe acordo com o Ministério Público paraguaio, a FIX não possui registro no Conselho Nacional de Ensino Superior do Paraguai e, portanto, não existe legalmente como instituição habilitada para emitir os títulos anunciados. Quando a equipe do Fantástico esteve na sede da organização, em Assunção, encontrou o imóvel vazio e com aviso de busca e apreensão realizado pelas autoridades.\nAs investigações apontam ainda que o empresário brasileiro Ismael Fenner, identificado como responsável pela FIX, utilizava o nome do ISICS, uma instituição de ensino reconhecida no Paraguai. Os proprietários do ISICS denunciaram Fenner por uso indevido da marca e afirmam ser os únicos administradores legítimos da instituição.\nO Ministério da Educação do Paraguai analisou documentos utilizados para sustentar a legalidade dos cursos e concluiu que havia irregularidades graves. Segundo autoridades paraguaias, carimbos, assinaturas e documentos apresentados eram falsos, o que inviabiliza a validade dos títulos emitidos pela FIX.\nComo os cursos eram oferecidos\nRelatos de alunos indicam que as aulas ocorriam de forma online, geralmente em português e com encontros semanais. Para atender às exigências de validação de títulos estrangeiros no Brasil, os estudantes eram orientados a realizar viagens ao Paraguai.\nSegundo as investigações, muitos alunos fizeram apenas uma passagem pelo país durante todo o curso. Em uma operação realizada em um hotel de Assunção, promotores paraguaios ouviram estudantes brasileiros que participavam da apresentação de teses. Eles relataram que aquela havia sido a única viagem realizada ao Paraguai desde o início dos estudos.\nDe acordo com o Ministério Público, cerca de 300 brasileiros estavam no local no momento da operação. As autoridades tratam os estudantes como vítimas do esquema.\nPrejuízo financeiro e profissional\nOs danos provocados pelo caso vão além das mensalidades pagas. Uma aluna entrevistada afirmou ter desembolsado R$ // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

function renderBriefing() {

  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  const maxRel = Math.max(...DATA.articles.map(a => a.relevance_score || 0), 0.01);
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round(((art.relevance_score || 0) / maxRel) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
        '<div class="art-actions">' +
          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
