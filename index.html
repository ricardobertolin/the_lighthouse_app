<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">

adline_pt": "Existe mesmo uma onda anti-Argentina no mundo, como diz Milei?", "one_liner_en": "Milei's narrative of a global anti-Argentina sentiment has roots over 100 years old, tied to the country's self-image abroad.", "one_liner_pt": "A narrativa de Milei sobre uma onda anti-Argentina tem raízes de mais de 100 anos ligadas à imagem do país no exterior.", "category": "Geopolitics", "region": "world", "rationale": "Milei's political rhetoric is shaping Argentina's foreign relations and drawing international attention.", "low_signal": false}, {"title": "Existe mesmo uma onda anti-Argentina no mundo, como diz Javier Milei?", "summary": "<img src=\"https://s2-g1.glbimg.com/JOatT7uwIx04pzmKXlb-XqXusKQ=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/Q/K/aHK6ZASDAk39JtqVQWzA/2026-07-16t232504z-1644221911-rc2afmaoq98n-rtrmadp-3-argentina-politics-milei.jpg\" /><br />     O presidente argentino Javier Milei em visita ao Paraguai em setembro de 2025\nCesar Olmedo/Reuters via BBC\n\"Vamos a hacer grande a la Argentina otra vez\" é o \"make America great again\" do presidente argentino Javier Milei, no poder desde dezembro de 2023. \nMais do que uma frase de efeito, a declaração remete ao período em que a Argentina tinha clara superioridade econômica em relação a seus vizinhos. O contraste com o cenário atual alimenta o discurso de \"nós contra eles\", reforçado por Milei ao afirmar que há uma ofensiva anti-Argentina para conter o desenvolvimento do país.\n✅ Siga o canal de notícias internacionais do g1 no WhatsApp\nOnda esta que não passa de ficção, argumentam especialistas. Ou narrativa conveniente.\n\"A ideia de que há, no momento, uma espécie de onda anti-Argentina é simplesmente ridícula\", diz o economista Fabio Giambiagi, pesquisador do Instituto Brasileiro de Economia da Fundação Getulio Vargas e autor do recém-lançado livro Argentina para Brasileiros.\nAgora no g1\n\"Não consigo enxergar uma onda global anti-Argentina. Na verdade, as redes digitais amplificam isso que se convencionou chamar de narrativa, construída por setores políticos que dela extraem benefícios\", completa o sociólogo Rogério Baptistini, professor na Universidade Presbiteriana Mackenzie. \n\"É uma teoria, como é óbvio, mas há bons motivos para acreditar que o presidente Javier Milei use o argumento para desviar a atenção sobre os resultados sociais do seu governo, que infelicitam as classes médias e os trabalhadores argentinos. Essa é uma estratégia clássica da extrema-direita, de Donald Trump a Jair Bolsonaro: criar inimigos externos e capitalizar o ressentimento\", diz Baptistini.\nNa bola\nEssa onda anti-Argentina propalada por Milei e parte da população local contemporânea acabou impulsionada pelo esporte. No caso, a Copa do Mundo, em que o time liderado pelo craque Lionel Messi ficou com o vice-campeonato, perdendo a final para a Espanha.\n\"O que houve concretamente foi uma reação, compreensível, em função de atitudes anti-esportivas de um conjunto de jogadores argentinos imediatamente após a partida final\", reconhece Giambiagi. No caso, o fato de que muitos jogadores argentinos deram as costas à comemoração dos espanhóis.\nGiambiagi cita o ex-presidente brasileiro Fernando Henrique Cardoso, que costumava enfatizar a importância do soft-power no cenário global contemporâneo. \nPara o economista, a Argentina vinha construindo uma simpatia grande ao longo do campeonato, por vitórias impressionantes e viradas épicas. Além do fato de que o mundial marcava a despedida de Messi, um gigante inquestionável no esporte. \"Infelizmente esse esforço acabou sendo jogado no lixo, foi por água abaixo 15 minutos depois do encerramento do jogo contra a Espanha\", afirma ele.\nNos dias que se seguiram, profusões de teorias conspiratórias fortaleceram o discurso de \"nós contra eles\", deixando a Argentina realmente isolada nos debates entre torcedores e afins. \nDe um lado, a tese de que a Fifa seria parte de um complô para favorecer o time de Messi — o que, segundo as teorias difundidas nas redes sociais, seria \"fundamentado\" por decisões polêmicas da arbitragem nas partidas anteriores à final. \nDe outro, justamente o contrário: argentinos divulgando que seu escrete havia entregue o jogo para os espanhóis, por conta de ingerência da Fifa. \n\"Na Argentina muitos acreditam nessa tese. Uma estupidez absoluta\", diz Giambiagi. Ele lembra que o escritor italiano Umberto Eco (1932-2016) disse certa vez que a internet \"dava voz aos idiotas\". \"Infelizmente, no mundo de hoje, qualquer doido acaba tendo sua verbalização ecoada e magnificada\", comenta.\n\"De fato, a Copa do Mundo é emblemática, pois houve situações em que a Argentina foi beneficiada por decisões polêmicas, como é comum acontecer no futebol. Mas isso não foi uma exclusividade\", comenta Baptistini.\nMomento tenso na final da Copa do Mundo de 2026, onde Enzo Fernández, da Argentina, foi expulso após uma falta em Pau Cubarsí, da Espanha.\nGetty Images via BBC\nPara o sociólogo, o discurso nas mídias contra a Argentina, durante a competição, foi amplificado \"pelo fato de a seleção desafiar a ordem estabelecida com seu jogo\" — um estilo mais prático e menos estético.\n\"Um futebol baseado na catimba, na irritação do adversário. E os puristas defensores do futebol bonito não aceitam isso que chamam de antijogo.\"\n\"No fundo, há um preconceito contra o estilo emocional de futebol dos argentinos\", analisa o sociólogo. \"Apesar de contar com Messi, assim como já tiveram Maradona, os sul-americanos mostram aos europeus que podem vencer com paixão e desordem criativa. E isso ofende o establishment.\"\nMas esse ponto de vista não seria suficiente para identificar aí uma onda anti-Argentina, como querem acreditar os defensores de Milei.\n\"A Argentina não é especialmente odiada. O que há, sobretudo por conta do evento da Copa e graças às redes, é um desvio de foco\", acredita o sociólogo Baptistini.\n\"O ceticismo quanto ao futuro econômico do país e à sua estabilidade foi transplantado para uma questão de orgulho nacional. Um problema complexo, como a crise econômica e social, se torna uma narrativa emocional acerca do amor-próprio dos argentinos, vítimas do ódio global.\"\nUm país 'europeu' na América do Sul\nMas o lastro que fundamentaria essa narrativa está posto mais de 100 anos atrás. E tem a ver com a imagem construída para o exterior de uma suposta superioridade argentina — que, muitas vezes, é lida de forma estereotipada como soberba, arrogância, petulância.\nTem a ver com identidade, é claro. Ou melhor: com a imagem construída pelo país perante o restante do globo. \nEm seu livro A Identidade Internacional do Brasil e a Política Externa Brasileira, o jurista Celso Lafer, que foi ministro das Relações Exteriores do Brasil, explica o conceito. \nPara ele, a identidade internacional de um país, ou seja, como essa imagem de cada nação ecoa na relação com as outras, espelha \"o conjunto de circunstâncias e predicados que diferenciam sua visão e os seus interesses, como ator no sistema mundial, dos que caracterizam os demais países\".\nEm outras palavras, no tabuleiro global, a maneira como cada Estado move as peças é a consequência de suas próprias diferenças em relação aos demais.\nA Argentina pós-Guerra do Paraguai, aquela que se consolidaria como Estado independente na América Latina, experimentou um sucesso gigantesco em uma economia global que necessitava de commodities variadas. Nas décadas seguintes, industrializou-se.\nNaquele momento de destaque econômico, o rompimento definitivo dos laços coloniais deixou a elite local livre para consolidar seus valores. \n\"[Para eles] a resposta à pergunta 'quem somos?' era quase automática: somos a órbita de poder da região que abrange o Paraguai, o Uruguai e parte do Peru\", escreve a historiadora Érica Cristina Alexandre Winand, em sua tese de doutorado defendida em 2010 na Unesp, a Universidade Estadual Paulista. \n\"E tal ideal seria transferido de geração para geração, por meio da memória diplomática e de relatos históricos\", continua.\nPara a historiadora, aí está a raiz da rivalidade entre Brasil e Argentina: dois grandes países, herdeiros de conflitos territórios de suas antigas metrópoles, agora disputando a influência regional. \n\"Brasil e Argentina construíram sua identidade com base em crenças frutificadas em um ambiente de rivalidade entre as potências pelo domínio colonial capitalista\", elenca a historiadora, lembrando que a partir disso, \"o logro dos objetivos de um significaria o fracasso dos propósito do outro\".\nCervejaria de Buenos Aires em 1910.\nAutor Desconhecido/Domínio Público via BBC\nMas era um momento em que a Argentina \"seguia ostentando seu crescimento\", lembra a historiadora.\nEsse boom é retratado pelo historiador econômico Fernando Rocchi no seu livro Chimneys in the Desert: Industrialization in Argentina During the Export Boom Years, 1870-1930 (Chaminés no Deserto: A Industrialização na Argentina durante os Anos do Boom Exportador, 1870-1930, sem tradução no Brasil). \nNo início do século 20, o PIB argentino crescia a taxas próximas de 8% ao ano, enquanto a atividade industrial aumentava quase 10% anualmente. Pouco antes da Primeira Guerra, a renda per capita dos argentinos era superior a de países como Itália e Espanha — equiparando-se a de franceses e alemães. \nBuenos Aires, a capital, se apresentava praticamente como uma cidade europeia na América do Sul. O metrô ali foi inaugurado em 1913 — 61 anos antes do primeiro sistema do tipo no Brasil, o de São Paulo.\n\"Essa certa sensação de superioridade do argentino em relação ao resto da América Latina tem a ver com o fato de que, no passado, a renda per capita do país era bastante superior ao restante dos latino-americanos\", reconhece Giambiagi — filho de argentinos nascido no Rio de Janeiro, ele viveu 15 anos de sua infância e adolescência em Buenos Aires.\n\"Por causa desse contexto histórico diferenciado, associado a questões de época, existia na mentalidade de muitos argentinos a ideia de que o país era uma espécie de enclave da Europa na América Latina\", comenta ele.\nComplexo comercial de Buenos Aires em 1908.\nAutor desconhecido/Domínio público via BBC\nGerme do racismo\n\"O desejo de domínio político-econômico sobre aquela área [parte da América do Sul] era acompanhado por um sentimento de superioridade cultural ou 'racial' da Argentina em relação ao Brasil que, segundo alguns autores, refletem até a atualidade da fixação de estereótipos sociais que ainda perfilam a relação entre os dois países\", pontua Winand.\n\"As elites [argentinas] lavravam um sentimento de superioridade, inclusive racial, em relação aos países sul-americanos, alegando que a distinção de sua força moral lhe conferia uma aptidão ímpar e irrevogável de hegemonia na região\", acrescenta a historiadora.\nPor conjuntura histórica, a formação racial do povo argentino é diferente da brasileira. Este aspecto, com significativamente menor proporção de negros na população, sempre alimentou teorias de cunho racista — e até hoje gera episódios que escancaram o preconceito e a discriminação.\n\"A soberba dos argentinos é um estereótipo, assim como a malandragem dos brasileiros. Suas raízes são históricas e, muito provavelmente, estão associadas à contradição entre a elite e o povo, no período pós-colonial, a partir do século 19\", diz Baptistini.\nO jornalista Domingo Faustino Sarmiento (1811-1888), que foi presidente da Argentina, em seu livro Facundo: Civilização e Barbárie, de 1845, trata da dicotomia entre o mundo das elites brancas, associado à cultura e ao progresso, e a barbárie, o atraso e o isolamento rural dos pampas.\n\"De certa forma, sob essa tensão foi construída a ideia da República que deveria se europeizar para ser moderna em um continente marcadamente mestiço\", analisa Baptistini.\n\"Especificamente na relação Brasil-Argentina há uma exacerbação compreensível e grande do tema do racismo\", comenta Giambiagi. \"Com repercussão jornalística grande, em função de fatos específicos ocorridos com com número muito reduzido de turistas argentinos com atitudes racistas e condenáveis aqui no Brasil.\"\n\"Minha percepção, de alguém que morou 15 anos na Argentina, é que o racismo é uma aberração. Mas há uma parcela dos argentinos que fazem gestos racistas sem a menor noção do que isso significa\", diz o economista. \"Não dá para estigmatizar um país por conta de atitudes condenáveis de meia-dúzia de imbecis.\"\nFábrica da Ford na Argentina, aberta em 1922, foi a terceira fora dos Estados Unidos — e a primeira na América Latina.\nAutor desconhecido/Domínio público via BBC", "url": "https://g1.globo.com/mundo/noticia/2026/08/08/existe-mesmo-uma-onda-anti-argentina-no-mundo-como-diz-javier-milei.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-08-08T10:17:50+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/JOatT7uwIx04pzmKXlb-XqXusKQ=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/Q/K/aHK6ZASDAk39JtqVQWzA/2026-07-16t232504z-1644221911-rc2afmaoq98n-rtrmadp-3-argentina-politics-milei.jpg", "url_hash": "4e325f10c5e94157c152cc966a1ff8c7", "title_hash": "37c37d4221b27e100e9a59a97759f7b1", "corroboration": 2, "relevance_score": 0.1609, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5355, "headline_en": "Is There Really a Global Anti-Argentina Wave, as Milei Claims?", "headline_pt": "Existe mesmo uma onda anti-Argentina no mundo, como diz Milei?", "one_liner_en": "Milei's claim of a global anti-Argentina wave echoes historical narratives about the country's perceived superiority.", "one_liner_pt": "A afirmação de Milei sobre uma onda anti-Argentina ecoa narrativas históricas sobre a suposta superioridade do país.", "category": "Geopolitics", "region": "world", "rationale": "Near-duplicate of index 0 from a different outlet.", "low_signal": true}, {"title": "Espanha impõe controles de fronteira a viajantes vindos da Itália em meio a disputa sobre imigração", "summary": "A Itália introduziu controles de fronteira após a entrada de cerca de 78 mil imigrantes do Marrocos no enclave espanhol vizinho de Ceuta. Espanha adotou medida semelhante em resposta.", "url": "https://www.bbc.com/portuguese/articles/cqjx2ne4gv9o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-08-08T10:59:01+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/be73/live/f8fae290-9024-11f1-a7ab-8b30adf0800a.jpg", "url_hash": "4d9749b9e266cc511727b1814768a9c9", "title_hash": "8ac75dd561ea962e623de04a49aaaf71", "corroboration": 2, "relevance_score": 0.1128, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5114, "headline_en": "Spain Imposes Border Controls on Travelers from Italy Amid Immigration Dispute", "headline_pt": "Espanha impõe controles de fronteira a viajantes vindos da Itália em disputa migratória", "one_liner_en": "Spain introduced border controls for Italian travelers after a mass migrant crossing into the Spanish enclave of Ceuta.", "one_liner_pt": "A Espanha impôs controles de fronteira após a entrada massiva de migrantes no enclave espanhol de Ceuta.", "category": "Geopolitics", "region": "world", "rationale": "A rare mutual border control escalation between EU members signals a deepening European immigration crisis.", "low_signal": false}, {"title": "Os curiosos métodos que as pessoas usavam para acordar antes da invenção dos despertadores - e dos celulares", "summary": "<img src=\"https://s2-g1.glbimg.com/dc0guMmj0rvRa43bK_4-E0hgMJU=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/x/P/PEnFl1Rg2j1eYlmqbQPg/imagem-1200px-3-.png\" /><br />     Os 'despertadores humanos' só iam embora depois que os clientes acordavam\nAlamy via BBC\nDurante a Revolução Industrial no Reino Unido, as novas fábricas passaram a exigir horários rígidos, com entradas de funcionários em horários cada vez mais precisos.\n📱Favorite o g1 no Google e acompanhe as principais notícias do dia\nUm funcionário que chegasse apenas cinco minutos atrasado poderia atrasar toda a linha de produção e reduzir o lucro dos empregadores. \nEra preciso encontrar uma forma de acordar na hora certa, especialmente durante os meses mais escuros do inverno. Embora os despertadores já existissem, eles eram caros demais para a maioria dos trabalhadores.\nAs fábricas tentaram usar apitos e sinos para acordar e convocar os trabalhadores, mas esses métodos muitas vezes se mostraram pouco confiáveis. Em vez disso, surgiu uma profissão inteiramente dedicada a acordar as pessoas: os knocker uppers (despertadores humanos, em tradução livre).\nVeja os vídeos em alta do g1\nAgora no g1\nEsses \"despertadores humanos\" percorriam ruas e, às vezes, bairros inteiros, batendo nas janelas ou dando leves batidas nelas, ou até lançando ervilhas secas contra os vidros, afirma Arunima Datta, professora associada de história da Universidade do Norte do Texas, nos Estados Unidos. \n\"Eles permaneciam ali até receber uma resposta dos clientes. Não iam embora.\"\nProfissões semelhantes à dos \"despertadores humanos\" também existiram em muitas outras sociedades, afirma Datta, especialmente em comunidades muçulmanas durante o mês sagrado do Ramadã, quando as pessoas precisavam acordar cedo para rezar e fazer a primeira refeição antes do amanhecer.\nAo longo da história, as pessoas criaram muitas outras formas engenhosas de acordar, desde simplesmente criar galos até usar sofisticados relógios de vela, que deixavam cair agulhas sobre bandejas de metal a cada hora.\nEntender como essas sociedades do passado dormiam e despertavam pode até ajudar a melhorar o nosso próprio sono — e a forma como acordamos — hoje.\nO canto do galo\nAntes da popularização dos despertadores pessoais, as pessoas costumavam acordar seguindo sinais naturais e a rotina do dia a dia, afirma Fatima Yaqoot, professora de saúde do sono da Universidade da Sunshine Coast, na Austrália.\n\"A luz do dia era um dos principais sinais\", afirma Yaqoot. \"Em muitas sociedades pré-industriais, a vida cotidiana seguia o ritmo do nascer e do pôr do sol, o que naturalmente moldava os ritmos circadianos.\"\nOs ritmos circadianos regulam os horários de dormir e acordar e são um dos dois principais processos que controlam o sono e o despertar. O outro é a pressão do sono, que aumenta ao longo do dia, ampliando a necessidade de dormir. \"Juntos, eles ajudam a explicar por que adormecemos à noite, permanecemos dormindo e acordamos novamente pela manhã\", diz Yaqoot.\nO canto do galo é um bom despertador natural\nGetty Images via BBC\n\"Eu evitaria a narrativa de que, no mundo pré-industrial, todo mundo simplesmente seguia os ciclos de luz e escuridão\", afirma Sasha Handley, professora de história da Universidade de Manchester, no Reino Unido, que liderou um projeto sobre o sono na primeira fase da Idade Moderna. \"Não acho que isso seja correto, porque o trabalho das pessoas frequentemente se estendia noite adentro, às vezes até as primeiras horas da manhã, dependendo das tarefas que precisavam ser realizadas em determinadas épocas do ano.\"\nEm vez disso, segundo Handley, as pessoas costumavam combinar mecanismos biológicos e recursos tecnológicos para organizar seus horários de trabalho.\nNas fazendas, o período de sono durante o inverno podia ser um pouco mais longo, já que as tarefas do início da manhã geralmente terminavam quando chegava o outono, afirma Handley. Ainda assim, havia muitos outros motivos para as pessoas quererem acordar cedo.\n\"As motivações religiosas, por exemplo, eram uma razão muito importante para que as pessoas mantivessem instrumentos de medição do tempo ao lado da cama\", diz Handley. \"Elas queriam chegar à igreja em determinado horário ou fazer suas orações logo cedo, porque acreditavam que isso as aproximava de Deus.\" Segundo Handley, também havia certo espírito de competição para ver quem acordava e fazia as orações antes dos demais.\nOs padrões de sono também costumavam ser diferentes naquela época. A ideia de que, no período pré-industrial, as pessoas dormiam em dois períodos ao longo da noite continua bastante difundida, embora alguns pesquisadores questionem as evidências que sustentam essa teoria. Ainda assim, estudos mostram que muitas culturas ao redor do mundo continuam adotando padrões de sono polifásicos.\nRezar cedo era um dos motivos para acordar cedo\nGetty Images via BBC\nOs sons dos animais ao despertar talvez possam ser considerados os primeiros despertadores sonoros da humanidade. O canto do galo ao amanhecer é um sinal comum de que o dia começou, diz Handley. Curiosamente, pesquisas mostram que os galos cantam de acordo com seu próprio ritmo circadiano, e não apenas em resposta à luz. O coro matinal dos pássaros também desempenhava um papel importante, afirma Matthew Champion, professor associado de história da Universidade de Melbourne, na Austrália.\nOs sinos eram outro sinal usado para despertar, afirma Handley. Na Europa Ocidental e Central, especialmente durante a Idade Média e o início da Idade Moderna, a vida era organizada em torno da paróquia. Os moradores usavam os sinos da igreja, tocados a cada hora por um sineiro, para iniciar e organizar o dia. \"A pessoa encarregada de tocar os sinos usava uma ampulheta para controlar o tempo.\"\nÉ claro que algumas casas também tinham seus próprios sinos, inclusive do lado de fora dos quartos. \"Os empregados tinham sinos. Em geral, eram os primeiros a acordar na casa e cabia a eles despertar os patrões no horário adequado\", diz Handley.\nDespertadores da Antiguidade\nTambém há muitos exemplos de despertadores personalizados bastante antigos. \"Não se trata de um mundo sem despertadores\", afirma Handley. Segundo ela, esses dispositivos apenas funcionavam de maneiras diferentes, usando água ou chamas para acionar sinais capazes de acordar quem estivesse por perto. \"E, quanto mais alto o status social da pessoa, mais elaborados e sofisticados eles se tornavam\", acrescenta Handley.\nOs relógios de vela, marcados com divisões que indicavam a passagem do tempo, remontam à China Antiga. Alguns eram engenhosamente projetados para que um prego caísse em uma pequena bandeja de metal aproximadamente a cada hora, diz Handley. \"Muitas pessoas também faziam suas próprias velas, por questões de custo, e elas serviam como mais um sinal sonoro para acordar no horário desejado.\"\nAs esferas metálicas penduradas por fios nos relógios de incenso emitiam um pequeno som metálico quando os fios queimavam e elas caíam em uma bandeja de metal posicionada logo abaixo\nAlamy via BBC\nNa China, o incenso também era usado para marcar o tempo. Em alguns casos, pequenas esferas metálicas presas por fios caíam sobre uma bandeja, funcionando como gongos. Um relato do século 19 escrito por um etnólogo americano menciona que algumas pessoas na China colocavam varetas de incenso entre os dedos dos pés para acordar.\nOs relógios de água, conhecidos como clepsidras na Grécia Antiga, foram amplamente utilizados durante séculos. O filósofo Platão é apontado como o primeiro a adaptar um deles para funcionar como despertador, no século 5 a.C.\nEle aprisionava ar dentro de um recipiente para o qual a água escoava. À medida que o nível da água subia, a pressão também aumentava, até produzir um apito alto, semelhante ao de uma chaleira.\nOs relógios de água também estavam entre os primeiros sinos automáticos das vilas, observa Champion, da Universidade de Melbourne. Eles utilizavam grandes reservatórios de água que, ao serem esvaziados, acionavam um sino. Uma crônica do século 12 registra que um desses reservatórios chegou a ser usado para apagar um incêndio.\nOs primeiros relógios mecânicos, ou seja, mecanismos oscilatórios que mediam a passagem do tempo e eram ligados a um escape, responsável por contar essas oscilações, surgiram no fim do século 13 e no início do século 14.\nAntes dos despertadores, muitas pessoas usavam sinais naturais, como a luz do dia, para acordar\nGetty Images via BBC\n\"Desde muito cedo, eles às vezes tocavam melodias antes do badalar dos sinos\", afirma Champion. Segundo ele, no fim do século 15, os relógios de parede domésticos também passaram a ter despertadores, ajustados por meio de um pino. \"O alarme consistia no toque de um sino e, mais tarde, em batidas repetidas de um pequeno sino.\"\nDespertadores humanos\nA fabricação de relógios avançou significativamente no século 17, afirma Handley, da Universidade de Manchester. Há registros de pessoas que \"improvisavam seus próprios despertadores quando viajavam, por exemplo\", diz ela. O primeiro despertador mecânico conhecido foi inventado em 1787, mas sua produção só se difundiu depois do registro da primeira patente, em 1876. Ainda assim, esses despertadores de corda eram pouco confiáveis e caros demais para a maioria da população.\nDurante a Revolução Industrial, no entanto, as necessidades de sono mudaram para muitas pessoas, e os \"despertadores humanos\", munidos de varas, bastões e zarabatanas para lançar ervilhas secas, tornaram-se comuns nas cidades industriais em expansão, como Leeds, Manchester, Sheffield e o leste de Londres.\nOs \"despertadores humanos\" passavam a noite acordados e muitas vezes começavam a despertar as pessoas às 3h, afirma Datta, da Universidade do Norte do Texas. De certa forma, eles também zelavam pela comunidade, acrescenta ela, \"porque percebiam quando havia algo fora do normal, já que circulavam pelas ruas em horários em que a maioria das pessoas estava dormindo\". \nCom o passar do tempo, a fabricação de relógios evoluiu e deu origem a mecanismos de alarme cada vez mais sofisticados\nGetty Images via BBC\nEm 1876, um \"despertador humano\" descobriu um incêndio às 2h da manhã em uma casa em Bradford e acordou a família, que dormia profundamente, salvando suas vidas. Também foi um \"despertador humano\" quem encontrou, em 1888, o corpo de Mary Nichols, a primeira vítima de Jack, o Estripador.\nÀs vezes, os \"despertadores humanos\" eram tão insistentes ao acordar seus clientes que os vizinhos reclamavam e até brigavam, afirma Datta, que pesquisou boletins de ocorrência e reportagens da época. \"Eles também aparecem em muitas revistas e charges\", diz ela. \"Mostrando vizinhos brigando porque foram acordados quando não queriam ser.\"\nProfissões semelhantes também surgiram em outros países europeus no século 19. \"Na Itália, havia os hooters\", diz Datta. \"Na França, os réveilleurs.\" Eles eram ainda menos discretos do que os \"despertadores humanos\": usavam apitos estridentes para acordar seus clientes.\nMary Smith, uma conhecida knocker upper (despertador humano) do leste de Londres, era especialista em lançar ervilhas por um tubo fino para acordar discretamente seus clientes\nAlamy via BBC\nMas na década de 1920 a profissão de \"despertador humano\" praticamente desapareceu, à medida que os despertadores se tornaram mais comuns e acessíveis.\n\"Os despertadores de uso doméstico passaram a ser muito utilizados no fim do século 19 e no início do século 20\", afirma Yaqoot, da Universidade da Sunshine Coast. \"A sua disseminação acompanhou de perto o avanço da industrialização e a adoção da iluminação artificial. As rotinas diárias, que antes eram mais flexíveis, passaram gradualmente a ser organizadas em torno do relógio.\"\nHora certa\nCostuma-se supor que o sono no passado era mais natural e, portanto, mais saudável, afirma Yaqoot. Mas a realidade provavelmente era mais complexa. Fatores como casas cheias ou barulhentas e o trabalho fisicamente exaustivo podem ter influenciado a qualidade do sono.\nAinda assim, alguns aspectos desse período anterior aos despertadores merecem atenção hoje. Um deles, segundo ela, é a maior exposição à luz natural, especialmente pela manhã.\n\"As pesquisas continuam mostrando que a luz da manhã é um dos sinais mais importantes para regular os ritmos circadianos e favorecer um horário de sono saudável\", afirma Yaqoot. A exposição à luz artificial no fim da noite pode produzir o efeito contrário, acrescenta. \"Ela pode atrasar o relógio biológico e dificultar o início do sono.\"\nOutra lição é a importância que as pessoas, no passado, atribuíam a manter horários regulares para dormir e acordar como forma de cuidar da saúde.\n\"Esse é um princípio de cuidado com a saúde presente na literatura médica antiga, desde os gregos antigos até o século 18\", afirma Handley. \"As pessoas levavam muito a sério a necessidade de cuidar do sono e manter horários regulares, talvez mais do que nós hoje.\"\nA exposição à luz artificial durante a noite pode alterar nosso padrão de sono\nGetty Images via BBC\nSegundo Handley, essas práticas estão em sintonia com pesquisas atuais que mostram os riscos à saúde de horários de sono irregulares. Manter uma rotina de sono, acrescenta, também é \"uma maneira muito eficaz de garantir que você acorde praticamente no mesmo horário todos os dias, sem precisar de despertador\".\nTambém podemos aprender com outros hábitos de higiene do sono do passado, afirma Handley, como \"pensar no ambiente do quarto... o que existe ali que favorece um sono reparador, no horário adequado, e o que não favorece\". Ela diz que também é importante prestar atenção ao horário da última refeição e evitar estimulantes, como alimentos ricos em açúcar, nas horas que antecedem o sono.\n\"Esses são hábitos cotidianos que estiveram intimamente ligados aos padrões de sono durante séculos e séculos e que, nos tempos recentes, parecem ter sido um pouco esquecidos.\"", "url": "https://g1.globo.com/saude/noticia/2026/08/08/os-curiosos-metodos-que-as-pessoas-usavam-para-acordar-antes-da-invencao-dos-despertadores-e-dos-celulares.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-08-08T07:02:09+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/dc0guMmj0rvRa43bK_4-E0hgMJU=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/x/P/PEnFl1Rg2j1eYlmqbQPg/imagem-1200px-3-.png", "url_hash": "3a17ce41a4e645e66d8f5d4896983f74", "title_hash": "6ee74c8dd3e5a24d8384d4bffd0fac77", "corroboration": 2, "relevance_score": 0.085, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4975, "headline_en": "Curious Methods People Used to Wake Up Before Alarm Clocks Were Invented", "headline_pt": "Os curiosos métodos usados para acordar antes da invenção dos despertadores", "one_liner_en": "Before alarm clocks, industrial-era workers relied on creative and sometimes bizarre methods to wake up on time.", "one_liner_pt": "Antes dos despertadores, trabalhadores da era industrial usavam métodos criativos e inusitados para acordar.", "category": "Culture", "region": "world", "rationale": "A lighthearted historical feature with broad human-interest appeal.", "low_signal": true}, {"title": "O que esta cidade no deserto pode ensinar ao mundo sobre como combater mortes por calor", "summary": "O condado de Maricopa, no Arizona, registra algumas das temperaturas mais altas dos Estados Unidos, mas conseguiu reduzir o número de mortes provocadas pelo calor", "url": "https://www.bbc.com/portuguese/articles/c5ywq3ezpl4o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-08-08T11:57:13+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/a3ec/live/524b9090-8140-11f1-9fa8-b3da54326712.jpg", "url_hash": "398fbf12d020307fca04acda5be5fb18", "title_hash": "9322fb922ae89492edb4aadbf58217f3", "corroboration": 2, "relevance_score": 0.0393, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4746, "headline_en": "What a Desert City Can Teach the World About Preventing Heat Deaths", "headline_pt": "O que uma cidade no deserto pode ensinar o mundo sobre mortes por calor", "one_liner_en": "Arizona's Maricopa County reduced heat-related deaths despite recording some of the US's highest temperatures.", "one_liner_pt": "O condado de Maricopa, no Arizona, reduziu mortes por calor apesar de registrar algumas das temperaturas mais altas dos EUA.", "category": "Climate", "region": "world", "rationale": "With extreme heat becoming more frequent globally, Maricopa's strategies offer a practical model for other cities.", "low_signal": false}, {"title": "Espanha impõe controles de fronteira a viajantes vindos da Itália em meio a disputa sobre imigração", "summary": "<img src=\"https://s2-g1.glbimg.com/3P_y4u2TFkqJJ_liaBhT76iWFWo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/E/b/vk57xkQaqYMNr1KSBXgQ/crise-ceuta.png\" /><br />     Centenas de migrantes foram fotografados em fila em uma praia em Ceuta para receber ajuda humanitária.\nGETTY IMAGES via BBC\nA Espanha adotou controles de fronteira para todo o tráfego aéreo e marítimo proveniente da Itália, em meio ao agravamento das tensões entre os dois países da União Europeia (UE). \nAs medidas — que começaram a valer à meia-noite deste sábado (08/08) no horário local e durarão um mês — vêm uma semana depois de a Itália ter introduzido restrições semelhantes após a entrada de cerca de 78 mil imigrantes do Marrocos em Ceuta, cidade espanhola localizada no litoral norte da África. \nCom a imposição dos controles fronteiriços, pessoas que entram na Espanha provenientes da Itália precisarão passar por checagem de documentos — algo que não acontece normalmente devido à criação da área de livre circulação na Europa, chamdada de Espaço de Schengen.\nNa sexta-feira (07/08), a Espanha exigiu que a Itália revertesse as verificações até domingo. Roma disse que elas permaneceriam em vigor pelo menos até 15 de agosto — quando, segundo o governo italiano, a Espanha \"espera uma nova onda de imigração\" em Ceuta.\nVEJA TAMBÉM:\nCrise de imigração em Ceuta: União Europeia vai ajudar a Espanha a reforçar o controle nas fronteiras\nA crise colocou o líder de esquerda Espanha, Pedro Sánchez, em conflito com a primeira-ministra conservadora da Itália, Giorgia Meloni — que há muito tempo defende regras de migração mais rígidas para a UE.\nA Itália não compartilha uma fronteira terrestre com a Espanha. Seu governo afirmou na semana passada que a decisão de suspender temporariamente o acordo de livre circulação de pessoas do Espaço Schengen visava impedir que qualquer um dos migrantes que entraram em Ceuta viajasse para a Itália.\nMadri rejeitou essa posição, dizendo que ela se baseava em \"argumentos espúrios\" que careciam de qualquer fundamento, pois os migrantes que entraram em Ceuta não tinham como entrar na área Schengen.\nLEIA TAMBÉM:\nQual a origem da aliança entre EUA e Marrocos — e qual o papel dela na crise migratória de Ceuta\nComo a crise migratória da Espanha gerou uma tempestade política — e foi alimentada pelas redes sociais\nEm sua resposta à ameaça espanhola na sexta-feira, o governo italiano afirmou que não aceitaria \"ultimatos\". Acrescentou que não pretendia \"em hipótese alguma reconsiderar a decisão de suspender a aplicação do Acordo de Schengen para cidadãos de países terceiros que chegam da Espanha, pelo menos até 15 de agosto e, em qualquer caso, até que os riscos de segurança e terrorismo para a Itália sejam completamente eliminados\".\nAutoridades italianas afirmaram que as autoridades locais que realizam as verificações fazem \"todo o possível\" para garantir o máximo conforto tanto para os cidadãos espanhóis quanto para os de outros países europeus que chegam à Itália vindos da Espanha. \nRoma também reiterou que os cidadãos espanhóis estão isentos de verificações adicionais ao chegarem à Itália, sendo essas etapas extras aplicáveis ​​apenas a residentes de países não pertencentes à UE.\nNo entanto, o jornal El País noticiou que vários terminais aeroportuários registraram longas filas e tempos de espera nos últimos dias, com passageiros provenientes da Espanha sendo direcionados a uma fila específica para verificações.\nAs contramedidas que Madri decidiu impor na sexta-feira incluem verificações de passaporte, nacionalidade e visto para passageiros italianos e visitantes de outros países que chegam da Itália \"em meio à persistente pressão migratória irregular\" que o país vem enfrentando, segundo um comunicado do governo espanhol.\nAs verificações permanecerão em vigor até 7 de setembro, \"a menos que uma mudança nas circunstâncias que levaram à sua adoção justifique a modificação desse período\".\nA crise colocou o líder de esquerda Espanha, Pedro Sánchez, em conflito com a primeira-ministra conservadora da Itália, Giorgia Meloni.\nNURPHOTO via GETTY IMAGES/BBC\nSuspensões temporárias do acordo de Schengen não são inéditas. A Itália também mantém controles em sua fronteira com a Eslovênia.\nA decisão da Itália de suspender o acordo de Schengen por um mês foi apoiada pela Finlândia e pela Dinamarca, enquanto a República Tcheca pediu a suspensão temporária da Espanha da zona de livre circulação. \nA maioria dos imigrantes que chegaram a Ceuta na semana passada retornaram ao Marrocos em poucos dias. Acredita-se que cerca de 100 pessoas tenham morrido durante a travessia.\nCerca de 1.400 menores, alguns deles \"meninos e meninas muito jovens\", ainda permanecem em Ceuta.\nA Espanha não anunciou a chegada de uma segunda onda de travessias vindas de Marrocos.\nMas segundo uma reportagem do serviço da BBC em árabe, dezenas de publicações foram feitas no Facebook convocando uma segunda travessia em meados de agosto. Alguns desses posts anunciavam a venda de equipamentos de natação. \nSeis dos grupos onde as postagens estavam sendo publicadas tinham mais de 100.000 seguidores. A Meta afirma ter removido as publicações que violam sua política.\nO gabinete do primeiro-ministro espanhol disse ao jornal El País que estava monitorando a situação, mas afirmou que não esperava uma repetição das cenas da semana passada.\nMigrantes nadando ao redor da cerca da fronteira.\nBBC\nAinda não está claro exatamente por que dezenas de milhares de imigrantes tentaram atravessar para Ceuta, mas o Comissário Europeu para as Migrações, Magnus Brunner, sugeriu que as redes criminosas que espalham desinformação foram as culpadas – uma afirmação com a qual o governo espanhol concordou.\nA onda de travessias recente ocorreu após a Suprema Corte da Espanha decidir que imigrantes interceptados no mar enquanto tentam chegar a Ceuta ou Melilla, outro enclave espanhol, não podem ser sumariamente devolvidos a Marrocos.\nMarrocos, por sua vez, atribuiu a culpa pela crise ao tribunal, com uma fonte governamental não identificada informando à imprensa local que \"o elemento dissuasor do sistema entrou em colapso e a barragem cedeu, não sob o peso dos criminosos, mas sim sob a decisão de um juiz\".\nO grande número de pessoas nadando para Ceuta ao mesmo tempo também levantou questionamentos sobre por que os guardas na fronteira do Marrocos não tentaram impedir os imigrantes, \nOs dois enclaves são há muito tempo um pomo da discórdia diplomática entre a Espanha e o Marrocos, que não reconhece a soberania espanhola sobre eles.", "url": "https://g1.globo.com/mundo/noticia/2026/08/08/espanha-impoe-controles-de-fronteira-a-viajantes-vindos-da-italia-em-meio-a-disputa-sobre-imigracao.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-08-08T11:14:01+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/3P_y4u2TFkqJJ_liaBhT76iWFWo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/E/b/vk57xkQaqYMNr1KSBXgQ/crise-ceuta.png", "url_hash": "c5710708275d1feb7eb2d2f7d1fa6551", "title_hash": "8ac75dd561ea962e623de04a49aaaf71", "corroboration": 2, "relevance_score": 0.0386, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4743, "headline_en": "Spain Imposes Border Controls on Travelers from Italy Amid Immigration Dispute", "headline_pt": "Espanha impõe controles de fronteira a viajantes vindos da Itália em disputa migratória", "one_liner_en": "Spain and Italy are locked in a border control standoff triggered by thousands of migrants crossing through Ceuta.", "one_liner_pt": "Espanha e Itália estão em conflito de controles de fronteira após travessia massiva de migrantes por Ceuta.", "category": "Geopolitics", "region": "world", "rationale": "Near-duplicate of index 2 from a different outlet.", "low_signal": true}, {"title": "O que esta cidade no deserto pode ensinar ao mundo sobre como combater mortes por calor", "summary": "<img src=\"https://s2-g1.glbimg.com/ExCxszZ7rsrcwV0kRV1SAHqgVL8=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/S/o/0Hp7ClTsKv5DjBnVC0Rw/globo-canal-4-20260709-2000-frame-95896.jpeg\" /><br />     Cientistas alertam que temperaturas extremas como essas tendem a se tornar o \"novo normal\" nessas regiões.\nGETTY IMAGES via BBC\nGrande parte dos Estados Unidos e da Europa tem enfrentado um verão de calor extremo.\nCientistas alertam que temperaturas extremas como essas tendem a se tornar o \"novo normal\" nessas regiões.\nNa França, estima-se que mais de 2.000 pessoas morreram em decorrência da onda de calor recorde do fim de junho. Na Inglaterra e no País de Gales, estima-se que mais de 2.700 pessoas possam ter morrido em decorrência das sucessivas ondas de calor registradas desde maio.\nNos Estados Unidos, pelo menos 44 mortes associadas ao calor foram registradas durante o fim de semana do feriado de 4 de Julho, quando o país enfrentou temperaturas extremas.\nAgora no g1\nO Brasil também tem enfrentado episódios de calor extremo. No fim de 2025, por exemplo, uma onda de calor levou o Instituto Nacional de Meteorologia (Inmet) a emitir alerta vermelho para áreas do Centro-Sul do país, após vários dias de temperaturas muito acima da média e recordes em cidades como São Paulo e Rio de Janeiro.\nPara muita gente, esse aumento das temperaturas foi um choque. É uma nova realidade à qual as pessoas precisam se adaptar, à medida que eventos climáticos extremos se tornam mais frequentes e intensos por causa das mudanças climáticas.\n\"As pessoas não percebem que este não é o mesmo calor de dez anos atrás. Hoje, ele é mais intenso porque, em muitos lugares, as temperaturas já não caem durante a noite\", disse Jennifer Marlon, pesquisadora da Universidade de Yale, nos EUA, que estuda os impactos do calor extremo, em entrevista à BBC.\nNosso organismo depende das temperaturas mais amenas durante a noite para se recuperar do calor acumulado ao longo do dia.\nMas, para uma cidade dos EUA em particular, o calor intenso não é novidade. Há anos, autoridades de Phoenix, no Arizona, vêm adotando medidas para reduzir as mortes provocadas pelas altas temperaturas. A estratégia parece estar dando resultado e pode servir de modelo para outras partes do mundo.\nO condado de Maricopa, onde fica Phoenix, registra algumas das temperaturas mais altas dos EUA. Por isso, está na linha de frente das iniciativas para proteger a população do calor extremo, com programas que oferecem acesso a centros de resfriamento e aparelhos de ar-condicionado gratuitos.\nPhoenix foi a primeira cidade do mundo a criar, em 2021, o cargo de diretor de calor extremo. \"Temos a vantagem de saber que o calor extremo será um problema todos os anos. Mas ele está se tornando cada vez mais grave e também mais previsível em comunidades de todo o mundo\", disse Nicholas Staab, diretor médico do condado de Maricopa, à BBC.\nDesde o início da era industrial, a temperatura média global já subiu mais de 1,1°C e continuará aumentando por algum tempo.\nGETTY IMAGES via BBC\nOs esforços do condado para reduzir as mortes provocadas pelo calor têm dado resultado nos últimos anos. Depois de atingir o pico de 645 mortes em 2023, o número caiu para 405 em 2025. Muitos especialistas atribuem parte dessa redução às mudanças nas políticas públicas.\nGrande parte das iniciativas se concentra em ampliar o acesso ao ar-condicionado, já que muitas das vítimas eram pessoas de baixa renda ou em situação de rua. Idosos, crianças e pessoas com doenças crônicas exigem atenção especial durante as ondas de calor.\nO condado mantém centros climatizados abertos ao público de forma contínua. O horário de funcionamento desses espaços também foi ampliado e, em alguns casos, eles operam 24 horas por dia, oferecendo abrigo para quem precisa sair das ruas e escapar do calor.\nOutro programa oferece reparos ou a substituição de aparelhos de ar-condicionado para moradores que atendem aos critérios de elegibilidade dessas políticas públicas.\n\"O mundo tem muito a aprender com o condado de Maricopa\", afirma Marlon, da Universidade de Yale.\nMas ainda não há certezas sobre o impacto dessas medidas, e a tendência de queda das mortes pode não se manter.\nAté 11 de julho deste ano, o condado de Maricopa havia registrado 23 mortes relacionadas ao calor, enquanto outras 282 ainda estavam sob investigação. Se todos esses casos forem confirmados, o total poderá superar o registrado no ano anterior.\nA estratégia do Arizona pode ser reproduzida em outros lugares?\nLadd Keith, diretor da Iniciativa de Resiliência ao Calor da Universidade do Arizona, disse à BBC que outras cidades poderiam seguir o exemplo de Phoenix e criar o cargo de responsável pelas políticas de calor extremo, encarregado de coordenar iniciativas e a comunicação entre diferentes órgãos do governo.\n\"É fundamental que alguém seja responsável por essa questão. Se não for responsabilidade de ninguém, ninguém vai enfrentá-la\", disse Keith à BBC.\nCom coordenação e planejamento, cidades de outras regiões dos EUA, menos acostumadas ao calor intenso, também poderiam criar centros climatizados, afirma Marlon, da Universidade de Yale.\nMas, para isso, é preciso que a população e os governos reconheçam a gravidade do problema e entendam que ele não é passageiro, dizem os especialistas.\nAs ondas de calor se tornaram mais frequentes, mais intensas e mais duradouras em razão das mudanças climáticas provocadas pela atividade humana. Desde o início da era industrial, a temperatura média global já subiu mais de 1,1°C e continuará aumentando por algum tempo, mesmo que os governos adotem cortes expressivos nas emissões de gases de efeito estufa.\nTambém é essencial que cidades e governos entendam que o calor extremo não é apenas um problema de saúde pública, mas também de infraestrutura e da economia, segundo os especialistas.\nEstradas continuarão a sofrer deformações e voos seguirão sendo afetados pelo calor extremo, alerta Marlon, da Universidade de Yale.\nAcima de tudo, diz Keith, da Universidade do Arizona, é fundamental que as pessoas compreendam que esse calor intenso veio para ficar.\n\"Precisamos deixar de planejar com base no calor que enfrentamos no passado e começar a nos preparar para o calor que teremos nos próximos cinco a dez anos\", afirma. \"Se as pessoas acham que está ruim agora, vai ficar mais quente e por mais tempo. Os recordes de temperatura continuarão sendo quebrados, praticamente todos os anos, em diferentes partes do mundo.\"", "url": "https://g1.globo.com/meio-ambiente/noticia/2026/08/08/o-que-esta-cidade-no-deserto-pode-ensinar-ao-mundo-sobre-como-combater-mortes-por-calor.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-08-08T12:27:00+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/ExCxszZ7rsrcwV0kRV1SAHqgVL8=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/S/o/0Hp7ClTsKv5DjBnVC0Rw/globo-canal-4-20260709-2000-frame-95896.jpeg", "url_hash": "86d2e7f3ab4cf8c3394b7879d84617c6", "title_hash": "9322fb922ae89492edb4aadbf58217f3", "corroboration": 2, "relevance_score": 0.0366, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4733, "headline_en": "What a Desert City Can Teach the World About Preventing Heat Deaths", "headline_pt": "O que uma cidade no deserto pode ensinar o mundo sobre mortes por calor", "one_liner_en": "Scientists war aisagens naturais e um clima ameno que tornou a cidade conhecida como \"Suíça brasileira\". \nMas a cidade mais alta do país guarda uma trajetória bem mais brasileira e menos conhecida: fundada por portugueses, foi desenvolvida com a contribuição de famílias nordestinas que ajudaram a moldar um dos principais destinos turísticos de inverno do país.\n🧳A cidade estima que vai receber 6 milhões de visitantes neste ano. Somente durante a temporada de inverno, são aproximadamente 2,2 milhões de turistas circulando pelo município.\nCampos do Jordão foi fundada em 1874 pelo português Matheus da Costa Pinto que adquiriu a terra para uma fazenda de gado. Já a ocupação da cidade no topo da Serra da Mantiqueira ganhou ritmo acelerado na década de 1920, inicialmente, com outra vocação.\nSegundo o historiador Edmundo Rocha Campos, Campos do Jordão passou a atrair pacientes com tuberculose em uma época em que ainda não existiam medicamentos eficazes contra a doença. Sobretudo entre as décadas de 1940 e 1960, o clima frio, o ar da serra, a alimentação e o repouso eram considerados aliados no tratamento.\nO especialista explica que o turismo começou a se desenvolver nesse período, impulsionado pelas visitas de familiares e amigos dos pacientes internados. Encantados com as paisagens locais, muitos passaram a divulgar a cidade, ajudando a atrair novos visitantes. Com o declínio da atividade sanatorial, o turismo se consolidou como a principal vocação econômica do município.\n📖✒️Os primeiros registros de povoado em Campos do Jordão são associados à ordem da Corte portuguesa, que abriu caminho onde hoje é a cidade para transportar ouro das minas de Itajubá (MG) a Pindamonhangaba (SP). \nApesar de o caminho ter sido fechado depois, Gaspar Vaz permaneceu na região, vendendo a terra para o Brigadeiro também português, Manuel Rodrigues Jordão - que deu nome à cidade -, até a terra ser adquirida por Matheus. (veja os ciclos de povoamento da cidade no infográfico abaixo)\n🏔️❄️Por que Suíça brasileira? \nCentro do Capivari em Campos do Jordão\nRenan William/Vanguarda Repórter\nProfessora de Arquitetura e Urbanismo da Universidade Estadual de Minas Gerais e ex-professora de Instituto Federal de São Paulo (IFSP) em Campos do Jordão, Agnes Yuri Uehara Bezerra ressalta uma mudança quando o município entrou no ciclo do turismo: a inspiração na arquitetura de países com climas parecidos, como a Suíça, para adotar um sistema construtivo. Mas ela diz  que o estilo da cidade pode ser considerado \"eclético\". \n \"'O que se verificou ao longo de mais um século, e que perdura até hoje, foi uma verdadeira mistura de padrões, quase sempre trazidos de fora pela forte influência da migração estrangeira no pós-Segunda Guerra Mundial\", disse.\nSegundo ela, entre os exemplos dessa mistura estão os chalés no estilo suíço, como o Hotel Toriba, ou adaptado da arquitetura Tudor, de origem inglesa. \n'\"O arquiteto polonês que projetou o Palácio Boa Vista se inspirou justamente nesse estilo para erguer a construção. Já no portal da cidade, a gente encontra a imitação da técnica construtiva do enxaimel, do estilo normando, conhecido como falso enxaimel\", explicou.\n🏠 enxaimel é uma técnica construtiva que deixa aparente a estrutura formando desenhos geométricos nas fachada. Entre os espaços criados pelas vigas, são utilizados materiais como tijolos ou pedras para preencher as paredes.\nPalácio da Boa Vista é a resid~encia de inverno do governador de SP e também é museu aberto ao público\nDivulgação/Governo de SP\nInfográfico: características e fluxos migratórios em Campos do Jordão, SP\nArte/g1\nPortugueses da serra\nO desenvolvimento de Campos do Jordão ganhou impulso com a construção da Estrada de Ferro Campos do Jordão, inaugurada em 1914. Segundo Edmundo Rocha Campos, a obra foi liderada pelo português Sebastião de Oliveira Damas, que trouxe trabalhadores de Castelo de Paiva, em Portugal, para ajudar na construção da linha férrea.\nUma dessas famílias é a do empresário Nelson Gonçalves, que começou a chegar à cidade ainda na época dos sanatórios \"Meu tio veio pra se curar, acabou se estabelecendo aqui. Minha mãe e meu pai vieram pra ajudar e montaram o comércio próprio\", contou. \nEle afirma que são muitos os descendentes de portugueses em Campos e que, até hoje, mantêm uma forte união. \n\"Durante muitos anos, a comunidade se organizava para ajudar famílias portuguesas da cidade. Era uma colônia presente.\"\nAssim como outros descendentes de portugueses na cidade, a família de Nelson passou a preservar as tradições portuguesas por meio da gastronomia. Além do bacalhau, o restaurante da família serve pratos típicos como alheira e borrego. \nO empresário descendente de portugueses, Nelson Gonçalves, replica a cultura lusitana\nArquivo pessoal\n🥧Culinária alemã\nMas a culinária da cidade também tem uma grande influência alemã. Os alemães chegaram a Campos do Jordão em um momento diferente dos portugueses. \nSegundo o historiador Edmundo Rocha Campos, parte deles veio para a cidade após a chegada do navio alemão Windhuk ao Brasil, em 1939. Inicialmente retidos em campos de concentração, ao chegarem em solo brasileiro, parcela foi para  Campos do Jordão para trabalhar principalmente na hotelaria. Eles também ajudaram a consolidar a gastronomia e a infraestrutura turística do município. \nEntre os legados deixados por essas famílias estão receitas que se tornaram marcas da cidade, como o apfelstrudel (foto abaixo), além de contribuições para a cultura gastronômica associada ao inverno jordanense.\nApfelstrudel - folhado de maçã tradicional na Alemanha e Áustria\nPixabay\n🏗️Nordestinos erguem a cidade \nCom o crescimento de Campos do Jordão a partir da década de 1960,  operários nordestinos passaram a chegar à cidade para trabalhar na construção civil. \nSegundo o historiador Edmundo Rocha Campos, muitos vieram da Bahia e participaram da construção de hotéis, sanatórios e casas de temporada.\nFoto de 1960 mostra o aspecto da cidade no fim era sanatorial, em 1960; no detalhe a Estação Ferroviária de Campos do Jordão\nAcervo IBGE\nPresidente da Associação dos Nordestinos e dono de uma rádio em Campos do Jordão,  Cicero Roberto Rodrigues da Silva chegou de Ingá, na Paraíba, no início da década de 1990 para ser zelador. Seguiu os passos do pai, que já estava na cidade trabalhando em um hotel.  \nAos poucos, a família também foi se mudando. E hoje ele tem dois filhos jordanenses. \n\"Muita gente veio de fora para trabalhar e construir a vida aqui. Eu sou uma dessas pessoas e tenho muita gratidão por Campos do Jordão, porque foi a cidade que acolheu a minha família e nos permitiu construir nossa história\", afirmou.\nInfográfico: nordestinos migraram para viver em Campos do Jordão, SP\nArte/g1\n🔺Apesar da comunidade mineira ser a maior em Campos do Jordão, diferente da comunidade nordestina, a migração de mineiros é explicada pela geografia e ligação cultural. \nA cidade faz limite com três municípios mineiros - Brazópolis, Piranguçu e Wenceslau Braz. Essa localização favoreceu a circulação natural de pessoas, produtos e trabalhadores do Sul de Minas. Já os nordestinos chegaram em um período de aquecimento na construção civil, após o período sanatorial.\nHorto Florestal, em Campos do Jordão\nDivulgação/Parque Estadual de Campos do Jordão\nEstação Inverno: programa exibido pela TV Vanguarda mostra o melhor do inverno no Vale do Paraíba e região\n*(Estagiárias sob supervisão de Eduardo Vallim)", "url": "https://g1.globo.com/sp/vale-do-paraiba-regiao/inverno/2026/noticia/2026/08/08/a-historia-por-tras-da-suica-brasileira-como-portugueses-e-nordestinos-moldaram-campos-do-jordao.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-08-08T07:01:12+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/mD8JBm3-6PhzXSOOmLdpwoAQyVU=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/Z/5/IB0lfpS6qqkdSeHz7t5A/boa-vista.jpg", "url_hash": "2812b9f512995e66e03b6d607   if (code===2)           return t('partly_cloudy');

  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

// ── Masthead ─────────────────────────────────────────────────────────
function renderMasthead() {

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}
