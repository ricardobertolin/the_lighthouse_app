<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}
/* Reading-history export — feeds `python -m digest --ingest-clicks` */
.reading-log{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:16px;
}
.reading-log button{
  font:inherit;letter-spacing:1px;text-transform:uppercase;
  background:none;border:1px solid var(--m3);color:var(--m3);
  padding:3px 9px;margin-left:8px;cursor:pointer;
}
.reading-log button:hover{ background:var(--ink);color:var(--paper);border-color:var(--ink); }
.reading-log[hidden]{ display:none; }

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

  </filter>
</svg>

<div class="sheet">

  <div class="mast-vol">

ening a chapel in Rebouças in the Centro-Sul.", "one_liner_pt": "O temporal de quinta-feira causou estragos em várias regiões do Paraná e derrubou uma capela em Rebouças.", "category": "Climate", "region": "curitiba", "rationale": "Severe weather caused visible destruction across Paraná communities.", "low_signal": false}, {"title": "Trump critica vencedora do Nobel da Paz e diz que deveria ter vencido o prêmio: 'Que absurdo!'", "summary": "<img src=\"https://s2-g1.glbimg.com/QCGPIEydovbdfQZ8XmgMBihWkks=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/9/T/Uv6YAaQS2N2tjxzP5sUQ/meow-meow-meow-meow-68-.png\" /><br />     EUA aplicam novas sanções contra Tribunal Penal Internacional, após anúncio do prêmio Nobel da Paz ex-juíza da corte\nO presidente dos Estados Unidos, Donald Trump, voltou a criticar a escolha do Nobel da Paz de 2026 na madrugada deste sábado (10). Em publicação na rede Truth Social, o republicano atacou a jurista sul-africana Navi Pillay, vencedora do prêmio, e afirmou que ele próprio deveria ter sido laureado. Pillay ajudou a garantir, em 1973, o direito de presos políticos mantidos na Ilha Robben, na África do Sul, de ter acesso a advogados. Entre eles estava Nelson Mandela, que cumpria pena na prisão durante o regime do apartheid.\n“Os Estados Unidos da América, representados por mim, como seu presidente, deveriam ter recebido o Prêmio Nobel da Paz, mas não receberam”, escreveu Trump.\nO presidente afirmou ter “resolvido oito guerras”, estar perto de encerrar outros dois conflitos e ter garantido a liberdade de reféns e presos políticos. Também disse ter impedido o Irã de desenvolver uma arma nuclear e criticou o Comitê Norueguês do Nobel, classificando a decisão como “uma mancha inesquecível da Noruega”.\nAs declarações sobre os conflitos refletem a versão de Trump sobre sua atuação diplomática. A resolução de disputas internacionais não significa, necessariamente, que todos os conflitos tenham sido encerrados de forma definitiva.\n“Na verdade, eu deveria ter ganhado oito Prêmios Nobel da Paz, não apenas um”, afirmou.\n➡️ Os oito conflitos citados por Trump são: Camboja e Tailândia; Kosovo e Sérvia; República Democrática do Congo e Ruanda; Paquistão e Índia; Israel e Irã; Egito e Etiópia; Armênia e Azerbaijão; e Israel e Hamas.\nCríticas foram direcionadas\nAo atacar diretamente a vencedora do Nobel, Trump afirmou que “ninguém a conhecia” e disse que ela “obviamente odeia Israel”. \nPillay presidiu uma comissão independente de inquérito da ONU que concluiu, em 2025, que Israel cometeu genocídio na Faixa de Gaza. A conclusão foi rejeitada por Israel e rechaçada por Washington. Não somente: a jurista também foi juíza do Tribunal Penal Internacional (TPI) nos anos 2000 e ocupou o cargo de alta-comissária das Nações Unidas para os Direitos Humanos. \nA atuação de tribunais internacionais está entre os pontos de atrito entre o governo Trump e instituições multilaterais. E, Na sexta-feira (9), horas após o anúncio do Nobel da Paz, os Estados Unidos anunciaram novas sanções contra o TPI. A medida busca pressionar a Corte e pode afetar pessoas e organizações que prestam serviços ou colaboram com o tribunal.\nO que é o Tribunal Penal Internacional, alvo de sanção dos EUA após Nobel da Paz\nO secretário de Estado americano, Marco Rubio, justificou as sanções com o que chamou de ameaças aos cidadãos dos Estados Unidos, em referência à possibilidade de americanos serem alvo de processos internacionais. “Ou o TPI acabará com suas ameaças, ou nós acabaremos com o TPI”, afirmou Rubio. O secretário também pediu que aliados dos Estados Unidos pressionem a Corte.\n“O Prêmio Nobel foi concedido hoje a uma pessoa liberal que trabalha nas Nações Unidas, de quem ninguém nunca ouviu falar. Em todas as guerras que resolvi, nunca falei com as Nações Unidas — elas não me ajudaram em nada”, escreveu em seu desabafo.\nNobel da Paz como recado internacional\nA escolha de Navi Pillay também foi apresentada pelo Comitê Norueguês do Nobel como uma mensagem em defesa da ordem jurídica internacional. Questionado por uma jornalista se a premiação era um recado ao mundo, o presidente do comitê, Jørgen Watne Frydnes, afirmou, sem citar Trump, que o prêmio era um sinal “àqueles que estão atacando e enfraquecendo o sistema internacional”.\nNo comunicado, o comitê destacou a trajetória da jurista na defesa dos direitos humanos e do direito internacional. “O compromisso de Navi Pillay com os princípios jurídicos universais e sua firme bússola moral são constantes ao longo de sua extensa carreira”, afirmou Frydnes.\nNavi Pillay é a ganhadora do Nobel da Paz de 2026\nNascida em Durban, na África do Sul, em uma família de origem tâmil indiana, Pillay construiu sua carreira jurídica durante o apartheid, enfrentando a discriminação racial e as barreiras impostas às mulheres. Entre os principais marcos de sua trajetória estão:\nDefesa de presos políticos: ajudou a garantir o acesso de presos da Ilha Robben, incluindo Nelson Mandela, a advogados, em 1973;\nPioneirismo na Justiça sul-africana: tornou-se a primeira mulher não branca a abrir um escritório de advocacia na província de Natal e, posteriormente, foi nomeada para a Suprema Corte da África do Sul;\nTribunal para Ruanda: presidiu o Tribunal Penal Internacional para Ruanda, que julgou crimes cometidos durante o genocídio de 1994;\nDireitos humanos na ONU: foi alta-comissária das Nações Unidas para os Direitos Humanos;\nInvestigação sobre Gaza: presidiu a comissão independente de inquérito da ONU que concluiu, em 2025, que Israel cometeu genocídio na Faixa de Gaza.\nPillay é a 21ª mulher a receber o Nobel da Paz, em um total de 144 laureados individuais e organizações, conforme a contagem histórica do prêmio. A honraria inclui uma medalha, um diploma e um valor em dinheiro de 11 milhões de coroas suecas.\nDonald Trump impôs sanções ao Tribunal Penal Internacional após Navi Pillay ganhar Nobel da Paz.\nFabrice Coffrini/AFP", "url  "https://media.gazetadopovo.com.br/2026/10/09161627/panama-terremoto-960x540.jpg", "url_hash": "75212a594afe86a47d7c220978a98957", "title_hash": "5b18fa0656d0351693cf851178f177fb", "corroboration": 2, "relevance_score": 1.9262, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.7073, "headline_en": "Magnitude 7.7 earthquake hits Panama, triggering tsunami alerts", "headline_pt": "Terremoto de magnitude 7,7 atinge o Panamá e provoca alertas de tsunami", "one_liner_en": "Authorities are assessing damage and casualties after the powerful quake prompted regional tsunami warnings.", "one_liner_pt": "Autoridades avaliam danos e vítimas após o forte tremor provocar alertas de tsunami na região.", "category": "Other", "region": "world", "rationale": "A major earthquake with tsunami risk threatens lives across Central America.", "low_signal": false}, {"title": "Terremoto no Panamá tem mais de 80 réplicas; entenda por que a terra continua tremendo e se é possível prever novos abalos", "summary": "<img src=\"https://s2-g1.glbimg.com/UezYXwo92rgvPgKSnCecjFeF1_Q=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/M/u/6Z4wsjR4Sp8CyKXlvNfQ/globo-canal-4-20261009-2000-frame-129954.jpeg\" /><br />     Terremoto de magnitude 7,7 atinge o Panamá e gera alerta de tsunami na América Latina\nO terremoto de magnitude 7,7 que atingiu o Panamá na sexta-feira (9) foi seguido por mais de 80 réplicas, segundo dados divulgados neste sábado (10). Entre os novos tremores, houve um de magnitude superior a 6,0, forte o suficiente para provocar novos danos em áreas já afetadas pelo primeiro abalo.\nO terremoto principal deixou ao menos 27 feridos, provocou desabamentos e danificou estradas e edifícios. Os maiores estragos foram registrados no centro do país, mas os tremores também foram sentidos na capital, a cerca de 200 quilômetros do epicentro.\nLEIA TAMBÉM:\nTerremoto no Panamá: veja FOTOS e VÍDEOS de tremor de magnitude 7,7\nTerremoto no Panamá: VÍDEO mostra cabos de ponte mexendo durante tremor\nA sequência de abalos é comum após terremotos de grande magnitude e pode continuar por semanas, meses ou até anos. Isso acontece porque a movimentação das rochas no subsolo não termina necessariamente com o primeiro tremor.\nMas por que a terra continua tremendo? As réplicas podem ser tão fortes quanto o terremoto inicial? E é possível saber quando haverá outro abalo?\nTerremoto de magnitude 7.7 atinge o Panamá e deixa a costa do Pacífico em alerta para tsunamis\nJornal Nacional/ Reprodução\nPor que acontecem réplicas?\nOs terremotos ocorrem quando a tensão acumulada nas rochas da crosta terrestre é liberada repentinamente, geralmente ao longo de falhas geológicas.\nA superfície do planeta é formada por grandes blocos chamados placas tectônicas, que se movimentam lentamente, alguns centímetros por ano. Em determinadas regiões, essas placas se chocam, se afastam ou deslizam umas em relação às outras.\nEmbora o movimento seja contínuo, as rochas podem ficar presas devido ao atrito. A pressão aumenta até que parte delas se rompe ou desliza bruscamente, liberando energia na forma de ondas sísmicas que fazem o solo tremer.\nO terremoto principal, porém, altera a distribuição das tensões nas rochas ao redor da falha. Com isso, outras partes da região podem sofrer novos deslocamentos, produzindo os chamados tremores secundários, ou réplicas.\nSegundo o Serviço Geológico dos Estados Unidos (USGS), esses abalos fazem parte do processo de reajuste das rochas após a ruptura inicial.\nApresentadores fogem de terremoto no Panamá\nReprodução\nRéplicas podem ser mais fortes que o primeiro terremoto?\nEm geral, as réplicas têm magnitude inferior à do terremoto principal, mas isso não significa que sejam inofensivas.\nMesmo um tremor menos intenso pode derrubar estruturas que ficaram comprometidas pelo primeiro abalo, provocar novos deslizamentos e ampliar os danos em uma região.\nTambém é possível que um terremoto seja seguido por outro ainda mais forte, embora isso seja menos comum.\nQuando isso acontece na mesma sequência sísmica, o primeiro tremor passa a ser classificado como um abalo precursor, e o evento de maior magnitude assume a condição de terremoto principal.\nPor isso, a ocorrência de várias réplicas não permite concluir, por si só, que um novo terremoto de grande magnitude esteja prestes a acontecer.\nApresentadores abandonam programa ao vivo durante terremoto\nReprodução/RPC\nQuanto tempo as réplicas podem durar?\nNão existe um prazo fixo para que os tremores secundários terminem.\nDe acordo com o USGS, as réplicas são normalmente mais frequentes nas primeiras horas e nos primeiros dias depois do terremoto principal. Com o passar do tempo, a quantidade de novos abalos tende a diminuir.\nIsso não significa, porém, que cada réplica será mais fraca que a anterior. O padrão de redução se refere principalmente à frequência dos terremotos, não necessariamente à magnitude de cada um.\nEm terremotos muito fortes, os tremores secundários podem continuar durante meses ou até anos, embora se tornem progressivamente menos frequentes.\nA quantidade e a duração das réplicas dependem de fatores como a magnitude do primeiro terremoto, as características das falhas geológicas e as condições da região atingida.\nÉ possível prever quando ocorrerá outro terremoto?\nApesar dos avanços no monitoramento sísmico, a ciência ainda não consegue prever com precisão quando, onde e com qual magnitude ocorrerá um terremoto.\nO que os especialistas conseguem fazer é identificar regiões mais vulneráveis e calcular a probabilidade de novos abalos com base nos registros sísmicos e nas características geológicas de cada área.\nDepois de um grande terremoto, também é possível estimar a frequência esperada de réplicas e a probabilidade de tremores de diferentes magnitudes. Essas estimativas são atualizadas conforme novos abalos são registrados.\nMas isso é diferente de prever exatamente quando a terra voltará a tremer.\nAlguns países dispõem de sistemas de alerta que identificam um terremoto logo após seu início e podem avisar a população segundos antes de as ondas sísmicas mais intensas chegarem a determinadas localidades. Esses sistemas, no entanto, não antecipam a ocorrência do terremoto.\nComo se proteger durante as réplicas?\nO principal risco dos tremores secundários está nas estruturas que já foram danificadas pelo terremoto inicial.\nPrédios com rachaduras, partes comprometidas ou risco de desabamento podem não resistir a novos movimentos do solo.\nPor isso, as autoridades de proteção civil recomendam evitar o acesso a imóveis danificados até que sejam avaliados por profissionais habilitados.\nDurante um novo tremor, a orientação é abaixar-se, proteger a cabeça e o pescoço e, se possível, abrigar-se debaixo de uma mesa resistente até que o movimento termine.\nEm áreas costeiras, tremores fortes ou prolongados também exigem atenção ao risco de tsunami e às orientações das autoridades locais.\nComo os terremotos não podem ser previstos com precisão, a principal forma de reduzir suas consequências continua sendo a preparação das cidades, especialmente por meio de construções resistentes a abalos sísmicos, fiscalização de estruturas e planos de emergência.\n*Com Deutsche Welle", "url": "https://g1.globo.com/meio-ambiente/noticia/2026/10/10/terremoto-no-panama-tem-mais-de-80-replicas-entenda-por-que-a-terra-continua-tremendo-e-se-e-possivel-prever-novos-abalos.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-10-10T14:14:07+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/UezYXwo92rgvPgKSnCecjFeF1_Q=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/M/u/6Z4wsjR4Sp8CyKXlvNfQ/globo-canal-4-20261009-2000-frame-129954.jpeg", "url_hash": "a5a0a33e3fa5e9e3f638c324835ac738", "title_hash": "558c1ce0e20886ea3a9b275719a2d99c", "corroboration": 2, "relevance_score": 1.816, "reputation_score": 0.85, "corroboration_score": 1 // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
// The scene and the headline label come from the *current* observation when we
// have one. The daily weathercode is the most severe condition anywhere in the
// 24h window, so using it alone made a calm drizzly morning render as a
// thunderstorm. The hi/lo/wind stats stay on the daily outlook.
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.current_code != null ? w.current_code
               : (w.wmo_code != null ? w.wmo_code : 3);
  const precip = w.current_code != null ? (w.precip_now_mm || 0)
                                        : (w.precipitation_mm || 0);
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// The page is a static file generated once a day, so the baked forecast goes
// stale within hours. Open-Meteo is keyless and CORS-enabled, so refresh the
// card straight from the browser. On any failure we silently keep the baked
// values.
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=-25.4297&longitude=-49.2711&current=temperature_2m%2Capparent_temperature%2Crelative_humidity_2m%2Cprecipitation%2Cweathercode%2Cwindspeed_10m&daily=weathercode%2Ctemperature_2m_max%2Ctemperature_2m_min%2Cprecipitation_sum%2Cprecipitation_probability_max%2Cwindspeed_10m_max&timezone=America%2FSao_Paulo&forecast_days=1';

function refreshWeather() {
  // --weather previews bake a fixed condition on purpose; don't clobber it.
  if (DATA.live_weather === false) return;
  fetch(WX_URL, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      const daily = d.daily || {};
      const cur   = d.current || {};
      const first = (k) => (daily[k] && daily[k].length ? daily[k][0] : null);
      DATA.weather = Object.assign({}, DATA.weather, {
        temp_max:         first('temperature_2m_max'),
        temp_min:         first('temperature_2m_min'),
        precipitation_mm: first('precipitation_sum'),
        precip_prob:      first('precipitation_probability_max'),
        wind_max_kmh:     first('windspeed_10m_max'),
        wmo_code:         first('weathercode'),
        temp_now:         cur.temperature_2m,
        feels_like:       cur.apparent_temperature,
        humidity:         cur.relative_humidity_2m,
        precip_now_mm:    cur.precipitation,
        wind_now_kmh:     cur.windspeed_10m,
        current_code:     cur.weathercode,
        observed_at:      cur.time,
      });
      renderWeather();
    })
    .catch(() => {});
}

function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  const maxRel = Math.max(...DATA.articles.map(a => a.relevance_score || 0), 0.01);
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round(((art.relevance_score || 0) / maxRel) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
        '<div class="art-actions">' +
          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
// The page is static (GitHub Pages), so there is nowhere to POST to. Clicks
// accumulate here and are exported as a file that the pipeline imports with
// `python -m digest --ingest-clicks`, which feeds the interest centroid used
// for relevance scoring.
const CLICK_KEY = 'tl_clicks';

function readClicks() {
  try { return JSON.parse(localStorage.getItem(CLICK_KEY) || '[]'); }
  catch(_) { return []; }
}

function trackClick(url, domain) {
  try {
    const clicks = readClicks();
    clicks.push({ url: url, domain: domain, at: new Date().toISOString() });
    if (clicks.length > 2000) clicks.splice(0, clicks.length - 2000);
    localStorage.setItem(CLICK_KEY, JSON.stringify(clicks));
    updateReadingLog();
  } catch(_) {}
}

function updateReadingLog() {
  const clicks = readClicks();
  const box = document.getElementById('j-reading-log');
  if (!box) return;
  box.hidden = clicks.length === 0;
  const label = document.getElementById('j-reading-count');
  if (label) label.textContent = clicks.length + ' ' + t('readingLog');
}

function exportClicks() {
  const clicks = readClicks();
  if (!clicks.length) return;
  const blob = new Blob([JSON.stringify(clicks, null, 2)], { type: 'application/json' });
  const stamp = new Date().toISOString().slice(0, 10);
  _dlBlob(blob, 'lighthouse-clicks-' + stamp + '.json');
  _flashBtn(document.getElementById('j-export-clicks'));
}

function clearClicks() {
  if (!confirm(t('clearConfirm'))) return;
  try { localStorage.removeItem(CLICK_KEY); } catch(_) {}
  updateReadingLog();
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  refreshWeather();
  // Static page, long-lived tab: keep the card honest.
  setInterval(refreshWeather, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) refreshWeather();
  });
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();
  updateReadingLog();

  document.getElementById('j-export-clicks').addEventListener('click', exportClicks);
  document.getElementById('j-clear-clicks').addEventListener('click', clearClicks);

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
