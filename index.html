<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
      <button id="j-lang-pt" class="lang-btn" onclick="setLang('pt')">PT</button>

        <span class="fx-kicker" id="j-fx-kicker">The Weather</span>

const DATA = {"date": "2026-06-24", "intro_en": "Today's news is dominated by geopolitical tension around Trump's interest in Brazil's 2026 election and Colombia's new right-wing president, while a deadly heat dome grips Europe. Locally, Curitiba celebrates a new direct flight to Lisbon, and the viral 'Endrickmania' around Brazil's World Cup squad captures global attention.", "intro_pt": "O noticiário de hoje é marcado pela tensão geopolítica em torno do interesse de Trump na eleição brasileira de 2026 e pelo novo presidente de direita da Colômbia, enquanto um mortífero domo de calor castiga a Europa. Localmente, Curitiba comemora o novo voo direto para Lisboa, e a 'Endrickmania' da Copa do Mundo viraliza no mundo todo.", "weather": {"location": "Curitiba, PR", "description": "Light drizzle", "temp_max": 14.2, "temp_min": 6.6, "precipitation_mm": 0.7, "wind_max_kmh": 11.0, "wmo_code": 51}, "articles": [{"title": "Relutância de Ancelotti em escalar Endrick é 'sensação viral' da Copa na internet, diz New York Times", "summary": "Jornal americano diz que torcida brasileira vive um 'memepocalipse' e uma 'Endrickmania' na internet.", "url": "https://www.bbc.com/portuguese/articles/cdjkzn0rmw3o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-06-24T10:59:11+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/ba07/live/df021960-6fb0-11f1-8e1d-bbbb1017d210.jpg", "url_hash": "6965c8f32d1ba19a6da99b43c96f1f8f", "title_hash": "63165ba721a807023ee61f1da39573db", "corroboration": 2, "relevance_score": 0.2239, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.567, "headline_en": "Ancelotti's Reluctance to Play Endrick Goes Viral at the World Cup", "headline_pt": "Relutância de Ancelotti em Escalar Endrick Vira Febre Viral na Copa", "one_liner_en": "Brazilian fans' memes demanding Endrick's playing time have become a global internet sensation, per the New York Times.", "one_liner_pt": "Os memes de torcedores brasileiros pedindo a escalação de Endrick viralizaram globalmente, segundo o New York Times.", "category": "Culture", "region": "brazil", "rationale": "The story captures a unique cultural moment where fan frustration with a coaching decision turns into a global viral phenomenon during the World Cup.", "low_signal": true}, {"title": "Relutância de Ancelotti em escalar Endrick é 'sensação viral' da Copa na internet, diz New York Times", "summary": "<img src=\"https://s2-g1.glbimg.com/8IiPlh1cqljsD90OnYwsS7Re_gU=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/m/0/coDxYfR2K9zBeWGrQ5hQ/df021960-6fb0-11f1-8e1d-bbbb1017d210.jpg.webp\" /><br />     Endrick entrou no jogo contra o Haiti e teve um gol anulado.\nReuters via BBC\nOs memes de internet da torcida brasileira pedindo a entrada do atacante Endrick na Seleção brasileira são uma das \"sensações virais\" desta Copa do Mundo, segundo artigo publicado pelo New York Times nesta quarta-feira (24/06).\n✅ Siga o canal de notícias internacionais do g1 no WhatsApp\n\"Aí vêm eles, os brasileiros, iluminando esta Copa do Mundo e fazendo dela, mais uma vez, a sua própria festa. Eles são tão criativos. Fazem você rir e chorar — muitas vezes, ao mesmo tempo. Não seria um grande torneio sem eles\", afirma o jornalista Jack Lang no artigo intitulado \"Por que os memes sobre Endrick e Carlo Ancelotti se tornaram a sensação viral desta Copa do Mundo\".\n\"O motivo? Sua aparente relutância em escalar Endrick, o atacante de 19 anos que surgiu como a grande esperança dos brasileiros para a Copa do Mundo, o jogador que — segundo o argumento da torcida — simplesmente precisa ser colocado em um time mediano para transformar tudo em ouro.\"\nO jornal lembra que Endrick não estava entre os cotados para ir à Copa até março, quando entrou em um amistoso contra a Croácia e em apenas 14 minutos sofreu um pênalti que foi convertido em gol.\nAgora no g1\nAs reações de Ancelotti a constantes perguntas de jornalistas sobre Endrick — inclusive seu olhar aparentemente furioso a um YouTuber que perguntou sobre o atacante — deram início a um \"memepocalipse\" (junção das palavras \"meme\" com \"apocalipse\"), escreve o jornalista do New York Times.\n\"Foi assim que tudo começou. Ancelotti foi retratado de umas 50 mil maneiras diferentes, como um grande rabugento, um vilão que não mediria esforços para frustrar todos os planos de vida que Endrick jamais sonhara.\"\nEntre os memes, está um em que Endrick fala que gosta de dinossauros e Ancelotti se transforma em um asteroide que extingue os animais. Ou um em que Endrick fala que gosta de pão de gergelim, e Ancelotti é retratado como um pombo que come todos os grãos do pão.\nO jornal destaca que não há indícios de que Ancelotti viu os memes, mas afirma que ele já deve ter sentido a \"Endrickmania\", pois já comentou em entrevistas que vem percebendo a pressão para escalá-lo.\nO New York Times escreve que \"existe fundamento\" em toda pressão para que Endrick jogue.\n\"Apesar do tempo de jogo limitado, Endrick protagonizou alguns momentos marcantes pela Seleção Brasileira: basta lembrar seu primeiro gol pela equipe principal, contra a Inglaterra em Wembley, ou sua participação decisiva na vitória no amistoso contra o México em 2024\", escreve o jornal.\n\"É uma amostra pequena, sem dúvida, mas também vale lembrar que ele é apenas um garoto. Ele disputou jogos importantes pelo Palmeiras, mas uma Copa do Mundo é a definição de um ambiente de alta pressão. Protegê-lo um pouco talvez não seja uma má ideia.\"\n\"Não se engane: Endrick é um talento. Esse fato, somado à sua personalidade cativante (e, é preciso dizer, a um trabalho de relações-públicas muito bem feito), fez dele o 'namoradinho' do Brasil. Some-se a isso as dificuldades da Seleção brasileira — especialmente contra o Marrocos — e dá para entender a origem da enxurrada de postagens nas redes sociais.\"\nEndrick já havia sido tema de outros veículos internacionais recentes. Após a vitória contra o Haiti por 3 a 0, em que o jovem entrou por alguns minutos e teve um gol anulado, o jornal esportivo Marca, da Espanha, escreveu um artigo intitulado \"Todos gritam a mesma coisa: Endrick\".\n\"Com o placar em 3 a 0, Ancelotti decidiu realizar o sonho de todo brasileiro. Pelo menos o sonho dos 68.234 torcedores (número que não inclui a torcida haitiana) que lotaram as arquibancadas do Lincoln Financial Field\", escreveu o Marca.\n\"Porque, aos 68 minutos, o pandemônio tomou conta das arquibancadas. E não foi um gol... nem o retorno de Neymar. Era a vez de Endrick estrear em Copas do Mundo.\"\n\"Com o gol anulado, Endrick explodiu de alegria, sem saber que o bandeirinha tinha outros planos para ele. Mas talvez isso fosse o de menos. Uma estreia e a garantia de que ele estará pronto sempre que Carlo precisar dele. E o clamor é claro: todos querem o número 19... embora por enquanto tenham que se contentar com algo mais simples. Mas Endrick tem algo especial, e é óbvio.\"", "url": "https://g1.globo.com/mundo/noticia/2026/06/24/relutancia-de-ancelotti-em-escalar-endrick-e-sensacao-viral-da-copa-na-internet-diz-new-york-times.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-24T12:52:29+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/8IiPlh1cqljsD90OnYwsS7Re_gU=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/m/0/coDxYfR2K9zBeWGrQ5hQ/df021960-6fb0-11f1-8e1d-bbbb1017d210.jpg.webp", "url_hash": "1403bbd628f8a3b6c5eafe2f8007d47f", "title_hash": "63165ba721a807023ee61f1da39573db", "corroboration": 2, "relevance_score": 0.1888, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5494, "headline_en": "Ancelotti's Reluctance to Play Endrick Goes Viral at the World Cup", "headline_pt": "Relutância de Ancelotti em Escalar Endrick Vira Febre Viral na Copa", "one_liner_en": "Brazilian fans' memes demanding Endrick's playing time have become a global internet sensation, per the New York Times.", "one_liner_pt": "Os memes de torcedores brasileiros pedindo a escalação de Endrick viralizaram globalmente, segundo o New York Times.", "category": "Culture", "region": "brazil", "rationale": "Near-duplicate of index 0 from a different Brazilian outlet; the viral Endrickmania trend is the core news hook.", "low_signal": true}, {"title": "40 mortos por afogamento na França: o que é o 'domo de calor' que está causando temperaturas extremas na Europa", "summary": "A previsão é que a onda de calor se intensifique nos próximos dias na Europa Ocidental e Central, com temperaturas que podem ultrapassar os 40 °C.", "url": "https://www.bbc.com/portuguese/articles/c17y9nlz0v1o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-06-24T01:51:35+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/d174/live/224da750-6f4f-11f1-baa9-855c433fc27a.jpg", "url_hash": "e76d52ff42da46683c03b22a1d93dd59", "title_hash": "bc7a407e84e3127a5c632db6285889fb", "corroboration": 2, "relevance_score": 0.0609, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4855, "headline_en": "Heat Dome Kills 40 by Drowning in France as Europe Bakes", "headline_pt": "Domo de Calor Mata 40 por Afogamento na França em Onda de Calor Extrema", "one_liner_en": "A heat dome is driving temperatures above 40°C across Western and Central Europe, killing dozens in France.", "one_liner_pt": "Um domo de calor empurra temperaturas acima de 40°C pela Europa, causando dezenas de mortes na França.", "category": "Climate", "region": "world", "rationale": "A deadly and intensifying extreme weather event affecting multiple European countries is a major humanitarian and climate story.", "low_signal": false}, {"title": "40 mortos por afogamento na França: o que é o 'domo de calor' que está causando temperaturas extremas na Europa", "summary": "<img src=\"https://s2-g1.glbimg.com/ykv83xSmhcwT_Kzor8bFuyXbfXY=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/D/M/R0HEC8SfyuVegLZxdCBw/224da750-6f4f-11f1-baa9-855c433fc27a.jpg.webp\" /><br />     40 mortos por afogamento na França: o que é o 'domo de calor' que está causando temperaturas extremas na Europa\nGetty Images\nPaíses da Europa Ocidental e Central — entre eles Espanha, França e Reino Unido — emitiram alertas vermelhos devido à previsão de intensificação, nos próximos dias, de uma onda de calor com temperaturas que podem ultrapassar os 40 °C.\nMais da metade das regiões da França está atualmente sob o nível máximo de alerta meteorológico e, por causa disso, centenas de escolas foram fechadas.\nO país teve o dia mais quente já registrado (44,3 °C em Pissos, Landes) em sua história nesta terça-feira (23/6), mesmo dia em que foi confirmada a morte por afogamento de pelo menos 40 pessoas que nadavam em áreas sem supervisão na França nos últimos dias.\n\"Não é algo que deva ser levado na brincadeira: nadar em áreas sem supervisão durante uma onda de calor\", declarou à rádio francesa a ministra dos Esportes e da Juventude, Marina Ferrari.\nFerrari afirmou que muitas pessoas tentaram se refrescar em rios e canais sem levar em conta os riscos.\nEntre as vítimas está uma menina de 13 anos que havia ido com a família ao rio Sena, na região de Fontaine-le-Port, no domingo (21/6) à tarde, apesar de não saber nadar.\nVárias pessoas também se afogaram na Alemanha, onde as temperaturas devem alcançar até 40 °C nas regiões oeste e sudoeste até o final da semana.\nNa Espanha, a Agência Estatal de Meteorologia (Aemet) alertou para temperaturas \"extremamente altas\" para a época — entre cinco e dez graus acima do habitual —, com algumas áreas podendo atingir 44 °C.\nFoi emitido alerta vermelho no País Basco, onde se espera que as máximas em San Sebastián cheguem a 40 °C, quase o dobro da média para esta época do ano.\nEntenda por que Europa está enfrentando onda de calor intensa\nO serviço meteorológico do Reino Unido (Met Office) emitiu um raro alerta vermelho de calor para quarta e quinta-feira em partes da Inglaterra e do País de Gales, diante de previsões que indicam temperaturas de até 38 °C em algumas regiões.\nAutoridades da Itália, Suíça e Luxemburgo também emitiram alertas vermelhos semelhantes.\nA causa imediata desse aumento de temperatura é um 'domo de calor': uma massa de ar quente que se desloca para o norte a partir do Saara e fica 'estagnada' sobre a Europa, prendendo o ar quente em seu interior.\nEssa massa é alimentada por um potente sistema de alta pressão conhecido como o \"anticiclone africano\".\nO que é o 'domo de calor' que está causando temperaturas extremas na Europa\nReteurs\nCalor mais intenso e duradouro\nOs cientistas ressaltam, no entanto, que não há dúvida de que a recorrência das ondas de calor é um indicador das mudanças climáticas provocadas pelo ser humano, resultado em grande parte da queima de carvão, petróleo e gás.\nA Météo-France destaca que, das 51 ondas de calor registradas na França desde 1947, 34 ocorreram a partir do ano 2000 e 26 desde 2011.\nO Met Office, do Reino Unido, estima que o calor extremo observado durante as ondas de calor recentes é dez vezes mais provável atualmente devido às mudanças climáticas, e que esses eventos não são apenas mais intensos, mas também mais duradouros.\nOs cientistas ressaltam, no entanto, que não há dúvida de que a recorrência das ondas de calor é um indicador das mudanças climáticas provocadas pelo ser humano, resultado em grande parte da queima de carvão, petróleo e gás.\nA Météo-France destaca que, das 51 ondas de calor registradas na França desde 1947, 34 ocorreram a partir do ano 2000 e 26 desde 2011.\nO Met Office, do Reino Unido, estima que o calor extremo observado durante as ondas de calor recentes é dez vezes mais provável hoje devido às mudanças climáticas, e que esses eventos não são apenas mais intensos, mas também mais duradouros.\nNa segunda-feira, durante a Semana de Moda de Milão, as temperaturas chegaram a 37°C\nReuters\nNos últimos 50 anos, a duração dos períodos de calor quase dobrou.\n\"O aquecimento global provocado pelo ser humano tem servido como uma plataforma de lançamento para esse fenômeno, carregando a atmosfera com calor adicional e fazendo com que as temperaturas extremas sejam muito mais intensas do que teriam sido no passado\", explica Akshay Deoras, pesquisador do Centro Nacional de Ciências Atmosféricas da Universidade de Reading, na Inglaterra.\nMas o fator determinante desse fenômeno, acrescenta o pesquisador, é um \"domo de calor\".\nOnda de calor atinge vários países da Europa\nO que é um domo de calor\n\"Imagine o domo de calor como uma enorme tampa atmosférica que impede a formação de nuvens e permite que um sol implacável aqueça o solo dia após dia\", explica Deoras.\n\"Ao mesmo tempo, o ar que desce sob o sistema de alta pressão é comprimido e aquecido, de forma muito semelhante ao que acontece com o ar dentro de uma bomba de bicicleta quando ela é acionada.\"\nTrata-se essencialmente de uma massa de ar quente que permanece teimosamente presa em um mesmo lugar, aprisionando aqueles que estão ao nível do solo em uma onda de calor prolongada.\nOs cientistas acreditam que esses eventos são desencadeados por uma mudança brusca nas temperaturas dos oceanos.\nPor sua vez, o aumento da temperatura da água aquece o ar, e os ventos empurram esse calor em direção à terra.\nAssim que o ar quente chega ao continente, ele fica preso por um sistema de alta pressão, formando uma cúpula cercada por sistemas de baixa pressão dos dois lados.\nA alta pressão aquece ainda mais a coluna de ar ao comprimí-la, atuando efetivamente como um domo.\nMudança climática: o que está por vir\nNos últimos anos, essas ondas de calor recordes ocorreram em um mundo que, em média, está cerca de 1,4 °C mais quente do que no final do século XIX, em grande parte devido às atividades humanas, como a queima de combustíveis fósseis.\nNo entanto, de acordo com as atuais políticas climáticas adotadas pelos governos ao redor do mundo, o aquecimento global pode se aproximar de 3 °C até o fim deste século.\nIsso inevitavelmente levará a novos recordes de temperatura, criando desafios especialmente para países como Reino Unido e Suíça, cujas infraestruturas e edificações não foram projetadas para suportar calor extremo.\n\"O clima em que vivemos hoje simplesmente não é o mesmo em que crescemos. Nossos prédios e infraestruturas estão lamentavelmente despreparados para o que está por vir\", alerta Friederike Otto, professora de ciências climáticas do Imperial College London.\nAté 1990, o recorde de temperatura do Reino Unido em qualquer mês do ano era de 36,7 °C, registrado em 1911.\nDesde então, essa marca foi superada diversas vezes e atualmente o recorde nacional é de 40,3 °C, registrado em julho de 2022.\nCom o avanço das mudanças climáticas, temperaturas ainda mais elevadas poderão se tornar uma realidade, alerta Richard Betts, chefe de pesquisa sobre impactos climáticos do Met Office e professor da Universidade de Exeter.\n\"Enquanto não reduzirmos as emissões globais de carbono a zero líquido, continuaremos aquecendo o planeta e novos recordes de temperatura continuarão sendo quebrados\", afirmou.", "url": "https://g1.globo.com/meio-ambiente/noticia/2026/06/24/40-mortos-por-afogamento-na-franca-o-que-e-o-domo-de-calor-que-esta-causando-temperaturas-extremas-na-europa.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-24T11:01:49+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/ykv83xSmhcwT_Kzor8bFuyXbfXY=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/D/M/R0HEC8SfyuVegLZxdCBw/224da750-6f4f-11f1-baa9-855c433fc27a.jpg.webp", "url_hash": "39ceb4d406fd14e91a07294f71ddc3bf", "title_hash": "bc7a407e84e3127a5c632db6285889fb", "corroboration": 2, "relevance_score": -0.0055, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4523, "headline_ // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

function renderMasthead() {
  const iso = DATA.date || new Date().toISOString().slice(0,10);
  const year = new Date(iso + 'T12:00:00').getFullYear();
  const vol  = toRoman(year - 1900);
  const doy  = dayOfYear(iso);
  document.getElementById('j-vol').textContent  = 'Vol. ' + vol + ' · No. ' + doy;
  document.getElementById('j-date').textContent = fmtDate(iso);
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

// ── Briefing ─────────────────────────────────────────────────────────
function renderBriefing() {
  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round((art.relevance_score || 0) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
