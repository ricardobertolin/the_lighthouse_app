<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}
/* Reading-history export — feeds `python -m digest --ingest-clicks` */
.reading-log{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:16px;
}
.reading-log button{
  font:inherit;letter-spacing:1px;text-transform:uppercase;
  background:none;border:1px solid var(--m3);color:var(--m3);
  padding:3px 9px;margin-left:8px;cursor:pointer;
}
.reading-log button:hover{ background:var(--ink);color:var(--paper);border-color:var(--ink); }
.reading-log[hidden]{ display:none; }

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

  </filter>
</svg>

<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>

of its full launch.", "low_signal": true}, {"title": "Explore the globe in field recordings", "summary": "I love field recordings. I love making them. I love them when they're incorporated into my ambient music. They're great background noise for working or sleeping. But they're also great for active listening, focusing in on the fine nuances of burbling brooks or urban chaos. Earth Garden gives you a globe to explore with real [&#8230;]", "url": "https://www.theverge.com/tech/990873/earth-garden-globe-field-recordings", "source_domain": "theverge.com", "published_at": "2026-09-05T21:31:34+00:00", "origin": "feed", "image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/09/Screenshot-2026-09-05-at-5.23.38-PM.png?quality=90&amp;strip=all&amp;crop=0%2C1.5344138631358%2C100%2C96.931172273728&amp;w=1200", "url_hash": "1fdfa6bf0e2f0ff7babe0948333f4283", "title_hash": "9151c6affd9ae2f08089ba9992e58b0d", "corroboration": 1, "relevance_score": 4.2432, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.6321, "headline_en": "Earth Garden lets you explore the globe through field recordings", "headline_pt": "Earth Garden permite explorar o mundo por gravações de campo", "one_liner_en": "An interactive globe serves up real field recordings from around the world for listening.", "one_liner_pt": "Um globo interativo oferece gravações de campo reais de todo o mundo para escuta.", "category": "Culture", "region": "world", "rationale": "A light cultural tech find rather than hard news.", "low_signal": true}, {"title": "‘BBB do Rock in Rio’: 152 câmeras e 3 drones vigiam público; reconhecimento facial já levou 3 à delegacia", "summary": "<img src=\"https://s2-g1.glbimg.com/J39XBkiWriZzRFZ08lNEFAiFpgo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/J/o/WitBUAQsKgwmx64Cmz0w/whatsapp-image-2026-09-05-at-22.19.00.jpeg\" /><br />     O que tem de novo no rock in rio 2026\nQuem entra na Cidade do Rock pode nem perceber, mas está sendo acompanhado por uma espécie de BBB do Rock in Rio. \nNos bastidores do festival, uma central de operações funciona 24 horas por dia e recebe imagens de 152 câmeras espalhadas pelo evento, além de 3 drones, câmeras térmicas, radares meteorológicos e sistemas de reconhecimento facial.\nA estrutura é usada para acompanhar a movimentação do público, identificar pessoas procuradas pela Justiça, detectar drones não autorizados e até monitorar possíveis tentativas de invasão pelo entorno da Lagoa de Jacarepaguá.\nDesde o início do festival, 3 pessoas foram identificadas pelo reconhecimento facial e levadas à delegacia montada na Cidade do Rock. Uma delas permaneceu detida após a polícia constatar uma pendência com a Justiça.\nAo todo, cerca de 2,4 mil profissionais participam da operação de segurança durante o evento, entre vigilantes privados, equipes de tecnologia e agentes das forças de segurança.\nO g1 entrou na central de monitoramento para mostrar como funciona a operação que acompanha, em tempo real, o que acontece dentro e no entorno da Cidade do Rock.\n“A segurança do festival começa muito antes da abertura dos portões. Nós iniciamos o planejamento cerca de 3 meses antes com a instalação de toda a infraestrutura de monitoramento. Existe todo um estudo para definir onde cada câmera será instalada e como vamos acompanhar a movimentação do público”, explica Paulo Armário, gerente de operações do Rock in Rio.\nLEIA TAMBÉM:\nVeja como chegar e o que pode levar para o Rock in Rio 2026\nRock in Rio 2026: veja 5 novidades na Cidade do Rock\nCentro de monitoramento da Cidade do Rock tem mais de 150 câmeras espalhadas pelo Parque Olímpico\nDivulgação\nAo todo, o Rock in Rio conta com 50 câmeras com reconhecimento facial, principalmente nas áreas de acesso ao evento. \nSegundo Armário, o número de equipamentos acabou superando o previsto inicialmente.\n“Tínhamos cerca de 120 câmeras planejadas, mas conseguimos ampliar essa estrutura e hoje trabalhamos com 152 câmeras monitorando a Cidade do Rock”, afirma.\nDe acordo com Armário, as imagens são analisadas em parceria com as forças de segurança.\n“Assim que a pessoa entra na Cidade do Rock, ela já passa pelo sistema de reconhecimento facial operado por nós, em parceria com as polícias. Isso permite identificar eventuais ocorrências ou pendências judiciais”, diz.\nDesde o início do festival, 3 pessoas foram identificadas pelo sistema facial e conduzidas para a delegacia instalada dentro da Cidade do Rock. Após a verificação, uma delas permaneceu detida por possuir pendência com a Justiça.\nACOMPANHE A COBERTURA AO VIVO\nDrone sobrevoa a Cidade do Rock\nDivulgação\nRadares e câmeras térmicas contra invasões pela lagoa\nA vigilância não termina nos portões da Cidade do Rock. Radares perimetrais, câmeras térmicas e drones também são usados para monitorar pontos considerados vulneráveis a invasões, incluindo o entorno da Lagoa de Jacarepaguá.\n“Hoje as tentativas [de invasão pela água] são bem menores do que em outras edições, mas elas ainda acontecem. Muitas vezes conseguimos identificar a movimentação antes mesmo que a pessoa se aproxime do perímetro”, afirma Armário.\nSistema antidrones detecta voos não autorizados\nNo 1º dia de festival, 2 drones não autorizados foram apreendidos nas proximidades da Cidade do Rock. Um estava fora do complexo e outro chegou a sobrevoar o interior do evento. No 2º caso, o responsável perdeu a credencial de acesso e foi retirado do local.\nPara reforçar a fiscalização, o Rock in Rio passou a utilizar um sistema antidrones capaz de detectar automaticamente a presença de equipamentos não autorizados. Quando um drone invade a área protegida, o alerta é disparado sem a necessidade de acionamento manual por operadores.\nCentral funciona 24 horas por dia\nCerca de 12 profissionais trabalham simultaneamente na central, em esquema de turnos. O espaço reúne equipes de segurança e tecnologia, além de profissionais responsáveis pelo monitoramento meteorológico, bombeiros, profissionais de saúde e equipes de inteligência digital.\n“Hoje temos um centro integrado que monitora não só a segurança, mas toda a operação da Cidade do Rock. Nosso objetivo é garantir que o público tenha uma experiência segura, confortável e tranquila durante o festival”, diz Paulo Armário.\nSala de controle funciona 24 horas por dia durante o festival\nDivulgação\nSegundo os organizadores, o sistema também acompanha condições climáticas em tempo real e monitora possíveis ameaças identificadas em ambientes digitais antes mesmo que cheguem ao evento. \n“É um trabalho muito preventivo. A ideia é antecipar problemas para que eles sequer aconteçam”, conclui o gerente.\n🟩O g1 Rio está no GloboPop, o novo aplicativo de vídeos curtos verticais da Globo, disponível gratuitamente no seu celular. Lá no app, você pode seguir o palco do g1 Rio para não perder nenhum episódio. Baixe o GloboPop.", "url": "https://g1.globo.com/pop-arte/musica/rock-in-rio/noticia/2026/09/06/bbb-do-rock-in-rio-cameras-e-drones-vigiam-publico-com-reconhecimento-facial.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-09-06T12:34:11+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/J39XBkiWriZzRFZ08lNEFAiFpgo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/J/o/WitBUAQsKgwmx64Cmz0w/whatsapp-image-2026-09-05-at-22.19.00.jpeg", "url_hash": "780fb4212a074c7831b6260df155c6f0", "title_hash": "b6583ff9de4854fc6833c721a33367ac", "corroboration": 2, "relevance_score": 1.376, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.629, "headline_en": "Rock in Rio watched by 152 cameras and 3 drones; 3 detained", "headline_pt": "Rock in Rio tem 152 câmeras e 3 drones; reconhecimento facial levou 3 à delegacia", "one_liner_en": "Facial recognition and drone surveillance at Rock in Rio have already sent three people to a police station.", "one_liner_pt": "Reconhecimento facial e drones no Rock in Rio já levaram 09-2026-premio-nao-acontecera/", "source_domain": "bandab.com.br", "published_at": "2026-09-06T12:37:13+00:00", "origin": "feed", "image_url": "https://imagens.bandab.com.br/file/bandab/2026/09/lotofacil-jonathas-bertaze-2-7.jpg", "url_hash": "f93b3e7e1afc3abe3949fe99434d87ea", "title_hash": "6f768ed895e4137ebee2953056b42d44", "corroboration": 2, "relevance_score": 1.1086, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.61, "headline_en": "Why there is no Lotofácil draw today", "headline_pt": "Lotofácil de hoje (06/09): veja o motivo de não haver sorteio", "one_liner_en": "The usual Sunday Lotofácil draw is suspended today, Band explains.", "one_liner_pt": "O habitual sorteio dominical da Lotofácil está suspenso hoje, explica a Band.", "category": "Other", "region": "brazil", "rationale": "Duplicate of the Lotofácil suspension story.", "low_signal": true}, {"title": "Sentir a música, ‘ver’ o palco pelo rádio e fugir do barulho: como funciona a acessibilidade no Rock in Rio", "summary": "<img src=\"https://s2-g1.glbimg.com/w3ZLpSvoIdJJ7f_k5FbmE7oReJE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/L/R/ulbnBDRLG0ZWXoJ53FVg/g1-audiodescricao2.jpg\" /><br />     Rock in Rio 2026 conta com serviços de acessibilidade para cegos e surdos\nO Rock in Rio 2026 conta com uma série de recursos de acessibilidade voltados ao público de pessoas com deficiência visual, auditiva e com autismo. As iniciativas incluem audiodescrição, interpretação em Libras, experiências táteis para percepção da música, kits sensoriais e uma sala preparada para acolher visitantes em situações de sobrecarga sensorial.\nA operação destinada às pessoas cegas e surdas é coordenada por uma empresa especializada em acessibilidade cultural e audiovisual que atua no festival desde 2018.\n📱Baixe o app do g1 para ver notícias do RJ em tempo real e de graça\nConfira mais informações sobre o Rock in Rio\nPara o público com deficiência visual, o festival disponibilizará audiodescrição nos palcos Mundo, Sunset e Favela. Os interessados devem procurar a Central de Acessibilidade para receber uma pulseira que garante acesso ao serviço.\n“As pessoas recebem um radinho e, por meio dele, acompanham a descrição do que acontece no palco. Quantos cantores há, o que estão fazendo. A cada show, eles falam tudo o que está acontecendo”, explica Ana Motta, CEO da All Dub.\nOs profissionais responsáveis pela audiodescrição narram elementos visuais da apresentação, como entrada dos artistas, figurinos, cenários, iluminação, efeitos especiais e movimentação dos músicos. O objetivo é permitir que pessoas que não enxergam ou têm baixa visão acompanhem aspectos do espetáculo que normalmente dependem da observação visual.\n“Eu narro o que está acontecendo. Narrações que não atrapalham o que está acontecendo sem intervir na música. Detalhes da roupa, da dança, detalhes dele ter jogado uma baqueta e o público gritou. Isso faz a diferença”, contou a audiodescritora Ana Paula Rodrigues.\nEquipamentos usados no serviço de audiodescrição no Rock in Rio\nCristina Boeckel/ g1\nO analista de sistemas Sidney Tobias é fã de festivais, onde ele costuma conhecer bandas novas e acompanhar as que já conhece. No sábado (5), ele esteve na Cidade do Rock para ver o show do Sepultura. Ele usa o serviço de audiodescrição para acompanhar melhor as apresentações.\n“Todo show tem muita movimentação de palco, além da identidade visual da banda ou do artista. Sem a audiodescrição, eu não teria essa informação. Para mim, não só curtir o som, mas também entender a movimentação de palco e o trabalho do artista, só com a audiodescrição”, contou Sidney.\nO 2º dia do festival foi marcado por uma chuva forte. A água atrapalhou o uso dos equipamentos. Ainda assim, Sidney não ficou sem o serviço. A profissional se sentou ao lado dele e foi comentando o que acontecia durante o show.\nDurante chuva intensa na Cidade do Rock, audiodescritora narra o que ocorre no palco ao lado de deficiente visual\nCristina Boeckel/ g1\nSentir a música\nPara o público com surdez, o festival oferece diferentes formas de acesso à experiência musical. Uma delas é o projeto Sinta o Som. Nesse serviço, a pessoa informa previamente qual apresentação deseja acompanhar e tem a oportunidade de vivenciar o show por meio das vibrações sonoras.\n“O surdo chega à Central de Acessibilidade e informa qual é o cantor preferido. Ele coloca o nome em uma lista e, cerca de meia hora antes do show, retorna ao local, encontra um intérprete de Libras e é levado para uma área próxima ao palco. Ali, pode sentir a música a partir de uma caixa de som gigante. O intérprete o acompanha e oferece suporte durante toda a experiência”, afirma Ana.\nAlém da proximidade com as caixas de som, os participantes utilizam um colete sensorial desenvolvido para ampliar a percepção física da música. O serviço tem vagas limitadas por dia.\nColete sensorial que será usado no Rock in Rio\nDivulgação/ All Dub\nLEIA MAIS:\nRock in Rio 2026 começa... rock, com Foo Fighters, Rise Against e encontro de Capital Inicial e Dado\nFOTOS: veja os detalhes da Cidade do Rock para esta edição do Rock in Rio\nRock in Rio 2026: veja preços de restaurantes e lanchonetes na cidade do rock\nNa tela\nThiago Lima, intérprete de Libras, conta que estuda a obra das bandas que interpretará no Rock in Rio antes de show\nDivulgação/ All Dub\nOutro recurso já conhecido do público é a presença de intérpretes de Libras nos telões dos 3 principais palcos do festival. A tradução acompanha, em tempo real, as falas e apresentações dos artistas.\nNesta edição, o serviço será realizado por uma equipe de 16 intérpretes que se revezam ao longo da programação. O trabalho exige uma preparação extensa antes do início dos shows.\nOs profissionais estudam repertórios, letras, estilo dos artistas, referências culturais e características das apresentações para adaptar o conteúdo à Língua Brasileira de Sinais. A equipe também conta com tradutores e intérpretes capazes de atuar em idiomas como inglês, espanhol e mandarim.\nO intérprete Thiago Lima atua nesta edição do Rock in Rio tanto no Sinta o Som como na interpretação nos palcos. \n“A expressão contribui muito, faz parte dos parâmetros da Libras. O fato de você sentar estudar, se preparar, faz grande diferença. E ser você. Quando se faz o que se ama, faz toda a diferença”, disse.\nParte dos intérpretes de Libras que atuam no Rock in Rio\nDivulgação/ All Dub\nRecursos para pessoas autistas\nEntre as novidades voltadas ao público com autismo estão os kits sensoriais, compostos por abafador de ruído, óculos para redução de estímulos visuais e luminosos, além de spinner e stim toy, utilizados como instrumentos de estímulo tátil e auxílio à autorregulação.\nOs itens podem ajudar a reduzir os impactos provocados pelo volume do som, pela iluminação intensa e pela grande concentração de pessoas, características comuns em festivais de grande porte.\nSegundo os organizadores, a recomendação é que cada visitante leve os recursos que já utiliza em seu dia a dia. Os kits oferecidos pelo evento funcionam como uma alternativa de apoio e estarão sujeitos à disponibilidade.\nPara acessar os recursos de acessibilidade, é necessário realizar identificação junto ao festival. No caso das pessoas com autismo, será exigida a apresentação da Carteira de Identificação da Pessoa com Transtorno do Espectro Autista (Ciptea) ou de laudo médico para obtenção da pulseira oficial de identificação. De acordo com a organização, cordões adquiridos fora do evento não substituem essa comprovação.\nSala sensorial\nRock in Rio tem sala sensorial para pessoas com autismo\nO Rock in Rio também contará com uma sala sensorial destinada ao acolhimento em momentos de crise ou sobrecarga sensorial.\nO espaço terá redução de estímulos sonoros e luminosos e contará com a presença de terapeutas ocupacionais. A proposta é oferecer um ambiente mais tranquilo para que a pessoa possa se reorganizar antes de retornar às atividades do festival.\nSegundo Guilherme de Almeida, presidente da Autistas Brasil, a principal inovação é incorporar ao planejamento do evento a perspectiva de quem vive a experiência sendo do espectro autista.\n“O importante é transformar a escuta das pessoas autistas em soluções concretas”, afirmou Almeida.\nO Rock in Rio será ainda o 1º festival a receber o Selo “Todos Nós”, criado pela Autistas Brasil para reconhecer instituições que adotam práticas inclusivas. Segundo a entidade, a iniciativa busca reforçar a importância de garantir não apenas o acesso, mas também a permanência e a participação deste público em grandes eventos culturais. \n🟩O g1 Rio está no GloboPop, o novo aplicativo de vídeos curtos verticais da Globo, disponível gratuitamente no seu celular. Lá no app, você pode seguir o palco do g1 Rio para não perder nenhum episódio. Baixe o GloboPop.", "url": "https://g1.globo.com/pop-arte/musica/rock-in-rio/noticia/2026/09/06/sentir-a-musica-ver-o-palco-pelo-radio-e-fugir-do-barulho-como-funciona-a-acessibilidade-no-rock-in-rio.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-09-06T08:00:00+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/w3ZLpSvoIdJJ7f_k5FbmE7oReJE=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/L/R/ulbnBDRLG0ZWXoJ53FVg/g1-audiodescricao2.jpg", "url_hash": "a345e8196a14e6e9235b26e40bb7e9b5", "title_hash": "8904f9aef2a73918d16d3ffd2e5faa31", "corroboration": 2, "relevance_score": 1.0981, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.6093, "headline_en": "How accessibility works at Rock in Rio 2026", "headline_pt": "Como funciona a acessibilidade no Rock in Rio 2026", "one_liner_en": "The festival offers audio description, vibration vests and quiet areas for deaf, blind and autistic fans.", "one_liner_pt": "O festival oferece audiodescrição, coletes vibratórios e áreas de descanso para surdos, cegos e autistas.", "category": "Cul function t(key) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS['en'][key] || key; }

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
// The scene and the headline label come from the *current* observation when we
// have one. The daily weathercode is the most severe condition anywhere in the
// 24h window, so using it alone made a calm drizzly morning render as a
// thunderstorm. The hi/lo/wind stats stay on the daily outlook.
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.current_code != null ? w.current_code
               : (w.wmo_code != null ? w.wmo_code : 3);
  const precip = w.current_code != null ? (w.precip_now_mm || 0)
                                        : (w.precipitation_mm || 0);
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// The page is a static file generated once a day, so the baked forecast goes
// stale within hours. Open-Meteo is keyless and CORS-enabled, so refresh the
// card straight from the browser. On any failure we silently keep the baked
// values.
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=-25.4297&longitude=-49.2711&current=temperature_2m%2Capparent_temperature%2Crelative_humidity_2m%2Cprecipitation%2Cweathercode%2Cwindspeed_10m&daily=weathercode%2Ctemperature_2m_max%2Ctemperature_2m_min%2Cprecipitation_sum%2Cprecipitation_probability_max%2Cwindspeed_10m_max&timezone=America%2FSao_Paulo&forecast_days=1';

function refreshWeather() {
  // --weather previews bake a fixed condition on purpose; don't clobber it.
  if (DATA.live_weather === false) return;
  fetch(WX_URL, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      const daily = d.daily || {};
      const cur   = d.current || {};
      const first = (k) => (daily[k] && daily[k].length ? daily[k][0] : null);
      DATA.weather = Object.assign({}, DATA.weather, {
        temp_max:         first('temperature_2m_max'),
        temp_min:         first('temperature_2m_min'),
        precipitation_mm: first('precipitation_sum'),
        precip_prob:      first('precipitation_probability_max'),
        wind_max_kmh:     first('windspeed_10m_max'),
        wmo_code:         first('weathercode'),
        temp_now:         cur.temperature_2m,
        feels_like:       cur.apparent_temperature,
        humidity:         cur.relative_humidity_2m,
        precip_now_mm:    cur.precipitation,
        wind_now_kmh:     cur.windspeed_10m,
        current_code:     cur.weathercode,
        observed_at:      cur.time,
      });
      renderWeather();
    })
    .catch(() => {});
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
// The page is static (GitHub Pages), so there is nowhere to POST to. Clicks
// accumulate here and are exported as a file that the pipeline imports with
// `python -m digest --ingest-clicks`, which feeds the interest centroid used
// for relevance scoring.
const CLICK_KEY = 'tl_clicks';

function readClicks() {
  try { return JSON.parse(localStorage.getItem(CLICK_KEY) || '[]'); }
  catch(_) { return []; }
}

function trackClick(url, domain) {
  try {
    const clicks = readClicks();
    clicks.push({ url: url, domain: domain, at: new Date().toISOString() });
    if (clicks.length > 2000) clicks.splice(0, clicks.length - 2000);
    localStorage.setItem(CLICK_KEY, JSON.stringify(clicks));
    updateReadingLog();
  } catch(_) {}
}

function updateReadingLog() {
  const clicks = readClicks();
  const box = document.getElementById('j-reading-log');
  if (!box) return;
  box.hidden = clicks.length === 0;
  const label = document.getElementById('j-reading-count');
  if (label) label.textContent = clicks.length + ' ' + t('readingLog');
}

function exportClicks() {
  const clicks = readClicks();
  if (!clicks.length) return;
  const blob = new Blob([JSON.stringify(clicks, null, 2)], { type: 'application/json' });
  const stamp = new Date().toISOString().slice(0, 10);
  _dlBlob(blob, 'lighthouse-clicks-' + stamp + '.json');
  _flashBtn(document.getElementById('j-export-clicks'));
}

function clearClicks() {
  if (!confirm(t('clearConfirm'))) return;
  try { localStorage.removeItem(CLICK_KEY); } catch(_) {}
  updateReadingLog();
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  refreshWeather();
  // Static page, long-lived tab: keep the card honest.
  setInterval(refreshWeather, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) refreshWeather();
  });
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();
  updateReadingLog();

  document.getElementById('j-export-clicks').addEventListener('click', exportClicks);
  document.getElementById('j-clear-clicks').addEventListener('click', clearClicks);

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>

if ('serviceWorker' in navigator) {
