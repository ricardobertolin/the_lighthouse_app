<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>

orpo dos melhores jogadores de futebol mudou nos últimos 50 anos", "summary": "<img src=\"https://s2-g1.glbimg.com/kVJU_YFJ0O45iNhTcZmburNtHd4=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/7/y/kL22BPQzAX35ri5JYzVA/f299dae0-699c-11f1-938e-83ab58a2163c.jpg.webp\" /><br />     Aos 41 anos de idade, o astro português Cristiano Ronaldo é um exemplo de condicionamento físico — e de longevidade — no futebol moderno\nGetty Images/BBC\nDois gols históricos ocorridos na Copa do Mundo da Fifa de Futebol Masculino contam a história de uma transformação radical do futebol e do corpo dos seus atletas de elite.\nEm 30 segundos tensos e espetaculares na Copa de 1970, no México, a seleção brasileira trabalhou a bola com oito jogadores, até o poderoso chute a gol do capitão e lateral-direito Carlos Alberto Torres (1944-2016).\nO quarto gol da seleção contra a Itália na final de 1970 é considerado um dos maiores momentos da história das Copas.\nCinco décadas depois, uma manobra similar de sete passes da Argentina contra a França, na final de 2022 (convertida em gol pelo ponta-direita Ángel Di Maria), levou apenas 12 segundos.\nAgora no g1\nO gol de 1970 \"não teria ocorrido nos dias de hoje\", explica o professor Orlando Laitano, da Universidade da Flórida, nos Estados Unidos. Ele é um dos principais especialistas em fisiologia do exercício.\nSe aquela seleção brasileira pudesse viajar no tempo, sua jogada provavelmente seria interceptada pelos adversários modernos. E \"o desequilíbrio maior não seria o talento, mas a fisiologia\", segundo Laitano.\nO lendário esquadrão brasileiro da Copa de 1970 levou pouco mais de 30 segundos para marcar seu histórico gol em jogada coletiva...\nReuters\n... enquanto, 52 anos depois, a Argentina realizou uma jogada parecida em apenas 12 segundos, demonstrando as mudanças ocorridas na velocidade do jogo\nGetty Images/BBC\n'Uma batalha por cada centímetro'\nLaitano trabalhou com a seleção brasileira durante a Copa do Mundo de 2014, no Brasil. Ele afirma que os jogadores de futebol modernos são biologicamente diferentes dos seus predecessores.\nO professor explica que a evolução dos exercícios, da medicina e da forma de disputa das partidas fez com que o futebol de elite se tornasse uma batalha por cada centímetro de espaço no campo de jogo.\n\"Por isso, os jogadores modernos precisam ser mais rápidos e mais fortes\", segundo ele.\n\nBBC\nOs dados das últimas cinco décadas mostram que os principais jogadores passaram a ser mais altos e magros, segundo pesquisadores da Universidade de Wolverhampton, no Reino Unido.\nEles compararam informações de milhares de jogadores da principal divisão de futebol da Inglaterra, entre os anos 1970 e 2020 (a Primeira Divisão até 1992 e a Premiere League nos anos seguintes, que reúne atualmente grande parte dos jogadores de elite de todo o mundo).\nA altura média dos jogadores aumentou em mais de 4 cm entre 1973 e 2013. Esta tendência prosseguiu na década seguinte entre os goleiros e zagueiros, mas a altura média dos meio-campistas e atacantes sofreu uma pequena redução.\nOs pesquisadores também concluíram que os jogadores da principal divisão inglesa \"estão ficando mais angulares e ectomorfos\". Isso significa que eles tendem a ser cada vez mais altos e magros, com estrutura leve e membros longos.\nEsta tendência é indicada pelo aumento das avaliações em uma medida conhecida como Recíproco do Índice Ponderal (RIP), que mede a altura em relação ao peso, de forma a destacar a magreza.\n\nBBC\nOs autores do estudo indicam que as mudanças de tipo corporal se devem aos campos melhores e ao aumento da carga de trabalho exigida dos jogadores atuais.\nNos anos 1970, os campos ingleses costumavam ficar muito lamacentos no meio do inverno \"e os jogadores precisavam ser muito musculosos para jogar bem\", segundo o professor emérito Alan Nevill, um dos autores do estudo.\nMas, agora, os campos são melhores e \"você tem esses jogadores mais leves e magros, que podem manter seu desempenho por períodos mais longos, preservando energia\".\nOs especialistas também afirmam que os jogadores consomem grande parte dessa energia para correr.\nCorrendo (muito mais) para vencer\nDiversos estudos calculam que os jogadores raramente quebravam a barreira dos 30 km/h nos anos 1970 e 1980. Mas, na Copa do Mundo de 2022, no Catar, pelo menos 10 deles correram a mais de 35 km/h.\nMais do que isso, os jogadores, agora, precisam atingir sua velocidade máxima em mais ocasiões durante cada partida.\n\"Se você observar os atacantes do século passado, eles conseguiam andar na maior parte do jogo e explodir apenas em alguns lances para, talvez, marcar um gol. Isso não existe mais\", explica o professor de fisiologia do exercício Jens Bangsbo, da Universidade de Copenhague, na Dinamarca.\nNa última Eurocopa masculina, disputada em 2024, na Alemanha, os jogadores correram a 25 km/h ou mais cerca de 12 vezes por jogo, segundo a Uefa, o organismo que dirige o futebol na Europa.\nMas o número de arrancadas depende da posição. Os zagueiros-centrais e meio-campistas correram a todo vapor, em média, oito vezes por partida, enquanto os atacantes fizeram o mesmo 12 vezes e os laterais, 14.\nCorrer rápido é uma coisa, segundo Bangsbo, mas o mais importante é a capacidade  de correr repetidas vezes.\n\"Basicamente, o futebol atual é questão de recuperação, a capacidade de se recuperar o mais rápido possível.\" Bangsbo é ex-jogador de futebol profissional e um dos maiores especialistas em fisiologia e preparo físico futebolístico do mundo.\nA aceleração do jogo, particularmente na última década, foi causada, em grande parte, pelo aumento do uso de táticas de alta pressão — tentativas rápidas e coordenadas de tomar a posse de bola dos zagueiros da equipe adversária, antes que eles consigam realizar o passe mais para a frente.\nMas o interessante é que o jogo não observou grandes aumentos das distâncias cobertas pelos jogadores.\nEstudos indicam que, nos anos 1970, os jogadores andavam ou corriam, em média, 8,7 km por partida. Este número atingiu um pico de 11,4 km nos anos 1990, mas caiu desde então.\nNa Copa do Mundo de 2022, os jogadores cobriram uma distância média de 10,6 km por jogo, segundo a Fifa. Mas esta distância variou entre as diferentes posições.\nOs jogadores estão jogando demais?\nOs dados também indicam que os jogadores de futebol de alto nível estão jogando com mais frequência.\nEstudos demonstraram que o número de partidas disputadas pela maioria dos clubes espalhados pelo mundo é estável, em cerca de 42 por ano. Mas a sobrecarga pode ser muito maior para os atletas de elite.\nO zagueiro holandês do Liverpool Virgil van Dijk, por exemplo, já disputou 65 partidas nesta temporada. Destas, 10 foram pela seleção nacional, antes da Copa do Mundo, segundo dados publicados pelo sindicato internacional dos jogadores de futebol, Fifpro.\nO zagueiro holandês do Liverpool Virgil van Dijk disputou 65 partidas na temporada, segundo o sindicato dos jogadores Fifpro\nGetty Images/BBC\nA entidade declarou que os jogadores nunca foram tão exigidos e pediu proteções maiores em relação ao tempo de repouso e recuperação.\n\"O número de partidas disputadas certamente é uma questão relacionada ao risco de lesões\", segundo Bangsbo.\nUm estudo encomendado pela Uefa e publicado em 2023 demonstrou o que a entidade descreve como aumento \"preocupante\" das lesões dos músculos da coxa ao longo das oito temporadas anteriores.\nO estudo não determinou a causa, mas seus autores sugeriram possíveis fatores, como o aumento da intensidade do futebol de elite e a sobrecarga dos calendários de jogos.\n\"Atualmente, os jogadores trabalham no limite\", explica Laitano. \"Sem tempo de recuperação adequado, o corpo desmorona.\"\nVeteranos em alta\nO goleiro da Escócia Craig Gordon, de 43 anos, é o jogador mais velho da Copa do Mundo da Fifa de Futebol Masculino de 2026\nGetty Images/BBC\nMas também existem boas notícias. Os avanços da ciência do esporte, incluindo regimes de treinamento, nutrição e recuperação, possibilitam que os jogadores de futebol se mantenham na elite por mais tempo.\nUm exemplo é a idade média da Uefa Champions League, o torneio de clubes mais importante do mundo, que aumentou de 24,9 anos em 1992 para 26,5, em 2018.\nAs três últimas Copas do Mundo foram as mais \"idosas\" da história, segundo a Fifa.\nA Copa de 2018, na Rússia, registrou a maior idade média dos jogadores da história do torneio: 27,9 anos.\nApenas sete jogadores com 35 anos ou mais participaram da Copa de 1990, na Itália. Mas 41 estiveram no torneio de 2022, segundo os dados compilados pelo economista e cientista de dados Joshua C. Fjetstul, da Universidade de Oslo, na Noruega.\nNeste ano, a relação oficial da Fifa inclui 72 jogadores com 35 anos ou mais. E oito deles têm pelo menos 40 anos, mais do que todas as Copas anteriores, somadas.\n\"Os jogadores que cuidam de si e seguem os protocolos corretos de treinamento e recuperação têm muito mais possibilidade de jogar na elite por mais tempo do que antes\", conclui Orlando Laitano.\nGráficos de Caroline Souza e Daniel Arce-Lopez, da equipe de Jornalismo Visual da BBC.", "url": "https://g1.globo.com/saude/noticia/2026/06/20/mais-altos-mais-rapidos-mais-velhos-como-o-corpo-dos-melhores-jogadores-de-futebol-mudou-nos-ultimos-50-anos.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-20T10:29:45+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/kVJU_YFJ0O45iNhTcZmburNtHd4=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/7/y/kL22BPQzAX35ri5JYzVA/f299dae0-699c-11f1-938e-83ab58a2163c.jpg.webp", "url_hash": "726b3473ce9bdee664518dd658508b23", "title_hash": "b047664821cb995ee3d43db6c5f9f665", "corroboration": 2, "relevance_score": 0.0753, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4926, "headline_en": "How Elite Football Players' Bodies Have Transformed Over 50 Years", "headlin Economy", "region": "curitiba", "rationale": "Highlights Paraná's growing economic weight, relevant to the local readership's business and civic context.", "low_signal": false}, {"title": "Flávio mira “fintechs de fachada” contra o crime organizado em evento na Faria Lima", "summary": "<img src=\"https://media.gazetadopovo.com.br/2026/06/19154615/Faria-Lima-Teatro-B32-baleia-mercado-financeiro-flavio-bolsonaro-plano-de-seguranca-960x540.jpeg\" /><br />Flávio Bolsonaro apela ao mercado financeiro contra \"fintechs de fachada\" do crime organizado na Faria Lima. Leia na Gazeta do Povo.", "url": "https://www.gazetadopovo.com.br/eleicoes/2026/flavio-mira-fintechs-de-fachada-contra-crime-organizado-faria-lima/", "source_domain": "gazetadopovo.com.br", "published_at": "2026-06-19T20:15:08+00:00", "origin": "feed", "image_url": "https://media.gazetadopovo.com.br/2026/06/19154615/Faria-Lima-Teatro-B32-baleia-mercado-financeiro-flavio-bolsonaro-plano-de-seguranca-960x540.jpeg", "url_hash": "8e73680122efe07779ce6103a6e7c35a", "title_hash": "7404cfe692f9b361b9acf48a6e7dca90", "corroboration": 1, "relevance_score": 0.2207, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3654, "headline_en": "Flávio Bolsonaro Targets Shell Fintechs Linked to Organized Crime at Faria Lima Event", "headline_pt": "Flávio Bolsonaro mira 'fintechs de fachada' do crime organizado em evento na Faria Lima", "one_liner_en": "Flávio Bolsonaro called on the financial market to act against shell fintechs used by organized crime at a Faria Lima event.", "one_liner_pt": "Flávio Bolsonaro apelou ao mercado financeiro para combater 'fintechs de fachada' do crime organizado em evento na Faria Lima.", "category": "Economy", "region": "brazil", "rationale": "Touches on the intersection of fintech regulation and organized crime, a growing national policy concern.", "low_signal": false}, {"title": "Atendimentos por glaucoma quase dobram no Brasil em 10 anos; doença avança sem sintomas e pode causar cegueira irreversível", "summary": "<img src=\"https://s2-g1.glbimg.com/otZ1V37asjukD6kYYoO3b-v8joo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/4/j/05mJgKRRCNkrTiQB8e4Q/adobestock-293097594.jpeg\" /><br />     Atendimentos por glaucoma quase dobram no Brasil em 10 anos\nAdobe Stock\nA alta silenciosa do glaucoma no Brasil tem ampliado o alerta de especialistas para a importância do diagnóstico precoce. Entre 2015 e 2025, os registros de atendimentos ambulatoriais para tratar a doença praticamente dobraram no país, com aumento de 99,5%, segundo dados do Ministério da Saúde. \nDados da pasta indicam ainda que os as internações por glaucoma de ângulo aberto (o mais comum) aumentaram em 238,3% no mesmo período. \nConsiderada uma das principais causas de cegueira irreversível, a enfermidade costuma evoluir sem sintomas nas fases iniciais e pode comprometer de forma definitiva a visão quando não é identificada e tratada a tempo. \nO que é o glaucoma e por que ele pode causar cegueira\nApesar de ser frequentemente associado ao aumento da pressão ocular, o glaucoma é, na verdade, uma doença do nervo óptico. A diretora da Sociedade Brasileira de Oftalmologia, Maria Vitória Moura Brasil, explica que a doença é de uma neuropatia óptica crônica e progressiva, em que o aumento da pressão intraocular funciona como o principal fator de risco para o dano ao nervo.\nQuando a pressão dentro do olho aumenta, as fibras que formam o nervo óptico podem ser destruídas gradualmente. Como consequência, ocorre perda visual progressiva, geralmente começando pela visão periférica.\nAgora no g1\nO problema é que essa perda costuma passar despercebida durante anos. Na maior parte dos casos, o paciente só percebe alterações quando a doença já atingiu estágio avançado, com comprometimento importante do campo visual.\n“O dano causado ao nervo óptico é irreversível. O que foi perdido não pode ser recuperado”, alerta a especialista.\nDoença silenciosa é a forma mais comum\nO glaucoma é dividido em dois grandes grupos: \nglaucoma de ângulo aberto: mais frequente e caracterizado pela evolução lenta e silenciosa. Nesse caso, a drenagem do líquido interno do olho torna-se ineficiente, favorecendo a elevação gradual da pressão ocular. A perda visual progride sem provocar sintomas perceptíveis nas fases iniciais. \nglaucoma de ângulo fechado: pode se manifestar de forma mais aguda. Quando ocorre um bloqueio repentino da drenagem do líquido ocular, a pressão aumenta rapidamente e pode provocar sintomas como dor ocular, visão embaçada e percepção de halos ao redor das luzes. Esse tipo pode evoluir rapidamente e apresentar crises agudas com dor intensa, vermelhidão, náuseas e queda súbita da visão. \nAlém da forma primária, o glaucoma também pode ser secundário a outras condições, como múltiplas cirurgias oculares, inflamações crônicas, diabetes e doenças sistêmicas.\nCasos aumentam com o envelhecimento da população\nDados do Ministério da Saúde mostram que os atendimentos ambulatoriais relacionados ao glaucoma primário de ângulo aberto passaram de 2.118.490 em 2015 para 4.226.682 em 2025. Já os registros de glaucoma primário de ângulo fechado cresceram de 52.731 para 112.643 no mesmo período, alta de 113,6%. \nO ministério esclarece que esses números correspondem ao total de atendimentos realizados e não ao número de pessoas, já que um mesmo paciente pode ser atendido mais de uma vez.\nDe acordo com a oftalmologista do Instituto de Assistência Médica ao Servidor Público Estadual de São Paulo (Iamspe) Denise Salvalaggio, o aumento acompanha o envelhecimento populacional e a ampliação do acesso aos serviços de saúde. As campanhas de conscientização também têm contribuído para que mais pessoas recebam o diagnóstico precocemente.  \nA prevalência da doença aumenta com a idade e a incidência tende a ser maior após os 40 anos. Embora existam casos na infância e na juventude, é nessa faixa etária que os especialistas recomendam atenção redobrada.\nDiagnóstico depende de consultas regulares\nComo o glaucoma costuma ser assintomático, o exame oftalmológico de rotina é considerado a principal ferramenta para identificar a doença.\nDurante a consulta, o médico avalia o fundo de olho para analisar o aspecto do nervo óptico e mede a pressão intraocular. Caso haja suspeita, exames complementares podem ser solicitados, como campo visual, tomografia de coerência óptica e avaliação da córnea.\nSegundo a médica Moura Brasil, esses exames estão disponíveis no sistema de saúde e são fundamentais tanto para confirmar o diagnóstico quanto para acompanhar a progressão da doença.\nA recomendação é que a população realize consultas oftalmológicas periódicas, especialmente após os 40 anos. Pessoas com histórico familiar de glaucoma, diabetes, uso prolongado de corticoides, hipertensão ou trauma ocular devem iniciar o acompanhamento o quanto antes. \nTratamento controla a doença, mas não reverte danos\nEmbora não tenha cura, o glaucoma pode ser controlado quando diagnosticado precocemente.\nO objetivo do tratamento é reduzir a pressão intraocular para impedir ou retardar a progressão do dano ao nervo óptico. Para isso, podem ser utilizados colírios, procedimentos a laser ou diferentes técnicas cirúrgicas, dependendo do tipo e da gravidade da doença.\n“O paciente precisa entender que o glaucoma tem controle. Com diagnóstico precoce e tratamento adequado, é possível preservar a visão e manter uma vida normal”, afirma a diretora da Sociedade Brasileira de Oftalmologia.\nImpactos vão além da perda visual\nA campanha Maio Verde 2026, promovida pela Sociedade Brasileira de Glaucoma, destaca que os efeitos da doença ultrapassam a visão.\nSegundo a entidade, a perda progressiva do campo visual pode dificultar atividades como dirigir, ler, subir escadas, manter o equilíbrio e realizar tarefas domésticas de forma independente. \nDados reunidos pela campanha apontam que pacientes com glaucoma apresentam risco aumentado de quedas, lesões e acidentes de trânsito. Além disso, a doença está associada a impactos emocionais importantes: entre 19% e 25% dos pacientes apresentam quadros de depressão, 25% convivem com ansiedade e 47% relatam distúrbios do sono. \nA principal mensagem dos especialistas é que o diagnóstico precoce continua sendo a melhor estratégia para preservar não apenas a visão, mas também a autonomia, a segurança e a qualidade de vida dos pacientes.", "url": "https://g1.globo.com/saude/noticia/2026/06/20/atendimentos-por-glaucoma-quase-dobram-no-brasil-em-10-anos-doenca-avanca-sem-sintomas-e-pode-causar-cegueira-irreversivel.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-20T08:00:40+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/otZ1V37asjukD6kYYoO3b-v8joo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/4/j/05mJgKRRCNkrTiQB8e4Q/adobestock-293097594.jpeg", "url_hash": "789e5e846d0fdf7a2fd678f534358328", "title_hash": "40137f974faaeef59850fe920f63162a", "corroboration": 1, "relevance_score": 0.2132, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3616, "headline_en": "Glaucoma Treatment in Brazil Nearly Doubles in a Decade as Silent Disease Advances", "headline_pt": "Atendimentos por glaucoma quase dobram no Brasil em 10 anos; doença avança sem sintomas", "one_liner_en": "Glaucoma care in Brazil has nearly doubled in ten years, as the symptomless disease poses growing risk of irreversible blindness.", "one_liner_pt": "Os atendimentos por glaucoma quase dobraram no Brasil em dez anos, com a doença silenciosa representando risco crescente de cegueira.", "category": "Science", "region": "brazil", "rationale": "A significant public health trend affecting millions of Brazilians with urgency around early detection.", "low_signal": false}, {"title": "O que aprendi fazendo 30 dias seguidos de ioga no outono paulistano", "summary": "Uma editora da BBC fez um teste para saber o que acontece qu // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const xs = [22,50,80,115,148,180,215,248,35,95,162,228];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    xs.forEach((x,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + x + 'px;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const xs  = [16,34,54,76,98,118,142,164,188,212,238,262];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    xs.forEach((x,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + x + 'px;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

// ── Briefing ─────────────────────────────────────────────────────────
function renderBriefing() {
  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round((art.relevance_score || 0) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
