<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">

A mostram confiança crescentemente abalada no Sonho Americano.", "category": "Geopolitics", "region": "world", "rationale": "Timely cultural and political reflection coinciding with the US 250th independence anniversary celebrations.", "low_signal": true}, {"title": "Arrogância do Brasil no futebol contrasta com imagem de país alegre, diz comentarista inglês", "summary": "<img src=\"https://s2-g1.glbimg.com/BS9ndWNxfOKzZLg7zG_VvB5O2hw=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/o/z/Jo8KLDTre2WVsRlscfkw/globo-canal-4-20260630-2000-frame-89676.jpeg\" /><br />     Carlo Ancelotti orienta Martinelli, autor do gol da virada sobre o Japão\nGetty Images\nQuando o jornalista Tim Vickery deixou a Inglaterra para morar no Rio de Janeiro, em 1994, a seleção brasileira voltava a ganhar uma Copa do Mundo após um jejum de 24 anos.\nMesmo depois de uma nova conquista em 2002, Vickery afirma que brasileiros e estrangeiros admiradores da seleção seguem presos à memória dos times que conquistaram três Copas num intervalo de 12 anos, entre 1958 e 1970.\nSegundo o jornalista, essa memória alimenta entre os brasileiros um sentimento de superioridade e a ideia de que o Brasil tem de ganhar todas as Copas, mas também faz com que estrangeiros admiradores da seleção se frustrem quando o time não consegue repetir o nível do passado.\nComentarista de futebol sul-americano da BBC Sport e colaborador de programas esportivos brasileiros, como o Redação SporTV, Vickery diz que os brasileiros são especialmente sensíveis quando a seleção é criticada por estrangeiros.\nAgora no g1\n\"Existe muita raiva e uma sensação constante [entre os brasileiros] de que 'o mundo está contra nós'. Isso contrasta muito com a imagem internacional do Brasil como um país alegre\", afirma.\n\"Na verdade, o mundo continua admirando profundamente a história do futebol brasileiro. Muitas críticas à seleção atual são, no fundo, uma reverência às grandes seleções do passado, especialmente a de 1970.\"\nEm entrevista à BBC News Brasil, Vickery também analisa o desempenho do técnico italiano Carlo Ancelotti na seleção. Segundo ele, Ancelotti é pragmático e nunca teve a pretensão de mudar a filosofia da equipe.\n\"[É como] um médico que chega com Band-Aid e o coloca no lugar certo\", define.\nConfira os principais trechos da entrevista.\nBBC News Brasil: Como você analisa o desempenho do Brasil na Copa até agora?\nTim Vickery: Tem sido muito interessante ver esse choque cultural entre a mentalidade brasileira e um treinador italiano de outra escola. Na cultura italiana, muitas vezes, fazer o mínimo necessário já basta. Ancelotti chegou com pouco tempo e percebeu que essa fase de grupos, especialmente neste formato, permite experimentar. Ele usou esse período como um laboratório para encontrar o time ideal.\nNa visão dele, o Brasil evoluiu: o melhor jogo foi contra o Japão, o segundo melhor contra a Escócia. Em torneios, você não precisa ser o melhor time o tempo todo. Precisa ser o melhor no momento certo.\nJá a mentalidade brasileira ainda está muito presa à visão construída entre 1958 e 1970, quando o Brasil ganhou três Copas em quatro edições. Qualquer coisa diferente disso parece antinatural.\nSó que a diferença entre o futebol de 1970 e o de hoje é enorme. Mais países passaram a levar o futebol extremamente a sério. Mas muitos torcedores brasileiros acompanham pouco o futebol internacional e acabam julgando a seleção sem esse contexto.\nMeu neto [brasileiro] vai fazer nove anos. Ele nunca viu o Brasil ser campeão do mundo, mas, mesmo assim, no imaginário dessa geração ainda existe aquela ideia de superioridade da seleção brasileira.\nHá situações que só acontecem aqui, como vaiar o Alisson [o goleiro brasileiro foi vaiado no Maracanã após sofrer um gol no jogo em que o Brasil ganhou de 6 a 2 do Panamá, em 31 de maio]. Vejo esses choques culturais entre a abordagem do Ancelotti e uma expectativa brasileira que, em muitos aspectos, ainda está presa ao passado.\nSeleção de 1970 encantou o mundo e definiu padrão jamais repetido, diz Tim Vickery\nGetty Images\nBBC News Brasil: Você já percebia essa postura quando se mudou para o Brasil, em 1994?\nVickery: Sim. Essa ideia já existia. Às vezes sinto até uma certa pena, porque a Copa é uma viagem, mas no Brasil parece que só o destino importa. Se ela não termina com o título, nada valeu.\nÉ uma situação curiosa: a torcida brasileira é, ao mesmo tempo, mal acostumada pelo sucesso histórico e frustrada pelos resultados recentes.\nBBC News Brasil: Havia uma expectativa de que um técnico estrangeiro fosse resolver os problemas da seleção. Mas, um ano depois da chegada de Ancelotti, o time ainda parece em construção. A expectativa era irreal?\nVickery: Era. Existem técnicos que chegam para implantar uma filosofia e outros que trabalham com o material que têm. O Ancelotti pertence ao segundo grupo.\nDesde o início ele disse que não queria um time preso a uma identidade única. Quer uma equipe capaz de fazer coisas diferentes conforme o jogo exige.\nEsperar que ele transformasse completamente o Brasil em um ano nunca foi realista.\nO grande mérito dele é a serenidade e a capacidade de tomar decisões difíceis. Contra o Japão, por exemplo, fez mudanças que quase ninguém faria e elas decidiram a partida. Isso não acontece por acaso, é uma marca da carreira dele.\nEntão, em vez de um grande idealista, um grande filósofo com uma ideia de futebol que não não teria tempo para implantá-la, você tem um médico que chega com Band-Aid e o coloca no lugar certo.\nBBC News Brasil: Em qual patamar você enxerga o Brasil nesta Copa?\nVickery: A França está um patamar acima de todo mundo. Mas o Brasil continua capaz de vencer qualquer seleção.\nO próprio Ancelotti sabe que existem várias equipes que podem derrotar o Brasil, mas também sabe que o Brasil pode vencer qualquer uma delas. A França seria difícil, mas ele vai levantar uma sobrancelha e pensar num jeito.\nBBC News Brasil: Você recentemente criticou nas redes sociais brasileiros que têm um discurso bastante reativo quando estrangeiros criticam a seleção e ficam o tempo todo cobrando respeito ao time. Pode explicar?\nVickery: Eu falava tanto da seleção quanto dos clubes [brasileiros], mas quase todas as respostas se concentraram na seleção. E percebi que esse discurso aparece em todo lugar: \"tem que respeitar o Botafogo\", \"tem que respeitar o Fluminense\"... É algo muito forte na cultura brasileira.\nO Brasil é um país que construiu muitos mitos sobre si mesmo. A identidade nacional foi fortemente moldada ao longo do século 20, e o futebol teve um papel central nesse processo.\nQuando cheguei aqui, uma das coisas que mais me surpreenderam foi a quantidade de raiva presente no debate esportivo. Existe muita raiva e uma sensação constante [entre os brasileiros] de que \"o mundo está contra nós\". Isso contrasta muito com a imagem internacional do Brasil como um país alegre.\nNa verdade, o mundo continua admirando profundamente a história do futebol brasileiro. Muitas críticas à seleção atual são, no fundo, uma reverência às grandes seleções do passado, especialmente a de 1970.\nBBC News Brasil: Você sente que, por ser estrangeiro, as críticas que faz à seleção brasileira provocam reações mais fortes?\nVickery: Dentro da enorme insignificância da minha opinião, sou obrigado a concordar.\nTim Vickery se mudou para o Rio em 1994 e virou especialista em futebol sul-americano.\nEduardo Martino\nBBC News Brasil: Essa ideia de que a camisa da seleção tem uma força quase mítica acaba prejudicando o time?\nVickery: A tradição pode inspirar, mas também pode atrapalhar. Confiança não é uma coisa abstrata, ela nasce da percepção da própria capacidade.\nO Brasil é historicamente a maior seleção do mundo, mas é a única grande potência que sediou duas Copas e não venceu nenhuma. A pressão pesa muito.\nBBC News Brasil: Acha que a torcida brasileira mais atrapalha do que ajuda?\nVickery: Pode atrapalhar. E não é somente a torcida, mas também a necessidade de fazer jus a uma tradição que pesa muito.\nEm 2014 isso ficou muito claro. A Alemanha provavelmente venceria aquele Brasil na maioria das vezes. Mas nunca seria 7 a 1 sem toda a pressão emocional de uma Copa disputada em casa.\nBBC News Brasil: Muitos brasileiros se impressionam com imagens de torcedores em países como Bangladesh, Haiti e Líbano comemorando as vitórias do Brasil. A força simbólica do futebol brasileiro no exterior continua a mesma?\nVickery: Acho que diminuiu um pouco, mas continua muito forte.\nIsso tem muito a ver com o México de 1970. Aquela seleção marcou o imaginário do planeta inteiro. O Brasil virou o \"segundo time\" de muita gente.\nO Brasil ficou estabelecido como a terra da pureza futebolística. Não é só que ganhava, era como ganhava. Ganhava sem truques, sem sujeira. Quem conhece a história do futebol sul-americano sabe que essa visão é idealizada demais, mas foi assim que o Brasil passou a ser visto, e essa imagem continua servindo como parâmetro.\nHoje, quando as pessoas veem o Brasil tratando a bola no meio-campo como não fazia antigamente, ou jogadores caindo em campo de uma maneira que também não caíam, surge a comparação.\nHouve até um debate sobre as dancinhas [na comemoração de gols] na última Copa. Para muita gente, aquilo soou como uma forma de humilhação do adversário. No Brasil, a resposta foi: \"Isso faz parte da nossa cultura\". Os estrangeiros respondem: \"Mas o time de 1970 não fazia nada disso\".\nPor causa disso, pessoas que antes adotavam o Brasil como seu segundo time já não fazem isso com a mesma frequência.\nA Nike [patrocinadora da seleção] tentou reforçar, nos anos 1990, essa imagem quase mítica do Brasil como o Dream Team do futebol. Só que, quando a realidade não corresponde a esse ideal, isso gera uma reação contrária.\nBBC News Brasil: Existe a possibilidade de Brasil e Inglaterra se enfrentarem nas quartas de final. Como esse confronto seria visto pelos ingleses?\nVickery: Primeiro a Inglaterra teria de passar pelo México no [estádio] Azteca, o que já seria dificílimo.\nMas, claro, o Brasil continua impondo um enorme respeito. Mesmo com problemas, tem talento individual suficiente para decidir qualquer jogo.\nSe a Inglaterra eliminasse México, Brasil e Argentina em sequência, seria, para mim, a maior campanha da história da seleção inglesa.\nBBC News Brasil: Os clubes brasileiros são hoje os mais fortes da América do Sul, e quase todas as últimas edições da Copa Libertadores foram vencidas por equipes brasileiras. Por que isso não se traduz numa superioridade do Brasil em relação às outras seleções sul-americanas?\nVickery: Porque hoje existe uma separação muito grande entre o futebol doméstico e o futebol de seleções.\nA seleção colombiana, por exemplo, quase não tem jogadores atuando na Colômbia. O mesmo vale para Paraguai, Equador e vários outros países.\nHoje muitos dos melhores jogadores do Campeonato Brasileiro nem brasileiros são. Portanto, a força da liga nacional já não se reflete automaticamente na força da seleção.\nBBC News Brasil: Você conhece profundamente o futebol argentino. Como compara a relação de brasileiros e argentinos com suas seleções?\nVickery: A Argentina tem uma torcida muito mais orgânica. A seleção joga quase sempre em Buenos Aires, existe um público que acompanha sempre.\nNo Brasil, como a seleção circula pelo país inteiro, há um esforço constante para construir essa identidade de torcida.\nMas, no fundo, o papel simbólico da seleção é parecido nos dois países. Brasil, Argentina e Uruguai transformaram o futebol em uma das principais expressões da identidade nacional.\nBBC News Brasil: Se a Argentina conquistar esta Copa e Messi mantiver o nível que apresentou nos primeiros jogos, crescerão as comparações entre ele e Pelé?\nVickery: Sem dúvida. Fora do Brasil, isso provavelmente consolidaria a ideia de que Messi superou Pelé.\nEu, pessoalmente, ainda escolheria Pelé. Pelé ajudou a transformar a Copa do Mundo no maior evento esportivo do planeta. Todos nós que vivemos o futebol moramos, de certa forma, numa casa que Pelé construiu.\nAo mesmo tempo, o que Messi faz aos 39 anos de idade também precisa ser valorizado.\nO problema é quando esse debate vira uma disputa para diminuir um dos dois. Quem ama futebol ama Pelé e ama Messi. Ponto.", "url": "https://g1.globo.com/mundo/noticia/2026/07/05/arrogancia-do-brasil-no-futebol-contrasta-com-imagem-de-pais-alegre-diz-comentarista-ingles.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-05T10:37:17+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/BS9ndWNxfOKzZLg7zG_VvB5O2hw=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/o/z/Jo8KLDTre2WVsRlscfkw/globo-canal-4-20260630-2000-frame-89676.jpeg", "url_hash": "6c7f5169b0d4ce2fa526d61fbd1b6e7a", "title_hash": "0b65ed848e55e3f8bddac6a5d5bb639d", "corroboration": 2, "relevance_score": 0.2163, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5632, "headline_en": "English Commentator Says Brazil's Football Arrogance Clashes With Its Joyful Image", "headline_pt": "Comentarista inglês diz que arrogância do Brasil no futebol contrasta com imagem alegre do país", "one_liner_en": "Tim Vickery argues Brazil's sense of football superiority stems from its 1958–1970 golden era, fueling frustration when the team falls short.", "one_liner_pt": "Tim Vickery afirma que o sentimento de superioridade do Brasil vem da era de ouro entre 1958 e 1970, gerando frustração quando a seleção decepciona.", "category": "Culture", "region": "brazil", "rationale": "With Brazil active in the 2026 World Cup, debate over the national team's attitude is highly relevant.", "low_signal": true}, {"title": "Arrogância do Brasil no futebol contrasta com imagem de país alegre, diz comentarista inglês", "summary": "Para o especialista em futebol sul-americano Tim Vickery, que mora no Brasil desde 1994, memória das conquistas entre 1958 e 1970 define até hoje o relacionamento dos brasileiros com a seleção, alimentando sentimento de superioridade e gerando frustração e revolta quando a equipe não é campeã.", "url": "https://www.bbc.com/portuguese/articles/ce954kdp9mdo?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-07-05T09:33:43+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/a131/live/7973d8d0-7853-11f1-975d-e3c93736afa3.jpg", "url_hash": "e7959ccc569207115de7ff73f784d718", "title_hash": "0b65ed848e55e3f8bddac6a5d5bb639d", "corroboration": 2, "relevance_score": 0.1872, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5486, "headline_en": "English Commentator: Brazil's Football Arrogance Clashes With Its Joyful Image", "headline_pt": "Comentarista inglês: arrogância do Brasil no futebol contrasta com imagem alegre do país", "one_liner_en": "Tim Vickery says Brazil's golden era legacy from 1958–1970 breeds a superiority complex that turns to fury when the team doesn't win.", "one_liner_pt": "Tim Vickery diz que o legado entre 1958 e 1970 alimenta um complexo de superioridade que vira revolta quando a seleção não é campeã.", "category": "Culture", "region": "brazil", "rationale": "Insightful cultural analysis of Brazilian football identity during an active World Cup.", "low_signal": false}, {"title": "O 'American Dream' ainda sobrevive nos EUA?", "summary": "<img src=\"https://s2-g1.glbimg.com/-qZN_7U3toxC_MMIOMfukhpCq18=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/4/H/9F6yWJQL23ERTKMOL4AQ/9dd0d7eb-f931-4ca9-bba8-372fae4fcd9d.png\" /><br />     Pesquisas realizadas pouco antes das comemorações dos 250 anos dos EUA mostram que muitos americanos acreditam que o Sonho Americano está perdendo força\nGetty Images\nHá 16 anos, Abdi Nor Iftin era um refugiado somali que vivia em uma das favelas mais pobres do Quênia quado descobriu que havia sido contemplado em um sorteio que mudaria sua vida. \nEntre quase 8 milhões de candidatos em 2013, ele estava entre os 50 mil selecionados para receber um visto americano por meio do programa de vistos de diversidade, criado pelo governo dos Estados Unidos na década de 1990.\nIftin sonhava havia muito tempo em se mudar para os EUA. Era tão obcecado pelo país que os amigos de infância chegaram a apelidá-lo de \"Abdi América\", depois que ele aprendeu inglês assistindo a filmes de Hollywood. \n\"Passei a vida inteira apaixonado pelos EUA, o melhor país do mundo, a terra dos sonhos, a terra das oportunidades\", disse em entrevista à BBC em 2014.\nAgora no g1\nNaquele ano, Iftin, hoje com 41 anos, chegou aos EUA, se estabeleceu em uma pequena cidade no Estado do Maine, conseguiu um emprego instalando isolamento térmico e se tornou cidadão americano. \nMas, agora, suas expectativas deram lugar à realidade. Neste ano, ele perdeu o emprego em uma agência de reassentamento de refugiados e, com isso, também o plano de saúde.\nÀs vésperas do aniversário de 250 anos dos EUA, Iftin, como muitos americanos, vê com apreensão o futuro de seu país. \n\"Eu sinto que o sonho americano continua vivo, mas está longe de estar bem.\"\nAbdi Nor Iftin foi para os Estados Unidos por meio do programa de vistos por diversidade\nBBC\nLuke Mullen, um ator de 24 anos da Califórnia, contou à BBC que planeja se mudar para o Canadá por causa da falta de oportunidades na indústria cinematográfica de Hollywood — logo Hollywood.\nPesquisas realizadas às vésperas do aniversário de 250 anos da fundação dos EUA mostram que muitos americanos acreditam que o \"sonho americano\", a promessa de que qualquer pessoa no país pode construir um futuro melhor, está perdendo força.\nUma pesquisa recente da Associated Press-NORC mostrou que apenas um terço da população acredita que o sonho americano ainda existe. O resultado se repete em diversos levantamentos. \nUm estudo recente do centro de estudos Pew Research Center concluiu que a maioria dos americanos considera que os melhores dias do país já ficaram para trás.\nO aniversário de 250 anos dos EUA também acontece em um momento de forte polarização política, de uma profunda divisão partidária.\nO que significa quando o sonho americano, uma ideia exportada para o mundo por meio do cinema, da música e da cultura pop, passa a parecer fora do alcance?\n'Não é apenas um sonho de carros'\nNos primeiros anos após a Guerra da Independência dos EUA e ao longo dos séculos seguintes, o que passou a ser conhecido como o \"sonho americano\" atraiu milhões de imigrantes para essa nova nação, vista como um lugar de esperança, otimismo e individualismo. \nOperários, agricultores, garimpeiros e pioneiros migraram para os EUA acreditando que poderiam construir uma nova identidade, a de \"americano\", livre dos sistemas de classe da Europa.\nHistoriadores lembram que o \"sonho americano\" nunca incluiu todos: certamente não os povos indígenas, as pessoas escravizadas, nem mesmo as mulheres. Ainda assim, a ideia persistiu.\nO conceito remonta à fundação do país, mas a expressão só se popularizou mais tarde, com A Epopeia Americana, livro publicado em 1931, durante a Grande Depressão (1929-1939).\nNele, o historiador James Truslow Adams escreveu: \"Não é apenas um sonho de carros e altos salários, mas o sonho de uma ordem social em que cada homem e cada mulher possa desenvolver plenamente as capacidades com que nasceu.\"\nAo longo dos anos, o slogan evoluiu. Hoje, costuma ser associado ao empreendedorismo, à mobilidade social e, acima de tudo, às oportunidades econômicas.\nImigrantes chegaram em massa à Ilha Ellis, nos EUA, nos séculos 19 e 20\nDivulgação\n\"Sempre se tratou de viver melhor do que antes\", afirma Cyril Ghosh, autor de The Politics of the American Dream: Democratic Inclusion in Contemporary American Political Culture (\"A política do sonho americano: inclusão democrática na cultura política americana contemporânea\", em tradução livre).\n\"Para algumas pessoas, viver melhor significa simplesmente deixar de ser perseguido pela Igreja Anglicana. [...] Não é sobre bens materiais, apenas. É também sobre segurança. Sobre viver melhor do que na etapa anterior da vida. Foi disso que o sonho americano sempre tratou.\"\nIftin cresceu na Somália, escondendo-se em trincheiras para não ser morto pelo grupo extremista Al-Shabaab.\n\"A liberdade era uma prioridade enorme. Sobreviver ao dia seguinte, acordar vivo no dia seguinte, era uma preocupação muito grande. Era isso que eu queria\", diz, ao explicar por que desejava se mudar para os EUA.\nPesquisadores afirmam que imigrantes de primeira geração, como Iftin, costumam ser mais otimistas em relação às oportunidades oferecidas pelos EUA.\n\"Muitos vêm de países mais pobres. Por isso, suas condições de vida tendem a ser melhores do que seriam se eles não tivessem emigrado\", afirma Elizabeth Suhay, autora de Debating the American Dream: How Explanations for Inequality Polarize Politics (\"Debatendo o sonho americano: como as explicações para a desigualdade polarizam a política\", em tradução livre).\n\"Em sua maioria, os imigrantes têm maior probabilidade de dizer que estão realizando o sonho americano ou que já o realizaram\", afirma Mark Hugo Lopez, diretor de pesquisas sobre raça e etnia do Pew Research Center, que estuda em profundidade as percepções de imigrantes latino-americanos. \nSegundo Lopez, esse grupo também costuma ser mais otimista em relação às perspectivas para os filhos.\nO 'sonho americano' interrompido\nO sonho americano sempre foi um grande atrativo para imigrantes. Mas, hoje, menos pessoas estão chegando ao país.\nO presidente dos EUA, Donald Trump, fez do combate à imigração um dos pilares de seu governo, depois de fazer campanha com a promessa de implementar o maior programa de deportação em massa da história.\nEm seu segundo mandato, Trump não apenas restringiu a entrada de imigrantes pela fronteira sul como também bloqueou algumas das vias legais de imigração para os EUA, entre elas o programa de vistos por diversidade, utilizado por Iftin.\nHoje, os EUA não apenas recebem menos imigrantes. Também há indícios de que um número recorde de pessoas esteja deixando o país.\nA política de endurecimento das regras de imigração adotada pelo atual governo ajudou a reduzir o número de imigrantes\nGetty Images\nUma das explicações é que muitos americanos que cresceram nos EUA sentem que o país não cumpriu sua parte do acordo: a ideia de que, trabalhando duro e seguindo as regras, seria possível ter uma vida digna e confortável.\nNo ano passado, pela primeira vez, o número de americanos que se mudaram para a Irlanda superou o de irlandeses que emigraram para os EUA. O governo americano não monitora quantos cidadãos deixam o país voluntariamente e, por isso, não há estatísticas oficiais. Mas reportagens indicam que o fenômeno não se restringe à Irlanda.\nUm número recorde de americanos está solicitando a cidadania britânica. Além disso, o jornal americano The Wall Street Journal informou que cresce o número de americanos que se mudam para viver e trabalhar em quase todos os 27 países da União Europeia.\nPor que essas pessoas estão deixando os EUA? Alguns apontam o cenário político do país; outros mencionam os custos da saúde e o padrão de vida. Na maioria dos casos, no entanto, a decisão provavelmente resulta de uma combinação de fatores, incluindo motivos pessoais.\nPara Mullen, a questão é o mercado de trabalho. O ator, que ficou conhecido ainda adolescente pela série Andi Mack, da Disney, e hoje se dedica mais à escrita e à produção, afirma que atualmente encontra mais oportunidades para trabalhar em projetos de cinema em Vancouver, no Canadá, do que no sul da Califórnia, onde fica Hollywood.\nVancouver passou a contar com novos incentivos fiscais do governo para fortalecer sua competitividade em relação a Hollywood e se consolidar como um importante polo da indústria cinematográfica.\nO sonho americano foi vendido ao mundo, em parte, por meio do cinema dos EUA. \nE, em muitos aspectos, Hollywood simboliza a ideia de vencer na vida no país. Para Mullen, a realidade é mais complexa. Segundo ele, havia mais oportunidades no passado. Nos últimos anos, os investimentos dos grandes estúdios em filmes e séries produzidos em Hollywood estagnaram ou diminuíram.\n\"Nem consigo imaginar como era crescer nos anos 1990, durante o auge da televisão, das comédias românticas e de tantos outros projetos. Mas, principalmente agora, estamos vendo um esforço enorme para cortar custos, dificultar cada vez mais a produção de novos projetos, assumir cada vez menos riscos e contratar menos pessoas\", afirma.\nMullen conseguiu a cidadania canadense recentemente graças a uma mudança na legislação do país, aprovada em dezembro do ano passado.\n\"Meu processo para me tornar cidadão canadense está diretamente ligado ao fato de que não consigo produzir aqui [nos EUA] projetos nos quais trabalho há anos e pelos quais sou apaixonado\", diz.\nPor isso, ele pretende se mudar para o Canadá, embora faça questão de ressaltar que não será para sempre.\n\"Nunca vou abandonar os EUA. Este é o meu país e ainda vale a pena lutar por ele. Há muita coisa que precisamos fazer para torná-lo um lugar melhor\", afirma.\nAspiração versus realidade\nHoje, há um consenso entre sociólogos e cientistas políticos de que o sucesso financeiro se tornou um dos pilares centrais do \"sonho americano\", a crença de que meus filhos ou netos terão uma vida melhor do que a minha.\n\"Em linhas gerais, o sonho americano é a ideia de que, se você trabalhar duro, deverá conquistar uma vida confortável, o que poderíamos chamar de um padrão de vida de classe média: uma casa, acesso à saúde, condições de cuidar dos filhos, um carro e ensino superior\", afirma Suhay.\nOs dados também indicam que, nos últimos 50 anos, a ideia de que cada geração viveria melhor do que a anterior perdeu força.\nUma pesquisa do economista Raj Chetty, da Universidade Harvard, nos EUA, constatou que, entre os nascidos em 1940, 90% acabaram ganhando mais do que seus pais. Hoje, apenas metade das pessoas nascidas na década de 1980 está no caminho para superar economicamente a geração anterior.\nEssa percepção de prosperidade econômica se difundiu nos anos 1950, durante o boom do pós-Segunda Guerra Mundial (1939-45), simbolizado talvez da melhor forma pela expansão dos bairros de casas unifamiliares cercadas por cercas brancas de madeira. \nSegundo Ghosh, o sonho americano ganhou ainda mais força no discurso político em meados da década de 1960, com o movimento pelos direitos civis e a adoção de políticas de imigração mais amplas.\n\"Ele é uma parte essencial dos EUA\", afirma Suhay. \"Quase todo mundo concorda que esse é um ideal importante. Mas há um enorme debate sobre se os EUA realmente conseguem entregar o sonho americano.\"\nEntão, quando o sonho americano começou a perder força?\nSegundo Mark Rank, coautor de Chasing the American Dream: Understanding What Shapes Our Fortunes (\"Em busca do sonho americano: entendendo o que molda nosso destino\", em tradução livre), o sonho americano começou a enfraquecer há cerca de 50 anos, a partir da década de 1970, com a globalização e a estagnação dos salários.\n\"Ficou muito mais difícil alcançar o sonho americano, essa ideia de um acordo implícito segundo o qual, se você trabalhar duro e seguir as regras, poderá ter uma vida confortável do ponto de vista econômico\", afirma Rank. \n\"A noção de que cada geração teria uma situação econômica melhor do que a anterior sempre foi um componente central do sonho americano. E isso permaneceu verdadeiro até mais ou menos a década de 1970.\"\nEspecialistas afirmam que, nos anos seguintes, o sonho americano entrou em um período de declínio prolongado, à medida que a desigualdade socioeconômica aumentava.\nDepois, segundo alguns deles, houve outro ponto de inflexão: a crise financeira de 2008 e seus desdobramentos, que tornaram a casa própria e a estabilidade no emprego cada vez mais difíceis de alcançar.\nMuitos americanos nunca recuperaram o otimismo econômico que tinham antes da crise. Ainda assim, os salários nos EUA continuam significativamente mais altos do que no Reino Unido e em grande parte da Europa.\nApesar disso, permanece uma forte divisão partidária sobre a possibilidade de alcançar o sonho americano. \nPesquisas mostram que republicanos e americanos mais velhos continuam mais propensos a acreditar nele. \nJá os jovens demonstram um ceticismo muito maior. Uma sondagem revelou que apenas um em cada cinco adultos entre 18 e 29 anos, como o ator Luke Muellen, acredita que o sonho americano ainda seja possível.\nMas isso não significa que o sonho americano sempre tenha sido apenas uma questão de sucesso financeiro. \nPara muitas pessoas, ele representa sobretudo um ideal de liberdade e de direitos individuais, cujas origens remontam aos documentos fundadores dos EUA, como a Bill of Rights (\"Carta de Direitos\", em tradução livre).\nNesse sentido, vale lembrar que muitos negros americanos há muito tempo consideram o sonho americano um mito, construído sobre a retórica idealista dos \"Pais Fundadores\" (grupo de pessoas ligadas à independência americana e à fundação institucional do país), mas incompatível com a realidade da escravidão e da segregação racial que marcaram a história do país.\nOs negros americanos há muito tempo são mais céticos em relação ao 'American Dream'\nGetty Images\nMuito antes de o desencanto com o sonho americano se espalhar pelo país, Martin Luther King Jr. já dizia que os EUA manifestavam uma \"personalidade esquizofrênica\". \n\"Em um sentido muito real, os EUA são, em essência, um sonho, um sonho que ainda não se realizou\", afirmou ele em um discurso pronunciado na Carolina do Norte, em 1960. \n\"A escravidão e a segregação têm sido paradoxos profundos em uma nação fundada sobre o princípio de que todos os homens são criados iguais.\"\nReniqua Allen-Lamphere, escritora que pesquisou a visão da população negra sobre o sonho americano, descreve o conceito como um dos \"mitos mais duradouros\" dos EUA. \n\"Os negros têm uma relação própria com o sonho americano, em parte porque grande parte de sua história foi uma luta pela liberdade em seu sentido mais básico\", disse à BBC.\nMas ela acrescenta: \"O sonho americano também faz parte de mim, essa esperança de que dias melhores virão. Embora eu ache isso difícil. Muito difícil.\"\nMantendo vivo o sonho americano\nUm dado chamou minha atenção ao analisar as diversas pesquisas de opinião realizadas nos últimos meses. Um levantamento do jornal The Times mostrou que, apesar do pessimismo em torno do sonho americano, \"61% dos entrevistados disseram ainda acreditar nesse ideal\".\nBrandon Patty, de 44 anos, escriturário e controlador financeiro no condado de St. Johns, na Flórida, além de comandante da Reserva da Marinha dos EUA, é um desses americanos que acreditam com convicção que o sonho americano continua vivo e funcionando. \n\"É uma honra fazer parte disso\", diz. \"Só pela graça de Deus, por ter nascido aqui e por fazer parte do experimento americano.\"\n\"Quando ouço a expressão sonho americano, penso que as oportunidades são ilimitadas que, nos EUA, você pode partir do nada e encontrar seu caminho. Isso é algo que, de muitas maneiras, faz parte da própria identidade americana\", afirma Patty.\nPatty foi o primeiro de sua família a concluir a faculdade e o primeiro de sua geração a terminar o Ensino Médio. \"Hoje tenho 44 anos e, sinceramente, estou vivendo esse sonho\", afirma.\nGonzalo Schwarz, presidente e diretor-executivo do think tank (centro de pesquisa e debates) The Archbridge Institute, concorda que é importante destacar os aspectos positivos de viver nos EUA.\nUm levantamento realizado pelo próprio instituto concluiu que a maioria dos entrevistados em diferentes grupos demográficos acredita que o sonho americano continua vivo.\nSegundo a organização, esse resultado decorre de uma metodologia diferente, baseada em perguntas mais diretas do que as usadas na maior parte das pesquisas, que, segundo ela, abordam o tema de forma mais conceitual. \n\"Se nos concentrarmos apenas nos aspectos negativos e na parcela das pessoas que acreditam que o sonho americano está fora de alcance, corremos o risco de transformar seu declínio em uma profecia autorrealizável\", afirma Schwarz. \n\"Precisamos dar um passo atrás, adotar uma perspectiva de longo prazo e buscar reacender o sonho americano como um farol de esperança para os próximos 250 anos dos EUA.\"\nMuitos dos ideais da Revolução Americana permanecem vivos até hoje\nGetty Images\nPara Rank, o sociólogo que escreveu sobre o tema, o sonho americano continua vivo, embora hoje seja mais difícil de alcançar do que no passado.\n\"Se dissermos que ele deixou de existir, estaremos eliminando um componente fundamental da identidade dos EUA\", afirma. \n\"Existem dúvidas sobre o sonho americano, e também incertezas.\" \nMas, na visão dele, em sintonia com a tradição de otimismo do país, essas dúvidas representam uma oportunidade para repensar como os EUA podem garantir que o sonho americano continue ao alcance de todos nos próximos 250 anos.\nDe volta ao Estado do Maine, Iftin conta que seu irmão Hassan, que não conseguiu imigrar para os EUA por causa das restrições aos vistos, tornou-se recentemente cidadão canadense. \n\"Meu irmão diz que o sistema de saúde de lá é melhor\", afirma, em meio a risadas.\nApesar dos obstáculos, Iftin diz que, se pudesse voltar no tempo, ainda escolheria os EUA. \n\"Acho que foi o meu primeiro amor.\"", "url": "https://g1.globo.com/mundo/noticia/2026/07/05/o-american-dream-ainda-sobrevive-nos-eua.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-05T12:35:52+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/-qZN_7U3toxC_MMIOMfukhpCq18=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/4/H/9F6yWJQL23ERTKMOL4AQ/9dd0d7eb-f931-4ca9-bba8-372fae4fcd9d.png", "url_hash": "e6e094f4f2fd6b5b98ec9f4cd0580bf1", "title_hash": "e097da1f2fe6ec9d879ea071859723fe", "corroboration": 2, "relevance_score": 0.146, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.528, "headline_en": "Is the American Dream Still Alive?", "headline_pt": "O Sonho Americano ainda está vivo?", "one_liner_en": "Polls taken before the US 250th anniversary reveal many Americans feel the American Dream is fading.", "one_liner_pt": "Pesquisas realizadas antes dos 250 anos dos EUA revelam que muitos americanos sentem que o Sonho Americano está perdendo força.", "category": "Geopolitics", "region": "world", "rationale": "Duplicate of index 0; near-identical story from a different source.", "low_signal": true}, {"title": "Copa impulsiona contratações temporárias no Brasil; veja os direitos dos trabalhadores", "summary": "<img src=\"https://s2-g1.glbimg.com/mI6SY1bkWi7dAQo4ymtd3107YUs=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/6/5/AKSfCzQuqsHuDStZi11g/whatsapp-image-2026-06-10-at-20.07.21.jpeg\" /><br />     Copa do Mundo: Brasil pode ter mais dois jogos em dias úteis\nA Copa do Mundo de 2026 já movimenta o mercado de trabalho brasileiro, mesmo sendo realizada nos Estados Unidos, Canadá e México. O torneio, que segue até 19 de julho, tem impulsionado o consumo de alimentos, bebidas, televisores, artigos esportivos e produtos para confraternizações.\nCom isso, empresas reforçaram as equipes, principalmente em bares e restaurantes, comércio, logística, turismo e eventos, com foco em contratações temporárias. (veja abaixo os direitos do trabalhadores)\n🗒️ Tem alguma sugestão de reportagem? Mande para o g1\nDados da Catho, obtidos com exclusividade pelo g1, mostram que, entre abril e junho deste ano, o número de vagas anunciadas em setores tradicionalmente beneficiados pelo torneio cresceu 26% na comparação com o mesmo período de 2025.\nForam 40.217 vagas anunciadas neste ano, ante 31.910 no mesmo intervalo do ano passado. \nAs maiores altas entre os cargos ocorreram para atendente de restaurante (+120%), auxiliar de loja (+38%), auxiliar de produção (+28%) e auxiliar de logística (+16%). Já entre as áreas de atuação, restaurantes registraram crescimento de 47% nas vagas, enquanto logística e suprimentos avançaram 16%.\nO crescimento foi puxado principalmente por funções operacionais e de atendimento ao público. Veja os destaques do segundo trimestre em comparação com o mesmo período do ano passado.\nPor profissão\nAtendente de Restaurante: +1.975 vagas (saltou de 1.634 para 3.609 — um crescimento de +120%).\nAuxiliar de Produção: +1.477 vagas (de 5.215 para 6.692 — crescimento de +28%).\nAuxiliar de Loja: +1.472 vagas (de 3.814 para 5.286 — crescimento de +38%).\nAuxiliar de Logística: +1.172 vagas (de 7.128 para 8.300 — crescimento de +16%).\nPor área de atuação:\nLogística Suprimentos: +2.973 vagas (de 18.584 para 21.557 — alta de +16%).\nRestaurante: +2.922 vagas (de 6.217 para 9.139 — alta de +47%).\nAdministrativo Comercial: +2.777 vagas (de 63.575 para 66.352 — alta de +4%).\nAdministrativa: +2.333 vagas (de 13.247 para 15.580 — alta de +17%).\nAdministrativo/ Operacional: +2.065 vagas (de 25.315 para 27.380 — alta de +8%).\nSegundo a Associação Brasileira do Trabalho Temporário (Asserttem), a Copa se soma a outras datas sazonais, como o Dia das Mães e o Dia dos Namorados, para impulsionar a contratação de trabalhadores.\nA entidade estima cerca de 600 mil contratos temporários entre abril e junho de 2026 e afirma que aproximadamente 20% dos profissionais acabam sendo efetivados pelas empresas.\nPara Alexandre Leite Lopes, presidente da Asserttem, a competição costuma ampliar a demanda por mão de obra principalmente nos setores de comércio, indústria e serviços.\n\"Quanto mais tempo a Seleção Brasileira permanecer na competição, maior tende a ser o prolongamento desses contratos\", afirma. Segundo ele, muitos trabalhadores enxergam as vagas temporárias como uma oportunidade de recolocação e efetivação.\nFuncionários trabalham na startup GetNinjas, que enfeitou o ambiente de trabalho para os jogos da Copa do Mundo\nMarcelo Brandt/G1\nInteresse dos trabalhadores também cresce\nUma pesquisa do InfoJobs mostra que 65,1% dos entrevistados pretendem buscar empregos temporários durante a Copa do Mundo, enquanto 64,8% acreditam que grandes eventos esportivos aumentam as chances de conseguir trabalho.\nPara Hosana Azevedo, gerente de Recursos Humanos da Redarbor Brasil, detentora do Infojobs, a competição amplia a demanda por mão de obra em diversos segmentos.\n\"Para muitos profissionais, esse pode ser um caminho para conquistar renda extra, adquirir experiência ou até abrir portas para futuras contratações efetivas\", afirma.\nEla destaca que muitas empresas utilizam esse período para identificar talentos e avaliar candidatos em situações reais de trabalho.\nVagas temporárias frequentemente podem se transformar em oportunidades efetivas para candidatos que apresentem bom desempenho, comprometimento e capacidade de adaptação.\nSegundo especialistas do setor, as oportunidades concentram-se principalmente em funções operacionais e de atendimento, como garçons, atendentes, cozinheiros, bartenders, operadores de caixa, auxiliares de logística, estoquistas e entregadores.\nAlém da experiência técnica, as empresas também buscam profissionais com boa comunicação, flexibilidade, disponibilidade de horário e capacidade para trabalhar sob pressão.\nBar Novo Estrela preparado para recebr os jogos da Copa do Mundo\nArquivo Pessoal\nBares e restaurantes esperam faturar mais\nEntre os setores mais beneficiados está o de alimentação. Levantamento da Associação Brasileira de Bares e Restaurantes (Abrasel) mostra que 80% dos empresários esperam aumentar o faturamento durante a Copa, enquanto 52% pretendem transmitir os jogos.\nOs segmentos mais impactados são bares, restaurantes, cervejarias, choperias, churrascarias e espetarias, que costumam registrar maior movimento durante as partidas da Seleção Brasileira. A maior parte dos empresários estima crescimento de até 20% nas receitas.\nSegundo José Eduardo Camargo, líder de Conteúdo e Inteligência da Abrasel, o desempenho da Seleção influencia diretamente o consumo.\n\"Os jogos da Seleção são os principais picos de faturamento. Nesses dias, há aumento expressivo no fluxo de clientes e no gasto médio, o que transforma cada partida em uma oportunidade relevante de geração de receita para bares e restaurantes\", explica o especialista da Abrasel. \nCamargo destaca ainda que muitos estabelecimentos também exibem partidas de outras seleções, mantendo o movimento ao longo de toda a competição e justificando reforços pontuais nas equipes durante o torneio.\nAlém da alimentação, o varejo também deve ser beneficiado pelo aumento do consumo durante a Copa, avalia Thiago Carvalho, assessor econômico da Federação do Comércio de Bens, Serviços e Turismo do Estado de São Paulo (FecomercioSP).\nOs segmentos com maior potencial de crescimento são lojas de eletrônicos, impulsionadas pela venda de televisores e equipamentos de áudio, supermercados, devido ao aumento da procura por alimentos e bebidas, lojas de vestuário e artigos esportivos, e comércio de artigos para festas.\nSegundo o economista, o período também funciona como uma oportunidade para as empresas avaliarem profissionais para futuras efetivações.\nComo o segundo semestre é o melhor período de vendas para o setor e, consequentemente, a época em que o varejo mais contrata e investe na abertura de lojas, os colaboradores que forem bem avaliados terão grandes chances de permanecer.”\n Quais são os direitos dos trabalhadores temporários?\nO patrão tem várias obrigações ao contratar um trabalhador temporário, que devem ser seguidas conforme a lei 6.019/1974. Esse tipo de contrato tem como objetivo atender a necessidades excepcionais, como picos de demanda ou substituição de funcionários permanentes.\nA legislação permite que o funcionário temporário seja contratado por um período de até 180 dias, consecutivos ou não, com a possibilidade de prorrogação apenas uma vez por mais 90 dias, conforme a necessidade da empresa.\nEsses trabalhadores têm direitos semelhantes aos dos empregados contratados por prazo indeterminado, como benefícios trabalhistas e previdenciários, registro em carteira, além do recolhimento do FGTS e o pagamento de férias proporcionais.\n“Ainda que o trabalhador esteja contratado de forma temporária, isso não significa que não exista a necessidade de observação dos direitos e garantias estabelecidos nas relações de trabalho, os quais a legislação brasileira protege”, afirma a advogada trabalhista Márcia Cleide Ribeiro.\nVeja abaixo os principais direitos dos trabalhadores temporários:\nRemuneração, respeitando a igualdade salarial;\nJornada de oito horas diárias (40 horas semanais);\nPagamento de horas extras (que não excedam duas horas diárias);\nRepouso semanal remunerado;\nPagamento de adicional noturno, insalubridade e periculosidade, caso necessário;\nRecebimento de férias proporcionais ao período trabalhado;\nIndenização se dispensado fora do tempo previsto no contrato, sem justa causa;\nSeguro contra acidente de trabalho, bem como proteção previdenciária;\nRecepção do Fundo de Garantia por Tempo de Serviço (FGTS) em conta vinculada;\n13º salário proporcional ao período trabalhado.\nAlém das obrigações financeiras, a empresa deve garantir ao trabalhador temporário as mesmas condições de trabalho oferecidas aos empregados permanentes, como segurança, higiene, saúde e ambiente salubre.\n“O temporário deve ter acesso ao atendimento médico, ambulatorial e de refeição nas mesmas condições que os outros empregados da empresa”, completa a advogada trabalhista Agatha Otero.\nO recolhimento do FGTS, que deve ser feito pela empresa, é de 8% sobre a remuneração paga ao empregado durante o período de contrato. Ao final do vínculo, o trabalhador pode sacar 100% do saldo do FGTS.\nNo entanto, nesse tipo de contratação, não há o pagamento da multa de 40% sobre o Fundo de Garantia, já que essa penalidade se aplica apenas em rescisões sem justa causa de contratos por tempo indeterminado. É o que explica Márcio Coelho, advogado especializado em direito trabalhista e previdenciário.\n“Não têm direito ao aviso prévio e não recebem a multa de 40% sobre o FGTS. Quanto ao seguro-desemprego, o trabalhador temporário terá direito se tiver trabalhado pelo menos seis meses nos últimos 12 meses antes da demissão, não recebendo nenhum outro benefício previdenciário e se a demissão ocorrer sem justa causa”, afirma.\nUma das obrigações mais importantes do empregador é a formalização do contrato por escrito. Esse documento deve detalhar a função do empregado, o período de serviço, a remuneração e todas as condições de trabalho.\nAlém disso, é necessário registrar na Carteira de Trabalho e Previdência Social (CTPS) que o vínculo é temporário, assegurando o cumprimento correto do contrato e prevenindo complicações futuras.\nO registro em carteira é fundamental para garantir que o contrato seja encerrado corretamente. Caso o empregador deixe de formalizar o contrato por escrito ou não siga as regras legais estabelecidas, a relação de trabalho pode ser reconhecida como permanente.\nNesse caso, o empregado passa a ter os mesmos direitos que um trabalhador efetivo, incluindo aviso prévio, seguro-desemprego, multa de 40% sobre o FGTS em caso de demissão sem justa causa e estabilidade em casos de gravidez ou acidente de trabalho.\n“É fundamental que os trabalhadores leiam atentamente os termos do contrato temporário, compreendendo as cláusulas e direitos, para evitar surpresas desagradáveis no futuro. A conscientização sobre as condições de trabalho ajuda a garantir que os profissionais sejam tratados de maneira justa e respeitosa, mesmo em situações temporárias\", completa Márcio Coelho.\nLEIA TAMBÉM\nDa Copa ao es e": "Acton University pretende fortalecer a liberdade no Brasil", "summary": "<img src=\"https://media.gazetadopovo.com.br/2026/07/01143431/EFEEPAOLIVIER-MATTHYS-2-1-960x540.jpg\" /><br />Veja como a Acton University 2026 reuniu brasileiros para discutir as ameaças globais à liberdade, ativismo judicial e o futuro da economia livre.", "url": "https://www.gazetadopovo.com.br/ideias/como-a-acton-university-pretende-fortalecer-a-liberdade-no-brasil/", "source_domain": "gazetadopovo.com.br", "published_at": "2026-07-01T17:34:27+00:00", "origin": "feed", "image_url": "https://media.gazetadopovo.com.br/2026/07/01143431/EFEEPAOLIVIER-MATTHYS-2-1-960x540.jpg", "url_hash": "cbe36edc0e16d07b075f7d8ca0b6614b", "title_hash": "54a6e42b14b323361d79fa8a7fea39b9", "corroboration": 1, "relevance_score": 0.1986, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3543, "headline_en": "Acton University Gathers Brazilians to Discuss Threats to Freedom", "headline_pt": "Acton University reúne brasileiros para discutir ameaças à liberdade", "one_liner_en": "Acton University 2026 brought Brazilian participants together to debate judicial activism, global threats to liberty, and free-market economics.", "one_liner_pt": "A Acton University 2026 reuniu brasileiros para debater ativismo judicial, ameaças globais à liberdade e economia de livre mercado.", "category": "Other", "region": "brazil", "rationale": "Reflects ongoing ideological debate in Brazil around judicial independence and economic liberalism.", "low_signal": true}, {"title": "‘Tem mais gente no estádio do que na minha cidade’: brasileira descreve sensação de trabalhar na Copa do Mundo", "summary": "<img src=\"https://s2-g1.glbimg.com/-iZM04E21v673ftnJmPQtjrKGbg=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/j/D/aXjiNkTPuIaTVS2D5qqA/1200x800-3-2-.jpg\" /><br />     Brasileira descreve trabalho na Copa do Mundo\nO que parecia algo distante quando criança se tornou realidade para uma dracenense que hoje vive nos Estados Unidos (EUA). Escalada para trabalhar nos bastidores da Copa do Mundo, Ivana Branco Borges acompanha de perto os jogos em Miami e se emocionou ao ver a Seleção Brasileira em campo.\nAo g1, Ivana, de 41 anos, contou como foi viver a experiência de trabalhar em um dos maiores eventos esportivos do mundo e relembrou a emoção de assistir à vitória do Brasil por 3 a 0 sobre a Escócia, ainda na fase de grupos.\n📲 Participe do canal do g1 Presidente Prudente e Região no WhatsApp\nIvana nasceu e cresceu em Dracena, cidade que fica a mais de 650 quilômetros da capital de São Paulo, e que tem população estimada em 46.735 habitantes, segundo a última atualização do Instituto Brasileiro de Geografia e Estatística (IBGE).\nEla afirma que, quando morava na cidade, não imaginava que um dia trabalharia em uma Copa do Mundo. “Como muitas pessoas, eu cresci assistindo à Copa do Mundo, muito por influência do meu pai, que sempre foi apaixonado por futebol.”\n“Naquela época, eu jamais imaginava que um dia estaria trabalhando nos bastidores de um evento dessa dimensão e, mais do que isso, vivendo a emoção de assistir a um jogo da Copa no estádio.”\n“Lembro que, durante o jogo do Brasil, apareceu no telão o público presente, com mais de 65 mil pessoas. Naquele momento, eu pensei: ‘Tem mais gente aqui dentro do estádio do que na minha cidade.’ Foi impossível não lembrar de Dracena”, afirma. \nLEIA TAMBÉM:\n'Mini Haaland': menino do interior de SP viraliza por semelhança com atacante norueguês; vídeo\nMassa amarela e calda verde: confeiteiro cria 'pudim do hexa' em homenagem à Seleção Brasileira\nDo futsal sorocabano à Liga Saudita: goleiro que enfrentou Cristiano Ronaldo fala sobre realização de sonho no futebol árabe\nIvana Branco Borges, nascida em Dracena (SP), está trabalhando nos bastidores da Copa do Mundo\nIvana Branco Borges/Arquivo pessoal\nOportunidade de carreira\nA oportunidade de trabalhar nos bastidores surgiu porque Ivana já mora nos Estados Unidos desde 2017, época em que ela começou a trajetória na área de eventos.\n“Hoje atuo como Field Marketing Manager (gerente de Marketing) em uma empresa americana de hidratação funcional que desenvolve bebidas para reposição de eletrólitos e vitaminas”, descreve Ivana.\nFormada em Matemática pela Universidade Federal de São Carlos (UFSCar) e com pós-graduação em Comunicação e Marketing pela Universidade de São Paulo (USP), Ivana afirma que grande parte da atuação dela acontece justamente no universo do esporte.\n“[Na Copa] meu papel é oferecer suporte operacional durante os jogos, orientar torcedores quando necessário e colaborar para que a experiência do público seja organizada, segura e positiva.”\nIvana Branco Borges mora nos Estados Unidos desde 2017 \nIvana Branco Borges/Arquivo pessoal\nRotina na Copa\nAté sexta-feira (3), Ivana já tinha trabalhado nos jogos de Arábia Saudita x Uruguai, Uruguai x Cabo Verde e Portugal x Colômbia, mas há previsão de que ela trabalhe em outros jogos até o encerramento da competição.\nOs dias começam cedo na rotina da gerente de Marketing, antes mesmo da abertura dos portões: “participamos de reuniões de alinhamento e recebemos as orientações específicas para cada partida.“\nDepois, Ivana descreve que ela e os demais colaboradores acompanham toda a operação durante o evento, sempre prontos para atender às necessidades do público e garantir que tudo aconteça da melhor forma possível. “Cada jogo traz uma dinâmica diferente.”\n“Trabalhar na Copa do Mundo já é uma experiência inesquecível, mas, realmente, o momento mais marcante até agora foi assistir ao jogo do Brasil contra a Escócia. Ver o estádio completamente lotado, cantar o Hino Nacional ao lado de milhares de brasileiros e acompanhar a vitória do Brasil por 3 a 0 foi emocionante.” \nProcesso seletivo na Copa\nPara conseguir atuar diretamente na Copa do Mundo, mesmo já tendo passado por grandes eventos, como a Fórmula 1 e o Miami Open, considerado um dos maiores torneios combinados de tênis do mundo, Ivana precisou passar por um processo rigoroso da Federação Internacional de Futebol (Fifa).\n“Eles são muito restritos para fazer a aprovação das pessoas para trabalhar ali. Então, isso foi um processo de meses. Eu me candidatei para a vaga, tive que enviar um monte de documentos”, descreve.\nO processo de seleção conta com investigação do perfil a partir de verificação dos antecedentes criminais e demais documentos de cada candidato, sendo que são milhares de pessoas participando, conforme Ivana.\n“Meu nome e de outras pessoas que estão trabalhando comigo ficaram por último. Então, eu fiquei na ansiedade, até uma semana antes [de começar], para saber se eu ia ser aprovada ou não”, continua.\nQuando finalmente veio a aprovação, Ivana celebrou quase com a mesma alegria de se o hexa já fosse do Brasil.\n“A hora que veio o e-mail com ‘a sua candidatura está aprovada, pode vir buscar a credencial.’ Nossa! Aí, eu liguei para os meus pais e falei: ‘Agora é oficial’. A hora que eu peguei a credencial em mãos, eu falei: ‘Realmente está acontecendo, eu vou participar da Copa’”. \n“Essa experiência me mostrou que a vida pode nos surpreender quando temos dedicação, vontade de aprender e coragem para aproveitar as oportunidades que surgem pelo caminho”, completa Ivana. \nIvana Branco Borges assistiu o Brasil vencer de 3 a 0 da Escócia \nIvana Branco Borges/Arquivo pessoal\nInitial plugin text\nVeja mais notícias no g1 Presidente Prudente e Região\nVÍDEOS: assista às reportagens da TV TEM", "url": "https://g1.globo.com/sp/presidente-prudente-e-regiao/noticia/2026/07/05/tem-mais-gente-no-estadio-do-que-na-minha-cidade-brasileira-descreve-sensacao-de-trabalhar-na-copa-do-mundo.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-05T11:00:12+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/-iZM04E21v673ftnJmPQtjrKGbg=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/j/D/aXjiNkTPuIaTVS2D5qqA/1200x800-3-2-.jpg", "url_hash": "87ab334d235ed936f35873f9406281ff", "title_hash": "5296e41b30b107e66c5c9851657a1a00", "corroboration": 1, "relevance_score": 0.1971, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3535, "headline_en": "Brazilian Woman Describes Working at the World Cup: 'More People in the Stadium Than in My Town'", "headline_pt": "Brasileira descreve trabalho na Copa: 'Tem mais gente no estádio do que na minha cidade'", "one_liner_en": "A Brazilian woman living in the US shares her experience working at the 2026 World Cup stadiums.", "one_liner_pt": "Uma brasileira que vive nos EUA compartilha sua experiência trabalhando nos estádios da Copa do Mundo de 2026.", "category": "Culture", "region": "brazil", "rationale": "Human-interest angle on the World Cup experience, resonating with Brazilian readers following the tournament.", "low_signal": false}, {"title": "06 acessórios que estão transformando os looks neste inverno", "summary": "<p>O inverno é a estação perfeita para renovar o guarda-roupa e os acessórios têm um papel muito importante nessa transformação! São eles que completam as produções, acrescentam personalidade e acompanham as principais tendências da temporada. Na Feira Brasil Moda Show, realizada até 05 de julho, no Centro de Eventos Positivo, no Parque Barigui, é possível [&#8230;]<\/p>\n<p>O post <a href=\"https://curitibacult.com.br/06-acessorios-que-estao-transformando-os-looks-neste-inverno/\">06 acessórios que estão transformando os looks neste inverno<\/a> apareceu primeiro em <a href=\"https://curitibacult.com.br\">Curitiba Cult<\/a>.<\/p>", "url": "https://curitibacult.com.br/06-acessorios-que-estao-transformando-os-looks-neste-inverno/", "source_domain": "curitibacult.com.br", "published_at": "2026-07-05T13:00:00+00:00", "origin": "feed", "image_url": "https://curitibacult.com.br/wp-content/uploads/2026/07/Design-sem-nome-93.jpg", "url_hash": "5cb59a327b93f15ca05719f30a1baefd", "title_hash": "a9b86a8decf1633c7704069b37046851", "corroboration": 1, "relevance_score": 0.1962, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3531, "headline_en": "Six Accessories Transforming Winter Looks This Season", "headline_pt": "Seis acessórios que estão transformando os looks neste inverno", "one_liner_en": "A fashion event at Curitiba's Parque Barigui highlights winter accessories trending this season.", "one_liner_pt": "Evento de moda no Parque Barigui, em Curitiba, destaca os acessórios de inverno que estão em alta nesta temporada.", "category": "Culture", "region": "curitiba", "rationale": "Locally relevant fashion event coverage for Curitiba readers.", "low_signal": true}, {"title": "É #FAKE que telejornal noticiou que juiz de Brasil x Escócia foi suspenso da Copa do Mundo por anular gol de Vini Jr.; cena foi criada com IA", "summary": "<img src=\"https://s2-g1.glbimg.com/04uYGoMpoYSSH4R4YStQo7cXDSQ=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/o/n/0oKo6XS7GGj6v5K4RGug/vinijr.jpg\" /><br />     É #FAKE que telejornal noticiou que juiz de Brasil x Escócia foi suspenso da Copa do Mundo por marcar impedimento; cena foi criada com IA\nReprodução\nCircula nas redes sociais o vídeo de um telejornal que supostamente teria anunciado que o juiz do jogo Brasil 3 x 0 Escócia, disputado em 24 de junho e válido pela terceira rodada do Grupo C, foi suspenso da Copa do Mundo porque anulou um gol de Vini Jr. É #FAKE. \nSelo Fake (Horizontal)\ng1\n🔴 Como é o vídeo?\nCompartilhado no TikTok na segunda-feira (29), o vídeo tem a seguinte caixa de texto sobreposta às imagens: \"O árbitro que anulou o gol do Vini foi suspenso\".  \nEmbora o conteúdo tenha o selo \"Marcado pelo criador como gerado por IA [inteligência artificial]\", na seção de comentários há mensagens de usuários que acreditaram nas alegações. Além disso, o material viralizou no Kwai sem a indicação de que se trata de algo sintético. \nA versão no TikTok simula um function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function wxImageFor(type) {

  return '02_cloudy.png';

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}
