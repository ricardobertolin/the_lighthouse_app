<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

</svg>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
      <button id="j-lang-pt" class="lang-btn" onclick="setLang('pt')">PT</button>

      <div class="fx-panel-left">
        <span class="fx-kicker" id="j-fx-kicker">The Weather</span>

const DATA = {"date": "2026-06-19", "intro_en": "Brazil's political scene is dominated by the widening Banco Master scandal, now touching the Lula government through Senator Jaques Wagner and reaching congressional leaders. On the global stage, the 2026 FIFA World Cup kicks off major matchups — including Brazil's game against Haiti — while AI governance debates heat up in the US, with Bernie Sanders proposing a $7 trillion public AI fund and the White House drawing unclear rules for the industry.", "intro_pt": "A cena política brasileira é dominada pelo escândalo do Banco Master, que agora atinge o governo Lula por meio do senador Jaques Wagner e líderes do Congresso. No cenário mundial, a Copa do Mundo de 2026 entra em ritmo acelerado — com o Brasil enfrentando o Haiti — enquanto os EUA debatem a regulação da inteligência artificial, com Bernie Sanders propondo um fundo público de US$ 7 trilhões e a Casa Branca improvisando regras para o setor.", "weather": {"location": "Curitiba, PR", "description": "Light drizzle", "temp_max": 20.7, "temp_min": 8.2, "precipitation_mm": 0.6, "wind_max_kmh": 14.5, "wmo_code": 51}, "articles": [{"title": "Investigação sobre Jaques Wagner aproxima caso Master do governo Lula, diz imprensa internacional", "summary": "Veículos de mídia no exterior observam que após gravação de Flávio Bolsonaro com Vorcaro, nova investigação atinge Lula e pode ter impacto nas eleições.", "url": "https://www.bbc.com/portuguese/articles/c5yzk6nn265o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-06-19T09:27:06+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/c3b3/live/11de3e30-6bbb-11f1-8546-8f19e4fe30f4.jpg", "url_hash": "19fb57b2887c3539b07f10292010e92c", "title_hash": "23a81bad20e6e50d3588f2b2c7cca3ca", "corroboration": 2, "relevance_score": 0.2284, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5692, "headline_en": "International Press Links Wagner Investigation to Lula Government and Banco Master Scandal", "headline_pt": "Imprensa Internacional Liga Investigação de Wagner ao Governo Lula e ao Caso Master", "one_liner_en": "Foreign media say the Jaques Wagner probe ties the Banco Master scandal directly to Lula, potentially affecting elections.", "one_liner_pt": "Mídia estrangeira aponta que investigação de Jaques Wagner aproxima o escândalo do Banco Master do governo Lula.", "category": "Brazil", "region": "brazil", "rationale": "International scrutiny of a domestic political scandal raises the stakes ahead of Brazilian elections.", "low_signal": false}, {"title": "Investigação sobre Jaques Wagner aproxima caso Master do governo Lula, diz imprensa internacional", "summary": "<img src=\"https://s2-g1.glbimg.com/kAvptV1IfF1zLqMdQgqsnVxIFqA=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/U/v/phNbz8SKWSsOK0ByoCzQ/11de3e30-6bbb-11f1-8546-8f19e4fe30f4.jpg.webp\" /><br />     Imprensa internacional destacou que suspeitas envolvendo Jaques Wagner aproximam escândalo do caso Master do governo Lula\nLula Marques/Agência Brasil\nA nova fase das investigações das autoridades brasileiras sobre o caso Master, que inclui entre os alvos o senador Jaques Wagner (PT-BA), líder do governo de Luiz Inácio Lula da Silva no Senado, repercutiu na imprensa internacional.\nEndereços ligados ao senador foram alvos de busca na quinta-feira (18/06). Wagner é apontado pela Polícia Federal como \"suposto beneficiário central das vantagens econômicas investigadas, figurando como agente público em favor de quem teriam sido estruturados pagamentos, benefícios e aquisições patrimoniais\".\nA Polícia Federal investiga se o senador teria recebido pagamentos e benefícios em troca de apoio por medidas no Congresso que ajudariam o Banco Master, como a chamada \"Emenda Master\". Há suspeitas em torno da compra de um apartamento de luxo em Salvador e um pagamento de R$ 3,5 milhões. Ele nega ter cometido irregularidades.\nA Polícia Federal apreendeu cerca de US$ 55 mil e outros 33,5 mil euros na operação desta quinta-feira. Uma fonte que acompanha as investigações afirmou à BBC News Brasil em caráter reservado que o dinheiro foi encontrado em dois endereços ligados a Jaques Wagner. Wagner confirmou que o dinheiro apreendido pela PF na operação é seu, mas negou qualquer irregularidade. O senador não foi indiciado.\nO site da Al Jazeera, a rede de notícias baseada no Catar com grande influência no mundo árabe, disse que o escândalo do Master \"atingiu ambos os lados do espectro político brasileiro — e pode até mesmo influenciar a próxima corrida presidencial do país, em outubro\".\nJacques Wagner (PT) é suspeito de receber apartamento e propina para favorecer Master\nO site lembra que no mês passado o portal The Intercept Brasil divulgou áudios nos quais o senador e pré-candidato à Presidência Flávio Bolsonaro (PL-RJ) pedia dinheiro ao banqueiro Daniel Vorcaro, do Master, para produção de um filme biográfico sobre Jair Bolsonaro.\n\"Os mandados [de busca da Operação Compliance Zero] de quinta-feira marcaram a mais recente de uma série de operações destinadas a revelar a extensão dos crimes financeiros de Vorcaro e como eles podem ter alimentado a corrupção governamental\", afirma a Al Jazeera.\nO jornal argentino Clarín destacou a presença de um aliado de Lula na nova etapa da investigação da Polícia Federal.\n\"A inclusão do importante senador na investigação do Banco Master aproxima este escândalo do governo do presidente Luiz Inácio Lula da Silva, que busca a reeleição para um quarto mandato não consecutivo em outubro.\"\n\"O caso começou com a liquidação por insolvência do Banco Master em novembro, que devia mais de US$ 7 bilhões a cerca de 800 mil investidores (cujas dívidas foram quitadas pelo fundo de garantia)\", diz o jornal argentino.\n\"Logo se transformou em uma investigação que apontou ligações suspeitas entre seu proprietário, o banqueiro Daniel Vorcaro, e figuras do poder público brasileiro de todo o espectro político.\"\nO jornal diz que, após as revelações sobre o áudio de Flávio Bolsonaro a Vorcaro, o senador do PL \"caiu nas pesquisas e agora está vários pontos atrás de Lula nas intenções de voto para o segundo turno\".\n\"Lula, que admitiu ter se encontrado com Vorcaro em 2024, prometeu que o caso seria investigado 'até as últimas consequências'\", diz o Clarín.\nA agência de notícias para o mercado financeiro Bloomberg disse que a investigação sobre o Banco Master e Vorcaro \"atingiu políticos de todo o espectro político, abalando a campanha eleitoral brasileira a quatro meses da votação\".\n\"Após a divulgação de reportagens envolvendo Wagner, a campanha de Lula instruiu aliados e membros do gabinete a defenderem publicamente o senador, segundo uma pessoa com conhecimento do assunto\", afirma a Bloomberg.\n\"A campanha reconheceu, no entanto, que seus esforços para atribuir a culpa pelo escândalo do Banco Master a Bolsonaro e seus aliados haviam se tornado mais difíceis, de acordo com outra pessoa familiarizada com o assunto.\"\nA agência de notícias Reuters destacou que o escândalo de corrupção \"chegou perto do presidente do Brasil nesta quinta-feira, com uma operação da Polícia Federal que teve como alvo seu principal aliado no Congresso, intensificando o foco na corrupção política às vésperas das eleições de outubro\".\n\"As supostas ligações com Wagner trazem o escândalo do Banco Master para o círculo íntimo do presidente pela primeira vez\", afirma a agência.\n\"Seus laços estreitos com Lula remontam a décadas, incluindo cargos no gabinete do presidente. Como governador da Bahia, ele ajudou a transformar o Estado nordestino em um reduto de apoio ao governista Partido dos Trabalhadores.\"\nSegundo a Reuters, as notícias de quinta-feira reforçaram \"a percepção de que a investigação sobre o Banco Master influenciará a corrida presidencial de 2026\".\n\"No mês passado, o escândalo abalou a campanha do senador Flávio Bolsonaro — apontado pelas pesquisas como o principal rival na tentativa de reeleição de Lula — depois que o senador confirmou ter obtido financiamento de Vorcaro para um filme sobre seu pai, o ex-presidente Jair Bolsonaro.\"\nLEIA TAMBÉM:\nImóvel de luxo, viagens, repasses e ingresso: entenda investigação da PF que baseou operação contra Jaques Wagner\nJaques Wagner abala estratégia do governo no caso Master e PT recalcula rota\nJaques Wagner diz que dólares apreendidos pela PF são de diárias do Senado e que Lula prestou solidariedade após operação", "url": "https://g1.globo.com/mundo/noticia/2026/06/19/investigacao-sobre-jaques-wagner-aproxima-caso-master-do-governo-lula-diz-imprensa-internacional.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-19T11:16:14+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/kAvptV1IfF1zLqMdQgqsnVxIFqA=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/U/v/phNbz8SKWSsOK0ByoCzQ/11de3e30-6bbb-11f1-8546-8f19e4fe30f4.jpg.webp", "url_hash": "168406c8d5fade304e47bf6743218b49", "title_hash": "23a81bad20e6e50d3588f2b2c7cca3ca", "corroboration": 2, "relevance_score": 0.1647, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5374, "headline_en": "Jaques Wagner Probe Brings Banco Master Scandal Closer to Lula, Says International Press", "headline_pt": "Investigação de Wagner Aproxima Caso Master do Governo Lula, Diz Imprensa Internacional", "one_liner_en": "Global outlets note the Wagner investigation links the Banco Master affair to the Lula administration.", "one_liner_pt": "Veículos internacionais destacam que investigação sobre Wagner conecta o caso Master ao governo Lula.", "category": "Brazil", "region": "brazil", "rationale": "Near-duplicate of index 0 from a different Brazilian outlet.", "low_signal": true}, {"title": "'Robin Hood não era herói': como foram apagadas as sombrias e violentas origens medievais do personagem", "summary": "Robin Hood surgiu como tradição oral no século 12 e se transformou, ao longo dos anos, em um estereótipo heroico e familiar. Mas, no século 21, o cinema e a literatura tentam restaurar o lado oculto do personagem.", "url": "https://www.bbc.com/portuguese/articles/c20y9dz4l1zo?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-06-18T19:52:27+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/f0d8/live/681501e0-6a93-11f1-b1db-af71d47507d6.jpg", "url_hash": "44bf534b6fdc51ea54106b6fce31a11c", "title_hash": "1d6a2885ddc896de42928bf06c1cb3b6", "corroboration": 2, "relevance_score": 0.0832, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4966, "headline_en": "Robin Hood Was No Hero: The Dark Medieval Origins Erased Over Centuries", "headline_pt": "Robin Hood Não Era Herói: As Sombrias Origens Medievais Apagadas ao Longo dos Séculos", "one_liner_en": "Robin Hood's original medieval character was violent and morally ambiguous, far from today's beloved folk hero.", "one_liner_pt": "O Robin Hood medieval era violento e moralmente ambíguo, bem diferente do herói popular que conhecemos hoje.", "category": "Culture", "region": "world", "rationale": "A cultural deep-dive revisiting a beloved archetype as modern media seeks to reclaim its darker roots.", "low_signal": false}, {"title": "'Robin Hood não era herói': como foram apagadas as sombrias e violentas origens medievais do personagem", "summary": "<img src=\"https://s2-g1.glbimg.com/1_I3n9GhflFp1l9yBEn6tnqVDvo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/P/g/gmvNXdQrq5RW9kIfBmNg/hobin.jpg\" /><br />     'Robin Hood não era herói': como foram apagadas as sombrias e violentas origens medievais do personagem\nGetty Images via BBC\nImportante: esta reportagem contém uma descrição clara de violência que pode ser perturbadora para alguns leitores.\nQuando o diretor e roteirista Michael Sarnoski começou a filmar seu novo longa-metragem, ele mostrou ao elenco e à equipe de produção um desenho animado que ele adorava.\nEra o Robin Hood animado da Disney, de 1973, que mostra o herói como uma raposa com uma pena no seu chapéu verde, roubando dos ricos para dar aos pobres.\nEsta versão tão popular não poderia estar mais longe do profundo e sombrio drama de Sarnoski, A Morte de Robin Hood.\nHugh Jackman interpreta um Robin grisalho, desgastado pelas batalhas e pensativo no final da vida, profundamente consciente da sua própria lenda.\nAgora no g1\nEle encontra uma mulher que fala sobre o virtuoso justiceiro Robin Hood, mas ele nega sua identidade e se refere a si próprio em terceira pessoa.\n\"Ele não era um herói. Ele roubava e matava para se divertir, nada mais que isso.\"\nNa verdade, este Robin Hood violento e outras visões revisionistas contra a heroica imagem de benfeitor do personagem estão mais próximas das lendas medievais originais do que o estereótipo familiar que imaginamos hoje em dia.\nA imagem de Robin Hood se transformou ao longo dos séculos. Cada mudança refletia a era que o reinterpretava.\nAs variações mais sombrias do século 21 remontam às origens da história. Mas, como destacam alguns dos seus criadores, também refletem o presente.\nAs visões complexas do personagem desafiam um mundo polarizado, onde os heróis e vilões costumam ser exclusivamente bons ou maus, de forma tão simplificada quanto a lenda de Robin Hood se tornou ao longo dos séculos.\nQuem foi Robin Hood?\nEspecula-se muito se realmente existiu um Robin Hood na vida real, mas a maioria dos historiadores concorda que não tenha havido um indivíduo vivo por trás do personagem.\nO que existia era uma sociedade com imensas desigualdades, com ricos donos de terras e camponeses empobrecidos, que inspirou sua criação.\nAs histórias surgiram como tradição oral no século 12, mas os primeiros relatos escritos só chegaram dois séculos mais tarde, em baladas que o mostravam como um personagem famoso, mesmo tanto tempo depois.\nNestes primeiros relatos escritos, não se tratava do nobre Sir Robin de Locksley, como mostram as versões posteriores. Ele não era nobre, mas sim um pequeno proprietário rural, que estava apenas um degrau acima dos camponeses.\nLady Marian só entraria na história no século 16. E Robin podia ser bom para os pobres, mas seu objetivo principal não era ajudá-los.\nSeus inimigos eram o clero corrupto e os nobres proprietários de terras, que se aproveitavam dos seus subordinados.\nAs histórias sobre Robin Hood surgiram como tradição oral no século 12, mas os primeiros relatos escritos datam de 200 anos depois\nGetty Images via BBC\nEm um posfácio do seu romance revisionista The Traitor of Sherwood Forest (\"O traidor da Floresta de Sherwood\", em tradução livre), de 2025, a historiadora medieval Amy S. Kaufman descreve o Robin Hood das primeiras lendas como \"um vigarista medieval moralmente questionável\" — \"malandro, violento e irreverente\".\nA Disney acertou em um ponto: as primeiras baladas indicam que Robin realmente era dissimulado como uma raposa.\nUma mudança importante na história veio no século 16, durante o reinado de Henrique 8° (1491-1547), admirador da lenda que chegava a se vestir como Robin Hood. Foi na época do monarca inglês, que dividiu a Igreja Católica, que a devoção de Robin à Virgem Maria desapareceu da lenda.\nCom as classes mais altas acolhendo o personagem, Robin deixou de odiar a nobreza nas influentes crônicas da época, passando ele mesmo a ser nobre.\nAo assumir a posição de um nobre com moral íntegra, que luta contra seus pares desonestos, Robin Hood deixou de questionar a estrutura de poder da sociedade.\nEle foi convocado para ajudar o bom rei Ricardo (1157-1199) a retomar o trono usurpado pelo seu irmão mau, o príncipe João (1166-1216) — uma parábola incluída na produção da Disney, que mostra João como um leão ambicioso, com sede de poder.\nA animação da Disney produzida em 1973, com Robin Hood como uma raposa, solidificou sua imagem de intrépido benfeitor na cultura popular\nAlamy via BBC\nLivros infantis do século 19 ajudaram a transformar Robin Hood em um benfeitor menos ofensivo, aceitável para a era vitoriana.\nE, no século 20, o cinema perpetuou esta imagem com o ídolo das matinês Errol Flynn (1909-1959) interpretando o intrépido Robin no popular filme As Aventuras de Robin Hood (1938).\nA Disney solidificaria esta imagem na cultura popular, talvez na sua versão mais influente.\n'Duas versões do mesmo personagem'\nSarnoski conta à BBC que o contraste entre o filme da Disney e a lenda original o fascinava desde criança, quando ele leu uma versão infantil da balada medieval A Morte de Robin Hood.\nNela, Robin morre em silêncio, assassinado por uma prioresa má e seu amante.\n\"Conheci o Robin Hood da Disney e li em seguida A Morte de Robin Hood, essas duas versões do protagonista\", conta o diretor. \"Tentar lidar com isso e compreender como aquele pode ser o mesmo personagem realmente me marcou quando eu era criança\", conta o diretor.\nErrol Flynn (dir.) interpretou o intrépido Robin no filme As Aventuras de Robin Hood (1938)\nGetty Images via BBC\nNo filme de Sarnoski, Robin Hood é ferido durante uma chocante batalha exibida no filme. Uma flecha atravessa a cabeça de um menino pela parte de trás e sai pelo seu olho e ele é levado a um mosteiro para se recuperar.\nJodie Comer interpreta a prioresa. Ela é gentil, diferentemente do retrato da balada.\n\"Eu não quis que a prioresa fosse apenas aquela freira malvada, nem que Robin fosse simplesmente aquele herói bom\", explica Sarnoski sobre seus personagens, mais profundos.\nQuando Robin reflete e começa a se lamentar por seu passado, o filme \"realmente se torna uma história sobre ele, que enfrenta sua própria lenda e seu desejo sobre o que seria uma morte correta\", prossegue o diretor.\nHugh Jackman interpreta o protagonista do novo filme do estúdio A24, uma visão revisionista de Robin Hood que retoma a sombria lenda original da Idade Média\nA24 via BBC\nA distorção da lenda também é um tema importante do romance de Kaufman. Da mesma forma que Sarnoski, ela formou suas primeiras impressões sobre a história com o desenho da Disney.\n\"Cresci com a raposa Robin Hood\", conta ela à BBC. \"Mais tarde, mergulhei nos estudos medievais, descobri as baladas e me perguntei: 'Onde está meu Robin Hood, que conheço e adoro?'\"\nSeu livro se concentra na personagem fictícia Jane, uma camponesa que se apaixona pela lenda de Robin Hood. Ela se encanta com ele e entra para o seu bando, mas começa a se perguntar se a imagem heroica e o próprio Robin a iludiram com sua sedução.\nFiel às origens do personagem, o Robin de Kaufman não é herói, nem vilão.\nEla conta que, nas baladas, \"ele é incrivelmente subversivo, quando você observa como ele se levanta contra as pessoas que detêm o poder, como os reis, a nobreza, a Igreja\".\n\"Mas, em todas as baladas, ele também tem um fim trágico ou é vítima das suas próprias imperfeições.\"\nAlém de Flynn, atores como Douglas Fairbanks, Russel Crowe e Kevin Costner (foto) interpretaram Robin Hood e quase todos mantiveram a imagem estereotipada do personagem.\nGetty Images via BBC\nNo século 20, essas visões mais complexas de Robin Hood eram raras.\nNo cinema, atores como Douglas Fairbanks (1883-1939), Kevin Costner e Russel Crowe interpretaram o papel e quase todos seguiram a imagem estereotipada.\nUma exceção marcante é Robin e Marian (1976), um filme elegante e inteligente, que merece ser muito mais conhecido.\nSean Connery (1930-2020) interpreta um Robin envelhecido que, após décadas, reencontrou Marian (Audrey Hepburn, 1929-1993), agora prioresa.\nEste Robin nega que as histórias lendárias sobre ele sejam verdadeiras e aparece contemplativo no final da vida.\n\"Sempre penso em todas as mortes que presenciei\", conta ele a Marian, questionando qual foi o seu propósito.\nRobin e Marian (1976), com Sean Connery e Audrey Hepburn, é um filme elegante e inteligente, que mostra o personagem contemplativo no final da sua vida\nGetty Images via BBC\nQuestões sobre poder, heróis e como as histórias são contadas são exatamente o que faz com que as visões revisionistas pareçam tão atuais.\n\"O mundo está consolidando o poder de forma similar à Idade Média\", segundo Kaufman. \"Algumas das coisas que eles precisavam estudar são as mesmas que precisaremos examinar hoje.\"\nSarnoski destaca como seus personagens utilizam suas histórias como instrumentos de poder.\n\"Robin usava as histórias como armas e como forma de perpetuar a violência\", atraindo seguidores, segundo ele. Já a prioresa \"usa as histórias para ajudar e curar as pessoas\".\nAtualmente, estas estratégias estão por toda parte.\n\"Estamos, agora, imersos em narrativas, entre as redes sociais, a internet e simplesmente em tudo o que nos rodeia\", prossegue Sarnoski.\n\"Nós nos dividimos muito rapidamente em aldeias e tribos, criando heróis e vilões, e não vivemos na área cinza onde realmente mora a vida.\"\nPor mais estimulantes que possam ser novas versões mais sombrias de Robin Hood, elas provavelmente não irão substituir a imagem criada pela Disney.\n\"Nem todos querem ver sua fantasia de Robin Hood destruída\", explica Kaufman.\n\"Ele se tornou uma espécie de Papai Noel, no sentido de que representa algo maior que a lenda original, seja ela qual for.\"\nA Morte de Robin Hood está em cartaz nos cinemas brasileiros.\nLeia a versão original desta reportagem (em inglês) no site BBC Culture.\nA história original de Pinóquio, conto clássico italiano popularizado por Walt Disney\nO mistério dos caracóis guerreiros da Idade Média\nO sumiço de 130 crianças alemãs por trás da lenda mágica do flautista de Hamelin\nO mistério das lutas de espadas medievais que intriga historiadores\nMulan: a lenda chinesa que inspirou o novo filme da Disney\n'Um monstro': o que a história não mostra sobre o rei Henrique 8º", "url": "https://g1.globo.com/pop-arte/noticia/2026/06/19/robin-hood-nao-era-heroi-como-foram-apag let lang = 'en';
function t(key) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS['en'][key] || key; }

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const xs = [22,50,80,115,148,180,215,248,35,95,162,228];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    xs.forEach((x,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + x + 'px;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const xs  = [16,34,54,76,98,118,142,164,188,212,238,262];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    xs.forEach((x,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + x + 'px;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
