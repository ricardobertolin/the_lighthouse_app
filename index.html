<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>

const DATA = {"date": "2026-06-22", "intro_en": "Today's news is dominated by Latin American politics, with a Trump-aligned right-wing candidate claiming a narrow victory in Colombia's presidential election. Brazil faces economic headwinds as exports to the US slump under Trump's tariffs, while the Supreme Court (STF) takes up landmark rulings on app-worker rights and social media pressure. Lighter moments include a viral World Cup celebration on live BBC News.", "intro_pt": "O noticiário de hoje é dominado pela política latino-americana, com um candidato de direita alinhado a Trump conquistando uma vitória apertada na eleição presidencial da Colômbia. O Brasil enfrenta ventos contrários com a queda das exportações aos EUA sob as tarifas de Trump, enquanto o STF julga questões decisivas sobre trabalhadores de aplicativo e pressão sobre redes sociais. Um momento mais leve veio com a celebração viral de uma torcedor de Cabo Verde ao vivo na BBC.", "weather": {"location": "Curitiba, PR", "description": "Slight rain showers", "temp_max": 21.7, "temp_min": 8.6, "precipitation_mm": 2.6, "wind_max_kmh": 26.0, "wmo_code": 80}, "articles": [{"title": "Como a economia dos EUA continua superando seus rivais apesar de toda turbulência do governo Trump", "summary": "O que terá permitido aos EUA superar impactos globais que tanto prejudicaram outros países?", "url": "https://www.bbc.com/portuguese/articles/c0my9w0nlzdo?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-06-22T10:46:27+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/e0cd/live/4877abc0-6599-11f1-99b8-5530f29d65f4.jpg", "url_hash": "ef72946255a491db72ceea2c025612c0", "title_hash": "9c8344c816da07e0298ce374bf88fe00", "corroboration": 2, "relevance_score": 0.2056, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5578, "headline_en": "How the US Economy Keeps Outpacing Rivals Despite Trump Turbulence", "headline_pt": "Como a economia dos EUA supera rivais apesar da turbulência Trump", "one_liner_en": "The US economy continues to outperform global competitors despite disruptions caused by the Trump administration's policies.", "one_liner_pt": "A economia americana segue superando concorrentes globais apesar das turbulências geradas pelas políticas do governo Trump.", "category": "Economy", "region": "world", "rationale": "US economic resilience amid trade wars and policy uncertainty is a key global story affecting markets worldwide.", "low_signal": false}, {"title": "Como a economia dos EUA continua superando seus rivais apesar de toda turbulência do governo Trump", "summary": "<img src=\"https://s2-g1.glbimg.com/2DoNqvSVdWqkJvqnhB4ZIrGhVNo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/5/0/nWtFliQ1iLlqhpMyYCCA/4877abc0-6599-11f1-99b8-5530f29d65f4.jpg.webp\" /><br />     Como a economia dos EUA continua superando seus rivais apesar de toda turbulência do governo Trump\nGetty Images via BBC\nEm Dresden, no leste de Alemanha, um último automóvel fechou no ano passado a linha de montagem da \"Fábrica Transparente\" da Volkswagen, que foi uma espécie de símbolo do poderio industrial da Europa.\nA milhares de quilômetros de distância, em Spartanburg, no Estado americano da Carolina do Sul, outra gigante alemã, a BMW, opera sua maior fábrica em todo o mundo.\nO contraste entre ambas ajuda a explicar um enigma debatido há tempos pelos economistas: por que a economia americana continua superando muitos outros países, enfrentando os mesmos impactos globais?\nNos últimos anos, uma sucessão de choques econômicos abalou grande parte do mundo desenvolvido.\nAs tarifas de importação de Donald Trump afetaram o comércio global. As deportações de imigrantes em massa estão mudando o mercado de trabalho. O conflito no Oriente Médio fez disparar os preços do petróleo.\nTarifaço de Trump: audiência decisiva sobre produtos brasileiros encerra inscrições; veja como funciona\nVice de Trump fala em 'virar a página' nas relações com Irã durante conversas na Suíça\nMuitos economistas esperavam que os Estados Unidos fossem sofrer fortes abalos com o peso dessas pressões. Mas a economia do país continuou crescendo de forma estável.\nA inflação persistiu em alguns momentos, mas a combinação entre o fraco crescimento e o contínuo aumento de preços, temida por muitos, acabou não acontecendo.\nJoe Brusuelas, economista-chefe da consultoria britânica RSM, defende que a guerra comercial foi a prova mais forte da resiliência americana.\n\"As metas próprias impostas pelo governo Trump aos Estados Unidos, em relação ao comércio e à imigração, provavelmente são o exemplo mais claro do dinamismo que sustenta a economia americana\", destaca ele.\nAo enfrentar a súbita taxação de componentes estrangeiros, as empresas americanas não se contentaram com a redução das margens e passaram a investir com mais força.\n\"O investimento de capital, neste momento, é de 13,9% do PIB americano\", segundo Brusuelas. \"Deveria estar diminuindo, considerando os diversos impactos sobre a oferta e a procura absorvidos pela economia, mas não é o que está acontecendo.\"\nPor outro lado, grande parte das pressões foi compensada pelo notável aumento da produtividade. A economia americana como um todo continua se expandindo a um ritmo anual de cerca de 2%.\nOs mercados de energia oferecem outra explicação. A guerra no Oriente Médio aumentou os preços do petróleo, o que, historicamente, teria representado uma ameaça considerável ao crescimento americano.\nMas a revolução do petróleo de xisto alterou fundamentalmente a vulnerabilidade dos Estados Unidos frente aos choques do setor energético.\nAo longo das últimas duas décadas, o país se tornou um dos maiores produtores de petróleo e gás do planeta, enquanto suas empresas reduziram progressivamente sua dependência do petróleo.\n\"O desenvolvimento do fracking (fraturamento hidráulico, técnica de mineração usada para extrair gás natural e petróleo de rochas de xisto localizadas a grandes profundidades) nos Estados Unidos, desde o início dos anos 2000, e a evolução dos combustíveis alternativos criaram condições para que a contribuição do petróleo para o PIB por unidade de energia caísse pela metade nos últimos 50 anos\", explica Brusuelas.\nO contraste com a Europa é evidente.\nEnquanto os Estados Unidos se concentraram na flexibilidade, aproveitando o fracking e permitindo que os preços reajam livremente ao mercado, a Europa depende de contratos de longo prazo e redes de abastecimento interconectadas para garantir sua segurança energética.\nEsta estratégia deixou muitos países expostos a riscos com a interrupção do fornecimento de gás russo, após a invasão da Ucrânia. E, com as tensões atuais no Oriente Médio, a vulnerabilidade permanece.\nPara Rebecca Christie, pesquisadora do centro de análises Bruegel em Bruxelas, na Bélgica, esta discrepância não se observa apenas nas decisões políticas, mas nas atitudes culturais em relação ao risco.\n\"Os americanos são muito voltados às soluções e muito mais cômodos ao assumir riscos imediatos, de olho em vantagens de longo prazo\", explica ela. \"Já a Europa é culturalmente mais relutante ao risco.\"\nChristie conta que participou de um evento onde o próprio responsável de serviços financeiros da União Europeia declarou que os europeus não falam o suficiente sobre o risco de não assumir riscos.\nAs diferenças de estruturação das empresas e dos sistemas de aposentadoria nos dois lados do oceano Atlântico também refletem esta diferença de visão.\nEm grande parte da Europa, as empresas dependem muito dos empréstimos bancários para seu financiamento e as pensões dos trabalhadores são frequentemente relacionadas a contratos de seguro garantidos, que estabelecem limites tanto para os prejuízos quanto para os lucros.\n\"Se você financiar a sua empresa com um empréstimo bancário, não terá a mesma flexibilidade oferecida pela venda de ações ou atraindo capital de risco\", explica Christie.\nNos Estados Unidos, as empresas podem recorrer a investidores e ao mercado de ações para obter financiamento. Esta flexibilidade, mesmo com seus altos e baixos, oferece às companhias americanas uma vantagem sobre os modelos europeus, respaldados pelo Estado.\nMas Christie destaca com cautela que a resiliência em nível macro pode ocultar um problema real.\n\"Os Estados Unidos são uma terra com enorme desigualdade\", afirma ela.\n\"Se você estiver em dificuldades, irá realmente enfrentar tempos conturbados, pois o mercado de trabalho não está aumentando muito, tudo está ficando mais caro e muitas cidades sofrem crises de moradia.\"\nSua maior preocupação é que a desigualdade chegue a um momento crítico.\n\"Ter o dólar e os bancos bastante estáveis não irá ajudar se, na economia real, houver uma crise de empregos\", explica a pesquisadora.\nOs EUA não são imunes a pressões\nAté o momento, não há grandes evidências de que isso possa acontecer.\nNa verdade, os empregadores americanos criaram 172 mil postos de trabalho em maio, contra todas as expectativas.\nMas os novos dados da inflação mostram o maior aumento dos preços ao consumidor dos últimos três anos.\nA inflação anual ficou em 4,2% em maio, contra 3,8% em abril. Estes índices indicam que os Estados Unidos podem estar se aproximando do limite da sua resiliência.\nA economia americana pode estar superando grande parte dos seus rivais, mas isso não significa que ela seja imune a pressões. Os altos preços dos combustíveis, a inflação persistente e a desigualdade cada vez maior trazem riscos que poderão reduzir a atual vantagem do país.\nAinda assim, em comparação com muitos outros países desenvolvidos, a economia dos Estados Unidos se mantém robusta.\nSua combinação de mercados flexíveis, investimentos rápidos, energia em abundância e tolerância ao risco ajudaram a nação a superar os impactos que atingiram outros países.\n\"É a camisa mais limpa em um cesto de roupas muito sujo\", conclui Joe Brusuelas.", "url": "https://g1.globo.com/economia/noticia/2026/06/22/como-a-economia-dos-eua-continua-superando-seus-rivais-apesar-de-toda-turbulencia-do-governo-trump.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-22T12:21:43+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/2DoNqvSVdWqkJvqnhB4ZIrGhVNo=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/5/0/nWtFliQ1iLlqhpMyYCCA/4877abc0-6599-11f1-99b8-5530f29d65f4.jpg.webp", "url_hash": "880847e72ed54f228e0dd11031530329", "title_hash": "9c8344c816da07e0298ce374bf88fe00", "corroboration": 2, "relevance_score": 0.1358, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5229, "headline_en": "How the US Economy Keeps Outpacing Rivals Despite Trump Turbulence", "headline_pt": "Como a economia dos EUA supera rivais apesar da turbulência Trump", "one_liner_en": "The US economy continues to outperform global competitors despite disruptions caused by the Trump administration's policies.", "one_liner_pt": "A economia americana segue superando concorrentes globais apesar das turbulências geradas pelas políticas do governo Trump.", "category": "Economy", "region": "world", "rationale": "Near-duplicate of index 0 from a different source; same story republished on G1.", "low_signal": true}, {"title": "Uber atualiza lista de carros aceitos no Black e Comfort; veja mudanças para 2027", "summary": "<p>A Uber anunciou na semana passada mudanças nas categorias premium da plataforma que entrarão em vigor em janeiro de 2027....<\/p>\n<p>O post <a href=\"https://www.bemparana.com.br/noticias/economia/uber-atualiza-lista-de-carros-aceitos-no-black-e-comfort-veja-mudancas-para-2027/\">Uber atualiza lista de carros aceitos no Black e Comfort; veja mudanças para 2027<\/a> apareceu primeiro em <a href=\"https://www.bemparana.com.br\">Bem Paraná<\/a>.<\/p>", "url": "https://www.bemparana.com.br/noticias/economia/uber-atualiza-lista-de-carros-aceitos-no-black-e-comfort-veja-mudancas-para-2027/", "source_domain": "bemparana.com.br", "published_at": "2026-06-22T12:19:00+00:00", "origin": "feed", "image_url": "", "url_hash": "3e635d0b493669f8453cb8714cd57fbb", "title_hash": "a3ac8074e633af67fdcff8b72ce571ba", "corroboration": 2, "relevance_score": 0.1231, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5165, "headline_en": "Uber Updates Eligible Car List for Black and Comfort Categories by 2027", "headline_pt": "Uber atualiza lista de carros aceitos no Black e Comfort para 2027", "one_liner_en": "Uber announced new vehicle eligibility criteria for its premium categories, taking effect in January 2027.", "one_liner_pt": "A Uber anunciou novos critérios de veículos para categorias premium que entram em vigor em janeiro de 2027.", "category": "Tech", "region": "curitiba", "rationale": "Practical update affecting thousands of ride-hail drivers across Brazil, with local Paraná outlet coverage.", "low_signal": false}, {"title": "Uber atualiza lista de carros aceitos no Black e Comfort; veja mudanças para 2027", "summary": "<img src=\"https://s2-g1.glbimg.com/wuIrwZmEKLIQpuTJqDS1xdTjXqI=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2022/R/E/dAPd4gTRqMqXDXvX1xtg/ap22191718152243.jpg\" /><br />     Foto ilustrativa mostra logo da empresa Uber em para-brisa de carro\nNam Y. Huh/AP\nA Uber anunciou na quinta-feira (18) mudanças nos critérios de veículos aceitos nas categorias premium da plataforma, Uber Black e Uber Comfort. \nAs novas regras entram em vigor em 11 de janeiro de 2027 e incluem alterações nos anos mínimos de fabricação exigidos, além da retirada de alguns modelos das duas categorias.\n📱Baixe o app do g1 para ver notícias em tempo real e de graça\nSegundo a empresa, a atualização foi baseada em pesquisas com usuários e em análises sobre a evolução do mercado automotivo. \n\"Os veículos da nova lista foram determinados com base em aspectos apontados pelos usuários como importantes para a decisão na hora de pedir viagens nas categorias Comfort e Black\", informou a companhia.\nAgora no g1\nO que muda no Uber Black\nNa categoria Uber Black, alguns modelos passarão a exigir anos de fabricação mais recentes para novos cadastramentos.\nEntre eles estão o Honda City, que passará a exigir modelos a partir de 2023, o BYD Dolphin, aceito apenas a partir de 2024, e os modelos Volkswagen Virtus e Peugeot 2008, que deverão ser de 2025 em diante.\nAlém disso, a Uber deixará de aceitar determinados modelos na categoria Black, independentemente do ano de fabricação. Os veículos que sairão da categoria em 11 de janeiro de 2027 são:\nCitroën C4 Cactus;\nCitroën C4 Lounge;\nRenault Duster;\nChery Arrizo 5;\nChevrolet Cruze;\nHyundai Ioniq;\nToyota Prius;\nAudi A3;\nVolkswagen Nivus.\nO Volkswagen Virtus seguirá um cronograma diferente e será retirado da categoria em 5 de julho de 2027.\nJá o BYD Dolphin poderá ser cadastrado na categoria Black até 31 de dezembro de 2026 e permanecerá apto a operar até 31 de dezembro de 2027.\nAlém dos requisitos de veículo, os motoristas da categoria Black precisam ter realizado mais de 100 viagens na plataforma e manter nota mínima de 4,85 dada pelos usuários.\nO que muda no Uber Comfort\nNessa categoria, os modelos Toyota Etios Sedan e Chevrolet Cobalt, por exemplo, passarão a exigir fabricação a partir de 2018 ou 2019, dependendo da cidade. Para os demais veículos, os anos mínimos exigidos variam conforme o município.\nA partir de janeiro de 2027, os seguintes modelos deixarão de ser aceitos na categoria Comfort, independentemente do ano de fabricação:\nFiat Argo;\nVolkswagen Polo;\nVolkswagen Voyage;\nChevrolet Joy Plus;\nChevrolet Prisma;\nToyota Yaris;\nPeugeot 208;\nRenault Zoe;\nKia Rio;\nJAC J3 Turin;\nJAC iEV40.\nPara operar na categoria Comfort, os motoristas também devem ter mais de 100 viagens realizadas na plataforma. A nota mínima exigida é de 4,85 em Brasília, Curitiba, Porto Alegre, Joinville, Londrina e Caxias do Sul, e de 4,80 nas demais cidades.\nNova regra promete mais previsibilidade\nA Uber também anunciou uma nova política para dar mais previsibilidade aos motoristas na hora de comprar um veículo.\nA partir de 2027, carros recém-adicionados a uma categoria premium permanecerão elegíveis por pelo menos dois anos, desde que continuem atendendo aos critérios de idade máxima exigidos pela plataforma.\nComo exemplo, a empresa citou o Geely EX2, incluído na categoria Comfort em junho de 2026, e o JAC T80, incorporado à categoria Black no mesmo período. Segundo a Uber, ambos permanecerão aptos a operar nas categorias premium ao menos até junho de 2028.", "url": "https://g1.globo.com/carros/noticia/2026/06/22/uber-atualiza-lista-de-carros-aceitos-no-black-e-comfort-veja-mudancas-para-2027.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-22T11:24:17+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/wuIrwZmEKLIQpuTJqDS1xdTjXqI=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2022/R/E/dAPd4gTRqMqXDXvX1xtg/ap22191718152243.jpg", "url_hash": "6f6c969ba10039d55438701690dbc08a", "title_hash": "a3ac8074e633af67fdcff8b72ce571ba", "corroboration": 2, "relevance_score": 0.074, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.492, "headline_en": "Uber Updates Eligible Car List for Black and Comfort Categories by 2027", "headline_pt": "Uber atualiza lista de carros aceitos no Black e Comfort para 2027", "one_liner_en": "Uber announced new vehicle eligibility criteria for its premium categories, taking effect in January 2027.", "one_liner_pt": "A Uber anunciou novos critérios de veículos para categorias premium que entram em vigor em janeiro de 2027.", "category": "Tech", "region": "brazil", "rationale": "Near-duplicate of index 2 from G1; same story with broader national reach.", "low_signal": true}, {"title": "O mundo rearmado e a ilusão estratégica brasileira", "summary": "<img src=\"  "Curitiba to Host International Jehovah's Witnesses Convention", "headline_pt": "Curitiba sedia Congresso Internacional das Testemunhas de Jeová", "one_liner_en": "Curitiba will host one of the year's largest religious events, the International Jehovah's Witnesses Convention.", "one_liner_pt": "Curitiba receberá o Congresso Internacional das Testemunhas de Jeová, um dos maiores eventos religiosos do ano.", "category": "Culture", "region": "curitiba", "rationale": "Large-scale international event in Curitiba with significant logistical and cultural impact on the city.", "low_signal": false}, {"title": "As propostas de De la Espriella para a Colômbia, e como elas se comparam com as da direita tradicional", "summary": "Abelardo de la Espriella diz ser \"mais uribista do que o próprio Álvaro Uribe\", mas adaptado aos tempos de Donald Trump e à crise da ordem liberal.", "url": "https://www.bbc.com/portuguese/articles/crelvnyw532o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-06-22T09:36:38+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/d27b/live/4a648cb0-5d4b-11f1-89a3-d1f559421220.jpg", "url_hash": "401c0e1faa7c0130956f89b2b6616aed", "title_hash": "f673a55488ae86ddf0089dc5567f4a3c", "corroboration": 1, "relevance_score": 0.2285, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3693, "headline_en": "De La Espriella's Policy Proposals Compared to Traditional Colombian Right", "headline_pt": "As propostas de De la Espriella para a Colômbia comparadas com a direita tradicional", "one_liner_en": "De la Espriella calls himself more Uribista than Uribe himself, while adapting to Trump's era and the liberal order's crisis.", "one_liner_pt": "De la Espriella se diz mais uribista que o próprio Uribe, adaptado aos tempos de Trump e à crise da ordem liberal.", "category": "Geopolitics", "region": "world", "rationale": "Contextualizes the Colombian election result with policy substance, complementing the breaking news coverage.", "low_signal": false}, {"title": "Quem é Abelardo de la Espriella, candidato inspirado em Bukele e Milei que ganhou eleição na Colômbia em apuração preliminar", "summary": "De la Espriella, que segundo especialistas representa uma direita dura e populista, teve vantagem de menos de 1% dos votos sobre Iván Cepeda, candidato da esquerda ligada ao presidente Gustavo Petro. Resultados ainda são preliminares.", "url": "https://www.bbc.com/portuguese/articles/cy8wjg4ylzjo?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-06-22T07:55:32+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/bffa/live/03f4b360-6e0b-11f1-b1db-af71d47507d6.jpg", "url_hash": "a4186e8c23021ff0d6cc16840815d959", "title_hash": "3b8f9446353953f51c744db77982a0d2", "corroboration": 1, "relevance_score": 0.2285, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3692, "headline_en": "Who Is Abelardo De La Espriella, the Bukele-Inspired Winner in Colombia?", "headline_pt": "Quem é Abelardo de la Espriella, candidato inspirado em Bukele que venceu na Colômbia?", "one_liner_en": "De la Espriella, a hard-right populist inspired by Bukele and Milei, leads Colombia's presidential race by under 1%.", "one_liner_pt": "De la Espriella, populista de direita inspirado em Bukele e Milei, lidera a eleição colombiana com menos de 1% de vantagem.", "category": "Geopolitics", "region": "world", "rationale": "Profile of a surprise political winner reshaping Latin American political dynamics.", "low_signal": false}, {"title": "UE diz que oferece proposta mais vantajosa ao Brasil na disputa por minerais críticos", "summary": "<img src=\"https://s2-g1.glbimg.com/fQbTxy3OzDGc3aW8AtzXFR1WmeM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/g/3/oXl5IcTWizvWAletBftQ/globo-canal-4-20260507-2000-frame-112612.jpeg\" /><br />     Minerais críticos: projeto aprovado na Câmara quer garantir que o Brasil não seja apenas exportador de matéria-prima\nJornal Nacional/ Reprodução\nEnquanto trabalha para diversificar suas fontes de suprimento de minerais críticos, a União Europeia aposta no Brasil como parceiro estratégico e afirma ter uma proposta mais \"benéfica\" do que a de outros atores na disputa por matérias-primas brasileiras, disse o comissário europeu para Parcerias Internacionais, Jozef Síkela, à Reuters.\nO comissário visitou no sábado o centro de pesquisa e processamento de terras raras da mineradora australiana Viridis Mining and Minerals, em Poços de Caldas (MG), um dos quatro projetos prioritários selecionados para acelerar a colaboração entre a UE e o Brasil. \n🗒️Tem alguma sugestão de reportagem? Envie para o g1 \nSíkela avalia que a abordagem europeia é um trunfo por priorizar a sustentabilidade do negócio e o incentivo ao processamento local de terras raras. Isso casa com uma diretriz do governo brasileiro, de produzir e exportar minerais processados, que agreguem tecnologias e valores à cadeia produtiva de um setor nascente no Brasil, que conta com a segunda maior reserva global de tais minerais críticos.\n\"É extremamente importante que o Brasil também avance além de negócios de baixa margem, ou seja, que o valor seja criado aqui no país\", disse o comissário, em entrevista durante a visita à unidade da Viridis, destacando que o Brasil é hoje o parceiro mais estratégico da UE na América Latina e uma economia em expansão.\n\"Podemos cobrir, com base em acordos de compra, as nossas necessidades, e o Brasil terá sua própria capacidade de refino, novas tecnologias e, basicamente, avançará na cadeia de suprimentos para uma geração de margens mais altas.\" \nBrasil vive oportunidade estratégica com minerais críticos, afirma embaixador\nO projeto piloto mineiro da Viridis, inaugurado em maio, tem capacidade para processar 100 kg de minério por hora e produzir por ano até 2,92 kg de carbonato misto de terras raras (MREC, na sigla em inglês), um pó esbranquiçado que contém uma mistura dos elementos de terras raras ainda não separados.\nA Viridis agora planeja investir US$360 milhões para construir sua planta comercial com capacidade para produzir 15 mil toneladas de MREC por ano a partir de 2028. O projeto Colossus da Viridis, em Minas Gerais, compreende um total de 228,62 km² de licenças.\n\"E é por isso que gosto tanto deste projeto (da Viridis) em particular, porque ele basicamente entrega objetivos: ele cria empregos, cria novas parcerias, traz novas tecnologias, educação e transferência de conhecimento, tudo com base nos padrões ambientais, sociais e técnicos mais avançados\", afirmou Síkela.\nAcordo à vista\nEle também destacou a carta de intenções não vinculante assinada neste mês entre a Viridis e a química belga Solvay, que prevê fornecimento de MREC e pode evoluir para uma parceria mais ampla, incluindo apoio tecnológico no processamento.\nO presidente-executivo da Viridis, Rafael Moreno, afirmou à Reuters que discussões com a União Europeia sobre apoio ao projeto estão avançadas, e que um acordo com a Solvay pode ser fechado até o fim de julho. Segundo ele, a UE poderá ajudar com financiamento e mecanismos de proteção de preços para reduzir riscos e garantir competitividade.\n\"Um preço mínimo é importante, então concluir todos esses detalhes será importante para nós, e isso não está longe de acontecer\", disse Moreno, sem falar em prazos.\nSíkela afirmou que o seu papel é oferecer apoio político e instrumentos de mitigação de riscos, sem substituir o capital privado.\n\"Não estamos vindo para substituir o financiamento privado nem como provedores de capital próprio, mas nosso papel é ajudar a mobilizar investimentos privados\", afirmou, sem dar detalhes.\nO avanço da Viridis no Brasil ocorre em meio a uma corrida global por terras raras e minerais críticos, enquanto governos na Europa e nos Estados Unidos tentam reduzir sua dependência da China -- maior produtor -- para esses materiais, que são vitais para carros elétricos e sistemas de defesa.\nDiversificação no Ocidente\nQuestionado sobre o cenário, Síkela afirmou que não se trata apenas da China e explicou que a estratégia europeia busca reduzir \"dependências\" na cadeia de suprimentos globais, após choques como a pandemia e a guerra na Ucrânia.\nAlém das terras raras, Síkela disse sem dar nomes que a UE vê como prioritários no Brasil projetos envolvendo outros minerais críticos, como níquel e lítio, e indicou que há planos para avançar em um memorando de entendimento entre o bloco e o governo brasileiro, embora os detalhes ainda estejam em negociação.\nQuestionado se pode estar chegando atrasado na disputa por ativos no Brasil, após Estados Unidos e China terem feito avanços importantes, o comissário disse que \"nossa proposta de valor é mais benéfica do que a dos outros. Primeiro, é mais sustentável... A segunda coisa é criação de empregos e educação\", afirmou.\n\"Não devemos esquecer que o Brasil é um ator ambiental global, com a floresta tropical, com a Amazônia, com os recursos. Então, o que quer que o Brasil faça, se fizer certo, terá impacto global. E, se fizer errado, terá um impacto negativo. Portanto, o que queremos fazer é ajudar com padrões ambientais, sociais e de governança, porque isso importa para nós\", afirmou.\nO presidente-executivo da Viridis, por sua vez, disse que a companhia está em linha com as orientações europeias, de pensar um mercado diversificado para a cadeia produtiva de terras raras. \"Estamos adotando uma abordagem em que queremos que todos tenham direitos, seja na Argentina, no Paraguai, na Europa ou na Austrália... portanto, estamos satisfeitos em manter uma mentalidade europeia ou ocidental -- ou, mais importante ainda, uma mentalidade ocidental\", disse Moreno.\nAo final do mês passado, o executivo disse à Reuters que a Viridis estava em negociações avançadas com potenciais compradores de minerais críticos na Europa e nos EUA, acrescentando que // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const xs = [22,50,80,115,148,180,215,248,35,95,162,228];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    xs.forEach((x,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + x + 'px;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const xs  = [16,34,54,76,98,118,142,164,188,212,238,262];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    xs.forEach((x,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + x + 'px;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;

  const type   = wxSceneType(code, precip);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

// ── Briefing ─────────────────────────────────────────────────────────
function renderBriefing() {
  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round((art.relevance_score || 0) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
