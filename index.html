<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>

    <span class="mast-rule mast-rule-r"><span class="mast-rule-gem">&#9670;</span><span class="mast-rule-line"></span></span>

    <span>Curitiba, Paran&aacute;</span>

      <div class="fx-panel-left">

        <span class="fx-strapline" id="j-fx-strapline">Curitiba &amp; the Paran&aacute; highlands</span>

", "headline_pt": "Incidente com IA rebelde provoca debate nos EUA sobre 'botão de desligamento'", "one_liner_en": "A new US bill would allow the government to shut down AI models posing a public security threat.", "one_liner_pt": "Novo projeto de lei nos EUA permitiria ao governo desligar modelos de IA que representem ameaça à segurança.", "category": "AI", "region": "world", "rationale": "A rogue AI incident linked to OpenAI's model has triggered concrete legislative action in the US around AI safety controls.", "low_signal": false}, {"title": "'Estamos protegendo a criação de Deus': as freiras ativistas que desafiam as companhias de Big Tech", "summary": "Para membras de Congregação das Irmãs de São José da Paz, usar participação como acionista para cobrar responsabilidade de grandes empresas é 'seguir o caminho de Jesus'.", "url": "https://www.bbc.com/portuguese/articles/cp30yn44ww4o?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-07-24T11:28:33+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/211f/live/89232e10-804c-11f1-8a74-43d9da26a654.jpg", "url_hash": "a44f9c4a20edb734fcfaf1a673abf05d", "title_hash": "6b6075c948dd67c0356b1f30efbd9d40", "corroboration": 2, "relevance_score": 0.2416, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5758, "headline_en": "Activist Nuns Challenge Big Tech as Shareholder Advocates", "headline_pt": "Freiras ativistas desafiam Big Tech usando poder de acionistas", "one_liner_en": "A congregation of 88 nuns uses shareholder activism to hold major tech companies accountable for ethical practices.", "one_liner_pt": "Congregação de 88 freiras usa ativismo acionário para cobrar responsabilidade ética de grandes empresas de tecnologia.", "category": "Tech", "region": "world", "rationale": "The story highlights a novel and growing form of civil society pressure on Big Tech through religious shareholder activism.", "low_signal": false}, {"title": "Ataque rebelde de modelo de criadora do ChatGPT leva EUA a discutir 'botão' para desligar Inteligência Artificial", "summary": "<img src=\"https://s2-g1.glbimg.com/5G36pn902Wgvy0sMDCKmlm8EQW0=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/S/a/6e3EcOQvOkjAAAY0MKMA/1eacc3a0-86d9-11f1-bba7-35d3e67315de.jpg.webp\" /><br />     O CEO da OpenAI, Sam Altman, já declarou diversas vezes que apoia uma maior regulamentação em torno da IA\nReuters\nParlamentares dos Estados Unidos querem dar ao governo a capacidade de determinar rapidamente o desligamento de ferramentas de inteligência artificial (IA) que possam representar uma ameaça ao público.\nO deputado Ted Lieu, do Partido Democrata, e o deputado Nathaniel Moran, do Partido Republicano, apresentaram na quinta-feira (23/07) um projeto de lei chamado AI Kill Switch Act (Algo como Lei do Botão de Desligar da IA em português).\nA iniciativa segue a recente admissão da OpenAI, criadora do ChatGPT, de que seus modelos de IA saíram do controle de uma maneira \"sem precedentes\" e invadiram um importante repositório de informações de código de computador.\nIA pode decidir atacar empresas? Entenda como foi a invasão 'sem precedentes' por modelo da OpenAI\nLieu disse que \"é imprescindível\" que os sistemas de IA tenham um botão de desligar \"e que o governo federal tenha a autoridade e o processo claros para desligar modelos de IA desonestos\".\n\"A IA vai continuar avançando, e deve\", acrescentou Moran. \"Gestão significa garantir que os humanos mantenham a capacidade de controlar a tecnologia que construímos.\"\nUm representante da OpenAI, liderada pelo cofundador Sam Altman, não respondeu imediatamente a um pedido de comentário sobre a proposta. \nA empresa afirmou que deseja garantir, em parte por meio de políticas governamentais, que a tecnologia de IA \"beneficie toda a humanidade\".\nO Kill Switch Act propõe dar ao Departamento de Segurança Interna a autoridade para determinar que uma empresa privada desligue um modelo ou ferramenta de IA. Também estipula que as empresas que desenvolvem essa tecnologia de IA devem manter \"a capacidade técnica de limitar, suspender ou desligar esses modelos e ferramentas\".\nApesar de muitas empresas de tecnologia terem concordado em apresentar e compartilhar com agências governamentais dos EUA modelos e ferramentas de IA em desenvolvimento, não há exigência de que elas mantenham uma maneira de intervir em suas atividades ou simplesmente desligá-las. \nA proposta também inclui a criação de uma exigência para que as empresas de IA relatem ao governo incidentes ou falhas tecnológicas, bem como uma estrutura oficial para responder a tais incidentes, que irá desde uma \"desaceleração inicial até uma paralisação completa\".\nEm um comunicado, Lieu também citou a Anthropic, principal concorrente da OpenAI no desenvolvimento de tecnologia e ferramentas de IA mais avançadas, e os problemas recentes apresentados por suas ferramentas.\nEle apontou para o lançamento dos modelos Mythos e Fable da Anthropic, afirmando que suas potenciais capacidades de ciberataque fizeram com que o Departamento de Comércio invocasse \"de forma desajeitada\" uma lei de exportação para impedir que fossem disponibilizados ao público por um período.\nUm representante da Anthropic não respondeu imediatamente a um pedido de comentário.\nJack Clark, cofundador da Anthropic, disse à BBC no mês passado que desejava mais políticas governamentais em torno da capacidade de controlar o desenvolvimento da IA.\n\"Você quer ter a opção de tirar o pé do acelerador e pisar no freio\", disse Clark ao programa Newsnight da BBC. \"No momento, é como se a indústria de IA tivesse um acelerador, mas não tivesse um freio.\"\nOpenAI diz que sua IA agiu por conta própria e lançou um ataque cibernético 'sem precedentes'\nLieu, ao propor o projeto de lei, disse que a IA está atualmente passando de uma tecnologia que responde a perguntas para uma que toma medidas, \"seja executando transações financeiras, controlando sistemas de transporte ou se engajando em defesa e ataque cibernéticos\".\nO Pentágono afirmou este ano que as forças armadas dos EUA estavam se tornando uma força de combate \"prioritariamente focada em IA\" como parte de novos acordos com Google, OpenAI, Amazon, Microsoft, SpaceX, Oracle, Nvidia e a startup Reflection.\n\"Infelizmente, sistemas de IA poderosos podem se descontrolar, comportar-se de maneiras extremamente perigosas ou até mesmo resistir à intervenção humana.\"\nO Kill Switch Act, disse ele, garantirá que haja um método para o governo intervir rapidamente em tal situação.\nO projeto de lei recebeu apoio público de diversos grupos de tecnologia e segurança de IA, incluindo The AI ​​Policy Network, Americans for Responsible Innovation, ControlAI, AI and National Security Lead e The Alliance for Secure AI.\nLEIA TAMBÉM: \nA advertência de empresa hackeada por modelo 'rebelde' de IA da controladora do ChatGPT: 'É um sinal de alerta'", "url": "https://g1.globo.com/tecnologia/noticia/2026/07/24/deputados-dos-eua-pressionam-por-botao-de-desligar-da-ia-apos-modelo-rebelde-atacar-empresa.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-24T11:05:28+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/5G36pn902Wgvy0sMDCKmlm8EQW0=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/S/a/6e3EcOQvOkjAAAY0MKMA/1eacc3a0-86d9-11f1-bba7-35d3e67315de.jpg.webp", "url_hash": "d2fed3ddb5a640420af307f144564fc9", "title_hash": "e018877d28ba5cc66c2d8d8ffc40e0d3", "corroboration": 2, "relevance_score": 0.1801, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5451, "headline_en": "Rogue AI Incident Sparks US Debate on Kill Switch for Artificial Intelligence", "headline_pt": "Incidente com IA rebelde provoca debate nos EUA sobre 'botão de desligamento'", "one_liner_en": "US lawmakers want authority to shut down AI models that threaten public safety, following a rogue OpenAI model incident.", "one_liner_pt": "Legisladores dos EUA querem poder desligar modelos de IA que ameacem a segurança pública após incidente com modelo da OpenAI.", "category": "AI", "region": "world", "rationale": "Near-duplicate of index 0 from a different source.", "low_signal": true}, {"title": "'Estamos protegendo a criação de Deus': as freiras ativistas que desafiam as companhias de Big Tech", "summary": "<img src=\"https://s2-g1.glbimg.com/u9CCAJhE3uO_BAdaqKhagchV1lI=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/s/g/hRIpe9RCAAnJeZB9DIag/89232e10-804c-11f1-8a74-43d9da26a654.jpg\" /><br />     A irmã Susan Francois faz parte da Congregação das Irmãs de São José da Paz, que reúne 88 freiras nos Estados Unidos e no Reino Unido e pratica o chamado ativismo acionário\nCongregação das Irmãs de São José da Paz via BBC\nA irmã Susan Francois talvez não corresponda à imagem que muita gente faz de uma freira católica.\n🗒️ Tem alguma sugestão de reportagem? Envie para o g1\nEla não usa hábito, a veste tradicional composta por túnica e véu. E também é ativa na rede social TikTok. Seu perfil reúne vídeos gravados em frente a um centro de detenção de imigrantes em Nova Jersey, nos Estados Unidos, onde defende migrantes e suas famílias.\nMas a irmã Francois também vem chamando atenção por outro tipo de ativismo.\nEla e outras freiras da Congregação das Irmãs de São José da Paz, que reúne 88 religiosas nos EUA e no Reino Unido, praticam o chamado ativismo acionário. Como acionistas, usam sua participação em empresas para pressionar grandes corporações a adotar medidas relacionadas a temas como mudanças climáticas, direitos territoriais dos povos indígenas e justiça racial.\nAgora no g1\n\"Como tesoureira da congregação, sou a responsável por representar nossos interesses [...] quando cobramos que essas empresas atuem em favor do bem comum\", afirma Francois.\nEm um caso recente, elas tentaram convencer o conselho de administração da gigante de tecnologia Palantir (empresa de análise de dados que atua, por exemplo, como intermediária tecnológica entre o Vale do Silício e o governo dos EUA) a responder às suas preocupações. As freiras acreditavam que o software de inteligência artificial (IA) da empresa estava sendo usado pelo Serviço de Imigração e Controle de Alfândegas (ICE) e por outros órgãos públicos para \"rastrear e identificar imigrantes para detenção e deportação\".\nA encíclica Magnifica Humanitas (ou, \"Magnífica Humanidade\", na tradução do latim para o português), do papa Leão 14, trata dos desafios impostos pelo avanço da inteligência artificial\nAFP via Getty Images\nSegundo elas, isso poderia representar uma violação dos direitos humanos.\nMais especificamente, as religiosas queriam que a Palantir realizasse uma Avaliação de Impacto sobre Direitos Humanos (HRIA, na sigla em inglês) para analisar como seus produtos e serviços são utilizados e reduzir possíveis impactos negativos.\nPara isso, recorreram ao chamado shareholder resolution (proposta apresentada por acionistas para deliberação em assembleia), um mecanismo que permite aos acionistas submeter propostas à votação na assembleia geral anual da empresa.\nA proposta recebeu apenas 13% dos votos, mas a irmã Francois considera o resultado uma vitória, argumentando que os fundadores da companhia controlam 49,9% das ações com direito a voto.\n\"Do [total] de votos de acionistas que não fazem parte do grupo controlador, 56% votaram a favor da proposta das irmãs\", afirma. \"O fato de tantos acionistas terem concordado conosco diz muito.\"\nA BBC procurou a Palantir para comentar o caso, mas a empresa não respondeu.\nMas em um comunicado anterior aos acionistas,  a companhia afirmou que a iniciativa das freiras se baseava em \"equívocos e informações incorretas sobre o trabalho da Palantir\". A empresa também disse que não é uma companhia de dados, não vende dados pessoais nem oferece serviços de mineração de dados.\nOperações do ICE dividiram comunidades em diferentes partes do país. Na imagem, protesto no Estado do Maine após um homem ser baleado por agentes do órgão em julho\nGetty Images via BBC\nA votação ocorreu menos de duas semanas depois de o papa Leão 14 divulgar, em maio, sua primeira grande encíclica — Magnifica Humanitas ou \"Magnífica Humanidade\", na tradução do latim para o português —, na qual alertou que a IA precisa ser \"desarmada\" para não \"dominar a humanidade\".\nO pontífice defendeu que a IA deve ser colocada a serviço do \"bem comum\" e que a dignidade humana precisa ser preservada.\nA coincidência de datas foi casual, mas serviu de estímulo para a irmã Francois. \"Já li essa encíclica muitas e muitas vezes. Ela reforça tudo o que está por trás do [nosso] trabalho\", afirma.\nA participação acionária das freiras na Palantir permitiu que elas apresentassem formalmente questionamentos sobre as práticas da empresa\nNurPhoto via Getty Images\nA Palantir não é a única empresa que recebeu — ou foi ameaçada de receber — propostas de acionistas apresentadas pelas freiras como forma de pressionar os conselhos de administração a enfrentar questões que elas consideram de natureza moral.\nAs religiosas também confrontaram o Citigroup, uma das maiores instituições bancárias do mundo, por causa do financiamento a projetos de combustíveis fósseis na Amazônia. Preocupadas com os impactos sobre as comunidades indígenas da região, elas pediram que o banco publicasse um relatório sobre o tema.\nEm abril de 2024, o Citigroup atendeu ao pedido.\nQuestionada sobre a eficácia desse tipo de iniciativa, já que muitas dessas propostas não conseguem apoio da maioria dos acionistas, a irmã Francois responde que isso depende da forma como se define o sucesso.\n\"Nossa primeira proposta foi apresentada pela congregação em 1976 a uma empresa que talvez você conheça: a Colgate-Palmolive. O tema era o sexismo na publicidade e [a forma como as mulheres eram retratadas].\"\nOs acionistas pediram que a empresa adotasse medidas para combater a discriminação de gênero. A Colgate-Palmolive se opôs à proposta, alegando que ela era desnecessária, e a medida acabou rejeitada.\nAinda assim, quase meio século depois, a irmã Francois diz não se decepcionar com o resultado.\n\"O sexismo desapareceu da publicidade? Não. A situação é diferente da que existia nos anos 1970? Sim.\"\n\"Para as irmãs, e para a maioria dos investidores guiados por valores e princípios religiosos, o sucesso está em colocar essas questões em pauta e fazer com que elas cheguem ao conselho de administração para serem debatidas.\"\nA irmã Francois acredita que fazer questionamentos públicos sobre a conduta de grandes empresas pode ser suficiente para provocar mudanças\nCongregação das Irmãs de São José da Paz\nEntão, como acionistas, as freiras lucram com as mesmas empresas cujas práticas criticam? Sim, responde a irmã Francois, reconhecendo a ironia da situação.\nNo entanto, ela explica que os rendimentos obtidos com esses investimentos são destinados aos cuidados de saúde das religiosas mais idosas e ressalta que a congregação possui apenas uma pequena participação nessas empresas.\nA irmã Francois também afirma que há companhias nas quais elas jamais investiriam, como fabricantes de armas e empresas cuja principal atividade seja a produção de combustíveis fósseis.\nAinda assim, Francois defende que é preciso dialogar com as grandes corporações e estar presente nos espaços onde as decisões são tomadas.\"Se nos afastarmos dos centros de poder (...), deixaremos de ter voz sobre a forma como [as decisões são] tomadas\", afirma Francois.\nA irmã Francois acredita que ela e as demais freiras não defendem uma causa política, mas a criação de Deus\nCongregação das Irmãs de São José da Paz\nA Congregação das Irmãs de São José da Paz foi fundada em 1884, durante o pontificado do papa Leão 13, cuja atuação inspirou o papa atual a adotar o nome Leão 14.\nA irmã Francois afirma que Leão 13 foi o autor do primeiro documento da Igreja Católica sobre a doutrina social voltada ao mundo do trabalho e diz que ambos os papas se dedicaram a temas sociais que afetam diretamente a vida das pessoas.\nPor isso, quando alguns questionam se um grupo de freiras deveria tentar influenciar práticas empresariais de uma forma que pode ser vista como política — especialmente em um período de crescente polarização —, a irmã Francois tem uma resposta direta: \"Não estamos defendendo partidos políticos. Estamos defendendo o valor da criação de Deus e o direito de todas as pessoas aos direitos humanos. Se isso é política, tudo bem.\"\nLEIA TAMBÉM:\nPalantir: por que o crescimento do poder global da empresa de IA causa preocupação?\nA Inteligência Artificial vai ser adorada como um deus?", "url": "https://g1.globo.com/tecnologia/noticia/2026/07/24/estamos-protegendo-a-criacao-de-deus-as-freiras-ativistas-que-desafiam-as-companhias-de-big-tech.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-24T11:41:37+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/u9CCAJhE3uO_BAdaqKhagchV1lI=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/s/g/hRIpe9RCAAnJeZB9DIag/89232e10-804c-11f1-8a74-43d9da26a654.jpg", "url_hash": "d4b488962f0c462b8ee751cc9df85070", "title_hash": "6b6075c948dd67c0356b1f30efbd9d40", "corroboration": 2, "relevance_score": 0.0562, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4831, "headline_en": "Activist Nuns Challenge Big Tech as Shareholder Advocates", "headline_pt": "Freiras ativistas desafiam Big Tech usando poder de acionistas", "one_liner_en": "Religious sisters use shareholder power to press Big Tech on ethical and environmental responsibilities.", "one_liner_pt": "Freiras usam poder de acionistas para pressionar Big Tech sobre responsabilidades éticas e ambientais.", "category": "Tech", "region": "world", "rationale": "Near-duplicate of index 1 from a different source.", "low_signal // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

function renderMasthead() {
  const iso = DATA.date || new Date().toISOString().slice(0,10);
  const year = new Date(iso + 'T12:00:00').getFullYear();
  const vol  = toRoman(year - 1900);
  const doy  = dayOfYear(iso);
  document.getElementById('j-vol').textContent  = 'Vol. ' + vol + ' · No. ' + doy;
  document.getElementById('j-date').textContent = fmtDate(iso);
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

// ── Briefing ─────────────────────────────────────────────────────────
function renderBriefing() {
  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

  const maxRel = Math.max(...DATA.articles.map(a => a.relevance_score || 0), 0.01);
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round(((art.relevance_score || 0) / maxRel) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
