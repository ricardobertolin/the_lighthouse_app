<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>

photos/bs/2026/B/P/ytD4X6Si6p9v00cqy9QA/855b89e0-6c23-11f1-8b36-a5a4761bc43e.jpg\" /><br />     Como as megaprisões de Bukele se transformaram em modelo para a direita radical\nGetty Images via BBC\nNas últimas campanhas eleitorais ocorridas na América Latina, o presidente de El Salvador, Nayib Bukele, com sua política de pulso forte contra o crime (incluindo suas polêmicas megaprisões) passou a ser referência recorrente no debate político.\n🗒️ Tem alguma sugestão de reportagem? Mande para o g1\nNa Colômbia, o candidato de direita Abelardo de la Espriella venceu as eleições presidenciais, segundo os dados da apuração preliminar. Ele expressou abertamente sua admiração por Bukele.\nDurante a campanha, De la Espriella prometeu construir sete megaprisões inspiradas no modelo salvadorenho.\nNo vizinho Peru, a candidata à presidência e virtual vencedora Keiko Fujimori também incluiu a mesma ideia no centro da sua proposta de segurança.\nAgora no g1\nA líder da direita garantiu que, se chegar ao poder, impulsionará a construção de quatro penitenciárias e uma megaprisão para réus de alta periculosidade, \"como o Cecot, em El Salvador\". É uma referência ao Centro de Confinamento do Terrorismo do país centro-americano, que recebeu inúmeras denúncias de abusos de direitos humanos.\nA atração pelas megaprisões de Bukele não se limita à América Latina. Seu modelo também começou a reverberar entre a direita radical europeia.\nNa semana passada, o presidente do partido francês de extrema direita Reagrupamento Nacional, Jordan Bardella, fez referência ao sistema penitenciário salvadorenho ao abordar o problema da superlotação das penitenciárias da França.\n\"Em um país de 6 milhões de habitantes, Bukele construiu 40 mil vagas carcerárias em oito meses\", afirmou Bardella, em entrevista à rede francesa BFMTV.\nEste enfoque parece atraente para alguns líderes políticos. Mas seus críticos alertam que ele costuma ser apresentado sem fazer menção às denúncias de violações de direitos humanos, documentadas no âmbito destas políticas.\n\"É preciso tomar cuidado quando se fala em 'modelo Bukele' porque, na verdade, não se trata de um modelo\", declarou à BBC News Mundo (o serviço em espanhol da BBC), a pesquisadora Sonja Wolf, da Faculdade de Governo e Economia da Universidade Panamericana da Cidade do México. \"Mas convém a Bukele que ele receba este nome e se propague para outros países.\"\nWolf é a autora do livro Mano Dura (\"Mão forte\", em tradução livre), que examina a política de controle das gangues de El Salvador.\nEla afirma que parte da atração internacional despertada por este enfoque ocorre porque o contexto político do seu desenvolvimento no país centro-americano nem sempre é conhecido.\n\"Muitos não entendem o regime político que Bukele vem consolidando\", explica ela.\n\"É o que se pode descrever como autocracia eleitoral, onde, para se manter no poder, é preciso demonstrar que ele conta com o apoio do 'povo'.\"\nNeste sentido, o regime de exceção, que vem permitindo detenções em massa, cumpre com uma dupla função: combater a criminalidade e reforçar sua legitimidade política.\nSupostos criminosos participam de audiência virtual durante um julgamento coletivo contra membros da gangue 'Mara Salvatrucha' (MS-13)\nGetty Images via BBC\n\"Além das eleições, é fundamental para Bukele manter altos níveis de popularidade\", prossegue a pesquisadora.\n\"O regime de exceção, apesar dos custos incorridos para as pessoas detidas e para a democracia em El Salvador, conta com o apoio popular e serve para sustentar seu projeto político.\"\nWolf destaca que a projeção internacional destas políticas também desempenha papel fundamental.\n\"A promoção do regime de exceção no exterior e as visitas de líderes políticos a locais como o Cecot contribuem para reforçar sua imagem e legitimar sua permanência no poder\", segundo ela.\nEm fevereiro de 2024, quando foi reeleito presidente com mais de 80% dos votos, Bukele destacou os resultados obtidos pelo seu governo em termos de segurança. Ele se gabou de ter atingido seus objetivos \"com uma receita salvadorenha\", rebatendo seus críticos.\n\"Passamos de ser o país mais inseguro do mundo para ser o mais seguro de todo o continente americano. E o que disseram? Que está violando direitos humanos\", declarou ele aos seus seguidores, em referência às denúncias internacionais sobre sua política de pulso firme.\n\"Os direitos humanos de quem? Não das pessoas honradas\", prosseguiu Bukele.\n\"Talvez tenhamos priorizado os direitos das pessoas honradas sobre os dos criminosos, é só o que fizemos e, a isso, vocês chamam de violar os direitos humanos.\"\nEm fevereiro de 2024, Nayib Bukele foi reeleito presidente de El Salvador com mais de 80% dos votos. Ele destacou os resultados obtidos pelo seu governo no quesito segurança.\nGetty Images via BBC\nO porquê da atração para a direita radical\nA atração pela política de \"pulso firme\" de Bukele para setores da direita radical na América Latina e em outras partes do mundo se deve a diversos fatores.\nDe um lado, ela oferece uma resposta rápida e visível a uma das principais preocupações dos eleitores: a insegurança, no caso da América Latina, aliada à imigração irregular, nos Estados Unidos e na Europa.\nAs imagens de milhares de presos em megaprisões, além da drástica redução dos homicídios em El Salvador, projetam a ideia de que a estratégia foi eficaz. De fato, o país deixou de ser um dos mais violentos do mundo e passou a figurar entre os mais seguros do continente, reforçando esta percepção.\nMas a política salvadorenha trouxe altos custos.\nDa Colômbia até a França, o modelo de segurança de Nayib Bukele ganhou espaço no debate político. Mas organizações de direitos humanos alertam sobre os riscos de reproduzir as políticas do presidente salvadorenho\nGetty Images via BBC\nSegundo a organização salvadorenha Cristosal, o regime de exceção vigente desde março de 2022 normalizou a detenção em massa de pessoas com limitado controle judicial, deixando milhares de detidos sem provas suficientes contra eles.\nPor outro lado, a Human Rights Watch documentou casos de tortura, maus tratos, detenções arbitrárias e desaparecimentos forçados.\nA organização também denunciou a debilitação das instituições democráticas e a falta de garantias judiciais no governo de Nayib Bukele.\nEspecialistas das Nações Unidas alertaram que a detenção prolongada, sem acesso à assistência legal, nem revisão judicial, pode constituir grave violação do direito internacional.\nEm relatório conjunto com a Cristosal sobre o sistema penitenciário salvadorenho, a Human Rights Watch concluiu que \"os casos de tortura e maus tratos no Cecot não foram incidentes isolados, mas sim violações sistemáticas, repetidas ao longo de toda a detenção\".\nMas a atração do chamado \"modelo Bukele\" não reside apenas na sua estratégia de segurança, mas também nas suas dimensões políticas, segundo analistas.\nMuitos líderes observam os altos níveis de popularidade do presidente salvadorenho como um sinal de que este tipo de política e retórica de \"pulso firme\" podem gerar apoio eleitoral.\n\"Quando são realizados estudos sobre cultura política na América Latina, as pessoas costumam inicialmente expressar apoio à democracia\", explica Wolf. \"Mas, quando surgem perguntas mais específicas, o que se observa é que muitos preferem líderes que resolvam seus problemas.\"\n\"As pessoas, na prática, não são tão democráticas quanto podemos imaginar.\"\nPara os políticos, este modelo baseado em forte liderança e poucos contrapesos institucionais acaba sendo especialmente atraente.\nFamiliares de presos em El Salvador exigem 'provas de vida' do governo de Nayib Bukele e organizações de direitos humanos denunciam que centenas de pessoas inocentes continuam presas, mesmo com ordens de libertação\nGetty Images via BBC\nEm outros países\nMas diversos analistas alertam que esta atração pode ser enganosa.\nO modelo dificilmente pode ser exportado e depende, em grande parte, de condições específicas de El Salvador, além de decisões políticas que nem sempre seriam viáveis ou legais em outros países.\nO Equador é um dos países que tentaram aplicar esta técnica.\nDesde 2023, quando tomou posse o atual presidente Daniel Noboa, o país tentou reproduzir elementos do modelo salvadorenho, declarando um \"conflito armado interno\".\nA medida foi acompanhada pela militarização da segurança, detenções em massa e pelo anúncio de novas prisões de segurança máxima.\nO presidente do Equador, Daniel Noboa, em um discurso durante a colocação da pedra fundamental de uma prisão de segurança máxima para 800 detentos em Santa Elena, no litoral do país, no dia 21 de junho de 2024\nGetty Images via BBC\nMas as medidas não produziram os resultados esperados. Os níveis de violência permaneceram elevados no país.\nO índice de homicídios no Equador passou de cerca de 8 a cada 100 mil habitantes, em 2020, para cerca de 45 em 2023. E, em 2025, atingiu 51 a cada 100 mil pessoas, no ano mais violento da história recente do país, segundo dados do Instituto Nacional de Estatística e Censos (Inec), do Escritório das Nações Unidas sobre Drogas e Crime e estimativas do portal especializado InSight Crime.\nO governo da ex-presidente Xiomara Castro (2022-2026), em Honduras, também adotou medidas de \"pulso firme\", inspiradas em El Salvador. Elas incluíram estados de exceção e militarização da segurança.\nMas não se registrou redução sustentada da violência, como ocorreu no país vizinho.\nHonduras continua sendo um dos países mais violentos da região, com índice de homicídios de cerca de 23 a cada 100 mil habitantes em 2025, segundo o balanço anual de segurança do portal InSight Crime.\nEstes números levaram diversos especialistas a questionar a eficácia deste enfoque.\n\"Existe um motivo por que o modelo de segurança de Bukele não deu resultados nos países que tentaram reproduzi-lo parcialmente, como Honduras e o Equador\", declarou à BBC a diretora para as Américas da Human Rights Watch, Juanita Goebertus.\n\"O chamado 'modelo Bukele' não se baseia apenas nas prisões em massa. Ele também traz concentração de poder, debilitação da supervisão judicial, dezenas de milhares de pessoas detidas sem processo devido e até acordos secretos com gangues\", prossegue ela.\n\"Esta não é uma estratégia sustentável de segurança pública. Os homicídios diminuíram em El Salvador, mas às custas da debilitação das instituições necessárias para garantir a segurança duradoura.\"\nLEIA TAMBÉM: \nCidadania dos EUA e 'anti-establishment': quem é Abelardo de la Espriella, presidente eleito em apuração preliminar na Colômbia\nO controverso método com que Bukele pacificou El Salvador e o que promete se for reeleito\nO julgamento coletivo em El Salvador que reúne centenas de acusados de integrar a gangue MS-13", "url": "https://g1.globo.com/mundo/noticia/2026/06/28/como-as-megaprisoes-de-bukele-se-transformaram-em-modelo-para-a-direita-radical.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-28T10:40:07+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/dPzawO36iq46GcuHda1YouzbNHs=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/B/P/ytD4X6Si6p9v00cqy9QA/855b89e0-6c23-11f1-8b36-a5a4761bc43e.jpg", "url_hash": "4e782c2779111076ff65b3c02d54aae4", "title_hash": "92b9c71e5f24a067c8e85811642b4770", "corroboration": 2, "relevance_score": 0.1357, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.5228, "headline_en": "Bukele's Mega-Prisons Become a Blueprint for the Far Right", "headline_pt": "Megaprisões de Bukele viram modelo para a direita radical", "one_liner_en": "Duplicate of index 0 — same story republished on G1.", "one_liner_pt": "Duplicata do índice 0 — mesma matéria republicada no G1.", "category": "Geopolitics", "region": "world", "rationale": "Near-identical duplicate of article 0, republished on a different outlet.", "low_signal": true}, {"title": "O Irã é a seleção mais azarada da Copa do Mundo?", "summary": "<img src=\"https://s2-g1.glbimg.com/xQWvZx5ydpOnRKtoCAltZLRq50A=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/q/q/mFnQCRRz25tpJbMm8KKg/ab599e60-72aa-11f1-8546-8f19e4fe30f4.jpg.webp\" /><br />     Grupo G da Copa: Egito e Irã ficam no empate; Bélgica goleia e elimina a Nova Zelândia\nTristeza é algo esperado em uma Copa do Mundo.\nPor trás de cada momento de glória, há uma história de azar — uma nação lamentando sua sorte e injustiças que levaram à sua queda.\nAinda assim, poucas situações se comparam à crueldade que o Irã enfrentou nesta Copa.\n✅ Siga o canal de notícias internacionais do g1 no WhatsApp\nEnfrentando desafios sem precedentes antes mesmo de a bola rolar, a equipe dirigida pelo técnico Amir Ghalenoei esteve muito perto da vaga no mata-mata — apenas para vê-la escapar no último momento... não uma, mas duas vezes.\nApesar de invicto na fase de grupos, o Irã perdeu a vaga na fase eliminatória por causa do saldo de gols.\nMas a história da sua eliminação foi ainda muito pior...\nGol salvador do Irã nos acréscimos é anulado\nApós empates contra Nova Zelândia e Bélgica, o Irã sabia que uma vitória sobre o Egito, em Seattle, garantiria a classificação para o mata-mata.\nO Irã começou perdendo logo cedo, mas reagiu bem. E embora o atacante Mehdi Taremi tenha perdido um pênalti, Ramin Rezaeian empatou o jogo com um chute preciso, quase sem ângulo.\nA partida seguiu empatada até os acréscimos do segundo tempo, quando o iraniano Shoja Khalilzadeh marcou um gol após uma confusão na área.\nO gol foi muito comemorado, com Khalilzadeh tirando a camisa — pelo que recebeu cartão amarelo — e posando para uma foto com óculos escuros.\n⚽ No entanto, a alegria logo virou angústia quando o gol foi anulado por impedimento. O impedimento foi no limite — com a ponta do pé de Khalilzadeh ligeiramente à frente do penúltimo defensor do Egito.\nA partida terminou 1 a 1, o que significava que o Irã teria de esperar pelo desfecho de outros jogos para descobrir se avançaria, pela primeira vez, à fase mata-mata da Copa do Mundo.\nO Irã perdeu a vaga no mata-mata da Copa do Mundo para o Senegal pelo saldo de gols.\nGETTY IMAGES via BBC\nGol aos 51 minutos do 2º tempo elimina o Irã\nO Irã teve de esperar até os jogos finais da fase de grupos para descobrir seu destino.\nArgélia contra Áustria era o confronto decisivo — e uma vitória de qualquer uma das equipes favoreceria o Irã.\nUm jogo emocionante parecia destinado a terminar 2 a 2, eliminando o Irã, até que Riyad Mahrez arrancou em direção ao gol e colocou a Argélia na frente aos 48 minutos do segundo tempo.\nCom apenas alguns instantes restantes, o Irã estava novamente muito perto da vaga.\nMas o drama não terminou ali. Em um último ataque, a Áustria conseguiu empatar com um cabeceio de Sasa Kalajdzic, a poucos segundos do fim.\nPela segunda vez em 24 horas, a alegria do Irã foi tirada no último momento.\nO saldo de gols superior do Senegal garantiu aos africanos a última vaga entre os terceiros colocados. Já o Cabo Verde, que assim como o Irã havia empatado os três jogos da fase de grupos, avançou em segundo lugar no Grupo H.\n'O país anfitrião nos tratou de forma muito injusta'\nO fato de o Irã ter chegado tão perto da classificação já é notável por si só, considerando os obstáculos únicos que teve de superar.\nO Irã disputou a Copa do Mundo em meio ao contexto do conflito do país com os EUA e Israel.\nA base de treinamento da seleção para a Copa foi transferida do Arizona para Tijuana, no México, antes do início do torneio, e a equipe enfrentou restrições de viagem durante toda a competição.\nO Irã só foi autorizado a entrar nos EUA no dia anterior aos seus dois primeiros jogos e teve de sair novamente no mesmo dia da partida, nos termos de seus vistos.\nPosteriormente, Ghalenoei descreveu sua equipe como a \"mais oprimida\" do torneio.\nEle disse que o elenco foi \"privado\" de tempo de preparação e teve \"menos da metade\" da janela de treinos necessária, enquanto outras equipes desfrutaram de condições normais.\nEssas restrições de viagem foram flexibilizadas para o jogo em Seattle, permitindo que a equipe chegasse dois dias antes, mas teve de retornar a Tijuana após a partida.\nApós o jogo, Ghalenoei voltou a expressar sua frustração: \"Aos meus jogadores e à equipe, quero dizer que estou orgulhoso deles\".\n\"O que estes jovens, estes jogadores fizeram deveria ser registrado na história, porque o país anfitrião nos tratou de forma muito injusta.\"\n\"Apesar de todos esses problemas, conseguimos ter um bom desempenho e o mundo está orgulhoso dos iranianos e da nossa equipe.\"\n\"Apelo à Fifa: não deixem que anfitriões tratem jogadores e equipes da mesma forma nas próximas Copas do Mundo.\"", "url": "https://g1.globo.com/mundo/noticia/2026/06/28/o-ira-e-a-selecao-mais-azarada-da-copa-do-mundo.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-28T11:34:18+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/xQWvZx5ydpOnRKtoCAltZLRq50A=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/q/q/mFnQCRRz25tpJbMm8KKg/ab599e60-72aa-11f1-8546-8f19e4fe30f4.jpg.webp", "url_hash": "08aaa9e4c8d02010cc2d568e6bc300a1", "title_hash": "f73c219093f87fa2e7aa1ef25b559710", "corroboration": 2, "relevance_score": 0.0533, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4817, "headline_en": "Iran and Egypt Draw; Belgium Rout New Zealand at World Cup", "headline_pt": "Irã e Egito empatam; Bélgica goleia Nova Zelândia na Copa", "one_liner_en": "Belgium's big win eliminates New Zealand, while Iran and Egypt share the points in a tense Group G clash.", "one_liner_pt": "A Bélgica elimina a Nova Zelândia com goleada, enquanto Irã e Egito empatam em confronto tenso do Grupo G.", "category": "Culture", "region": "world", "rationale": "Live World Cup group-stage results are high-interest, time-sensitive news f 1.glbimg.com/0DF8JvbZYk2dFXopn_3FZQ5R65w=/1280x0/filters:format(jpeg)/https://thumbor.globoi.com/unsafe/fit-in/1280x720/s04.video.glbimg.com/deo/vi/55/20/992055", "url_hash": "62f1efe408111d481d4d3ce4f121669c", "title_hash": "b07807b1ffe0dd3270404972d77c5bea", "corroboration": 1, "relevance_score": 0.2176, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3638, "headline_en": "Body Found on Rio's Niemeyer Avenue Cliffside During Search for Missing Surfer", "headline_pt": "Corpo é encontrado no costão da Av. Niemeyer durante buscas por professor de surfe desaparecido", "one_liner_en": "Firefighters found an unidentified body on Rio's Niemeyer Avenue cliffs on the fifth day of searching for missing surf teacher Bocão.", "one_liner_pt": "Bombeiros encontraram um corpo não identificado no costão da Av. Niemeyer no quinto dia de buscas pelo professor de surfe Bocão.", "category": "Other", "region": "brazil", "rationale": "An ongoing missing-person case in Rio gaining national attention reaches a grim development.", "low_signal": false}, {"title": "Resultado da Mega-Sena 3024 hoje (27/06): Veja os números sorteados", "summary": "A Caixa Econômica Federal realiza neste sábado (27) o aguardado sorteio do concurso 3024 da Mega-Sena. O prêmio principal está [&hellip;]", "url": "https://www.tribunapr.com.br/noticias/brasil/resultado-da-mega-sena-3024-hoje-27-06-veja-os-numeros-sorteados/", "source_domain": "tribunapr.com.br", "published_at": "2026-06-27T19:31:00+00:00", "origin": "feed", "image_url": "https://www.tribunapr.com.br/wp-content/uploads/2026/05/09141323/mega-sena-resultado.png", "url_hash": "b7b7a9e563b16b27fb79048880800006", "title_hash": "4dbeae938af377b260219152ee611699", "corroboration": 1, "relevance_score": 0.2153, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3627, "headline_en": "Mega-Sena Draw 3024: See the Winning Numbers", "headline_pt": "Resultado da Mega-Sena 3024: veja os números sorteados", "one_liner_en": "Caixa Econômica Federal held the Mega-Sena 3024 lottery draw on Saturday.", "one_liner_pt": "A Caixa Econômica Federal realizou o sorteio da Mega-Sena 3024 neste sábado.", "category": "Other", "region": "curitiba", "rationale": "Routine lottery results; high search volume but low editorial news value.", "low_signal": true}, {"title": "O Rio que viu o Penta: como a cidade mudou em 24 anos, entre 2002 e 2026", "summary": "<img src=\"https://s2-g1.glbimg.com/a6mjERqlfAGeTzJf1Fq4EPn2L_I=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/L/A/zIiZxsRoqR71EAOANW9g/26peri.jpeg\" /><br />     O Rio que viu o Penta: como a cidade mudou em 24 anos, entre 2002 e 2026\nQuando o Brasil conquistou o Pentacampeonato na Copa do Mundo, em junho de 2002, o Rio de Janeiro ainda tinha a Perimetral cortando a Região Portuária, não contava com VLT, Parque Madureira ou Museu do Amanhã e nem sonhava em ser sede de uma Olimpíada. O g1 também não existia.\nPassados 24 anos — incluindo uma final de Copa do Mundo em um remodelado Maracanã e uma edição dos Jogos Olímpicos e Paralímpicos —, o Rio ganhou equipamentos urbanos, expandiu a rede de transportes e viu crescer a população e a ocupação de áreas da Zona Oeste.\nA Seleção joga nesta segunda (29) contra o Japão pelas 16 avos de final e, se perder, volta para casa — e o Brasil terá de esperar mais 4 anos (em um total de 28) para tentar ser campeão novamente.\n🟩O g1 Rio está no GloboPop, o novo aplicativo de vídeos curtos verticais da Globo, disponível gratuitamente no seu celular. Lá no app, você pode seguir o palco do g1 Rio para não perder nenhum detalhe. Baixe o GloboPop. \nPraça Mauá com o Elevado da Perimetral\nReprodução/TV Globo\nAssim era o Rio em 2002:\nPresidente: Fernando Henrique Cardoso\nGovernador: Anthony Garotinho\nPrefeito: Cesar Maia\nCampeão carioca: Fluminense\nCampeã do carnaval: Estação Primeira de Mangueira\nCampeão brasileiro: Santos (o Botafogo foi rebaixado pela 1ª vez)\nConectada, mas desigual\nAo longo das últimas décadas, o Rio passou por mudanças em sua estrutura urbana. A expansão do metrô, a implantação dos corredores de BRT, a chegada do VLT e a revitalização da Região Portuária alteraram a dinâmica da cidade.\nEm 2002, a rede metroviária era significativamente menor. A Linha 1 terminava na Estação Cardeal Arcoverde, em Copacabana. Cantagalo e General Osório não existiam, e a ligação com a Barra da Tijuca só seria inaugurada anos depois.\nPara o urbanista Henrique Silveira, no entanto, os benefícios não foram distribuídos igualmente. Na avaliação dele, a expansão do metrô mais ajudou áreas que já contavam com infraestrutura.\n“Acho que beneficiou os bairros mais favorecidos da cidade, que ganharam um transporte público de fácil utilização, eficiente.”\nO especialista destaca que o Rio de Janeiro ainda enfrenta desafios significativos relacionados à mobilidade urbana. Segundo ele, a expansão da cidade contribui para agravar esse cenário, já que o aumento das distâncias percorridas pelos moradores torna os deslocamentos mais longos e complexos.\nO metrô no Rio dos anos 2000.\nAcervo TV Globo\nMaracanã tinha geral\nOs megaeventos também transformaram símbolos históricos da cidade. O Maracanã, um dos principais cartões-postais do Rio, passou por mudanças profundas ao longo desse período. Em 2002, o estádio ainda preservava características históricas, como a Geral, setor popular onde os torcedores assistiam às partidas em pé e pagavam ingressos mais baratos. \nAs sucessivas reformas realizadas para os Jogos Pan-Americanos de 2007, a Copa do Mundo de 2014 e os Jogos Olímpicos de 2016 modernizaram a estrutura, reduziram a capacidade de público e extinguiram espaços tradicionais.\nO ge fez um especial sobre todas as versões do Maracanã, que completou 70 anos no último dia 16.\nMaracanã em 2002 ainda tinha a geral\nReprodução/TV Globo\nCentro transformado e novos espaços públicos\nMuitas das estruturas que hoje fazem parte da paisagem cotidiana da cidade sequer existiam em 2002. \nO Rio ainda estava longe de se tornar sede dos Jogos Olímpicos e não contava com equipamentos como o Parque Olímpico, o VLT, o Museu do Amanhã, o Boulevard Olímpico e o Porto Maravilha.\nOs corredores do BRT Transoeste, Transcarioca e Transolímpica também não faziam parte da rede de mobilidade urbana. Grande parte da infraestrutura que atualmente parece consolidada para os moradores surgiu apenas nos anos seguintes, impulsionada principalmente pelos investimentos ligados aos megaeventos esportivos.\nMas ainda havia o Autódromo de Jacarepaguá, demolido em 2012 para dar lugar às arenas de 2016. O carioca também se divertia no Terra Encantada, no Rio Water Planet e no Wet n’ Wild — que não existem mais.\nMuseu do Amanhã\nReprodução\nUma das mudanças mais marcantes ocorreu na região central. A derrubada da Perimetral abriu espaço para equipamentos culturais e para a reocupação da Praça Mauá.\nO elevado cortava toda a frente marítima e separava a cidade da área portuária. A Praça Mauá ainda era marcada pela degradação urbana e funcionava, na prática, como uma área de passagem de veículos. Não existiam os museus que hoje atraem turistas e moradores, nem o VLT que conecta diferentes pontos do Centro. A região portuária vivia um período de esvaziamento econômico e pouca circulação de pessoas.\nPara Rafael Nunes, essa transformação seria um dos elementos que mais surpreenderiam alguém transportado de 2002 para 2026.\n“Tem muitas coisas na região central que deixariam chocado, mas de fato, uma das coisas que eu acho que seriam mais contundentes é você ver que você não tem mais a barreira física da Perimetral. A demolição do elevado gerou a possibilidade de uma série de ressignificações de espaço. Inclusive a própria Praça Mauá, que para mim hoje é um símbolo dessa reapropriação, dessa reconfiguração do centro histórico do Rio de Janeiro.”\nZona Portuária antes da implosão do Elevado da Perimetral\nAcervo TV Globo\nO cenário começou a mudar a partir de 2013, com a demolição da Perimetral e as intervenções do projeto Porto Maravilha. O espaço onde atualmente milhares de visitantes registram fotos diante do Museu do Amanhã era ocupado por um elevado que dominava a paisagem da orla central.\nAlém do Centro, bairros como Madureira passaram por transformações significativas. O historiador destaca o Parque Madureira como um exemplo dessa restauração urbana na Zona Norte. Inaugurado em 2012, o espaço transformou uma área antes ocupada por linhas de transmissão de energia em um dos maiores parques públicos da cidade, criando novas áreas de lazer, esporte e convivência para moradores de diferentes regiões da Zona Norte.\nParque Madureira\nDivulgação\nCultura carioca resiste ao tempo\nPara Rafael Nunes, uma das características que permanecem marcantes é a cultura de rua, considerada por ele um elemento essencial da identidade carioca. O historiador avalia que esse modo de ocupar os espaços públicos e de vivenciar a cidade continua sendo uma das principais marcas do jeito carioca de viver. \nAo ser questionado sobre o que mais surpreenderia uma pessoa transportada de 2002 para 2026, ele respondeu: “Uma das coisas fundamentais que a gente veria e falaria: ‘Olha, estamos no Rio de Janeiro, essa informalidade do carioca, que te abraça e que te convida para tomar uma cerveja, para sentar na mesa, para ouvir um samba, para rezar e acreditar num Rio melhor daqui para frente’.”\nEle ainda afirma que a identidade carioca da época estava ligada à vida nas ruas, aos encontros e à cultura popular.\n“Eu acho que o Rio dos anos 2000 era o Rio do funk, era o Rio da dessa malandragem, dessa malevolência, que batia no corpo, mas que batia na expressão da festa, do encontro, da cultura carioca.”\nBAILE FUNK - festas ao som de funk atrai centenas de pessoas nas mais diversas comunidades cariocas. Explosão do gênero aconteceu nos anos 90 por causa das festas produzidas pela Furacão 2000, uma das maiores organizadoras de baile funk do país\nFuracão 2000 / Divulgação\nEssa autenticidade também se manifestava na trilha sonora da cidade. Em 2002, sucessos do Bonde do Tigrão, dos bailes da Furacão 2000 e do pagode romântico dominavam rádios, festas e encontros espalhados pelos bairros cariocas. \nEspaços culturais que hoje são referências, como a Fundição Progresso e o Circo Voador, começavam a recuperar protagonismo e a atrair novos públicos. Duas décadas depois, apesar das transformações urbanas e tecnológicas, a cultura popular segue ocupando as ruas e ajudando a definir a identidade da cidade.\nDesafios que permanecem\nNem todas as mudanças, porém, foram capazes de resolver problemas históricos da capital fluminense. Para Henrique Silveira, uma das transformações mais perceptíveis ao longo das últimas décadas foi o aumento do custo de vida.\nNa avaliação dele, morar no Rio de Janeiro se tornou mais caro ao longo dos últimos anos, um cenário que acaba impactando negativamente a maior parte da população.\nNa área da segurança pública, o Rio também passou por mudanças importantes. Em 2002, o debate era dominado principalmente pela atuação das facções ligadas ao tráfico de drogas, como Comando Vermelho, Amigos dos Amigos (ADA) e Terceiro Comando, frequentemente presentes no noticiário policial.\nAs Unidades de Polícia Pacificadora (UPPs) ainda não haviam sido criadas, e as milícias, que hoje são tema central em discussões sobre segurança no estado, não tinham ganhado território.\nEntre permanências e transformações, o Rio já não é a cidade da Geral do Maracanã, da Perimetral sobre a Praça Mauá ou do metrô restrito à Zona Sul. Mas continua sendo a cidade onde o samba ocupa as ruas, onde multidões se reúnem para celebrar e onde desafios históricos convivem com sucessivas transformações.", "url": "https://g1.globo.com/rj/rio-de-janeiro/noticia/2026/06/28/o-rio-que-viu-o-penta-como-a-cidade-mudou-em-24-anos-entre-2002-e-2026.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-28T09:00:48  haverá interdição do fluxo de veículos, uma vez que a programação ocorre concentrada no Largo de São Pedro e nas áreas internas da Madre Deus, permitindo a manutenção da circulação normal na via principal.\nSecretaria Municipal de Trânsito e Transportes (SMTT) divulga esquema especial de trânsito para o festejo de São Pedro em São Luís\nDivulgação/Prefeitura de São Luís\nSão Marçal\nJá para o Encontro de Bois do festejo de São Marçal, realizado na terça-feira (30), no bairro João Paulo, o esquema de interdições será ampliado devido à grande quantidade de público esperada.\nAs interdições terão início às 22h do dia 29 de junho e seguirão até as 6h da manhã do dia 1º de julho (veja o mapa mais abaixo).\nA principal mudança acontecerá na extensão da Avenida João Pessoa, também conhecida como Avenida São Marçal, abrangendo o trecho entre a rotatória próxima ao 24º Batalhão de Infantaria do Exército Brasileiro até a Praça da Delegacia do João Paulo, ponto central das apresentações culturais.\nHaverá bloqueios e desvios em vias estratégicas, incluindo o trecho a partir da região do Curso Wellington, no bairro Monte Castelo, seguindo em direção à Alemanha até a área da Feira do João Paulo.\nTambém haverá interdição na Avenida Kennedy, próximo ao Hospital Guarás, impedindo o acesso em direção ao bairro do João Paulo.\nAinda segundo a SMTT, todas as ruas internas do bairro João Paulo, nos sentidos Coroado e Alemanha, que dão acesso à avenida principal, também serão interditadas durante o festejo.\nSecretaria Municipal de Trânsito e Transportes (SMTT) divulga esquema especial de trânsito para o festejo de São Marçal em São Luís\nDivulgação/Prefeitura de São Luís\nAgora no g1", "url": "https://g1.globo.com/ma/maranhao/saojoao/noticia/2026/06/28/transito-tera-esquema-especial-e-pontos-de-interdicao-para-os-festejos-de-sao-pedro-e-sao-marcal-em-sao-luis.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-06-28T10:36:36+00:00", "origin": "feed", "image_url": "https://     just_now:           'agora mesmo',
    ago_m:              'min atrás',
    ago_h:              'h atrás',
    ago_d:              'd atrás',
    generated:          'Gerado em',
    made_by:            'Feito por ricardobertolin',
  }
};
let lang = 'en';
function t(key) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS['en'][key] || key; }

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

// ── State ────────────────────────────────────────────────────────────
const TABS = [
  { id: 'world',    lk: 'tab_world',    bk: 'blurb_world' },
  { id: 'brazil',   lk: 'tab_brazil',   bk: 'blurb_brazil' },
  { id: 'curitiba', lk: 'tab_curitiba', bk: 'blurb_curitiba' }
];
let activeTab = 'world';
let minRel = 0, minCorr = 1, hideLow = true;

// ── Language switch ───────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.getElementById('j-lang-en').classList.toggle('active', l === 'en');
  document.getElementById('j-lang-pt').classList.toggle('active', l === 'pt');
  updateStaticLabels();
  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();
}

function updateStaticLabels() {
  document.getElementById('j-digital-daily').textContent    = t('digital_daily');
  document.getElementById('j-price-free').textContent       = t('price_free');
  document.getElementById('j-fx-kicker').textContent        = t('the_weather');
  document.getElementById('j-fx-strapline').textContent     = t('curitiba_region');
  document.getElementById('j-flt-rel-lbl').textContent      = t('min_relevance');
  document.getElementById('j-flt-corr-lbl').textContent     = t('min_corroboration');
  document.getElementById('j-flt-low-lbl').textContent      = t('hide_low_signal');
  document.getElementById('j-briefing-label').textContent   = t('todays_briefing');
  document.getElementById('j-end-edition').textContent      = t('end_of_edition');
  document.getElementById('j-made-by').textContent          = t('made_by');
}

// ── Masthead ─────────────────────────────────────────────────────────
function renderMasthead() {
  const iso = DATA.date || new Date().toISOString().slice(0,10);
  const year = new Date(iso + 'T12:00:00').getFullYear();
  const vol  = toRoman(year - 1900);
  const doy  = dayOfYear(iso);
  document.getElementById('j-vol').textContent  = 'Vol. ' + vol + ' · No. ' + doy;
  document.getElementById('j-date').textContent = fmtDate(iso);
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

// ── Briefing ─────────────────────────────────────────────────────────
function renderBriefing() {
  const intro = (lang === 'pt' ? DATA.intro_pt : DATA.intro_en) || DATA.intro || '';
  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

// ── Articles ─────────────────────────────────────────────────────────
function renderArticles() {
  let html = '';
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round((art.relevance_score || 0) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
