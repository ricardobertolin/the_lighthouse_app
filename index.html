<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}
/* Reading-history export — feeds `python -m digest --ingest-clicks` */
.reading-log{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:16px;
}
.reading-log button{
  font:inherit;letter-spacing:1px;text-transform:uppercase;
  background:none;border:1px solid var(--m3);color:var(--m3);
  padding:3px 9px;margin-left:8px;cursor:pointer;
}
.reading-log button:hover{ background:var(--ink);color:var(--paper);border-color:var(--ink); }
.reading-log[hidden]{ display:none; }

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

<svg aria-hidden="true" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;">

    <feComposite in="c" in2="n" operator="arithmetic" k1="0" k2="1" k3="1" k4="-0.5" result="s"/>

    </feComponentTransfer>
  </filter>
</svg>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>
    <span id="j-digital-daily">Digital Daily</span>
    <div class="lang-toggle">
      <button id="j-lang-en" class="lang-btn active" onclick="setLang('en')">EN</button>
      <button id="j-lang-pt" class="lang-btn" onclick="setLang('pt')">PT</button>

  <div id="j-list"></div>

</div><!-- .desk -->

 media in advertising.", "low_signal": false}, {"title": "‘Chegou a hora da mudança de verdade’, diz Flávio Bolsonaro após votar na Zona Norte do Rio", "summary": "<img src=\"https://s2-g1.glbimg.com/XtA_0wuT_22_MvBykvRnHu2i00o=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/0/p/o4MJ6PQreXPAfCyVAzcw/flavio-e-fernanda-bolsonaro-foto-mauro-pimentel-afp.jpg\" /><br />     Flávio Bolsonaro vota no RJ no 2º turno das eleições\nO candidato à Presidência da República Flávio Bolsonaro (PL) votou no início da manhã deste domingo (25) no Rio de Janeiro. \nAssim como no 1º turno, ele chegou pouco depois da abertura dos portões da Escola Municipal Barão Homem de Mello, em Vila Isabel, na Zona Norte. Flávio votou na seção 170 por volta das 8h20.\nFlávio estava acompanhado da mulher, Fernanda, e do governador eleito do RJ, Douglas Ruas (PL). Na saída, o senador fez um rápido pronunciamento.\n“Eu acho que chegou a hora da mudança de verdade. Foi assim no 1º turno, que seja no 2º. O Brasil não aguenta mais 4 anos do jeito que está”, declarou.\n🔴 AO VIVO: Acompanhe a votação e a apuração em todo o Brasil\n“A vida de todo mundo piorou. Então não tem por que continuar insistindo no erro. A esperança virou medo — medo de andar na rua de noite, medo de ter o celular roubado, medo de ter a moto roubada, medo da geladeira vazia, medo de não conseguir pagar as contas que estão atrasadas”, afirmou.\n“Eu vim com propostas, mostrando que a gente tem toda a condição de montar um grande time para reorganizar o Brasil, tirar o Brasil dessa dívida e tirar você, brasileiro, que está em dívida também dessa situação de sufoco que você está vivendo”, prosseguiu.\n“Estou muito feliz com a campanha neste 2º turno. Levamos alegrias às ruas, [foi] uma campanha leve, uma campanha limpa, felicidade no rosto de quem estava com a gente nas ruas aqui no Rio de Janeiro, com o Douglas [Ruas]”, disse.\nFlávio também pediu que os eleitores não faltem. “Faça chuva ou faça sol, bora sair de casa para votar, que o Brasil vai mudar e vai vencer.”\n✅Clique aqui para seguir o canal do g1 RJ no WhatsApp \nO candidato do PL à Presidência, Flávio Bolsonaro, posa para foto ao lado da esposa, Fernanda Bolsonaro, depois de votar na Escola Municipal Barão Homem de Mello, em Vila Isabel, na Zona Norte do Rio, no dia 25 de outubro de 2026\nMauro Pimentel/AFP\nHistórico político\nFlávio Bolsonaro, que terminou à frente no 1º turno, é o representante do bolsonarismo na disputa presidencial de 2026. Aos 45 anos, o senador pelo Rio de Janeiro é o filho mais velho do ex-presidente Jair Bolsonaro (PL) e foi escolhido como candidato do partido no fim de 2025, após disputas internas.\nDurante a campanha, Flávio buscou se apresentar como herdeiro político do pai. Ele disputa o 2º turno com o atual presidente, Luiz Inácio Lula da Silva (PT).\nFormado em Direito, Flávio iniciou a carreira política aos 21 anos e exerceu 4 mandatos como deputado estadual. Em 2016, concorreu à Prefeitura do Rio, mas não foi eleito. \nDois anos depois, recebeu mais de 4 milhões de votos e foi o candidato ao Senado mais votado no RJ. Atualmente, está no fim do mandato de senador.\nLEIA TAMBÉM: Flávio Bolsonaro: trajetória do filho de Bolsonaro, candidato à Presidência e investigado pela PF\nO candidato do PL à Presidência, Flávio Bolsonaro, dá entrevista coletiva acompanhado da esposa, Fernanda Bolsonaro, e do governador eleito do Rio de Janeiro, Douglas Ruas (PL), no dia 25 de outubro de 2026\nPilar Olivares/Reuters\nFlávio Bolsonaro (PL) vota no RJ\nReprodução/TV Globo\nFlavio Bolsonaro (PL) vota no RJ\nReprodução / TV Globo\nFlavio Bolsonaro (PL) vota no RJ\nReprodução/TV Globo", "url": "https://g1.globo.com/rj/rio-de-janeiro/eleicoes/2026/noticia/2026/10/25/flavio-bolsonaro-vota-na-zona-norte-do-rio.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-10-25T11:19:46+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/XtA_0wuT_22_MvBykvRnHu2i00o=/i.s3.glbimg.com vj-mediumSquareAt3X.jpg", "url_hash": "df2ed31f20563415a2a34a89f1e3700d", "title_hash": "11ae822781b4a5e271b3010340c10960", "corroboration": 1, "relevance_score": 2.8134, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.5632, "headline_en": "Iranians brace as US and Israel plan renewed strikes", "headline_pt": "Iranianos temem novos ataques planejados por EUA e Israel", "one_liner_en": "War-weary residents face dread as Washington and Israel reportedly prepare fresh military action against Iran.", "one_liner_pt": "Moradores exaustos pela guerra vivem apreensão enquanto Washington e Israel preparariam nova ação militar contra o Irã.", "category": "Geopolitics", "region": "world", "rationale": "Renewed strikes could reignite a broader Middle East conflict with global oil implications.", "low_signal": false}, {"title": "What to Know About Brazil’s Election as Bolsonaro Faces Off With Lula", "summary": "Luiz Inácio Lula da Silva, the leftist incumbent, and Flávio Bolsonaro, the right-wing challenger, face off in a narrow race that could redefine the future of Latin America.", "url": "https://www.nytimes.com/2026/10/25/world/americas/brazil-election-lula-bolsonaro-what-to-know.html", "source_domain": "nytimes.com", "published_at": "2026-10-25T09:01:45+00:00", "origin": "feed", "image_url": "https://static01.nyt.com/images/2026/10/25/multimedia/25int-brazil-election-wtk-kwpv/25int-brazil-election-wtk-kwpv-mediumSquareAt3X.jpg", "url_hash": "0def1e046cd19f9803700310f3e96ee4", "title_hash": "1490ec07e6b7c936f3d08e08c9b1f8bb", "corroboration": 2, "relevance_score": 1.9881, "reputation_score": 0.85, "corroboration_score": 0.3333, "final_score": 0.5621, "headline_en": "What to know about Brazil's election as Bolsonaro faces Lula", "headline_pt": "O que saber sobre a eleição brasileira entre Bolsonaro e Lula", "one_liner_en": "The New York Times frames the narrow Lula–Flávio Bolsonaro runoff as a turning point for Latin America.", "one_liner_pt": "O New York Times apresenta o apertado segundo turno entre Lula e Flávio Bolsonaro como um divisor de águas na América Latina.", "category": "Brazil", "region": "brazil", "rationale": "Shows how global media reads the stakes of Brazil's presidential runoff.", "low_signal": false}, {"title": "Quem não votou no 1º turno pode votar neste domingo no AM; veja orientações", "summary": "<img src=\"https://s2-g1.glbimg.com/Dou4oOuEGleQ9dEWygd5qsQIGes=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/J/D/U7JSE4Ry6mhgCgFJCvBg/design-sem-nome-17-.png\" /><br />     Urna Eletrônica\nTSE\nO Amazonas tem 2.801.182 eleitores aptos a votar nas eleições de 2026. Neste domingo (25), os eleitores voltam às urnas para o segundo turno, que define os próximos presidente da República e governador do estado.\nQuem não compareceu ao primeiro turno, realizado em 4 de outubro, pode votar normalmente neste domingo, desde que esteja com a situação eleitoral regular.\nSegundo o Tribunal Regional Eleitoral do Amazonas (TRE-AM), cerca de 20% dos eleitores faltaram à votação no primeiro turno. O eleitorado do estado cresceu 5,7% em relação às eleições de 2022, percentual acima da média nacional, segundo dados do Tribunal Superior Eleitoral (TSE).\n📲 Participe do canal do g1 AM no WhatsApp\nAssim como no último pleito, as mulheres representam 51% do eleitorado amazonense, enquanto os homens correspondem a 49%. Os municípios com mais eleitores são Manaus, Manacapuru, Itacoatiara, Parintins e Coari. A capital concentra a maior parte dos votantes.\nAgora no g1\nQuem faltou no 1º turno pode votar?\nSim. O eleitor que não compareceu às urnas no primeiro turno pode votar normalmente no segundo, desde que esteja com a situação eleitoral regular.\nQuem faltou à votação de 4 de outubro e não justificou a ausência no dia da eleição deve apresentar a justificativa até 3 de dezembro.\nTrês municípios tiveram mudanças nos locais de votação\nAs alterações para o segundo turno atingem sete seções eleitorais em três municípios do Amazonas: Barreirinha, Tabatinga e Itamarati. Ao todo, 2.619 eleitores são afetados pelas mudanças.\nEm Manaus, não houve alterações entre os dois turnos.\nEm Barreirinha, na 26ª Zona Eleitoral, as seções 12, 13 e 19, que funcionaram na Escola Estadual Antônio Belchior Cabral no primeiro turno, foram transferidas para a Escola Municipal Bias da Trindade. A mudança envolve 1.115 eleitores.\nEm Tabatinga, na 36ª Zona Eleitoral, os eleitores das seções 82 e 109 deverão votar na Escola Municipal Indígena Meparacu. No primeiro turno, as seções funcionaram na Escola Municipal Indígena O’i Tchurune. Ao todo, 794 eleitores são abrangidos pela alteração.\nJá em Itamarati, na 69ª Zona Eleitoral, as seções 14 e 21, que funcionavam no Centro de Convivência do Idoso (CECI), foram transferidas para o Centro de Referência de Assistência Social (CRAS).\nSegundo o TRE-AM, mudanças nos locais de votação ocorrem em situações excepcionais e buscam garantir melhores condições de atendimento aos eleitores.\nComo consultar o local de votação\nA Justiça Eleitoral orienta os eleitores a conferir antecipadamente o endereço, a zona e a seção eleitoral. A consulta pode ser feita pelos seguintes canais:\nAplicativo e-Título: disponível gratuitamente para celulares Android e iOS. Basta acessar o aplicativo e selecionar a opção \"Onde Votar\".\nAutoatendimento Eleitoral: disponível nos sites do Tribunal Superior Eleitoral (TSE) e dos tribunais regionais eleitorais. O eleitor deve acessar a área de consultas e selecionar \"Onde votar\".\nCartórios eleitorais: quem estiver sem acesso à internet pode procurar um cartório eleitoral para consultar os dados atualizados.\nNo Autoatendimento Eleitoral, a consulta pode ser feita com o número do título, CPF ou nome, além dos dados solicitados pelo sistema.\nÔnibus gratuitos em Manaus\nEm Manaus, os ônibus convencionais e complementares serão gratuitos neste domingo, das 4h às 18h. Não será necessário apresentar título de eleitor ou comprovante de votação para utilizar o serviço.\nSegundo o Instituto Municipal de Mobilidade Urbana (IMMU), toda a frota utilizada nos dias úteis estará disponível para atender os passageiros.\nA capital também terá uma operação especial de trânsito das 6h às 23h. Ao todo, 278 agentes serão distribuídos em três turnos e 90 postos de serviço para organizar o fluxo de veículos, orientar motoristas e pedestres e atender ocorrências.\nO planejamento prevê ações em 82 escolas e locais de votação, além do monitoramento de corredores viários da cidade.\nTransporte para pessoas com deficiência\nEleitores com deficiência ou mobilidade reduzida que fizeram o cadastro dentro do prazo também terão transporte gratuito porta a porta para ir aos locais de votação e retornar para casa.\nO serviço será oferecido pelo IMMU em parceria com o TRE-AM, das 6h às 12h, com 11 veículos adaptados do programa TransPorta. Ao todo, 32 pessoas serão atendidas, com direito a acompanhante durante o deslocamento.\nJustiça Eleitoral orienta transporte gratuito no interior\nNo interior do Amazonas, a presidente do TRE-AM, desembargadora Carla Reis, determinou o envio de orientações aos juízes eleitorais para viabilizar o transporte gratuito de eleitores no segundo turno.\nA medida busca facilitar o deslocamento, especialmente em regiões de difícil acesso, onde o transporte pode depender de embarcações e de operações específicas.\nA orientação prevê a possibilidade de utilização de veículos e embarcações próprios ou contratados, incluindo ônibus escolares, desde que sejam respeitadas as regras previstas na legislação eleitoral.\nOs juízes eleitorais também deverão avaliar, em conjunto com lideranças indígenas e tradicionais e gestores públicos locais, medidas para facilitar o transporte de moradores dessas comunidades.\nO acompanhamento e a fiscalização das medidas ficarão sob responsabilidade da Justiça Eleitoral.", "url": "https://g1.globo.com/am/amazonas/eleicoes/2026/noticia/2026/10/25/quem-nao-votou-no-1o-turno-pode-votar-neste-domingo-no-am-veja-orientacoes.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-10-25T10:38:04+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/Dou4oOuEGleQ9dEWygd5qsQIGes=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/J/D/U7JSE4Ry6mhgCgFJCvBg/design-sem-nome-17-.png", "url_hash": "c075bd45eb6ff44577127d8e175b803a", "title_hash": "8629f6303040e55178f2d6df1e60a3c5", "corroboration": 2, "relevance_score": 1.9833, "reputation_score": 0.85, "corroboration_score": 0.3333, "final_score": 0.5617, "headline_en": "First-round no-shows can still vote Sunday in Amazonas", "headline_pt": "Quem não votou no 1º turno pode votar neste domingo no AM", "one_liner_en": "Amazonas has 2.8 million eligible voters; the TSE explains rules for those who skipped the first round.", "one_liner_pt": "O Amazonas tem 2,8 milhões de eleitores aptos; o TSE explica as regras para quem faltou ao primeiro turno.", "category": "Brazil", "region": "brazil", "rationale": "Practical voter guidance on a national election day, though regionally specific.", "low_signal": true}], "generated_at": "2026-10-25T10:02:38.882370"};

function t(key) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS['en'][key] || key; }

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

  img.onerror = null;
  img.src = 'the_lighthouse2.png';

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
// The scene and the headline label come from the *current* observation when we
// have one. The daily weathercode is the most severe condition anywhere in the
// 24h window, so using it alone made a calm drizzly morning render as a
// thunderstorm. The hi/lo/wind stats stay on the daily outlook.
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.current_code != null ? w.current_code
               : (w.wmo_code != null ? w.wmo_code : 3);
  const precip = w.current_code != null ? (w.precip_now_mm || 0)
                                        : (w.precipitation_mm || 0);
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// The page is a static file generated once a day, so the baked forecast goes
// stale within hours. Open-Meteo is keyless and CORS-enabled, so refresh the
// card straight from the browser. On any failure we silently keep the baked
// values.
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=-25.4297&longitude=-49.2711&current=temperature_2m%2Capparent_temperature%2Crelative_humidity_2m%2Cprecipitation%2Cweathercode%2Cwindspeed_10m&daily=weathercode%2Ctemperature_2m_max%2Ctemperature_2m_min%2Cprecipitation_sum%2Cprecipitation_probability_max%2Cwindspeed_10m_max&timezone=America%2FSao_Paulo&forecast_days=1';

function refreshWeather() {
  // --weather previews bake a fixed condition on purpose; don't clobber it.
  if (DATA.live_weather === false) return;
  fetch(WX_URL, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      const daily = d.daily || {};
      const cur   = d.current || {};
      const first = (k) => (daily[k] && daily[k].length ? daily[k][0] : null);
      DATA.weather = Object.assign({}, DATA.weather, {
        temp_max:         first('temperature_2m_max'),
        temp_min:         first('temperature_2m_min'),
        precipitation_mm: first('precipitation_sum'),
        precip_prob:      first('precipitation_probability_max'),
        wind_max_kmh:     first('windspeed_10m_max'),
        wmo_code:         first('weathercode'),
        temp_now:         cur.temperature_2m,
        feels_like:       cur.apparent_temperature,
        humidity:         cur.relative_humidity_2m,
        precip_now_mm:    cur.precipitation,
        wind_now_kmh:     cur.windspeed_10m,
        current_code:     cur.weathercode,
        observed_at:      cur.time,
      });
      renderWeather();
    })
    .catch(() => {});
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
// The page is static (GitHub Pages), so there is nowhere to POST to. Clicks
// accumulate here and are exported as a file that the pipeline imports with
// `python -m digest --ingest-clicks`, which feeds the interest centroid used
// for relevance scoring.
const CLICK_KEY = 'tl_clicks';

function readClicks() {
  try { return JSON.parse(localStorage.getItem(CLICK_KEY) || '[]'); }
  catch(_) { return []; }
}

function trackClick(url, domain) {
  try {
    const clicks = readClicks();
    clicks.push({ url: url, domain: domain, at: new Date().toISOString() });
    if (clicks.length > 2000) clicks.splice(0, clicks.length - 2000);
    localStorage.setItem(CLICK_KEY, JSON.stringify(clicks));
    updateReadingLog();
  } catch(_) {}
}

function updateReadingLog() {
  const clicks = readClicks();
  const box = document.getElementById('j-reading-log');
  if (!box) return;
  box.hidden = clicks.length === 0;
  const label = document.getElementById('j-reading-count');
  if (label) label.textContent = clicks.length + ' ' + t('readingLog');
}

function exportClicks() {
  const clicks = readClicks();
  if (!clicks.length) return;
  const blob = new Blob([JSON.stringify(clicks, null, 2)], { type: 'application/json' });
  const stamp = new Date().toISOString().slice(0, 10);
  _dlBlob(blob, 'lighthouse-clicks-' + stamp + '.json');
  _flashBtn(document.getElementById('j-export-clicks'));
}

function clearClicks() {
  if (!confirm(t('clearConfirm'))) return;
  try { localStorage.removeItem(CLICK_KEY); } catch(_) {}
  updateReadingLog();
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  refreshWeather();
  // Static page, long-lived tab: keep the card honest.
  setInterval(refreshWeather, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) refreshWeather();
  });
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();
  updateReadingLog();

  document.getElementById('j-export-clicks').addEventListener('click', exportClicks);
  document.getElementById('j-clear-clicks').addEventListener('click', clearClicks);

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
