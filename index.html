<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="icon" type="image/png" href="the_lighthouse2.png">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Share button ── */
.art-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.art-share-btn{
  background:none;border:1px solid var(--hair);color:var(--m2);
  padding:4px 6px;cursor:pointer;border-radius:2px;
  display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.art-share-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>

    <div class="lang-toggle">

how Epstein recruited and abused his so-called assistants.", "one_liner_pt": "Uma mulher relata em depoimento raro como Epstein recrutava e abusava de suas 'assistentes'.", "category": "Culture", "region": "world", "rationale": "Rare survivor testimony provides new personal detail about Epstein's abuse network, sustaining public interest in accountability.", "low_signal": false}, {"title": "Controle, ameaças e cirurgia: minha vida na 'seita' de Jeffrey Epstein", "summary": "<img src=\"https://s2-g1.glbimg.com/LRFj1FZDBd9BFYkJADtR8369JSg=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/5/Z/lHC4GES0uuTHB6lkzoBw/novo-projeto.jpg\" /><br />     Vítima sexual de Jeffrey Epstein conta o que passou com financista\nBBC\nNa semana seguinte à morte do financista e criminoso sexual Jeffrey Epstein, \"Anya\" (nome fictício) abriu a porta de seu apartamento em Nova York. Do lado de fora estava Mark Epstein, irmão de Jeffrey, dizendo que ela precisava deixar o imóvel, conta.\nAnya viveu por anos em um dos vários apartamentos na East 66th Street, em Manhattan, usados por Jeffrey Epstein para abrigar mulheres que ele abusava. \nEm um instante, ela perdeu sua moradia — mas também escapou de um pesadelo. \n(Mark Epstein nega ter conhecimento dos crimes cometidos pelo irmão.)\n\"Ainda estou tentando processar o fato de que sofri abusos durante anos\", diz Anya. \n\"Não estava acorrentada a uma porta, nem trancada em um porão. As correntes eram menos visíveis, mas existiam.\"\nSegundo Anya, Epstein — que morreu em 2019 enquanto aguardava julgamento por acusações de tráfico sexual de menores — costumava dizer que sua operação \"era como uma seita, e ele era o líder dessa seita\".\nEla deu à BBC um raro relato sobre como era a vida como uma das \"assistentes\" de Epstein, detalhando como o financista conseguiu manter tantas vítimas sob seu controle por tanto tempo.\nEntenda a relação das pessoas mais poderosas do mundo com o empresário Jeffrey Epstein, acusado de explorar mulheres e meninas\nAs assistentes eram um grupo de mulheres — cerca de uma dúzia ao mesmo tempo, estima Anya — que moravam em imóveis fornecidos por Epstein, trabalhavam em tempo integral à sua disposição e eram abusadas sexualmente por ele de forma recorrente.\nAnya afirma que elas eram atraídas por meio de elaboradas mentiras e falsas promessas de trabalho. Depois disso, Epstein passava a controlar coercitivamente praticamente todos os aspectos de suas vidas, explorando qualquer vulnerabilidade que conseguisse identificar.\nEla diz que ele controlava suas finanças, determinava com quem elas podiam se encontrar e as humilhava psicologicamente. Também monitorava obsessivamente seus corpos e, no caso dela, a obrigou a passar por uma cirurgia desnecessária que a deixou desfigurada.\nO relato de Anya sobre o controle exercido por Epstein é corroborado por Sarah Kellen, outra ex-assistente. Em depoimento ao Comitê de Supervisão da Câmara dos Representantes dos Estados Unidos, neste ano, Kellen afirmou que Epstein se apresentava como o salvador das assistentes.\n\"Ele era muito habilidoso em destruir sua capacidade de tomar suas próprias decisões e de manter sua autonomia. E isso fazia com que você dependesse cada vez mais dele\", disse.\nExiste um viés que leva muitas pessoas a acreditar que apenas crianças são suscetíveis a esse tipo de manipulação. Mas \"um adulto também pode ser aliciado\", afirma a psicóloga clínica Tara Quinn-Cirillo, que trabalha com vítimas de controle coercitivo. \"Qualquer pessoa pode se tornar vulnerável a isso\", diz.\n'Uma armadilha completa'\nDepois de Jeffrey Epstein ser condenado, em 2008, por abusar de uma adolescente — atraída até uma de suas casas com a promessa de um trabalho como massagista — ele mudou de estratégia. Passou a buscar principalmente mulheres adultas, em sua maioria da Rússia e de outros países do Leste Europeu.\nAnya afirma, no entanto, que ela e muitas das outras mulheres recrutadas ainda tinham aparência de adolescentes. Para demonstrar isso, mostrou à BBC fotos suas da época.\nEla conta que cresceu em uma Rússia que saía do regime comunista, com pais rígidos que repetiam que \"a educação seria a chave para o sucesso\". Mas as oportunidades eram escassas e, após concluir a faculdade, deixou o país para trabalhar como modelo.\nEla trabalhou na Europa para marcas de luxo como Fendi e Chanel. Tinha amigos, uma rede de apoio e familiares para quem podia voltar sempre que desejasse.\nAnya diz que o recrutador de modelos Daniel Siad a apresentou a Epstein\nDepartamento de Justiça dos EUA / Divulgação\nNo início dos seus 20 anos, entrou no círculo de Epstein ao visitar uma agência em Paris, onde conheceu o recrutador de modelos Daniel Siad — na última quarta-feira (22), Siad foi encontrado morto em casa em Paris. A causa da morte está sendo investigada pelo Ministério Público. \nSegundo Anya, ele elogiou sua inteligência — \"algo incomum na indústria da moda\" — e se ofereceu para apresentá-la a um amigo com contatos no mundo da moda: Jeffrey Epstein.\nAnya conta que costumava se perguntar o que teria acontecido se não tivesse passado naquela agência naquele dia. Hoje, porém, acredita que foi deliberadamente escolhida como alvo.\n\"Foi tudo uma armadilha\", afirma, descrevendo Daniel Siad como \"essencialmente um traficante profissional de pessoas\".\nO nome de Siad aparece milhares de vezes nos chamados \"arquivos Epstein\" — a vasta coleção de documentos sobre o financista divulgada pelo governo dos Estados Unidos em janeiro. O advogado de Siad informou que seu cliente não estava disponível para comentar o caso, mas disse que ele já havia negado anteriormente ter qualquer conhecimento da ameaça representada por Epstein.\nAnya diz que conheceu Epstein pela primeira vez em seu amplo apartamento de 18 cômodos em Paris, decorado com fotos dele ao lado de personalidades como Bill Clinton e outros líderes mundiais.\nEla afirma que se sentiu à vontade porque havia outras duas mulheres no local: uma russa e outra do Leste Europeu — que na época era namorada de Epstein.\nSegundo Anya, Epstein pediu que ela tirasse a roupa para que pudesse avaliar seu corpo para trabalhos como modelo. Enquanto ela permanecia apenas de roupa íntima, ele teria dito que ela \"não estava em forma\", que precisava \"começar a se exercitar\" e a chamou de preguiçosa.\nSegundo Anya, comentários como esses eram comuns na indústria da moda, e ela acreditou quando Epstein disse que, se trabalhasse duro, ele a apresentaria às pessoas certas.\nEla conta que ele perguntou sobre sua família, seus interesses, \"o que eu queria conquistar na vida, por que eu trabalhava como modelo — coisas que realmente eram importantes para mim\".\n\"Na moda, ninguém faz esse tipo de pergunta\", afirma. Diversas mulheres disseram à BBC que Epstein gostava de descobrir o que era importante para elas para, mais tarde, usar essas informações contra elas.\nEle também teria abordado diretamente as preocupações dela.\n\"Percebo que você é inteligente e desconfiada\", Anya lembra de tê-lo ouvido dizer. \"Eu não quero dormir com você.\"\nEla afirma que isso a deixou ainda mais tranquila.\n\"Eu pensava: 'Nossa, esse cara é incrível. Ele consegue enxergar exatamente quem eu sou'\", diz.\n'Um processo de aliciamento muito elaborado'\nEsse foi apenas o início de um processo de aliciamento que se estenderia por muitos meses, mantendo Anya presa a falsas promessas e a um esquema prolongado de manipulação.\nAo longo de quase um ano, ela diz que passou a se exercitar \"religiosamente\" para conquistar o corpo que Epstein queria.\nSegundo Anya, Lesley Groff — assistente executiva de Epstein, responsável por administrar sua agenda — enviava e-mails pedindo atualizações sobre seu progresso. Ao mesmo tempo, Epstein a pressionava para enviar fotos, dizendo que ela não deveria ser \"tímida\" quando insistia em receber nudes dela.\nAnya conta que, conforme havia prometido, Epstein acabou marcando um encontro entre ela e Faith Kates, cofundadora da agência de modelos Next Management.\nAnya diz que Epstein agendou uma reunião com a cofundadora da Next Management, Faith Kates, na foto\nGetty Images via BBC\nSegundo ela, a reunião durou menos de 30 minutos, e lhe disseram que Epstein informaria posteriormente o resultado.\nDepois, o financista afirmou que a Next não queria contratá-la porque ela \"não era boa o suficiente para o mercado de Nova York\". Segundo Anya, Epstein acrescentou que ela \"estava fora de forma\".\nAnya conta que ficou arrasada. Segundo ela, Epstein então a convidou para visitá-lo em Palm Beach, na Flórida, onde ele cumpria pena em regime de liberdade parcial durante o dia. Ela diz que ele alegava ter sido condenado porque uma adolescente o havia enganado usando um documento de identidade falso.\nPara vê-lo, Anya precisou assinar um livro de registro mantido por um policial uniformizado. Ela conta que Epstein a levou para um cômodo nos fundos, onde a agrediu sexualmente pela primeira vez. Pelo menos outras duas mulheres também afirmaram que foram abusadas sexualmente por ele enquanto cumpria essa pena.\nApós o abuso, Epstein a conduziu de volta para fora do cômodo e começou a brincar com as outras assistentes que aguardavam do lado de fora, dizendo que Anya era \"muito tímida\". Segundo ela, todas riram, e essa reação a fez acreditar que a culpa era sua.\n\"Eu pensei que talvez nada de errado tivesse realmente acontecido. Talvez quem estivesse reagindo de forma errada fosse eu\", diz. \"Talvez fosse por causa da minha criação na Rússia, ou porque meus pais eram muito rígidos. Talvez houvesse algo de errado comigo, e não com ele.\"\nAnya afirma que só percebeu plenamente o que havia acontecido quando os chamados \"arquivos Epstein\" foram divulgados. E-mails incluídos nesses documentos indicavam que, apesar da reunião presencial com Faith Kates, fundadora da agência Next Management, ela já havia sido rejeitada pela empresa um ano antes.\nEla diz que percebeu então que Epstein a manteve por meses presa a falsas expectativas e a conduziu deliberadamente ao fracasso, como parte de \"um processo de aliciamento muito elaborado\". Quando ela já estava vulnerável, isolada e longe de casa, afirma, ele atacou.\nSegundo a psicóloga Tara Quinn-Cirillo, o tipo de aliciamento lento e gradual descrito por Anya é pensado justamente para não despertar a percepção de perigo da vítima, \"como bombardeiros furtivos, projetados para passar despercebidos pelos radares\".\nEm nota enviada à BBC, o advogado de Faith Kates afirmou que é \"falsa e difamatória\" qualquer alegação de que sua cliente tivesse conhecimento ou envolvimento no suposto esquema de tráfico de pessoas de Epstein. O advogado acrescentou que a afirmação de que Epstein comunicaria a Anya a decisão da agência era \"incomum, falsa e sem qualquer comprovação\".\nA nota também afirma que a agência sempre tomou suas próprias decisões sobre a contratação de modelos e nunca buscou a aprovação de Epstein. \"Obviamente, não há nada de incomum no fato de uma modelo em potencial ser avaliada e rejeitada por uma agência, inclusive mais de uma vez\", acrescenta.\nEm outro comunicado, a Next Management afirmou que a empresa não mantinha qualquer relação com Epstein e que as supostas ações de Faith Kates, se ocorreram, foram \"exclusivamente dela\".\n'Venha trabalhar para mim'\nEpstein continuou alimentando em Anya a expectativa de conseguir trabalhos como modelo. Segundo ela, ele a apresentou a Jean-Luc Brunel, fundador da agência MC2, sem revelar que era um dos financiadores da empresa. (A MC2 fechou seus escritórios em Miami e Nova York, e o fundador da única filial remanescente, em Israel, já afirmou anteriormente que não mantinha qualquer relação com Epstein.)\nAnya diz que recebeu \"quase nenhum\" trabalho por meio da agência. Em vez disso, conta que seu agente dizia que ela viajaria para Palm Beach para uma \"contratação direta\". Mas, ao chegar lá, não havia trabalho como modelo — apenas novos abusos cometidos por Epstein.\nDepois de algum tempo, segundo Anya, Epstein passou a dizer que a carreira de modelo não estava dando certo e que a indústria da moda estava \"morta\".\nEla se lembra de ouvi-lo dizer:\n\"Venha trabalhar para mim. Eu vou te ensinar um negócio de verdade. Você vai viajar e conhecer pessoas importantes no mundo inteiro.\"\nMas o trabalho como assistente de Epstein não era nada do que Anya havia imaginado. Ela afirma que ele nunca lhe ensinou nada sobre negócios.\nEm vez disso, passava a maior parte do tempo esperando que Epstein lhe desse alguma tarefa. Ao mesmo tempo, segundo ela, ele a repreendia por ficar \"sem fazer nada\". Às vezes, recebia funções simples, como atender o telefone, encaminhar visitantes até uma sala de reuniões ou anunciar a chegada de um convidado.\nApesar disso, as assistentes precisavam estar disponíveis 24 horas por dia, sete dias por semana, afirma Anya. Ela conta que, certa vez, saiu para almoçar com uma pessoa conhecida e Epstein \"ficou furioso\", ligando repetidamente e insistindo que ela jamais poderia sair de casa sem sua autorização.\nAnya diz que era completamente dependente dele. Quando adoecia e precisava de atendimento médico, afirma que Epstein dizia: \"Eu sou o seu plano de saúde.\"\nEla também não tinha conta bancária nem a documentação necessária para alugar um imóvel por conta própria. Ainda assim, segundo ela, Epstein a expulsou algumas vezes do apartamento em Manhattan, dizendo para que \"desse um jeito de descobrir onde iria ficar\". Para Anya, esses eram mecanismos importantes de controle.\nEla afirma que Epstein só começou a lhe pagar um pequeno salário anos depois, porque seu visto de permanência exigia isso. Ainda assim, ele costumava dizer: \"Não se preocupe, eu sempre vou sustentar você.\"\nSegundo Anya, os abusos sexuais continuaram ocorrendo com frequência durante todo esse período.\nSarah Kellen descreveu uma situação semelhante em seu depoimento ao Congresso dos Estados Unidos.\n\"Eu não tinha dinheiro, nem família, nem educação, nem a sensação de que merecia algo melhor\", afirmou.\nAo mesmo tempo, segundo Kellen, Epstein fazia questão de exibir seu poder e sua rede de contatos.\n\"Jeffrey fazia questão de que eu soubesse que desafiá-lo custaria a minha vida\", disse.\nSarah Kellen disse ao Congresso que Epstein era especialista em \"dizimar\" o senso de autonomia de suas assistentes\nGetty Images via BBC\n'Você nunca vai se voltar contra mim'\nEm certa ocasião, uma das assistentes conseguiu fugir, lembra Anya.\nSegundo ela, a mulher ligou para Anya durante a fuga, o que a deixou apavorada de que Epstein descobrisse o contato, já que os telefones pertenciam a ele e as ligações eram monitoradas.\nAnya afirma que Epstein contratou um investigador particular para localizar a assistente desaparecida. Ela diz que ele chegou a mostrar um e-mail detalhando as despesas que, segundo seus cálculos, a mulher lhe devia: um total de US$ 700 mil (cerca de R$ 3,8 milhões).\nPara Anya, a mensagem era clara: \"Se você for embora, vai me dever dinheiro, e eu vou caçá-la para recuperar esse valor.\"\nSegundo ela, essa não era a única forma de pressão exercida por Epstein.\nAnya afirma que ele também reunia material comprometedor sobre as mulheres e, de forma casual, costumava lembrá-la de que possuía fotos dela nua.\nEm outra ocasião, conta, Epstein reuniu as assistentes para uma sessão de fotos. Ele as incentivou a tirar a parte de cima da roupa e dançar alegremente, insistindo que tudo fosse filmado.\nAnya lembra que ele disse:\n\"Dessa forma, eu sei que vocês nunca vão se voltar contra mim.\"\nSegundo ela, a sugestão era de que, caso exibisse o vídeo, seria difícil para elas alegarem que não haviam consentido.\n\"Era a biblioteca de provas dele\", afirma.\nO financista também obrigava as assistentes a escreverem e-mails que elas chamavam de \"cartas de gratidão\", nos quais faziam elogios efusivos ao próprio agressor.\n\"Eu tinha tanto medo de não agradecer o suficiente\", conta Anya.\n\"Acho que, em parte, essas cartas de gratidão eram mais um mecanismo para ele dizer: 'Como você pode se voltar contra mim se passa o tempo todo me agradecendo?'\"\nSegundo Anya, Epstein também colocava as assistentes umas contra as outras.\nEla afirma que ele dizia, por exemplo, que outra mulher estava \"furiosa\" com ela por ser \"inútil e preguiçosa\", mas acrescentava que estava \"defendendo você\" e que era \"seu maior apoiador\".\nNa avaliação de Anya, essa estratégia impedia que as mulheres criassem vínculos verdadeiros entre si, tornando-as mais fáceis de controlar.\nEnquanto conversa com a BBC, Anya levanta a blusa para mostrar diversas cicatrizes no abdômen. Em seguida, exibe antigas fotos de quando trabalhava como modelo, nas quais aparece com uma pequena tatuagem feita ainda na adolescência.\nEla conta que Epstein queria que a tatuagem fosse removida e levou um médico até sua casa para isso.\nSegundo Anya, porém, Epstein não queria que ela fizesse remoção a laser, porque o tratamento demoraria muito. Em vez disso, sugeriu que o médico simplesmente retirasse cirurgicamente a parte da pele onde estava a tatuagem.\n\"Só eu seria capaz de pensar nisso\", ela lembra de tê-lo ouvido dizer.\nAnya afirma que se submeteu à cirurgia, que lhe deixou cicatrizes. Um ano depois, segundo ela, Epstein insistiu para que o procedimento fosse repetido porque não havia gostado do resultado.\n'Ecossistema de abuso'\nA parte \"mais vergonhosa\" do tempo que passou com Epstein foi ter de recrutar outras mulheres, diz Anya, com os olhos marejados.\nCada assistente tinha de trazer pelo menos uma outra assistente, conta ela, e Epstein a instruía a recrutar mulheres jovens como ela.\nAnya diz que quis contar sua história agora para ajudar as pessoas a entenderem como as mulheres acabavam presas na teia de Epstein e para explicar como o esquema dele traficava tanto adultas como ela quanto crianças.\n\"Ele construiu todo um ecossis // ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function renderMasthead() {
  const iso = DATA.date || new Date().toISOString().slice(0,10);
  const year = new Date(iso + 'T12:00:00').getFullYear();
  const vol  = toRoman(year - 1900);
  const doy  = dayOfYear(iso);

  document.getElementById('j-date').textContent = fmtDate(iso);
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

  if (!intro) { document.getElementById('j-briefing').style.display = 'none'; return; }
  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =

}

// ── Articles ─────────────────────────────────────────────────────────

  let html = '';
  const maxRel = Math.max(...DATA.articles.map(a => a.relevance_score || 0), 0.01);
  DATA.articles.forEach((art, i) => {
    const relPct = Math.round(((art.relevance_score || 0) / maxRel) * 100);
    const corr   = art.corroboration || 1;

      ? (art.headline_pt || art.title)

    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
        '<div class="art-actions">' +
          '<button class="art-share-btn" onclick="shareCard(event,' + i + ')" title="' + t('save_img') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Share as image ───────────────────────────────────────────────────
function wrapText(ctx, text, maxW) {
  var words = (text || '').split(' ');
  var lines = [], cur = '';
  for (var wi = 0; wi < words.length; wi++) {
    var test = cur ? cur + ' ' + words[wi] : words[wi];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[wi]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Bayer 4x4 ordered dither — scales img to w x h and returns a canvas.
// Throws SecurityError if the image is CORS-blocked.
function _ditherImg(img, w, h) {
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var c = tmp.getContext('2d');
  var sc = Math.max(w / img.width, h / img.height);
  var sw = w / sc, sh = h / sc;
  c.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  var id = c.getImageData(0, 0, w, h);
  var d = id.data;
  for (var py = 0; py < h; py++) {
    for (var px = 0; px < w; px++) {
      var i = (py * w + px) * 4;
      var lum = Math.max(0, Math.min(1, (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255 * 1.5 - 0.24));
      var bit = lum > BAYER[py % 4][px % 4] / 16 ? 1 : 0;
      d[i]   = bit ? 239 : 32;
      d[i+1] = bit ? 233 : 32;
      d[i+2] = bit ? 216 : 28;
      d[i+3] = 255;
    }
  }
  c.putImageData(id, 0, 0);
  return tmp;
}

function _drawCard(ctx, W, H, headline, liner, cat, src, ditheredImg) {
  var SPLIT = ditheredImg ? 510 : W;
  var textW = SPLIT - 48;

  ctx.fillStyle = '#efe9d8';
  ctx.fillRect(0, 0, W, H);

  if (ditheredImg) {
    ctx.drawImage(ditheredImg, SPLIT, 54);
    ctx.fillStyle = 'rgba(32,32,28,.2)';
    ctx.fillRect(SPLIT, 54, 1, H - 92);
  }

  ctx.strokeStyle = '#20201c'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, 0, W, 54);

  ctx.fillStyle = '#efe9d8';
  ctx.font = 'bold 18px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('THE LIGHTHOUSE', 24, 35);
  ctx.font = '12px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(src, W - 24, 35);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 11px Arial, sans-serif';
  var catW = ctx.measureText(cat).width + 20;
  ctx.fillRect(24, 72, catW, 22);
  ctx.fillStyle = '#efe9d8';
  ctx.fillText(cat, 34, 87);

  ctx.fillStyle = '#20201c';
  ctx.font = 'bold 26px Georgia, serif';
  var headLines = wrapText(ctx, headline, textW);
  var y = 124;
  headLines.slice(0, 4).forEach(function(l) { ctx.fillText(l, 24, y); y += 34; });

  y += 6;
  ctx.fillStyle = '#c4bda6';
  ctx.fillRect(24, y, textW, 1);
  y += 16;

  ctx.fillStyle = '#3a382f';
  ctx.font = '15px Georgia, serif';
  wrapText(ctx, liner, textW).slice(0, 3).forEach(function(l) { ctx.fillText(l, 24, y); y += 23; });

  ctx.fillStyle = '#20201c';
  ctx.fillRect(0, H - 38, W, 38);
  ctx.fillStyle = '#efe9d8';
  ctx.font = '12px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DATA.date, 24, H - 14);
  ctx.textAlign = 'right';
  ctx.fillText('ricardobertolin.github.io/the_lighthouse_app', W - 24, H - 14);
  ctx.textAlign = 'left';
}

function shareCard(evt, idx) {
  var btn = evt ? evt.currentTarget : null;
  var art = DATA.articles[idx];
  var ispt = lang === 'pt';
  var headline = ispt ? (art.headline_pt || art.title) : (art.headline_en || art.title);
  var liner    = ispt ? (art.one_liner_pt || art.one_liner_en || '') : (art.one_liner_en || '');
  var cat      = (art.category || 'News').toUpperCase();
  var src      = art.source_domain || '';
  var W = 800, H = 440, SPLIT = 510;
  var iW = W - SPLIT, iH = H - 92;

  function makeCV() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

  function dispatch(cv) {
    var fn = 'lighthouse-' + (idx + 1) + '.png';
    cv.toBlob(function(blob) {
      var file = new File([blob], fn, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function() { _copyBlob(blob, btn); });
      } else {
        _copyBlob(blob, btn);
      }
    }, 'image/png');
  }

  function render(dithered) {
    var cv = makeCV();
    _drawCard(cv.getContext('2d'), W, H, headline, liner, cat, src, dithered);
    try { dispatch(cv); }
    catch(e) {
      var cv2 = makeCV();
      _drawCard(cv2.getContext('2d'), W, H, headline, liner, cat, src, null);
      dispatch(cv2);
    }
  }

  // Load img src, dither it, call cb(ditheredCanvas | null)
  function loadDither(imgSrc, cb) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var d = null;
      try { d = _ditherImg(img, iW, iH); } catch(e) {}
      cb(d);
    };
    img.onerror = function() { cb(null); };
    img.src = imgSrc;
  }

  if (art.image_url) {
    loadDither(art.image_url, function(d) {
      if (d) { render(d); }
      else { loadDither('the_lighthouse2.png', render); }
    });
  } else {
    loadDither('the_lighthouse2.png', render);
  }
}

function _copyBlob(blob, btn) {
  if (navigator.clipboard && navigator.clipboard.write) {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(function() { _flashBtn(btn); })
      .catch(function() { _dlBlob(blob, 'lighthouse.png'); });
  } else {
    _dlBlob(blob, 'lighthouse.png');
  }
}

function _dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function _flashBtn(btn) {
  if (!btn) return;
  var el = btn.closest ? (btn.closest('.art-share-btn') || btn) : btn;
  el.style.background = 'var(--ink)';
  el.style.color = 'var(--paper)';
  setTimeout(function() { el.style.background = ''; el.style.color = ''; }, 900);
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
