<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20201c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Lighthouse">
<link rel="apple-touch-icon" href="the_lighthouse2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
:root{
  --desk:#ccc4ad;--paper:#efe9d8;--ink:#20201c;--ink-soft:#3a382f;
  --m1:#5a564a;--m2:#6a6557;--m3:#7a7464;
  --hair:#c4bda6;--meter:#d8d1bb;
}
body{background:var(--desk);font-family:'PT Serif',Georgia,serif;color:var(--ink);}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}

/* ── Sheet ── */
.desk{padding:34px 16px 56px;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink),0 22px 44px rgba(40,36,24,.34);
  padding:30px 38px 40px;
}

/* ── Masthead ── */
.mast-vol{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:6px;
}
.mast-title{
  display:flex;align-items:center;gap:14px;margin:12px 0 6px;
}
.mast-title-text{
  font-family:'UnifrakturCook','Playfair Display',serif;
  font-size:74px;line-height:.96;letter-spacing:1px;white-space:nowrap;flex:none;
}
.mast-rule{flex:1;display:flex;align-items:center;gap:8px;}
.mast-rule-l{justify-content:flex-end;}
.mast-rule-r{justify-content:flex-start;}
.mast-rule-line{flex:1;height:1px;background:var(--ink);}
.mast-rule-gem{font-size:10px;color:var(--ink);line-height:1;}
.mast-date{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:11px;color:var(--ink-soft);
  border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0;
}
.mast-date-center{font-weight:600;letter-spacing:2px;color:var(--ink);}

/* ── Lang toggle ── */
.lang-toggle{display:flex;gap:0;}
.lang-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;padding:2px 7px;cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--m1);font-weight:400;
}
.lang-btn:first-child{border-right:none;}
.lang-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}

/* ── Forecast ── */
.forecast{border:1px solid var(--ink);margin-top:18px;overflow:hidden;}
.fx-canvas{
  position:relative;overflow:hidden;
  filter:url(#ditherBig);
  background:#888;
}
.fx-canvas img{width:100%;height:auto;display:block;}
.fx-panel{
  padding:12px 20px;
  background:#141412;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.fx-panel-left{display:flex;flex-direction:column;gap:2px;}
.fx-kicker{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#b0a898;}
.fx-condition{font-family:'Playfair Display',serif;font-weight:900;font-size:28px;line-height:1;color:#efe9d8;}
.fx-strapline{font-style:italic;font-size:13px;color:#8a8070;}
.fx-stats{display:flex;gap:20px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.5px;color:#efe9d8;}
.fx-stats b{font-weight:600;color:#b0a898;}

/* ── Section nav ── */
.section-nav{
  display:flex;margin-top:22px;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.section-nav::-webkit-scrollbar{height:0;}
.nav-divider{width:1px;flex:none;background:var(--ink);}
.nav-btn{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:13px;padding:11px 18px;cursor:pointer;border:none;
  background:transparent;color:var(--m1);font-weight:400;white-space:nowrap;flex:none;
}
.nav-btn:hover{background:rgba(32,32,28,.06);}
.nav-btn.active{background:var(--ink);color:var(--paper);font-weight:600;}
.dispatch-line{text-align:center;font-style:italic;font-size:14px;color:var(--m1);margin-top:8px;}

/* ── Filter strip ── */
.filter-strip{
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:10px 0;margin-top:14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:11px;color:var(--m1);
}
.flt-group{display:flex;align-items:center;gap:8px;}
.flt-label{font-weight:600;letter-spacing:1.5px;white-space:nowrap;}
.flt-val{color:var(--ink);min-width:28px;}
.flt-range{
  -webkit-appearance:none;appearance:none;
  width:90px;height:3px;background:var(--meter);border:1px solid var(--ink);
  cursor:pointer;outline:none;
}
.flt-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  background:var(--ink);border-radius:0;cursor:pointer;
}
.flt-range::-moz-range-thumb{
  width:10px;height:10px;background:var(--ink);
  border-radius:0;border:none;cursor:pointer;
}
.flt-check-lbl{display:flex;align-items:center;gap:5px;cursor:pointer;}
.flt-check{cursor:pointer;accent-color:var(--ink);}
.flt-div{width:1px;height:18px;background:var(--hair);}

/* ── Briefing ── */
.briefing{margin-top:20px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:14px 0;}
.briefing-label{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;
}
.briefing-body{
  font-size:16px;line-height:1.5;text-align:justify;
  column-count:2;column-gap:30px;
}
.drop-cap{
  float:left;font-family:'Playfair Display',serif;font-weight:900;
  font-size:56px;line-height:.78;padding:4px 8px 0 0;
}

/* ── Stats ── */
.edition-stats{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m2);text-align:right;
  margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--hair);
}

/* ── Article rows ── */
.art-row{
  display:flex;gap:18px;align-items:flex-start;
  padding:18px 0;border-bottom:1px solid var(--hair);
}
.art-row.hidden{display:none;}
.art-row.low-sig{opacity:.45;}
.art-thumb-col{width:96px;flex:none;}
.art-thumb-frame{border:1px solid var(--ink);background:var(--paper);padding:3px;}
.art-thumb{width:90px;height:90px;object-fit:cover;display:block;filter:url(#dither);}
.art-thumb-empty{
  width:90px;height:90px;background:var(--meter);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:var(--m2);text-align:center;padding:4px;
}
.art-source-cap{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  font-size:8.5px;color:var(--m2);text-align:center;margin-top:4px;
}
.art-content-col{flex:1;min-width:0;}
.art-kicker-row{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;
  font-size:11px;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.art-rank-no{color:var(--m3);}
.art-headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:23px;line-height:1.12;
  color:var(--ink);display:block;
}
.art-headline:hover{text-decoration:underline;}
.art-deck{font-size:15.5px;line-height:1.4;margin-top:6px;text-align:justify;color:var(--ink);}
.art-note{font-style:italic;font-size:14px;color:var(--m2);line-height:1.4;margin-top:4px;}
.art-meta{
  display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:10px;color:var(--m1);
}
.meta-div{width:1px;height:11px;background:#9a937e;flex:none;}
.rel-wrap{display:inline-flex;align-items:center;gap:6px;}
.rel-bg{width:54px;height:7px;background:var(--meter);border:1px solid var(--ink);display:inline-block;}
.rel-fill{display:block;height:100%;background:var(--ink);}

/* ── Footer ── */
.edition-footer{
  text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:4px;font-size:11px;color:var(--m3);padding:18px 0 2px;
}
.gen-footer{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);margin-top:20px;
  padding-bottom:4px;
}
.made-by{
  text-align:center;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--m3);
  padding-bottom:14px;
}

/* ── Weather animations ── */
@keyframes rainfall {
  0%   { transform:translate(0,-25px);opacity:0; }
  12%  { opacity:1; }
  88%  { opacity:.85; }
  100% { transform:translate(10px,200px);opacity:0; }
}
@keyframes snowfall {
  0%   { transform:translate(0,-10px) scale(1);opacity:0; }
  15%  { opacity:1; }
  85%  { opacity:.9; }
  100% { transform:translate(-8px,200px) scale(.7);opacity:0; }
}
@keyframes lightning-flash {
  0%,82%     { opacity:0; }
  83%        { opacity:.88; }
  84%        { opacity:0; }
  85.5%      { opacity:.55; }
  87%,100%   { opacity:0; }
}
.fx-rain-streak {
  position:absolute;width:2px;background:#1c1c1c;border-radius:1px;
  animation:rainfall linear infinite;
}
.fx-snow-dot {
  position:absolute;width:5px;height:5px;border-radius:50%;background:#d8d8d8;
  animation:snowfall linear infinite;
}
.fx-lightning-flash {
  position:absolute;inset:0;background:#d8eaf8;pointer-events:none;
  animation:lightning-flash 3.5s ease-in infinite;
}

/* ── Responsive ── */
@media(max-width:680px){
  .sheet{padding:20px 18px 28px;}
  .mast-title-text{font-size:44px;}
  .briefing-body{column-count:1;}
  .fx-panel{flex-direction:column;align-items:flex-start;gap:8px;}
  .desk{padding:16px 8px 32px;}
}
</style>
</head>
<body>

<div class="desk">
<div class="sheet">

  <!-- MASTHEAD -->
  <div class="mast-vol">
    <span id="j-vol">Vol. CXXVI &middot; No. 168</span>

    <div class="lang-toggle">

const DATA = {"date": "2026-07-02", "intro_en": "Today's news is dominated by Brazil-US tensions, with Washington imposing sanctions on Brazilians linked to the PCC gang and Brazil formally contesting a 25% US tariff while defending its PIX payment system. The FIFA World Cup 2026 also draws attention after hundreds of fans were left outside stadiums due to last-minute StubHub ticket cancellations. On the tech front, Anthropic's advanced AI models receive global release and Google reports a 37% surge in electricity use driven by AI infrastructure.", "intro_pt": "As notícias de hoje são dominadas pelas tensões entre Brasil e EUA, com Washington sancionando brasileiros supostamente ligados ao PCC e o Brasil contestando oficialmente a tarifa americana de 25% e defendendo o PIX. A Copa do Mundo 2026 também ganha destaque após centenas de torcedores ficarem do lado de fora dos estádios por cancelamentos de ingressos da StubHub. No campo tecnológico, os modelos avançados de IA da Anthropic recebem liberação global e o Google reporta alta de 37% no consumo de energia impulsionada pela infraestrutura de IA.", "weather": {"location": "Curitiba, PR", "description": "Overcast", "temp_max": 24.5, "temp_min": 15.9, "precipitation_mm": 0.0, "wind_max_kmh": 15.1, "wmo_code": 3}, "articles": [{"title": "'Gastei US$ 6 mil em viagem para a Copa, mas acabei do lado de fora do estádio'", "summary": "Centenas de torcedores afirmam que tiveram seus ingressos para a Copa do Mundo, comprados no site de revenda StubHub, cancelados na última hora", "url": "https://www.bbc.com/portuguese/articles/cgrkln8nevko?at_medium=RSS&at_campaign=rss", "source_domain": "bbc.com", "published_at": "2026-07-02T13:20:56+00:00", "origin": "feed", "image_url": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/b7ea/live/7a5c94d0-7466-11f1-81eb-e7f1f1b252ec.jpg", "url_hash": "7c063afb6bbf15fe662027d2500743cb", "title_hash": "035edf0c0237de9da2e36b822878e652", "corroboration": 2, "relevance_score": 0.0896, "reputation_score": 0.85, "corroboration_score": 1.0, "final_score": 0.4998, "headline_en": "Fans Stranded Outside World Cup Stadiums After StubHub Last-Minute Cancellations", "headline_pt": "Torcedores ficam do lado de fora após cancelamentos de ingressos da Copa pelo StubHub", "one_liner_en": "Hundreds of fans who spent thousands on World Cup trips were locked out after StubHub cancelled their tickets.", "one_liner_pt": "Centenas de torcedores gastaram milhares de dólares e ficaram sem entrar nos estádios após cancelamentos da StubHub.", "category": "Other", "region": "world", "rationale": "A major consumer protection and ticketing scandal affecting fans from multiple countries during a high-profile global event.", "low_signal": false}, {"title": "'Gastei US$ 6 mil em viagem para a Copa, mas acabei do lado de fora do estádio'", "summary": "<img src=\"https://s2-g1.glbimg.com/LYVIlVAHshH-7JDZts7QtvLt90I=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/q/T/dXISCdSzA7fAaFNqOGNA/7a5c94d0-7466-11f1-81eb-e7f1f1b252ec.jpg.webp\" /><br />     Sergio Enrique Alvarado Montalvo, de 45 anos, com sua família em uma festa para assistir ao jogo em Dallas, no Texas\nSergio Enrique Alvarado Montalvo\nQuando Sergio Enrique Alvarado Montalvo pagou US$ 1,7 mil (cerca de R$ 9,2 mil) por ingressos na plataforma de revenda online StubHub para surpreender o pai com uma ida à Copa do Mundo de 2026, imaginava que os dois viveriam um Dia dos Pais inesquecível assistindo ao jogador argentino Lionel Messi em campo.\nEm vez disso, depois de levar seus pais do México para Dallas, no sul dos Estados Unidos, para assistir à partida Argentina x Áustria, e gastar quase US$ 6 mil (cerca de R$ 32,5 mil) com passagens e hospedagem, a família não conseguiu entrar no estádio.\nApenas um dia antes da viagem para Dallas, o StubHub informou de forma repentina que o vendedor não conseguiria entregar os ingressos. A plataforma também se recusou a fornecer bilhetes equivalentes, alegando que os preços haviam disparado (ou seja, o valor estava muito mais alto do que aquele pago anteriormente por Montalvo).\nMesmo assim, eles foram ao estádio na esperança de que ainda conseguissem os ingressos. Montalvo permaneceu ao telefone com o StubHub até uma hora antes do início da partida.\n\"Eu fiquei muito triste, muito frustrado e tomado pela raiva. Foi uma mistura de sentimentos difícil de explicar\", disse Montalvo, de 45 anos, em entrevista à BBC.\nO pesadelo vivido por Montalvo faz parte do que especialistas do setor estão chamando de uma das maiores crises da história da venda de ingressos. Enquanto a Copa do Mundo de 2026 passa por 16 cidades dos EUA, Canadá e México, muitos torcedores estão vendo o sonho de acompanhar a Copa acabar por causa de cancelamentos de última hora em plataformas de revenda.\nO principal motivo é uma prática conhecida como speculative ticketing (venda especulativa de ingressos, em tradução livre). Nela, vendedores sem ingressos garantidos oferecem ingressos que ainda não possuem, na expectativa de conseguir comprá-los mais baratos perto da data do evento.\nQuando os preços dos ingressos sobem, esses vendedores simplesmente cancelam a venda negociada inicialmente para conseguir revender o ingresso por um preço bem maior, aumentando a margem de lucro. Compradores como Montalvo acabam ficando apenas com o reembolso do valor pago pelos ingressos, insuficiente para compensar os altos gastos com viagem e hospedagem.\n'Meu filho ficou arrasado'\nEben Pingree, de 44 anos, morador de Boston, nos EUA, viveu situação semelhante. Sua mulher, Caitlin, pagou US$ 2,8 mil (cerca de R$ 15,2 mil) no StubHub por ingressos para a partida entre Escócia e Haiti como surpresa para o filho do casal, Cole, de 11 anos.\nEles haviam organizado uma viagem com antecedência, junto de outro pai e seu filho, mas os ingressos não foram entregues no dia da partida. \"Eles basicamente nos deixaram para trás, e meu filho ficou arrasado\", disse Pingree em entrevista à BBC.\nEben Pingree e seu filho, Cole, do lado de fora do estádio de Boston\nEben Pingree\nDe volta a Dallas, Montalvo e sua família passaram a noite da partida em um festival local para torcedores, em vez de assistir ao jogo das arquibancadas. \"Foi um fim de semana muito triste... por dentro e por fora... [mas] aproveitamos o tempo juntos\", acrescentou Montalvo.\nEm um outro caso, dois torcedores da Copa do Mundo entraram com uma ação contra o StubHub na terça-feira (30/6), em um processo que busca o status de ação coletiva, acusando a plataforma de revenda de não entregar ingressos pelos quais eles haviam pagado.\nA ação foi apresentada por Julie Reeker Moghal e Reuben Renteria, que afirmaram em documentos judiciais atuar em nome próprio e em nome de outras pessoas em situação semelhante.\nA dupla disse ter pago ao StubHub ao menos US$ 1,9 mil (cerca de R$ 10,3 mil) cada um por ingressos da Copa do Mundo que nunca foram entregues.\n\"[Os torcedores] foram enganados e compraram ingressos da Copa do Mundo por grandes quantias — apenas para sofrer enormes prejuízos financeiros\", diz a ação.\nSegundo o documento, o caso marcou um \"novo ponto baixo\" para um setor \"tomado por problemas de proteção ao consumidor\".\nO StubHub não quis comentar o caso. A Fifa não comentou diretamente a ação quando procurada pela BBC.\nEmpresas trocam acusações\nA crise deu início a uma disputa de versões entre as empresas.\nTodos os ingressos da Copa do Mundo só podem ser acessados pelo site ou pelo aplicativo da Fifa, organizadora do torneio. Por isso, qualquer ingresso comprado em sites de revenda, como o StubHub, precisa ser transferido dentro do site ou do aplicativo da Fifa.\nO StubHub atribuiu a responsabilidade à Fifa, afirmando que o novo aplicativo de ingressos lançado pela entidade pouco antes do evento apresentou \"problemas significativos de desempenho que afetaram transferências em todas as plataformas de revenda\".\nA Fifa rebateu afirmando que sua plataforma oficial é o único canal de venda garantido e que não pode assegurar a validade de ingressos comprados por meio de terceiros. A entidade disse que \"rejeita qualquer sugestão\" de que os problemas técnicos que atingem plataformas secundárias sejam culpa do sistema da própria Fifa.\nAcrescentou ainda que a sua plataforma de ingressos estava \"operando de forma confiável\" e disse que mais de 5 milhões de pessoas haviam assistido a partidas até então.\nMas especialistas afirmam que as plataformas não podem atribuir a responsabilidade apenas a falhas de software.\n\"A culpa é 100% do StubHub\", disse Scott Friedman, cofundador da Ticket Talk Network, que já reuniu mais de 600 reclamações de consumidores apenas durante esta Copa do Mundo.\n\"A Fifa também não é nenhuma santa. O sistema de venda de ingressos deles é péssimo. Parece um software de 1999\", acrescentou Friedman.\nEmbora o StubHub afirme proibir rigorosamente a venda especulativa de ingressos em sua plataforma, entidades que monitoram o setor e consumidores insatisfeitos acreditam que a prática continua sendo comum.\nAlguns vendedores também dizem ter sido prejudicados. Um vendedor de Austin, nos EUA, contou à BBC que perdeu US$ 2,6 mil (cerca de R$ 14 mil) depois de anunciar no StubHub um ingresso comprado legalmente no Marketplace da Fifa. Ele afirmou ter vendido o ingresso por US$ 1,2 mil (cerca de R$ 6,5 mil) e enviado o bilhete para o endereço de e-mail gerado automaticamente pela plataforma. Ainda assim, o StubHub cancelou a venda por \"não cumprimento\", reteve o pagamento e ainda lhe cobrou uma multa de US$ 1,4 mil (cerca de R$ 7,6 mil).\nPara o consumidor comum, enfrentar uma grande empresa pode parecer uma batalha impossível de vencer.\nBradford Clements, advogado que atualmente representa clientes com mais de US$ 2,4 milhões (cerca de R$ 13 milhões) em ações contra o StubHub, a maioria sem relação com a Copa do Mundo, afirma que o complexo processo de contestação da empresa frequentemente leva torcedores comuns a desistirem de buscar indenização.\n\"As pessoas não entendem que a estratégia do StubHub é intimidar, enrolar e negar\", disse Clements à BBC. O advogado também afirmou que notificações judiciais enviadas à empresa foram devolvidas.\nO StubHub não comentou a acusação de Clements.\nAinda não está claro quantas pessoas enfrentaram problemas com ingressos comprados no StubHub ou em outras plataformas de revenda. Centenas de torcedores relataram dificuldades nas redes sociais, enquanto um relatório sugeriu que milhares de ingressos foram cancelados.\nUm porta-voz do StubHub disse que a empresa está ampliando a sua capacidade de conseguir ingressos de substituição para clientes afetados e destacou que todas as compras são cobertas pela garantia FanProtect. Segundo a empresa, caso o cliente não receba os ingressos adquiridos nem outros equivalentes ou superiores, terá direito ao reembolso.\nMas na prática, essa garantia pouco adianta para torcedores que já perderam milhares de dólares em despesas de viagem que não podem ser reembolsadas.\nÀ medida que a Copa do Mundo entra em sua fase decisiva, entidades que acompanham o setor alertam que a crise dos cancelamentos pode se agravar, deixando mais famílias do lado de fora dos estádios, sem nada que compense uma experiência que deveria durar para a vida toda.\nReportagem adicional de Osmond Chia\nACOMPANHE os destaque da Copa do Mundo no ge:\nSimulador da Copa do Mundo 2026\nCalendário da Copa do Mundo 2026: veja datas e horários de todos os jogos\nRESULTADOS: confira a tabela da Copa do Mundo", "url": "https://g1.globo.com/mundo/noticia/2026/07/02/gastei-us-6-mil-em-viagem-para-a-copa-mas-acabei-do-lado-de-fora-do-estadio.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-02T13:43:59+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/LYVIlVAHshH-7JDZts7QtvLt90I=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2026/q/T/dXISCdSzA7fAaFNqOGNA/7a5c94d0-7466-1  "An opinion piece explores how maker culture is reshaping Brazilian classrooms into creative, hands-on learning environments.", "one_liner_pt": "Artigo explora como a cultura maker está transformando salas de aula brasileiras em espaços de aprendizagem prática.", "category": "Culture", "region": "curitiba", "rationale": "An opinion-style educational piece with no specific news hook, relevant mainly as background commentary.", "low_signal": true}, {"title": "Uso de internet chega a 90,5% dos brasileiros, e diferença cai entre áreas urbanas e rurais, diz IBGE", "summary": "<img src=\"https://s2-g1.glbimg.com/qMWTsH8GVgsRkEe6gtm6O45-VsM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2024/k/4/0Dn0PbReCcbacfJ3WHGQ/utsman-media-g4i-lq-p4o0-unsplash.jpg\" /><br />     Segundo o IBGE, 168,7 milhões de pessoas usam a internet no Brasil em 2025\nReprodução/Unsplash\nO uso de internet atingiu 90,5% da população brasileira com 10 anos ou mais em 2025, segundo a Pesquisa Nacional por Amostra de Domicílios Contínua, publicada nesta quinta-feira (2) pelo Instituto Brasileiro de Geografia e Estatística (IBGE). \nNa prática, 168,7 milhões de pessoas usam a internet no Brasil, com base no acesso feito nos 90 dias anteriores às entrevistas. É uma nova alta do índice, que alcançou 89,2% da população, em 2024, de acordo com o IBGE. \nOs principais usos da internet incluem fazer chamadas de voz ou vídeo (95,3%), trocar mensagens de texto, voz ou imagens (90,2%), assistir a vídeos (89,3%), usar redes sociais (84,9%) e ouvir músicas, rádio ou podcasts (83,7%). \nEntre os usuários de internet no Brasil, 98,7% se conectam pelo celular. Na sequência, estão a televisão (57,8%), o computador (33,4%) e o tablet (9,2%). \nAgora no g1\nÁreas urbanas continuam com maior uso de internet, mas a diferença para áreas rurais diminuiu nos últimos anos: a distância caiu de 37,5 pontos percentuais, em 2016, para 8,5 pontos percentuais, em 2025. \nEntre os estudantes, 92,4% usaram a internet, sendo 97,2% da rede privada de ensino e 89,9% da rede pública. A diferença é maior entre alunos do ensino fundamental e diminui entre estudantes dos ensinos médio e superior. \nSegundo o levantamento,17,7 milhões de pessoas com 10 anos ou mais não usaram a internet em 2025. Os principais motivos foram não saber usar a rede (44,9%) e a falta de necessidade (27,8%). \nA pesquisa apontou ainda que 89,8% das pessoas com 10 anos ou mais tinham celular em 2025. Entre os que não tinham o aparelho, os principais motivos foram não saber usar (31,1%), não ver necessidade (21,1%) e o preço alto (14,9%). \nCresce uso de internet entre idosos \nEmbora ainda seja o grupo com menor proporção de usuários de internet, a população com 60 anos ou mais registrou o maior crescimento no uso da rede, segundo o IBGE. \nO uso de internet nesta faixa etária cresceu de 70,1%, em 2024, para 74,5%, em 2025. Na comparação com 2019, a alta é ainda maior, chegando a 29,6 pontos percentuais. \nO crescimento do uso de internet entre idosos pode ter sido causado \"pela evolução nas facilidades para o uso dessa tecnologia e na sua disseminação no cotidiano da sociedade\", avalia o IBGE. \nIdosos também foram o grupo com a maior alta no uso de celular, passando de 78,3%, em 2024, para 80,3%, em 2025. O crescimento em relação a 2019 foi de 13,6 pontos percentuais. \nPreocupação com privacidade de crianças \nA faixa etária de 10 a 13 anos foi a única a registrar queda no uso de internet, passando de 84,9%, em 2024, para 84,4%, em 2025. \nEntre os que não usaram a internet no período avaliado, os principais motivos foram a falta de necessidade (33,8%), a preocupação com privacidade ou segurança (30,3%). \nCrianças de 10 a 13 anos também usaram menos o celular em 2025, passando de 56,7% para 55,2%. A preocupação com privacidade e segurança foi o principal motivo para elas não usarem o aparelho. \nA PNAD Contínua com dados de 2025 também apontou que: \n93,9% dos domicílios tinham televisão, o que representou uma estabilidade e interrompeu uma sequência de quedas desde 2016, no início da série histórica; \nentre os domicílios com TV, 85,8% recebiam sinal digital ou analógico, 44,4% pagavam serviço de streaming de vídeo e 23,5% tinham serviço de TV por assinatura; \n38,7% dos domicílios tinham computador, interrompendo a sequência de quedas desde 2016, no início da série histórica; \n11,6% dos domicílios tinham tablet; \n97,4% dos domicílios tinham celular e 5,9% dos domicílios contavam com telefone fixo; \n46,9% dos domicílios tinham rádio; \nentre os domicílios com internet, 20,2% tinham algum tipo de dispositivo inteligente.", "url": "https://g1.globo.com/tecnologia/noticia/2026/07/02/uso-de-internet-chega-a-905percent-dos-brasileiros-e-diferenca-cai-entre-areas-urbanas-e-rurais-diz-ibge.ghtml", "source_domain": "g1.globo.com", "published_at": "2026-07-02T13:00:05+00:00", "origin": "feed", "image_url": "https://s2-g1.glbimg.com/qMWTsH8GVgsRkEe6gtm6O45-VsM=/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2024/k/4/0Dn0PbReCcbacfJ3WHGQ/utsman-media-g4i-lq-p4o0-unsplash.jpg", "url_hash": "0a2d4b82100b75bdddf3e86fe9cce3ed", "title_hash": "c34258f6f6cc46d4d499cf9b3b89e62e", "corroboration": 1, "relevance_score": 0.2638, "reputation_score": 0.85, "corroboration_score": 0.0, "final_score": 0.3869, "headline_en": "Internet Use Reaches 90.5% of Brazilians, Urban-Rural Gap Narrows, Says IBGE", "headline_pt": "Uso de internet chega a 90,5% dos brasileiros e diferença urbano-rural cai, diz IBGE", "one_liner_en": "IBGE reports 168.7 million Brazilians used the internet in 2025, with the urban-rural connectivity gap continuing to shrink.", "one_liner_pt": "O IBGE aponta que 168,7 milhões de brasileiros usaram a internet em 2025, com redução da desigualdade entre áreas urbanas e rurais.", "category": "Tech", "region": "brazil", "rationale": "Official national data on digital inclusion marks a significant social and economic milestone for let lang = 'en';
function t(key) { return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS['en'][key] || key; }

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), ms = now - d;
  if (isNaN(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 2)  return t('just_now');
  if (m < 60) return m + t('ago_m');
  const h = Math.floor(m / 60);
  if (h < 24) return h + t('ago_h');
  const days = Math.floor(h / 24);
  if (days < 7) return days + t('ago_d');
  return d.toLocaleDateString();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(_) { return iso; }
}

function dayOfYear(iso) {
  if (!iso) return 1;
  const d = new Date(iso + 'T12:00:00');
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function toRoman(n) {
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';
  for(let i=0;i<v.length;i++) while(n>=v[i]){r+=s[i];n-=v[i];}
  return r;
}

function wxLabel(code) {
  if (code===0||code===1) return t('fair_sunny');
  if (code===2)           return t('partly_cloudy');
  if (code===3)           return t('overcast');
  if (code<=48)           return t('foggy');
  if (code<=67)           return t('steady_rain');
  if (code<=77)           return t('light_snow');
  if (code<=82)           return t('rain_showers');
  if (code>=95)           return t('thunderstorms');
  return t('overcast');
}

function imgError(img) {
  img.onerror = null;
  img.src = 'the_lighthouse2.png';
}

function renderMasthead() {
  const iso = DATA.date || new Date().toISOString().slice(0,10);
  const year = new Date(iso + 'T12:00:00').getFullYear();
  const vol  = toRoman(year - 1900);
  const doy  = dayOfYear(iso);
  document.getElementById('j-vol').textContent  = 'Vol. ' + vol + ' · No. ' + doy;
  document.getElementById('j-date').textContent = fmtDate(iso);
}

// ── Weather scene builders ────────────────────────────────────────────
function wxImageFor(type) {
  if (type === 'Sunny')                         return '01_sunny.png';
  if (type === 'Thunderstorm' || type === 'Rainy') return '03_storm.png';
  return '02_cloudy.png';
}

function buildScene(type) {
  const imgSrc = wxImageFor(type);
  const img = '<img src="' + imgSrc + '" alt="">';

  let overlay = '';

  if (type === 'Foggy') {
    overlay =
      '<div style="position:absolute;left:-5%;top:18%;width:110%;height:14%;background:rgba(195,195,195,.68);border-radius:6px;"></div>' +
      '<div style="position:absolute;left:-5%;top:38%;width:110%;height:11%;background:rgba(210,210,210,.58);border-radius:5px;"></div>' +
      '<div style="position:absolute;left:-5%;top:56%;width:110%;height:9%;background:rgba(222,222,222,.48);border-radius:4px;"></div>';

  } else if (type === 'Snow') {
    const ps = [3,11,20,28,37,46,54,63,71,80,88,95];
    const ds = [0,.4,.7,.15,.55,.9,.25,.65,.3,.75,.1,.5];
    const sz = [5,4,6,5,4,5,6,4,5,4,6,5];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-snow-dot" style="left:' + p + '%;top:-12px;width:' + sz[i] + 'px;height:' + sz[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + (1.2 + ds[i]*0.4) + 's;"></div>';
    });

  } else if (type === 'Rainy' || type === 'Thunderstorm') {
    const ps  = [2,10,18,27,35,43,51,59,67,76,84,93];
    const ds  = [0,.28,.62,.08,.45,.82,.18,.55,.35,.72,.1,.48];
    const hs  = [18,22,16,20,24,18,22,16,20,22,18,20];
    const drs = [.72,.88,.65,.8,.7,.84,.68,.76,.9,.62,.78,.7];
    ps.forEach((p,i) => {
      overlay += '<div class="fx-rain-streak" style="left:' + p + '%;top:-26px;height:' + hs[i] + 'px;animation-delay:' + ds[i] + 's;animation-duration:' + drs[i] + 's;"></div>';
    });
    if (type === 'Thunderstorm') {
      overlay += '<div class="fx-lightning-flash"></div>';
    }
  }

  return img + overlay;
}

function wxSceneType(code, precip) {
  if (code === 0 || code === 1) return 'Sunny';
  if (code >= 95) return 'Thunderstorm';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 51 || precip > 0) return 'Rainy';
  if (code >= 45) return 'Foggy';
  return 'Overcast';
}

// ── Weather ──────────────────────────────────────────────────────────
function renderWeather() {
  const w = DATA.weather || {};
  const code   = w.wmo_code != null ? w.wmo_code : 3;
  const precip = w.precipitation_mm || 0;
  const type   = wxSceneType(code, precip);

  const canvas = document.getElementById('j-fx-canvas');
  canvas.innerHTML = buildScene(type);

  document.getElementById('j-wx-cond').textContent = wxLabel(code);

  const hi   = w.temp_max  != null ? w.temp_max  + '°' : '--';
  const lo   = w.temp_min  != null ? w.temp_min  + '°' : '--';
  const wind = w.wind_max_kmh      ? '≤' + Math.round(w.wind_max_kmh) + 'km/h' : '--';
  document.getElementById('j-wx-stats').innerHTML =
    '<span><b>' + t('high') + '</b> ' + esc(hi)   + '</span>' +
    '<span><b>' + t('low')  + '</b> ' + esc(lo)   + '</span>' +
    '<span><b>' + t('wind') + '</b> ' + esc(wind) + '</span>';
}

// ── Nav ──────────────────────────────────────────────────────────────
function tabVisible(region) {
  if (activeTab === 'world')    return true;
  if (activeTab === 'brazil')   return region === 'brazil' || region === 'curitiba';
  if (activeTab === 'curitiba') return region === 'curitiba';
  return true;
}

function renderNav() {
  const nav = document.getElementById('j-nav');
  let html  = '';
  TABS.forEach((tb, i) => {
    if (i > 0) html += '<span class="nav-divider"></span>';
    const active = activeTab === tb.id ? ' active' : '';
    html += '<button class="nav-btn' + active + '" data-tab="' + tb.id + '">' + t(tb.lk) + '</button>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderNav();
      applyFilters();
    });
  });
}

function updateDispatch() {
  const visible = DATA.articles.filter(a => {
    if (!tabVisible(a.region || 'world')) return false;
    if (Math.round((a.relevance_score || 0) * 100) < minRel) return false;
    if ((a.corroboration || 1) < minCorr) return false;
    if (hideLow && a.low_signal) return false;
    return true;
  }).length;
  const tab = TABS.find(tb => tb.id === activeTab) || TABS[0];
  document.getElementById('j-dispatch').textContent =
    t(tab.bk) + ' — ' + visible + ' ' + (visible === 1 ? t('dispatch') : t('dispatches'));
}

  document.getElementById('j-briefing').style.display = '';
  const first = intro.charAt(0);
  const rest  = esc(intro.slice(1));
  document.getElementById('j-briefing-body').innerHTML =
    '<span class="drop-cap">' + esc(first) + '</span>' + rest;
}

function renderArticles() {

  DATA.articles.forEach((art, i) => {
    const relPct = Math.round((art.relevance_score || 0) * 100);
    const corr   = art.corroboration || 1;
    const cat    = art.category || 'Other';
    const origin = art.origin === 'feed' ? 'RSS' : 'Search';
    const age    = timeAgo(art.published_at);
    const low    = art.low_signal ? 'true' : 'false';
    const headline = lang === 'pt'
      ? (art.headline_pt || art.title)
      : (art.headline_en || art.title);
    const liner  = lang === 'pt'
      ? (art.one_liner_pt || art.one_liner_en || art.one_liner || art.title)
      : (art.one_liner_en || art.one_liner || art.title);

    const thumb = '<img class="art-thumb" src="' + esc(art.image_url || 'the_lighthouse2.png') + '" alt="" loading="lazy" onerror="imgError(this)">';

    const note = art.rationale
      ? '<div class="art-note">' + esc(art.rationale) + '</div>' : '';

    const corrMeta = corr > 1
      ? '<span class="meta-div"></span><span>' + corr + ' ' + t('sources') + '</span>' : '';

    const region = art.region || 'world';
    html +=
      '<div class="art-row' + (art.low_signal ? ' low-sig' : '') + '"' +
      ' data-region="' + esc(region) + '" data-rel="' + relPct + '" data-corr="' + corr + '" data-low="' + low + '">' +
      '<div class="art-thumb-col">' +
        '<div class="art-thumb-frame">' + thumb + '</div>' +
        '<div class="art-source-cap">' + esc(art.source_domain || '') + '</div>' +
      '</div>' +
      '<div class="art-content-col">' +
        '<div class="art-kicker-row">' +
          '<span>' + esc(cat) + '</span>' +
          '<span class="art-rank-no">No.&nbsp;' + (i + 1) + '</span>' +
        '</div>' +
        '<a class="art-headline" href="' + esc(art.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' onclick="trackClick(' + JSON.stringify(art.url) + ',' + JSON.stringify(art.source_domain) + ')">' +
          esc(headline) +
        '</a>' +
        '<div class="art-deck">' + esc(liner) + '</div>' +
        note +
        '<div class="art-meta">' +
          '<span>' + t('via') + ' ' + esc(origin) + '</span>' +
          '<span class="meta-div"></span>' +
          '<span class="rel-wrap">' + t('relevance') + ' ' +
            '<span class="rel-bg"><span class="rel-fill" style="width:' + relPct + '%"></span></span>' +
            relPct + '%' +
          '</span>' +
          corrMeta +
          '<span class="meta-div"></span>' +
          '<span>' + esc(age) + '</span>' +
        '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('j-list').innerHTML = html;
}

// ── Filters ──────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.art-row').forEach(row => {
    const ok =
      tabVisible(row.dataset.region) &&
      parseInt(row.dataset.rel)  >= minRel &&
      parseInt(row.dataset.corr) >= minCorr &&
      (!hideLow || row.dataset.low !== 'true');
    row.classList.toggle('hidden', !ok);
    if (ok) visible++;
  });
  document.getElementById('j-stats').textContent =
    t('showing') + ' ' + visible + ' ' + t('of') + ' ' + DATA.articles.length + ' ' + t('dispatches');
  updateDispatch();
}

// ── Click tracking ────────────────────────────────────────────────────
function trackClick(url, domain) {
  try {
    const key = 'tl_clicks';
    const clicks = JSON.parse(localStorage.getItem(key) || '[]');
    clicks.push({ url, domain, ts: new Date().toISOString() });
    if (clicks.length > 500) clicks.splice(0, clicks.length - 500);
    localStorage.setItem(key, JSON.stringify(clicks));
  } catch(_) {}
}

// ── Gen footer ───────────────────────────────────────────────────────
function updateGenFooter() {
  const genAt = DATA.generated_at ? new Date(DATA.generated_at).toLocaleString() : '';
  document.getElementById('j-gen-time').textContent =
    genAt ? t('generated') + ' ' + genAt + ' — The Lighthouse' : 'The Lighthouse';
}

// ── Init ─────────────────────────────────────────────────────────────
function init() {
  const maxCorr = Math.max(...DATA.articles.map(a => a.corroboration || 1), 1);
  document.getElementById('j-corr').max = maxCorr;

  renderMasthead();
  renderWeather();
  renderNav();
  renderBriefing();
  renderArticles();
  applyFilters();
  updateGenFooter();

  document.getElementById('j-rel').addEventListener('input', function() {
    minRel = parseInt(this.value);
    document.getElementById('j-rel-val').textContent = minRel + '%';
    applyFilters();
  });
  document.getElementById('j-corr').addEventListener('input', function() {
    minCorr = parseInt(this.value);
    document.getElementById('j-corr-val').textContent = minCorr;
    applyFilters();
  });
  document.getElementById('j-hide-low').addEventListener('change', function() {
    hideLow = this.checked;
    applyFilters();
  });
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
