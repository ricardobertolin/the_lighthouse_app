name: Daily digest

# Manual dispatch only. The Windows scheduled task owns the daily run for now:
# it has the API keys and the full dedup database, while a runner starts from
# whatever survives in the cache. On 2026-08-11 both fired, the (keyless) Actions
# run finished second, and it published a fallback digest over a good one.
# Re-enable the cron once the secrets are set and the DB seed is in place.
on:
  workflow_dispatch:
    inputs:
      skip_commit:
        description: "Build the digest but don't commit it"
        type: boolean
        default: false

permissions:
  contents: write

# Never let a manual run collide with the scheduled one — both write index.html
# and the article DB.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Without a key the pipeline degrades to fallback synthesis — untranslated
      # titles, every category "Other", every region "world" — and then commits
      # it. Fail before spending three minutes producing a page worse than the
      # one already published. Use skip_commit to build without a key on purpose.
      - name: Check secrets
        if: ${{ !inputs.skip_commit }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. A run without it would publish fallback synthesis over the live page. Set it with 'gh secret set ANTHROPIC_API_KEY', or dispatch with skip_commit=true to build without committing."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only wheel: the default torch pulls ~2 GB of CUDA libraries
          # that are useless on a runner with no GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      # The article DB is the dedup memory. Cache entries are immutable, so the
      # key carries the run id and restore-keys falls back to the newest match.
      # Worst case (cache evicted after 7 idle days) some already-seen articles
      # resurface once — the digest degrades, it does not break.
      - name: Restore article database
        uses: actions/cache/restore@v4
        with:
          path: digest.db
          key: digest-db-${{ github.run_id }}
          restore-keys: digest-db-

      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python -m digest --no-browser

      - name: Save article database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: digest.db
          key: digest-db-${{ github.run_id }}

      - name: Commit and push
        if: ${{ !inputs.skip_commit }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html unchanged — nothing to commit."
            exit 0
          fi
          git add index.html
          git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push

      - name: Upload digest as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: index.html
          retention-days: 7
