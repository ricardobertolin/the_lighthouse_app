  - "Brazil economy politics"
  - "climate change renewable energy"
  - "software engineering developer tools"
  - "geopolitics international relations"
  - "space exploration science"
  - "startup technology venture capital"

# Portuguese-language search topics (searched via GNews with lang=pt)
search_topics_pt:
  - "Curitiba Paraná"
  - "Curitiba notícias hoje"
  - "Paraná economia política"
  - "prefeitura Curitiba"
  - "Curitiba segurança trânsito"

interest_paragraph: >
  I am deeply interested in artificial intelligence, machine learning, and software engineering —
  especially developer tools, programming languages, and how the software industry is evolving.
  I follow global geopolitics and macroeconomics, with particular attention to Brazil and Latin
  America. I care about climate change, the energy transition, and sustainability. I enjoy science
  news including space exploration, biology, and physics. I also follow technology companies,
  startups, and the venture capital ecosystem. I read both Portuguese and English and want the
  best global stories regardless of language; regional Brazilian coverage is a bonus.

# Each topic is embedded separately and an article scores on its BEST match.
# A single vector averaged over all of these sits between them and is close to
# none — which is why raw relevance only spanned ~0.09 on average.
# Delete this list to fall back to sentence-splitting interest_paragraph.
interest_topics:
  - artificial intelligence, machine learning, and AI research
  - software engineering, developer tools, and programming languages
  - technology companies, startups, and venture capital
  - global geopolitics and international relations
  - macroeconomics, markets, and trade
  - Brazilian national politics and economy
  - Curitiba and Paraná regional news
  - climate change, the energy transition, and sustainability
  - space exploration and astronomy
  - science research in biology, physics, and medicine

# How far relevance is pulled toward the centroid of articles you actually
# clicked. 0 disables learning; 1 ignores the topics above entirely.
# Has no effect until clicks are imported (see --ingest-clicks).
click_weight: 0.30

# Cosine similarity above which two articles are treated as the same story,
# for the corroboration signal. Lower = more aggressive clustering.
corroboration_similarity: 0.72

