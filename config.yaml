weights:
  relevance: 0.50
  reputation: 0.30
  corroboration: 0.20

top_n: 20

gnews:
  max_daily_queries: 15
  rate_limit_seconds: 1.1

# Article text is only needed while a digest can still be re-rendered; dedup
# only ever reads url_hash. Without this the DB grew ~700 KB/day, 21 MB of the
# first 38 MB being summaries for articles that will never be shown again.
retention:
  keep_full_days: 30      # after this, strip title/summary but keep the hash
  delete_after_days: 365  # after this, drop the row entirely

# Browser to open the digest. Options:
#   "default"  — use the OS default browser
#   "brave"    — auto-detect Brave on Windows/macOS/Linux
#   "chrome"   — auto-detect Chrome
#   "firefox"  — auto-detect Firefox
#   any absolute path, e.g. "C:/Program Files/BraveSoftware/Brave-Browser/Application/brave.exe"
browser: brave
